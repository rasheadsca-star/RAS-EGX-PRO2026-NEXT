<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061421">
<title>EGX Pro V14.0 — التطبيق النهائي</title>
<style>
:root{color-scheme:dark;--bg:#04101b;--panel:#0a1c2d;--line:#28516d;--text:#eef8ff;--muted:#9cb8ca;--blue:#36bdf2;--green:#36d99a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.top{background:#071827;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:12px}.brand{min-width:250px}.brand b{display:block;font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.nav{display:flex;gap:7px;flex-wrap:wrap;flex:1}.tab{border:1px solid #386b8b;background:#102d46;color:var(--text);padding:8px 11px;border-radius:9px}.tab.active{background:#10628d;border-color:#39a0cf}.safe{font-size:10px;color:#c8ffe4;border:1px solid #2d8b65;border-radius:999px;padding:6px 9px}.frame-wrap{min-height:0;background:#02070b}.frame-wrap iframe{width:100%;height:100%;border:0;background:#04101b}
@media(max-width:850px){.top{align-items:flex-start;flex-direction:column}.brand{min-width:0}.nav{width:100%;display:grid;grid-template-columns:1fr 1fr}.tab{width:100%}.safe{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><b>EGX Pro V14.0 — التطبيق النهائي</b><small>قرار يومي + تقييم التوصيات السابقة + متابعة المحفظة</small></div>
  <nav class="nav">
    <button class="tab active" data-src="index.html">القرار اليومي وأفضل خمسة</button>
    <button class="tab" data-src="recommendation-history.html">متابعة التوصيات السابقة</button>
    <button class="tab" data-src="../../preview-v13/app/unified-decision-center.html">المحفظة والمتابعة التفصيلية</button>
  </nav>
  <div class="safe">لا توجد أوامر تلقائية للوسيط</div>
</header>
<div class="frame-wrap"><iframe id="appFrame" src="index.html" title="EGX Pro V14.0"></iframe></div>
</div>
<script>
'use strict';
const frame=document.getElementById('appFrame');
function cleanImportedNames(){
  try{
    const doc=frame.contentDocument;if(!doc?.body)return;
    const walker=doc.createTreeWalker(doc.body,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){
      const text=String(node.nodeValue||'');
      if(/AdSlot|Arab for Development and Real Estate Investment|Arab Development & Real Estate Investment/.test(text)){
        node.nodeValue=text.replace(/[^\n]*?(?:AdSlot|Arab for Development and Real Estate Investment|Arab Development & Real Estate Investment)[^\n]*/g,'العربية للتنمية والاستثمار العقاري');
      }
    }
  }catch(error){console.warn('Name cleanup skipped',error)}
}
frame.addEventListener('load',cleanImportedNames);
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));frame.src=button.dataset.src}));
</script>
</body>
</html>

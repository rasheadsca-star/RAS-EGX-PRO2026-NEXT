<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>EGX Pro Professional — RC2 Safe Shell</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071521}
    #rc2-app{display:block;width:100%;height:100%;border:0;background:#071521}
    #shell-error{position:fixed;inset:16px;z-index:10;display:none;align-items:center;justify-content:center;padding:24px;border:1px solid #8b692d;border-radius:16px;background:#2b2413;color:#ffe2a2;font:600 14px/1.8 system-ui,sans-serif;text-align:center}
  </style>
</head>
<body>
  <iframe id="rc2-app" title="EGX TFE V20 Fusion RC2" src="/core/"></iframe>
  <div id="shell-error" role="alert"></div>
  <script>
    (() => {
      const frame = document.getElementById('rc2-app');
      const errorBox = document.getElementById('shell-error');
      const showError = message => {
        errorBox.textContent = message;
        errorBox.style.display = 'flex';
      };
      frame.addEventListener('load', () => {
        try {
          const doc = frame.contentDocument;
          if (!doc || !doc.documentElement) {
            showError('تعذر فتح واجهة RC2 داخل الـSafe Shell.');
            return;
          }
          const text = (doc.body?.innerText || '').trim();
          if (/RC2_ORIGIN_PROTECTED|PROTECTION_BYPASS_REQUIRED/.test(text)) {
            showError('الـFrozen RC2 سليم، لكن Vercel Deployment Protection يمنع الـSafe Shell من الوصول إلى الـimmutable origin. فعّل Protection Bypass for Automation ثم أعد النشر.');
            return;
          }
          if (!doc.getElementById('rc2SnapshotDateFixScript')) {
            const script = doc.createElement('script');
            script.id = 'rc2SnapshotDateFixScript';
            script.type = 'module';
            script.src = '/snapshot-date-fix.js?v=20260828-safe2';
            doc.head.appendChild(script);
          }
          if (!doc.getElementById('rc2NextSessionLabelScript')) {
            const script = doc.createElement('script');
            script.id = 'rc2NextSessionLabelScript';
            script.type = 'module';
            script.src = '/next-session-label.js?v=20260906-next1';
            doc.head.appendChild(script);
          }
        } catch (error) {
          showError('تعذر حقن طبقة تصحيح التاريخ العرضية بدون المساس بمحرك RC2.');
        }
      });
    })();
  </script>
</body>
</html>

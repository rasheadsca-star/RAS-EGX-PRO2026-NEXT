<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EGX TFE — Astra Local Compatibility Surface</title>
<style>
body{margin:0;background:#071521;color:#eef6ff;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(980px,92vw);margin:42px auto}
.panel{background:#0c1e2c;border:1px solid #29455c;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#9ab0c0}
.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px 12px;border-radius:9px;border:1px solid #33546a;background:#081925;color:#fff}button{cursor:pointer}
.ok{color:#49da91}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="wrap">
<h1>EGX TFE — Astra Local Compatibility Surface</h1>
<p class="muted">TFE hard-gate execution and technical history are local-only during G12. No RC2 proxy or legacy Vercel origin is used.</p>
<section class="panel"><h2>Local engine health</h2><pre id="health">جارٍ التحقق…</pre></section>
<section class="panel"><h2>Local technical history</h2><div class="row"><input id="ticker" value="COMI" maxlength="12"><button id="load">تحميل التاريخ المحلي</button></div><pre id="history">—</pre></section>
<section class="panel"><strong>G12 shadow/isolation only — productionCutover=false</strong></section>
</main>
<script>
(async()=>{
 const health=document.getElementById('health'),out=document.getElementById('history'),ticker=document.getElementById('ticker');
 async function get(url,options){const r=await fetch(url,{cache:'no-store',...(options||{})});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||('HTTP '+r.status));return j}
 try{const h=await get('/api/index?route=health');health.textContent=JSON.stringify(h,null,2);health.className='ok'}catch(e){health.textContent='FAIL-CLOSED: '+e.message}
 document.getElementById('load').onclick=async()=>{try{const t=ticker.value.trim().toUpperCase();const h=await get('/api/index?route=history&ticker='+encodeURIComponent(t)+'&limit=260');const last=h.bars.at(-1);out.textContent=JSON.stringify({ticker:h.ticker,bars:h.bars.length,last},null,2)}catch(e){out.textContent='FAIL-CLOSED: '+e.message}};
})();
</script>
</body>
</html>

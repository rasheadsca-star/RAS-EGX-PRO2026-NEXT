<!doctype html><meta charset="utf-8"><title>GFX Smoke</title><pre id="out"></pre><script src="../engine/math.js"></script><script src="../engine/gann.js"></script><script src="../engine/indicators.js"></script><script src="../engine/fusion.js"></script><script>const out=[];function ok(x,m){out.push((x?'PASS ':'FAIL ')+m);if(!x)document.body.dataset.failed='1'}const bars=[];let p=10;for(let i=0;i<80;i++){p*=1+(i%7===0?.012:.002);bars.push({date:'S'+i,open:p*.995,high:p*1.01,low:p*.99,close:p,volume:1000+i*20})}const market=bars.map((b,i)=>({...b,close:10+i*.02,high:10.1+i*.02,low:9.9+i*.02}));const a=GFXFusion.analyze({ticker:'TEST',bars,marketBars:market,dataQuality:{fresh:true,conflict:false},fundamentals:{score:75}});ok(a.valid,'analysis returns valid result');ok(Number.isFinite(a.score),'fusion score is numeric');ok(a.parts&&a.parts.gannTime,'gann time exists');ok(a.plan&&a.plan.stopLoss<a.plan.target1,'risk plan has ordered levels');document.getElementById('out').textContent=out.join('\n');</script>

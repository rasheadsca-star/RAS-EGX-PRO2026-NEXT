<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>EGX GANN FUSION X</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">GX</div><div><strong>EGX GANN FUSION X</strong><span>محرك القرار المنشور بعد بوابة البيانات</span></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="summary">الخلاصة</button>
        <button class="nav-item" data-view="daily">أفضل فرص اليوم</button>
        <button class="nav-item" data-view="weekly">أفضل فرص الأسبوع</button>
        <button class="nav-item" data-view="gann">رادار جان الزمني</button>
        <button class="nav-item" data-view="breakout">رادار الاختراق</button>
        <button class="nav-item" data-view="accumulation">التجميع والفرص المبكرة</button>
        <button class="nav-item" data-view="avoid">تجنب المطاردة / الخروج</button>
        <button class="nav-item" data-view="market">تحليل السوق</button>
        <button class="nav-item" data-view="consensus">توافق Backend / UI</button>
        <button class="nav-item" data-view="history">Forward / Shadow</button>
        <button class="nav-item" data-view="backtest">الاختبار التاريخي</button>
        <button class="nav-item" data-view="quality">جودة البيانات</button>
        <button class="nav-item" data-view="methodology">المنهجية والمصطلحات</button>
      </nav>
      <div class="sidebar-foot">قراءة بحثية مشروطة — لا تنفيذ أوامر آلية. DATA_INCOMPLETE خارج الترتيب والتنفيذ.</div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
        <div><h1 id="viewTitle">الخلاصة</h1><div class="session-line"><span id="sessionBadge" class="badge neutral">جلسة القرار: —</span><span id="freshBadge" class="badge neutral">المصدر: جاري الفحص</span></div></div>
        <div class="top-actions"><input id="searchInput" class="search" placeholder="ابحث بأي كود من Active Universe..." /><button id="refreshBtn" class="primary">تحديث</button></div>
      </header>
      <section id="alertHost"></section>
      <section id="view" class="view"></section>
      <footer>Gann Fusion X · التوصيات المنشورة تخص READY universe فقط، وليست ادعاءً بأنها الأفضل في السوق كله.</footer>
    </main>
  </div>
  <dialog id="stockDialog"><button class="dialog-close" id="dialogClose">×</button><div id="stockDialogBody"></div></dialog>
  <script src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>EGX GANN FUSION X</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">GX</div><div><strong>EGX GANN FUSION X</strong><span>محرك التوقيت والقرار البحثي</span></div></div>
      <nav id="nav">
        <button class="nav-item active" data-view="summary">الخلاصة</button>
        <button class="nav-item" data-view="daily">أفضل فرص اليوم</button>
        <button class="nav-item" data-view="weekly">أفضل فرص الأسبوع</button>
        <button class="nav-item" data-view="gann">رادار جان الزمني</button>
        <button class="nav-item" data-view="breakout">رادار الاختراق</button>
        <button class="nav-item" data-view="accumulation">التجميع والفرص المبكرة</button>
        <button class="nav-item" data-view="avoid">تجنب المطاردة / الخروج</button>
        <button class="nav-item" data-view="market">تحليل السوق</button>
        <button class="nav-item" data-view="consensus">توافق المحركات</button>
        <button class="nav-item" data-view="history">سجل الإشارات</button>
        <button class="nav-item" data-view="backtest">الاختبار التاريخي</button>
        <button class="nav-item" data-view="quality">جودة البيانات</button>
        <button class="nav-item" data-view="methodology">المنهجية والمصطلحات</button>
      </nav>
      <div class="sidebar-foot">قراءة تحليلية فقط — لا تنفيذ أوامر آلية</div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
        <div><h1 id="viewTitle">الخلاصة</h1><div class="session-line"><span id="sessionBadge" class="badge neutral">الجلسة: —</span><span id="freshBadge" class="badge neutral">البيانات: جاري الفحص</span></div></div>
        <div class="top-actions"><input id="searchInput" class="search" placeholder="ابحث بكود السهم..." /><button id="refreshBtn" class="primary">تحديث</button></div>
      </header>
      <section id="alertHost"></section>
      <section id="view" class="view"></section>
      <footer>Gann Fusion X V1 · التوصيفات المعروضة إشارات بحثية وليست ضمانًا للنتائج المستقبلية.</footer>
    </main>
  </div>
  <dialog id="stockDialog"><button class="dialog-close" id="dialogClose">×</button><div id="stockDialogBody"></div></dialog>
  <script src="../engine/math.js"></script>
  <script src="../engine/gann.js"></script>
  <script src="../engine/indicators.js"></script>
  <script src="../engine/fusion.js"></script>
  <script src="../engine/legacy-adapter.js"></script>
  <script src="../review/acceptance.js"></script>
  <script src="../review/backtest.js"></script>
  <script src="./app.js"></script>
</body>
</html>

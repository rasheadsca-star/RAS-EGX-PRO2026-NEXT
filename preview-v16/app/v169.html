<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>EGX Pro V16.9.1</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071521;color:#ecf8ff;font-family:Tahoma,Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    .loader{max-width:560px;background:#0b2031;border:1px solid #2d5872;border-radius:18px;padding:28px}
    p{color:#9fb9c9;line-height:1.8}
  </style>
</head>
<body>
  <main class="loader">
    <h2>جارٍ تحميل محرك V16.9…</h2>
    <p>يتم ربط التطبيق بملف التوصيات المعزول حتى لا تستبدله المحركات القديمة.</p>
  </main>
  <script>
  (async()=>{
    const response=await fetch(`index.html?source=v16.9.1&t=${Date.now()}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    const marker='<script src="app.js?v=16.1.0"><\\/script>';
    const replacement='<script src="decision-source.js?v=16.9.1"><\\/script><script src="app.js?v=16.9.1"><\\/script>';
    html=html.replace(marker,replacement)
      .replaceAll('V16.1','V16.9.1')
      .replaceAll('v=16.1.0','v=16.9.1');
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    document.body.innerHTML=`<main class="loader"><h2>تعذر تحميل التطبيق</h2><p>${String(error.message||error)}</p><p><a style="color:#8ed8ff" href="../../">العودة وإعادة المحاولة</a></p></main>`;
  });
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MAIN APP — EGX Pro V16.9.2</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071521;color:#ecf8ff;font-family:Tahoma,Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    .loader{max-width:620px;background:#0b2031;border:1px solid #2d5872;border-radius:18px;padding:28px}
    p{color:#9fb9c9;line-height:1.8}
  </style>
</head>
<body>
  <main class="loader">
    <h2>جارٍ تحميل MAIN APP…</h2>
    <p>تحميل التوصيات والمقارنة ومحلل السهم الذكي والشارت الفني وProfessional Readiness V2.</p>
  </main>
  <script>
  (async()=>{
    const BUILD='16.9.2-main-app-readiness-v2-hard-mount-20260817-2250';
    const response=await fetch(`index.html?source=main-app-v16.9.2-canonical&t=${Date.now()}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();

    // Hard-mount Professional Readiness V2 before app.js runs. The legacy V1
    // panel remains only as a hidden compatibility target for the old app.js;
    // it can no longer become visible or show the obsolete 42 score.
    const readinessMarker='<article class="panel readiness-panel">';
    if(!html.includes(readinessMarker))throw new Error('تعذر تثبيت Professional Readiness V2: readiness marker missing');
    const readinessV2=`<article id="professionalReadinessV2Panel" class="panel">
      <div class="prv2-head">
        <div><h2>الجاهزية المهنية — Professional Readiness V2</h2><p>تقيس جودة الأدلة والحوكمة لمحرك V16.9 الحالي، وليست احتمال نجاح التوصية القادمة.</p></div>
        <span id="professionalReadinessV2Stage">جارٍ التقييم</span>
      </div>
      <div class="prv2-main">
        <div id="professionalReadinessV2Gauge"><div><strong>—</strong><span>من 100</span></div></div>
        <div id="professionalReadinessV2Breakdown"></div>
      </div>
      <div id="professionalReadinessV2Meta"></div>
      <div id="professionalReadinessV2Verdict"></div>
      <div id="professionalReadinessV2Gaps"></div>
    </article>`;
    html=html.replace(readinessMarker,`${readinessV2}<article class="panel readiness-panel" style="display:none!important" aria-hidden="true">`);

    const marker='<script src="app.js?v=16.1.0"><\/script>';
    const replacement=`<script src="decision-source.js?v=${BUILD}"><\/script><script src="app.js?v=${BUILD}"><\/script><script src="v16-9-basket-overlay.js?v=${BUILD}" data-main-app-basket-direct="true"><\/script><script src="main-app-governance-overlay.js?v=${BUILD}"><\/script><script src="main-app-consensus-overlay.js?v=${BUILD}"><\/script><script src="main-app-professional-readiness-v2.js?v=${BUILD}"><\/script><script src="stock-analyzer.js?v=${BUILD}"><\/script><script src="stock-analyzer-chart.js?v=${BUILD}"><\/script><script src="stock-analyzer-decision.js?v=${BUILD}"><\/script>`;
    if(!html.includes(marker))throw new Error('تعذر تثبيت طبقات MAIN APP: app.js marker missing');
    html=html.replace(marker,replacement)
      .replaceAll('V16.1','MAIN APP · V16.9.2')
      .replaceAll('v=16.1.0',`v=${BUILD}`);
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    document.body.innerHTML=`<main class="loader"><h2>تعذر تحميل MAIN APP</h2><p>${String(error.message||error)}</p><p><a style="color:#8ed8ff" href="../../">العودة وإعادة المحاولة</a></p></main>`;
  });
  </script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>MAIN APP — EGX Pro V16.9.2</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071521;color:#ecf8ff;font-family:Tahoma,Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    .loader{max-width:560px;background:#0b2031;border:1px solid #2d5872;border-radius:18px;padding:28px}
    p{color:#9fb9c9;line-height:1.8}
  </style>
</head>
<body>
  <main class="loader">
    <h2>جارٍ تحميل MAIN APP…</h2>
    <p>محرك V16.9.2 مثبت منهجيًا. طبقة P3 تعرض تأكيد المحركات المستقلة منهجيًا بجوار السلة دون تغيير الاختيار أو الترتيب أو قواعد التنفيذ.</p>
  </main>
  <script>
  (async()=>{
    const BUILD='16.9.2-p3-method-independent-consensus-20260816';
    const response=await fetch(`index.html?source=main-app-v16.9.2-p3&t=${Date.now()}`,{cache:'no-store'});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    let html=await response.text();
    const marker='<script src="app.js?v=16.1.0"><\/script>';
    const replacement=`<script src="decision-source.js?v=${BUILD}"><\/script><script src="app.js?v=${BUILD}"><\/script><script src="v16-9-basket-overlay.js?v=${BUILD}" data-main-app-basket-direct="true"><\/script><script src="main-app-consensus-overlay.js?v=${BUILD}"><\/script>`;
    html=html.replace(marker,replacement)
      .replaceAll('V16.1','MAIN APP · V16.9.2')
      .replaceAll('v=16.1.0',`v=${BUILD}`);
    document.open();
    document.write(html);
    document.close();
  })().catch(error=>{
    document.body.innerHTML=`<main class="loader"><h2>تعذر تحميل MAIN APP</h2><p>${String(error.message||error)}</p><p><a style="color:#8ed8ff" href="../../">العودة وإعادة المحاولة</a></p></main>`;
  });
  </script>
</body>
</html>

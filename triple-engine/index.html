<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EGX Triple Engine — Research Consensus</title><style>
:root{color-scheme:dark;--bg:#07131d;--panel:#0d2230;--line:#21465b;--txt:#f2fbff;--muted:#9cb6c5;--good:#37d7a0;--warn:#ffc85e;--bad:#ff7888;--blue:#56c6ff;--soft:#102a39}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06131d,#091c28);color:var(--txt);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1380px;margin:auto;padding:20px}.top,.card,.hero,.tomorrow,.planbox{border:1px solid var(--line);background:rgba(13,34,48,.95);border-radius:18px}.top{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:7px;line-height:1.7}.pill{display:inline-block;border:1px solid #32617a;border-radius:999px;padding:7px 11px;font-weight:700}.pill.good{color:var(--good);border-color:#247b61}.pill.bad{color:var(--bad);border-color:#7d3944}.pill.warn{color:var(--warn);border-color:#806126}.hero{margin-top:15px;padding:18px}.tomorrow{margin-top:15px;padding:20px;border-color:#806126;background:linear-gradient(135deg,#13291f,#102331)}.tomorrow h2{margin:0 0 12px;font-size:23px}.pick{display:grid;grid-template-columns:.8fr 1.5fr;gap:18px;align-items:start}.pick-main{font-size:42px;font-weight:900;direction:ltr;text-align:right}.pick-note{line-height:1.9;color:#d7e8ef}.engine-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.engine-tag{padding:7px 10px;border-radius:10px;background:#0a1b27;border:1px solid #21465b;font-size:13px}.action-banner{margin:14px 0;padding:14px 16px;border-radius:14px;border:1px solid #806126;background:#241e0d;color:#ffe5a0;font-weight:900;font-size:18px}.planbox{margin-top:16px;padding:16px;background:#091c28}.planbox h3{margin:0 0 12px}.plan-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--soft);border:1px solid #20485c;border-radius:13px;padding:12px}.metric small{display:block;color:var(--muted);margin-bottom:6px}.metric b{font-size:20px;direction:ltr;display:block;text-align:right}.metric.trigger{border-color:#9b762a}.metric.stop{border-color:#7d3944}.metric.target{border-color:#247b61}.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.rule{background:#0b1d28;border:1px solid #1d4255;border-radius:13px;padding:13px;line-height:1.8}.rule strong{display:block;margin-bottom:5px}.rule.entry strong{color:var(--warn)}.rule.exit strong{color:var(--bad)}.source-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#07151e;color:var(--muted);font-size:13px}.execution{margin:14px 0;border:2px solid #2c7595;border-radius:16px;overflow:hidden;background:#071923}.execution-title{padding:12px 15px;background:#0f3447;font-size:19px;font-weight:900}.execution-now{padding:15px;font-size:21px;font-weight:900;border-bottom:1px solid #245166}.execution-now.wait{color:#ffe5a0;background:#241e0d}.execution-now.go{color:#c9ffe9;background:#0d3026}.execution-now.stopnow{color:#ffd0d6;background:#32151a}.execution-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.exec-step{padding:15px;border-inline-start:1px solid #21465b;min-height:115px}.exec-step:first-child{border-inline-start:0}.exec-step small{display:block;color:var(--muted);margin-bottom:7px}.exec-step b{display:block;font-size:22px;line-height:1.5}.exec-step .detail{margin-top:6px;color:#c7dce6;line-height:1.6;font-size:14px}.exec-step.entry{background:#10281f}.exec-step.stop{background:#2a171b}.exec-step.targets{background:#0b2523}.simple-rule{margin-top:12px;padding:13px 15px;border-radius:13px;background:#0c202b;border:1px solid #2e6078;line-height:1.8}.simple-rule b{color:#fff}.structural-note{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card{padding:15px}.card small{color:var(--muted);display:block;margin-bottom:8px}.card b{font-size:22px}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.source{padding:15px}.source h3{margin:0 0 10px}.source p{margin:5px 0;color:var(--muted)}.table{margin-top:15px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}table{border-collapse:collapse;width:100%}th,td{padding:12px;border-bottom:1px solid #173749;text-align:right}th{background:#0b1b27;color:#bad3df}.c3{color:var(--good);font-weight:900}.c2{color:var(--warn);font-weight:900}.c1{color:var(--muted)}.empty{padding:30px;text-align:center;color:var(--muted)}button{background:#15506b;border:1px solid #2c7595;color:white;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:700}@media(max-width:980px){.execution-steps{grid-template-columns:1fr}.exec-step{border-inline-start:0;border-top:1px solid #21465b}.exec-step:first-child{border-top:0}.plan-grid{grid-template-columns:repeat(2,1fr)}.rules{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.sources,.pick{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table{overflow:auto}table{min-width:900px}}@media(max-width:520px){.plan-grid,.grid{grid-template-columns:1fr 1fr}.pick-main{font-size:36px}.wrap{padding:12px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>EGX Triple Engine Consensus</h1><div class="sub">SEPA‑X + EGX Pro V16.9 + GANN Fusion X · Research / Shadow Only</div></div><button id="reload">تحديث</button></header><section class="hero" id="hero">جارٍ تحميل التشغيل الموحد…</section><section class="tomorrow" id="tomorrow"><div class="sub">جارٍ تحديد توصية جلسة التداول التالية…</div></section><section class="grid" id="stats"></section><section class="sources" id="sources"></section><section class="table"><table><thead><tr><th>السهم</th><th>Consensus</th><th>خطة سعرية</th><th>SEPA‑X</th><th>V16.9</th><th>GANN</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
'use strict';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nextEgxSession(s){if(!s)return '—';const d=new Date(s+'T12:00:00Z');do{d.setUTCDate(d.getUTCDate()+1)}while([5,6].includes(d.getUTCDay()));return d.toISOString().slice(0,10)}
function arDate(s){if(!s||s==='—')return '—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function engineText(e){return e?.present?`${esc(e.decision)}${e.score!=null?` · ${esc(e.score)}`:''}`:'NO SIGNAL'}
function px(v){if(v===null||v===undefined||v==='')return '—';const n=Number(v);if(!Number.isFinite(n))return '—';return n<1?n.toFixed(4):n<10?n.toFixed(3):n.toFixed(2)}
function pct(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'%'}
function rr(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'R'}
function planSource(p){return p?.source==='GANN_FUSION_X'?'GANN Fusion X':p?.source==='V16_9'?'EGX Pro V16.9':p?.source==='SEPA_X'?'SEPA-X':'—'}
function planHtml(p,consensus){
  if(!p)return `<div class="planbox"><h3>خطة الدخول</h3><div class="action-banner">لا تدخل — لا توجد خطة سعرية مكتملة من محركات التوافق.</div><div class="sub">يظل السهم للمراقبة فقط حتى يصدر أحد المحركات نطاق دخول ووقفًا وأهدافًا قابلة للتحقق.</div></div>`;
  const full=p.completeness==='FULL';
  const conditional=consensus!=='3/3';
  const current=Number(p.currentPrice),trigger=Number(p.trigger),noChase=Number(p.noChaseAbove);
  const executionLow=p.executionEntryLow!=null?p.executionEntryLow:(p.trigger!=null&&p.entryLow!=null?Math.max(Number(p.trigger),Number(p.entryLow)):p.entryLow);
  const executionHigh=p.executionEntryHigh!=null?p.executionEntryHigh:p.entryHigh;
  const hasTrigger=Number.isFinite(trigger);
  const belowTrigger=Number.isFinite(current)&&hasTrigger&&current<=trigger;
  const aboveChase=Number.isFinite(current)&&Number.isFinite(noChase)&&current>noChase;
  const state=aboveChase?'stopnow':belowTrigger?'wait':'go';
  const stateText=aboveChase?`لا تدخل — السعر أعلى من حد المطاردة ${px(p.noChaseAbove)}`:belowTrigger?`انتظر — السعر المرجعي ${px(p.currentPrice)} ما زال أقل من Trigger ${px(p.trigger)}`:`منطقة التفعيل — لا تدخل إلا مع تحقق شرط السيولة`;
  const volumeMin=p.activationConditions?.volumeRatio20Min??(p.source==='GANN_FUSION_X'?1.2:null);
  const priceRule=p.activationConditions?.priceRuleAr||(hasTrigger?`اختراق وثبات أعلى من ${px(p.trigger)}`:'تحقق شرط السعر');
  const volumeRule=p.activationConditions?.volumeRuleAr||(volumeMin!=null?`حجم التداول الحالي ≥ ${Number(volumeMin).toFixed(2)}× متوسط أحجام التداول للـ20 جلسة السابقة`:'سيولة داعمة حسب المحرك');
  const entryRange=executionLow!=null&&executionHigh!=null?`${px(executionLow)} – ${px(executionHigh)}`:p.entryLow!=null&&p.entryHigh!=null?`${px(p.entryLow)} – ${px(p.entryHigh)}`:'بعد Trigger فقط';
  const rules=(p.entryPlan||[]).slice(0,4).map(x=>`<div>• ${esc(x)}</div>`).join('')||`<div>• ${esc(p.activationRule||'انتظر تحقق شرط التفعيل.')}</div>`;
  const exits=(p.exitPlan||[]).slice(0,4).map(x=>`<div>• ${esc(x)}</div>`).join('')||'<div>• لا توجد تعليمات خروج كاملة من هذا المصدر.</div>';
  return `<div class="planbox"><h3>خطة الصفقة — ${esc(planSource(p))}</h3><div class="execution"><div class="execution-title">نفّذها بهذه الصورة</div><div class="execution-now ${state}">القرار الآن: ${esc(stateText)}</div><div class="execution-steps"><div class="exec-step entry"><small>1 — شرط الدخول</small><b>${esc(priceRule)}</b><div class="detail">+ ${esc(volumeRule)}</div><div class="detail">لا يكفي لمس Trigger فقط؛ الشرطان السعري والسيولة مطلوبان.</div></div><div class="exec-step entry"><small>2 — أدخل عند كام؟</small><b>${entryRange}</b><div class="detail">الدخول الأول 60% بعد التفعيل. لا شراء أولي تحت Trigger.</div><div class="detail">لا تطارد أعلى من ${px(p.noChaseAbove)}.</div></div><div class="exec-step stop"><small>3 — وقف الخسارة</small><b>${px(p.stopLoss)}</b><div class="detail">إذا ضُرب الوقف تخرج؛ لا توسّع الوقف.</div></div><div class="exec-step targets"><small>4 — الأهداف</small><b>T1 ${px(p.target1)} · T2 ${px(p.target2)} · T3 ${px(p.target3)}</b><div class="detail">R/R: ${rr(p.rr1)} · ${rr(p.rr2)} · ${rr(p.rr3)}</div></div><div class="exec-step"><small>5 — إلغاء الصفقة</small><b>أقل من Trigger قبل التفعيل أو مطاردة فوق ${px(p.noChaseAbove)}</b><div class="detail">Time Stop: ${p.timeStopSessions||'—'} جلسات بدون Follow-through.</div></div><div class="exec-step"><small>6 — المدة</small><b>${esc(p.horizon||'—')}</b><div class="detail">السعر المرجعي الحالي ${px(p.currentPrice)}.</div></div></div></div><div class="simple-rule"><b>الخلاصة:</b> لا شراء الآن إذا كان السعر تحت ${px(p.trigger)}. أول دخول فقط بعد اختراق/ثبات أعلى ${px(p.trigger)} مع حجم تداول لا يقل عن ${volumeMin!=null?Number(volumeMin).toFixed(2)+'×':'المستوى المطلوب'} متوسط 20 جلسة، وفي نطاق ${entryRange}.</div>${p.structuralRetestLow!=null?`<div class="structural-note">تنبيه: ${px(p.structuralRetestLow)} هو حد هيكلي/إعادة اختبار داخل خطة GANN، وليس سعر شراء أولي قبل Trigger.</div>`:''}<div class="plan-grid"><div class="metric"><small>السعر المرجعي</small><b>${px(p.currentPrice)}</b></div><div class="metric trigger"><small>Trigger</small><b>${px(p.trigger)}</b></div><div class="metric"><small>الدخول التنفيذي</small><b>${entryRange}</b></div><div class="metric"><small>لا تطارد أعلى من</small><b>${px(p.noChaseAbove)}</b></div><div class="metric stop"><small>وقف الخسارة</small><b>${px(p.stopLoss)}</b></div><div class="metric target"><small>الهدف 1</small><b>${px(p.target1)}</b></div><div class="metric target"><small>الهدف 2</small><b>${px(p.target2)}</b></div><div class="metric target"><small>الهدف 3</small><b>${px(p.target3)}</b></div></div><div class="rules"><div class="rule entry"><strong>تفاصيل الدخول</strong>${rules}</div><div class="rule exit"><strong>تفاصيل الخروج</strong>${exits}${p.timeStopSessions?`<div>• Time Stop بعد ${esc(p.timeStopSessions)} جلسات إذا لم يظهر Follow-through.</div>`:''}</div></div><div class="source-note">${full?'الخطة السعرية كاملة ومأخوذة مباشرة من Planner الحالي؛ لا يتم اختراع مستويات ناقصة.':'هذه الخطة جزئية من المصدر؛ أي مستوى غير موجود يظهر — بدل تقديره.'} · ${conditional?'Consensus غير كامل؛ دخول مشروط فقط.':'Consensus كامل.'} · Research / Shadow فقط.</div></div>`
}
function tomorrowCard(d){const next=nextEgxSession(d.marketSession);if(!d.allSourcesFresh)return `<h2>توصية جلسة التداول التالية</h2><span class="pill bad">محجوبة</span><div class="pick-note">أحد المحركات غير متزامن مع جلسة السوق؛ لا توجد توصية موحدة حتى اكتمال التحديث.</div>`;const p=(d.threeOfThree||[])[0]||(d.twoOfThree||[])[0]||null;if(!p)return `<h2>توصية جلسة ${arDate(next)}</h2><span class="pill bad">لا توجد توصية توافقية</span><div class="pick-note">لا يوجد سهم حاصل حتى على توافق 2/3 بعد تطبيق Data Readiness.</div>`;const full=p.consensus==='3/3',e=p.engines||{};const note=full?'توافق كامل بين المحركات الثلاثة.':'أفضل توافق حالي 2/3 فقط؛ لذلك السهم مراقبة/دخول مشروط وليس أمر شراء.';return `<div class="pick"><div><h2>توصية جلسة ${arDate(next)}</h2><div class="pick-main">${esc(p.ticker)}</div><div style="margin-top:8px"><span class="pill ${full?'good':'warn'}">Consensus ${esc(p.consensus)}</span></div></div><div class="pick-note"><b>${note}</b><div class="engine-line"><span class="engine-tag">SEPA‑X: ${engineText(e.SEPA_X)}</span><span class="engine-tag">V16.9: ${engineText(e.V16_9)}</span><span class="engine-tag">GANN: ${engineText(e.GANN_FUSION_X)}</span></div></div></div>${planHtml(p.consensusPlan,p.consensus)}`}
async function load(){try{const r=await fetch('./data/current.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const ok=d.allSourcesFresh===true;const cls=ok?'good':'bad';$('hero').innerHTML=`<span class="pill ${cls}">${ok?'SAME SESSION READY':'CONSENSUS BLOCKED'}</span> <b>جلسة السوق ${esc(d.marketSession||'—')}</b><div class="sub">${ok?'الثلاثة على نفس الجلسة؛ أي دخول يظل مشروطًا بخطة السعر وليس بمجرد ظهور السهم.':'يوجد مصدر قديم أو غير متزامن؛ لا يتم إصدار توصية توافقية.'}</div>`;$('tomorrow').innerHTML=tomorrowCard(d);const q=d.dataReadiness||{};$('stats').innerHTML=[["إجمالي السوق",q.total],["READY",q.ready],["QUARANTINED",q.quarantined],["3/3",d.threeOfThree?.length||0]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]??'—'}</b></div>`).join('');const labels={V16_9:'EGX Pro V16.9',SEPA_X:'SEPA-X',GANN_FUSION_X:'GANN Fusion X'};$('sources').innerHTML=Object.entries(d.sources||{}).map(([k,s])=>`<div class="card source"><h3>${labels[k]||k}</h3><span class="pill ${s.fresh?'good':'bad'}">${s.fresh?'FRESH':'STALE'}</span><p>Session: ${esc(s.session||'—')}</p><p>Signals after readiness: <b>${s.signalsAfterReadiness??0}</b></p></div>`).join('');const rows=d.rows||[];$('rows').innerHTML=rows.length?rows.map(x=>{const cls=x.consensus==='3/3'?'c3':x.consensus==='2/3'?'c2':'c1';const e=x.engines||{};const cell=n=>e[n]?.present?`${esc(e[n].decision)}${e[n].score!=null?` · ${esc(e[n].score)}`:''}`:'—';const p=x.consensusPlan;const el=p?.executionEntryLow??(p?.trigger!=null&&p?.entryLow!=null?Math.max(Number(p.trigger),Number(p.entryLow)):p?.entryLow),eh=p?.executionEntryHigh??p?.entryHigh;const er=p&&el!=null&&eh!=null?`${px(el)}–${px(eh)}`:'—';const plan=p?`دخول ${er} · SL ${px(p.stopLoss)} · T1 ${px(p.target1)} · T2 ${px(p.target2)} · T3 ${px(p.target3)}`:'—';return`<tr><td><b>${esc(x.ticker)}</b></td><td class="${cls}">${esc(x.consensus)}</td><td>${plan}</td><td>${cell('SEPA_X')}</td><td>${cell('V16_9')}</td><td>${cell('GANN_FUSION_X')}</td></tr>`}).join(''):`<tr><td colspan="6" class="empty">لا يوجد تداخل بين المحركات بعد تطبيق الجاهزية المشتركة.</td></tr>`}catch(e){$('hero').innerHTML=`<span class="pill bad">RUN REQUIRED</span><div class="sub">تعذر تحميل نتيجة التشغيل الموحد: ${esc(e.message)}</div>`;$('tomorrow').innerHTML='<h2>توصية جلسة التداول التالية</h2><span class="pill bad">غير متاحة</span>';$('rows').innerHTML='<tr><td colspan="6" class="empty">يجب تشغيل Build/CI أولًا.</td></tr>'}}$('reload').onclick=load;load();setInterval(load,120000);
</script></body></html>

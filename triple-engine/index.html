<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store">
<title>EGX Triple Engine — Research Consensus</title>
<style>
:root{color-scheme:dark;--bg:#07131d;--panel:#0d2230;--line:#21465b;--txt:#f2fbff;--muted:#9cb6c5;--good:#37d7a0;--warn:#ffc85e;--bad:#ff7888;--blue:#56c6ff;--soft:#102a39}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06131d,#091c28);color:var(--txt);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1380px;margin:auto;padding:20px}.top,.hero,.tomorrow,.card,.stock-card{border:1px solid var(--line);background:rgba(13,34,48,.96);border-radius:18px}.top{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:7px;line-height:1.7}.pill{display:inline-block;border:1px solid #32617a;border-radius:999px;padding:7px 11px;font-weight:800}.good{color:var(--good);border-color:#247b61}.warn{color:var(--warn);border-color:#806126}.bad{color:var(--bad);border-color:#7d3944}.hero,.tomorrow{margin-top:15px;padding:18px}.tomorrow{border-color:#806126;background:linear-gradient(135deg,#13291f,#102331)}.pick{display:grid;grid-template-columns:.75fr 1.55fr;gap:18px}.pick-main{font-size:43px;font-weight:900;direction:ltr;text-align:right}.engine-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.engine-tag{padding:7px 10px;border-radius:10px;background:#0a1b27;border:1px solid #21465b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card{padding:15px}.card small{display:block;color:var(--muted);margin-bottom:7px}.card b{font-size:22px}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.section-title{margin:24px 0 10px;font-size:24px}.section-note{color:var(--muted);margin-bottom:14px;line-height:1.7}.stock-list{display:grid;gap:16px}.stock-card{overflow:hidden}.stock-head{padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#0a1b27;border-bottom:1px solid var(--line)}.ticker{font-size:30px;font-weight:900;direction:ltr}.stock-state{padding:14px 16px;font-size:18px;font-weight:900}.state-wait{background:#241e0d;color:#ffe5a0}.state-go{background:#0d3026;color:#c9ffe9}.state-no{background:#32151a;color:#ffd0d6}.trade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}.trade-box{background:var(--soft);border:1px solid #20485c;border-radius:13px;padding:12px;min-height:92px}.trade-box small{display:block;color:var(--muted);margin-bottom:6px}.trade-box b{display:block;font-size:19px;line-height:1.55}.trade-box.entry{border-color:#9b762a}.trade-box.stop{border-color:#7d3944}.trade-box.target{border-color:#247b61}.condition{margin:0 14px 14px;padding:14px;border:1px solid #2e6078;border-radius:13px;background:#0c202b;line-height:1.9}.condition strong{color:#fff}.engines{margin:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}.source-note{margin:0 14px 14px;color:var(--muted);font-size:13px;line-height:1.7}.best-plan{margin-top:15px;border:2px solid #2c7595;border-radius:16px;overflow:hidden}.best-title{padding:11px 14px;background:#0f3447;font-weight:900;font-size:18px}.best-grid{display:grid;grid-template-columns:repeat(4,1fr)}.best-grid div{padding:12px;border-inline-start:1px solid #21465b}.best-grid div:first-child{border:0}.best-grid small{color:var(--muted);display:block;margin-bottom:5px}.best-grid b{font-size:20px}.empty{padding:30px;text-align:center;color:var(--muted)}button{background:#15506b;border:1px solid #2c7595;color:white;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:700}@media(max-width:980px){.grid,.trade-grid,.best-grid{grid-template-columns:repeat(2,1fr)}.sources,.pick{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.stock-head{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.wrap{padding:12px}.grid,.trade-grid,.best-grid{grid-template-columns:1fr}.pick-main{font-size:38px}.ticker{font-size:27px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><h1>EGX Triple Engine Consensus</h1><div class="sub">SEPA‑X + EGX Pro V16.9 + GANN Fusion X · Research / Shadow Only</div></div><button id="reload">تحديث</button></header>
<section class="hero" id="hero">جارٍ تحميل التشغيل الموحد…</section>
<section class="tomorrow" id="tomorrow">جارٍ تحديد التوصية…</section>
<section class="grid" id="stats"></section><section class="sources" id="sources"></section>
<h2 class="section-title">خطة الدخول لكل سهم</h2><div class="section-note">كل سهم يعرض شرط الدخول ونطاق التنفيذ والوقف والأهداف. إذا كانت الخطة ناقصة، يظهر السهم للمراقبة فقط ولا يتم اختراع مستويات.</div>
<section class="stock-list" id="stocks"></section>
</main>
<script>
'use strict';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nextEgxSession(s){if(!s)return'—';const d=new Date(s+'T12:00:00Z');do{d.setUTCDate(d.getUTCDate()+1)}while([5,6].includes(d.getUTCDay()));return d.toISOString().slice(0,10)}
function arDate(s){if(!s||s==='—')return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`}
function px(v){if(v===null||v===undefined||v==='')return'—';const n=Number(v);if(!Number.isFinite(n))return'—';return n<1?n.toFixed(4):n<10?n.toFixed(3):n.toFixed(2)}
function rr(v){return v===null||v===undefined||!Number.isFinite(Number(v))?'—':Number(v).toFixed(2)+'R'}
function engineText(e){return e?.present?`${esc(e.decision)}${e.score!=null?` · ${esc(e.score)}`:''}`:'NO SIGNAL'}
function planSource(p){return p?.source==='GANN_FUSION_X'?'GANN Fusion X':p?.source==='V16_9'?'EGX Pro V16.9':p?.source==='SEPA_X'?'SEPA-X':'—'}
function execPlan(p){
 if(!p)return{executable:false,state:'no',stateText:'مراقبة فقط — لا توجد خطة سعرية قابلة للتنفيذ',condition:'لا دخول حتى يصدر نطاق دخول + وقف خسارة + هدف واحد على الأقل.',entry:'—',stop:'—',t1:'—',t2:'—',t3:'—',chase:'—',horizon:'—',current:'—',rr:'—'};
 const cur=Number(p.currentPrice),tr=Number(p.trigger),nc=Number(p.noChaseAbove),hasTr=Number.isFinite(tr);
 const low=p.executionEntryLow!=null?Number(p.executionEntryLow):(hasTr&&p.entryLow!=null?Math.max(tr,Number(p.entryLow)):Number(p.entryLow));
 const high=p.executionEntryHigh!=null?Number(p.executionEntryHigh):Number(p.entryHigh);
 const hasEntry=Number.isFinite(low)&&Number.isFinite(high),hasStop=Number.isFinite(Number(p.stopLoss)),hasT1=Number.isFinite(Number(p.target1));
 const executable=hasEntry&&hasStop&&hasT1;
 const vol=p.activationConditions?.volumeRatio20Min??(p.source==='GANN_FUSION_X'?1.2:null);
 const priceRule=p.activationConditions?.priceRuleAr||(hasTr?`اختراق وثبات أعلى ${px(tr)}`:(p.activationRule||'تأكيد الافتتاح داخل نطاق الدخول'));
 const volumeRule=p.activationConditions?.volumeRuleAr||(vol!=null?`وحجم تداول ≥ ${Number(vol).toFixed(2)}× متوسط 20 جلسة`:'مع تأكيد السيولة/الافتتاح حسب المحرك');
 let state='wait',stateText='انتظر تحقق شرط الدخول';
 if(!executable){state='no';stateText='مراقبة فقط — الخطة غير مكتملة للتنفيذ';}
 else if(Number.isFinite(cur)&&Number.isFinite(nc)&&cur>nc){state='no';stateText=`لا تدخل — السعر أعلى من حد المطاردة ${px(nc)}`;}
 else if(hasTr&&Number.isFinite(cur)&&cur<=tr){state='wait';stateText=`انتظر — السعر ${px(cur)} أقل من Trigger ${px(tr)}`;}
 else{state='go';stateText='منطقة تفعيل — التنفيذ فقط بعد تحقق الشرط بالكامل';}
 return{executable,state,stateText,condition:executable?`${priceRule} + ${volumeRule}`:`${priceRule}. ${volumeRule}. لكن لا تنفيذ قبل اكتمال الوقف والأهداف.`,entry:hasEntry?`${px(low)} – ${px(high)}`:'—',stop:px(p.stopLoss),t1:px(p.target1),t2:px(p.target2),t3:px(p.target3),chase:px(p.noChaseAbove),horizon:p.horizon||'—',current:px(p.currentPrice),rr:`${rr(p.rr1)} / ${rr(p.rr2)} / ${rr(p.rr3)}`,source:planSource(p),time:p.timeStopSessions||'—'};
}
function bestPlanHtml(p){const q=execPlan(p);if(!p)return'<div class="sub">لا توجد خطة سعرية كاملة للتوصية الحالية.</div>';return`<div class="best-plan"><div class="best-title">الخطة التنفيذية المختصرة — ${esc(q.source)}</div><div class="best-grid"><div><small>شرط الدخول</small><b>${esc(q.condition)}</b></div><div><small>الدخول</small><b>${q.entry}</b></div><div><small>وقف الخسارة</small><b>${q.stop}</b></div><div><small>الأهداف</small><b>${q.t1} / ${q.t2} / ${q.t3}</b></div></div></div>`}
function tomorrowCard(d){const next=nextEgxSession(d.marketSession);if(!d.allSourcesFresh)return`<h2>توصية جلسة التداول التالية</h2><span class="pill bad">محجوبة</span><div class="sub">المحركات غير متزامنة.</div>`;const p=(d.threeOfThree||[])[0]||(d.twoOfThree||[])[0];if(!p)return`<h2>توصية جلسة ${arDate(next)}</h2><span class="pill bad">لا توجد توصية توافقية</span>`;const full=p.consensus==='3/3',e=p.engines||{};return`<div class="pick"><div><h2>توصية جلسة ${arDate(next)}</h2><div class="pick-main">${esc(p.ticker)}</div><span class="pill ${full?'good':'warn'}">Consensus ${esc(p.consensus)}</span></div><div><b>${full?'توافق 3/3':'توافق 2/3 — دخول مشروط فقط'}</b><div class="engine-line"><span class="engine-tag">SEPA-X: ${engineText(e.SEPA_X)}</span><span class="engine-tag">V16.9: ${engineText(e.V16_9)}</span><span class="engine-tag">GANN: ${engineText(e.GANN_FUSION_X)}</span></div>${bestPlanHtml(p.consensusPlan)}</div></div>`}
function stockCard(x){const p=x.consensusPlan,q=execPlan(p),e=x.engines||{},cls=x.consensus==='3/3'?'good':x.consensus==='2/3'?'warn':'',stateCls=q.state==='go'?'state-go':q.state==='wait'?'state-wait':'state-no';return`<article class="stock-card"><div class="stock-head"><div><div class="ticker">${esc(x.ticker)}</div><div class="sub">الخطة: ${esc(q.source||'غير متاحة')} · السعر المرجعي ${q.current}</div></div><span class="pill ${cls}">${esc(x.consensus)}</span></div><div class="stock-state ${stateCls}">القرار الآن: ${esc(q.stateText)}</div><div class="condition"><strong>شرط الدخول:</strong> ${esc(q.condition)}</div><div class="trade-grid"><div class="trade-box entry"><small>أدخل من كام لكام؟</small><b>${q.entry}</b></div><div class="trade-box stop"><small>وقف الخسارة</small><b>${q.stop}</b></div><div class="trade-box target"><small>الهدف الأول T1</small><b>${q.t1}</b></div><div class="trade-box target"><small>الهدف الثاني T2</small><b>${q.t2}</b></div><div class="trade-box target"><small>الهدف الثالث T3</small><b>${q.t3}</b></div><div class="trade-box"><small>لا تطارد أعلى من</small><b>${q.chase}</b></div><div class="trade-box"><small>R/R: T1 / T2 / T3</small><b>${q.rr}</b></div><div class="trade-box"><small>المدة / Time Stop</small><b>${esc(q.horizon)} · ${esc(q.time)} جلسات</b></div></div><div class="engines"><span class="engine-tag">SEPA-X: ${engineText(e.SEPA_X)}</span><span class="engine-tag">V16.9: ${engineText(e.V16_9)}</span><span class="engine-tag">GANN: ${engineText(e.GANN_FUSION_X)}</span></div><div class="source-note">${q.executable?'خطة قابلة للتنفيذ فقط بعد تحقق الشرط؛ ليست أمر شراء تلقائي.':'لا توجد عناصر كافية لتنفيذ صفقة؛ السهم للمراقبة فقط.'} · Research / Shadow فقط.</div></article>`}
async function load(){try{const r=await fetch('./data/current.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json(),ok=d.allSourcesFresh===true;$('hero').innerHTML=`<span class="pill ${ok?'good':'bad'}">${ok?'SAME SESSION READY':'CONSENSUS BLOCKED'}</span> <b>جلسة السوق ${esc(d.marketSession||'—')}</b><div class="sub">${ok?'الثلاثة على نفس الجلسة.':'يوجد مصدر قديم أو غير متزامن.'}</div>`;$('tomorrow').innerHTML=tomorrowCard(d);const q=d.dataReadiness||{};$('stats').innerHTML=[["إجمالي السوق",q.total],["READY",q.ready],["QUARANTINED",q.quarantined],["3/3",d.threeOfThree?.length||0]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]??'—'}</b></div>`).join('');const labels={V16_9:'EGX Pro V16.9',SEPA_X:'SEPA-X',GANN_FUSION_X:'GANN Fusion X'};$('sources').innerHTML=Object.entries(d.sources||{}).map(([k,s])=>`<div class="card"><b>${labels[k]||k}</b><div style="margin-top:8px"><span class="pill ${s.fresh?'good':'bad'}">${s.fresh?'FRESH':'STALE'}</span></div><div class="sub">Session: ${esc(s.session||'—')} · Signals: ${s.signalsAfterReadiness??0}</div></div>`).join('');const rows=(d.rows||[]).slice().sort((a,b)=>Number((b.consensus||'0')[0])-Number((a.consensus||'0')[0]));$('stocks').innerHTML=rows.length?rows.map(stockCard).join(''):'<div class="empty">لا توجد أسهم بعد تطبيق الجاهزية المشتركة.</div>'}catch(e){$('hero').innerHTML=`<span class="pill bad">RUN REQUIRED</span><div class="sub">${esc(e.message)}</div>`;$('tomorrow').innerHTML='<span class="pill bad">غير متاحة</span>';$('stocks').innerHTML='<div class="empty">يجب تشغيل Build/CI أولًا.</div>'}}$('reload').onclick=load;load();setInterval(load,120000);
</script></body></html>

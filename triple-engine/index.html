<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EGX Triple Engine — Research Consensus</title><style>
:root{color-scheme:dark;--bg:#07131d;--panel:#0d2230;--line:#21465b;--txt:#f2fbff;--muted:#9cb6c5;--good:#37d7a0;--warn:#ffc85e;--bad:#ff7888;--blue:#56c6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06131d,#091c28);color:var(--txt);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1380px;margin:auto;padding:20px}.top,.card,.hero{border:1px solid var(--line);background:rgba(13,34,48,.95);border-radius:18px}.top{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:7px}.pill{border:1px solid #32617a;border-radius:999px;padding:7px 11px;font-weight:700}.pill.good{color:var(--good);border-color:#247b61}.pill.bad{color:var(--bad);border-color:#7d3944}.hero{margin-top:15px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.card{padding:15px}.card small{color:var(--muted);display:block;margin-bottom:8px}.card b{font-size:22px}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.source{padding:15px}.source h3{margin:0 0 10px}.source p{margin:5px 0;color:var(--muted)}.table{margin-top:15px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}table{border-collapse:collapse;width:100%}th,td{padding:12px;border-bottom:1px solid #173749;text-align:right}th{background:#0b1b27;color:#bad3df}.c3{color:var(--good);font-weight:900}.c2{color:var(--warn);font-weight:900}.c1{color:var(--muted)}.blocked{color:var(--bad)}.empty{padding:30px;text-align:center;color:var(--muted)}button{background:#15506b;border:1px solid #2c7595;color:white;border-radius:11px;padding:10px 15px;cursor:pointer;font-weight:700}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.sources{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.table{overflow:auto}table{min-width:900px}}
</style></head><body><main class="wrap"><header class="top"><div><h1>EGX Triple Engine Consensus</h1><div class="sub">SEPA‑X + EGX Pro V16.9 + GANN Fusion X · Research / Shadow Only</div></div><button id="reload">تحديث</button></header><section class="hero" id="hero">جارٍ تحميل التشغيل الموحد…</section><section class="grid" id="stats"></section><section class="sources" id="sources"></section><section class="table"><table><thead><tr><th>السهم</th><th>Consensus</th><th>SEPA‑X</th><th>V16.9</th><th>GANN</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
'use strict';const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('./data/current.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();const ok=d.allSourcesFresh===true;const cls=ok?'good':'bad';$('hero').innerHTML=`<span class="pill ${cls}">${ok?'SAME SESSION READY':'CONSENSUS BLOCKED'}</span> <b>جلسة السوق ${esc(d.marketSession||'—')}</b><div class="sub">${ok?'الثلاثة على نفس الجلسة؛ 3/3 مسموح فقط للأسهم READY.':'يوجد مصدر قديم أو غير متزامن؛ لا يتم إصدار 3/3.'}</div>`;const q=d.dataReadiness||{};$('stats').innerHTML=[["إجمالي السوق",q.total],["READY",q.ready],["QUARANTINED",q.quarantined],["3/3",d.threeOfThree?.length||0]].map(x=>`<div class="card"><small>${x[0]}</small><b>${x[1]??'—'}</b></div>`).join('');const labels={V16_9:'EGX Pro V16.9',SEPA_X:'SEPA-X',GANN_FUSION_X:'GANN Fusion X'};$('sources').innerHTML=Object.entries(d.sources||{}).map(([k,s])=>`<div class="card source"><h3>${labels[k]||k}</h3><span class="pill ${s.fresh?'good':'bad'}">${s.fresh?'FRESH':'STALE'}</span><p>Session: ${esc(s.session||'—')}</p><p>Signals after readiness: <b>${s.signalsAfterReadiness??0}</b></p></div>`).join('');const rows=d.rows||[];$('rows').innerHTML=rows.length?rows.map(x=>{const cls=x.consensus==='3/3'?'c3':x.consensus==='2/3'?'c2':'c1';const e=x.engines||{};const cell=n=>e[n]?.present?`${esc(e[n].decision)}${e[n].score!=null?` · ${esc(e[n].score)}`:''}`:'—';return`<tr><td><b>${esc(x.ticker)}</b></td><td class="${cls}">${esc(x.consensus)}</td><td>${cell('SEPA_X')}</td><td>${cell('V16_9')}</td><td>${cell('GANN_FUSION_X')}</td></tr>`}).join(''):`<tr><td colspan="5" class="empty">لا يوجد تداخل بين المحركات بعد تطبيق الجاهزية المشتركة.</td></tr>`}catch(e){$('hero').innerHTML=`<span class="pill bad">RUN REQUIRED</span><div class="sub">تعذر تحميل نتيجة التشغيل الموحد: ${esc(e.message)}</div>`;$('rows').innerHTML='<tr><td colspan="5" class="empty">يجب تشغيل Build/CI أولًا.</td></tr>'}}$('reload').onclick=load;load();setInterval(load,120000);
</script></body></html>

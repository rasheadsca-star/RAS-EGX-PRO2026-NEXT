<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d">
<title>EGX ONE — Unified Decision Center</title>
<style>body{margin:0;background:#06101c;color:#edf6ff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.x{text-align:center;padding:28px;max-width:720px}.s{color:#91a7c2;font-size:12px;line-height:1.8}.bad{color:#ff6d79}.good{color:#47d59a}</style>
</head><body><div class="x"><h1>EGX ONE</h1><div class="good">VERIFIED RESEARCH UI · TECHNICAL CHART V2</div><p class="s">Loading session-bound research interface…</p><p class="s">PRODUCTION LOCKED · Automatic Orders: DISABLED</p></div>
<script>
(async()=>{
  const REPO='https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/';
  const BUILD='723d6880f6ae97d1a198cc713ec15cf0f4a2d59d';
  const baseUrl=REPO+BUILD+'/index.html';
  const techUrl=REPO+BUILD+'/technical-chart-v2.js';
  const [baseRes,techRes]=await Promise.all([fetch(baseUrl,{cache:'no-store'}),fetch(techUrl,{cache:'no-store'})]);
  if(!baseRes.ok)throw new Error('BASE_UI_FETCH_FAILED:'+baseRes.status);
  if(!techRes.ok)throw new Error('TECH_V2_FETCH_FAILED:'+techRes.status);
  let base=await baseRes.text(),tech=await techRes.text();
  const required=['EGX ONE — Unified Decision Center','PRODUCTION LOCKED','Automatic Orders: DISABLED','function renderSymbol'];
  for(const marker of required)if(!base.includes(marker))throw new Error('BASE_UI_GUARD_FAILED:'+marker);
  const techRequired=['EGXOneTechnicalV2','regressionChannel','fibonacci','pivotLevels','TECHNICAL VISUALIZATION V2'];
  for(const marker of techRequired)if(!tech.includes(marker))throw new Error('TECH_V2_GUARD_FAILED:'+marker);
  tech=tech.replace(/<\/script/gi,'<\\/script');
  const injection=`<script>${tech}<\/script><script>window.__EGX_ONE_RELEASE={build:'${BUILD}',technicalChart:'V2',authority:'RESEARCH_ONLY',automaticOrders:false};<\/script>`;
  if(!base.includes('</body>'))throw new Error('BASE_UI_BODY_MISSING');
  base=base.replace('</body>',injection+'</body>');
  document.open();document.write(base);document.close();
})().catch(err=>{
  console.error(err);
  document.body.innerHTML='<div class="x"><h1>EGX ONE</h1><p class="bad">تعذر تحميل النسخة المتحققة. تم الإيقاف Fail-Closed.</p><p class="s">PRODUCTION LOCKED · No recommendation authority granted.</p></div>';
});
</script></body></html>

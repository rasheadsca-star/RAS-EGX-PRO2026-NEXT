<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta name="robots" content="noindex,nofollow">
<title>EGX PRO V18.2 — G12 Local Bootstrap</title>
<style>
html,body{margin:0;min-height:100%;background:#07101d;color:#eaf2ff;font-family:Arial,Tahoma,sans-serif}
body{display:grid;place-items:center;min-height:100vh}.boot{width:min(680px,90vw);padding:30px;border:1px solid #26364d;border-radius:16px;background:#0d1828;text-align:center}
.boot h1{margin:0 0 12px;font-size:25px}.boot p,.status{color:#aebdd2;line-height:1.7}.status{font-size:13px;margin-top:15px}
</style>
</head>
<body>
<main class="boot" id="boot">
<h1>EGX PRO V18.2</h1>
<p>جاري فتح محرك Astra المحلي المعزول.</p>
<div class="status" id="status">G12 · R01 LOCAL-FIRST · R02 FALLBACK TEMPORARILY RETAINED</div>
</main>
<script>
(() => {
  'use strict';
  const LOCAL = '../astra/runtime/v18/index.html';
  const R02_FALLBACK = 'https://cdn.jsdelivr.net/gh/rasheadsca-star/RAS-EGX-PRO2026-NEXT@v18-global-strategy-ensemble-20260906/preview-v18-web/index.html';
  const status=document.getElementById('status');
  async function localReady(){
    const r=await fetch(LOCAL,{method:'GET',cache:'no-store',credentials:'same-origin'});
    if(!r.ok)throw new Error('LOCAL_HTTP_'+r.status);
    const html=await r.text();
    if(!html.includes('Astra Local Decision Surface'))throw new Error('LOCAL_CONTRACT_MISSING');
    return true;
  }
  async function fallback(){
    status.textContent='تعذر المسار المحلي — تشغيل R02 المؤقت';
    const r=await fetch(R02_FALLBACK,{method:'GET',mode:'cors',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
    if(!r.ok)throw new Error('R02_HTTP_'+r.status);
    const html=await r.text();
    document.open();document.write(html);document.close();
  }
  localReady()
    .then(()=>location.replace(LOCAL))
    .catch(error=>fallback().catch(last=>{
      console.error('V18 G12 bootstrap failed closed',error,last);
      status.textContent='FAIL-CLOSED · لا يوجد مسار محلي صالح ولا fallback متاح';
    }));
})();
</script>
</body>
</html>

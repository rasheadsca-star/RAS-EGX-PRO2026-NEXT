<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EGX PRO — ترتيب السوق قبل وبعد الفلاتر</title>
<style>body{font:15px Tahoma,Arial;background:#081322;color:#eaf3ff;margin:0}main{max-width:1450px;margin:auto;padding:25px}a{color:#a6d7ff}h1{font-size:24px}.info{background:#202f46;padding:16px;border:1px solid #50647a;border-radius:10px;line-height:1.9}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.stats span{background:#152c49;padding:14px;border-radius:9px}input,select{padding:10px;background:#15273e;border:1px solid #66819c;color:white;border-radius:6px}table{width:100%;border-collapse:collapse;min-width:1030px}th,td{padding:10px;text-align:right;border-bottom:1px solid #29435e}th{background:#16314f;position:sticky;top:0}.wrap{overflow:auto;max-height:70vh}.hold{color:#ffc988}.ok{color:#94e6b3}.muted{color:#b1c5d9}button{padding:9px;color:white;background:#24547b;border:0;border-radius:7px;cursor:pointer}</style>
<main><p><a href="./">النسخة التاريخية المجمدة V4</a></p><h1>ترتيب جميع الأسهم — قبل الفلاتر وبعدها</h1><div class="info" id="status">جارٍ قراءة سجل التصنيف...</div><div class="stats" id="stats"></div><p><input id="q" placeholder="ابحث عن AMOC أو ENGC أو أي سهم"><select id="mode"><option value="all">جميع الأسهم قبل الفلاتر</option><option value="pass">المؤهلة بعد الفلاتر</option><option value="hold">المستبعدة وأسبابها</option></select> <button id="csv">تصدير CSV</button></p><div class="wrap"><table><thead><tr><th>الترتيب قبل</th><th>بعد</th><th>السهم</th><th>تاريخ الجلسة</th><th>الإغلاق</th><th>الدرجة قبل</th><th>الحالة</th><th>أسباب الفلترة</th><th>5 جلسات %</th><th>20 جلسة %</th></tr></thead><tbody id="rows"></tbody></table></div><h2>الاختبار المستقبلي</h2><p id="forward" class="info"></p></main>
<script>
let data=null,shown=[];
const E=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const N=(x,d=2)=>Number.isFinite(Number(x))?Number(x).toFixed(d):'—';
function draw(){if(!data)return;const q=document.getElementById('q').value.trim().toUpperCase(),mode=document.getElementById('mode').value;shown=(data.beforeFilters||[]).filter(x=>(mode==='all'||(mode==='pass'?x.rankEligible:!x.rankEligible))&&(!q||x.ticker.includes(q)||(x.companyNameAr||'').includes(q)));document.getElementById('rows').innerHTML=shown.map(x=>'<tr><td>'+E(x.beforeRank)+'</td><td>'+E(x.afterRank)+'</td><td><b>'+E(x.ticker)+'</b> '+E(x.companyNameAr)+'</td><td>'+E(x.date)+'</td><td>'+N(x.close,3)+'</td><td>'+N(x.beforeScore)+'</td><td class="'+(x.rankEligible?'ok':'hold')+'">'+E(x.stage)+'</td><td>'+E((x.reasons||[]).join(' | ')||'اجتاز فلاتر البيانات')+'</td><td>'+N(x.indicators?.return5Pct)+'</td><td>'+N(x.indicators?.return20Pct)+'</td></tr>').join('')}
async function load(){try{const response=await fetch('../data/paper-v4/ranking-latest.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('ملف الترتيب لم يتم توليده بعد: '+response.status);data=await response.json();document.getElementById('status').textContent='جلسة '+data.latestSession+' — '+data.status+' — '+data.noteAr;document.getElementById('stats').innerHTML='<span>تم تحليل '+data.counts.analyzed+' سهم</span><span>بعد الفلاتر '+data.counts.eligible+'</span><span>موقوفة للفحص '+data.counts.held+'</span>';document.getElementById('forward').textContent='رصد مستقبلي: '+data.forwardResearch.observations+' حالة؛ معدل الرصد الإيجابي '+(data.forwardResearch.winRatePct??'غير متاح')+'%. ليست نتيجة تداول معتمدة؛ لا يوجد اختبار خارج العينة مجمد أو تكاليف تنفيذ كافية حتى الآن.';draw()}catch(e){document.getElementById('status').textContent=e.message+' — شغّل مهمة توليد ranking-latest.json أولاً.'}}
document.getElementById('q').oninput=draw;document.getElementById('mode').onchange=draw;document.getElementById('csv').onclick=()=>{const lines=[['before_rank','after_rank','ticker','date','close','score','status','reasons'].join(','),...shown.map(x=>[x.beforeRank,x.afterRank||'',x.ticker,x.date,x.close,x.beforeScore,x.stage,(x.reasons||[]).join('|')].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))];const b=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='v4_like_all_stock_ranking_before_after.csv';a.click();URL.revokeObjectURL(a.href)};load();
</script></html>

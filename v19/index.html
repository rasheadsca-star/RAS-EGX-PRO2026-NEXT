<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071521">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>EGX V19</title>
  <style>
    html,body{margin:0;min-height:100%;background:#071521;color:#ecf8ff;font-family:Tahoma,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    .box{max-width:680px;background:#0b2031;border:1px solid #2d5872;border-radius:18px;padding:28px;box-shadow:0 16px 42px #0005}
    h1{margin:0 0 12px;font-size:24px}p{color:#9fb9c9;line-height:1.9}.status{margin-top:12px;color:#ffca61;font-size:12px}
    a{display:inline-block;margin-top:15px;background:#10658f;border:1px solid #3b769a;color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px}
  </style>
</head>
<body>
  <main class="box">
    <h1>جارٍ فتح EGX V19…</h1>
    <p>مدخل عام مباشر للواجهة، بدون Vercel Login.</p>
    <div class="status">جارٍ فتح آخر نسخة…</div>
    <a id="openApp" href="../preview-v16/app/v169.html?entry=v19-public&latest=1&version=16.9.1&mobileReset=1">فتح التطبيق الآن</a>
  </main>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const requested=params.get('view')==='evaluation'?'evidence':params.get('view');
    const target=`../preview-v16/app/v169.html?entry=v19-public&latest=1&version=16.9.1&mobileReset=1&v=${Date.now()}${requested?`&view=${encodeURIComponent(requested)}`:''}`;
    document.getElementById('openApp').href=target;
    setTimeout(()=>location.replace(target),120);
  })();
  </script>
</body>
</html>

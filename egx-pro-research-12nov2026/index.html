<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, max-age=0"><title>EGX PRO — آخر جلسة معتمدة للبحث</title><style>body{font:16px/1.8 Tahoma,Arial,sans-serif;margin:0;background:#081b2e;color:#e5f5ff}main{max-width:850px;margin:55px auto;padding:25px;background:#102c44;border:1px solid #34617b;border-radius:16px}h1{margin:0 0 12px;font-size:26px}#status{color:#acd7ee}.warn{color:#ffd0a2}a{color:#82dcff;display:inline-block;padding:9px 0}button{background:#12628d;color:white;border:1px solid #50c6fa;border-radius:10px;padding:11px 16px;font:inherit;cursor:pointer}.muted{font-size:13px;color:#afbdc9}</style></head><body><main><h1>EGX PRO — غرفة القرار البحثية</h1><p id="status">جارٍ تحديد أحدث جلسة من ملف EGX الرسمي المحفوظ…</p><div id="actions"><a href="chart.html">الشارت التفاعلي لجميع الأسهم</a></div><p class="muted">توصيات بحثية فقط. كل جلسة محفوظة مستقلة، ولا تُستبدل نتائجها بأثر رجعي.</p></main><script>(async()=>{const msg=document.getElementById('status'),actions=document.getElementById('actions');const qp=new URLSearchParams(location.search);if(qp.has('stock')||qp.get('view')==='chart'){location.replace('chart.html'+location.search);return}const fallback='sessions/2026-11-17/';const provisional='sessions/2026-11-18/';try{const check=await fetch(provisional+'index.html?fresh='+Date.now(),{cache:'no-store'});if(check.ok){msg.textContent='جلسة الأسعار 18 نوفمبر 2026 — توصيات 19 نوفمبر (بحثية أولية، غير معتمدة للتنفيذ)';location.replace(provisional+'?release=2026-11-18&fresh='+Date.now());return}}catch(_e){}try{const res=await fetch('latest.json?cachebust='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('تعذر قراءة سجل أحدث جلسة ('+res.status+')');const j=await res.json(),path=j.recentSessionPage; if(!/^sessions\/20\d{2}-\d{2}-\d{2}\/$/.test(path))throw Error('المسار الجديد غير موثق');const r=await fetch(path+'research.json?cachebust='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('ملف جلسة '+j.session+' غير منشور ('+r.status+')');const s=await r.json();if(s.session!==j.session)throw Error('تعارض تاريخ التقرير وتاريخ النسخة المنشورة');msg.textContent='أحدث تقرير: '+j.session+' — فتح غرفة توصيات الجلسة التالية '+s.nextSession;const a=document.createElement('a');a.href=path;a.textContent='فتح توصيات جلسة '+s.nextSession;actions.prepend(a);location.replace(path+'?release='+encodeURIComponent(j.session)+'&fresh='+Date.now())}catch(e){msg.className='warn';msg.textContent='تعذر فتح أحدث تقرير آليًا: '+String(e.message||e)+'. يمكن فتح الإصدار المؤرخ أدناه.';const a=document.createElement('a');a.href=fallback;a.textContent='فتح نسخة 17 نوفمبر الاحتياطية';actions.prepend(a)}})();</script></body></html>

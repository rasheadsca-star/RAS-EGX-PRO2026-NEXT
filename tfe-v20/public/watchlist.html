<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store"><title>RC2 High-Potential Watchlist</title>
<style>
:root{color-scheme:dark;--bg:#071521;--panel:#0d2332;--line:#21445a;--txt:#e8f1f6;--muted:#8ba5b5;--good:#48d597;--warn:#f2c35b;--bad:#f07178;--blue:#65b7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,"Noto Sans Arabic",sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.top h1{margin:0 0 6px;font-size:26px}.top p{margin:0;color:var(--muted)}a,button{color:var(--txt)}button,.back{border:1px solid var(--line);background:#102c3d;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}.notice{border:1px solid #6c5a25;background:#2e2715;padding:13px;border-radius:12px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.stat small{display:block;color:var(--muted);margin-bottom:7px}.stat b{font-size:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card h3{margin:0;font-size:21px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.rank{color:var(--blue);font-weight:700}.tag{font-size:12px;border:1px solid #715d27;color:var(--warn);padding:5px 8px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:13px 0}.m{background:#091b27;border-radius:9px;padding:9px}.m small{display:block;color:var(--muted);font-size:11px}.m b{display:block;margin-top:4px}.fails{font-size:13px;color:var(--warn);line-height:1.7}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px}.footer{margin-top:18px;color:var(--muted);font-size:12px}.bad{color:var(--bad)}.good{color:var(--good)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div><h1>RC2 — الفرص المرشحة عالية الاحتمال النسبي</h1><p>طبقة Watchlist مستقلة مسترشدة بالترتيب المقطعي للسوق؛ لا تغيّر توصيات RC2 الرسمية.</p></div><div><a class="back" href="/">العودة للواجهة</a> <button id="refresh">تحديث</button></div></div>
<div class="notice"><b>مهم:</b> العناصر أدناه ليست توصيات شراء. هي أسهم قريبة من اجتياز البوابات الرسمية، بلا مانع حرج، ومصنفة نسبيًا داخل جلسة السوق الحالية.</div>
<div class="grid" id="stats"></div><div class="cards" id="cards"><div class="empty">جارٍ فحص السوق…</div></div><div class="footer" id="meta"></div>
</main>
<script type="module">
const $=x=>document.getElementById(x),F=(v,d=1)=>Number.isFinite(Number(v))?Number(v).toFixed(d):'—';
const labels={core:'Core',research:'Research',liquidity:'Liquidity',supportResistance:'S/R',structuralNetRR:'R/R'};
async function load(){
  $('cards').innerHTML='<div class="empty">جارٍ فحص السوق…</div>';
  try{
    const r=await fetch('/api/watchlist?limit=20&t='+Date.now(),{cache:'no-store'}),d=await r.json(); if(!r.ok||!d.ok)throw new Error(d.error||r.status);
    const s=d.summary||{};
    $('stats').innerHTML=[['جلسة السوق',d.sessionDate],['Qualified رسميًا',s.officialPublishableTotal],['High-Potential Watchlist',s.highPotentialTotal],['تم فحص',s.scanned]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]??'—'}</b></div>`).join('');
    const rows=d.highPotentialCandidates||[];
    $('cards').innerHTML=rows.length?rows.map(x=>{
      const sc=x.scores||{},tp=x.tradePlan||{},fails=(x.failedGates||[]).map(k=>`${labels[k]||k}: ناقص ${F(x.deficits?.[k],k==='structuralNetRR'?2:1)}`).join(' · ');
      return `<article class="card"><div class="head"><div><span class="rank">#${x.rank}</span> <h3 style="display:inline">${x.ticker}</h3></div><span class="tag">WATCHLIST ONLY</span></div><div class="metrics"><div class="m"><small>Candidate score</small><b>${F(x.candidateScore)}</b></div><div class="m"><small>Relative rank</small><b>${F(x.relativeOpportunityScore)}</b></div><div class="m"><small>Core / 70</small><b>${F(sc.core)}</b></div><div class="m"><small>Research / 72</small><b>${F(sc.research)}</b></div><div class="m"><small>Liquidity / 55</small><b>${F(sc.liquidity)}</b></div><div class="m"><small>S/R / 55</small><b>${F(sc.supportResistance)}</b></div><div class="m"><small>Net R/R / 0.70</small><b>${F(tp.structuralNetRR,2)}</b></div><div class="m"><small>Alignment</small><b>${tp.alignmentState||'—'}</b></div></div><div class="fails">${fails||'قريب من البوابات العددية دون نقص ظاهر.'}</div></article>`
    }).join(''):`<div class="empty">لا توجد Near-Miss candidates ضمن الحدود المحافظة الحالية. هذا لا يغيّر نتيجة RC2 الرسمية.</div>`;
    $('meta').textContent=`Engine: ${d.engine} · Generated: ${d.generatedAt} · Official thresholds unchanged · Execution blocked`;
  }catch(e){$('cards').innerHTML=`<div class="empty bad">تعذر بناء الـWatchlist: ${String(e.message||e)}</div>`}
}
$('refresh').onclick=load;load();
</script></body></html>

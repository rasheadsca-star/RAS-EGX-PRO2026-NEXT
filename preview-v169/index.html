<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#061522">
  <title>EGX Pro V16.9 — سلة الفرص</title>
  <style>
    :root{color-scheme:dark;--bg:#061522;--panel:#0b2232;--line:#1c4054;--text:#eef8ff;--muted:#9cb6c5;--green:#2bd39b;--amber:#ffc45c;--red:#ff7185;--blue:#45bdf5}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#123148 0,#061522 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 20px;border:1px solid var(--line);border-radius:20px;background:rgba(11,34,50,.93);box-shadow:0 18px 45px #0005}.brand{display:flex;gap:14px;align-items:center}.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#168fc0,#1cd298);font-weight:900;font-size:20px}.brand h1{margin:0;font-size:23px}.brand p{margin:7px 0 0;color:var(--muted);font-size:13px}.btn{border:1px solid #32708d;background:#12364b;color:#fff;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:700}.hero{margin-top:18px;padding:20px;border-radius:20px;border:1px solid #276c59;background:linear-gradient(135deg,#0b3028,#0c2433)}.hero.bad{border-color:#81404b;background:linear-gradient(135deg,#351820,#0c2433)}.hero h2{margin:0 0 8px;font-size:20px}.hero p{margin:0;color:#c9dde7;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin:18px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.stat small{display:block;color:var(--muted);margin-bottom:8px}.stat b{font-size:21px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{position:relative;padding:19px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#0d2a3d,#091e2d);overflow:hidden}.card:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--green)}.card.hot:before{background:var(--amber)}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.ticker{font-size:22px;font-weight:900;direction:ltr;text-align:right}.name{margin-top:5px;color:#c7dce8}.weight{background:#153e50;border:1px solid #28627b;border-radius:999px;padding:7px 10px;font-weight:800;white-space:nowrap}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.tag{font-size:12px;border-radius:999px;padding:5px 9px;background:#123449;color:#cce9f6}.tag.good{background:#0c4435;color:#cffff0}.tag.warn{background:#50391a;color:#ffe2a5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:11px;border-radius:12px;background:#071a27;border:1px solid #17384a}.metric span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.metric b{direction:ltr;display:block;text-align:right}.rule{margin:14px 0 0;padding:12px;border-radius:12px;background:#172c36;color:#d6e7ef;line-height:1.75;font-size:13px}.empty{padding:40px;text-align:center;border:1px dashed #416071;border-radius:18px;color:var(--muted);grid-column:1/-1}.footer{margin-top:18px;padding:15px;color:var(--muted);line-height:1.8;font-size:13px;border-top:1px solid var(--line)}.loading{padding:45px;text-align:center;color:var(--muted)}@media(max-width:820px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="logo">EGX</div><div><h1>EGX Pro V16.9</h1><p>سلة احتمالية متساوية الأوزان — Pilot منخفض المخاطر</p></div></div>
      <button class="btn" id="reload">تحديث النتائج</button>
    </header>
    <section class="hero" id="hero"><div class="loading">جارٍ تحميل سلة V16.9…</div></section>
    <section class="stats" id="stats"></section>
    <section class="cards" id="cards"></section>
    <footer class="footer" id="footer">هذه نتائج بحثية احتمالية وليست ضمانًا للربح أو أمر شراء آليًا. التنفيذ مشروط بالسعر والسيولة وإدارة المخاطر.</footer>
  </main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const n=v=>Number.isFinite(Number(v))?Number(v):null;
const f=(v,d=2)=>n(v)===null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d});
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function riskReward(r){const entry=n(r.entryHigh),stop=n(r.stopLoss),target=n(r.target1);return entry!==null&&stop!==null&&target!==null&&entry>stop?(target-entry)/(entry-stop):null}
function card(r){const hot=n(r.rsi14)>80,rr=n(r.riskReward)??riskReward(r),prob=n(r.estimatedTop10ProbabilityPct)??n(r.probabilityTop10Pct);return `<article class="card ${hot?'hot':''}"><div class="head"><div><div class="ticker">${e(r.ticker)}</div><div class="name">${e(r.companyNameAr)}</div></div><div class="weight">${f(r.portfolioWeightPct,1)}% من المحفظة</div></div><div class="tags"><span class="tag good">عضو في السلة</span><span class="tag">احتمال Top 10: ${f(prob,2)}%</span><span class="tag ${hot?'warn':''}">RSI ${f(r.rsi14,1)}</span><span class="tag">حجم نسبي ${f(r.volumeRatio20,2)}×</span></div><div class="grid"><div class="metric"><span>الإغلاق المرجعي</span><b>${f(r.close,4)}</b></div><div class="metric"><span>الدخول من</span><b>${f(r.entryLow,4)}</b></div><div class="metric"><span>الدخول إلى</span><b>${f(r.entryHigh,4)}</b></div><div class="metric"><span>الهدف الأول</span><b>${f(r.target1,4)}</b></div><div class="metric"><span>وقف الخسارة</span><b>${f(r.stopLoss,4)}</b></div><div class="metric"><span>العائد/المخاطرة</span><b>${f(rr,2)}</b></div></div><p class="rule">${e(r.morningConfirmation?.ruleAr||'لا يُنفذ إذا افتتح أعلى نطاق الدخول أو ضعفت السيولة أول 10–15 دقيقة. السهم غير المتفعل يظل وزنه نقدًا.')}</p></article>`}
async function load(){
  $('hero').className='hero';$('hero').innerHTML='<div class="loading">جارٍ تحميل سلة V16.9…</div>';$('stats').innerHTML='';$('cards').innerHTML='';
  try{
    const d=await json('../data/stable/v15-practical-decision.json');
    const rows=Array.isArray(d.recommendations)?d.recommendations:[];
    const plan=d.basketPlan||{};
    const ready=d.practicalReady===true&&rows.length>0;
    $('hero').className='hero'+(ready?'':' bad');
    $('hero').innerHTML=ready?`<h2>السلة جاهزة للمراقبة — التنفيذ معلق على تأكيد الافتتاح</h2><p>${e(d.statusAr||'')}</p>`:`<h2>لا توجد سلة منشورة</h2><p>${e(d.statusAr||'ملف النتائج لا يحتوي على توصيات حاليًا.')}</p>`;
    const m=plan.blockedWalkForwardMetrics||{};
    $('stats').innerHTML=[['عدد الأسهم',rows.length],['إجمالي التعرض',f(plan.totalAllocationPct,1)+'%'],['السيولة الاحتياطية',f(plan.cashReservePct,1)+'%'],['Profit Factor',f(m.profitFactor,3)],['الجلسات الرابحة',f(m.sessionWinRatePct,2)+'%']].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
    $('cards').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">لا توجد أسهم في ملف الإنتاج الحالي.</div>';
    $('footer').textContent=`آخر تحديث: ${d.generatedAt?new Date(d.generatedAt).toLocaleString('ar-EG'):'—'} — جلسة الإشارة: ${d.sessionDate||'—'}. السلة Pilot ولا تضمن الربح.`;
  }catch(err){$('hero').className='hero bad';$('hero').innerHTML=`<h2>تعذر تحميل النتائج</h2><p>${e(err.message)}</p>`;$('cards').innerHTML='<div class="empty">أعد تحميل الصفحة بعد التأكد من الاتصال.</div>'}
}
$('reload').onclick=load;load();setInterval(load,120000);
</script>
</body>
</html>

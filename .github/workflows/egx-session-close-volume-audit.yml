name: EGX Session Close Volume Audit

on:
  push:
    branches: [egx-one/clean-room-v0]
    paths:
      - scripts/egx-session-close-volume-audit.mjs
      - src/market-data-semantics.js
      - data/research/egx-independent-identity-evidence-2026-09-01.json
      - .github/workflows/egx-session-close-volume-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile 31-Aug exact identity close volume and missing-session semantics
        run: node scripts/egx-session-close-volume-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egx-session-close-volume-audit
          path: artifacts/egx-session-close-volume-audit.json
          if-no-files-found: warn

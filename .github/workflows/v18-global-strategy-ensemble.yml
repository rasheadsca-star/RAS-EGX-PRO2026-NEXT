name: V18 Global Strategy Ensemble Validation

on:
  workflow_dispatch:
  push:
    branches:
      - v18-global-strategy-ensemble-20260906
    paths:
      - scripts/stable/v18-global-strategy-ensemble.cjs
      - scripts/stable/v18-leadership-extension.cjs
      - scripts/stable/v18-evidence-ranking.cjs
      - scripts/stable/build-v18-decision-board.cjs
      - data/v18-global-strategy-policy.json
      - preview-v18/**
      - .github/workflows/v18-global-strategy-ensemble.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          node --check scripts/stable/v18-global-strategy-ensemble.cjs
          node --check scripts/stable/v18-leadership-extension.cjs
          node --check scripts/stable/v18-evidence-ranking.cjs
          node --check scripts/stable/build-v18-decision-board.cjs
          node --check preview-v18/app.js

      - name: Build V18.1 decision board
        run: node scripts/stable/build-v18-decision-board.cjs

      - name: Regression and UI contract checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = JSON.parse(fs.readFileSync('preview-v18/data.json', 'utf8'));
          if (out.schemaVersion !== '18.1.0-shadow') throw new Error(`Unexpected schema ${out.schemaVersion}`);
          if (!out.sessionId) throw new Error('Missing sessionId');
          if (!Array.isArray(out.actionable) || !Array.isArray(out.allCandidates)) throw new Error('Missing decision arrays');
          if ((out.counts?.canonicalStocksLoaded || 0) < 100) throw new Error('Canonical stock coverage unexpectedly low');
          if (!out.leadershipSummary) throw new Error('Missing leadershipSummary');
          if (!out.strategyRegimeMatrix?.RISK_ON) throw new Error('Missing strategy-regime matrix');
          if (out.rankingPolicy?.code !== 'EVIDENCE_FIRST_THEN_SCORE') throw new Error('Evidence-first ranking missing');
          if (!out.forwardLedgerSummary?.immutableIssueSnapshots) throw new Error('Forward ledger immutability flag missing');
          const ledger = JSON.parse(fs.readFileSync('preview-v18/forward-ledger.json','utf8'));
          if (!Array.isArray(ledger.entries)) throw new Error('Forward ledger entries missing');
          const currentIssued = ledger.entries.filter(x => x.issued?.sessionId === out.sessionId);
          if (currentIssued.length < out.actionable.length) throw new Error('Forward ledger did not capture all current actionable candidates');
          const riskOn = ['RISK_ON', 'BULLISH'].includes(String(out.marketRegime?.code || '').toUpperCase());
          if (riskOn && (out.counts?.emaMacdContinuationEligible || 0) < 2) throw new Error('Risk-on regression: expected at least two EMA-MACD continuation candidates');
          if (riskOn && out.allCandidates.length === 0) throw new Error('Risk-on regression: board cannot show zero candidates');
          for (const row of out.allCandidates) {
            const l = row.leadership;
            if (l && !l.full52WeekCoverage && l.highReferenceLabel === '52_WEEK_HIGH') throw new Error(`False 52-week label on ${row.ticker}`);
            if (String(row.tier||'').includes('TIER_A')) {
              const realBaseSource = (row.sources||[]).some(s => !['V18_RS_LEADERSHIP_SHADOW','V18_VCP_SHADOW'].includes(s));
              if (!realBaseSource) throw new Error(`Research-only layer created Tier A on ${row.ticker}`);
            }
          }
          const firstResearch = out.allCandidates.findIndex(x => String(x.tier||'').includes('TIER_B_RESEARCH'));
          const lastTierA = out.allCandidates.reduce((idx,x,i)=>String(x.tier||'').includes('TIER_A')?i:idx,-1);
          if (firstResearch >= 0 && lastTierA > firstResearch) throw new Error('Research Tier B ranked above Tier A');
          const html = fs.readFileSync('preview-v18/index.html','utf8');
          for (const id of ['opportunityList','detailContent','zeroGuard','familyFilter','regimeScore']) if (!html.includes(`id="${id}"`)) throw new Error(`Missing UI contract: ${id}`);
          const tmghCanonical = JSON.parse(fs.readFileSync('data/quant/stocks/TMGH.json','utf8'));
          const comiCanonical = JSON.parse(fs.readFileSync('data/quant/stocks/COMI.json','utf8'));
          const tmghTurnover = Number(tmghCanonical.indicators?.averageTurnover20Egp || 0);
          const comiTurnover = Number(comiCanonical.indicators?.averageTurnover20Egp || 0);
          if (tmghTurnover < 20000000) throw new Error('TMGH canonical turnover regression');
          if (comiTurnover < 20000000) throw new Error('COMI canonical turnover regression');
          const tmgh = out.allCandidates.find(x => x.ticker === 'TMGH');
          const comi = out.allCandidates.find(x => x.ticker === 'COMI');
          console.log(JSON.stringify({schemaVersion:out.schemaVersion,sessionId:out.sessionId,marketRegime:out.marketRegime,counts:out.counts,leadershipSummary:out.leadershipSummary,forwardLedgerSummary:out.forwardLedgerSummary,rankingPolicy:out.rankingPolicy,tmgh:{tier:tmgh?.tier,score:tmgh?.decisionScore,canonicalTurnover:tmghTurnover,rs:tmgh?.leadership?.relativeStrengthComposite,vcp:tmgh?.leadership?.vcp?.passed},comi:{tier:comi?.tier,score:comi?.decisionScore,canonicalTurnover:comiTurnover,rs:comi?.leadership?.relativeStrengthComposite,vcp:comi?.leadership?.vcp?.passed},top:out.allCandidates.slice(0,12).map(x=>({evidenceRank:x.evidenceRank,rawRank:x.rank,ticker:x.ticker,tier:x.tier,score:x.decisionScore,rs:x.leadership?.relativeStrengthComposite,vcp:x.leadership?.vcp?.passed,high:x.leadership?.distanceFromAvailableHighPct,compatibility:x.regimeCompatibility?.score,sources:x.sources}))},null,2));
          NODE

      - name: Package static preview
        run: |
          test -s preview-v18/index.html
          test -s preview-v18/styles.css
          test -s preview-v18/app.js
          test -s preview-v18/data.json
          test -s preview-v18/forward-ledger.json

      - name: Upload V18.1 Decision Board
        uses: actions/upload-artifact@v4
        with:
          name: v18-decision-board
          path: preview-v18/
          if-no-files-found: error

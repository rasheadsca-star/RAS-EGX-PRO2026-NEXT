name: MAIN APP P3 Method-Independent Consensus Acceptance

on:
  push:
    branches:
      - release/MAIN-APP-v16.9.2-p3-method-independent-consensus-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/MAIN-APP-v16.9.2-p3-method-independent-consensus-20260816
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Prove frozen engine/core unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release/MAIN-APP-v16.9.2-p1-frozen-20260816 develop/v20-integrated-decision-platform
          BASE=origin/release/MAIN-APP-v16.9.2-p1-frozen-20260816
          CORE=(
            preview-v16/app/app.js
            preview-v16/app/decision-source.js
            scripts/research/v16-v169-basket-engine.py
            scripts/research/v16-two-stage-predictor.py
            scripts/research/v16-probabilistic-model-impact.py
            scripts/research/v16-v169-target-hit-audit.py
            scripts/stable/v16-publish-v169-basket.cjs
            data/stable/v16-v169-release-lock.json
          )
          git diff --exit-code "$BASE" -- "${CORE[@]}"
          node --check preview-v16/app/main-app-consensus-overlay.js
          grep -q 'main-app-consensus-overlay.js' preview-v16/app/v169-p2.html
          grep -q "preview-v16/app/v169-p2.html" index.html
      - name: Prove source execution grade is open
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const x=require('./data/stable/v15-price-truth.json');
          if(x.expectedSession!=='2026-08-16') throw Error(`unexpected session ${x.expectedSession}`);
          if(x.executionGrade!==true||x.ready!==true) throw Error('source execution grade is not open');
          if(Number(x.source?.verifiedExpectedSessionRows||0)<80) throw Error('insufficient verified session rows');
          if(Number(x.acceptedRows||0)<80) throw Error('insufficient accepted price rows');
          console.log({executionGrade:x.executionGrade,verified:x.source.verifiedExpectedSessionRows,accepted:x.acceptedRows,coverage:x.source.sourceSessionEvidenceCoveragePct});
          NODE
      - name: Build real method-independent artifact
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach .v20 origin/develop/v20-integrated-decision-platform
          (cd .v20 && node scripts/v20/build-multi-engine-consensus.cjs && node scripts/v20/multi-engine-consensus-regression.cjs)
          mkdir -p RAS-EGX0.1/data/v20
          cp .v20/data/v20/multi-engine-consensus.json RAS-EGX0.1/data/v20/
          node - <<'NODE'
          const x=require('./RAS-EGX0.1/data/v20/multi-engine-consensus.json');
          if(x.schemaVersion!=='20.1.0-method-independent-consensus-1')throw Error('method-independent schema missing');
          if(x.status!=='CURRENT_SESSION_ALIGNED')throw Error('multi-engine session mismatch');
          if(x.scoreDefinition?.independentEngineCount!==2)throw Error('expected exactly 2 method-independent engines');
          const ids=(x.engineRegistry?.activeIndependent||[]).map(e=>e.id).sort();
          if(JSON.stringify(ids)!==JSON.stringify(['V16_9_EQUAL_WEIGHT_BASKET','V20_FULL_MARKET_NATIVE_SELECTION_V1'].sort()))throw Error(`unexpected independent engines ${ids}`);
          if(!(x.engineRegistry?.relatedCorroborators||[]).some(e=>e.id==='V19_CHAT_GPT_NATIVE_CHALLENGER_V6'&&e.voteEligible===false))throw Error('V19 must be same-family corroboration only');
          if(x.governance?.changesMainAppRecommendation!==false||x.governance?.changesMainAppRanking!==false||x.governance?.changesExecutionPermission!==false)throw Error('governance drift');
          if((x.current?.mainAppAnnotations||[]).length===0)throw Error('MAIN APP annotations missing');
          console.log(JSON.stringify({session:x.sessionDate,annotations:x.current.mainAppAnnotations.map(a=>({ticker:a.ticker,votes:a.independentVotes,score:a.confirmationScore,independent:a.confirmingIndependentEngines,related:a.relatedCorroborators}))},null,2));
          NODE
      - name: Browser proof on visible V16.9 basket cards
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/main-app-p3-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          for SIZE in 1440,1000 390,844; do
            OUT="/tmp/main-app-p3-${SIZE//,/-}.html"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$SIZE" --virtual-time-budget=16000 --dump-dom 'http://127.0.0.1:8123/preview-v16/app/v169-p2.html?accept=p3' >"$OUT" 2>/tmp/main-app-p3-chrome.log
            grep -q 'id="v169BasketPanel"' "$OUT"
            grep -q 'data-execution-grade="true"' "$OUT"
            grep -q 'data-execution-eligible="true"' "$OUT"
            grep -q 'main-app-consensus-summary' "$OUT"
            grep -q '2/2 مستقل' "$OUT"
            grep -q 'V19 Challenger' "$OUT"
            if grep -q 'آخر تحقق للمصدر لم يحقق Execution Grade' "$OUT"; then echo 'stale source-gate warning still visible' >&2; exit 1; fi
            node - "$OUT" <<'NODE'
          const fs=require('fs');const file=process.argv[2];const dom=fs.readFileSync(file,'utf8');const x=require('./RAS-EGX0.1/data/v20/multi-engine-consensus.json');
          for(const a of x.current.mainAppAnnotations){
            const cardRe=new RegExp(`<article class="v169-card[^>]*>[\\s\\S]*?<h3>${a.ticker}<\\/h3>[\\s\\S]*?data-main-app-consensus-note="${a.ticker}"`);
            if(!cardRe.test(dom)) throw Error(`visible V16.9 basket note missing ${a.ticker}`);
          }
          if(!dom.includes('V20 Native V1'))throw Error('independent V20 confirmation label missing');
          if(!dom.includes('same TOP10-probability family'))throw Error('V19 same-family disclosure missing');
          console.log(`MAIN APP P3 visible basket annotations PASS ${file}`);
          NODE
          done

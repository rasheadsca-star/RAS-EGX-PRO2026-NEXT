name: EGX V16.8 Practical Selector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v168_selector_core.py"
      - "scripts/research/v16-v168-practical-selector.py"
      - ".github/workflows/v16-v168-practical-selector.yml"
  push:
    paths:
      - "scripts/research/v168_selector_core.py"
      - "scripts/research/v16-v168-practical-selector.py"
      - ".github/workflows/v16-v168-practical-selector.yml"
  schedule:
    - cron: "58 12 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v168-practical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        run: |
          python -m py_compile scripts/research/v168_selector_core.py
          python -m py_compile scripts/research/v16-v168-practical-selector.py

      - name: Run practical selector
        run: python scripts/research/v16-v168-practical-selector.py

      - name: Upload V16.8 report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v168-practical-selector-report
          path: data/research/v16-v168-practical-selector.json

      - name: Commit report on main only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-v168-practical-selector.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.8 practical selector report"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

# trigger: final-practical-selector

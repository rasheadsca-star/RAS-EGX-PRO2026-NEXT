name: EGX ONE Production UI Deploy

on:
  workflow_dispatch:
  push:
    branches: ['egx-one/clean-room-v0']
    paths:
      - 'index.html'
      - 'technical-chart-v2.js'
      - 'technical-chart-v2-core.js'
      - 'technical-chart-v21-alignment.js'
      - 'realized-kpi.js'
      - 'championship-board.js'
      - 'scripts/prepare-egx-one-live-bundle.sh'
      - 'data/research/live/latest.json'
      - 'data/research/ui/latest.json'
      - 'data/research/strategy/latest.json'
      - 'data/research/published/latest.json'
      - 'data/research/simulator/latest.json'
      - 'data/research/shadow-ledger/latest.json'
      - 'data/research/shadow-ledger/policies/*.json'
      - '.github/workflows/egx-one-production-ui-deploy.yml'

permissions:
  contents: read

concurrency:
  group: egx-one-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: prj_R9NlULz7vTKPEWeoVB9vnRaanqFo
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify clean-room contracts
        run: npm test

      - name: Build and verify deterministic complete live bundle
        run: bash scripts/prepare-egx-one-live-bundle.sh /tmp/egx-one-live

      - name: Verify championship evidence before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          await import('./championship-board.js');
          const sim=JSON.parse(fs.readFileSync('data/research/simulator/latest.json','utf8'));
          const shadow=JSON.parse(fs.readFileSync('data/research/shadow-ledger/latest.json','utf8'));
          const board=globalThis.EGXOneChampionshipBoard;
          if(!board)throw new Error('CHAMPIONSHIP_MODULE_MISSING');
          if(board.CONTRACT.authorityMode!=='RESEARCH'||board.CONTRACT.productionAuthority!==false||board.CONTRACT.scoringImpact!=='NONE'||board.CONTRACT.automaticOrders!==false)throw new Error('CHAMPIONSHIP_AUTHORITY_BOUNDARY_FAILED');
          const c=board.buildComparison(sim,shadow);
          if(!c.sameDateScope||!c.exactLegacy||!c.policyAllows)throw new Error(`CHAMPIONSHIP_EVIDENCE_NOT_QUALIFIED:${JSON.stringify({sameDateScope:c.sameDateScope,exactLegacy:c.exactLegacy,policyAllows:c.policyAllows})}`);
          if(c.score.qualifiedMetrics!==1||c.score.leader!=='EGX ONE')throw new Error(`CHAMPIONSHIP_LEADER_UNEXPECTED:${JSON.stringify(c.score)}`);
          console.log(`CHAMPIONSHIP_VERIFIED:COMMON_DATES=${c.current.commonSignalDates}:EGX_ONE_TARGET=${c.current.targetHitRatePct}:V16_9_TARGET=${c.v16.targetHitRatePct}:LEADER=${c.score.leader}:SCORE=${c.score.current}-${c.score.v16}`);
          NODE

      - name: Upload exact production-ready bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: egx-one-production-bundle-${{ github.sha }}
          path: /tmp/egx-one-live
          if-no-files-found: error
          retention-days: 30

      - name: Verify deploy credential availability
        id: auth
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'DEPLOYMENT_BLOCKED:VERCEL_TOKEN_MISSING'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_DEPLOY_CREDENTIAL:AVAILABLE'
          fi

      - name: Install pinned Vercel CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global vercel@59.10.0

      - name: Deploy complete EGX ONE bundle to production
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd /tmp/egx-one-live | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DEPLOYMENT_URL:$url"

      - name: Verify deployed bundle byte-for-byte plus authority boundary
        if: steps.auth.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/live-verify && mkdir -p /tmp/live-verify
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/egx-one-production-manifest.json" -o /tmp/live-verify/egx-one-production-manifest.json
          while IFS= read -r file; do
            mkdir -p "/tmp/live-verify/$(dirname "$file")"
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/$file" -o "/tmp/live-verify/$file"
          done < <(node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('/tmp/live-verify/egx-one-production-manifest.json','utf8'));
          for(const f of Object.keys(m.files||{}))console.log(f);
          NODE
          )
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root='/tmp/live-verify';
          const m=JSON.parse(fs.readFileSync(path.join(root,'egx-one-production-manifest.json'),'utf8'));
          const {bundleManifestHash,...body}=m;
          const manifestHash=crypto.createHash('sha256').update(JSON.stringify(body)).digest('hex');
          if(manifestHash!==bundleManifestHash)throw new Error(`DEPLOYED_MANIFEST_HASH_BAD:${manifestHash}:${bundleManifestHash}`);
          for(const [file,expected] of Object.entries(m.files||{})){
            const buf=fs.readFileSync(path.join(root,file));
            const actual=crypto.createHash('sha256').update(buf).digest('hex');
            if(actual!==expected.sha256||buf.length!==expected.bytes)throw new Error(`DEPLOYED_FILE_HASH_MISMATCH:${file}`);
          }
          const read=p=>JSON.parse(fs.readFileSync(path.join(root,p),'utf8'));
          const l=read('data/research/live/latest.json'),u=read('data/research/ui/latest.json'),s=read('data/research/strategy/latest.json'),p=read('data/research/published/latest.json'),sim=read('data/research/simulator/latest.json'),shadow=read('data/research/shadow-ledger/latest.json');
          const policy=read(`data/research/shadow-ledger/policies/${s.strategySnapshotHash}.json`);
          if(s.signalSession!==u.session||s.signalSession!==p.signalSession||s.signalSession!==l.expectedSession||s.signalSession!==l.targetSession)throw new Error('DEPLOYED_SESSION_MISMATCH');
          if(s.authorityMode!=='RESEARCH'||s.productionAuthority!==false||s.automaticOrders!==false||s.validation?.accepted!==true||!s.recommendations?.length)throw new Error('DEPLOYED_STRATEGY_BOUNDARY_FAILED');
          if(u.authorityMode!=='RESEARCH'||u.productionAuthority!==false||u.notARecommendation!==true)throw new Error('DEPLOYED_UI_BOUNDARY_FAILED');
          if(p.authorityMode!=='RESEARCH'||p.productionAuthority!==false||p.automaticOrders!==false||p.sourceStrategySnapshotHash!==s.strategySnapshotHash)throw new Error('DEPLOYED_PUBLICATION_BOUNDARY_FAILED');
          if(l.authorityMode!=='RESEARCH'||l.productionAuthority!==false)throw new Error('DEPLOYED_LIVE_BOUNDARY_FAILED');
          if(shadow.productionAuthority!==false||shadow.automaticOrders!==false)throw new Error('DEPLOYED_SHADOW_BOUNDARY_FAILED');
          if(policy.strategySnapshotHash!==s.strategySnapshotHash||policy.sameBarAmbiguity!=='STOP_FIRST'||policy.costAssumptionBps!==25)throw new Error('DEPLOYED_FORWARD_POLICY_FAILED');
          const x=sim.performance?.allDailySignals;
          if(!x||x.triggered!==450||x.target1OrBetter!==243||x.stops!==157||x.timeouts!==50)throw new Error('DEPLOYED_KPI_BASELINE_MISMATCH');
          const chartLoader=fs.readFileSync(path.join(root,'technical-chart-v2.js'),'utf8'),chartAlign=fs.readFileSync(path.join(root,'technical-chart-v21-alignment.js'),'utf8'),kpi=fs.readFileSync(path.join(root,'realized-kpi.js'),'utf8'),champ=fs.readFileSync(path.join(root,'championship-board.js'),'utf8');
          if(!chartLoader.includes('EGXOneTechnicalV2Loader')||!chartLoader.includes('championship-board.js')||!chartAlign.includes('EGXOneTechnicalV21')||!chartAlign.includes('READY_RESEARCH_EXACT_SESSION_ONLY')||!kpi.includes('EGXOneRealizedKPI')||!champ.includes('EGXOneChampionshipBoard'))throw new Error('DEPLOYED_UI_MODULE_CONTRACT_FAILED');
          await import(`file://${path.join(root,'championship-board.js')}`);
          const c=globalThis.EGXOneChampionshipBoard.buildComparison(sim,shadow);
          if(!c.sameDateScope||!c.exactLegacy||!c.policyAllows||c.score.qualifiedMetrics!==1||c.score.leader!=='EGX ONE')throw new Error(`DEPLOYED_CHAMPIONSHIP_FAILED:${JSON.stringify(c.score)}`);
          console.log(`DEPLOYED_EGX_ONE_COMPLETE_VERIFIED:${s.signalSession}:${s.recommendations.length}:MANIFEST=${bundleManifestHash}:TARGET=${x.target1HitRatePct}:STOP=${x.stopRatePct}:CHAMPION=${c.score.leader}:COMMON=${c.current.commonSignalDates}:EGX=${c.current.targetHitRatePct}:V16=${c.v16.targetHitRatePct}:SCORE=${c.score.current}-${c.score.v16}`);
          NODE

      - name: Deployment summary
        shell: bash
        env:
          AUTH: ${{ steps.auth.outputs.available }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '## EGX ONE Production Deploy' >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTH" = 'true' ]; then
            echo '- Status: VERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
            echo '- Integrity: production manifest + SHA256 byte-for-byte verification' >> "$GITHUB_STEP_SUMMARY"
            echo '- Chart: V2.1 current-session fail-closed alignment' >> "$GITHUB_STEP_SUMMARY"
            echo '- KPI: day-by-day realized Target / Stop / Timeout' >> "$GITHUB_STEP_SUMMARY"
            echo '- Championship: EGX ONE vs V16.9, auditable common-date scoring only' >> "$GITHUB_STEP_SUMMARY"
            echo '- Forward: frozen policy + shadow ledger included' >> "$GITHUB_STEP_SUMMARY"
            echo '- Authority: RESEARCH_ONLY / Production LOCKED / Automatic Orders DISABLED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Status: DEPLOYMENT BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '- Reason: VERCEL_TOKEN_MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo '- Exact production-ready bundle was still built, hashed and uploaded as a workflow artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi

name: EGX ONE Production UI Deploy

on:
  workflow_dispatch:
  push:
    branches: ['egx-one/clean-room-v0']
    paths:
      - 'index.html'
      - 'technical-chart-v2.js'
      - 'data/research/ui/latest.json'
      - 'data/research/strategy/latest.json'
      - 'data/research/published/latest.json'
      - '.github/workflows/egx-one-production-ui-deploy.yml'

permissions:
  contents: read

concurrency:
  group: egx-one-production-ui-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_PROJECT_ID: prj_R9NlULz7vTKPEWeoVB9vnRaanqFo
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1

      - name: Build session-bound production UI bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-one-live
          mkdir -p /tmp/egx-one-live/data/research/ui /tmp/egx-one-live/data/research/strategy /tmp/egx-one-live/data/research/published /tmp/egx-one-live/.vercel
          cp index.html /tmp/egx-one-live/index.html
          cp technical-chart-v2.js /tmp/egx-one-live/technical-chart-v2.js
          cp data/research/ui/latest.json /tmp/egx-one-live/data/research/ui/latest.json
          cp data/research/strategy/latest.json /tmp/egx-one-live/data/research/strategy/latest.json
          cp data/research/published/latest.json /tmp/egx-one-live/data/research/published/latest.json
          printf '%s\n' '{"cleanUrls":true,"trailingSlash":false}' > /tmp/egx-one-live/vercel.json
          printf '%s\n' '{"projectId":"'"$VERCEL_PROJECT_ID"'","orgId":"'"$VERCEL_ORG_ID"'"}' > /tmp/egx-one-live/.vercel/project.json
          test -s /tmp/egx-one-live/index.html
          test -s /tmp/egx-one-live/technical-chart-v2.js
          test -s /tmp/egx-one-live/data/research/ui/latest.json
          test -s /tmp/egx-one-live/data/research/strategy/latest.json
          test -s /tmp/egx-one-live/data/research/published/latest.json
          node - <<'NODE'
          const s=require('/tmp/egx-one-live/data/research/strategy/latest.json');
          const p=require('/tmp/egx-one-live/data/research/published/latest.json');
          const u=require('/tmp/egx-one-live/data/research/ui/latest.json');
          if(s.signalSession!==p.signalSession||s.signalSession!==u.session)throw new Error('BUNDLE_SESSION_MISMATCH');
          if(s.productionAuthority!==false||s.automaticOrders!==false||p.productionAuthority!==false||p.automaticOrders!==false||u.productionAuthority!==false)throw new Error('BUNDLE_AUTHORITY_BOUNDARY_FAILED');
          if(!Array.isArray(s.recommendations)||!s.recommendations.length)throw new Error('BUNDLE_RECOMMENDATIONS_MISSING');
          console.log(`BUNDLE_SESSION:${s.signalSession}:RECS:${s.recommendations.length}`);
          NODE

      - name: Verify deploy credential availability
        id: auth
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'DEPLOYMENT_BLOCKED:VERCEL_TOKEN_MISSING'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_DEPLOY_CREDENTIAL:AVAILABLE'
          fi

      - name: Install pinned Vercel CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global vercel@59.10.0

      - name: Deploy same EGX ONE project to production
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd /tmp/egx-one-live | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DEPLOYMENT_URL:$url"

      - name: Verify deployed session authority-safe UI and Technical V2
        if: steps.auth.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/")"
          printf '%s' "$html" | grep -q 'Unified Decision Center'
          printf '%s' "$html" | grep -q 'PRODUCTION LOCKED'
          printf '%s' "$html" | grep -q 'technical-chart-v2.js'
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/technical-chart-v2.js" > /tmp/tech.js
          grep -q 'EGXOneTechnicalV2' /tmp/tech.js
          grep -q 'TECHNICAL VISUALIZATION V2' /tmp/tech.js
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/ui/latest.json" > /tmp/ui.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/strategy/latest.json" > /tmp/strategy.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/published/latest.json" > /tmp/published.json
          node - <<'NODE'
          const fs=require('fs');
          const u=JSON.parse(fs.readFileSync('/tmp/ui.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/strategy.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/published.json','utf8'));
          if(u.authorityMode!=='RESEARCH'||u.researchOnly!==true||u.productionAuthority!==false||u.notARecommendation!==true)throw new Error('DEPLOYED_UI_AUTHORITY_BOUNDARY_FAILED');
          if(s.authorityMode!=='RESEARCH'||s.productionAuthority!==false||s.automaticOrders!==false||s.validation?.accepted!==true||!s.recommendations?.length)throw new Error('DEPLOYED_STRATEGY_BOUNDARY_FAILED');
          if(p.authorityMode!=='RESEARCH'||p.productionAuthority!==false||p.automaticOrders!==false)throw new Error('DEPLOYED_PUBLICATION_BOUNDARY_FAILED');
          if(s.signalSession!==p.signalSession||s.signalSession!==u.session)throw new Error('DEPLOYED_SESSION_MISMATCH');
          if(p.sourceStrategySnapshotHash!==s.strategySnapshotHash)throw new Error('DEPLOYED_LINEAGE_MISMATCH');
          console.log(`DEPLOYED_EGX_ONE_VERIFIED:${s.signalSession}:${s.recommendations.length}:${s.strategySnapshotHash}`);
          NODE

      - name: Deployment summary
        shell: bash
        env:
          AUTH: ${{ steps.auth.outputs.available }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$AUTH" = 'true' ]; then
            echo '## EGX ONE Production UI Deploy' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: VERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
            echo '- Technical chart: V2' >> "$GITHUB_STEP_SUMMARY"
            echo '- Authority: RESEARCH_ONLY / Production Phase 4 LOCKED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## EGX ONE Production UI Deploy' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '- Reason: VERCEL_TOKEN_MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo '- Build remains ready for direct connected Vercel deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

name: EGX ONE Production UI Deploy

on:
  workflow_dispatch:
  push:
    branches: ['egx-one/clean-room-v0']
    paths:
      - 'index.html'
      - 'technical-chart-v2.js'
      - 'technical-chart-v2-core.js'
      - 'technical-chart-v21-alignment.js'
      - 'realized-kpi.js'
      - 'scripts/prepare-egx-one-live-bundle.sh'
      - 'data/research/live/latest.json'
      - 'data/research/ui/latest.json'
      - 'data/research/strategy/latest.json'
      - 'data/research/published/latest.json'
      - 'data/research/simulator/latest.json'
      - 'data/research/shadow-ledger/latest.json'
      - '.github/workflows/egx-one-production-ui-deploy.yml'

permissions:
  contents: read

concurrency:
  group: egx-one-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: prj_R9NlULz7vTKPEWeoVB9vnRaanqFo
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify clean-room contracts
        run: npm test

      - name: Build and verify complete session-bound live bundle
        run: bash scripts/prepare-egx-one-live-bundle.sh /tmp/egx-one-live

      - name: Verify deploy credential availability
        id: auth
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'DEPLOYMENT_BLOCKED:VERCEL_TOKEN_MISSING'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_DEPLOY_CREDENTIAL:AVAILABLE'
          fi

      - name: Install pinned Vercel CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global vercel@59.10.0

      - name: Deploy complete EGX ONE bundle to production
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd /tmp/egx-one-live | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DEPLOYMENT_URL:$url"

      - name: Verify live recommendations chart V2.1 KPI and authority boundary
        if: steps.auth.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/technical-chart-v2.js" -o /tmp/chart-loader.js
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/technical-chart-v2-core.js" -o /tmp/chart-core.js
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/technical-chart-v21-alignment.js" -o /tmp/chart-align.js
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/realized-kpi.js" -o /tmp/realized-kpi.js
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/live/latest.json" -o /tmp/research-live.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/ui/latest.json" -o /tmp/research-ui.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/strategy/latest.json" -o /tmp/research-strategy.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/published/latest.json" -o /tmp/research-published.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/simulator/latest.json" -o /tmp/research-simulator.json
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/data/research/shadow-ledger/latest.json" -o /tmp/research-shadow.json
          grep -q 'EGXOneTechnicalV2Loader' /tmp/chart-loader.js
          grep -q 'EGXOneTechnicalV21' /tmp/chart-align.js
          grep -q 'READY_RESEARCH_EXACT_SESSION_ONLY' /tmp/chart-align.js
          grep -q 'EGXOneRealizedKPI' /tmp/realized-kpi.js
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const l=JSON.parse(fs.readFileSync('/tmp/research-live.json','utf8'));
          const u=JSON.parse(fs.readFileSync('/tmp/research-ui.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/research-strategy.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/research-published.json','utf8'));
          const sim=JSON.parse(fs.readFileSync('/tmp/research-simulator.json','utf8'));
          const shadow=JSON.parse(fs.readFileSync('/tmp/research-shadow.json','utf8'));
          if(s.signalSession!==u.session||s.signalSession!==p.signalSession||s.signalSession!==l.expectedSession||s.signalSession!==l.targetSession)throw new Error('DEPLOYED_SESSION_MISMATCH');
          if(s.authorityMode!=='RESEARCH'||s.productionAuthority!==false||s.automaticOrders!==false||s.validation?.accepted!==true||!s.recommendations?.length)throw new Error('DEPLOYED_STRATEGY_BOUNDARY_FAILED');
          if(u.authorityMode!=='RESEARCH'||u.productionAuthority!==false||u.notARecommendation!==true)throw new Error('DEPLOYED_UI_BOUNDARY_FAILED');
          if(p.authorityMode!=='RESEARCH'||p.productionAuthority!==false||p.automaticOrders!==false)throw new Error('DEPLOYED_PUBLICATION_BOUNDARY_FAILED');
          if(l.authorityMode!=='RESEARCH'||l.productionAuthority!==false)throw new Error('DEPLOYED_LIVE_BOUNDARY_FAILED');
          if(shadow.productionAuthority!==false||shadow.automaticOrders!==false)throw new Error('DEPLOYED_SHADOW_BOUNDARY_FAILED');
          if(p.sourceStrategySnapshotHash!==s.strategySnapshotHash)throw new Error('DEPLOYED_LINEAGE_MISMATCH');
          const x=sim.performance?.allDailySignals;
          if(!x||x.triggered!==450||x.target1OrBetter!==243||x.stops!==157||x.timeouts!==50)throw new Error('DEPLOYED_KPI_BASELINE_MISMATCH');
          console.log(`DEPLOYED_EGX_ONE_COMPLETE_VERIFIED:${s.signalSession}:${s.recommendations.length}:TARGET=${x.target1HitRatePct}:STOP=${x.stopRatePct}`);
          NODE

      - name: Deployment summary
        shell: bash
        env:
          AUTH: ${{ steps.auth.outputs.available }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo '## EGX ONE Production Deploy' >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUTH" = 'true' ]; then
            echo '- Status: VERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
            echo '- Chart: V2.1 current-session fail-closed alignment' >> "$GITHUB_STEP_SUMMARY"
            echo '- KPI: day-by-day realized Target / Stop / Timeout' >> "$GITHUB_STEP_SUMMARY"
            echo '- Authority: RESEARCH_ONLY / Production LOCKED / Automatic Orders DISABLED' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Status: DEPLOYMENT BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '- Reason: VERCEL_TOKEN_MISSING' >> "$GITHUB_STEP_SUMMARY"
            echo '- Complete bundle and tests remain ready for connected direct deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

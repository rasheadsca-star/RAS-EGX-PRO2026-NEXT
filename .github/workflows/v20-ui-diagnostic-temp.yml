name: V20 UI Contract Diagnostic TEMP

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-ui-diagnostic-temp.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Reproduce integrated runtime through UI validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
          )
          for rel in "${paths[@]}"; do
            mkdir -p "$(dirname "$rel")"
            git show "$V17_SHA:$rel" > "$rel"
          done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" node scripts/v20/validate-v17-runtime-sync.cjs
          node scripts/v20/apply-null-semantics-hardening.cjs
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs
          V20_REGIME_NETWORK_REFRESH=true V20_REGIME_CONCURRENCY=6 V20_REGIME_MIN_PARTICIPATION_PCT=60 V20_REGIME_PRICE_TOLERANCE_PCT=5 V20_REGIME_MIN_TRUSTED_SESSIONS=50 V20_REGIME_FETCH_RANGE=6mo node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-regression.cjs
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs
          V20_HISTORY_NETWORK_REFRESH=true V20_HISTORY_CONCURRENCY=4 V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT=5 node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/null-semantics-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs
          node scripts/v20/archive-signal.cjs
          node scripts/v20/build-v18-performance-audit.cjs
          node scripts/v20/v18-performance-audit-regression.cjs
          node scripts/v20/build-performance-evidence-registry.cjs
          node scripts/v20/performance-evidence-regression.cjs
          node scripts/v20/regression.cjs
          node scripts/v20/trade-plan-regression.cjs
          node scripts/v20/phase3-regression.cjs
          set +e
          node scripts/v20/validate-ui.cjs
          rc=$?
          set -e
          test -f data/v20/ui-validation.json
          cat data/v20/ui-validation.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20/ui-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record V20 runtime UI diagnostic [skip ci]"
            git push origin HEAD:develop/v20-integrated-decision-platform
          fi
          exit "$rc"

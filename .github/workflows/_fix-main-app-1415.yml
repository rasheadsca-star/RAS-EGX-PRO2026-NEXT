name: One-time MAIN APP 14:15 Cairo schedule fix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/_fix-main-app-1415.yml"

permissions:
  contents: write

jobs:
  patch-main-app-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MAIN APP nominal Cairo slot to 14:15
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/v16-daily-recommendation-scan.yml'): [
                  ('# 14:00 Cairo', '# 14:15 Cairo'),
                  ('- cron: "0 11,12 * * 0-4"', '- cron: "15 11,12 * * 0-4"'),
                  ('requested nominal slots (10:15 and 14:00 Cairo).', 'requested nominal slots (10:15 and 14:15 Cairo).'),
                  ('if [ "$HOUR" = "14" ] && [ "$MINUTE" -le 45 ]; then RUN=true; fi', 'if [ "$HOUR" = "14" ] && [ "$MINUTE" -ge 10 ] && [ "$MINUTE" -le 45 ]; then RUN=true; fi'),
                  ("cairoSlots:['10:15','14:00']", "cairoSlots:['10:15','14:15']"),
              ],
              Path('scripts/stable/v16-main-app-auto-data-guard.cjs'): [
                  ('scheduled1400:/(14:00 Cairo|0 11,12 \\* \\* 0-4)/.test(wf)', 'scheduled1415:/(14:15 Cairo|15 11,12 \\* \\* 0-4)/.test(wf)'),
              ],
              Path('scripts/stable/v16-main-app-governance.cjs'): [
                  ("nominalCairoSlots: ['10:15', '14:00']", "nominalCairoSlots: ['10:15', '14:15']"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print(f'patched {path}')
              if text == original:
                  raise SystemExit(f'{path}: no changes applied')

          wf = Path('.github/workflows/v16-daily-recommendation-scan.yml').read_text(encoding='utf-8')
          assert '# 14:15 Cairo' in wf
          assert '- cron: "15 11,12 * * 0-4"' in wf
          assert "cairoSlots:['10:15','14:15']" in wf
          assert '14:00 Cairo' not in wf
          print('MAIN APP 14:15 schedule assertions PASS')
          PY

      - name: Validate patched schedule guards
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-main-app-auto-data-guard.cjs
          node --check scripts/stable/v16-main-app-governance.cjs
          node scripts/stable/v16-main-app-auto-data-guard.cjs

      - name: Commit 14:15 schedule and remove one-time fixer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_fix-main-app-1415.yml
          git add .github/workflows/v16-daily-recommendation-scan.yml scripts/stable/v16-main-app-auto-data-guard.cjs scripts/stable/v16-main-app-governance.cjs data/stable/v16-main-app-auto-data-guard.json
          git commit -m "Set MAIN APP Cairo update slot to 14:15"
          git pull --rebase -X ours origin main
          git push origin HEAD:main

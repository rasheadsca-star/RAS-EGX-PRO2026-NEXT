name: EGX Market Segment Attachment Probe

on:
  push:
    branches: [egx-one/clean-room-v0]
    paths:
      - .github/workflows/egx-market-segment-attachment-probe.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Capture announcement pages and exact attachment mirrors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/egx-market-segments/files artifacts/egx-market-segments/mirrors
          python - <<'PY'
          from pathlib import Path
          import subprocess,re,json,hashlib,datetime,urllib.parse,time

          OUT=Path('artifacts/egx-market-segments'); FILES=OUT/'files'; MIRRORS=OUT/'mirrors'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          seeds=[
            'https://www.sigma-cap.com/main/news_page_exact?newsId=46079222&newsType=EGX',
            'https://www.okazinvest.com/okaz/newDetails.aspx?id=1262678&nb=2',
          ]
          names=['active_market_01-09-26_english.pdf','short_selling_01-09-26_english.pdf','medium_market_01-09-26_english.pdf','inactive_market_01-09-26_english.pdf','tamayuz_01-09-26_english.pdf','smes_01-09-26_english.pdf']
          mirror_bases=[
            'https://www.egx.com.eg/downloads/', 'http://www.egx.com.eg/downloads/',
            'https://www.sigma-cap.com/downloads/', 'https://sigma-cap.com/downloads/',
            'https://sigmacapital.com.eg/downloads/', 'https://www.sigmacapital.com.eg/downloads/',
            'https://www.sigmasecurities.com.eg/downloads/', 'https://www.sigma-capital.com/downloads/'
          ]
          def get(url,path,accept='*/*',referer=None):
              cmd=['curl','-L','-sS','--compressed','--connect-timeout','7','--max-time','35','--retry','2','--retry-all-errors','--retry-delay','1','-A',UA,'-H',f'Accept: {accept}']
              if referer: cmd += ['-H',f'Referer: {referer}']
              cmd += ['-D',str(path)+'.headers','-o',str(path),'-w','%{http_code}|%{url_effective}|%{content_type}',url]
              p=subprocess.run(cmd,capture_output=True,text=True)
              raw=path.read_bytes() if path.exists() else b''; parts=(p.stdout or '').split('|',2)
              return {'requestedUrl':url,'status':parts[0] if parts else '','effectiveUrl':parts[1] if len(parts)>1 else '', 'contentType':parts[2] if len(parts)>2 else '', 'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest() if raw else None,'pdfSignature':raw.startswith(b'%PDF-'),'stderr':p.stderr[-1200:] if p.stderr else ''}

          page_receipts=[]; candidates=[]
          for i,url in enumerate(seeds):
              f=OUT/f'page-{i}.html'; rec=get(url,f,'text/html,*/*;q=0.8'); page_receipts.append(rec)
              txt=f.read_text(errors='ignore') if f.exists() else ''; base=rec.get('effectiveUrl') or url
              for val in re.findall(r'(?i)(?:href|src)\s*=\s*["\']([^"\']+)["\']',txt):
                  u=urllib.parse.urljoin(base,val.strip()); low=u.lower()
                  if any(x in low for x in ('.pdf','.xlsx','.xls','.csv','.docx','.doc','attachment','download','uploads','upload','files/')) and u not in candidates: candidates.append(u)
              for val in re.findall(r'https?://[^"\'<>\s]+',txt):
                  val=val.replace('&amp;','&'); low=val.lower()
                  if any(x in low for x in ('.pdf','.xlsx','.xls','.csv','.docx','.doc','attachment','download')) and val not in candidates: candidates.append(val)

          file_receipts=[]
          for i,u in enumerate(candidates[:100]):
              ext=Path(urllib.parse.urlparse(u).path).suffix.lower(); ext=ext if ext in ('.pdf','.xlsx','.xls','.csv','.docx','.doc') else '.bin'
              f=FILES/f'{i:03d}{ext}'; rec=get(u,f,'*/*',seeds[0]); rec['localFile']=str(f); file_receipts.append(rec)

          mirror_receipts=[]
          n=0
          for name in names:
              for base in mirror_bases:
                  u=base+name; f=MIRRORS/f'{n:03d}-{name}'; n+=1
                  rec=get(u,f,'application/pdf,*/*;q=0.8',seeds[0]); rec['name']=name; rec['base']=base; rec['localFile']=str(f); mirror_receipts.append(rec)
                  if rec['pdfSignature']:
                      # enough; preserve first valid mirror for this filename and stop hammering mirrors
                      break
                  time.sleep(.08)

          excerpts=[]
          terms=['Most Active','Medium Activity','Inactive','SME','TAMAYUZ','NILE','نشاط','تميز','بورصة النيل','غير نشطة']
          for i in range(len(seeds)):
              f=OUT/f'page-{i}.html'; txt=f.read_text(errors='ignore') if f.exists() else ''
              cleaned=re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',txt,flags=re.I); cleaned=re.sub(r'<[^>]+>',' ',cleaned); cleaned=re.sub(r'\s+',' ',cleaned)
              for term in terms:
                  pos=cleaned.lower().find(term.lower())
                  if pos>=0: excerpts.append({'page':i,'term':term,'text':cleaned[max(0,pos-700):pos+2200]})

          valid=[x for x in mirror_receipts if x['pdfSignature']]
          report={'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'pages':page_receipts,'candidateLinks':candidates,'files':file_receipts,'mirrorReceipts':mirror_receipts,'validPdfMirrors':valid,'excerpts':excerpts,'productionAuthority':False,'phase4Open':False}
          (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'candidateCount':len(candidates),'validPdfCount':len(valid),'validPdfMirrors':[{'name':x['name'],'url':x['requestedUrl'],'bytes':x['bytes'],'sha256':x['sha256']} for x in valid],'productionAuthority':False,'phase4Open':False},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: egx-market-segment-attachments
          path: artifacts/egx-market-segments/**/*
          if-no-files-found: error

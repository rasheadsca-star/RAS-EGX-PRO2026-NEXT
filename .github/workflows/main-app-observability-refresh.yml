name: MAIN APP — Audit Drift Shadow Refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EGX MAIN APP V16.9.2 P2 Automatic Scan"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "scripts/stable/v16-main-app-intelligence-snapshot.cjs"
      - "scripts/stable/v16-main-app-intelligence-snapshot-v3.cjs"
      - "scripts/stable/v16-main-app-financial-resolver.cjs"
      - "scripts/stable/v16-main-app-drift-monitor.cjs"
      - "scripts/stable/v16-main-app-challenger-shadow.cjs"
      - "scripts/stable/v16-main-app-pilot-lock-guard.cjs"
      - "scripts/stable/v16-main-app-auto-data-guard.cjs"
      - "scripts/stable/v16-main-app-professional-readiness.cjs"
      - "scripts/stable/v16-main-app-professional-coverage-finalizer.cjs"
      - ".github/workflows/main-app-observability-refresh.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-app-v169-observability-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest MAIN APP
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate non-alpha modules
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-main-app-financial-resolver.cjs
          node --check scripts/stable/v16-main-app-intelligence-snapshot-v3.cjs
          node --check scripts/stable/v16-main-app-drift-monitor.cjs
          node --check scripts/stable/v16-main-app-challenger-shadow.cjs
          node --check scripts/stable/v16-main-app-pilot-lock-guard.cjs
          node --check scripts/stable/v16-main-app-auto-data-guard.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs
          node --check scripts/stable/v16-main-app-professional-coverage-finalizer.cjs

      - name: Capture production decision fingerprint before observability
        id: before
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(sha256sum data/stable/v16-v169-primary-decision.json | awk '{print $1}')
          echo "primary_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Production decision hash before observability: $HASH"

      - name: Enforce frozen V16.9 pilot methodology
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-pilot-lock-guard.cjs

      - name: Verify automatic market data refresh remains mandatory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-auto-data-guard.cjs

      - name: Build no-lookahead multi-source intelligence snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-intelligence-snapshot-v3.cjs

      - name: Build advisory drift monitor
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-drift-monitor.cjs

      - name: Build confirmation challenger in shadow only
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-challenger-shadow.cjs

      - name: Rebuild Professional Readiness V2
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-professional-readiness.cjs
          node scripts/stable/v16-main-app-professional-coverage-finalizer.cjs

      - name: Prove production decision and strategy were not changed
        env:
          BEFORE_HASH: ${{ steps.before.outputs.primary_hash }}
        shell: bash
        run: |
          set -euo pipefail
          AFTER_HASH=$(sha256sum data/stable/v16-v169-primary-decision.json | awk '{print $1}')
          [ "$BEFORE_HASH" = "$AFTER_HASH" ] || { echo "Production recommendation file mutated by observability layer"; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const lock=read('data/stable/v16-main-app-pilot-lock-status.json');
          const auto=read('data/stable/v16-main-app-auto-data-guard.json');
          const intel=read('data/stable/v16-main-app-intelligence-snapshot.json');
          const financialCache=read('data/stable/v16-main-app-financial-cache.json');
          const drift=read('data/stable/v16-main-app-drift-monitor.json');
          const challenger=read('data/stable/v16-main-app-challenger-shadow.json');
          const price=read('data/stable/v15-price-truth.json');
          const readiness=read('data/stable/v16-main-app-professional-readiness.json');
          if(lock.status!=='PASS') throw new Error('Pilot methodology lock failed');
          if(auto.status!=='PASS') throw new Error('Automatic data refresh guard failed');
          if(intel?.immutableMethodology?.changesAlphaOrRanking!==false) throw new Error('Intelligence layer may not change alpha/ranking');
          if(intel?.immutableMethodology?.changesExecutionGrant!==false) throw new Error('Intelligence layer may not change execution');
          if(intel?.auditCompleteness?.noPostDecisionFinancialDataCounted!==true) throw new Error('Financial audit may not use post-decision data');
          if(intel?.auditCompleteness?.noPostDecisionNewsCounted!==true) throw new Error('News audit may not use post-decision news');
          if(financialCache?.policy?.changesAlphaOrRanking!==false || financialCache?.policy?.changesExecutionGrant!==false) throw new Error('Financial cache may not affect production');
          if(drift?.immutableMethodology?.changesAlphaOrRanking!==false || drift.productionEffect!=='NONE') throw new Error('Drift monitor must be advisory only');
          if(challenger.mode!=='SHADOW_RESEARCH_ONLY') throw new Error('Challenger is not shadow-only');
          if(challenger?.immutableMethodology?.changesMainAppRanking!==false || challenger?.immutableMethodology?.changesExecutionGrant!==false) throw new Error('Challenger may not affect MAIN APP');
          if(price?.professionalCoverage?.complete===true){
            const data=(readiness.axes||[]).find(a=>a.id==='DATA_SESSION_INTEGRITY');
            if(Number(data?.scorePct)!==100) throw new Error('Completed professional coverage was not preserved in readiness');
          }
          console.log({pilotLock:lock.status,autoData:auto.status,intelligenceCoverage:intel.auditCompleteness,financialCacheRecords:Object.keys(financialCache.records||{}).length,drift:drift.status,challengerMode:challenger.mode,professionalCoverage:price?.professionalCoverage||null});
          NODE

      - name: Commit observability evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stable/v16-main-app-pilot-lock-status.json \
            data/stable/v16-main-app-auto-data-guard.json \
            data/stable/v16-main-app-financial-cache.json \
            data/stable/v16-main-app-intelligence-snapshot.json \
            data/stable/v16-main-app-intelligence-ledger.json \
            data/stable/v16-main-app-drift-monitor.json \
            data/stable/v16-main-app-challenger-shadow.json \
            data/stable/v16-main-app-challenger-ledger.json \
            data/stable/v16-main-app-professional-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MAIN APP audit drift and shadow evidence"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Publish latest MAIN APP evidence to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref main

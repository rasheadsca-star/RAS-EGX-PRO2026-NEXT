name: V20 Extended Pages Evidence Persist

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-extended-pages-evidence.yml"

permissions:
  contents: write

jobs:
  persist-browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Verify temporary workflows are isolated to V20
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v20-integrated-decision-platform"
          git fetch --no-tags --depth=1 origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt
          changed="$(git diff --name-only origin/v19-egx-chat-gpt HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\.github/workflows/v20-integrated-decision-platform\.yml$|\.github/workflows/v20-market-regime\.yml$|\.github/workflows/v20-extended-pages-smoke\.yml$|\.github/workflows/v20-extended-pages-evidence\.yml$)' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - name: Validate scripts
        run: |
          node --check scripts/v20/extended-pages-smoke.cjs
          node --check v20/backtest.js
          node --check v20/history.js
          node --check v20/remediation.js
          node --check v20/top5.js
      - name: Run real Chrome extended acceptance
        run: node scripts/v20/extended-pages-smoke.cjs
      - name: Verify evidence
        run: |
          node -e "const r=require('./data/v20/extended-pages-smoke.json'); if(r.ok!==true||r.failedCount!==0||(r.consoleErrors||[]).length) process.exit(1)"
      - name: Persist evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20/extended-pages-smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "Update V20 extended pages browser evidence"
          git fetch origin develop/v20-integrated-decision-platform
          git rebase origin/develop/v20-integrated-decision-platform
          git push origin HEAD:develop/v20-integrated-decision-platform

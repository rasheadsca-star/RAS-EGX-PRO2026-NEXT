name: V17 Historical Recovery Post-Market Review

on:
  workflow_dispatch:
  schedule:
    # Dual UTC triggers cover Cairo standard/daylight time; the script gates by Africa/Cairo.
    - cron: "15 12,13 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v17-historical-recovery-post-market
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Cairo-aware execution gate
        id: gate
        shell: bash
        run: |
          node scripts/v17/historical-recovery/intelligence/monitor.cjs --mode POST_MARKET --execute-if-window
          ELIGIBLE="$(node -e "const {shouldRunScheduledMode}=require('./scripts/v17/historical-recovery/intelligence/exchange-calendar.cjs');process.stdout.write(String(shouldRunScheduledMode('POST_MARKET')))" )"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ELIGIBLE=true; fi
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
      - name: Refresh curated V17 evidence artifacts fail-safe
        if: steps.gate.outputs.eligible == 'true'
        run: |
          node scripts/v17/historical-recovery/acquisition/orchestration/build.cjs
          node scripts/v17/historical-recovery/acquisition/orchestration/validate.cjs
      - name: Build new immutable V17 research snapshot
        if: steps.gate.outputs.eligible == 'true'
        run: |
          node scripts/v17/historical-recovery/intelligence/build.cjs
          node scripts/v17/historical-recovery/acquisition/orchestration/report.cjs
      - name: Complete scanner and intelligence validation
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          node --test tests/v17/historical-recovery*.test.cjs
          node scripts/v17/historical-recovery/acquisition/orchestration/validate.cjs
          node scripts/v17/historical-recovery/long-history/validate-compact.cjs
          node scripts/v17/historical-recovery/fundamentals/validate.cjs
          node scripts/v17/historical-recovery/news/validate.cjs
          node scripts/v17/historical-recovery/intelligence/validate.cjs
          node scripts/v17/historical-recovery/intelligence/validate-history.cjs
          node --check preview-v17/historical-recovery/app.js
          git diff --check
      - name: Frozen-path and shared-production gate
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          mapfile -t CHANGED < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          node scripts/v17/frozen-path-check.cjs --allow-empty "${CHANGED[@]}"
      - name: Browser path smoke test
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/v17-recovery-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/preview-v17/historical-recovery/ | grep -q "ماسح التعافي التاريخي للأسهم"
          curl --fail --silent http://127.0.0.1:4173/data/v17/historical-recovery/integrated-market.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(!x.researchOnly||x.results.length!==x.summary.canonicalEquityUniverse)process.exit(1)})"
      - name: Commit only validated Historical Recovery artifacts
        if: steps.gate.outputs.eligible == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v17/historical-recovery/acquisition/current.json data/v17/historical-recovery/acquisition/pilot-report.json data/v17/historical-recovery/fundamentals/verified-input.json data/v17/historical-recovery/news/verified-events.json data/v17/historical-recovery/integrated-market.json data/v17/historical-recovery/fundamentals/current.json data/v17/historical-recovery/news/current.json data/v17/historical-recovery/intelligence/
          if ! git diff --cached --quiet; then
            git commit -m "chore(v17): refresh integrated recovery research"
            for ATTEMPT in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              [ "$ATTEMPT" = "3" ] && exit 1
              sleep $((ATTEMPT * 6))
            done
          fi
      - name: Upload validated Pages artifact
        if: steps.gate.outputs.eligible == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: . }

  deploy:
    if: needs.build-validate.outputs.eligible == 'true'
    needs: build-validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/preview-v17/historical-recovery/
    steps:
      - uses: actions/deploy-pages@v4

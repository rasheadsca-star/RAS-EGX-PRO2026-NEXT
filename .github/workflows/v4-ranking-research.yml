name: V4 transparent ranking research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-ranking-research.yml'
      - 'scripts/paper-v4/build-ranking-forward.cjs'
      - 'tests/paper-v4/ranking-regression.cjs'
      - 'scripts/paper-v4/build-market-governor.cjs'
  schedule:
    - cron: '35 16 * * 0-4'
permissions:
  contents: write
concurrency:
  group: v4-ranking-research
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research ranking regression guards
        run: node tests/paper-v4/ranking-regression.cjs
      - name: Build ranked full-universe research
        run: node scripts/paper-v4/build-ranking-forward.cjs && node scripts/paper-v4/build-market-governor.cjs
      - name: Check expected shape and coverage
        run: |
          node -e "const x=require('./data/paper-v4/ranking-latest.json');if(!x.beforeFilters.length||!x.latestSession||!x.beforeFilters.some(y=>y.ticker==='AMOC')||!x.beforeFilters.some(y=>y.ticker==='ENGC'))process.exit(1);console.log(x.latestSession,x.counts)"
      - name: Validate governor weights and fail-closed policy
        run: |
          node -e "const x=require('./data/paper-v4/market-governor-latest.json');if(x.components.reduce((s,a)=>s+a.weight,0)!==100||x.filtersAppliedToAll<100||x.compositeScore===null&&x.newEntriesAllowed)process.exit(1);console.log(x.componentCoveragePct,x.marketRegime)"
      - name: Commit dated research result without changing frozen V4
        run: |
          if ! git diff --quiet -- data/paper-v4/ranking-latest.json data/paper-v4/market-governor-latest.json || [ -n "$(git ls-files --others --exclude-standard data/paper-v4/ranking-latest.json data/paper-v4/market-governor-latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paper-v4/ranking-latest.json data/paper-v4/market-governor-latest.json
            git commit -m "Refresh V4 transparency ranking research"
            # Concurrent workflows may update main while this job runs.
            # Rebase this single generated artifact onto the latest remote head.
            # Never force-push; fail if a genuine conflict requires review.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase conflict: preserve remote changes and require manual review."
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Ranking result published successfully."
                exit 0
              fi
              sleep 3
            done
            echo "Push rejected after safe rebase retries."
            exit 1
          fi

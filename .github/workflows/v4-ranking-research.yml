name: V4 transparent ranking research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-ranking-research.yml'
      - 'scripts/paper-v4/build-ranking-forward.cjs'
  schedule:
    - cron: '35 16 * * 0-4'
permissions:
  contents: write
concurrency:
  group: v4-ranking-research
  cancel-in-progress: false
jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build ranked full-universe research
        run: node scripts/paper-v4/build-ranking-forward.cjs
      - name: Check expected shape and coverage
        run: |
          node -e "const x=require('./data/paper-v4/ranking-latest.json');if(!x.beforeFilters.length||!x.latestSession||!x.beforeFilters.some(y=>y.ticker==='AMOC')||!x.beforeFilters.some(y=>y.ticker==='ENGC'))process.exit(1);console.log(x.latestSession,x.counts)"
      - name: Commit dated research result without changing frozen V4
        run: |
          if ! git diff --quiet -- data/paper-v4/ranking-latest.json || [ -n "$(git ls-files --others --exclude-standard data/paper-v4/ranking-latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/paper-v4/ranking-latest.json
            git commit -m "Refresh V4 transparency ranking research"
            git push
          fi

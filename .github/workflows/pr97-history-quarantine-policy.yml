name: PR97 History Quarantine Policy Gate
on:
  pull_request:
    paths:
      - 'scripts/stable/history-quarantine-policy.cjs'
      - 'tests/stable/history-quarantine-policy.test.cjs'
      - 'scripts/stable/history-publication-gate.cjs'
      - 'tests/stable/history-publication-gate.test.cjs'
      - 'scripts/stable/history-r8-integrity.cjs'
      - 'tests/stable/history-r8-integrity.test.cjs'
      - 'scripts/stable/history-r9-report-binding.cjs'
      - 'tests/stable/history-r9-report-binding.test.cjs'
      - 'scripts/stable/history-producer-assessment.cjs'
      - 'tests/stable/history-producer-assessment.test.cjs'
      - 'scripts/stable/history-transaction-journal.cjs'
      - 'tests/stable/history-transaction-journal.test.cjs'
      - 'scripts/stable/history-writer-audit.cjs'
      - 'tests/stable/history-writer-audit.test.cjs'
      - 'scripts/stable/history-prepush-proof.cjs'
      - 'tests/stable/history-prepush-proof.test.cjs'
      - 'scripts/stable/history-guarded-merge.cjs'
      - 'tests/stable/history-guarded-merge.test.cjs'
      - 'scripts/stable/history-safe-publish.cjs'
      - 'tests/stable/history-safe-publish.test.cjs'
      - 'scripts/stable/history-writer-lease.cjs'
      - 'tests/stable/history-writer-lease.test.cjs'
      - 'scripts/stable/history-git-lease-backend.cjs'
      - 'tests/stable/history-git-lease-backend.test.cjs'
      - 'scripts/stable/history-lease-recovery-policy.cjs'
      - 'tests/stable/history-lease-recovery-policy.test.cjs'
      - 'scripts/stable/history-publication-journal.cjs'
      - 'tests/stable/history-publication-journal.test.cjs'
      - 'scripts/stable/history-publication-git-store.cjs'
      - 'tests/stable/history-publication-git-store.test.cjs'
      - 'tests/stable/history-publish-journal-integration.test.cjs'
      - 'scripts/stable/v16-session-aware-price-truth.cjs'
      - '.github/workflows/pr97-history-quarantine-policy.yml'
  push:
    branches:
      - 'fix/history-quarantine-transaction-v1'
    paths:
      - 'scripts/stable/history-quarantine-policy.cjs'
      - 'tests/stable/history-quarantine-policy.test.cjs'
      - 'scripts/stable/history-publication-gate.cjs'
      - 'tests/stable/history-publication-gate.test.cjs'
      - 'scripts/stable/history-r8-integrity.cjs'
      - 'tests/stable/history-r8-integrity.test.cjs'
      - 'scripts/stable/history-r9-report-binding.cjs'
      - 'tests/stable/history-r9-report-binding.test.cjs'
      - 'scripts/stable/history-producer-assessment.cjs'
      - 'tests/stable/history-producer-assessment.test.cjs'
      - 'scripts/stable/history-transaction-journal.cjs'
      - 'tests/stable/history-transaction-journal.test.cjs'
      - 'scripts/stable/history-writer-audit.cjs'
      - 'tests/stable/history-writer-audit.test.cjs'
      - 'scripts/stable/history-prepush-proof.cjs'
      - 'tests/stable/history-prepush-proof.test.cjs'
      - 'scripts/stable/history-guarded-merge.cjs'
      - 'tests/stable/history-guarded-merge.test.cjs'
      - 'scripts/stable/history-safe-publish.cjs'
      - 'tests/stable/history-safe-publish.test.cjs'
      - 'scripts/stable/history-writer-lease.cjs'
      - 'tests/stable/history-writer-lease.test.cjs'
      - 'scripts/stable/history-git-lease-backend.cjs'
      - 'tests/stable/history-git-lease-backend.test.cjs'
      - 'scripts/stable/history-lease-recovery-policy.cjs'
      - 'tests/stable/history-lease-recovery-policy.test.cjs'
      - 'scripts/stable/history-publication-journal.cjs'
      - 'tests/stable/history-publication-journal.test.cjs'
      - 'scripts/stable/history-publication-git-store.cjs'
      - 'tests/stable/history-publication-git-store.test.cjs'
      - 'tests/stable/history-publish-journal-integration.test.cjs'
      - 'scripts/stable/v16-session-aware-price-truth.cjs'
      - '.github/workflows/pr97-history-quarantine-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quarantine-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check guarded producer and all new modules
        run: |
          node --check scripts/stable/v16-session-aware-price-truth.cjs
          node --check scripts/stable/history-producer-assessment.cjs
          node --check scripts/stable/history-transaction-journal.cjs
          node --check scripts/stable/history-writer-audit.cjs
          node --check scripts/stable/history-prepush-proof.cjs
          node --check scripts/stable/history-guarded-merge.cjs
          node --check scripts/stable/history-safe-publish.cjs
          node --check scripts/stable/history-writer-lease.cjs
          node --check scripts/stable/history-git-lease-backend.cjs
          node --check scripts/stable/history-lease-recovery-policy.cjs
          node --check scripts/stable/history-publication-journal.cjs
          node --check scripts/stable/history-publication-git-store.cjs
          node --check scripts/stable/history-r9-report-binding.cjs
          node --check scripts/stable/history-r8-integrity.cjs
      - name: Test history quarantine policy
        run: node --test tests/stable/history-quarantine-policy.test.cjs tests/stable/history-publication-gate.test.cjs tests/stable/history-r8-integrity.test.cjs tests/stable/history-r9-report-binding.test.cjs tests/stable/history-producer-assessment.test.cjs tests/stable/history-transaction-journal.test.cjs tests/stable/history-writer-audit.test.cjs tests/stable/history-prepush-proof.test.cjs tests/stable/history-guarded-merge.test.cjs tests/stable/history-safe-publish.test.cjs tests/stable/history-writer-lease.test.cjs tests/stable/history-git-lease-backend.test.cjs tests/stable/history-lease-recovery-policy.test.cjs tests/stable/history-publication-journal.test.cjs tests/stable/history-publication-git-store.test.cjs tests/stable/history-publish-journal-integration.test.cjs

name: Astra G22 Post-Close Session Refresh

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['EGX MAIN APP V16.9.2 P2 Automatic Scan']
    types: [completed]
  schedule:
    # Hourly fallback only. The handoff guard uses Africa/Cairo and only
    # permits 15:00-21:59 on EGX trading days after a final MAIN APP publish.
    - cron: '10 12-19 * * 0-4'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/astra-g22-postclose-refresh.yml'
      - 'data/ops/g22-main-app-handoff.json'
      - 'scripts/astra/g22-postclose-refresh.cjs'
      - 'scripts/astra/g22-postclose-handoff-guard.cjs'
      - 'scripts/astra/g22-refresh-session-exceptions.cjs'
      - 'scripts/astra/g22-refresh-v16-domain-exceptions.cjs'
      - 'tests/astra/g22-postclose-handoff-guard.test.cjs'
      - 'scripts/astra/native/astra-intelligence.cjs'
      - 'tests/astra/astra-native-intelligence.test.cjs'

permissions:
  contents: write
  actions: write

concurrency:
  group: astra-g22-postclose-refresh
  # Self-healing retries must never cancel a refresh that is already rebuilding
  # the current immutable DecisionSnapshot. Later runs queue and dedupe safely.
  cancel-in-progress: false

env:
  ASTRA_CERTIFIED_BASELINE_HEAD: 66b74d6f7586bd06201f6f7992ff9babf1104259

jobs:
  handoff-guard:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
      session: ${{ steps.guard.outputs.session }}
      fingerprint: ${{ steps.guard.outputs.fingerprint }}
      canonical_head: ${{ steps.guard.outputs.canonical_head }}
    steps:
      - name: Checkout latest main for handoff decision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate handoff guard
        run: |
          set -euo pipefail
          node --check scripts/astra/g22-postclose-handoff-guard.cjs
          node --test tests/astra/g22-postclose-handoff-guard.test.cjs

      - name: Require final published MAIN APP session
        id: guard
        env:
          G22_TRIGGER_EVENT: ${{ github.event_name }}
          G22_UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          G22_UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          G22_UPSTREAM_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          G22_UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          G22_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/astra/g22-postclose-handoff-guard.cjs

      - name: Handoff decision summary
        run: |
          echo "run=${{ steps.guard.outputs.run }}"
          echo "reason=${{ steps.guard.outputs.reason }}"
          echo "session=${{ steps.guard.outputs.session }}"
          echo "fingerprint=${{ steps.guard.outputs.fingerprint }}"
          echo "canonical_head=${{ steps.guard.outputs.canonical_head }}"

  refresh:
    needs: handoff-guard
    if: needs.handoff-guard.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout immutable MAIN APP final data snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.handoff-guard.outputs.canonical_head }}
          path: .main-app-final
          fetch-depth: 1

      - name: Checkout pinned G22 certified baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASTRA_CERTIFIED_BASELINE_HEAD }}
          path: .astra-certified
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate refresh implementation and certified engine
        run: |
          set -euo pipefail
          node --check scripts/astra/g22-postclose-refresh.cjs
          node --check scripts/astra/g22-postclose-handoff-guard.cjs
          node --check scripts/astra/g22-refresh-session-exceptions.cjs
          node --check scripts/astra/g22-refresh-v16-domain-exceptions.cjs
          node --check .astra-certified/astra/data-health/g11-data-health.cjs
          node --check .astra-certified/astra/pipeline/g09-unified-decision-pipeline.cjs
          node --check scripts/stable/v16-session-aware-price-truth.cjs
          node --check scripts/stable/v16-market-second-source-resolver.cjs
          node --check scripts/stable/v16-market-coverage-reconciler.cjs
          node --check scripts/stable/v16-market-universe-disposition.cjs

      - name: Build current-session data on the certified baseline
        env:
          CERT_ROOT: ${{ github.workspace }}/.astra-certified
          PROD_DATA_ROOT: ${{ github.workspace }}/.main-app-final
        run: |
          set -euo pipefail
          test -f "$PROD_DATA_ROOT/data/market.json"
          test -f "$PROD_DATA_ROOT/data/fetch-status.json"
          test -f "$PROD_DATA_ROOT/data/stable/v15-price-truth.json"
          test -d "$PROD_DATA_ROOT/data/history"
          test -d "$CERT_ROOT/data/history"

          cp "$PROD_DATA_ROOT/data/market.json" "$CERT_ROOT/data/market.json"
          cp "$PROD_DATA_ROOT/data/fetch-status.json" "$CERT_ROOT/data/fetch-status.json"
          cp scripts/stable/v16-session-aware-price-truth.cjs "$CERT_ROOT/scripts/stable/v16-session-aware-price-truth.cjs"
          cp scripts/stable/v16-market-second-source-resolver.cjs "$CERT_ROOT/scripts/stable/v16-market-second-source-resolver.cjs"
          cp scripts/stable/v16-market-coverage-reconciler.cjs "$CERT_ROOT/scripts/stable/v16-market-coverage-reconciler.cjs"
          cp scripts/stable/v16-market-universe-disposition.cjs "$CERT_ROOT/scripts/stable/v16-market-universe-disposition.cjs"

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const prod=process.env.PROD_DATA_ROOT;
          const cert=process.env.CERT_ROOT;
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const expected=read(path.join(prod,'data/stable/v15-price-truth.json')).expectedSession;
          if(!/^\d{4}-\d{2}-\d{2}$/.test(String(expected||''))) throw new Error('Current expected session invalid');
          const dateOf=x=>String(x?.date||x?.sessionDate||'').slice(0,10);
          const bad=x=>/invalid|conflict|failed|unresolved|quarantined/i.test(String(x?.validationStatus||''));
          let merged=0, skipped=0;
          const srcDir=path.join(prod,'data/history');
          for(const name of fs.readdirSync(srcDir).filter(x=>x.endsWith('.json'))){
            const target=path.join(cert,'data/history',name);
            if(!fs.existsSync(target)){skipped++;continue;}
            let source;
            try{source=read(path.join(srcDir,name));}catch{continue;}
            const rows=(source.sessions||[]).filter(r=>
              dateOf(r)===expected &&
              !bad(r) &&
              Number(r.close)>0 &&
              Number.isFinite(Number(r.volume)) &&
              Number(r.volume)>=0
            );
            if(!rows.length)continue;
            const targetDoc=read(target);
            const map=new Map((targetDoc.sessions||[]).map(r=>[dateOf(r),r]).filter(([d])=>d));
            for(const row of rows)map.set(expected,row);
            targetDoc.sessions=[...map.values()].sort((a,b)=>dateOf(a).localeCompare(dateOf(b)));
            targetDoc.firstSession=dateOf(targetDoc.sessions[0]);
            targetDoc.lastSession=dateOf(targetDoc.sessions.at(-1));
            targetDoc.availableSessions=targetDoc.sessions.length;
            targetDoc.generatedAt=new Date().toISOString();
            targetDoc.staleData=false;
            targetDoc.updateFailed=false;
            write(target,targetDoc);
            merged++;
          }
          console.log('CERT_BASELINE_CURRENT_ROWS_OVERLAY',JSON.stringify({expected,merged,skipped}));
          NODE

          (
            cd "$CERT_ROOT"
            GITHUB_WORKSPACE="$CERT_ROOT" node scripts/stable/v16-session-aware-price-truth.cjs
            GITHUB_WORKSPACE="$CERT_ROOT" node scripts/stable/v16-market-second-source-resolver.cjs
            GITHUB_WORKSPACE="$CERT_ROOT" node scripts/stable/v16-market-coverage-reconciler.cjs
            set +e
            GITHUB_WORKSPACE="$CERT_ROOT" node scripts/stable/v16-market-universe-disposition.cjs
            DISP_CODE=$?
            set -e
            if [ "$DISP_CODE" -ne 0 ] && [ "$DISP_CODE" -ne 2 ]; then exit "$DISP_CODE"; fi
          )

          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const cert=process.env.CERT_ROOT;
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const truth=read(path.join(cert,'data/stable/v15-price-truth.json'));
          const disposition=read(path.join(cert,'data/stable/v16-market-universe-disposition.json'));
          const expected=truth.expectedSession;
          const summaryPath=path.join(cert,'data/history-summary.json');
          const summary=read(summaryPath);
          summary.latestMarketSession=expected;
          summary.generatedAt=new Date().toISOString();
          if(Array.isArray(summary.symbols)){
            for(const item of summary.symbols){
              const ticker=String(item.ticker||'').trim().toUpperCase();
              const hp=path.join(cert,'data/history',ticker+'.json');
              if(!ticker||!fs.existsSync(hp))continue;
              const h=read(hp);
              item.firstSession=h.firstSession||item.firstSession||null;
              item.lastSession=h.lastSession||item.lastSession||null;
              item.latestValidSession=h.lastSession||item.latestValidSession||null;
              item.validSessions=Array.isArray(h.sessions)?h.sessions.length:(item.validSessions||0);
              item.symbolVerified=h.symbolVerified===true||item.symbolVerified===true;
              item.processingStatus=item.lastSession===expected?'current':item.processingStatus;
            }
          }
          write(summaryPath,summary);
          const current=(summary.symbols||[]).filter(x=>x.lastSession===expected||x.latestValidSession===expected).length;
          console.log('CERT_BASELINE_SESSION_READY',JSON.stringify({
            expected,
            acceptedRows:truth.acceptedRows,
            updatedHistoryFiles:truth.updatedHistoryFiles,
            missingHistoryFiles:truth.missingHistoryFiles,
            sourceCoveragePct:truth?.source?.sourceSessionEvidenceCoveragePct,
            secondSourceRecoveredTickers:truth?.professionalCoverage?.secondSourceRecoveredTickers || truth?.secondSourceRecoveredTickers || [],
            verifiedIneligibleTickers:disposition?.verifiedIneligible?.map(x=>x.ticker) || [],
            unresolvedDispositionTickers:disposition?.unresolved?.map(x=>x.ticker) || [],
            summaryCurrentRows:current
          }));
          NODE

      - name: Rebuild current DecisionSnapshot with certified G11/G09
        env:
          ASTRA_DECISION_ROOT: ${{ github.workspace }}/.astra-certified
          G22_MAIN_APP_CANONICAL_HEAD: ${{ needs.handoff-guard.outputs.canonical_head }}
        run: |
          set -euo pipefail
          node scripts/astra/g22-postclose-refresh.cjs | tee /tmp/g22-refresh.log
          grep -q '^G22_POST_CLOSE_REFRESH ' /tmp/g22-refresh.log

      - name: Rebuild Astra-native immutable history and performance
        run: |
          set -euo pipefail
          node --check scripts/astra/native/astra-intelligence.cjs
          node scripts/astra/native/astra-intelligence.cjs

      - name: Verify publication consistency
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const app=read('astra-prod/app/data.json');
          const manifest=read('astra-prod/G22_FULL_APP_MANIFEST.json');
          const audit=read('astra-prod/G22_SESSION_REFRESH.json');
          const main=read('data/ops/g22-main-app-handoff.json');
          const ledger=read('astra-prod/app/intelligence/recommendation-ledger.json');
          const outcomes=read('astra-prod/app/intelligence/recommendation-outcomes.json');
          const perf=read('astra-prod/app/intelligence/performance-summary.json');
          const s=audit.session.expected;
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          ok(/^\d{4}-\d{2}-\d{2}$/.test(s),'audit session invalid');
          ok(app.sourceDecision.session===s,'app session mismatch');
          ok(app.decisionSnapshot.sessionDate===s,'snapshot session mismatch');
          ok(app.decisionSnapshot.asOfSessionDate===s,'snapshot as-of mismatch');
          ok(app.sourceDecision.decisionSnapshotId===app.decisionSnapshot.decisionSnapshotId,'app snapshot id mismatch');
          ok(app.sourceDecision.semanticDecisionHash===app.decisionSnapshot.semanticDecisionHash,'app semantic hash mismatch');
          ok(manifest.decisionSnapshotId===app.sourceDecision.decisionSnapshotId,'manifest snapshot mismatch');
          ok(manifest.semanticDecisionHash===app.sourceDecision.semanticDecisionHash,'manifest semantic hash mismatch');
          ok(manifest.currentSession===s,'manifest session mismatch');
          ok(audit.session.decision===s&&audit.session.available===s,'audit session mismatch');
          ok(audit?.upstream?.final===true,'audit upstream not final');
          ok(audit?.upstream?.pagesPublished===true,'audit upstream not Pages-published');
          ok(audit?.upstream?.sessionDate===s,'audit upstream session mismatch');
          ok(audit?.upstream?.mainAppMaterialFingerprint===main.materialFingerprint,'audit upstream fingerprint mismatch');
          ok(app?.sourceDecision?.upstream?.mainAppMaterialFingerprint===main.materialFingerprint,'app upstream fingerprint mismatch');
          ok(manifest?.currentDecisionUpstream?.mainAppMaterialFingerprint===main.materialFingerprint,'manifest upstream fingerprint mismatch');
          ok(audit?.upstream?.canonicalDataHead===main.canonicalDataHead,'audit immutable data head mismatch');
          ok(app?.sourceDecision?.upstream?.canonicalDataHead===main.canonicalDataHead,'app immutable data head mismatch');
          ok(manifest?.currentDecisionUpstream?.canonicalDataHead===main.canonicalDataHead,'manifest immutable data head mismatch');
          ok(main.canonicalDataHead==='${{ needs.handoff-guard.outputs.canonical_head }}','guard canonical head drifted');
          ok(audit.health.criticalUnresolved===0,'CRITICAL health issue present');
          ok(String(audit.health.operationalGuardStatus||'').startsWith('PASS'),'operational guard not PASS');
          ok(String(app.health.guardStatus||'').startsWith('PASS'),'app guard not PASS');
          ok(Number(audit.health.currentCanonicalCoveragePct)>=90,'canonical coverage below 90%');
          ok(Number(audit.health.decisionPipelineCoveragePct)>=80,'decision coverage below 80%');
          ok(Number(audit.priceTruth.sourceSessionEvidenceCoveragePct)>=90,'source evidence coverage below 90%');
          ok(audit.priceTruth.executionGrade===true,'price truth not execution grade');
          ok((audit.priceTruth.missingHistoryFiles||[]).length===0,'certified baseline history files missing');
          ok(manifest.productionCutover===true,'production cutover regressed');
          ok(manifest.certifiedRuntimeBundleMutated===false,'certified runtime bundle mutated');
          ok(manifest.currentDecisionBaselineHead==='66b74d6f7586bd06201f6f7992ff9babf1104259','certified baseline head mismatch');
          ok(Array.isArray(app.decisionSnapshot.top5)&&app.decisionSnapshot.top5.length<=5,'top5 invalid');
          const recs=app.decisionSnapshot.top5||[];
          const currentLedger=(ledger.records||[]).filter(r=>r.decisionSnapshotId===app.sourceDecision.decisionSnapshotId&&r.sessionDate===s);
          ok(currentLedger.length===recs.length,'current-session ledger count mismatch');
          ok(JSON.stringify(currentLedger.map(r=>r.ticker).sort())===JSON.stringify(recs.map(r=>r.ticker).sort()),'current-session ledger ticker identity mismatch');
          ok((outcomes.records||[]).length===(ledger.records||[]).length,'history outcome accounting mismatch');
          ok(perf.reconciliation?.pass===true,'performance reconciliation failed');
          ok(perf.sourceSnapshot?.decisionSnapshotId===app.sourceDecision.decisionSnapshotId,'performance source snapshot stale');
          ok(perf.sessionRange?.last===s,'performance session range stale');
          ok(Number(perf.currentOpportunities)===recs.length,'performance current opportunity count mismatch');
          console.log('G22_REFRESH_CONSISTENCY_PASS',JSON.stringify({
            session:s,
            snapshotId:app.sourceDecision.decisionSnapshotId,
            status:app.decisionSnapshot.status,
            recommendations:app.decisionSnapshot.top5.map(x=>x.ticker),
            canonicalCoveragePct:audit.health.currentCanonicalCoveragePct,
            decisionCoveragePct:audit.health.decisionPipelineCoveragePct,
            sourceCoveragePct:audit.priceTruth.sourceSessionEvidenceCoveragePct,
            documentedHighFindings:audit.health.highUnresolved,
            upstreamFingerprint:audit?.upstream?.mainAppMaterialFingerprint || null
          }));
          NODE

      - name: Persist refreshed Full App data
        id: persist
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add astra-prod/app/data.json astra-prod/G22_FULL_APP_MANIFEST.json astra-prod/G22_SESSION_REFRESH.json astra-prod/app/intelligence
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "G22_REFRESH_NO_CHANGE"
          else
            git commit -m 'data(g22): refresh post-close Astra session'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Dispatch canonical Pages publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${{ github.repository }}/actions/workflows/static.yml/dispatches"             -f ref=main
          echo "STATIC_PAGES_DISPATCHED"

      - name: Dispatch Astra PRO v3 production publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/astra-v3-vercel-production.yml/dispatches" \
            -f ref=main
          echo "ASTRA_PRO_V3_PRODUCTION_DISPATCHED"

      - name: Publication summary
        run: |
          node <<'NODE'
          const a=require('./astra-prod/G22_SESSION_REFRESH.json');
          console.log('ASTRA_G22_POST_CLOSE_PUBLISHED '+JSON.stringify({
            session:a.session.decision,
            status:a.decision.status,
            decisionSnapshotId:a.decision.decisionSnapshotId,
            opportunities:a.decision.opportunities,
            tickers:a.decision.tickers,
            currentCanonical:a.health.currentCanonical.numerator+'/'+a.health.currentCanonical.denominator,
            canonicalCoveragePct:a.health.currentCanonicalCoveragePct,
            decisionCoveragePct:a.health.decisionPipelineCoveragePct,
            sourceCoveragePct:a.priceTruth.sourceSessionEvidenceCoveragePct,
            critical:a.health.criticalUnresolved,
            high:a.health.highUnresolved,
            guard:a.health.operationalGuardStatus,
            productionCutover:a.productionCutover,
            upstreamFingerprint:a?.upstream?.mainAppMaterialFingerprint || null
          }));
          NODE
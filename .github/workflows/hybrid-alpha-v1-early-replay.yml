name: EGX Hybrid Alpha Early Replay Research
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research/hybrid-alpha-v1-early-replay.cjs'
      - 'tests/research/hybrid-alpha-v1-early-replay.test.cjs'
      - 'data/v13-4-quant-policy.json'
      - '.github/workflows/hybrid-alpha-v1-early-replay.yml'
      - 'scripts/research/hybrid-alpha-v1-cohort-audit.cjs'
      - 'tests/research/hybrid-alpha-v1-cohort-audit.test.cjs'
      - 'scripts/research/hybrid-alpha-v1-quality-cohort.cjs'
      - 'tests/research/hybrid-alpha-v1-quality-cohort.test.cjs'
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research replay functions
        run: node --test tests/research/hybrid-alpha-v1-early-replay.test.cjs
      - name: Validate cohort comparison
        run: node --test tests/research/hybrid-alpha-v1-cohort-audit.test.cjs
      - name: Validate momentum liquidity filter
        run: node --test tests/research/hybrid-alpha-v1-quality-cohort.test.cjs
      - name: Recompute exploratory historical comparisons
        run: node scripts/research/hybrid-alpha-v1-early-replay.cjs
      - name: Compare breakout trades accepted and rejected by VCP
        run: node scripts/research/hybrid-alpha-v1-cohort-audit.cjs
      - name: Compare liquidity and momentum quality subcohorts
        run: node scripts/research/hybrid-alpha-v1-quality-cohort.cjs
      - name: Write comparison to GitHub Actions job summary
        if: success()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('data/research/hybrid-alpha-v1-early-replay.json','utf8'));
          const c=JSON.parse(fs.readFileSync('data/research/hybrid-alpha-v1-cohort-audit.json','utf8'));
          const q=JSON.parse(fs.readFileSync('data/research/hybrid-alpha-v1-quality-cohort.json','utf8'));
          const lines=['## Hybrid Alpha V1 — Exploratory Replay','Research only; NOT certified historical parity.','', '| Model | Trades | Win rate | Mean net return | Profit factor |','|---|---:|---:|---:|---:|'];
          for(const x of r.variants)lines.push('| '+x.variant+' | '+x.signals+' | '+(x.winRatePct??'N/A')+'% | '+(x.meanNetReturnPct??'N/A')+'% | '+(x.profitFactor??'N/A')+' |');
          lines.push('', 'Coverage: '+r.coverage.tradable+' eligible ticker files out of '+r.coverage.files+'.');
          lines.push('', '### Breakout cohorts', '| Cohort | Trades | Win rate | Mean net return | Stops | Targets |','|---|---:|---:|---:|---:|---:|');
          for(const [name,v] of [['VCP accepted',c.accepted],['VCP rejected',c.rejected]])lines.push('| '+name+' | '+v.trades+' | '+v.winRatePct+'% | '+v.meanNetReturnPct+'% | '+v.stopHits+' | '+v.targetHits+' |');
          lines.push('', '### Frozen liquidity + momentum filter','| Cohort | Trades | Win rate | Mean net return |','|---|---:|---:|---:|');
          for(const [name,v] of [['Accepted',q.accepted],['Rejected',q.rejected],['Unavailable',q.unavailable]])lines.push('| '+name+' | '+v.trades+' | '+(v.winRatePct??'N/A')+'% | '+(v.meanNetReturnPct??'N/A')+'% |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join(String.fromCharCode(10))+String.fromCharCode(10));
          if(r.variants.every(x=>x.signals===0))throw Error('No trades in any research variant; results not interpretable');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-alpha-early-replay
          path: |
            data/research/hybrid-alpha-v1-early-replay.json
            data/research/hybrid-alpha-v1-cohort-audit.json
            data/research/hybrid-alpha-v1-quality-cohort.json

name: V16.9.2 Pre-Close Acceptance Guard

on:
  pull_request:
    paths:
      - ".github/workflows/v169-preclose-rescan.yml"
      - ".github/workflows/v169-preclose-acceptance.yml"
      - "preview-v16/app/v16-9-preclose-runtime.js"
      - "preview-v16/app/v16-9-preclose-ls1-status.js"
      - "preview-v16/app/decision-source.js"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate browser runtime syntax
        run: |
          set -euo pipefail
          node --check preview-v16/app/v16-9-preclose-runtime.js
          node --check preview-v16/app/v16-9-preclose-ls1-status.js
          node --check preview-v16/app/decision-source.js

      - name: Verify pre-close contract
        run: |
          set -euo pipefail
          grep -q "14:15" .github/workflows/v169-preclose-rescan.yml
          grep -q "mobile-hotfix-deploy.yml" .github/workflows/v169-preclose-rescan.yml
          grep -q "v16-v169-basket-engine.yml" .github/workflows/v169-preclose-rescan.yml
          grep -q "main-app-governance-refresh.yml" .github/workflows/v169-preclose-rescan.yml
          grep -q "MARKET_CLOSE_MINUTE = 14 \* 60 + 30" preview-v16/app/v16-9-preclose-runtime.js
          grep -q "CHECKPOINTS = \[15, 10, 5\]" preview-v16/app/v16-9-preclose-runtime.js
          grep -q "v16-main-app-current.json" preview-v16/app/v16-9-preclose-runtime.js
          grep -q "v16-ls1-late-session-opportunities.json" preview-v16/app/v16-9-preclose-ls1-status.js
          grep -q "لا توجد توصيات تنفيذية جديدة" preview-v16/app/v16-9-preclose-ls1-status.js
          grep -q "مراقبة فقط" preview-v16/app/v16-9-preclose-ls1-status.js
          grep -q "selection technique" .github/workflows/v169-preclose-rescan.yml || true

      - name: Prove recommendation-selection code is untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "$CHANGED"

          # Diagnostic-only scripts may analyze already-produced selections, but they must never
          # expand this exception into recommendation-selection/research engine code.
          SCRIPT_CHANGED=$(printf '%s\n' "$CHANGED" | grep -E '^scripts/(stable|research)/' || true)
          ALLOWED_DIAGNOSTIC='^scripts/stable/(v16-main-app-engine-performance\.cjs|v16-main-app-independent-consensus-audit\.cjs)$'
          VIOLATIONS=$(printf '%s\n' "$SCRIPT_CHANGED" | grep -Ev "$ALLOWED_DIAGNOSTIC" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "Recommendation selection/research code changed; pre-close patch must not alter selection technique:" >&2
            printf '%s\n' "$VIOLATIONS" >&2
            exit 1
          fi

          # Explicitly prove the frozen V16.9 selection engine itself is byte-identical to main.
          git diff --quiet origin/main...HEAD -- scripts/research/v16-v169-basket-engine.py
          echo "PASS: frozen V16.9 selection engine unchanged; only approved presentation/diagnostic files differ."

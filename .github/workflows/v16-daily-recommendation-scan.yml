name: EGX V16 Daily Recommendation Scan
run-name: Daily recommendation scan for ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-daily-recommendation-scan.yml"
  schedule:
    # GitHub cron is UTC. Keep retrying hourly after the EGX close and through
    # the following morning so a late source-session timestamp can still be
    # accepted without manual intervention.
    - cron: "15 13-23 * * 0-4"
    - cron: "15 0-6 * * 1-5"

env:
  EGXAPI_KEY: ${{ secrets.EGXAPI_KEY }}
  EGX_KEY: ${{ secrets.EGX_KEY }}
  EGX_MARKET_JSON_URL: ${{ secrets.EGX_MARKET_JSON_URL }}
  PUBLIC_MARKET_JSON_URL: ${{ secrets.PUBLIC_MARKET_JSON_URL }}
  EGX_MIN_EXECUTION_ROWS: "80"
  EGX_PRICE_MATCH_TOLERANCE_PCT: "1.75"
  EGX_MAX_SINGLE_SESSION_JUMP_PCT: "35"
  EGX_MARKET_HOLIDAYS: ${{ vars.EGX_MARKET_HOLIDAYS }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v16-daily-recommendation-scan
  cancel-in-progress: true

jobs:
  scan-and-publish-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      fresh: ${{ steps.scan.outputs.fresh }}
      publish: ${{ steps.scan.outputs.publish }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate scan engines
        run: |
          set -euo pipefail
          node --check scripts/fetch-market-data.js
          node --check scripts/stable/v15-missing-symbol-fallback.cjs
          node --check scripts/stable/v16-mubasher-session-evidence-enricher.cjs
          node --check scripts/stable/v15-live-price-truth.cjs
          node --check scripts/stable/v15-practical-market-scanner.cjs
          node --check scripts/stable/v15-price-truth-gate.cjs
          node --check scripts/stable/v15-recommendation-evaluator.cjs
          node --check scripts/stable/v16-live-evidence-engine.cjs
          node --check scripts/stable/v16-market-regime-engine.cjs
          node --check scripts/stable/v16-correlation-risk-engine.cjs
          node --check scripts/stable/v16-alert-engine.cjs
          node --check scripts/stable/v16-recommendation-freshness-guard.cjs

      - name: Scan current session and rebuild recommendations
        id: scan
        run: |
          set -euo pipefail
          cp data/stable/v15-practical-decision.json /tmp/previous-practical-decision.json
          if [ -f data/stable/v16-immediate-scan-status.json ]; then
            cp data/stable/v16-immediate-scan-status.json /tmp/previous-scan-status.json
          else
            printf '{}\n' > /tmp/previous-scan-status.json
          fi

          FRESH=0
          ATTEMPTS=0
          for ATTEMPT in 1 2 3; do
            ATTEMPTS="$ATTEMPT"
            echo "Starting EGX daily scan attempt $ATTEMPT/3"
            set +e
            node scripts/fetch-market-data.js
            FETCH_CODE=$?
            node scripts/stable/v15-missing-symbol-fallback.cjs
            FALLBACK_CODE=$?
            # The quote header often exposes only a clock time. Enrich only
            # rows whose Mubasher Volume Statistics page supplies an explicit
            # calendar date AND whose traded volume matches the quote snapshot.
            # Never infer the market session from fetch/build time.
            node scripts/stable/v16-mubasher-session-evidence-enricher.cjs
            EVIDENCE_CODE=$?
            node scripts/stable/v15-live-price-truth.cjs
            TRUTH_CODE=$?
            node scripts/stable/v15-practical-market-scanner.cjs
            SCANNER_CODE=$?
            node scripts/stable/v15-price-truth-gate.cjs
            GATE_CODE=$?
            set -e
            echo "attempt=$ATTEMPT fetch=$FETCH_CODE fallback=$FALLBACK_CODE evidence=$EVIDENCE_CODE truth=$TRUTH_CODE scanner=$SCANNER_CODE gate=$GATE_CODE"
            if node - <<'NODE'
          const fs = require('fs');
          const decision = JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json', 'utf8'));
          const ready = decision?.priceTruth?.ready === true
            && decision?.practicalReady === true
            && decision?.sessionDate === decision?.expectedLatestSession
            && Array.isArray(decision?.recommendations)
            && decision.recommendations.length > 0;
          console.log({
            sessionDate: decision.sessionDate,
            expectedLatestSession: decision.expectedLatestSession,
            priceTruthReady: decision?.priceTruth?.ready,
            recommendationCount: decision?.recommendations?.length || 0,
            ready,
          });
          process.exit(ready ? 0 : 1);
          NODE
            then
              FRESH=1
              break
            fi
            [ "$ATTEMPT" = "3" ] || sleep 45
          done

          if [ "$FRESH" = "1" ]; then
            node scripts/stable/v15-recommendation-evaluator.cjs
            node scripts/stable/v16-live-evidence-engine.cjs
            node scripts/stable/v16-market-regime-engine.cjs
            node scripts/stable/v16-correlation-risk-engine.cjs
            node scripts/stable/v16-alert-engine.cjs
          else
            # Never replace the last trusted recommendation set with an
            # unverified current-session candidate set.
            cp /tmp/previous-practical-decision.json data/stable/v15-practical-decision.json
          fi

          node scripts/stable/v16-recommendation-freshness-guard.cjs
          FRESH="$FRESH" ATTEMPTS="$ATTEMPTS" node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const read = (file) => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return {}; } };
          const stableHash = (value) => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');

          const fetchStatus = read('data/fetch-status.json');
          const freshness = read('data/stable/v16-recommendation-freshness.json');
          const decision = read('data/stable/v15-practical-decision.json');
          const previous = read('/tmp/previous-scan-status.json');
          const recommendationTickers = (decision.recommendations || []).map(row => row.ticker);
          const fresh = process.env.FRESH === '1' && freshness.isFresh === true;

          // Deliberately exclude timestamps. The same market-session state must
          // not cause another Pages publication merely because a retry ran.
          const materialState = {
            acceptedFreshSession: fresh,
            expectedSession: freshness.expectedSession || null,
            decisionSession: freshness.decisionSession || null,
            priceSession: freshness.priceSession || null,
            executionGrade: freshness.executionGrade === true,
            fetchMode: fetchStatus.mode || null,
            sourceName: fetchStatus.sourceName || null,
            fetchedRows: fetchStatus.marketRows ?? fetchStatus.inputRows ?? null,
            sourceSessionVerifiedRows: fetchStatus.sourceSessionVerifiedRows ?? null,
            sourceSessionEvidenceCoveragePct: fetchStatus.sourceSessionEvidenceCoveragePct ?? null,
            recommendationCount: recommendationTickers.length,
            recommendationTickers,
          };
          const materialFingerprint = stableHash(materialState);

          const previousComparable = previous.materialFingerprint
            ? previous.materialFingerprint
            : stableHash({
                acceptedFreshSession: previous.acceptedFreshSession === true,
                expectedSession: previous.expectedSession || null,
                decisionSession: previous.decisionSession || null,
                priceSession: previous.priceSession || null,
                executionGrade: previous.executionGrade === true,
                fetchMode: previous.fetchMode || null,
                sourceName: previous.sourceName || null,
                fetchedRows: previous.fetchedRows ?? null,
                sourceSessionVerifiedRows: previous.sourceSessionVerifiedRows ?? null,
                sourceSessionEvidenceCoveragePct: previous.sourceSessionEvidenceCoveragePct ?? null,
                recommendationCount: previous.recommendationCount || 0,
                recommendationTickers: previous.recommendationTickers || [],
              });

          const publicationRequired = materialFingerprint !== previousComparable;
          const out = {
            schemaVersion: '16.3.5-auto-rescan',
            generatedAt: new Date().toISOString(),
            trigger: process.env.GITHUB_EVENT_NAME || null,
            attempts: Number(process.env.ATTEMPTS || 0),
            acceptedFreshSession: fresh,
            expectedSession: freshness.expectedSession,
            decisionSession: freshness.decisionSession,
            priceSession: freshness.priceSession,
            executionGrade: freshness.executionGrade,
            fetchMode: fetchStatus.mode || null,
            sourceName: fetchStatus.sourceName || null,
            fetchedRows: fetchStatus.marketRows ?? fetchStatus.inputRows ?? null,
            sourceSessionVerifiedRows: fetchStatus.sourceSessionVerifiedRows ?? null,
            sourceSessionEvidenceCoveragePct: fetchStatus.sourceSessionEvidenceCoveragePct ?? null,
            recommendationCount: recommendationTickers.length,
            recommendationTickers,
            materialFingerprint,
            publicationRequired,
            automaticRetry: !fresh,
            retryPolicy: {
              continueUntilFresh: true,
              scheduledCadenceMinutes: 60,
              attemptsPerRun: 3,
              delayBetweenAttemptsSeconds: 45,
              sourceSessionTruthRequired: true,
              duplicateSameStatePublicationBlocked: true,
            },
            status: fresh ? 'FRESH_RECOMMENDATIONS_PUBLISHED' : 'CURRENT_SESSION_NOT_ACCEPTED_RETRY_SCHEDULED',
            statusAr: fresh
              ? 'تم مسح السوق وتحليل الأسهم واعتماد توصيات جلسة اليوم.'
              : 'اكتمل المسح ولم تُقبل الجلسة الحالية بعد؛ ستستمر إعادة المحاولة تلقائيًا مع الإبقاء على آخر توصيات موثقة فقط.',
          };
          fs.writeFileSync('data/stable/v16-immediate-scan-status.json', JSON.stringify(out, null, 2) + '\n');
          console.log(out);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fresh=${fresh ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${publicationRequired ? 'true' : 'false'}\n`);
          NODE

      - name: Commit scan result regardless of acceptance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/market.json data/fetch-status.json data/source-health.json data/source-fetch-report.json data/stable data/research
          if ! git diff --cached --quiet; then
            git commit -m "Run EGX V16 daily recommendation scan"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 10))
            done
          fi

      - name: Prepare Pages artifact
        if: steps.scan.outputs.publish == 'true'
        run: touch .nojekyll

      - name: Configure Pages
        if: steps.scan.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.scan.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-current-session:
    needs: scan-and-publish-evidence
    if: needs.scan-and-publish-evidence.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed recommendations
        id: deployment
        uses: actions/deploy-pages@v4

name: EGX MAIN APP V16.9.2 P2 Automatic Scan
run-name: MAIN APP V16.9.2 P2 scan for ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-daily-recommendation-scan.yml"
      - "scripts/stable/v16-source-session-quorum.cjs"
      - "scripts/stable/v16-v169-live-resolution-normalizer.cjs"
      - "scripts/stable/v16-main-app-professional-readiness.cjs"
  schedule:
    # GitHub cron is UTC. We schedule both Egypt UTC+2 and UTC+3 candidates,
    # then the preflight gate checks the real Africa/Cairo local clock.
    # 10:15 Cairo
    - cron: "15 7,8 * * 0-4"
    # 14:00 Cairo
    - cron: "0 11,12 * * 0-4"
    # Post-close hourly candidates. The Cairo gate allows 15:00-21:00 only.
    - cron: "0 12-19 * * 0-4"

env:
  EGXAPI_KEY: ${{ secrets.EGXAPI_KEY }}
  EGX_KEY: ${{ secrets.EGX_KEY }}
  EGX_MARKET_JSON_URL: ${{ secrets.EGX_MARKET_JSON_URL }}
  PUBLIC_MARKET_JSON_URL: ${{ secrets.PUBLIC_MARKET_JSON_URL }}
  EGX_MIN_EXECUTION_ROWS: "80"
  EGX_PRICE_MATCH_TOLERANCE_PCT: "1.75"
  EGX_MAX_SINGLE_SESSION_JUMP_PCT: "35"
  EGX_MARKET_HOLIDAYS: ${{ vars.EGX_MARKET_HOLIDAYS }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-main-app-v1692-p2-canonical
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
      cairo_time: ${{ steps.clock.outputs.cairo_time }}
    steps:
      - name: Resolve Cairo schedule slot
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cairo_time=$(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DOW=$(TZ=Africa/Cairo date '+%w')
          HOUR=$(TZ=Africa/Cairo date '+%H')
          MINUTE=$(TZ=Africa/Cairo date '+%M')
          STAMP=$(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M')
          RUN=false

          # EGX regular trading days: Sunday-Thursday.
          if [ "$DOW" -le 4 ]; then
            # Tolerate GitHub scheduler delivery delay without changing the
            # requested nominal slots (10:15 and 14:00 Cairo).
            if [ "$HOUR" = "10" ] && [ "$MINUTE" -ge 10 ] && [ "$MINUTE" -le 45 ]; then RUN=true; fi
            if [ "$HOUR" = "14" ] && [ "$MINUTE" -le 45 ]; then RUN=true; fi
            if [ "$HOUR" -ge 15 ] && [ "$HOUR" -le 21 ] && [ "$MINUTE" -le 45 ]; then RUN=true; fi
          fi

          echo "Cairo slot: $STAMP run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "cairo_time=$STAMP" >> "$GITHUB_OUTPUT"

  scan-and-publish:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      publish: ${{ steps.scan.outputs.publish }}
      final: ${{ steps.scan.outputs.final }}
      session: ${{ steps.scan.outputs.session }}
    steps:
      - name: Checkout latest MAIN APP
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether post-close session is already final and published
        id: already
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = f => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return {}; } };
          const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date()).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
          const today = `${parts.year}-${parts.month}-${parts.day}`;
          const hour = Number(parts.hour);
          const primary = read('data/stable/v16-v169-primary-decision.json');
          const scan = read('data/stable/v16-immediate-scan-status.json');
          const postClose = hour >= 15;
          const final = postClose
            && primary.currentSessionReady === true
            && primary.sessionDate === today
            && primary?.basketPlan?.sourceSessionReady === true
            && scan.pagesPublishedSession === today;
          console.log({ today, hour, postClose, primarySession: primary.sessionDate, currentSessionReady: primary.currentSessionReady, pagesPublishedSession: scan.pagesPublishedSession, final });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${final ? 'true' : 'false'}\n`);
          NODE

      - name: Validate MAIN APP engines
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          node --check scripts/fetch-market-data.js
          node --check scripts/stable/v15-missing-symbol-fallback.cjs
          node --check scripts/stable/v16-source-session-quorum.cjs
          node --check scripts/stable/v16-mubasher-session-evidence-enricher.cjs
          node --check scripts/stable/v15-live-price-truth.cjs
          node --check scripts/stable/v15-price-truth-gate.cjs
          node --check scripts/stable/v16-publish-v169-basket.cjs
          node --check scripts/stable/v16-session-data-fingerprint.cjs
          node --check scripts/stable/v16-recommendation-freshness-guard.cjs
          node --check scripts/stable/v16-v169-live-resolution-normalizer.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs
          python -m py_compile scripts/research/v16-v169-basket-engine.py
          python -m py_compile scripts/research/v16-v169-target-hit-audit.py
          python -m py_compile scripts/stable/v16-v169-live-evaluation.py

      - name: Scan market and run canonical V16.9 P2 engine
        if: steps.already.outputs.skip != 'true'
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          cp data/stable/v16-v169-primary-decision.json /tmp/previous-primary.json
          cp data/stable/v15-practical-decision.json /tmp/previous-legacy.json

          SOURCE_READY=0
          ATTEMPTS=0
          for ATTEMPT in 1 2 3; do
            ATTEMPTS="$ATTEMPT"
            echo "MAIN APP source attempt $ATTEMPT/3"
            set +e
            node scripts/fetch-market-data.js
            FETCH_CODE=$?
            node scripts/stable/v15-missing-symbol-fallback.cjs
            FALLBACK_CODE=$?

            # First recover/verify quote-page market-time evidence. This may
            # infer the calendar date only after the EGX close, only for exact
            # Mubasher EGX stock pages, and only after a cross-symbol quorum.
            node scripts/stable/v16-source-session-quorum.cjs
            QUORUM_CODE=$?

            # Explicit dated Volume Statistics evidence remains a secondary
            # validator. Rows already certified by the quorum are preserved.
            node scripts/stable/v16-mubasher-session-evidence-enricher.cjs
            EVIDENCE_CODE=$?

            node scripts/stable/v15-live-price-truth.cjs
            TRUTH_CODE=$?
            set -e
            echo "attempt=$ATTEMPT fetch=$FETCH_CODE fallback=$FALLBACK_CODE quorum=$QUORUM_CODE evidence=$EVIDENCE_CODE truth=$TRUTH_CODE"

            if node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('data/stable/v15-price-truth.json', 'utf8'));
          const minimum = Number(p.minimumExecutionRows || 80);
          const ready = p.ready === true
            && p.executionGrade === true
            && Boolean(p.expectedSession)
            && Number(p.acceptedRows || 0) >= minimum
            && Number(p?.source?.sourceSessionEvidenceCoveragePct || 0) >= 80;
          console.log({ expectedSession:p.expectedSession, ready:p.ready, executionGrade:p.executionGrade, acceptedRows:p.acceptedRows, minimum, sourceSessionEvidenceCoveragePct:p?.source?.sourceSessionEvidenceCoveragePct, sourceReady:ready });
          process.exit(ready ? 0 : 1);
          NODE
            then
              SOURCE_READY=1
              break
            fi
            [ "$ATTEMPT" = "3" ] || sleep 45
          done

          if [ "$SOURCE_READY" = "1" ]; then
            # This is the user's MAIN APP engine. Do not substitute the V15
            # practical scanner, V16.5 TWO_STAGE, V17, or QUANT EDGE here.
            python scripts/research/v16-v169-basket-engine.py
            python scripts/research/v16-v169-target-hit-audit.py
            node scripts/stable/v16-publish-v169-basket.cjs
            python scripts/stable/v16-v169-live-evaluation.py

            # Downstream evidence/risk modules consume the V16.9 compatibility
            # mirror only after the canonical basket has been finalized.
            node scripts/stable/v15-recommendation-evaluator.cjs || true
            node scripts/stable/v16-live-evidence-engine.cjs || true
            node scripts/stable/v16-market-regime-engine.cjs || true
            node scripts/stable/v16-correlation-risk-engine.cjs || true
            node scripts/stable/v16-alert-engine.cjs || true
          else
            # Fail closed: keep the last V16.9 basket as reference. Never let a
            # side engine overwrite the canonical MAIN APP decision.
            cp /tmp/previous-primary.json data/stable/v16-v169-primary-decision.json
            cp /tmp/previous-legacy.json data/stable/v15-practical-decision.json
          fi

          # Canonical governance normalization runs on EVERY non-noop scan.
          # The live evaluator deliberately records raw conservative states;
          # this step applies the frozen KEEP_CASH and holding-expiry policy so
          # a later scan can never regress the resolved-session ledger.
          node scripts/stable/v16-v169-live-resolution-normalizer.cjs
          node scripts/stable/v16-main-app-professional-readiness.cjs
          node scripts/stable/v16-recommendation-freshness-guard.cjs || true

          SOURCE_READY="$SOURCE_READY" ATTEMPTS="$ATTEMPTS" node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const read = f => { try { return JSON.parse(fs.readFileSync(f, 'utf8')); } catch { return {}; } };
          const primary = read('data/stable/v16-v169-primary-decision.json');
          const price = read('data/stable/v15-price-truth.json');
          const fetchStatus = read('data/fetch-status.json');
          const previous = read('data/stable/v16-immediate-scan-status.json');
          const tickers = Array.isArray(primary.recommendations) ? primary.recommendations.map(r => r.ticker) : [];
          const sourceReady = process.env.SOURCE_READY === '1';
          const final = sourceReady && primary.currentSessionReady === true && primary?.basketPlan?.sourceSessionReady === true;
          const material = {
            engine:'V16_9_EQUAL_WEIGHT_BASKET',
            sessionDate:primary.sessionDate || null,
            expectedSession:price.expectedSession || null,
            sourceReady,
            currentSessionReady:primary.currentSessionReady === true,
            executionGrade:price.executionGrade === true,
            recommendationCount:tickers.length,
            tickers,
            sourceSessionDataHash:primary?.basketPlan?.sourceSessionDataHash || null,
          };
          const fingerprint = crypto.createHash('sha256').update(JSON.stringify(material)).digest('hex');
          const publicationRequired = fingerprint !== previous.materialFingerprint || previous.pagesPublishedSession !== primary.sessionDate;
          const out = {
            schemaVersion:'16.9.2-main-app-p2-canonical-auto-scan',
            generatedAt:new Date().toISOString(),
            engine:'V16_9_EQUAL_WEIGHT_BASKET',
            ui:'P2',
            trigger:process.env.GITHUB_EVENT_NAME || null,
            attempts:Number(process.env.ATTEMPTS || 0),
            sourceReady,
            final,
            sessionDate:primary.sessionDate || null,
            expectedSession:price.expectedSession || null,
            executionGrade:price.executionGrade === true,
            currentSessionReady:primary.currentSessionReady === true,
            recommendationCount:tickers.length,
            recommendationTickers:tickers,
            sourceSessionDataHash:primary?.basketPlan?.sourceSessionDataHash || null,
            marketRows:fetchStatus.marketRows || null,
            materialFingerprint:fingerprint,
            publicationRequired,
            pagesPublished:false,
            pagesPublishedSession:null,
            retryPolicy:{
              cairoSlots:['10:15','14:00'],
              postCloseHourlyFrom:'15:00',
              postCloseHourlyUntil:'21:00',
              stopAfterFinalPublishedSession:true,
              attemptsPerRun:3,
              delayBetweenAttemptsSeconds:45,
              sourceSessionTruthRequired:true,
              noEngineSubstitution:true
            },
            status:final ? 'FINAL_SESSION_SNAPSHOT_READY_FOR_PUBLISH' : sourceReady ? 'SOURCE_READY_BASKET_GATE_RESULT_READY' : 'SOURCE_SESSION_NOT_READY_RETRY_SCHEDULED',
            statusAr:final
              ? 'تم اعتماد نتيجة محرك MAIN APP V16.9 للجلسة الحالية وجاهزة للنشر.'
              : sourceReady
                ? 'تم اعتماد بيانات الجلسة وتشغيل محرك V16.9؛ النتيجة الحالية محفوظة وفق بوابات المحرك.'
                : 'لم تكتمل حقيقة جلسة المصدر بعد؛ تم الإبقاء على آخر سلة V16.9 موثقة وستستمر إعادة المحاولة بعد الإغلاق.'
          };
          fs.writeFileSync('data/stable/v16-immediate-scan-status.json', JSON.stringify(out,null,2)+'\n');
          console.log(out);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=true\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `final=${final ? 'true' : 'false'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `session=${primary.sessionDate || ''}\n`);
          NODE

      - name: Mark already-final run as no-op
        if: steps.already.outputs.skip == 'true'
        id: noop
        run: |
          echo "MAIN APP post-close session is already final and Pages-published. No duplicate scan."

      - name: Commit canonical MAIN APP state
        if: steps.already.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/market.json data/fetch-status.json data/source-health.json data/source-fetch-report.json data/stable data/research
          if ! git diff --cached --quiet; then
            git commit -m "Update MAIN APP V16.9.2 P2 canonical session"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 10))
            done
          fi

      - name: Prepare Pages artifact
        if: steps.already.outputs.skip != 'true'
        run: touch .nojekyll

      - name: Configure Pages
        if: steps.already.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload complete MAIN APP
        if: steps.already.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-main-app:
    needs: scan-and-publish
    if: needs.scan-and-publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Deploy MAIN APP Pages — attempt 1
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before Pages retry 2
        if: steps.deploy1.outcome != 'success'
        run: sleep 20

      - name: Deploy MAIN APP Pages — attempt 2
        id: deploy2
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before Pages retry 3
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        run: sleep 40

      - name: Deploy MAIN APP Pages — attempt 3
        id: deploy3
        if: steps.deploy1.outcome != 'success' && steps.deploy2.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Require at least one successful Pages deployment
        id: deployment_result
        if: always()
        shell: bash
        env:
          D1: ${{ steps.deploy1.outcome }}
          D2: ${{ steps.deploy2.outcome }}
          D3: ${{ steps.deploy3.outcome }}
        run: |
          echo "deploy outcomes: $D1 / $D2 / $D3"
          if [ "$D1" = "success" ] || [ "$D2" = "success" ] || [ "$D3" = "success" ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "success=false" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Checkout latest main to record publication
        if: steps.deployment_result.outputs.success == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record Pages-published session
        if: steps.deployment_result.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const file='data/stable/v16-immediate-scan-status.json';
          const primary=JSON.parse(fs.readFileSync('data/stable/v16-v169-primary-decision.json','utf8'));
          const status=JSON.parse(fs.readFileSync(file,'utf8'));
          status.pagesPublished=true;
          status.pagesPublishedAt=new Date().toISOString();
          status.pagesPublishedSession=primary.sessionDate || status.sessionDate || null;
          status.status = status.final ? 'FINAL_SESSION_SNAPSHOT_PUBLISHED' : 'CURRENT_MAIN_APP_STATE_PUBLISHED';
          status.statusAr = status.final
            ? 'تم نشر النتيجة النهائية لجلسة اليوم على MAIN APP.'
            : 'تم نشر أحدث حالة متاحة لمحرك MAIN APP مع استمرار بوابات الأمان.';
          fs.writeFileSync(file,JSON.stringify(status,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v16-immediate-scan-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record MAIN APP Pages publication"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

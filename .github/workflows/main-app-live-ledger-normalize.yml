name: MAIN APP — Live Ledger Resolution Normalizer

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/stable/v16-v169-live-resolution-normalizer.cjs"
      - ".github/workflows/main-app-live-ledger-normalize.yml"
  schedule:
    # Candidate hours; Cairo gate below keeps this post-market only and DST-safe.
    - cron: "35 12-19 * * 0-4"

permissions:
  contents: write
  actions: write

concurrency:
  group: egx-main-app-v1692-p2-canonical
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve Cairo post-market window
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW=$(TZ=Africa/Cairo date '+%w')
          HOUR=$(TZ=Africa/Cairo date '+%H')
          RUN=false
          if [ "$DOW" -le 4 ] && [ "$HOUR" -ge 15 ] && [ "$HOUR" -le 22 ]; then RUN=true; fi
          echo "Cairo live-ledger normalize: $(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M') run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout latest MAIN APP
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate resolution normalizer
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-v169-live-resolution-normalizer.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs
          grep -q "KEEP_CASH_AND_RESOLVE_ZERO_RETURN" scripts/stable/v16-v169-live-resolution-normalizer.cjs
          grep -q "TIME_EXIT_LAST_CLOSE" scripts/stable/v16-v169-live-resolution-normalizer.cjs

      - name: Normalize live ledger resolution accounting
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-v169-live-resolution-normalizer.cjs

      - name: Rebuild Professional Readiness V2
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-professional-readiness.cjs

      - name: Verify no recommendation mutation
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('data/stable/v16-v169-live-evaluation.json','utf8'));
          const ready=JSON.parse(fs.readFileSync('data/stable/v16-main-app-professional-readiness.json','utf8'));
          if(live.engine!=='V16_9_EQUAL_WEIGHT_BASKET') throw new Error('Live ledger engine mismatch');
          if(live?.normalization?.policy?.changesAlphaOrPublishedSignal!==false) throw new Error('Normalizer must never alter alpha or issued signals');
          if(!Number.isFinite(Number(live?.summary?.resolvedSessions))) throw new Error('Resolved session count missing');
          if(ready.engine!=='V16_9_EQUAL_WEIGHT_BASKET') throw new Error('Readiness engine mismatch');
          console.log({
            tracked: live?.normalization?.totalTrackedSessions,
            resolved: live?.summary?.resolvedSessions,
            pending: live?.normalization?.pendingSessions,
            recommendations: live?.memberSummary?.totalRecommendations,
            readiness: ready.professionalReadinessScore,
            foundation: ready.foundationQualityScore,
          });
          NODE

      - name: Commit corrected live ledger and readiness
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v16-v169-live-evaluation.json data/stable/v16-main-app-professional-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Normalize MAIN APP live session outcomes"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Dispatch Pages deployment
        if: steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref main

name: EGX V19 CHAT GPT Isolated Research

on:
  workflow_dispatch:
  push:
    branches: [v19-egx-chat-gpt]
    paths:
      - "scripts/v19/**"
      - "docs/v19/**"
      - "data/history/**"
      - "data/research/v16-v169-basket-engine.json"
      - ".github/workflows/v19-egx-chat-gpt.yml"

permissions:
  contents: write

concurrency:
  group: egx-v19-chat-gpt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v19-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V19 branch
        uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Enforce V19 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v19-egx-chat-gpt"
          git fetch origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          changed="$(git diff --name-only origin/develop/v17-rebuild...HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v19/|docs/v19/|data/v19/|\.github/workflows/v19-egx-chat-gpt\.yml$)' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - name: Sync latest MAIN APP market evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "$MAIN_SHA:data/research/v16-v169-basket-engine.json"
          git checkout "$MAIN_SHA" -- data/history data/research/v16-v169-basket-engine.json
          test -n "$(find data/history -maxdepth 1 -type f -name '*.json' -print -quit)"
          echo "V19 research inputs synced from MAIN APP data commit $MAIN_SHA (workspace only)."
      - name: Setup Python
        uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Static validation
        run: |
          python -m py_compile scripts/v19/native-challenger-v2.py scripts/v19/native-challenger-v4.py scripts/v19/native-challenger-v6.py
          node --check scripts/v19/challenger-gate-v6.cjs
          node --check scripts/v19/regression-v6.cjs
          node --check scripts/v19/freeze-v6-research-champion.cjs
      - name: Build V19 v6 risk budget challenger
        run: python scripts/v19/native-challenger-v6.py
      - name: Run V19 v6 strict benchmark gate
        run: |
          node scripts/v19/challenger-gate-v6.cjs
          node scripts/v19/regression-v6.cjs
      - name: Freeze benchmark-dominant V19 research champion
        run: node scripts/v19/freeze-v6-research-champion.cjs
      - name: Verify governance locks
        run: |
          node -e "const x=require('./data/v19/challenger-status-v6.json');if(x.benchmarkDominant!==true||x.promotionAllowed!==false||x.freshIndependentEvidenceRequired!==true)process.exit(1)"
          node -e "const x=require('./data/v19/v6-research-champion-lock.json');if(x.status!=='FROZEN_V19_RESEARCH_CHAMPION'||x.governance.productionPromoted!==false||x.governance.automaticPromotion!==false)process.exit(1)"
          node -e "const x=require('./data/v19/regression-v6.json');if(x.ok!==true||x.failedCount!==0)process.exit(1)"
      - name: Restore synced upstream inputs before persist
        shell: bash
        run: |
          git restore --worktree --staged -- data/history data/research/v16-v169-basket-engine.json
      - name: Persist V19 v6 frozen evidence only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v19/native-challenger-v6.json data/v19/challenger-status-v6.json data/v19/regression-v6.json data/v19/v6-research-champion-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V19 v6 research evidence"
          git push origin HEAD:v19-egx-chat-gpt

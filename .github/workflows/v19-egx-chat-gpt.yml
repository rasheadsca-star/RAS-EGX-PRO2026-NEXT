name: EGX V19 CHAT GPT Isolated Research

on:
  workflow_dispatch:
  push:
    branches: [v19-egx-chat-gpt]
    paths:
      - "scripts/v19/**"
      - "docs/v19/**"
      - "data/history/**"
      - "data/research/v16-v169-basket-engine.json"
      - ".github/workflows/v19-egx-chat-gpt.yml"

permissions:
  contents: write

concurrency:
  group: egx-v19-chat-gpt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v19-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V19 branch
        uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Enforce V19 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v19-egx-chat-gpt"
          git fetch origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          changed="$(git diff --name-only origin/develop/v17-rebuild...HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v19/|docs/v19/|data/v19/|\.github/workflows/v19-egx-chat-gpt\.yml$)' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - name: Setup Python
        uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Static validation
        run: python -m py_compile scripts/v19/native-challenger-v2.py scripts/v19/native-challenger-v4.py scripts/v19/v4-policy-diagnostic.py
      - name: Run diagnostic only
        run: python scripts/v19/v4-policy-diagnostic.py
      - name: Verify disclosure
        run: node -e "const x=require('./data/v19/v4-policy-diagnostic.json');if(x.postHocHoldoutInspection!==true||x.countsAsIndependentEvidence!==false)process.exit(1)"
      - name: Persist diagnostic only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v19/v4-policy-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V19 post-hoc policy diagnostic"
          git push origin HEAD:v19-egx-chat-gpt

name: EGX V19 CHAT GPT Isolated Research

on:
  workflow_dispatch:
  push:
    branches: [v19-egx-chat-gpt]
    paths:
      - "scripts/v19/**"
      - "docs/v19/**"
      - "data/history/**"
      - "data/research/v16-v169-basket-engine.json"
      - ".github/workflows/v19-egx-chat-gpt.yml"

permissions:
  contents: write

concurrency:
  group: egx-v19-chat-gpt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v19-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated V19 branch
        uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Enforce V19 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v19-egx-chat-gpt"
          git fetch origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          changed="$(git diff --name-only origin/develop/v17-rebuild...HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v19/|docs/v19/|data/v19/|\.github/workflows/v19-egx-chat-gpt\.yml$)' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - name: Sync latest MAIN APP market evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "$MAIN_SHA:data/research/v16-v169-basket-engine.json"
          git checkout "$MAIN_SHA" -- data/history data/research/v16-v169-basket-engine.json
          test -n "$(find data/history -maxdepth 1 -type f -name '*.json' -print -quit)"
          echo "V19 research inputs synced from MAIN APP data commit $MAIN_SHA (workspace only)."
      - name: Setup Python
        uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Static validation
        run: |
          python -m py_compile scripts/v19/native-challenger-v2.py scripts/v19/native-challenger-v4.py scripts/v19/native-challenger-v6.py scripts/v19/target-stop-audit-v6.py
          node --check scripts/v19/challenger-gate-v6.cjs
          node --check scripts/v19/regression-v6.cjs
          node --check scripts/v19/freeze-v6-research-champion.cjs
      - name: Build V19 v6 risk budget challenger
        run: python scripts/v19/native-challenger-v6.py
      - name: Audit V19 V6 target and stop outcomes
        run: |
          python scripts/v19/target-stop-audit-v6.py
          python - <<'PY'
          import json
          x=json.load(open('data/v19/target-stop-audit-v6.json',encoding='utf-8'))
          assert x['schemaVersion']=='19.5.0-target-stop-audit-v1'
          assert x['engineId']=='V19_CHAT_GPT_NATIVE_CHALLENGER_V6'
          assert x['auditWindow']['sessions']==20
          assert x['selectionCount']>0
          assert x['changesRanking'] is False and x['changesExecutionPermission'] is False
          print(json.dumps({k:x[k] for k in ['selectionCount','executableByOpenRuleCount','conservativeTargetHitCount','conservativeTargetHitRateOfExecutablePct','stopTouchedCount','stopTouchRateOfExecutablePct','ambiguousTargetAndStopSameDayCount']},ensure_ascii=False,indent=2))
          PY
      - name: Run V19 v6 strict benchmark gate
        run: |
          node scripts/v19/challenger-gate-v6.cjs
          node scripts/v19/regression-v6.cjs
      - name: Preserve or refresh V19 research champion lock
        shell: bash
        run: |
          set -euo pipefail
          if node -e "const x=require('./data/v19/challenger-status-v6.json');process.exit(x.benchmarkDominant===true&&x.status==='BENCHMARK_DOMINANT_RESEARCH_LOCKED'?0:1)"; then
            node scripts/v19/freeze-v6-research-champion.cjs
          else
            echo "Current V19 evidence is not fully benchmark-dominant; preserving the historical frozen lock and recording current Shadow status instead."
          fi
      - name: Verify current V19 governance
        run: |
          node - <<'NODE'
          const gate=require('./data/v19/challenger-status-v6.json');
          const reg=require('./data/v19/regression-v6.json');
          const lock=require('./data/v19/v6-research-champion-lock.json');
          const audit=require('./data/v19/target-stop-audit-v6.json');
          if(gate.promotionAllowed!==false||gate.automaticPromotion!==false||gate.freshIndependentEvidenceRequired!==true)throw Error('Current V19 governance invalid');
          if(!['BENCHMARK_DOMINANT_RESEARCH_LOCKED','SHADOW_RESEARCH_CONTINUES'].includes(gate.status))throw Error(`Unexpected V19 gate status: ${gate.status}`);
          if(reg.ok!==true||reg.failedCount!==0)throw Error('V19 regression failed');
          if(lock.status!=='FROZEN_V19_RESEARCH_CHAMPION'||lock.governance?.productionPromoted!==false||lock.governance?.automaticPromotion!==false)throw Error('Historical V19 lock invalid');
          if(audit.engineId!=='V19_CHAT_GPT_NATIVE_CHALLENGER_V6'||audit.changesRanking!==false||audit.changesExecutionPermission!==false)throw Error('V19 target/stop audit isolation invalid');
          console.log(JSON.stringify({benchmarkDominant:gate.benchmarkDominant,status:gate.status,promotionAllowed:gate.promotionAllowed,regressionOk:reg.ok,historicalLockPreserved:true,targetStopAudit:true},null,2));
          NODE
      - name: Restore synced upstream inputs before persist
        shell: bash
        run: |
          git restore --worktree --staged -- data/history data/research/v16-v169-basket-engine.json
      - name: Persist current V19 v6 research evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v19/native-challenger-v6.json data/v19/target-stop-audit-v6.json data/v19/challenger-status-v6.json data/v19/regression-v6.json data/v19/v6-research-champion-lock.json
          staged="$(git diff --cached --name-only)"
          test -z "$(printf '%s\n' "$staged" | grep -Ev '^data/v19/(native-challenger-v6|target-stop-audit-v6|challenger-status-v6|regression-v6|v6-research-champion-lock)\.json$' || true)" || { echo "V19 persist isolation violation"; printf '%s\n' "$staged"; exit 1; }
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh V19 v6 current research evidence"
          git push origin HEAD:v19-egx-chat-gpt

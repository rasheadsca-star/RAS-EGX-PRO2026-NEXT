name: Astra Retrospective Simulator vs V16.9

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'scripts/astra/astra-v169-retrospective-simulator.cjs'
      - '.github/workflows/astra-v169-retrospective-simulator.yml'

permissions:
  contents: write

concurrency:
  group: astra-v169-retrospective-simulator
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full current repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run retrospective simulator
        run: |
          set -euo pipefail
          node --check scripts/astra/astra-v169-retrospective-simulator.cjs
          node scripts/astra/astra-v169-retrospective-simulator.cjs

      - name: Commit simulator outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/astra/ASTRA_V169_RETROSPECTIVE_COMPARISON.json \
                  docs/astra/ASTRA_V169_RETROSPECTIVE_COMPARISON.md \
                  astra-prod/app/intelligence/retrospective-v169-comparison.json
          if git diff --cached --quiet; then
            echo "No simulator output changes."
            exit 0
          fi
          git commit -m "Update Astra retrospective comparison vs V16.9"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 8))
          done

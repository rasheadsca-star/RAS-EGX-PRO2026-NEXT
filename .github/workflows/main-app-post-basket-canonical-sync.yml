name: MAIN APP — Post Basket Canonical Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EGX V16.9 Basket Engine"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main-app-post-basket-canonical-sync.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-main-app-v1692-p2-canonical
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate canonical governance
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-main-app-governance.cjs
          node --check scripts/stable/v16-main-app-ledger-reconcile.cjs

      - name: Rebuild canonical MAIN APP snapshot
        shell: bash
        run: |
          set +e
          node scripts/stable/v16-main-app-governance.cjs
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then exit "$CODE"; fi
          test -s data/stable/v16-main-app-current.json
          test -s data/stable/v16-main-app-signal-ledger.json
          test -s data/stable/v16-main-app-ledger-reconcile.json
          node - <<'NODE'
          const primary=require('./data/stable/v16-v169-primary-decision.json');
          const current=require('./data/stable/v16-main-app-current.json');
          if(primary.sessionDate!==current.sessionDate) {
            throw new Error(`Canonical session mismatch: primary=${primary.sessionDate} current=${current.sessionDate}`);
          }
          const p=(primary.recommendations||[]).map(r=>r.ticker).join(',');
          const c=(current.recommendations||[]).map(r=>r.ticker).join(',');
          if(p!==c) {
            const rec=require('./data/stable/v16-main-app-ledger-reconcile.json');
            if(rec?.reason!=='RESTORED_PUBLISHED_LEDGER_PLAN_AND_ORDER') {
              throw new Error(`Canonical recommendation mismatch without ledger reconciliation: primary=${p} current=${c}`);
            }
          }
          console.log({sessionDate:current.sessionDate,snapshotGeneratedAt:current.snapshotGeneratedAt,recommendations:(current.recommendations||[]).map(r=>r.ticker),systemState:current.systemState});
          NODE

      - name: Commit canonical snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stable/v16-main-app-current.json \
            data/stable/v16-main-app-signal-ledger.json \
            data/stable/v16-main-app-ledger-reconcile.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize MAIN APP canonical snapshot after basket publish"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          else
            echo "Canonical snapshot already synchronized."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload latest complete application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy synchronized MAIN APP
        id: deployment
        uses: actions/deploy-pages@v4

name: EGX Integrated Decision Platform Validation

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - "scripts/v20/**"
      - "docs/v20/**"
      - "data/v20/**"
      - "v20/**"
      - ".github/workflows/v20-integrated-decision-platform.yml"
      - "data/v17/**"
      - "data/v19/**"
      - "data/final-opportunity-ranking.json"
      - "data/research/v16-v169-basket-engine.json"

permissions:
  contents: write

concurrency:
  group: egx-v20-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-integrated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V20 integration branch
        uses: actions/checkout@v6
        with: {fetch-depth: 1}

      - name: Enforce integration branch isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v20-integrated-decision-platform"
          # Immutable merge-base between V19 and V20. Comparing against a moving
          # V19 HEAD creates false violations whenever V19 advances independently.
          V20_ISOLATION_BASE="fb5aafb3e3e4cd908831a7cb98de3f952e356c34"
          git fetch --no-tags --depth=1 origin "$V20_ISOLATION_BASE"
          git cat-file -e "$V20_ISOLATION_BASE^{commit}"
          changed="$(git diff --name-only "$V20_ISOLATION_BASE" HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\.github/workflows/v20-integrated-decision-platform\.yml$|\.github/workflows/v20-market-regime\.yml$|\.github/workflows/v20-v17-centric-clean(-v2|-v3|-v5)?\.yml$|\.github/workflows/v20-primary-entry-point-acceptance\.yml$)' || true)"
          test -z "$violations" || { echo "V20 isolation violation:"; echo "$violations"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}

      - name: Sync latest accepted V17 evidence for runtime only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          readonly paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
          )
          for rel in "${paths[@]}"; do
            git cat-file -e "$V17_SHA:$rel" || { echo "Missing V17 runtime input: $rel"; exit 1; }
            mkdir -p "$(dirname "$rel")"
            tmp="${rel}.v17-runtime"
            git show "$V17_SHA:$rel" > "$tmp"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp"
            mv "$tmp" "$rel"
          done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" \
          V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" \
            node scripts/v20/validate-v17-runtime-sync.cjs
          echo "V20 runtime is using V17 $V17_SHA ($V17_DATE); upstream files remain unstaged/read-only."

      - name: Apply null semantics hardening
        run: node scripts/v20/apply-null-semantics-hardening.cjs

      - name: Static validation
        run: |
          node --check scripts/v20/validate-v17-runtime-sync.cjs
          node --check scripts/v20/apply-null-semantics-hardening.cjs
          node --check scripts/v20/null-semantics-regression.cjs
          node --check scripts/v20/build-data-truth.cjs
          node --check scripts/v20/data-quality-regression.cjs
          node --check scripts/v20/build-sector-provenance-audit.cjs
          node --check scripts/v20/sector-provenance-regression.cjs
          node --check scripts/v20/build-v18-performance-audit.cjs
          node --check scripts/v20/v18-performance-audit-regression.cjs
          node --check scripts/v20/build-performance-evidence-registry.cjs
          node --check scripts/v20/performance-evidence-regression.cjs
          node --check scripts/v20/apply-market-regime-integration.cjs
          node --check scripts/v20/build-market-regime.cjs
          node --check scripts/v20/market-regime-regression.cjs
          node --check scripts/v20/market-regime-unit.cjs
          node --check scripts/v20/build-integrated-decision-snapshot.cjs
          node --check scripts/v20/enrich-risk-reward.cjs
          node --check scripts/v20/validate-trade-plans.cjs
          node --check scripts/v20/build-portfolio-risk.cjs
          node --check scripts/v20/build-trusted-technical-history.cjs
          node --check scripts/v20/technical-history-regression.cjs
          node --check scripts/v20/build-stock-profiles.cjs
          node --check scripts/v20/build-market-explorer.cjs
          node --check scripts/v20/market-explorer-regression.cjs
          node --check scripts/v20/user-portfolio-regression.cjs
          node --check scripts/v20/archive-signal.cjs
          node --check scripts/v20/regression.cjs
          node --check scripts/v20/trade-plan-regression.cjs
          node --check scripts/v20/phase3-regression.cjs
          node --check scripts/v20/validate-ui.cjs
          node --check scripts/v20/browser-smoke.cjs
          node --check v20/app.js
          node --check v20/performance.js
          node --check v20/portfolio-core.js
          node --check v20/portfolio.js
          node -e "JSON.parse(require('fs').readFileSync('data/v20/policy-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/v20/model-registry.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/v20/decision-intelligence-policy.json','utf8'))"
          node -e "const s=JSON.parse(require('fs').readFileSync('data/v20/v17-runtime-sync.json','utf8')); if(s.ok!==true) process.exit(1)"

      - name: Build V20 data truth layer
        run: node scripts/v20/build-data-truth.cjs

      - name: Run semantic data-quality regression
        run: node scripts/v20/data-quality-regression.cjs

      - name: Build sector provenance audit
        run: node scripts/v20/build-sector-provenance-audit.cjs

      - name: Build current full-market regime evidence
        env:
          V20_REGIME_NETWORK_REFRESH: "true"
          V20_REGIME_CONCURRENCY: "6"
          V20_REGIME_MIN_PARTICIPATION_PCT: "60"
          V20_REGIME_PRICE_TOLERANCE_PCT: "5"
          V20_REGIME_MIN_TRUSTED_SESSIONS: "50"
          V20_REGIME_FETCH_RANGE: "6mo"
        run: node scripts/v20/build-market-regime.cjs

      - name: Run market regime leakage and provenance regression
        run: node scripts/v20/market-regime-regression.cjs

      - name: Build integrated decision snapshot
        run: node scripts/v20/build-integrated-decision-snapshot.cjs

      - name: Enrich conservative cost-aware risk reward
        run: node scripts/v20/enrich-risk-reward.cjs

      - name: Validate trade plan current-price alignment
        run: node scripts/v20/validate-trade-plans.cjs

      - name: Build portfolio risk plan
        run: node scripts/v20/build-portfolio-risk.cjs

      - name: Build trusted point-in-time technical history
        env:
          V20_HISTORY_NETWORK_REFRESH: "true"
          V20_HISTORY_CONCURRENCY: "4"
          V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: "5"
        run: node scripts/v20/build-trusted-technical-history.cjs

      - name: Run technical history and leakage regression
        run: node scripts/v20/technical-history-regression.cjs

      - name: Build stock analytical profiles
        run: node scripts/v20/build-stock-profiles.cjs

      - name: Run sector provenance regression
        run: node scripts/v20/sector-provenance-regression.cjs

      - name: Build full-market explorer
        run: node scripts/v20/build-market-explorer.cjs

      - name: Run Market Explorer regression
        run: node scripts/v20/market-explorer-regression.cjs

      - name: Run null semantics regression
        run: node scripts/v20/null-semantics-regression.cjs

      - name: Run user portfolio regression
        run: node scripts/v20/user-portfolio-regression.cjs

      - name: Archive immutable daily signal and forward horizons
        run: node scripts/v20/archive-signal.cjs

      - name: Build V18 performance audit gate
        run: node scripts/v20/build-v18-performance-audit.cjs

      - name: Run V18 performance audit regression
        run: node scripts/v20/v18-performance-audit-regression.cjs

      - name: Build separated performance evidence registry
        run: node scripts/v20/build-performance-evidence-registry.cjs

      - name: Run performance evidence regression
        run: node scripts/v20/performance-evidence-regression.cjs

      - name: Run governance and risk regression suite
        run: node scripts/v20/regression.cjs

      - name: Run trade-plan alignment regression
        run: node scripts/v20/trade-plan-regression.cjs

      - name: Run Phase 3 truth and archive regression
        run: node scripts/v20/phase3-regression.cjs

      - name: Validate V20 UI contract
        run: node scripts/v20/validate-ui.cjs

      - name: Run Chromium browser smoke acceptance
        run: node scripts/v20/browser-smoke.cjs

      - name: Acceptance guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=require('./data/v20/current.json');
          const v17Sync=require('./data/v20/v17-runtime-sync.json');
          const r=require('./data/v20/regression.json');
          const tr=require('./data/v20/trade-plan-regression.json');
          const tpa=require('./data/v20/trade-plan-audit.json');
          const r3=require('./data/v20/phase3-regression.json');
          const ui=require('./data/v20/ui-validation.json');
          const browser=require('./data/v20/browser-smoke.json');
          const dq=require('./data/v20/data-quality-regression.json');
          const ns=require('./data/v20/null-semantics-regression.json');
          const sector=require('./data/v20/sector-provenance-audit.json');
          const sectorReg=require('./data/v20/sector-provenance-regression.json');
          const v18Audit=require('./data/v20/v18-performance-audit.json');
          const v18Reg=require('./data/v20/v18-performance-audit-regression.json');
          const perf=require('./data/v20/performance-evidence-registry.json');
          const perfReg=require('./data/v20/performance-evidence-regression.json');
          const upr=require('./data/v20/user-portfolio-regression.json');
          const rr=require('./data/v20/risk-reward-audit.json');
          const profiles=require('./data/v20/stock-profiles.json');
          const th=require('./data/v20/technical-history.json');
          const ti=require('./data/v20/technical-indicators.json');
          const ts=require('./data/v20/technical-history-status.json');
          const treg=require('./data/v20/technical-history-regression.json');
          const mx=require('./data/v20/market-explorer.json');
          const mxr=require('./data/v20/market-explorer-regression.json');
          const snapshot=require('./data/v20/current-market-snapshot.json');
          const universe=require('./data/v20/master-universe.json');
          const archive=require('./data/v20/signal-archive/index.json');
          const forward=require('./data/v20/forward-evaluation.json');
          const p=require('./data/v20/portfolio-risk.json');
          const policy=require('./data/v20/policy-registry.json');
          const decisionPolicy=require('./data/v20/decision-intelligence-policy.json');
          if(v17Sync.ok!==true||v17Sync.failedCount!==0) process.exit(1);
          if(v17Sync.source?.branch!=='develop/v17-rebuild'||!/^[0-9a-f]{40}$/.test(v17Sync.source?.commitSha||'')) process.exit(1);
          if(v17Sync.sessionDate!==x.sessionDate||v17Sync.governance?.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET') process.exit(1);
          if(v17Sync.governance?.promotionAllowed!==false||v17Sync.governance?.automaticPromotion!==false||v17Sync.governance?.v20MayMutateV17Branch!==false||v17Sync.governance?.v17FilesPersistedIntoV20Branch!==false) process.exit(1);
          if(v17Sync.persistence?.upstreamWorkingTreeFilesAreTemporary!==true||v17Sync.persistence?.upstreamFilesStagedForV20Commit!==false||v17Sync.persistence?.sourceShaPersistedForReproducibility!==true) process.exit(1);
          if(r.ok!==true||tr.ok!==true||r3.ok!==true||ui.ok!==true||browser.ok!==true||treg.ok!==true||mxr.ok!==true||dq.ok!==true||ns.ok!==true||sectorReg.ok!==true||v18Reg.ok!==true||perfReg.ok!==true||upr.ok!==true) process.exit(1);
          if(browser.schemaVersion!=='20.0.0-browser-smoke-1'||browser.sessionDate!==x.sessionDate) process.exit(1);
          for(const key of ['indexLoadedWithOpportunities','executionBadgeRendered','researchScoreHeaderRendered','decisionSeparationVisible','researchScoreVisibleForOpportunity','decisionComponentsRendered','marketOnlyNoResearchScoreDisclosure','marketOnlyNoFakeScoreScopeDisclosure','marketOnlyResearchScoreWidgetAbsent','healthPageLoaded','performancePageLoaded','performanceNoHeadlineReturnWidget','noRuntimeOrConsoleErrors']) if(browser.checks?.[key]?.ok!==true) process.exit(1);
          if((browser.viewportResults||[]).length!==5||(browser.viewportResults||[]).some(v=>v.ready!==true||v.horizontalOverflow!==false||((v.width<=430)&&v.dialogHorizontalOverflow!==false))) process.exit(1);
          if((browser.consoleErrors||[]).length!==0) process.exit(1);
          if(decisionPolicy.status!=='SHADOW_RESEARCH_ONLY_UNCALIBRATED'||decisionPolicy.scoreIsConfidence!==false||decisionPolicy.scoreCanOpenExecutionGate!==false||decisionPolicy.scoreCanDriveProductionAllocation!==false||decisionPolicy.scoreCanChangeChampion!==false||decisionPolicy.scoreCanTriggerAutomaticPromotion!==false||decisionPolicy.modelConfidenceMayBeInferredFromScore!==false) process.exit(1);
          if(profiles.decisionIntelligenceSummary?.usedForExecutionGate!==false||profiles.decisionIntelligenceSummary?.usedForProductionAllocation!==false||profiles.decisionIntelligenceSummary?.usedForChampionSelection!==false) process.exit(1);
          if((profiles.profiles||[]).some(pr=>pr.decisionIntelligence?.scoreIsConfidence!==false||pr.decisionIntelligence?.execution?.scoreMayOpenExecutionGate!==false||pr.decisionIntelligence?.execution?.scoreMayCreateActionableStatus!==false)) process.exit(1);
          if(policy.tradePlan?.currentPriceAlignment?.enabled!==true) process.exit(1);
          if(policy.tradePlan?.currentPriceAlignment?.actionableRequiresCurrentPriceInsideEntryRange!==true) process.exit(1);
          if(policy.technicalHistory?.missingOhlcSynthesisAllowed!==false) process.exit(1);
          if(policy.technicalHistory?.futureRowsAllowed!==false) process.exit(1);
          if(policy.technicalHistory?.pointInTimeCutoffRequired!==true) process.exit(1);
          if(policy.technicalHistory?.productionExecutionGate!==false) process.exit(1);
          if(policy.dataQuality?.semanticCompletenessRequired!==true) process.exit(1);
          if(policy.dataQuality?.nonPositiveOhlcTreatedAsMissing!==true) process.exit(1);
          if(policy.dataQuality?.ohlcInvariantRequiredForCompleteState!==true) process.exit(1);
          const sp=policy.portfolio?.sectorConcentrationPolicy||{};
          if(sp.enabled!==false||sp.status!=='BLOCKED_UNTIL_VERIFIED_PROVENANCE') process.exit(1);
          if(sp.nameOrTickerInferenceAllowedForProduction!==false||sp.seedMapAllowedForProduction!==false) process.exit(1);
          if(sector.summary?.productionVerifiedCount!==0||sector.summary?.productionSectorConcentrationEnabled!==false) process.exit(1);
          if((sector.rows||[]).some(s=>s.acceptedForProduction===true||s.productionSector!==null)) process.exit(1);
          if((profiles.profiles||[]).some(pr=>pr.sectorContext?.sector!==null)) process.exit(1);
          if(p.sectorConcentrationApplied===true||p.productionSectorConcentrationEnabled===true) process.exit(1);
          if(v18Audit.schemaVersion!=='20.0.0-v18-performance-audit-1') process.exit(1);
          if(JSON.stringify(v18Audit.unreconciledClaims?.observedTradeCounts)!==JSON.stringify([16,971,1138])) process.exit(1);
          if(v18Audit.governance?.canCalibrateV20DecisionScore!==false||v18Audit.governance?.canOpenExecutionGate!==false||v18Audit.governance?.canChangeChampion!==false||v18Audit.governance?.canPromoteChallenger!==false) process.exit(1);
          if((v18Audit.source?.sourceArtifactAvailable!==true||v18Audit.reproducible!==true||v18Audit.unreconciledClaims?.reconciled!==true)&&v18Audit.acceptedForPerformanceClaims!==false) process.exit(1);
          if(perf.policy?.singleHeadlinePerformanceMetricAllowed!==false) process.exit(1);
          if(perf.policy?.crossEvidenceAggregationAllowed!==false) process.exit(1);
          if(perf.policy?.historicalAndForwardEvidenceMustRemainSeparate!==true) process.exit(1);
          if(perf.policy?.developmentAndHoldoutEvidenceMustRemainSeparate!==true) process.exit(1);
          if(perf.policy?.reusedBenchmarkCanPromoteChallenger!==false) process.exit(1);
          if(perf.policy?.pendingForwardReturnMustRemainNull!==true) process.exit(1);
          if(perf.policy?.v18AuditRequired!==true) process.exit(1);
          if(perf.policy?.v18PerformanceAccepted!==(v18Audit.acceptedForPerformanceClaims===true&&v18Audit.reproducible===true)) process.exit(1);
          if(perf.externalReferences?.v18?.acceptedForPerformanceClaims!==perf.policy.v18PerformanceAccepted) process.exit(1);
          if(perf.externalReferences?.v18?.governance?.canCalibrateV20DecisionScore!==false||perf.externalReferences?.v18?.governance?.canOpenExecutionGate!==false||perf.externalReferences?.v18?.governance?.canChangeChampion!==false||perf.externalReferences?.v18?.governance?.canPromoteChallenger!==false) process.exit(1);
          if(perf.summary?.v19AutomaticPromotion!==false||perf.summary?.v19PromotionAllowed!==false) process.exit(1);
          const v19bench=(perf.entries||[]).find(e=>e.evidenceId==='V19_V6_REUSED_BENCHMARK');
          if(!v19bench||v19bench.promotionEligible!==false||v19bench.independence?.freshIndependentEvidence!==false) process.exit(1);
          const v19dev=(perf.entries||[]).find(e=>e.evidenceId==='V19_V6_DEVELOPMENT_OOS');
          if(!v19dev||v19dev.evidenceClass!=='DEVELOPMENT_OOS'||v19dev.independence?.freshIndependentEvidence!==false) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.status==='PENDING'&&(e.portfolioReturnGrossPct!==null||e.portfolioReturnNetPct!==null))) process.exit(1);
          if(policy.userPortfolio?.storage!=='BROWSER_LOCAL_STORAGE_ONLY') process.exit(1);
          if(policy.userPortfolio?.serverPersistence!==false||policy.userPortfolio?.repositoryPersistence!==false) process.exit(1);
          if(policy.userPortfolio?.influencesModelPortfolio!==false||policy.userPortfolio?.influencesExecutionGate!==false) process.exit(1);
          if(policy.userPortfolio?.automaticOrders!==false||policy.userPortfolio?.automaticBuySellInstructions!==false) process.exit(1);
          if(policy.userPortfolio?.valuationRequiresCurrentSessionPrice!==true||policy.userPortfolio?.stalePriceFallbackAllowed!==false) process.exit(1);
          if(snapshot.semanticQuality?.semanticCompleteness!==true) process.exit(1);
          if((snapshot.rows||[]).some(row=>['open','high','low'].some(k=>row[k]!==null && !(Number(row[k])>0)))) process.exit(1);
          if((snapshot.rows||[]).some(row=>row.dataQualityState==='COMPLETE_FOR_CURRENT_SCOPE' && row.ohlcValid!==true)) process.exit(1);
          if(th.provenancePolicy?.missingOhlcMayBeSynthesized!==false) process.exit(1);
          if(th.provenancePolicy?.futureRowsAllowed!==false) process.exit(1);
          if(ti.indicatorMethodology?.pointInTime!==true) process.exit(1);
          if(ts.asOfSessionDate!==x.sessionDate) process.exit(1);
          if((ti.symbols||[]).some(s=>s.usedForCurrentDecision===true && s.currentTechnicalReady!==true)) process.exit(1);
          if((ti.symbols||[]).some(s=>s.currentTechnicalReady===true && s.asOfSession!==x.sessionDate)) process.exit(1);
          if(mx.policy?.fullMarketSearch!==true||mx.policy?.marketOnlyIsRecommendation!==false) process.exit(1);
          if(mx.policy?.semanticRowQualityPropagated!==true) process.exit(1);
          if(mx.summary?.universeCount!==universe.count||(mx.rows||[]).length!==universe.count) process.exit(1);
          if((mx.rows||[]).some(row=>row.currentSessionAvailable!==true && row.price!==null)) process.exit(1);
          if((mx.rows||[]).some(row=>row.decision?.scope==='MARKET_ONLY' && row.decision?.status!==null)) process.exit(1);
          if((mx.rows||[]).some(row=>row.technical?.usedForCurrentDecision===true && row.technical?.state!=='CURRENT_READY')) process.exit(1);
          if((mx.rows||[]).some(row=>row.currentSessionAvailable===true && row.semanticCompleteness!==true)) process.exit(1);
          if((mx.rows||[]).some(row=>['previousClose','open','high','low','volume','turnover','trades'].some(k=>row[k]===0 && (row.dataQualityIssues||[]).some(issue=>issue.includes(k.toUpperCase())||issue.startsWith(k.toUpperCase()))))) process.exit(1);
          if(policy.marketRegime){
            if(policy.marketRegime.minimumVerifiedParticipationPct!==60) process.exit(1);
            if(policy.marketRegime.futureRowsAllowed!==false||policy.marketRegime.missingOhlcSynthesisAllowed!==false) process.exit(1);
            if(policy.marketRegime.sectorInputsAllowed!==false||policy.marketRegime.staleV16RegimeMayBePromotedToCurrent!==false) process.exit(1);
            if(policy.marketRegime.productionRiskBudgetInfluence!==false||policy.marketRegime.executionGateInfluence!==false) process.exit(1);
            if(!fs.existsSync('./data/v20/market-regime.json')||!fs.existsSync('./data/v20/market-regime-regression.json')) process.exit(1);
            const mr=require('./data/v20/market-regime.json');
            const mrReg=require('./data/v20/market-regime-regression.json');
            if(mrReg.ok!==true||mr.asOfSessionDate!==x.sessionDate) process.exit(1);
            if(mr.verified===true){
              if(!['BULLISH','NEUTRAL','BEARISH'].includes(mr.regime)) process.exit(1);
              if(x.marketStatus?.verified!==true||x.marketStatus?.regime!==mr.regime) process.exit(1);
              if(x.marketStatus?.marketConfidencePct!==mr.marketConfidencePct) process.exit(1);
            } else {
              if(mr.regime!=='UNVERIFIED_CURRENT_REGIME'||x.marketStatus?.verified!==false) process.exit(1);
            }
            if(x.marketStatus?.productionRiskBudgetInfluence!==false||x.marketStatus?.executionGateInfluence!==false) process.exit(1);
          }
          if(tpa.policy?.causeDiagnosisClaimed!==false) process.exit(1);
          if(x.governance.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET') process.exit(1);
          if(x.governance.automaticPromotion!==false||x.governance.promotionAllowed!==false) process.exit(1);
          if(x.executionStatus!=='EXECUTION_GRADE' && x.opportunities.some(o=>o.status==='ACTIONABLE')) process.exit(1);
          if(x.executionStatus!=='EXECUTION_GRADE' && x.portfolio.recommendedExposurePct!==0) process.exit(1);
          if(x.executionStatus!=='EXECUTION_GRADE' && p.appliedPositions.length!==0) process.exit(1);
          if(x.opportunities.some(o=>o.status==='ACTIONABLE' && o.tradePlan?.alignment?.eligibleForActionable!==true)) process.exit(1);
          if(x.opportunities.some(o=>o.status==='ACTIONABLE' && o.tradePlan?.alignment?.state!=='IN_ENTRY_RANGE')) process.exit(1);
          if(x.opportunities.some(o=>o.tradePlan?.alignment?.state==='REBUILD_REQUIRED' && !['WAIT','AVOID'].includes(o.status))) process.exit(1);
          if(x.portfolio.recommendedExposurePct>policy.portfolio.maximumTotalAllocationPct) process.exit(1);
          if(x.portfolio.shadowResearch?.appliedToProductionPortfolio!==false) process.exit(1);
          if(x.opportunities.some(o=>Number(o.suggestedPositionWeightPct||0)>policy.portfolio.maximumSinglePositionPct)) process.exit(1);
          if(x.riskRewardPolicy?.primaryMetric!=='CONSERVATIVE_NET_RR_AFTER_ROUND_TRIP_COSTS') process.exit(1);
          if(rr.legacyMetricPolicy!=='AUDIT_ONLY_REFERENCE_UNVERIFIED') process.exit(1);
          if(x.opportunities.some(o=>o.riskReward?.legacyIsPrimary!==false)) process.exit(1);
          if(profiles.technicalIndicatorPolicy!=='POINT_IN_TIME_TRUSTED_OHLC_ONLY_STALE_CONTEXT_NEVER_CURRENT_DECISION') process.exit(1);
          if((profiles.profiles||[]).some(pr=>pr.technicalAnalysis?.usedForCurrentDecision===true && pr.technicalAnalysis?.currentTechnicalReady!==true)) process.exit(1);

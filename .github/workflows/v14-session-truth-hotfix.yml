name: V14 session truth hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v14-session-truth-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-session-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch V14 session and live candidate precedence
        shell: bash
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('fs');
          const file = 'scripts/stable/v14-stable-decision-system.cjs';
          let source = fs.readFileSync(file, 'utf8');

          const oldMerge = `function mergeCandidate(existing, incoming) {
            const merged = { ...(existing || {}), ...(incoming || {}) };
            merged.stock = { ...(existing?.stock || {}), ...(incoming?.stock || {}) };
            merged.riskProfile = { ...(existing?.riskProfile || {}), ...(incoming?.riskProfile || {}) };
            merged.plan = { ...(existing?.plan || {}), ...(incoming?.plan || {}) };
            return merged;
          }`;

          const newMerge = `function mergeCandidate(existing, incoming) {
            const merged = { ...(existing || {}), ...(incoming || {}) };
            merged.stock = { ...(existing?.stock || {}), ...(incoming?.stock || {}) };
            merged.riskProfile = { ...(existing?.riskProfile || {}), ...(incoming?.riskProfile || {}) };
            merged.plan = { ...(existing?.plan || {}), ...(incoming?.plan || {}) };

            // The autonomous center is merged after the daily workspace. Mirror its
            // latest-session top-level values into the nested structures consumed by V14,
            // so stale workspace values cannot override Thursday/live snapshot values.
            const livePrice = num(incoming?.currentPrice ?? incoming?.price);
            const liveRsi14 = num(incoming?.rsi14);
            const liveVolumeRatio20 = num(incoming?.volumeRatio20);
            const liveAverageTurnover20Egp = num(incoming?.averageTurnover20Egp);
            const liveTechnicalScore = num(incoming?.technicalScore);
            const liveRiskScore = num(incoming?.riskScore);
            const liveLiquidityPercentile = num(incoming?.liquidityPercentile);

            if (livePrice !== null) merged.stock.price = livePrice;
            if (liveRsi14 !== null) merged.stock.rsi14 = liveRsi14;
            if (liveVolumeRatio20 !== null) merged.stock.volumeRatio20 = liveVolumeRatio20;
            if (liveAverageTurnover20Egp !== null) merged.stock.averageTurnover20Egp = liveAverageTurnover20Egp;
            if (liveTechnicalScore !== null) merged.stock.technicalScore = liveTechnicalScore;
            if (liveRiskScore !== null) merged.riskProfile.riskScore = liveRiskScore;
            if (liveLiquidityPercentile !== null) merged.riskProfile.liquidityPercentile = liveLiquidityPercentile;
            if (incoming?.riskLabelAr) merged.riskProfile.riskLabelAr = incoming.riskLabelAr;

            return merged;
          }`;

          const oldSessionResolver = `const historyDates = [...featureStore.regimes.keys()].sort();
            const sessionDate = dateOnly(center?.analysisSession)
              || dateOnly(center?.marketDate)
              || dateOnly(workspace?.sessionId)
              || dateOnly(researchV1320?.currentSession?.sessionDate)
              || historyDates.at(-1)
              || null;`;

          const newSessionResolver = `const historyDates = [...featureStore.regimes.keys()].sort();
            const historyDateSet = new Set(historyDates);
            const sessionCandidates = [
              summary?.latestMarketSession,
              historyDates.at(-1),
              researchV1320?.currentSession?.sessionDate,
              workspace?.sessionId,
              center?.analysisSession,
              center?.marketDate,
            ]
              .map(dateOnly)
              .filter(date => date && historyDateSet.has(date))
              .sort();
            const sessionDate = sessionCandidates.at(-1)
              || historyDates.at(-1)
              || null;`;

          if (!source.includes(newMerge)) {
            if (!source.includes(oldMerge)) throw new Error('V14 mergeCandidate block was not found');
            source = source.replace(oldMerge, newMerge);
          }

          if (!source.includes(newSessionResolver)) {
            if (!source.includes(oldSessionResolver)) throw new Error('V14 session resolver block was not found');
            source = source.replace(oldSessionResolver, newSessionResolver);
          }

          fs.writeFileSync(file, source, 'utf8');
          NODE

      - name: Rebuild V14 from latest completed market session
        run: node scripts/stable/v14-stable-decision-system.cjs

      - name: Validate V14 output
        run: node scripts/stable/v14-acceptance.cjs

      - name: Assert Thursday session is published
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('data/history-summary.json', 'utf8'));
          const report = JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json', 'utf8'));
          if (report.sessionDate !== summary.latestMarketSession) {
            throw new Error(`Session mismatch: report=${report.sessionDate}, history=${summary.latestMarketSession}`);
          }
          console.log(`Published V14 session: ${report.sessionDate}`);
          NODE

      - name: Commit permanent fix and refreshed report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stable/v14-stable-decision-system.cjs data/stable/v14-stable-decision.json data/stable/v14-forward-sessions.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix V14 latest completed market session truth'
          git push

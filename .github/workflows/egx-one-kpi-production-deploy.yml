name: EGX ONE Realized KPI Production Deploy

on:
  workflow_dispatch:
  push:
    branches: ['egx-one/clean-room-v0']
    paths:
      - 'index.html'
      - 'technical-chart-v2.js'
      - 'technical-chart-v2-core.js'
      - 'realized-kpi.js'
      - 'data/research/ui/latest.json'
      - 'data/research/strategy/latest.json'
      - 'data/research/published/latest.json'
      - 'data/research/simulator/latest.json'
      - 'data/research/shadow-ledger/latest.json'
      - '.github/workflows/egx-one-kpi-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: egx-one-kpi-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_PROJECT_ID: prj_R9NlULz7vTKPEWeoVB9vnRaanqFo
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify clean-room and realized KPI contracts
        run: npm test

      - name: Verify realized KPI against frozen historical simulator
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import './realized-kpi.js';
          import fs from 'node:fs';
          const K=globalThis.EGXOneRealizedKPI;
          const sim=JSON.parse(fs.readFileSync('data/research/simulator/latest.json','utf8'));
          const shadow=JSON.parse(fs.readFileSync('data/research/shadow-ledger/latest.json','utf8'));
          const x=K.summarizeRecords(sim.records);
          const p=sim.performance?.allDailySignals||{};
          if(x.total!==p.triggered)throw new Error(`KPI_TRIGGERED_MISMATCH:${x.total}:${p.triggered}`);
          if(x.targetHits!==p.target1OrBetter)throw new Error(`KPI_TARGET_MISMATCH:${x.targetHits}:${p.target1OrBetter}`);
          if(x.stops!==p.stops)throw new Error(`KPI_STOP_MISMATCH:${x.stops}:${p.stops}`);
          if(x.timeouts!==p.timeouts)throw new Error(`KPI_TIMEOUT_MISMATCH:${x.timeouts}:${p.timeouts}`);
          if(Math.abs(x.targetHitRatePct-p.target1HitRatePct)>0.01)throw new Error('KPI_TARGET_RATE_MISMATCH');
          if(Math.abs(x.failureRatePct-p.stopRatePct)>0.01)throw new Error('KPI_FAILURE_RATE_MISMATCH');
          if(K.CONTRACT.scoringImpact!=='NONE'||K.CONTRACT.recommendationMutationAllowed!==false||K.CONTRACT.executionAllowed!==false||K.CONTRACT.automaticOrders!==false)throw new Error('KPI_AUTHORITY_BOUNDARY_FAILED');
          const selected=K.selectEvidence(shadow,sim);
          if((shadow.resolutions||[]).length===0&&selected.forward!==false)throw new Error('FALSE_FORWARD_KPI_EVIDENCE');
          console.log(`KPI_VERIFIED:${x.total}:TARGET=${x.targetHitRatePct.toFixed(2)}:FAIL=${x.failureRatePct.toFixed(2)}:TIMEOUT=${x.timeoutRatePct.toFixed(2)}:${selected.evidenceGrade}`);
          NODE

      - name: Build KPI-aware production UI bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/egx-one-live
          mkdir -p /tmp/egx-one-live/data/research/ui /tmp/egx-one-live/data/research/strategy /tmp/egx-one-live/data/research/published /tmp/egx-one-live/data/research/simulator /tmp/egx-one-live/data/research/shadow-ledger /tmp/egx-one-live/.vercel
          cp index.html /tmp/egx-one-live/index.html
          cp technical-chart-v2.js /tmp/egx-one-live/technical-chart-v2.js
          cp technical-chart-v2-core.js /tmp/egx-one-live/technical-chart-v2-core.js
          cp realized-kpi.js /tmp/egx-one-live/realized-kpi.js
          cp data/research/ui/latest.json /tmp/egx-one-live/data/research/ui/latest.json
          cp data/research/strategy/latest.json /tmp/egx-one-live/data/research/strategy/latest.json
          cp data/research/published/latest.json /tmp/egx-one-live/data/research/published/latest.json
          cp data/research/simulator/latest.json /tmp/egx-one-live/data/research/simulator/latest.json
          cp data/research/shadow-ledger/latest.json /tmp/egx-one-live/data/research/shadow-ledger/latest.json
          printf '%s\n' '{"cleanUrls":true,"trailingSlash":false}' > /tmp/egx-one-live/vercel.json
          printf '%s\n' '{"projectId":"'"$VERCEL_PROJECT_ID"'","orgId":"'"$VERCEL_ORG_ID"'"}' > /tmp/egx-one-live/.vercel/project.json
          for f in index.html technical-chart-v2.js technical-chart-v2-core.js realized-kpi.js data/research/ui/latest.json data/research/strategy/latest.json data/research/published/latest.json data/research/simulator/latest.json data/research/shadow-ledger/latest.json; do test -s "/tmp/egx-one-live/$f"; done

      - name: Verify deploy credential availability
        id: auth
        shell: bash
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'DEPLOYMENT_BLOCKED:VERCEL_TOKEN_MISSING'
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_DEPLOY_CREDENTIAL:AVAILABLE'
          fi

      - name: Install pinned Vercel CLI
        if: steps.auth.outputs.available == 'true'
        run: npm install --global vercel@59.10.0

      - name: Deploy KPI-aware EGX ONE bundle to production
        if: steps.auth.outputs.available == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --cwd /tmp/egx-one-live | tail -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DEPLOYMENT_URL:$url"

      - name: Verify deployed KPI evidence and authority boundary
        if: steps.auth.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in technical-chart-v2.js technical-chart-v2-core.js realized-kpi.js data/research/ui/latest.json data/research/strategy/latest.json data/research/published/latest.json data/research/simulator/latest.json data/research/shadow-ledger/latest.json; do
            curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/$path" -o "/tmp/$(basename "$path")"
          done
          grep -q 'EGXOneTechnicalV2Loader' /tmp/technical-chart-v2.js
          grep -q 'EGXOneTechnicalV2' /tmp/technical-chart-v2-core.js
          grep -q 'EGXOneRealizedKPI' /tmp/realized-kpi.js
          node --input-type=module - <<'NODE'
          import '/tmp/realized-kpi.js';
          import fs from 'node:fs';
          const K=globalThis.EGXOneRealizedKPI;
          const sim=JSON.parse(fs.readFileSync('/tmp/latest.json','utf8'));
          const x=K.summarizeRecords(sim.records);
          if(x.total!==450||x.targetHits!==243||x.stops!==157||x.timeouts!==50)throw new Error(`DEPLOYED_KPI_COUNTS_BAD:${JSON.stringify(x)}`);
          if(Math.abs(x.targetHitRatePct-54)>0.001||Math.abs(x.failureRatePct-34.8888888889)>0.01||Math.abs(x.timeoutRatePct-11.1111111111)>0.01)throw new Error('DEPLOYED_KPI_RATE_BAD');
          if(K.CONTRACT.scoringImpact!=='NONE'||K.CONTRACT.executionAllowed!==false)throw new Error('DEPLOYED_KPI_AUTHORITY_BAD');
          console.log(`DEPLOYED_KPI_VERIFIED:TARGET=${x.targetHitRatePct.toFixed(2)}:FAIL=${x.failureRatePct.toFixed(2)}:TIMEOUT=${x.timeoutRatePct.toFixed(2)}`);
          NODE

      - name: Deployment summary
        shell: bash
        env:
          AUTH: ${{ steps.auth.outputs.available }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$AUTH" = 'true' ]; then
            echo '## EGX ONE Realized KPI Deploy' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: VERIFIED' >> "$GITHUB_STEP_SUMMARY"
            echo "- URL: ${URL}" >> "$GITHUB_STEP_SUMMARY"
            echo '- KPI: Target Hit / Failure Stop / Timeout day-by-day' >> "$GITHUB_STEP_SUMMARY"
            echo '- Evidence: Forward preferred; Historical replay clearly labeled until Forward resolves' >> "$GITHUB_STEP_SUMMARY"
            echo '- Authority: RESEARCH_ONLY / ZERO EXECUTION' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## EGX ONE Realized KPI Deploy' >> "$GITHUB_STEP_SUMMARY"
            echo '- Status: BLOCKED' >> "$GITHUB_STEP_SUMMARY"
            echo '- Reason: VERCEL_TOKEN_MISSING' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

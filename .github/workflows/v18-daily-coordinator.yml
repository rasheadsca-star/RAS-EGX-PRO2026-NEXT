name: V18 Daily Post-Close Coordinator

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v18-daily-coordinator.yml"
  schedule:
    # 14:20 UTC = 17:20 Cairo during DST; runs after the 13:30 UTC canonical refresh.
    - cron: "20 14 * * 0-4"

permissions:
  contents: write

concurrency:
  group: v18-daily-post-close-coordinator
  cancel-in-progress: false

jobs:
  refresh-v18:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0

      - name: Checkout V18 research branch
        uses: actions/checkout@v4
        with:
          ref: v18-global-strategy-ensemble-20260906
          path: v18
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify canonical market freshness
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Africa/Cairo
          EXPECTED_DATE="$(date +%F)"
          LATEST_DATE="$(node -e "const fs=require('fs');const p='main-src/data/quant/stocks/TMGH.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));process.stdout.write(String(x.sessionId||x.latest?.date||''))")"
          echo "Cairo date: ${EXPECTED_DATE}"
          echo "Canonical session: ${LATEST_DATE}"
          if [ -z "${LATEST_DATE}" ]; then
            echo "::error::Canonical session is missing."
            exit 1
          fi
          if [ "${LATEST_DATE}" != "${EXPECTED_DATE}" ]; then
            echo "::error::Canonical data is stale (${LATEST_DATE}); refusing to republish stale V18 recommendations for ${EXPECTED_DATE}."
            exit 1
          fi

      - name: Sync canonical market inputs into V18 branch workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v18/data/quant/stocks
          mkdir -p v18/data/quant
          cp -R main-src/data/quant/stocks v18/data/quant/stocks
          for f in \
            data/quant/stock-intelligence-index.json \
            data/quant/daily-recommendations.json \
            data/quant/adaptive-daily-recommendations.json \
            data/stable/v16-market-regime.json \
            data/stable/v15-practical-decision.json; do
            if [ -f "main-src/$f" ]; then
              mkdir -p "v18/$(dirname "$f")"
              cp "main-src/$f" "v18/$f"
            fi
          done

      - name: Build V18 from fresh canonical session
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v18-global-strategy-ensemble.cjs
          node --check scripts/stable/v18-leadership-extension.cjs
          node --check scripts/stable/v18-evidence-ranking.cjs
          node --check scripts/stable/build-v18-decision-board.cjs
          node --check scripts/stable/build-v18-web-preview.cjs
          node scripts/stable/build-v18-decision-board.cjs
          node scripts/stable/build-v18-web-preview.cjs

      - name: Validate V18 output session and execution levels
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          export TZ=Africa/Cairo
          EXPECTED_DATE="$(date +%F)"
          node <<'NODE'
          const fs=require('fs');
          const out=JSON.parse(fs.readFileSync('preview-v18/data.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('preview-v18-web/manifest.json','utf8'));
          const expected=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          if(out.sessionId!==expected) throw new Error(`V18 session ${out.sessionId} != Cairo date ${expected}`);
          if(out.dataHealth?.status!=='PASS') throw new Error(`Data health ${out.dataHealth?.status}`);
          if((out.dataHealth?.criticalFailureCount||0)!==0) throw new Error('Critical data-health failure');
          if(!manifest.multiTargetExecution) throw new Error('Multi-target execution missing');
          const levels=new Set(manifest.executionLevels||[]);
          for(const x of ['ENTRY_ZONE','TARGET1','TARGET2','TARGET3','STOP_LOSS']) if(!levels.has(x)) throw new Error(`Missing ${x}`);
          if((manifest.dashboardRecommendations||0)<20) throw new Error('Top 20 recommendations missing');
          console.log(JSON.stringify({sessionId:out.sessionId,candidates:out.allCandidates?.length||0,top20:manifest.dashboardRecommendations,dataHealth:out.dataHealth.status},null,2));
          NODE

      - name: Persist fresh V18 data and public preview
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/quant/stocks data/quant/stock-intelligence-index.json data/quant/daily-recommendations.json data/quant/adaptive-daily-recommendations.json data/stable/v16-market-regime.json data/stable/v15-practical-decision.json data/stable/v18-forward-ledger.json preview-v18/data.json preview-v18/forward-ledger.json preview-v18-web/index.html preview-v18-web/manifest.json
          if git diff --cached --quiet; then
            echo "No V18 changes to publish."
          else
            git commit -m "chore(v18): daily post-close refresh $(TZ=Africa/Cairo date +%F)"
            git pull --rebase origin v18-global-strategy-ensemble-20260906
            git push origin HEAD:v18-global-strategy-ensemble-20260906
          fi

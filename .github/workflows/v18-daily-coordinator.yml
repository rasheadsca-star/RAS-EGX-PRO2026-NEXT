name: V18 Daily Post-Close Coordinator

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "EGX V16.3.3 Immediate Market Rescan and Deploy"
    types:
      - completed
  push:
    paths:
      - ".github/workflows/v18-daily-coordinator.yml"
  schedule:
    - cron: "20 14 * * 0-4"
    - cron: "30 17 * * 0-4"
    - cron: "0 19 * * 0-4"

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
  VERCEL_PROJECT_ID: prj_n94juB97344WO7NQbp4Ef0XxxsvS
  V18_PUBLIC_URL: https://egx-pro-v18-2-unified-preview.vercel.app
  V18_BRANCH: v18-global-strategy-ensemble-20260906
  V18_LIVE_DATA_URL: https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18/data.json
  V18_LIVE_MANIFEST_URL: https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18-web/manifest.json

concurrency:
  group: v18-daily-post-close-coordinator
  cancel-in-progress: false

jobs:
  refresh-v18:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0

      - name: Checkout V18 decision engine
        uses: actions/checkout@v4
        with:
          ref: v18-global-strategy-ensemble-20260906
          path: v18
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and verify canonical market session
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SESSION="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('main-src/data/fetch-status.json','utf8'));process.stdout.write(String(s.expectedSession||''))")"
          CALENDAR_SESSION="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('main-src/data/session-calendar.json','utf8'));process.stdout.write(String(c.latestMarketSession||''))")"
          LATEST_DATE="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('main-src/data/quant/stocks/TMGH.json','utf8'));process.stdout.write(String(x.sessionId||x.latest?.date||''))")"
          FETCH_READY="$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('main-src/data/fetch-status.json','utf8'));process.stdout.write(String(Boolean(s.ok&&s.realFetch&&s.executionGrade&&Number(s.currentSessionRows||0)>=150)))")"
          test -n "$EXPECTED_SESSION" || { echo "::error::fetch-status.expectedSession is missing."; exit 1; }
          test "$FETCH_READY" = "true" || { echo "::error::Canonical fetch-status is not execution-grade/current enough for publication."; exit 1; }
          if [ "$CALENDAR_SESSION" != "$EXPECTED_SESSION" ] || [ "$LATEST_DATE" != "$EXPECTED_SESSION" ]; then
            echo "::error::Canonical session mismatch: fetch=$EXPECTED_SESSION calendar=$CALENDAR_SESSION stock=$LATEST_DATE."
            exit 1
          fi
          echo "EXPECTED_SESSION=$EXPECTED_SESSION" >> "$GITHUB_ENV"
          echo "Expected canonical market session: $EXPECTED_SESSION"

      - name: Sync canonical market inputs into V18 workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v18/data/quant/stocks
          mkdir -p v18/data/quant
          cp -R main-src/data/quant/stocks v18/data/quant/stocks
          for f in \
            data/session-calendar.json \
            data/fetch-status.json \
            data/quant/stock-intelligence-index.json \
            data/quant/daily-recommendations.json \
            data/quant/adaptive-daily-recommendations.json \
            data/stable/v16-market-regime.json \
            data/stable/v15-practical-decision.json; do
            if [ -f "main-src/$f" ]; then
              mkdir -p "v18/$(dirname "$f")"
              cp "main-src/$f" "v18/$f"
            fi
          done

      - name: Build V18 from canonical session
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="$PWD"
          node --check scripts/stable/v18-global-strategy-ensemble.cjs
          node --check scripts/stable/v18-leadership-extension.cjs
          node --check scripts/stable/v18-evidence-ranking.cjs
          node --check scripts/stable/build-v18-decision-board.cjs
          node --check scripts/stable/build-v18-web-preview.cjs
          node scripts/stable/build-v18-decision-board.cjs
          node scripts/stable/build-v18-web-preview.cjs

      - name: Validate V18 output and live-update contract
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const out=JSON.parse(fs.readFileSync('preview-v18/data.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('preview-v18-web/manifest.json','utf8'));
          const html=fs.readFileSync('preview-v18-web/index.html','utf8');
          const expected=process.env.EXPECTED_SESSION;
          if(out.sessionId!==expected) throw new Error(`V18 session ${out.sessionId} != expected ${expected}`);
          if(manifest.sessionId!==expected) throw new Error(`Manifest session ${manifest.sessionId} != expected ${expected}`);
          if(out.dataHealth?.status!=='PASS'||Number(out.dataHealth?.criticalFailureCount||0)!==0) throw new Error('V18 data-health gate failed');
          if(!Array.isArray(out.allCandidates)||out.allCandidates.length<20) throw new Error('V18 recommendations are incomplete');
          if(!manifest.multiTargetExecution) throw new Error('Multi-target execution missing');
          const levels=new Set(manifest.executionLevels||[]);
          for(const x of ['ENTRY_ZONE','TARGET1','TARGET2','TARGET3','STOP_LOSS']) if(!levels.has(x)) throw new Error(`Missing ${x}`);
          if((manifest.dashboardRecommendations||0)<20) throw new Error('Top 20 recommendations missing');
          if(manifest.liveLoaderVersion!=='github-live-v2') throw new Error('V18 live loader v2 missing');
          if(manifest.autoRefreshVersion!=='github-live-watch-v2') throw new Error('V18 live session watcher missing');
          if(Number(manifest.autoRefreshIntervalMs)!==60000) throw new Error('Unexpected live refresh interval');
          if(manifest.embeddedVerifiedFallback!==true) throw new Error('Embedded verified fallback missing');
          if(!String(manifest.liveDataSource||'').includes('/v18-global-strategy-ensemble-20260906/preview-v18/data.json')) throw new Error('Live source is not the canonical V18 branch');
          for(const marker of ['V18_LIVE_GITHUB_SOURCE_V1','V18_AUTO_REFRESH_WATCH_V2','window.__V18_CHECK_FOR_NEW_SESSION__']) if(!html.includes(marker)) throw new Error(`Missing ${marker}`);
          console.log(JSON.stringify({sessionId:out.sessionId,candidates:out.allCandidates.length,top20:manifest.dashboardRecommendations,dataHealth:out.dataHealth.status,liveLoader:manifest.liveLoaderVersion,autoRefresh:manifest.autoRefreshVersion},null,2));
          NODE

      - name: Persist fresh V18 data and public shell
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          required=(preview-v18/data.json preview-v18/forward-ledger.json preview-v18-web/index.html preview-v18-web/manifest.json)
          optional=(data/session-calendar.json data/fetch-status.json data/quant/stocks data/quant/stock-intelligence-index.json data/quant/daily-recommendations.json data/quant/adaptive-daily-recommendations.json data/stable/v16-market-regime.json data/stable/v15-practical-decision.json data/stable/v18-forward-ledger.json)
          for p in "${required[@]}"; do test -s "$p" || { echo "::error::Missing required publication artifact: $p"; exit 1; }; done
          for p in "${optional[@]}"; do [ ! -e "$p" ] || git add -f "$p"; done
          git add -f "${required[@]}"
          if git diff --cached --quiet; then
            echo "No V18 changes to publish."
          else
            git commit -m "chore(v18): verified post-close refresh ${EXPECTED_SESSION}"
            if ! git push origin HEAD:"$V18_BRANCH"; then
              echo "Remote advanced during publication; rebasing once and retrying."
              git pull --rebase origin "$V18_BRANCH"
              git push origin HEAD:"$V18_BRANCH"
            fi
          fi

      - name: Verify published branch snapshot
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V18_BRANCH" --depth=1
          git show origin/$V18_BRANCH:preview-v18/data.json > /tmp/v18-published-data.json
          git show origin/$V18_BRANCH:preview-v18-web/index.html > /tmp/v18-published-index.html
          git show origin/$V18_BRANCH:preview-v18-web/manifest.json > /tmp/v18-published-manifest.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/v18-published-data.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/v18-published-manifest.json','utf8'));
          const h=fs.readFileSync('/tmp/v18-published-index.html','utf8');
          if(d.sessionId!==process.env.EXPECTED_SESSION||m.sessionId!==process.env.EXPECTED_SESSION) throw new Error('Published V18 branch is stale');
          if(!Array.isArray(d.allCandidates)||d.allCandidates.length<20) throw new Error('Published candidates missing');
          if(m.liveLoaderVersion!=='github-live-v2'||m.autoRefreshVersion!=='github-live-watch-v2'||m.embeddedVerifiedFallback!==true) throw new Error('Published live-update contract missing');
          if(!h.includes('V18_AUTO_REFRESH_WATCH_V2')) throw new Error('Published shell watcher marker missing');
          console.log(JSON.stringify({publishedSession:d.sessionId,candidates:d.allCandidates.length,liveLoader:m.liveLoaderVersion,autoRefresh:m.autoRefreshVersion},null,2));
          NODE

      - name: Verify GitHub live source is current
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            stamp="$(date +%s%3N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_MANIFEST_URL?verify=$stamp" -o /tmp/live-manifest.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_DATA_URL?verify=$stamp" -o /tmp/live-data.json; then
              if node <<'NODE'
          const d=require('/tmp/live-data.json');
          const m=require('/tmp/live-manifest.json');
          if(d.sessionId!==process.env.EXPECTED_SESSION) process.exit(2);
          if(m.sessionId!==process.env.EXPECTED_SESSION) process.exit(3);
          if(d.dataHealth?.status!=='PASS'||Number(d.dataHealth?.criticalFailureCount||0)!==0) process.exit(4);
          if(!Array.isArray(d.allCandidates)||d.allCandidates.length<20) process.exit(5);
          if(m.liveLoaderVersion!=='github-live-v2'||m.autoRefreshVersion!=='github-live-watch-v2') process.exit(6);
          NODE
              then
                ok=1
                echo "V18_GITHUB_LIVE_SOURCE_PASS session=$EXPECTED_SESSION"
                break
              fi
            fi
            echo "Live-source propagation attempt $attempt not current yet."
            sleep 5
          done
          test "$ok" = "1" || { echo "::error::GitHub live source failed freshness verification."; exit 1; }

      - name: Probe V18.2 production shell contract
        id: prod_shell
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s%3N)"
          ROOT="$(curl -fsSL --retry 3 -H 'Cache-Control: no-cache' "$V18_PUBLIC_URL/?probe=$stamp" || true)"
          current=false
          if grep -q 'EGX PRO V18.2' <<<"$ROOT" \
            && grep -q 'V18_LIVE_GITHUB_SOURCE_V1' <<<"$ROOT" \
            && grep -q 'V18_AUTO_REFRESH_WATCH_V2' <<<"$ROOT" \
            && grep -q 'window.__V18_CHECK_FOR_NEW_SESSION__' <<<"$ROOT"; then
            current=true
          fi
          echo "shell_current=$current" >> "$GITHUB_OUTPUT"
          echo "Production shell current: $current"

      - name: Require Vercel token only for one-time shell bootstrap
        if: steps.prod_shell.outputs.shell_current != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::V18.2 shell needs one bootstrap deployment; VERCEL_TOKEN is missing."; exit 78; }

      - name: Prepare exact V18.2 production shell bundle
        if: steps.prod_shell.outputs.shell_current != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-v18-production
          mkdir -p deploy-v18-production/.vercel
          cp v18/preview-v18-web/index.html deploy-v18-production/index.html
          cp v18/preview-v18/data.json deploy-v18-production/data.json
          cp v18/preview-v18/forward-ledger.json deploy-v18-production/forward-ledger.json
          cp v18/preview-v18-web/manifest.json deploy-v18-production/manifest.json
          cat > deploy-v18-production/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "headers": [
              {"source":"/","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]},
              {"source":"/data.json","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]},
              {"source":"/manifest.json","headers":[{"key":"Cache-Control","value":"no-store, no-cache, must-revalidate, max-age=0"}]}
            ]
          }
          JSON
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > deploy-v18-production/.vercel/project.json
          grep -q 'V18_AUTO_REFRESH_WATCH_V2' deploy-v18-production/index.html
          node -e "const d=require('./deploy-v18-production/data.json');const m=require('./deploy-v18-production/manifest.json');if(d.sessionId!==process.env.EXPECTED_SESSION||m.autoRefreshVersion!=='github-live-watch-v2')throw new Error('Deploy bundle contract mismatch')"

      - name: Bootstrap verified shell to existing V18.2 production project
        if: steps.prod_shell.outputs.shell_current != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd deploy-v18-production
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify V18.2 production end-to-end
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            stamp="$(date +%s%3N)"
            ROOT="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_PUBLIC_URL/?verify=$stamp" || true)"
            if grep -q 'EGX PRO V18.2' <<<"$ROOT" \
              && grep -q 'V18_LIVE_GITHUB_SOURCE_V1' <<<"$ROOT" \
              && grep -q 'V18_AUTO_REFRESH_WATCH_V2' <<<"$ROOT" \
              && grep -q 'window.__V18_CHECK_FOR_NEW_SESSION__' <<<"$ROOT"; then
              if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_MANIFEST_URL?e2e=$stamp" -o /tmp/e2e-manifest.json \
                && node -e "const m=require('/tmp/e2e-manifest.json');if(m.sessionId!==process.env.EXPECTED_SESSION||m.dataHealth!=='PASS'||m.liveLoaderVersion!=='github-live-v2'||m.autoRefreshVersion!=='github-live-watch-v2')process.exit(2)"; then
                ok=1
                echo "V18_2_PRODUCTION_E2E_PASS session=$EXPECTED_SESSION source=github-live-v2 autoRefresh=60000ms"
                break
              fi
            fi
            echo "Production E2E attempt $attempt not ready yet."
            sleep 5
          done
          test "$ok" = "1" || { echo "::error::V18.2 production failed end-to-end live freshness verification."; exit 1; }

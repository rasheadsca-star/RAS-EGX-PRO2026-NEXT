name: Publish EGX ELITE Read Only Dashboard
on:
  push:
    branches: [main]
    paths:
      - 'egx-elite/**'
      - '.github/workflows/egx-elite-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: egx-elite-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate separate read-only dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s egx-elite/index.html
          test -s index.html
          node --test egx-elite/diagnose-data-gate.test.cjs
          python3 -m json.tool egx-elite/snapshot.json > /dev/null
          if grep -Eiq '<script[^>]+src=["\x27]https?://' egx-elite/index.html; then
            echo "Unexpected external script"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

name: GANN Pages Browser Smoke

on:
  push:
    branches:
      - test/gann-pages-browser-smoke
      - main
    paths:
      - 'gann-fusion-x/**'
      - '.github/workflows/gann-pages-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GANN_PAGE_URL: https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/gann-fusion-x/app/index-v1.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check gann-fusion-x/scripts/pages-browser-smoke.cjs
      - name: Browser smoke deployed GANN page
        run: node gann-fusion-x/scripts/pages-browser-smoke.cjs

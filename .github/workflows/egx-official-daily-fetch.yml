name: EGX Official Daily PDF — Fetch and Quarantine
on:
  schedule:
    - cron: '0 17 * * 0-4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf==1.26.5
      - name: Fetch official EGX 1022 PDF — staged only
        id: fetch
        continue-on-error: true
        run: python egx-pro-research-12nov2026/operations/fetch_official.py --output ingest-staging/latest.pdf
      - name: Parse PDF and run central validator (quarantine only)
        id: validation
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python egx-pro-research-12nov2026/operations/egx_pdf_extract.py ingest-staging/latest.pdf --output ingest-staging/extracted.json
          node egx-pro-research-12nov2026/operations/validate-extraction.cjs ingest-staging/extracted.json ingest-staging/validation.json
      - name: Report fetch status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.fetch.outcome }}" = "success" ]; then
            echo '### Official EGX PDF downloaded and sent to quarantine validation.' >> "$GITHUB_STEP_SUMMARY"
            cat ingest-staging/latest.pdf.json >> "$GITHUB_STEP_SUMMARY"
            if [ -f ingest-staging/validation.json ]; then cat ingest-staging/validation.json >> "$GITHUB_STEP_SUMMARY"; fi
          else
            echo '### UPLOAD_REQUIRED — official EGX fetch failed or produced no new valid PDF.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Use the browser manual-preview importer. No recommendations were changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outcome == 'success'
        with:
          name: egx-official-pdf-staging
          path: ingest-staging/
          retention-days: 14
      - name: Fail workflow when source or validation fails; never publish from staging
        if: steps.fetch.outcome != 'success' || steps.validation.outcome != 'success'
        run: |
          echo 'RESEARCH ONLY / UPLOAD_REQUIRED OR VALIDATION_BLOCKED. No latest.json or signals changed.'
          exit 1

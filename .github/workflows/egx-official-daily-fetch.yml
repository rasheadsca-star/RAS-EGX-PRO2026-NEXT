name: EGX official PDF intake
on:
  schedule:
    - cron: '0 17 * * 0-4'
  push:
    branches: [main]
    paths: ['egx-official-inbox/*.pdf']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: egx-official-persistent-intake
  cancel-in-progress: false
jobs:
  ingest:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: ''
      - run: python -m pip install --no-cache-dir pymupdf==1.26.5
      - name: Open persistent data branch
        run: |
          set -eu
          if git ls-remote --exit-code --heads origin refs/heads/egx-official-data; then
            git fetch --depth=1 origin refs/heads/egx-official-data
            git worktree add -b egx-official-data "$RUNNER_TEMP/ledger" FETCH_HEAD
          else
            code=$?
            test "$code" = 2
            git worktree add --detach "$RUNNER_TEMP/ledger" HEAD
            git -C "$RUNNER_TEMP/ledger" checkout --orphan egx-official-data
            git -C "$RUNNER_TEMP/ledger" rm -rqf .
          fi
      - name: Import operator uploads and official download
        id: intake
        continue-on-error: true
        env:
          EGX_DATA_DIR: ${{ runner.temp }}/ledger
        run: |
          python egx-pro-research-12nov2026/operations/github_intake.py
      - name: Persist completed imports
        run: |
          cd "$RUNNER_TEMP/ledger"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Record official EGX bulletin intake'
            git push origin HEAD:refs/heads/egx-official-data
          fi
      - if: steps.intake.outcome != 'success'
        run: exit 1

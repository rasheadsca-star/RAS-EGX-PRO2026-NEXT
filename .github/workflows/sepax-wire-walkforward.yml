name: SEPA-X Wire Walk-Forward Evidence

on:
  push:
    branches:
      - develop/sepax-isolated-v1
    paths:
      - '.github/workflows/sepax-wire-walkforward.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire research walk-forward and invalidate legacy V3 experiment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          w=Path('.github/workflows/sepax-historical-benchmark.yml')
          s=w.read_text()
          if "      - 'sepa-x/research-tools/**'" not in s:
            s=s.replace("      - 'sepa-x/scripts/**'\n", "      - 'sepa-x/scripts/**'\n      - 'sepa-x/research-tools/**'\n", 1)

          anchor="""      - name: Validate precision challengers V2 and preregistered V3
        working-directory: sepa-x
        run: node scripts/precision-challenger-validation.mjs

"""
          step="""      - name: Run preregistered research walk-forward evaluator
        working-directory: sepa-x
        run: node research-tools/research-walkforward.mjs

"""
          if 'Run preregistered research walk-forward evaluator' not in s:
            if anchor not in s: raise SystemExit('VALIDATION_STEP_ANCHOR_NOT_FOUND')
            s=s.replace(anchor,anchor+step,1)

          read_anchor="          const q=JSON.parse(fs.readFileSync('sepa-x/data/research/precision-challenger-validation.json'));\n"
          if "const w=JSON.parse(fs.readFileSync('sepa-x/data/research/research-walkforward.json'))" not in s:
            if read_anchor not in s: raise SystemExit('PRINT_READ_ANCHOR_NOT_FOUND')
            s=s.replace(read_anchor,read_anchor+"          const w=JSON.parse(fs.readFileSync('sepa-x/data/research/research-walkforward.json'));\n",1)
          print_anchor="          console.log('PRECISION_CHALLENGER_V3_GATE='+JSON.stringify(q.v3PromotionGate));\n"
          if "RESEARCH_WALKFORWARD_OOS" not in s:
            if print_anchor not in s: raise SystemExit('PRINT_ANCHOR_NOT_FOUND')
            s=s.replace(print_anchor,print_anchor+"          console.log('RESEARCH_WALKFORWARD_OOS='+JSON.stringify(w.oosSummary));\n          console.log('RESEARCH_WALKFORWARD_FOLDS='+JSON.stringify(w.folds));\n          console.log('RESEARCH_WALKFORWARD_GATE='+JSON.stringify(w.gate));\n",1)

          upload_anchor="            sepa-x/data/research/precision-challenger-validation.json\n"
          if "            sepa-x/data/research/research-walkforward.json\n" not in s:
            s=s.replace(upload_anchor,upload_anchor+"            sepa-x/data/research/research-walkforward.json\n",1)

          cp_anchor="          cp sepa-x/data/research/precision-challenger-validation.json \"$SNAPSHOT/sepa-x/data/research/\"\n"
          if "cp sepa-x/data/research/research-walkforward.json" not in s:
            if cp_anchor not in s: raise SystemExit('SNAPSHOT_CP_ANCHOR_NOT_FOUND')
            s=s.replace(cp_anchor,cp_anchor+"          cp sepa-x/data/research/research-walkforward.json \"$SNAPSHOT/sepa-x/data/research/\"\n",1)

          add_anchor="                    sepa-x/data/research/precision-challenger-validation.json \\\n"
          if "                    sepa-x/data/research/research-walkforward.json \\\n" not in s:
            if add_anchor not in s: raise SystemExit('GIT_ADD_ANCHOR_NOT_FOUND')
            s=s.replace(add_anchor,add_anchor+"                    sepa-x/data/research/research-walkforward.json \\\n",1)
          w.write_text(s)

          p=Path('sepa-x/scripts/precision-challenger-validation.mjs')
          v=p.read_text()
          marker="const V3_DISCOVERY_WINDOW_START='2021-08-09';\n"
          invalid="const V3_LEGACY_EXPERIMENT_INVALIDATED_REASON='INVALIDATED_BY_SAMPLING_PHASE_BUG: the 400-signal and 700-signal benchmarks used index-anchored modulo sampling and had zero shared signal dates after the eligible-date count shifted; V3 remains descriptive only and cannot be promoted from that experiment.';\n"
          if 'V3_LEGACY_EXPERIMENT_INVALIDATED_REASON' not in v:
            if marker not in v: raise SystemExit('V3_MARKER_NOT_FOUND')
            v=v.replace(marker,marker+invalid,1)
          old="const v3PromotionState=!v3Checks.sampleSize||!v3Checks.olderHoldoutSize?'INSUFFICIENT_EVIDENCE':v3AllPass?'READY_FOR_MANUAL_PROMOTION_REVIEW':'CHALLENGER_REJECTED_BY_VALIDATION';"
          new="const v3PromotionState='INVALIDATED_BY_SAMPLING_PHASE_BUG';"
          if old in v:v=v.replace(old,new,1)
          note="comparisonNote:'V3 was preregistered after the 400-signal discovery run. Older dates added by the expanded benchmark are reported separately as an unseen historical holdout. No automatic promotion is permitted.'"
          newnote="comparisonNote:V3_LEGACY_EXPERIMENT_INVALIDATED_REASON,legacyExperimentInvalidated:true,invalidatedReason:V3_LEGACY_EXPERIMENT_INVALIDATED_REASON"
          if note in v:v=v.replace(note,newnote,1)
          p.write_text(v)
          PY

          node --check sepa-x/scripts/precision-challenger-validation.mjs
          node --check sepa-x/research-tools/research-walkforward.mjs
          cd sepa-x && npm test

      - name: Commit wiring and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sepax-wire-walkforward.yml
          git add .github/workflows/sepax-historical-benchmark.yml sepa-x/scripts/precision-challenger-validation.mjs
          git commit -m 'ci(sepa-x): persist preregistered walk-forward evidence'
          git push origin HEAD:develop/sepax-isolated-v1

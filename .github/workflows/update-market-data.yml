name: Update EGX Market Data - V17 Resilient Lab
on:
  workflow_dispatch:
  push:
    branches: [develop/v17-rebuild]
    paths-ignore: ['data/**','artifacts/**']
permissions:
  contents: write
concurrency:
  group: egx-market-data-v17-lab
  cancel-in-progress: true
jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EGX_MUBASHER_CONCURRENCY: '4'
      EGX_MUBASHER_TIMEOUT_MS: '25000'
      EGX_SR_CONCURRENCY: '8'
      EGX_SR_TIMEOUT_MS: '25000'
      EGX_SR_MIN_ROWS: '80'
      EGX_INTERNAL_SR_MIN_COVERAGE: '95'
      EGX_INTERNAL_SR_MIN_FRESHNESS: '98'
      EGX_INTERNAL_SR_MIN_CONFIDENCE: '0.80'
    steps:
      - name: Checkout isolated V17 branch
        uses: actions/checkout@v6
        with: {fetch-depth: 0, ref: develop/v17-rebuild}
      - name: Guard V16 main from mutation
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v17-rebuild"
          git fetch origin main develop/v17-rebuild
          pattern='git push[[:space:]].*(origin[[:space:]]+main|HEAD:main)'
          violations="$(grep -REn "$pattern" .github/workflows/update-market-data.yml scripts/v17/ | grep -v 'pattern=' | grep -v 'dangerousPushLines' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - uses: actions/setup-node@v6
        with: {node-version: 22, cache: npm}
      - name: Install project dependencies
        run: npm ci || npm install
      - name: Mandatory market collector
        run: node scripts/fetch-market-data.js
      - name: Collect direct Mubasher S/R validation - degradable
        id: direct_sr
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock cheerio@1.0.0
          node scripts/collect-mubasher-direct-stock-sr.js
      - name: Verify V17 price-source trading session
        run: node scripts/v17/market-session-truth.cjs
      - name: Repair generated history to verified trading session
        run: node scripts/v17/repair-session-history.cjs
      - name: Install Playwright Chromium - optional validation
        id: playwright
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium
      - name: Collect rendered Mubasher S/R validation - degradable
        id: rendered_sr
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        run: node scripts/collect-mubasher-support-resistance-rendered.js
      - name: Build source diagnostics
        run: |
          set -u
          for s in scripts/build-price-source-audit.js scripts/build-price-freshness-report.js scripts/build-workflow-source-verification.js scripts/build-session-memory-status.js scripts/build-symbol-audit.js; do [ ! -f "$s" ] || node "$s" || true; done
      - name: Build internal OHLC support resistance evidence
        run: node scripts/v17/build-internal-ohlc-sr.cjs
      - name: Build current-run liquidity evidence
        run: node scripts/v17/build-liquidity-gate.cjs
      - name: Determine V17 resilient session mode
        run: node scripts/v17/resilient-session-gate.cjs
      - name: Optional intelligence builders
        run: |
          set -u
          for s in scripts/build-v52-intelligence.js scripts/build-v54-universe-index.js scripts/build-v55-sector-investor-flow.js scripts/build-v56-history-50.js scripts/build-v56-technical-report.js scripts/collect-egx-investor-type.js scripts/collect-v56-news.js scripts/build-multi-source-intelligence.js scripts/apply-multisource-intelligence-to-ranking.js scripts/apply-news-impact-to-recommendations.js scripts/build-institutional-score.js scripts/build-signal-quality-engine.js scripts/build-entry-trigger-engine.js scripts/build-alert-decision-center.js scripts/build-actionable-watchlist.js scripts/build-data-operations-center.js scripts/build-engines-console-report.js scripts/build-executive-home-report.js scripts/build-workflow-budget-status.js scripts/build-sector-completion-report.js scripts/build-recommendation-outcome-tracker.js scripts/build-recommendation-accuracy.js scripts/build-recommendation-performance-index.js scripts/build-accuracy-interpretation-report.js scripts/build-recommendation-validation-panel.js scripts/build-portfolio-decision-rules.js scripts/build-rebalancing-candidates.js; do [ ! -f "$s" ] || node "$s" || echo "::warning::$s failed"; done
      - name: Reapply verified session after legacy optional builders
        run: node scripts/v17/repair-session-history.cjs
      - name: Mandatory history and research ranking
        run: |
          set -euo pipefail
          [ ! -f scripts/build-history-50-engine.js ] || node scripts/build-history-50-engine.js
          [ ! -f scripts/build-price-reconciliation-report.js ] || node scripts/build-price-reconciliation-report.js
          node scripts/build-final-opportunity-ranking.js
          [ ! -f scripts/build-confidence-guard-report.js ] || node scripts/build-confidence-guard-report.js
          [ ! -f scripts/build-daily-decision-brief.js ] || node scripts/build-daily-decision-brief.js
      - name: Refresh internal OHLC evidence against final candidate universe
        run: node scripts/v17/build-internal-ohlc-sr.cjs
      - name: Audit S/R history gaps without changing eligibility
        run: node scripts/v17/audit-sr-history-gaps.cjs
      - name: Refresh liquidity evidence against final candidate universe
        run: node scripts/v17/build-liquidity-gate.cjs
      - name: Refresh resilient session mode after ranking
        run: node scripts/v17/resilient-session-gate.cjs
      - name: Rebuild reconciled research decision from final gates
        run: node scripts/build-goal-integrated-decision.js
      - name: V17 challenger governance first
        run: node scripts/v17/challenger-gate.cjs
      - name: Build resolve finalize and enrich immutable V17 evidence
        run: |
          set -euo pipefail
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/resolve-ledger.cjs
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/enrich-snapshot.cjs
          node scripts/v17/finalize-snapshot.cjs
          node scripts/v17/snapshot-provenance-guard.cjs
      - name: Real Chromium runtime critic
        run: |
          set -euo pipefail
          test "${{ steps.playwright.outcome }}" = "success" || { echo "Playwright tooling unavailable"; exit 1; }
          node scripts/v17/browser-runtime-critic.cjs
      - name: Independent V17 current-session review V5
        run: node scripts/v17/review-v5.cjs
      - name: V17 native regression contract V5
        run: node scripts/v17/regression-v5.cjs
      - name: Snapshot provenance guard after regression
        run: node scripts/v17/snapshot-provenance-guard.cjs
      - name: Destructive adversarial critic V5
        run: node scripts/v17/destructive-critic-v5.cjs
      - name: Acceptance guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/v17/resilient-session-status.json')); const l=JSON.parse(fs.readFileSync('data/v17/liquidity-gate.json')); const c=JSON.parse(fs.readFileSync('data/v17/challenger-status.json')); const x=JSON.parse(fs.readFileSync('data/v17/current.json')); const r=JSON.parse(fs.readFileSync('data/v17/review.json')); const q=JSON.parse(fs.readFileSync('data/v17/regression.json')); const g=JSON.parse(fs.readFileSync('data/v17/sr-history-gap-diagnostics.json')); const t=JSON.parse(fs.readFileSync('data/v17/market-session-truth.json')); const h=JSON.parse(fs.readFileSync('data/v17/session-history-repair.json')); const b=JSON.parse(fs.readFileSync('data/v17/browser-runtime-critic.json')); const z=JSON.parse(fs.readFileSync('data/v17/destructive-critic.json'));
          if(!['HEALTHY','DEGRADED','RESEARCH_ONLY'].includes(s.status)) throw new Error(`Session status ${s.status} is not acceptable`);
          if(c.activeEngine!=='V16_9_EQUAL_WEIGHT_BASKET'||c.promotionAllowed!==false) throw new Error('Champion governance changed');
          if(r.schemaVersion!=='17.0.0-review-5'||r.verdict!=='NO_COMMENTS'||Object.values(r.counts||{}).some(Number)) throw new Error('Independent review V5 is not NO_COMMENTS');
          if(q.schemaVersion!=='17.0.0-regression-5'||q.ok!==true||Number(q.failedCount||0)!==0||Number(q.criticalFailedCount||0)!==0) throw new Error(`V17 regression V5 failed: ${(q.failed||[]).join(', ')}`);
          if(b.schemaVersion!=='17.0.0-browser-runtime-critic-1'||b.verdict!=='NO_COMMENTS'||Number(b.totalFindings||0)!==0||Object.values(b.counts||{}).some(Number)) throw new Error(`Browser runtime critic found ${b.totalFindings} findings`);
          if(z.schemaVersion!=='17.0.0-destructive-critic-5'||z.verdict!=='NO_COMMENTS'||Number(z.totalFindings||0)!==0||Object.values(z.counts||{}).some(Number)) throw new Error(`Destructive critic V5 found ${z.totalFindings} findings`);
          if(z.publicationArchitecture?.buildReviewReadOnly!==true||z.publicationArchitecture?.marketCanonicalPublisher!==true) throw new Error('Canonical publisher architecture is not safe');
          if(g?.policy?.doesNotChangeExecutionEligibility!==true||g?.policy?.gateThresholdsUnchanged!==true) throw new Error('S/R diagnostic attempted to change execution policy');
          if(x.sessionDate!==x.systemHealth?.latestMarketSession||x.sessionDate!==x.currentResearch?.sessionDate||x.sessionDate!==t.selectedSessionDate) throw new Error('Current session truth not aligned');
          if(x.enrichment?.immutableSignalHashTouched!==false||x.finalization?.immutableSignalHashTouched!==false||x.finalization?.ledgerTouched!==false) throw new Error('Snapshot processing touched immutable signal contract');
          if(x.finalization?.staleChampionCurrentWeightsZeroed!==true) throw new Error('Historical champion weights were not neutralized');
          if(x.championReference?.currentForMarketSession===false&&(Number(x.championReference?.plannedAllocationPct||0)!==0||(x.championReference?.recommendations||[]).some(row=>Number(row.portfolioWeightPct||0)!==0||Number(row.basketWeightPct||0)!==0||Number(row.currentSessionWeightPct||0)!==0||row.executionAllowed===true||row.monitorOnly!==true))) throw new Error('Historical champion carries current-session execution semantics');
          if(x.currentResearch?.liquidity?.provenance!=='data/v17/liquidity-gate.json') throw new Error('Canonical liquidity provenance missing from snapshot');
          if(s.executionGrade===true && (l.gatePassed!==true||t.executionSafe!==true||h.applied!==true)) throw new Error('Execution grade without verified source session/history repair/liquidity gate');
          if(s.executionGrade!==true){ if(x.systemHealth?.executionGrade!==false) throw new Error('Non-execution status claims execution grade'); if(Number(x.portfolioPolicy?.plannedAllocationPct||0)!==0||Number(x.portfolioPolicy?.cashReservePct||0)!==100) throw new Error('Non-execution status has exposure'); }
          const executable=(x.recommendations||[]).filter(row=>row.executionAllowed===true);
          if(executable.some(row=>row.liquidity?.executionLiquidityOk!==true)) throw new Error('Executable recommendation without per-symbol liquidity pass');
          console.log(JSON.stringify({accepted:true,status:s.status,executionGrade:s.executionGrade,sessionDate:x.sessionDate,sourceSessionVerified:t.executionSafe,historyRepairApplied:h.applied,coveragePct:s.coveragePct,freshnessPct:s.freshnessPct,liquidityGatePassed:l.gatePassed,review:r.verdict,regression:q.ok,browserRuntime:b.verdict,destructiveCritic:z.verdict,buildReviewReadOnly:z.publicationArchitecture?.buildReviewReadOnly,marketCanonicalPublisher:z.publicationArchitecture?.marketCanonicalPublisher},null,2));
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v17-resilient-market-diagnostics
          path: |
            data/v17/market-session-truth.json
            data/v17/session-history-repair.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/sr-history-gap-diagnostics.json
            data/v17/liquidity-gate.json
            data/v17/resilient-session-status.json
            data/v17/challenger-status.json
            data/v17/current.json
            data/v17/ledger.json
            data/v17/review.json
            data/v17/regression.json
            data/v17/browser-runtime-critic.json
            data/v17/destructive-critic.json
            data/mubasher-support-resistance-direct-report.json
            data/mubasher-support-resistance-rendered.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit canonical generated lab data to V17 branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/v17/*.json artifacts/ || true
          if ! git diff --cached --quiet; then
            git commit -m "V17 lab: canonical current-session resilient EGX cycle"
            git pull --rebase -X ours origin develop/v17-rebuild
            git push origin HEAD:develop/v17-rebuild
          fi
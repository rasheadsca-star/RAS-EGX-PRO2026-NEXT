name: Update EGX Market Data - V17 Resilient Lab
on:
  workflow_dispatch:
  push:
    branches: [develop/v17-rebuild]
    paths-ignore: ['data/**','artifacts/**']
permissions:
  contents: write
concurrency:
  group: egx-market-data-v17-lab
  cancel-in-progress: true
jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EGX_MUBASHER_CONCURRENCY: '4'
      EGX_MUBASHER_TIMEOUT_MS: '25000'
      EGX_SR_CONCURRENCY: '8'
      EGX_SR_TIMEOUT_MS: '25000'
      EGX_SR_MIN_ROWS: '80'
      EGX_INTERNAL_SR_MIN_COVERAGE: '95'
      EGX_INTERNAL_SR_MIN_FRESHNESS: '98'
      EGX_INTERNAL_SR_MIN_CONFIDENCE: '0.80'
    steps:
      - name: Checkout isolated V17 branch
        uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: develop/v17-rebuild}
      - name: Guard V16 main from mutation
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v17-rebuild"
          git fetch origin main develop/v17-rebuild
          if grep -REn 'git push[^\n]*origin[^\n]*main|git push[^\n]*HEAD:main' .github/workflows/update-market-data.yml scripts/v17/; then exit 1; fi
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Install project dependencies
        run: npm ci || npm install
      - name: Mandatory market collector
        run: node scripts/fetch-market-data.js
      - name: Collect direct Mubasher S/R validation - degradable
        id: direct_sr
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock cheerio@1.0.0
          node scripts/collect-mubasher-direct-stock-sr.js
      - name: Install Playwright Chromium - optional validation
        id: playwright
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Collect rendered Mubasher S/R validation - degradable
        id: rendered_sr
        if: steps.playwright.outcome == 'success'
        continue-on-error: true
        run: node scripts/collect-mubasher-support-resistance-rendered.js
      - name: Build source diagnostics
        run: |
          set -u
          for s in scripts/build-price-source-audit.js scripts/build-price-freshness-report.js scripts/build-workflow-source-verification.js scripts/build-session-memory-status.js scripts/build-symbol-audit.js; do [ ! -f "$s" ] || node "$s" || true; done
      - name: Build internal OHLC support resistance evidence
        run: node scripts/v17/build-internal-ohlc-sr.cjs
      - name: Build current-run liquidity evidence
        run: node scripts/v17/build-liquidity-gate.cjs
      - name: Determine V17 resilient session mode
        run: node scripts/v17/resilient-session-gate.cjs
      - name: Optional intelligence builders
        run: |
          set -u
          for s in scripts/build-v52-intelligence.js scripts/build-v54-universe-index.js scripts/build-v55-sector-investor-flow.js scripts/build-v56-history-50.js scripts/build-v56-technical-report.js scripts/collect-egx-investor-type.js scripts/collect-v56-news.js scripts/build-multi-source-intelligence.js scripts/apply-multisource-intelligence-to-ranking.js scripts/apply-news-impact-to-recommendations.js scripts/build-institutional-score.js scripts/build-signal-quality-engine.js scripts/build-entry-trigger-engine.js scripts/build-alert-decision-center.js scripts/build-actionable-watchlist.js scripts/build-data-operations-center.js scripts/build-engines-console-report.js scripts/build-executive-home-report.js scripts/build-workflow-budget-status.js scripts/build-sector-completion-report.js scripts/build-recommendation-outcome-tracker.js scripts/build-recommendation-accuracy.js scripts/build-recommendation-performance-index.js scripts/build-accuracy-interpretation-report.js scripts/build-recommendation-validation-panel.js scripts/build-portfolio-decision-rules.js scripts/build-rebalancing-candidates.js; do [ ! -f "$s" ] || node "$s" || echo "::warning::$s failed"; done
      - name: Mandatory history and research ranking
        run: |
          set -euo pipefail
          [ ! -f scripts/build-history-50-engine.js ] || node scripts/build-history-50-engine.js
          [ ! -f scripts/build-price-reconciliation-report.js ] || node scripts/build-price-reconciliation-report.js
          node scripts/build-final-opportunity-ranking.js
          [ ! -f scripts/build-confidence-guard-report.js ] || node scripts/build-confidence-guard-report.js
          [ ! -f scripts/build-daily-decision-brief.js ] || node scripts/build-daily-decision-brief.js
      - name: Refresh internal OHLC evidence against final candidate universe
        run: node scripts/v17/build-internal-ohlc-sr.cjs
      - name: Audit S/R history gaps without changing eligibility
        run: node scripts/v17/audit-sr-history-gaps.cjs
      - name: Refresh liquidity evidence against final candidate universe
        run: node scripts/v17/build-liquidity-gate.cjs
      - name: Refresh resilient session mode after ranking
        run: node scripts/v17/resilient-session-gate.cjs
      - name: Rebuild reconciled research decision from final gates
        run: node scripts/build-goal-integrated-decision.js
      - name: V17 challenger governance first
        run: node scripts/v17/challenger-gate.cjs
      - name: Build resolve and enrich immutable V17 evidence
        run: |
          set -euo pipefail
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/resolve-ledger.cjs
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/enrich-snapshot.cjs
          node scripts/v17/snapshot-provenance-guard.cjs
      - name: Independent V17 current-session review
        run: node scripts/v17/review.cjs
      - name: V17 native regression contract
        run: node scripts/v17/regression.cjs
      - name: Snapshot provenance guard after regression
        run: node scripts/v17/snapshot-provenance-guard.cjs
      - name: Acceptance guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/v17/resilient-session-status.json')); const l=JSON.parse(fs.readFileSync('data/v17/liquidity-gate.json')); const c=JSON.parse(fs.readFileSync('data/v17/challenger-status.json')); const x=JSON.parse(fs.readFileSync('data/v17/current.json')); const r=JSON.parse(fs.readFileSync('data/v17/review.json')); const q=JSON.parse(fs.readFileSync('data/v17/regression.json')); const g=JSON.parse(fs.readFileSync('data/v17/sr-history-gap-diagnostics.json'));
          if(!['HEALTHY','DEGRADED','RESEARCH_ONLY'].includes(s.status)) throw new Error(`Session status ${s.status} is not acceptable`);
          if(c.activeEngine!=='V16_9_EQUAL_WEIGHT_BASKET'||c.promotionAllowed!==false) throw new Error('Champion governance changed');
          if(r.verdict==='REJECTED') throw new Error('Independent review rejected build');
          if(q.ok!==true||Number(q.criticalFailedCount||0)!==0) throw new Error(`V17 regression failed: ${(q.failed||[]).join(', ')}`);
          if(g?.policy?.doesNotChangeExecutionEligibility!==true||g?.policy?.gateThresholdsUnchanged!==true) throw new Error('S/R diagnostic attempted to change execution policy');
          if(x.sessionDate!==x.systemHealth?.latestMarketSession||x.sessionDate!==x.currentResearch?.sessionDate) throw new Error('Current session truth not aligned');
          if(x.enrichment?.immutableSignalHashTouched!==false) throw new Error('Snapshot provenance enrichment touched immutable signal contract');
          if(x.currentResearch?.liquidity?.provenance!=='data/v17/liquidity-gate.json') throw new Error('Canonical liquidity provenance missing from snapshot');
          if(s.executionGrade===true && l.gatePassed!==true) throw new Error('Execution grade without current-run liquidity gate');
          if(s.executionGrade!==true){ if(x.systemHealth?.executionGrade!==false) throw new Error('Non-execution status claims execution grade'); if(Number(x.portfolioPolicy?.plannedAllocationPct||0)!==0) throw new Error('Non-execution status has allocation'); }
          const executable=(x.recommendations||[]).filter(row=>row.executionAllowed===true);
          if(executable.some(row=>row.liquidity?.executionLiquidityOk!==true)) throw new Error('Executable recommendation without per-symbol liquidity pass');
          console.log(JSON.stringify({accepted:true,status:s.status,executionGrade:s.executionGrade,coveragePct:s.coveragePct,freshnessPct:s.freshnessPct,liquidityGatePassed:l.gatePassed,liquidityEvidenceCoveragePct:l.candidateEvidenceCoveragePct,liquidityExecutionOkCount:l.candidateExecutionOkCount,srGapSummary:g.summary,review:r.verdict,regression:q.ok,snapshotProvenance:true},null,2));
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-resilient-market-diagnostics
          path: |
            data/v17/internal-ohlc-support-resistance.json
            data/v17/sr-history-gap-diagnostics.json
            data/v17/liquidity-gate.json
            data/v17/resilient-session-status.json
            data/v17/challenger-status.json
            data/v17/current.json
            data/v17/ledger.json
            data/v17/review.json
            data/v17/regression.json
            data/mubasher-support-resistance-direct-report.json
            data/mubasher-support-resistance-rendered.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit generated lab data to V17 branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/v17/*.json artifacts/ || true
          if ! git diff --cached --quiet; then
            git commit -m "V17 lab: current-session resilient EGX cycle"
            git pull --rebase -X ours origin develop/v17-rebuild
            git push origin HEAD:develop/v17-rebuild
          fi
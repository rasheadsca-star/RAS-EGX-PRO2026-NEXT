name: EGX Hybrid Alpha V1 Research Coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/research/hybrid-alpha-v1-policy.json'
      - 'scripts/research/hybrid-alpha-v1-coverage.cjs'
      - 'scripts/research/hybrid-alpha-v1-coverage-v2.cjs'
      - 'tests/research/hybrid-alpha-v1-coverage.test.cjs'
      - 'docs/astra/STRATEGY_RECONSTRUCTION_MATRIX.json'
jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate OHLC coverage rules
        run: node --test tests/research/hybrid-alpha-v1-coverage.test.cjs
      - name: Audit strategy data coverage
        run: node scripts/research/hybrid-alpha-v1-coverage-v2.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-alpha-v1-research-coverage
          path: data/research/hybrid-alpha-v1-coverage-v2.json

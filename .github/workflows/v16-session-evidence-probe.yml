name: V16 Session Evidence Probe — Research Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-session-evidence-probe.yml"

permissions:
  contents: read

concurrency:
  group: v16-session-evidence-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe explicit Mubasher Volume Statistics session date
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const expected = '2026-08-16';
          const market = JSON.parse(fs.readFileSync('data/market.json','utf8'));
          const rows = (market.rows || []).filter(r => r && (r.symbol || r.ticker) && r.sourceUrl);
          const months = new Map([
            ['january',1],['february',2],['march',3],['april',4],['may',5],['june',6],
            ['july',7],['august',8],['september',9],['october',10],['november',11],['december',12]
          ]);
          const clean = s => String(s||'').replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
          const strip = html => clean(String(html||'').replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,' '));
          const num = v => { if(v==null)return null; const n=Number(String(v).replace(/,/g,'').replace(/[^0-9.+-]/g,'')); return Number.isFinite(n)?n:null; };
          function parseDate(text){
            const m=String(text||'').match(/\b(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})\b/i);
            if(!m)return null;
            const mo=months.get(m[2].toLowerCase());
            return `${m[3]}-${String(mo).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`;
          }
          function volumeMatch(a,b){
            if(!(a>=0) || !(b>=0)) return false;
            if(a===b) return true;
            const base=Math.max(1,a,b);
            return Math.abs(a-b)/base <= 0.005;
          }
          async function fetchText(url){
            const res=await fetch(url,{redirect:'follow',headers:{
              'accept':'text/html,application/xhtml+xml,*/*',
              'accept-language':'en-US,en;q=0.9',
              'cache-control':'no-cache','pragma':'no-cache',
              'referer':'https://english.mubasher.info/',
              'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36 EGXProSessionProbe/3.0'
            },signal:AbortSignal.timeout(15000)});
            if(!res.ok)throw new Error(`HTTP_${res.status}`);
            return res.text();
          }
          function statsUrl(sourceUrl){
            const u=new URL(sourceUrl);
            u.search=''; u.hash='';
            u.pathname=u.pathname.replace(/\/$/,'').replace(/\/(profile|financial-statements|volume-statistics)$/i,'') + '/volume-statistics';
            return u.toString();
          }
          async function one(row){
            const ticker=String(row.symbol||row.ticker).toUpperCase();
            const url=statsUrl(row.sourceUrl);
            try{
              const plain=strip(await fetchText(url));
              const sectionIndex=plain.search(/Volume Statistics/i);
              const section=sectionIndex>=0 ? plain.slice(sectionIndex, sectionIndex+2500) : plain;
              const dateMatch=section.match(/Last Update\s+(\d{1,2}\s+(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+20\d{2})/i);
              const volumeMatchText=section.match(/(?:^|\s)Volume\s+([0-9][0-9,]*)\b/i);
              const explicitText=dateMatch?.[1]||null;
              const sourceSessionDate=parseDate(explicitText);
              const statsVolume=num(volumeMatchText?.[1]);
              const snapshotVolume=num(row.volume);
              const sameVolume=volumeMatch(statsVolume,snapshotVolume);
              return {ticker,ok:true,url,sourceSessionDate,explicitText,statsVolume,snapshotVolume,sameVolume,current:sourceSessionDate===expected,validated:sourceSessionDate===expected&&sameVolume};
            }catch(e){ return {ticker,ok:false,url,error:e.message}; }
          }
          async function mapLimit(items,limit,fn){
            const out=new Array(items.length); let cursor=0;
            async function worker(){while(true){const i=cursor++;if(i>=items.length)return;out[i]=await fn(items[i]);}}
            await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out;
          }
          (async()=>{
            const results=await mapLimit(rows,8,one);
            const ok=results.filter(x=>x.ok);
            const dated=ok.filter(x=>x.sourceSessionDate);
            const current=dated.filter(x=>x.current);
            const validated=current.filter(x=>x.validated);
            const report={
              schemaVersion:'V16_SESSION_EVIDENCE_PROBE_3',generatedAt:new Date().toISOString(),expectedSession:expected,
              productionImpact:'NONE_RESEARCH_ONLY',source:'mubasher_volume_statistics_explicit_date',
              snapshotRows:rows.length,responsesOk:ok.length,explicitDateRows:dated.length,currentSessionDateRows:current.length,
              currentSessionDateAndVolumeMatch:validated.length,minimumNeededForV16PriceTruth:80,
              viableExplicitSessionEvidence:validated.length>=80,
              sampleValidated:validated.slice(0,30),
              sampleCurrentDateVolumeMismatch:current.filter(x=>!x.sameVolume).slice(0,20),
              sampleStale:dated.filter(x=>!x.current).slice(0,20),
              sampleFailures:results.filter(x=>!x.ok).slice(0,20)
            };
            fs.writeFileSync('/tmp/v16-session-evidence-probe.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload research probe
        uses: actions/upload-artifact@v4
        with:
          name: v16-session-evidence-probe-${{ github.run_number }}
          path: /tmp/v16-session-evidence-probe.json
          retention-days: 7

name: V16 Session Evidence Probe — Research Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-session-evidence-probe.yml"

permissions:
  contents: read

concurrency:
  group: v16-session-evidence-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover Mubasher volume-statistics data endpoint
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pageUrl='https://english.mubasher.info/markets/EGX/stocks/MBSC/volume-statistics';
          async function get(url){
            const r=await fetch(url,{redirect:'follow',headers:{
              accept:'text/html,application/javascript,text/javascript,*/*',
              'accept-language':'en-US,en;q=0.9','cache-control':'no-cache',pragma:'no-cache',
              referer:pageUrl,
              'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36 EGXProEndpointDiscovery/1.0'
            },signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw new Error(`HTTP_${r.status}`);
            return r.text();
          }
          function scriptUrls(html){
            const out=[]; let m; const re=/<script[^>]+src=["']([^"']+)["']/gi;
            while((m=re.exec(html))){
              try{out.push(new URL(m[1],pageUrl).toString())}catch{}
            }
            return [...new Set(out)];
          }
          function extract(text, source){
            const hits=[];
            const patterns=[/volume[-_. ]?statistics/ig,/last[-_. ]?update/ig,/api-community\.mubasher\.info/ig,/\/api\/[A-Za-z0-9_?=&{}./:-]+/ig,/stock[^"'`\s]{0,50}volume/ig];
            for(const p of patterns){
              p.lastIndex=0; let m; let count=0;
              while((m=p.exec(text))&&count<20){
                const a=Math.max(0,m.index-220),b=Math.min(text.length,m.index+m[0].length+300);
                hits.push({source,pattern:p.source,snippet:text.slice(a,b).replace(/\s+/g,' ')}); count++;
              }
            }
            return hits;
          }
          (async()=>{
            const html=await get(pageUrl);
            const scripts=scriptUrls(html);
            const hits=extract(html,pageUrl);
            const fetched=[];
            for(const url of scripts.slice(0,40)){
              try{
                const text=await get(url);
                fetched.push({url,bytes:text.length});
                hits.push(...extract(text,url));
              }catch(e){fetched.push({url,error:e.message});}
            }
            const unique=[]; const seen=new Set();
            for(const h of hits){const k=h.source+'|'+h.snippet;if(!seen.has(k)){seen.add(k);unique.push(h)}}
            const urls=new Set();
            for(const h of unique){
              for(const m of h.snippet.matchAll(/https?:\/\/[^"'`\s)]+/g))urls.add(m[0]);
              for(const m of h.snippet.matchAll(/["'`](\/[^"'`\s]*(?:volume|statistic|stock|api)[^"'`\s]*)["'`]/gi)){
                try{urls.add(new URL(m[1],h.source).toString())}catch{}
              }
            }
            const report={schemaVersion:'V16_SESSION_EVIDENCE_PROBE_4',generatedAt:new Date().toISOString(),productionImpact:'NONE_RESEARCH_ONLY',pageUrl,scriptCount:scripts.length,fetchedScripts:fetched,candidateUrls:[...urls].slice(0,150),hits:unique.slice(0,120)};
            fs.writeFileSync('/tmp/v16-session-evidence-probe.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify({schemaVersion:report.schemaVersion,scriptCount:report.scriptCount,candidateUrls:report.candidateUrls,hits:report.hits.slice(0,30)},null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload research probe
        uses: actions/upload-artifact@v4
        with:
          name: v16-session-evidence-probe-${{ github.run_number }}
          path: /tmp/v16-session-evidence-probe.json
          retention-days: 7

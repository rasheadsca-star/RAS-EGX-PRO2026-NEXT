name: V16 Session Evidence Probe — Research Only

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-session-evidence-probe.yml"

permissions:
  contents: read

concurrency:
  group: v16-session-evidence-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate full-market explicit Mubasher session evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const expected='2026-08-16';
          const market=JSON.parse(fs.readFileSync('data/market.json','utf8'));
          const rows=(market.rows||[]).filter(r=>r&&(r.symbol||r.ticker)&&r.sourceUrl);
          const months=new Map([['january',1],['february',2],['march',3],['april',4],['may',5],['june',6],['july',7],['august',8],['september',9],['october',10],['november',11],['december',12]]);
          const n=v=>{if(v==null||v==='')return null;const x=Number(String(v).replace(/,/g,'').replace(/[^0-9.+-]/g,''));return Number.isFinite(x)?x:null};
          function parseDate(v){const m=String(v||'').match(/(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})/i);if(!m)return null;return `${m[3]}-${String(months.get(m[2].toLowerCase())).padStart(2,'0')}-${String(Number(m[1])).padStart(2,'0')}`;}
          function statsUrl(sourceUrl){const u=new URL(sourceUrl);u.search='';u.hash='';u.pathname=u.pathname.replace(/\/$/,'').replace(/\/(profile|financial-statements|volume-statistics)$/i,'')+'/volume-statistics';return u.toString();}
          function volumeMatches(a,b){a=n(a);b=n(b);if(a===null||b===null)return false;if(a===b)return true;return Math.abs(a-b)/Math.max(1,a,b)<=0.005;}
          async function get(url){const r=await fetch(url,{redirect:'follow',headers:{accept:'text/html,*/*','accept-language':'en-US,en;q=0.9','cache-control':'no-cache',pragma:'no-cache',referer:'https://english.mubasher.info/','user-agent':'Mozilla/5.0 EGXProSessionEvidence/5.0'},signal:AbortSignal.timeout(15000)});if(!r.ok)throw new Error(`HTTP_${r.status}`);return r.text();}
          async function one(row){
            const ticker=String(row.symbol||row.ticker).toUpperCase(); const url=statsUrl(row.sourceUrl);
            try{
              const html=await get(url);
              const table=html.match(/<h2[^>]*>\s*Volume Statistics\s*<\/h2>[\s\S]{0,10000}?<\/table>/i)?.[0]||html;
              const dm=table.match(/<td[^>]*>\s*Last Update\s*<\/td>\s*<td[^>]*>\s*([^<]+?)\s*<\/td>/i);
              const vm=table.match(/<td[^>]*>\s*Volume\s*<\/td>\s*<td[^>]*>\s*([0-9][0-9,]*)\s*<\/td>/i);
              const sourceSessionDate=parseDate(dm?.[1]); const statsVolume=n(vm?.[1]); const snapshotVolume=n(row.volume);
              const sameVolume=volumeMatches(statsVolume,snapshotVolume);
              return {ticker,ok:true,url,sourceSessionDate,statsVolume,snapshotVolume,sameVolume,current:sourceSessionDate===expected,validated:sourceSessionDate===expected&&sameVolume};
            }catch(e){return {ticker,ok:false,url,error:e.message};}
          }
          async function mapLimit(items,limit,fn){const out=new Array(items.length);let i=0;async function worker(){while(true){const j=i++;if(j>=items.length)return;out[j]=await fn(items[j]);}}await Promise.all(Array.from({length:Math.min(limit,items.length)},worker));return out;}
          (async()=>{
            const results=await mapLimit(rows,8,one); const ok=results.filter(x=>x.ok); const dated=ok.filter(x=>x.sourceSessionDate); const current=dated.filter(x=>x.current); const validated=current.filter(x=>x.validated);
            const report={schemaVersion:'V16_SESSION_EVIDENCE_PROBE_5',generatedAt:new Date().toISOString(),productionImpact:'NONE_RESEARCH_ONLY',expectedSession:expected,source:'mubasher_volume_statistics_html',snapshotRows:rows.length,responsesOk:ok.length,explicitDateRows:dated.length,currentSessionDateRows:current.length,currentSessionDateAndVolumeMatch:validated.length,minimumNeededForV16PriceTruth:80,viableExplicitSessionEvidence:validated.length>=80,sampleValidated:validated.slice(0,30),sampleCurrentDateVolumeMismatch:current.filter(x=>!x.sameVolume).slice(0,20),sampleStale:dated.filter(x=>!x.current).slice(0,20),sampleFailures:results.filter(x=>!x.ok).slice(0,20)};
            fs.writeFileSync('/tmp/v16-session-evidence-probe.json',JSON.stringify(report,null,2)+'\n'); console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Upload research probe
        uses: actions/upload-artifact@v4
        with:
          name: v16-session-evidence-probe-${{ github.run_number }}
          path: /tmp/v16-session-evidence-probe.json
          retention-days: 7

name: RC2 Vercel Preview

on:
  pull_request:
    branches:
      - develop/rc2-intraday-operations-v1
    paths:
      - 'tfe-v20/**'
      - '.github/workflows/rc2-vercel-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_PROJECT_ID: prj_gXmmVe1QqGFJ9nsv30uu0emLqIdY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Vercel deploy credential
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.10.0
      - name: Link exact Vercel project locally
        working-directory: tfe-v20
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Deploy preview only
        id: deploy
        working-directory: tfe-v20
        run: |
          set -euo pipefail
          URL="$(vercel deploy --yes --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "RC2_PREVIEW_URL=$URL"
      - name: Smoke test deep portfolio bundle
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl -fsSL "$PREVIEW_URL/portfolio-manager.js" | grep -q "portfolio-manager-core.js"
          curl -fsSL "$PREVIEW_URL/portfolio-manager.js" | grep -q "portfolio-deep-analysis.js"
          curl -fsSL "$PREVIEW_URL/portfolio-deep-analysis.js" | grep -q "portfolioDeepAnalysis"
          curl -fsSL "$PREVIEW_URL/portfolio-deep-analysis.js" | grep -q "Walk"
          curl -fsSL "$PREVIEW_URL/api/index?route=history&ticker=COMI&limit=80" | grep -q '"ok":true'
          echo "RC2_DEEP_PORTFOLIO_PREVIEW_SMOKE_PASS"
      - name: Publish preview URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: echo "RC2 preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

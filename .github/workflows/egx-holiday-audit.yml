name: EGX holiday calendar integrity
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/session-calendar.json'
      - 'data/egx-exchange-closures.json'
      - 'scripts/ops/audit-egx-holidays.cjs'
      - 'tests/ops/egx-holiday-audit.test.cjs'
      - '.github/workflows/egx-holiday-audit.yml'
  schedule:
    - cron: '15 6 * * *'
jobs:
  holiday-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/ops/egx-holiday-audit.test.cjs
      - name: Audit historical calendar
        run: |
          node scripts/ops/audit-egx-holidays.cjs > egx-holiday-audit.json
          cat egx-holiday-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: egx-holiday-audit
          path: egx-holiday-audit.json
      - name: Block verified calendar conflicts
        run: node scripts/ops/audit-egx-holidays.cjs --strict

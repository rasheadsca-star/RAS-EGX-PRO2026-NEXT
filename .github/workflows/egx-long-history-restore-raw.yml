name: EGX Restore Original Long History OHLCV
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/egx-long-history-restore-raw.yml'
      - 'scripts/research/egx-central-long-history-restore-audit-v1.cjs'
      - 'tests/research/egx-central-long-history-restore-audit-v1.test.cjs'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test real daily candles, adjusted source and reconciliation rules
        run: node --test tests/research/egx-central-long-history-restore-audit-v1.test.cjs
      - name: Restore original 10-year candles for all mapped active securities using existing V17 collector
        run: node scripts/v17/historical-recovery/long-history/ingest.cjs
      - name: Audit source identities and compare with main data before ANY promotion
        run: node scripts/research/egx-central-long-history-restore-audit-v1.cjs
      - name: Print completeness without claiming automatic certification
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),r=JSON.parse(fs.readFileSync('data/research/egx-central-long-history-restoration-quality-v1.json'));
          const lines=['## Restore original 10-year candles from the previously used V17 collector','',
            'Read-only research output. Raw price candles and adjustments saved in workflow artifact; NOT auto-promoted to any trading strategies.',
            '','| Symbol | Historical raw daily dates | Source identity and quality | Disagreements >2% | Historical candidate |',
            '|---|---:|---|---:|---|'];
          for(const s of r.stocks)lines.push('| '+s.ticker+' | '+s.uniqueValidDays+' | '+s.status+' | '+s.overlapLargeMismatchCount+' | '+s.researchHistoryCandidate+' |');
          lines.push('','With >=250 raw daily dates: '+r.summary.retrievedWith250Bars+'; research-quality candidates: '+r.summary.structurallyCandidate+
            '; production-certified: 0. Corporate actions and historical source conflicts must be resolved before merging.',
            '','**Note:** Recreating 10-year OHLCV from the same existing ingester addresses a storage omission: past compact reports stored statistics without preserving raw daily candles.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - name: Persist restored raw daily candles in EXISTING central research branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-backup
          git -C research-backup init
          git -C research-backup config user.name 'github-actions[bot]'
          git -C research-backup config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C research-backup remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C research-backup fetch --depth=1 origin egx-research-ledger
          git -C research-backup checkout -B egx-research-ledger FETCH_HEAD
          mkdir -p research-backup/raw-long-history-gzip
          python - <<'PY'
          import gzip, pathlib
          source=pathlib.Path('data/v17/historical-recovery/history')
          target=pathlib.Path('research-backup/raw-long-history-gzip')
          for original in sorted(source.glob('*.json')):
              (target/(original.name+'.gz')).write_bytes(gzip.compress(original.read_bytes(),compresslevel=9,mtime=0))
          print('Archived original source documents:',len(list(source.glob('*.json'))))
          PY
          cp data/research/egx-central-long-history-restoration-quality-v1.json research-backup/raw-long-history-quality.json
          git -C research-backup add raw-long-history-gzip/ raw-long-history-quality.json
          if ! git -C research-backup diff --cached --quiet; then
            git -C research-backup commit -m "research: preserve original ten-year OHLCV source candles ${GITHUB_RUN_ID} (NO AUTO PROMOTION)"
            git -C research-backup push origin HEAD:refs/heads/egx-research-ledger
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egx-original-long-history-recovered-research-only
          path: |
            research-backup/raw-long-history-gzip/*.json.gz
            data/v17/historical-recovery/long-history/retrieval-report.json
            data/research/egx-central-long-history-restoration-quality-v1.json
          if-no-files-found: warn
          retention-days: 30

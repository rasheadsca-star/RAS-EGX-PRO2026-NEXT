name: Publish EGX Decision Room (full site)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'decision-room-live/**'
      - 'egx-pro-research-12nov2026/**'
      - '404.html'
      - '.github/workflows/egx-room-pages-publish.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check decision-room bundle and secret guard
        shell: bash
        run: |
          set -euo pipefail
          test -s decision-room-live/index.html
          test -s data/market.json
          test ! -e .env
          test ! -e .project-config.json
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::Refusing to publish tracked .env"
            exit 1
          fi
          grep -q 'EGX PRO | غرفة القرار اليومية' decision-room-live/index.html
          grep -q 'decision-room-live/index.html' 404.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path('decision-room-live/index.html').read_text(encoding='utf-8')
          if '<script>' not in html or '</script>' not in html:
              raise SystemExit("Inline JavaScript not found")
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/egx-room-check.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/egx-room-check.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page body and session metadata
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,time,urllib.request
          base=os.environ['SITE'].rstrip('/')
          u=base+'/decision-room-live/index.html'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                      page=r.read().decode('utf8')
                      assert r.status==200 and 'EGX PRO | غرفة القرار اليومية' in page
                      assert 'egx-pdf-reviewed-staging.yml' in page
                      print('EGX_DECISION_ROOM_PUBLISH_VERIFIED',u)
                      break
              except Exception as e:
                  if attempt==11:raise
                  print('Retry',attempt+1,str(e))
                  time.sleep(10)
          PY

      - name: Verify live EGX research latest session — byte-for-byte
        env:
          SITE: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,time,urllib.request
          base=os.environ['SITE'].rstrip('/')
          rroot=pathlib.Path('egx-pro-research-12nov2026')
          latest=json.loads((rroot/'latest.json').read_text(encoding='utf-8'))
          date=latest['session']
          paths=[
            '/egx-pro-research-12nov2026/index.html',
            '/egx-pro-research-12nov2026/chart.html',
            '/egx-pro-research-12nov2026/latest.json',
            '/egx-pro-research-12nov2026/sessions/'+date+'/index.html',
            '/egx-pro-research-12nov2026/sessions/'+date+'/research.json',
          ]
          for attempt in range(1,13):
            try:
              for path in paths:
                url=base+path+'?release='+os.environ.get('GITHUB_SHA','')[:12]+'&attempt='+str(attempt)
                req=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as resp:
                  assert resp.status==200,(resp.status,path)
                  live=resp.read()
                local=pathlib.Path('.'+path).read_bytes()
                if hashlib.sha256(live).digest()!=hashlib.sha256(local).digest():
                  raise AssertionError('LIVE_SHA_MISMATCH '+path)
              print('EGX_RESEARCH_LIVE_SHA_MATCH',date,'checked',len(paths),flush=True)
              break
            except Exception as exc:
              print('EGX_RESEARCH_LIVE_CHECK_RETRY',attempt,str(exc),flush=True)
              if attempt==12:raise
              time.sleep(10)
          PY

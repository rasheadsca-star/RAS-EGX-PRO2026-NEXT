name: EGX V16.9 Basket Engine

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EGX V16.3.3 Immediate Market Rescan and Deploy"]
    types: [completed]
  pull_request:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-session-data-fingerprint.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  push:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-session-data-fingerprint.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - "data/market.json"
      - "data/history/**"
      - "data/stable/v15-price-truth.json"
      - "data/stable/v15-practical-decision.json"
      - "data/stable/v16-v169-primary-decision.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  schedule:
    # Safety re-check. The fingerprint prevents duplicate same-data publications.
    - cron: "*/15 13-20 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v169-basket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest source and scan evidence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fingerprint verified market session
        id: fingerprint
        run: node scripts/stable/v16-session-data-fingerprint.cjs

      - name: Decide whether publication is required
        id: need
        shell: bash
        env:
          SESSION_DATA_DATE: ${{ steps.fingerprint.outputs.session_date }}
          SESSION_DATA_HASH: ${{ steps.fingerprint.outputs.session_data_hash }}
          SESSION_DATA_ROWS: ${{ steps.fingerprint.outputs.session_data_rows }}
          SESSION_MINIMUM_ROWS: ${{ steps.fingerprint.outputs.minimum_rows }}
          SESSION_PRICE_TRUTH_READY: ${{ steps.fingerprint.outputs.price_truth_ready }}
          SESSION_EXECUTION_GRADE: ${{ steps.fingerprint.outputs.execution_grade }}
          SESSION_SUFFICIENT_ROWS: ${{ steps.fingerprint.outputs.sufficient_rows }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          actor = os.environ.get('GITHUB_ACTOR', '')
          legacy = read('data/stable/v15-practical-decision.json')
          primary = read('data/stable/v16-v169-primary-decision.json')
          research = read('data/research/v16-v169-basket-engine.json')
          price = read('data/stable/v15-price-truth.json')
          target_audit_exists = Path('data/research/v16-v169-target-hit-audit.json').exists()

          expected = price.get('expectedSession') or research.get('currentSignalDate')
          current_hash = os.environ.get('SESSION_DATA_HASH') or None
          current_hash_rows = int(os.environ.get('SESSION_DATA_ROWS') or 0)
          current_hash_date = os.environ.get('SESSION_DATA_DATE') or None
          minimum_rows = int(os.environ.get('SESSION_MINIMUM_ROWS') or price.get('minimumExecutionRows') or 80)
          published_hash = ((primary.get('basketPlan') or {}).get('sourceSessionDataHash'))

          legacy_model = ((legacy.get('selectedModel') or {}).get('id'))
          primary_model = ((primary.get('selectedModel') or {}).get('id'))
          research_aligned = bool(expected) and research.get('currentSignalDate') == expected
          legacy_aligned = (
              legacy_model == 'V16_9_EQUAL_WEIGHT_BASKET'
              and legacy.get('sessionDate') == expected
          )
          primary_aligned = (
              primary_model == 'V16_9_EQUAL_WEIGHT_BASKET'
              and primary.get('sessionDate') == expected
          )

          price_ready = bool(
              price.get('ready') is True
              and price.get('executionGrade') is True
              and current_hash
              and current_hash_date == expected
              and current_hash_rows >= minimum_rows
          )
          data_changed = bool(price_ready and current_hash != published_hash)
          structurally_current = bool(
              research_aligned
              and primary_aligned
              and legacy_aligned
              and target_audit_exists
          )

          # PRs may always exercise the frozen engine without publishing. A user
          # push/manual run may publish only when the verified session is ready.
          research_only_forced = event == 'pull_request'
          publication_forced = event == 'workflow_dispatch' or (event == 'push' and actor != 'github-actions[bot]')
          should_run = research_only_forced or bool(
              price_ready and (publication_forced or data_changed or not structurally_current)
          )

          print({
              'event': event,
              'actor': actor,
              'expectedSession': expected,
              'verifiedSessionDate': current_hash_date,
              'verifiedSessionRows': current_hash_rows,
              'minimumRows': minimum_rows,
              'priceReady': price_ready,
              'sessionDataHash': current_hash,
              'publishedSessionDataHash': published_hash,
              'sessionDataChanged': data_changed,
              'legacySession': legacy.get('sessionDate'),
              'primarySession': primary.get('sessionDate'),
              'researchSignalDate': research.get('currentSignalDate'),
              'researchAligned': research_aligned,
              'legacyAligned': legacy_aligned,
              'primaryAligned': primary_aligned,
              'targetAuditExists': target_audit_exists,
              'publicationForced': publication_forced,
              'run': should_run,
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.need.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frozen release source
        if: steps.need.outputs.run == 'true'
        run: |
          python -m py_compile scripts/research/v16-v169-basket-engine.py
          python -m py_compile scripts/research/v16-v169-target-hit-audit.py
          python -m py_compile scripts/stable/v16-v169-live-evaluation.py
          node --check scripts/stable/v16-session-data-fingerprint.cjs
          node --check scripts/stable/v16-publish-v169-basket.cjs

      - name: Run frozen V16.9 basket engine
        if: steps.need.outputs.run == 'true'
        run: python scripts/research/v16-v169-basket-engine.py

      - name: Run twenty-session target audit
        if: steps.need.outputs.run == 'true'
        run: python scripts/research/v16-v169-target-hit-audit.py

      - name: Publish session-bound V16.9 primary decision
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: node scripts/stable/v16-publish-v169-basket.cjs

      - name: Update immutable live evaluation ledger
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: python scripts/stable/v16-v169-live-evaluation.py

      - name: Upload V16.9 reports
        if: steps.need.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v16-v169-frozen-pilot-reports
          path: |
            data/research/v16-v169-basket-engine.json
            data/research/v16-v169-target-hit-audit.json
            data/stable/v16-v169-primary-decision.json
            data/stable/v16-v169-live-evaluation.json
            data/stable/v16-v169-release-lock.json

      - name: Commit report, isolated primary decision and live ledger
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/research/v16-v169-basket-engine.json \
            data/research/v16-v169-target-hit-audit.json \
            data/stable/v15-practical-decision.json \
            data/stable/v16-v169-primary-decision.json \
            data/stable/v16-v169-live-evaluation.json \
            data/stable/v16-v169-release-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish isolated next-session V16.9 basket"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Configure GitHub Pages
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete application
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy V16.9 basket application
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published basket and audit
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/research/v16-v169-basket-engine.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('data/research/v16-v169-target-hit-audit.json').read_text(encoding='utf-8'))
          decision = json.loads(Path('data/stable/v16-v169-primary-decision.json').read_text(encoding='utf-8'))
          plan = decision.get('basketPlan') or {}
          print({
              'signalDate': report.get('currentSignalDate'),
              'decisionModel': (decision.get('selectedModel') or {}).get('id'),
              'basketSize': report.get('currentBasketSize'),
              'tickers': [row.get('ticker') for row in report.get('currentBasket', [])],
              'sourceSessionReady': plan.get('sourceSessionReady'),
              'sourceSessionDataRows': plan.get('sourceSessionDataRows'),
              'sourceSessionDataHash': plan.get('sourceSessionDataHash'),
              'targetTouchRateOfExecutablePct': audit.get('targetTouchRateOfExecutablePct'),
              'conservativeTargetHitRateOfExecutablePct': audit.get('conservativeTargetHitRateOfExecutablePct'),
              'positiveBasketSessionPct': audit.get('positiveBasketSessionPct'),
              'deployedUrl': '${{ steps.deployment.outputs.page_url }}',
          })
          PY

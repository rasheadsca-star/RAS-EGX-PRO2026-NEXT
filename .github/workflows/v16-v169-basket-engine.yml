name: EGX V16.9 Basket Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  push:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - "data/market.json"
      - "data/history/**"
      - "data/stable/v15-price-truth.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  schedule:
    # Run after the final post-close market-data window in Cairo.
    - cron: "20 13 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v169-basket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frozen release source
        run: |
          python -m py_compile scripts/research/v16-v169-basket-engine.py
          python -m py_compile scripts/stable/v16-v169-live-evaluation.py
          node --check scripts/stable/v16-publish-v169-basket.cjs

      - name: Run frozen V16.9 basket engine
        run: python scripts/research/v16-v169-basket-engine.py

      - name: Publish reduced-risk basket decision
        if: github.event_name != 'pull_request'
        run: node scripts/stable/v16-publish-v169-basket.cjs

      - name: Update immutable live evaluation ledger
        if: github.event_name != 'pull_request'
        run: python scripts/stable/v16-v169-live-evaluation.py

      - name: Upload V16.9 reports
        uses: actions/upload-artifact@v4
        with:
          name: v16-v169-frozen-pilot-reports
          path: |
            data/research/v16-v169-basket-engine.json
            data/stable/v16-v169-live-evaluation.json
            data/stable/v16-v169-release-lock.json

      - name: Commit report, primary app decision and live ledger
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/research/v16-v169-basket-engine.json \
            data/stable/v15-practical-decision.json \
            data/stable/v16-v169-live-evaluation.json \
            data/stable/v16-v169-release-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish next-session V16.9 basket"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete application
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy V16.9 basket application
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published basket
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/research/v16-v169-basket-engine.json').read_text(encoding='utf-8'))
          print({
              'signalDate': report.get('currentSignalDate'),
              'basketSize': report.get('currentBasketSize'),
              'tickers': [row.get('ticker') for row in report.get('currentBasket', [])],
              'method': report.get('methodology', {}).get('ranking'),
              'deployedUrl': '${{ steps.deployment.outputs.page_url }}',
          })
          PY

name: EGX V16.9 Basket Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - ".github/workflows/v16-v169-basket-engine.yml"
  push:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - ".github/workflows/v16-v169-basket-engine.yml"
  schedule:
    - cron: "59 12 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v169-basket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source
        run: |
          python -m py_compile scripts/research/v16-v169-basket-engine.py
          node --check scripts/stable/v16-publish-v169-basket.cjs

      - name: Run basket engine
        run: python scripts/research/v16-v169-basket-engine.py

      - name: Publish reduced-risk basket decision
        if: github.event_name != 'pull_request'
        run: node scripts/stable/v16-publish-v169-basket.cjs

      - name: Upload V16.9 report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v169-basket-engine-report
          path: data/research/v16-v169-basket-engine.json

      - name: Commit report and application decision on main only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-v169-basket-engine.json data/stable/v15-practical-decision.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.9 basket pilot to app"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

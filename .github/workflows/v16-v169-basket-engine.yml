name: EGX V16.9 Basket Engine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  push:
    paths:
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "data/stable/v16-v169-release-lock.json"
      - "data/market.json"
      - "data/history/**"
      - "data/stable/v15-price-truth.json"
      - "data/stable/v15-practical-decision.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
  schedule:
    # Reassert V16.9 after post-close scanners without creating duplicate commits.
    - cron: "*/15 13-20 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v169-basket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether publication is required
        id: need
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def read(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return {}

          event = os.environ.get('GITHUB_EVENT_NAME', '')
          actor = os.environ.get('GITHUB_ACTOR', '')
          decision = read('data/stable/v15-practical-decision.json')
          research = read('data/research/v16-v169-basket-engine.json')
          price = read('data/stable/v15-price-truth.json')
          target_audit_exists = Path('data/research/v16-v169-target-hit-audit.json').exists()

          expected = price.get('expectedSession') or research.get('currentSignalDate')
          model_id = ((decision.get('selectedModel') or {}).get('id'))
          primary = model_id == 'V16_9_EQUAL_WEIGHT_BASKET'
          aligned = (
              bool(expected)
              and decision.get('sessionDate') == expected
              and research.get('currentSignalDate') == expected
          )
          forced = event in {'workflow_dispatch', 'pull_request'} or actor != 'github-actions[bot]'
          should_run = forced or not (primary and aligned and target_audit_exists)

          print({
              'event': event,
              'actor': actor,
              'expectedSession': expected,
              'decisionSession': decision.get('sessionDate'),
              'researchSignalDate': research.get('currentSignalDate'),
              'selectedModel': model_id,
              'primary': primary,
              'aligned': aligned,
              'targetAuditExists': target_audit_exists,
              'forced': forced,
              'run': should_run,
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.need.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        if: steps.need.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frozen release source
        if: steps.need.outputs.run == 'true'
        run: |
          python -m py_compile scripts/research/v16-v169-basket-engine.py
          python -m py_compile scripts/research/v16-v169-target-hit-audit.py
          python -m py_compile scripts/stable/v16-v169-live-evaluation.py
          node --check scripts/stable/v16-publish-v169-basket.cjs

      - name: Run frozen V16.9 basket engine
        if: steps.need.outputs.run == 'true'
        run: python scripts/research/v16-v169-basket-engine.py

      - name: Run twenty-session target audit
        if: steps.need.outputs.run == 'true'
        run: python scripts/research/v16-v169-target-hit-audit.py

      - name: Publish reduced-risk basket decision
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: node scripts/stable/v16-publish-v169-basket.cjs

      - name: Update immutable live evaluation ledger
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: python scripts/stable/v16-v169-live-evaluation.py

      - name: Upload V16.9 reports
        if: steps.need.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v16-v169-frozen-pilot-reports
          path: |
            data/research/v16-v169-basket-engine.json
            data/research/v16-v169-target-hit-audit.json
            data/stable/v16-v169-live-evaluation.json
            data/stable/v16-v169-release-lock.json

      - name: Commit report, audit, primary app decision and live ledger
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/research/v16-v169-basket-engine.json \
            data/research/v16-v169-target-hit-audit.json \
            data/stable/v15-practical-decision.json \
            data/stable/v16-v169-live-evaluation.json \
            data/stable/v16-v169-release-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish next-session V16.9 basket and target audit"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Configure GitHub Pages
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload complete application
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy V16.9 basket application
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published basket and audit
        if: steps.need.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('data/research/v16-v169-basket-engine.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('data/research/v16-v169-target-hit-audit.json').read_text(encoding='utf-8'))
          print({
              'signalDate': report.get('currentSignalDate'),
              'basketSize': report.get('currentBasketSize'),
              'tickers': [row.get('ticker') for row in report.get('currentBasket', [])],
              'targetTouchRateOfExecutablePct': audit.get('targetTouchRateOfExecutablePct'),
              'conservativeTargetHitRateOfExecutablePct': audit.get('conservativeTargetHitRateOfExecutablePct'),
              'positiveBasketSessionPct': audit.get('positiveBasketSessionPct'),
              'deployedUrl': '${{ steps.deployment.outputs.page_url }}',
          })
          PY

name: EGX V16.3.1 Mobile Hotfix Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "preview-v16/app/index.html"
      - "preview-v16/app/launch.js"
      - "preview-v16/app/v16-3.js"
      - "preview-v16/app/v16-3.css"
      - ".github/workflows/mobile-hotfix-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v16-mobile-hotfix-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy-mobile-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V16.3.1 mobile shell
        run: |
          set -euo pipefail
          node --check preview-v16/app/app.js
          node --check preview-v16/app/pilot-policy.js
          node --check preview-v16/app/fundamentals.js
          node --check preview-v16/app/v16-3.js
          node --check preview-v16/app/launch.js
          node --check service-worker.js
          grep -q "V16.3" index.html
          grep -q "16.3.1" manifest.json
          grep -q "V16.3.1-MOBILE-HOTFIX" service-worker.js
          grep -q "const VERSION = '16.3.1'" preview-v16/app/launch.js
          test -s preview-v16/app/v16-3.css
          test -s preview-v16/app/v16-3.js
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy mobile hotfix to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful mobile deployment
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p data/stable
          node - <<'NODE'
          const fs = require('fs');
          const out = {
            schemaVersion: '16.3.1',
            generatedAt: new Date().toISOString(),
            release: 'V16.3.1_MOBILE_HOTFIX',
            status: 'DEPLOYED',
            deployedUrl: process.env.DEPLOYED_URL || null,
            sourceCommit: process.env.GITHUB_SHA || null,
            mobileCacheReset: true,
            serviceWorkerBuild: 'V16.3.1-MOBILE-HOTFIX-20260803'
          };
          fs.writeFileSync('data/stable/v16-mobile-deploy-status.json', JSON.stringify(out, null, 2) + '\n');
          console.log(out);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v16-mobile-deploy-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm V16.3.1 mobile hotfix deployment"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

name: EGX V16.3.2 Mobile and Recommendation Freshness Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "preview-v16/app/index.html"
      - "preview-v16/app/launch.js"
      - "preview-v16/app/v16-3.js"
      - "preview-v16/app/v16-3.css"
      - "preview-v16/app/recommendation-freshness.js"
      - "scripts/stable/v16-recommendation-freshness-guard.cjs"
      - ".github/workflows/mobile-hotfix-deploy.yml"
  schedule:
    - cron: "35 13-18 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v16-mobile-freshness-pages
  cancel-in-progress: true

jobs:
  validate-guard-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V16.3.2 mobile shell and freshness guard
        run: |
          set -euo pipefail
          node --check preview-v16/app/app.js
          node --check preview-v16/app/pilot-policy.js
          node --check preview-v16/app/fundamentals.js
          node --check preview-v16/app/v16-3.js
          node --check preview-v16/app/recommendation-freshness.js
          node --check preview-v16/app/launch.js
          node --check scripts/stable/v16-recommendation-freshness-guard.cjs
          node --check service-worker.js
          grep -q "V16.3" index.html
          grep -q "const VERSION = '16.3.2'" preview-v16/app/launch.js
          test -s preview-v16/app/v16-3.css
          test -s preview-v16/app/v16-3.js
          test -s preview-v16/app/recommendation-freshness.js

      - name: Classify recommendation freshness without fabricating new picks
        env:
          EGX_MARKET_HOLIDAYS: ${{ vars.EGX_MARKET_HOLIDAYS }}
        run: |
          set -euo pipefail
          node scripts/stable/v16-recommendation-freshness-guard.cjs

      - name: Commit freshness evidence before deployment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v15-practical-decision.json data/stable/v16-recommendation-freshness.json
          if ! git diff --cached --quiet; then
            git commit -m "Classify current EGX recommendation freshness"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi
          touch .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy V16.3.2 to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful V16.3.2 deployment
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p data/stable
          node - <<'NODE'
          const fs = require('fs');
          const freshness = JSON.parse(fs.readFileSync('data/stable/v16-recommendation-freshness.json', 'utf8'));
          const out = {
            schemaVersion: '16.3.2',
            generatedAt: new Date().toISOString(),
            release: 'V16.3.2_RECOMMENDATION_FRESHNESS',
            status: 'DEPLOYED',
            deployedUrl: process.env.DEPLOYED_URL || null,
            sourceCommit: process.env.GITHUB_SHA || null,
            mobileCacheReset: true,
            recommendationFresh: freshness.isFresh === true,
            decisionSession: freshness.decisionSession,
            expectedSession: freshness.expectedSession,
            displayMode: freshness.displayMode
          };
          fs.writeFileSync('data/stable/v16-mobile-deploy-status.json', JSON.stringify(out, null, 2) + '\n');
          console.log(out);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v16-mobile-deploy-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm V16.3.2 freshness deployment"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

# Legacy Pages publisher retired. Canonical deployment: .github/workflows/static.yml
# V4 is the only active independent research application; no archival job
# may overwrite its full-site Pages artifact with a partial deployment.
name: Retired legacy publisher — mobile-hotfix-deploy.yml
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Legacy Pages publisher disabled; use static.yml for full-site V4 deployment.'

name: Astra Production Audit

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
    paths:
      - 'astra-prod/app/**'
      - 'astra-prod/G22_SESSION_REFRESH.json'
      - 'data/ops/g22-main-app-handoff.json'
      - 'scripts/astra/g22-postclose-handoff-guard.cjs'
      - 'tests/astra/g22-postclose-handoff-guard.test.cjs'
      - 'tests/astra/astra-pro-v3-browser-smoke.cjs'
      - '.github/workflows/astra-production-audit.yml'
      - '.github/workflows/astra-v3-vercel-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-production-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-candidate-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze candidate truth
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node --check astra-prod/app/astra-analytics-pro-v3.js
          node --check scripts/astra/g22-postclose-handoff-guard.cjs
          node --check scripts/astra/native/astra-intelligence.cjs
          node --check tests/astra/astra-pro-v3-browser-smoke.cjs
          node --test tests/astra/g22-postclose-handoff-guard.test.cjs
          node --test tests/astra/astra-native-intelligence.test.cjs
          # The native-intelligence test intentionally regenerates the workflow inventory
          # to validate classification logic. Restore the tracked baseline so the audit
          # remains read-only and the final mutation guard detects only unintended writes.
          git checkout -- docs/astra/development/WORKFLOW_INVENTORY.json
          git diff --exit-code

      - name: Ten consecutive decision and health reviews
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 10); do
            echo "=== ASTRA STATIC CLEAN CYCLE $cycle/10 ==="
            node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const d=read('astra-prod/app/data.json');
          const u=read('astra-prod/app/intelligence/market-universe.json');
          const l=read('astra-prod/app/intelligence/recommendation-ledger.json');
          const o=read('astra-prod/app/intelligence/recommendation-outcomes.json');
          const p=read('astra-prod/app/intelligence/performance-summary.json');
          const handoff=read('data/ops/g22-main-app-handoff.json');
          const eligibility=read('docs/astra/PRODUCTION_ELIGIBILITY_AUDIT.json');
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const s=d?.sourceDecision?.session;
          const recs=d?.decisionSnapshot?.top5||d?.decisionSnapshot?.opportunities||[];
          ok(/^\d{4}-\d{2}-\d{2}$/.test(String(s||'')),'invalid session');
          ok(d?.decisionSnapshot?.sessionDate===s&&d?.decisionSnapshot?.asOfSessionDate===s,'decision session mismatch');
          ok(d?.sourceDecision?.upstream?.sessionDate===s,'source session mismatch');
          ok(d?.sourceDecision?.upstream?.final===true&&d?.sourceDecision?.upstream?.pagesPublished===true,'upstream not finalized/published');
          ok(d?.sourceDecision?.decisionSnapshotId===d?.decisionSnapshot?.decisionSnapshotId,'snapshot id mismatch');
          ok(d?.sourceDecision?.semanticDecisionHash===d?.decisionSnapshot?.semanticDecisionHash,'semantic hash mismatch');
          ok(d?.sourceDecision?.objectHashReproduced===true,'snapshot object hash not reproduced');
          if(process.env.GITHUB_EVENT_NAME==='push'){
            ok(d?.sourceDecision?.upstream?.canonicalDataHead===handoff?.canonicalDataHead,'canonical data head lineage drift');
            ok(String(d?.sourceDecision?.upstream?.producerRunId||'')===String(handoff?.producerRunId||''),'producer run lineage drift');
            ok(d?.sourceDecision?.upstream?.mainAppMaterialFingerprint===handoff?.materialFingerprint,'material fingerprint lineage drift');
            ok(d?.sourceDecision?.upstream?.sourceSessionDataHash===handoff?.sourceSessionDataHash,'source data hash lineage drift');
          }
          ok(d?.health?.criticalUnresolved===0,'critical finding unresolved');
          ok(String(d?.health?.guardStatus||'').startsWith('PASS'),'guard not passing');
          ok(d?.health?.sessionIntegrity?.freshnessStatus==='CURRENT','stale production truth');
          ok(Number(d?.health?.coverage?.currentCanonicalPct)>=90,'canonical coverage below 90%');
          ok(Number(d?.health?.coverage?.decisionPipelinePct)>=80,'decision coverage below 80%');
          ok(Number(d?.health?.coverage?.sourceSessionEvidencePct)>=90,'source evidence below 90%');
          ok(d?.health?.priceTruth?.executionGrade===true,'price truth not execution grade');
          ok((d?.health?.priceTruth?.missingHistoryFiles||[]).length===0,'missing history files');
          ok(recs.length<=5,'recommendation quota violation');
          ok(new Set(recs.map(x=>x.ticker)).size===recs.length,'duplicate recommendations');
          for(const r of recs){
            const lo=Number(r.entryPlan?.low),hi=Number(r.entryPlan?.high),stop=Number(r.stopLoss),targets=(r.targets||[]).map(Number);
            ok(Number.isFinite(lo)&&Number.isFinite(hi)&&lo<=hi,'invalid entry '+r.ticker);
            ok(Number.isFinite(stop)&&stop<lo,'invalid stop '+r.ticker);
            ok(targets.length>0&&targets.every(t=>Number.isFinite(t)&&t>hi),'invalid target '+r.ticker);
          }
          ok(Number(u?.activeCount||u?.records?.length)>0,'empty universe');
          const currentLedger=(l?.records||[]).filter(r=>r.decisionSnapshotId===d.sourceDecision.decisionSnapshotId&&r.sessionDate===s);
          ok(currentLedger.length===recs.length,'current-session ledger count mismatch');
          ok(JSON.stringify(currentLedger.map(r=>r.ticker).sort())===JSON.stringify(recs.map(r=>r.ticker).sort()),'current-session ledger ticker identity mismatch');
          ok((o?.records||[]).length===(l?.records||[]).length,'outcome accounting mismatch');
          ok(p?.reconciliation?.pass===true,'performance reconciliation failed');
          ok(p?.sourceSnapshot?.decisionSnapshotId===d.sourceDecision.decisionSnapshotId,'performance source snapshot stale');
          ok(p?.sessionRange?.last===s,'performance session range stale');
          ok(Number(p?.currentOpportunities)===recs.length,'performance current opportunity count mismatch');
          const generatorHash=crypto.createHash('sha256').update(fs.readFileSync('scripts/astra/native/astra-intelligence.cjs','utf8')).digest('hex');
          ok(p?.sourceSnapshot?.generatorSourceHash===generatorHash,'performance generator hash stale');
          for(const w of ['7_SESSIONS','30_SESSIONS','90_SESSIONS','YTD','ALL']) ok(p?.windows?.[w],w+' performance window missing');
          ok(Object.prototype.hasOwnProperty.call(p?.metrics||{},'averageMfePct'),'MFE KPI missing');
          ok(Object.prototype.hasOwnProperty.call(p?.metrics||{},'averageMaePct'),'MAE KPI missing');
          const approved=(eligibility.rows||[]).filter(x=>x.productionEligible===true);
          ok(eligibility.status==='PASS'&&eligibility.productionEligibleCount===1&&approved.length===1,'production eligibility invariant failed');
          ok(approved[0].strategyId==='PORTFOLIO_BASKET_EQUAL_WEIGHT','unexpected production strategy');
          ok(d?.decisionSnapshot?.strategyVersions?.PORTFOLIO_BASKET_EQUAL_WEIGHT===approved[0].sourceCommit,'decision strategy source pin drift');
          console.log('ASTRA_STATIC_CYCLE_PASS',JSON.stringify({session:s,snapshot:d.sourceDecision.decisionSnapshotId,recommendations:recs.map(x=>x.ticker),critical:d.health.criticalUnresolved,high:d.health.highUnresolved,coverage:d.health.coverage}));
          NODE
            test "$(git rev-parse HEAD)" = "$AUDIT_HEAD"
          done

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Install Playwright Core
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.55.0

      - name: Ten consecutive universal-chart browser reviews
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/astra-production-audit-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/astra-prod/app/pro-v3.html >/dev/null && break || sleep 1; done
          for cycle in $(seq 1 10); do
            echo "=== ASTRA BROWSER CLEAN CYCLE $cycle/10 ==="
            ASTRA_PRO_BASE=http://127.0.0.1:4173 ASTRA_REVIEW_CYCLE="$cycle" node tests/astra/astra-pro-v3-browser-smoke.cjs
            test "$(git rev-parse HEAD)" = "$AUDIT_HEAD"
          done

      - name: Final mutation guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDIT_HEAD"
          git diff --exit-code

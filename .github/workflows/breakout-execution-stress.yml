name: Breakout execution stress research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/quant/v13-4-quant-engine.cjs'
      - 'scripts/quant/participation-slippage.cjs'
      - 'scripts/quant/thndr-cost.cjs'
      - 'scripts/quant/verify-execution-stress.cjs'
      - 'scripts/quant/verify-trade-ledger.cjs'
      - 'scripts/quant/research-daily-portfolio.cjs'
      - 'scripts/quant/report-market-data-gaps.cjs'
      - 'scripts/quant/audit-calendar-conflicts.cjs'
      - 'data/quant/egx-verified-calendar-2026.json'
      - 'tests/quant/research-daily-portfolio.test.cjs'
      - '.github/workflows/breakout-execution-stress.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/quant/thndr-cost.test.cjs && node tests/quant/participation-slippage.test.cjs && node tests/quant/research-daily-portfolio.test.cjs
      - name: Recompute scenario metrics without committing or live trading
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-artifacts
          cp data/v13-4-quant-policy.json /tmp/egx-original-policy.json
          for amount in 20000 100000; do
            for scenario in low medium high; do
              node - "$amount" "$scenario" <<'NODE'
          const fs=require('fs'),p='data/v13-4-quant-policy.json';
          const x=JSON.parse(fs.readFileSync('/tmp/egx-original-policy.json','utf8'));
          x.research.costModel='thndr_invoice_2026_10_21';
          x.research.referenceOrderValueEgp=Number(process.argv[2]);
          x.research.slippageScenario=process.argv[3];
          x.safety.liveExecutionEnabled=false;
          fs.writeFileSync(p,JSON.stringify(x,null,2));
          NODE
              node scripts/quant/v13-4-quant-engine.cjs
              node scripts/quant/verify-trade-ledger.cjs
              cp data/quant/walk-forward-trade-ledger.json research-artifacts/trades-$amount-$scenario.json
              node scripts/quant/audit-calendar-conflicts.cjs data/quant/walk-forward-trade-ledger.json research-artifacts/calendar-$amount-$scenario.json
              node scripts/quant/research-daily-portfolio.cjs data/quant/walk-forward-trade-ledger.json research-artifacts/portfolio-$amount-$scenario.json
              node - "$amount" "$scenario" <<'NODE'
          const fs=require('fs');
          const file='research-artifacts/portfolio-'+process.argv[2]+'-'+process.argv[3]+'.json';
          const p=JSON.parse(fs.readFileSync(file,'utf8'));
          const errors=[];
          if(p.accepted+p.rejected!==p.closedPositions.length+p.rejected)errors.push('trade-count mismatch');
          if(p.maxOpenPositions>p.assumptions.maxPositions)errors.push('portfolio position cap breached');
          if(p.missingMarks!==0)errors.push('missing daily prices: '+p.missingMarks);
          if((p.excludedCalendarDates||[]).length)errors.push('calendar dates excluded without EGX verification: '+p.excludedCalendarDates.length);
          if(p.calendarVerified!==true)errors.push('official exchange calendar not verified');
          if(p.status==='TRADE_ON_VERIFIED_CLOSURE')errors.push('trade records conflict with verified EGX closures: '+(p.conflictingTrades||[]).join(','));
          if(p.valuationComplete!==true)errors.push('incomplete market valuation');
          const diagnosis={file,passed:errors.length===0,errors,missingByTicker:p.missingByTicker||{},missingMarkDetails:p.missingMarkDetails||[],excludedCalendarDates:p.excludedCalendarDates||[],conflictingTrades:p.conflictingTrades||[],accepted:p.accepted,rejected:p.rejected};
          fs.writeFileSync(file.replace('portfolio-','diagnosis-'),JSON.stringify(diagnosis,null,2));
          console.log('Portfolio diagnostic: '+JSON.stringify({file,passed:diagnosis.passed,errors:diagnosis.errors,missingByTicker:diagnosis.missingByTicker}));
          NODE
              node - "$amount" "$scenario" <<'NODE'
          const fs=require('fs'),m=require('./data/quant/recommendation-audit.json');
          const amount=Number(process.argv[2]),scenario=process.argv[3];
          const breakout=(m.modelStatuses||[]).find(x=>x.strategyId==='breakout');
          const policy=require('./data/v13-4-quant-policy.json');
          const provenance=require('./data/quant/strategy-backtests.json').assumptions;
          const row={amountEgp:amount,scenario,latestMarketSession:m.latestMarketSession,metrics:breakout?.validationMetrics||null,engineProvenance:provenance,actualPolicy:{orderValueEgp:policy.research.referenceOrderValueEgp,slippageScenario:policy.research.slippageScenario,costModel:policy.research.costModel,liveExecutionEnabled:policy.safety.liveExecutionEnabled},executionReady:false,performanceCertified:false,method:'hypothetical slippage vs prior ADV; not measured execution'};
          fs.writeFileSync('research-artifacts/breakout-'+amount+'-'+scenario+'.json',JSON.stringify(row,null,2));
          console.log(JSON.stringify(row));
          NODE
            done
          done
          cp /tmp/egx-original-policy.json data/v13-4-quant-policy.json
          node scripts/quant/verify-execution-stress.cjs research-artifacts
      - name: Publish research comparison in GitHub run summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('research-artifacts/comparison-summary.json','utf8'));
          console.log('## Breakout execution-cost stress — RESEARCH ONLY');
          console.log('These are hypothetical slippage scenarios, not observed trade fills or certified profitability.');
          console.log('');
          console.log('| Order EGP | Slippage | Closed trades | Win % | Average R | Profit factor | Max drawdown % |');
          console.log('|---:|---|---:|---:|---:|---:|---:|');
          for (const x of s.scenarios)console.log('| '+x.amountEgp+' | '+x.scenario+' | '+x.closedTrades+' | '+x.winRatePct+' | '+x.averageR+' | '+x.profitFactor+' | '+x.maxDrawdownPct+' |');
          console.log('');
          console.log('### Daily position-sized portfolio research (10% fixed initial capital, 8 concurrent positions)');
          console.log('| Order EGP | Scenario | Accepted | Capacity rejected | Ending equity EGP | Max daily drawdown % | Missing price marks |');
          console.log('|---:|---|---:|---:|---:|---:|---:|');
          for (const x of s.scenarios) {
            const p=JSON.parse(fs.readFileSync('research-artifacts/portfolio-'+x.amountEgp+'-'+x.scenario+'.json','utf8'));
            console.log('| '+x.amountEgp+' | '+x.scenario+' | '+p.accepted+' | '+p.rejected+' | '+p.endingEquityEgp+' | '+p.maxDrawdownPct+' | '+p.missingMarks+' |');
          }
          console.log('');
          console.log('### Missing-price diagnostic (all scenarios)');
          console.log('| Order EGP | Scenario | Missing marks | Affected tickers |');
          console.log('|---:|---|---:|---:|');
          for(const x of s.scenarios){
            const d=JSON.parse(fs.readFileSync('research-artifacts/diagnosis-'+x.amountEgp+'-'+x.scenario+'.json','utf8'));
            console.log('| '+x.amountEgp+' | '+x.scenario+' | '+d.missingMarkDetails.length+' | '+Object.keys(d.missingByTicker).length+' |');
          }
          console.log('Missing-price detail for each stock and session is preserved in diagnosis-*.json; never forward-fill missing prices for certification.');
          console.log('');
          console.log('**Incomplete valuation marks are a blocking quality gate; numeric equity and drawdown remain unverified.**');
          console.log('**Research only. Corporate actions and execution price assumptions are not verified. Not a certified equity curve.**');
          console.log('**Execution ready: NO. Performance certified: NO.**');
          NODE
      - name: Aggregate missing prices across all six scenarios
        run: node scripts/quant/report-market-data-gaps.cjs research-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: breakout-execution-stress
          path: research-artifacts/
      - name: Enforce portfolio quality gate after uploading complete diagnostics
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('research-artifacts').filter(x=>/^diagnosis-.*\.json$/.test(x));
          if(files.length!==6)throw Error('Expected six portfolio diagnosis files, got '+files.length);
          const failed=files.map(x=>JSON.parse(fs.readFileSync('research-artifacts/'+x,'utf8'))).filter(x=>!x.passed);
          if(failed.length)throw Error('Portfolio certification blocked for '+failed.length+' scenarios: '+failed.map(x=>x.file).join(', '));
          NODE

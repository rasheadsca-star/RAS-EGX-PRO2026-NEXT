name: V20 Live Freshness Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v20-live-freshness-refresh.yml"
  schedule:
    # 15:10 Cairo in both UTC+2 / UTC+3 seasons; Cairo gate below selects one run.
    - cron: "10 12,13 * * 0-4"

permissions:
  contents: write

concurrency:
  group: v20-live-freshness-single-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Cairo post-close gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR="$(TZ=Africa/Cairo date +%H)"
          DOW="$(TZ=Africa/Cairo date +%u)"
          if [ "$HOUR" = "15" ] && [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout isolated V20 branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 0

      - name: Setup Node 22
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest accepted V17 evidence for runtime only
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/recommendations.json
            data/technical-50-report.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
            data/v17/current-recommendation-base-status.json
          )
          for rel in "${paths[@]}"; do
            git cat-file -e "$V17_SHA:$rel" || { echo "Missing V17 runtime input: $rel"; exit 1; }
            mkdir -p "$(dirname "$rel")"
            git show "$V17_SHA:$rel" > "$rel"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$rel"
          done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" node scripts/v20/validate-v17-runtime-sync.cjs
          node scripts/v20/validate-v17-decision-core-runtime.cjs

      - name: Validate frozen V20 Native sources
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/v20/build-data-truth.cjs
          node --check scripts/v20/build-integrated-decision-snapshot.cjs
          node --check scripts/v20/build-trusted-technical-history.cjs
          node --check scripts/v20/build-market-regime.cjs
          node --check scripts/v20/build-market-explorer.cjs
          node --check scripts/v20/build-full-market-native-technical.cjs
          node --check scripts/v20/build-full-market-native-selection.cjs
          node --check scripts/v20/build-native-explainability-v1.cjs
          node --check scripts/v20/finalize-native-ranking-v1.cjs
          node --check scripts/v20/build-native-model-freeze.cjs
          node --check scripts/v20/build-native-current.cjs
          node --check scripts/v20/native-current-regression.cjs

      - name: Build V20 data truth and integrated base
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/apply-null-semantics-hardening.cjs
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs

      - name: Build trusted point-in-time technical evidence
        if: steps.gate.outputs.proceed == 'true'
        env:
          V20_HISTORY_NETWORK_REFRESH: "true"
          V20_HISTORY_CONCURRENCY: "4"
          V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: "5"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs

      - name: Build current full-market regime evidence
        if: steps.gate.outputs.proceed == 'true'
        env:
          V20_REGIME_NETWORK_REFRESH: "true"
          V20_REGIME_CONCURRENCY: "6"
          V20_REGIME_MIN_PARTICIPATION_PCT: "60"
          V20_REGIME_PRICE_TOLERANCE_PCT: "5"
          V20_REGIME_MIN_TRUSTED_SESSIONS: "50"
          V20_REGIME_FETCH_RANGE: "6mo"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-unit.cjs
          node scripts/v20/market-regime-regression.cjs

      - name: Build full-market explorer
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/null-semantics-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs

      - name: Rebuild frozen V20 Native technical evidence
        if: steps.gate.outputs.proceed == 'true'
        env:
          V20_NATIVE_FULL_TECH_NETWORK_REFRESH: "true"
          V20_NATIVE_FULL_TECH_STARTA_FALLBACK: "true"
          V20_NATIVE_FULL_TECH_CONCURRENCY: "8"
          V20_NATIVE_FULL_TECH_RANGE: "6mo"
          V20_NATIVE_FULL_TECH_PRICE_TOLERANCE_PCT: "5"
        run: node scripts/v20/build-full-market-native-technical.cjs

      - name: Rebuild frozen V20 Native V1 ranking
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-full-market-native-selection.cjs
          node scripts/v20/build-native-explainability-v1.cjs
          node scripts/v20/finalize-native-ranking-v1.cjs
          node scripts/v20/build-native-model-freeze.cjs
          node scripts/v20/build-native-current.cjs
          node scripts/v20/native-current-regression.cjs

      - name: Enforce exact V20 freshness and frozen-governance contract
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const v17=read('data/v17/current.json');
          const native=read('data/v20/native-current.json');
          const selection=read('data/v20/full-market-native-selection.json');
          const regression=read('data/v20/native-current-regression.json');
          const sourceSession=v17.sessionDate||v17.marketSession||v17.sourceMarketSession;
          if(!sourceSession) throw new Error('Missing latest completed V17 session');
          if(native.sessionDate!==sourceSession) throw new Error(`V20 Native stale: ${native.sessionDate} != ${sourceSession}`);
          if(selection.sessionDate!==sourceSession) throw new Error(`V20 selection stale: ${selection.sessionDate} != ${sourceSession}`);
          if(native.engineId!=='V20_FULL_MARKET_NATIVE_SELECTION_V1') throw new Error('V20 engine identity drift');
          if(native.rankingContract!=='V20_SAFETY_STRENGTH_LEXICOGRAPHIC_TIE_BREAK_V2') throw new Error('Frozen V20 ranking contract drift');
          if(native.executionPermission!==false||native.productionAllocation!==false||native.automaticPromotion!==false) throw new Error('Research-only governance escalation');
          if(regression.ok!==true) throw new Error('V20 Native regression failed');
          if(!Array.isArray(native.publishedCandidates)||native.publishedCandidates.length<3) throw new Error('V20 has fewer than 3 research candidates');
          const next=s=>{const d=new Date(`${s}T12:00:00Z`);do d.setUTCDate(d.getUTCDate()+1);while([5,6].includes(d.getUTCDay()));return d.toISOString().slice(0,10)};
          const out={
            schemaVersion:'20.0.0-live-freshness-status-2',
            generatedAt:new Date().toISOString(),
            status:'FRESH_FOR_NEXT_TRADING_SESSION_RESEARCH',
            engineId:native.engineId,
            sourceSession,
            nativeSession:native.sessionDate,
            forNextTradingSession:next(sourceSession),
            top3:native.publishedCandidates.slice(0,3).map(r=>({rank:r.rank,ticker:r.ticker,entryLow:r.entryLow,entryHigh:r.entryHigh,stop:r.stop,target1:r.target1,target2:r.target2,nativeResearchScore:r.nativeResearchScore})),
            governance:{researchOnly:true,selectionTechniqueChanged:false,rankingContractChanged:false,weightsChanged:false,filtersChanged:false,riskGatesChanged:false,executionPermission:false,productionAllocation:false,automaticPromotion:false},
            writer:'MAIN_SCHEDULED_V20_SINGLE_RESEARCH_WRITER'
          };
          fs.writeFileSync('data/v20/native-freshness-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Restore runtime-only upstream files
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          runtime_paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/recommendations.json
            data/technical-50-report.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
            data/v17/current-recommendation-base-status.json
          )
          for rel in "${runtime_paths[@]}"; do
            if git ls-files --error-unmatch "$rel" >/dev/null 2>&1; then
              git restore --worktree --staged -- "$rel"
            else
              rm -f -- "$rel"
            fi
          done

      - name: Persist V20 research evidence only
        if: steps.gate.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20
          if git diff --cached --quiet; then
            echo "V20 already fresh; nothing to commit."
            exit 0
          fi
          SESSION="$(node -p "require('./data/v20/native-current.json').sessionDate")"
          git commit -m "Refresh V20 Native research for session ${SESSION} [skip ci]"
          git fetch origin develop/v20-integrated-decision-platform
          git rebase origin/develop/v20-integrated-decision-platform
          git push origin HEAD:develop/v20-integrated-decision-platform

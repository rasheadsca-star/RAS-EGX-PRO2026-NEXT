name: MAIN APP — Canonical Governance Refresh

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/stable/v16-v169-primary-decision.json"
      - "data/stable/v15-price-truth.json"
      - "data/fetch-status.json"
      - "data/market.json"
      - "data/v17/current.json"
      - "data/stable/v16-v169-live-evaluation.json"
      - "data/research/v16-v169-basket-engine.json"
      - "data/research/v16-v169-target-hit-audit.json"
      - "scripts/stable/v16-recommendation-freshness-guard.cjs"
      - "scripts/stable/v16-main-app-governance.cjs"
      - "scripts/stable/v16-main-app-ledger-reconcile.cjs"
      - "scripts/stable/v16-main-app-consensus.cjs"
      - "scripts/stable/v16-main-app-engine-performance.cjs"
      - "scripts/stable/v16-main-app-professional-readiness.cjs"
      - "scripts/stable/v16-main-app-professional-coverage-finalizer.cjs"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "preview-v16/app/decision-source.js"
      - "preview-v16/app/v169-p2.html"
      - "preview-v16/app/main-app-governance-overlay.js"
      - "preview-v16/app/main-app-consensus-overlay.js"
      - "preview-v16/app/main-app-professional-readiness-v2.js"
      - "preview-v16/app/stock-analyzer.js"
      - "preview-v16/app/stock-analyzer-chart.js"
      - "preview-v16/app/stock-analyzer-decision.js"
      - ".github/workflows/main-app-governance-refresh.yml"
      - ".github/workflows/main-app-v19v6-consensus-enrich.yml"
      - ".github/workflows/main-app-immutability-guard.yml"
  schedule:
    # One canonical refresh cadence. Other comparison workflows are diagnostic-only.
    # Cairo gate below accepts 10:00-21:59 only and handles Egypt DST dynamically.
    - cron: "25 7-19 * * 0-4"

permissions:
  contents: write
  actions: write

concurrency:
  group: egx-main-app-v1692-p2-canonical
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve Cairo refresh window
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW=$(TZ=Africa/Cairo date '+%w')
          HOUR=$(TZ=Africa/Cairo date '+%H')
          RUN=false
          if [ "$DOW" -le 4 ] && [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 21 ]; then RUN=true; fi
          echo "Cairo canonical refresh: $(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M') run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout latest MAIN APP
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        if: steps.clock.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate canonical stability stack
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-recommendation-freshness-guard.cjs
          node --check scripts/stable/v16-main-app-governance.cjs
          node --check scripts/stable/v16-main-app-ledger-reconcile.cjs
          node --check scripts/stable/v16-main-app-consensus.cjs
          node --check scripts/stable/v16-main-app-engine-performance.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs
          node --check scripts/stable/v16-main-app-professional-coverage-finalizer.cjs
          node --check preview-v16/app/decision-source.js
          node --check preview-v16/app/main-app-governance-overlay.js
          node --check preview-v16/app/main-app-consensus-overlay.js
          node --check preview-v16/app/main-app-professional-readiness-v2.js
          node --check preview-v16/app/stock-analyzer.js
          node --check preview-v16/app/stock-analyzer-chart.js
          node --check preview-v16/app/stock-analyzer-decision.js
          grep -q "buildMainAppGovernance" scripts/stable/v16-recommendation-freshness-guard.cjs
          grep -q "v16-main-app-professional-readiness.cjs" scripts/stable/v16-recommendation-freshness-guard.cjs
          grep -q "V16_9_EQUAL_WEIGHT_BASKET" scripts/stable/v16-main-app-governance.cjs
          grep -q "PUBLISHED_SIGNAL_IS_AUTHORITY" scripts/stable/v16-main-app-ledger-reconcile.cjs
          grep -q "MATERIAL_SELECTION_CHANGE_REQUIRES_NEW_VERSION" scripts/stable/v16-main-app-ledger-reconcile.cjs
          grep -q "V19_CHAT_GPT_NATIVE_CHALLENGER_V6" scripts/stable/v16-main-app-consensus.cjs
          grep -q "canonicalConsensusSingleWriter: true" scripts/stable/v16-main-app-consensus.cjs
          grep -q "diagnosticOnly:true" scripts/stable/v16-main-app-engine-performance.cjs
          grep -q "changesMainAppRanking:false" scripts/stable/v16-main-app-engine-performance.cjs
          grep -q "usedInProfessionalReadinessScore:false" scripts/stable/v16-main-app-engine-performance.cjs
          grep -q "professionalReadinessScore" scripts/stable/v16-main-app-professional-readiness.cjs
          grep -q "professionalReadinessV2Panel" preview-v16/app/v169-p2.html
          grep -q "v16-main-app-professional-readiness.json" preview-v16/app/v169-p2.html
          grep -q "v16-main-app-engine-performance.json" preview-v16/app/main-app-consensus-overlay.js
          # The former V19 enrichment workflow must remain manual diagnostic-only.
          ! grep -Eq "^[[:space:]]*(push|schedule|workflow_run):" .github/workflows/main-app-v19v6-consensus-enrich.yml

      - name: Build canonical snapshot with immutable stability lock
        if: steps.clock.outputs.run == 'true'
        id: governance
        shell: bash
        run: |
          set +e
          node scripts/stable/v16-main-app-governance.cjs
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 2 ]; then exit "$CODE"; fi
          test -s data/stable/v16-main-app-current.json
          test -s data/stable/v16-main-app-signal-ledger.json
          test -s data/stable/v16-main-app-ledger-reconcile.json

      - name: Refresh canonical multi-engine consensus
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-consensus.cjs
          test -s data/stable/v16-main-app-consensus.json
          test -s data/stable/v16-main-app-consensus-regression.json

      - name: Build canonical engine target stop performance audit
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-engine-performance.cjs
          test -s data/stable/v16-main-app-engine-performance.json
          node - <<'NODE'
          const p=require('./data/stable/v16-main-app-engine-performance.json');
          if(p.schemaVersion!=='16.9.2-engine-performance-comparison-1')throw Error('Engine performance schema mismatch');
          if(p.diagnosticOnly!==true||p.changesMainAppRanking!==false||p.changesExecutionPermission!==false||p.changesWeights!==false||p.changesRiskGates!==false||p.usedInProfessionalReadinessScore!==false)throw Error('Engine performance isolation contract failed');
          const main=p.rows.find(r=>r.id==='MAIN_APP_V16_9');
          const v19=p.rows.find(r=>r.id==='V19_V6');
          if(!main?.evidenceComparable)throw Error('MAIN APP performance evidence missing');
          if(!v19)throw Error('V19 V6 performance row missing');
          NODE

      - name: Build Professional Readiness V2
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-professional-readiness.cjs
          node scripts/stable/v16-main-app-professional-coverage-finalizer.cjs
          test -s data/stable/v16-main-app-professional-readiness.json

      - name: Build stack status and stability acceptance
        if: steps.clock.outputs.run == 'true'
        env:
          GOVERNANCE_EXIT: ${{ steps.governance.outputs.exit_code }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const snap=read('data/stable/v16-main-app-current.json');
          const rec=read('data/stable/v16-main-app-ledger-reconcile.json');
          const consensus=read('data/stable/v16-main-app-consensus.json');
          const regression=read('data/stable/v16-main-app-consensus-regression.json');
          const performance=read('data/stable/v16-main-app-engine-performance.json');
          const readiness=read('data/stable/v16-main-app-professional-readiness.json');
          const price=read('data/stable/v15-price-truth.json');
          const v19=(consensus?.engineRegistry?.comparisonEngines||[]).find(e=>e.id==='V19_CHALLENGER');
          const v19Perf=(performance?.rows||[]).find(e=>e.id==='V19_V6');
          const required={
            engine:snap?.governance?.activeEngine==='V16_9_EQUAL_WEIGHT_BASKET',
            canonical:snap.canonicalSnapshot===true,
            failClosed:snap?.governance?.failClosed===true,
            immutableLedger:snap?.governance?.immutableLedger===true && snap?.immutableSignal?.ledgerConflict!==true,
            publishedSignalAuthority:snap?.stabilityPolicy?.canonicalSignalAuthority==='IMMUTABLE_LEDGER' || rec?.policy==='PUBLISHED_SIGNAL_IS_AUTHORITY',
            noSilentSameSessionRewrite:rec?.reason!=='MATERIAL_SELECTION_CHANGE_REQUIRES_NEW_VERSION' || snap.systemState==='BLOCKED',
            state:['HEALTHY','DEGRADED','RESEARCH_ONLY','BLOCKED'].includes(snap.systemState),
            allocationGuard:Number(snap?.portfolioPolicy?.plannedAllocationPct||0)<=50.0001,
            consensusRegression:regression.pass===true,
            directV19V6:v19?.label==='V19 V6' && v19?.sourceEngineId==='V19_CHAT_GPT_NATIVE_CHALLENGER_V6',
            consensusSingleWriter:consensus?.policy?.canonicalConsensusSingleWriter===true,
            consensusNoRankingMutation:consensus?.policy?.comparisonCanChangeMainRanking===false,
            consensusNoExecutionGrant:consensus?.policy?.comparisonCanGrantExecution===false,
            consensusNoCanonicalRewrite:consensus?.policy?.comparisonCanRewriteCanonicalSignal===false,
            exactSessionConsensus:consensus?.policy?.exactSessionAlignmentRequired===true,
            performanceSchema:performance?.schemaVersion==='16.9.2-engine-performance-comparison-1',
            performanceDiagnosticOnly:performance?.diagnosticOnly===true,
            performanceNoRankingMutation:performance?.changesMainAppRanking===false,
            performanceNoExecutionMutation:performance?.changesExecutionPermission===false,
            performanceNoWeightMutation:performance?.changesWeights===false,
            performanceNoRiskGateMutation:performance?.changesRiskGates===false,
            performanceExcludedFromReadiness:performance?.usedInProfessionalReadinessScore===false,
            performanceHasV19Row:!!v19Perf,
            readinessV2Schema:readiness.schemaVersion==='16.9.2-professional-readiness-v2',
            readinessV2Engine:readiness.engine==='V16_9_EQUAL_WEIGHT_BASKET',
            readinessNotGovernanceCappedBySafeDrift:!(rec?.sameTickerSet===true && rec?.reconciled===true && readiness?.capReason==='ENGINE_OR_GOVERNANCE_HARD_GATE'),
            readinessDoesNotClaimAccuracy:/لا يرفع ترتيب الأسهم/.test(readiness?.interpretation?.accuracyMeaningAr||''),
            professionalCoveragePreserved:price?.professionalCoverage?.complete!==true || Number((readiness.axes||[]).find(a=>a.id==='DATA_SESSION_INTEGRITY')?.scorePct)===100,
          };
          const pass=Object.values(required).every(Boolean);
          const out={
            schemaVersion:'16.9.2-main-app-stability-lock-status-1',
            generatedAt:new Date().toISOString(),
            status:pass?'PASS':'FAIL',
            governanceExitCode:Number(process.env.GOVERNANCE_EXIT||0),
            systemState:snap.systemState,
            executionAllowed:snap.executionAllowed===true,
            sessionDate:snap.sessionDate||null,
            marketSession:snap?.dataTruth?.marketSession||null,
            recommendationTickers:(snap.recommendations||[]).map(r=>r.ticker),
            sourceSessionEvidenceCoveragePct:snap?.dataTruth?.sourceSessionEvidenceCoveragePct??null,
            plannedAllocationPct:snap?.portfolioPolicy?.plannedAllocationPct??null,
            ledgerReconcileReason:rec?.reason||null,
            consensusStatus:consensus.status,
            v19Session:v19?.sessionDate||null,
            v19SessionAligned:v19?.sessionAligned===true,
            fullyConfirmedCount:consensus?.current?.fullyConfirmedCount||0,
            enginePerformanceComparableCount:performance?.comparableEngineCount||0,
            v19PerformanceAuditAvailable:v19Perf?.evidenceComparable===true,
            professionalReadinessScore:readiness.professionalReadinessScore,
            foundationQualityScore:readiness.foundationQualityScore,
            professionalClaimAllowed:readiness.professionalClaimAllowed===true,
            readinessHardBlockers:(readiness.hardBlockers||[]).map(x=>x.code),
            professionalMarketCoverage:price?.professionalCoverage||null,
            checks:required,
          };
          fs.writeFileSync('data/stable/v16-main-app-stack-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(out);
          if(!pass)process.exit(1);
          NODE

      - name: Commit canonical MAIN APP state
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stable/v16-main-app-current.json \
            data/stable/v16-main-app-signal-ledger.json \
            data/stable/v16-main-app-ledger-reconcile.json \
            data/stable/v16-main-app-consensus.json \
            data/stable/v16-main-app-consensus-regression.json \
            data/stable/v16-main-app-engine-performance.json \
            data/stable/v16-main-app-professional-readiness.json \
            data/stable/v16-main-app-stack-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh stable MAIN APP canonical state"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          else
            echo "Canonical MAIN APP state already current."
          fi

      - name: Dispatch stable Pages deployment for latest main
        if: steps.clock.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Pages deployment dispatched for latest stable canonical state."
              exit 0
            fi
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 10))
          done

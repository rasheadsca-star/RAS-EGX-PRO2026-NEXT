name: V20 Retrospective Walk-Forward Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v20-retrospective-walkforward
      - develop/v20-integrated-decision-platform
    paths:
      - "scripts/v20/build-retrospective-walk-forward-target-stop.cjs"
      - "scripts/v20/retrospective-walk-forward-regression.cjs"
      - "data/v20/decision-intelligence-policy.json"
      - ".github/workflows/v20-retrospective-walk-forward.yml"

permissions:
  contents: write

concurrency:
  group: v20-retrospective-walk-forward-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V20 source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current trusted MAIN APP history read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "$MAIN_SHA:data/research/v16-v169-target-hit-audit.json"
          git checkout "$MAIN_SHA" -- data/history data/research/v16-v169-target-hit-audit.json
          test -n "$(find data/history -maxdepth 1 -type f -name '*.json' -print -quit)"
          echo "Retrospective inputs synced from MAIN APP $MAIN_SHA for this workspace only."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/v20/build-retrospective-walk-forward-target-stop.cjs
          node --check scripts/v20/retrospective-walk-forward-regression.cjs
          node --check scripts/v20/build-full-market-native-selection.cjs
          node --check scripts/v20/build-full-market-native-technical.cjs
          grep -q "RETROSPECTIVE_POINT_IN_TIME_RECONSTRUCTION" scripts/v20/build-retrospective-walk-forward-target-stop.cjs
          grep -q "freshIndependentForward: false" scripts/v20/build-retrospective-walk-forward-target-stop.cjs
          grep -q "changesRanking: false" scripts/v20/build-retrospective-walk-forward-target-stop.cjs

      - name: Build V20 retrospective point-in-time simulation
        shell: bash
        env:
          V20_NATIVE_FULL_TECH_NETWORK_REFRESH: "false"
          V20_NATIVE_FULL_TECH_STARTA_FALLBACK: "false"
        run: |
          set -euo pipefail
          node scripts/v20/build-retrospective-walk-forward-target-stop.cjs
          test -s data/v20/retrospective-walk-forward-target-stop.json

      - name: Regression and no-look-ahead acceptance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/retrospective-walk-forward-regression.cjs

      - name: Restore synced MAIN APP inputs before persist
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- data/history
          if git cat-file -e HEAD:data/research/v16-v169-target-hit-audit.json 2>/dev/null; then
            git checkout HEAD -- data/research/v16-v169-target-hit-audit.json
          else
            rm -f data/research/v16-v169-target-hit-audit.json
          fi
          git reset -- data/history data/research/v16-v169-target-hit-audit.json 2>/dev/null || true

      - name: Persist diagnostic output only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20/retrospective-walk-forward-target-stop.json
          staged="$(git diff --cached --name-only)"
          test -z "$(printf '%s\n' "$staged" | grep -Ev '^data/v20/retrospective-walk-forward-target-stop\.json$' || true)" || {
            echo "V20 retrospective persistence isolation violation"
            printf '%s\n' "$staged"
            exit 1
          }
          if git diff --cached --quiet; then
            echo "Retrospective diagnostic already current."
            exit 0
          fi
          git commit -m "Refresh V20 retrospective point-in-time diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"

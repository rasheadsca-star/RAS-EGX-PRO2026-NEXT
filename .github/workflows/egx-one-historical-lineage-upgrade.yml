name: EGX ONE Production Historical Lineage Upgrade
on:
  push:
    branches: [egx-one/clean-room-v0]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1
      - name: Require certified lineage for production historical bars
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/market-data-store.js');s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label} anchor not found')
              s=s.replace(old,new,1)

          rep("import { verifyCertifiedUniverseAuthority } from './certified-universe-authority.js';",
              "import { verifyCertifiedUniverseAuthority } from './certified-universe-authority.js';\nimport { createHistoricalObservationLineage,verifyHistoricalObservationLineage,historicalLineageMatchesBar } from './historical-observation-lineage.js';",'import')

          rep("    this.db.function('egx_data_snapshot_finalization_valid',{deterministic:true},(contentHash,dataSnapshotId,marketSession,sourceManifestHash,ingestionMode,rowsJson)=>{try{const rows=JSON.parse(rowsJson);return Array.isArray(rows)&&rows.length>0&&sha256({dataSnapshotId,marketSession,sourceManifestHash,ingestionMode,rows})===contentHash?1:0}catch{return 0}});\n    this.#init();",
              "    this.db.function('egx_data_snapshot_finalization_valid',{deterministic:true},(contentHash,dataSnapshotId,marketSession,sourceManifestHash,ingestionMode,rowsJson)=>{try{const rows=JSON.parse(rowsJson);return Array.isArray(rows)&&rows.length>0&&sha256({dataSnapshotId,marketSession,sourceManifestHash,ingestionMode,rows})===contentHash?1:0}catch{return 0}});\n    this.db.function('egx_historical_lineage_row_valid',{deterministic:true},(payloadJson,certificateHash,dataSnapshotId,ticker,session,sourceId,sourceClass,sourceReceiptHash,barHash)=>{try{const c=JSON.parse(payloadJson),v=verifyHistoricalObservationLineage(c);return v.state==='READY'&&c.certificateHash===certificateHash&&c.dataSnapshotId===dataSnapshotId&&c.ticker===ticker&&c.session===session&&c.sourceId===sourceId&&c.sourceClass===sourceClass&&c.sourceReceipt?.receiptHash===sourceReceiptHash&&c.barHash===barHash?1:0}catch{return 0}});\n    this.db.function('egx_historical_lineage_bar_valid',{deterministic:true},(payloadJson,dataSnapshotId,ticker,session,open,high,low,close,volume)=>{try{return historicalLineageMatchesBar(JSON.parse(payloadJson),{dataSnapshotId,ticker,session,open:Number(open),high:Number(high),low:Number(low),close:Number(close),volume:volume==null?null:Number(volume)})?1:0}catch{return 0}});\n    this.#init();",'udf')

          rep("      CREATE TABLE IF NOT EXISTS certified_reconciliations (reconciliation_manifest_hash TEXT PRIMARY KEY,source_manifest_hash TEXT NOT NULL,ticker TEXT NOT NULL,session TEXT NOT NULL,primary_source_id TEXT NOT NULL,primary_observation_certificate_hash TEXT NOT NULL,payload_json TEXT NOT NULL,created_at TEXT NOT NULL,FOREIGN KEY(source_manifest_hash) REFERENCES source_manifests(source_manifest_hash));\n      CREATE TABLE IF NOT EXISTS normalized_bars",
              "      CREATE TABLE IF NOT EXISTS certified_reconciliations (reconciliation_manifest_hash TEXT PRIMARY KEY,source_manifest_hash TEXT NOT NULL,ticker TEXT NOT NULL,session TEXT NOT NULL,primary_source_id TEXT NOT NULL,primary_observation_certificate_hash TEXT NOT NULL,payload_json TEXT NOT NULL,created_at TEXT NOT NULL,FOREIGN KEY(source_manifest_hash) REFERENCES source_manifests(source_manifest_hash));\n      CREATE TABLE IF NOT EXISTS historical_observation_lineage (certificate_hash TEXT PRIMARY KEY,data_snapshot_id TEXT NOT NULL,ticker TEXT NOT NULL,session TEXT NOT NULL,source_id TEXT NOT NULL,source_class TEXT NOT NULL,source_receipt_hash TEXT NOT NULL,bar_hash TEXT NOT NULL,payload_json TEXT NOT NULL,created_at TEXT NOT NULL,FOREIGN KEY(data_snapshot_id) REFERENCES data_snapshots(data_snapshot_id));\n      CREATE TABLE IF NOT EXISTS normalized_bars",'table')

          rep("      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_delete BEFORE DELETE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;",
              "      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_delete BEFORE DELETE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;\n      CREATE TRIGGER IF NOT EXISTS historical_lineage_no_update BEFORE UPDATE ON historical_observation_lineage BEGIN SELECT RAISE(ABORT,'IMMUTABLE_HISTORICAL_LINEAGE'); END;\n      CREATE TRIGGER IF NOT EXISTS historical_lineage_no_delete BEFORE DELETE ON historical_observation_lineage BEGIN SELECT RAISE(ABORT,'IMMUTABLE_HISTORICAL_LINEAGE'); END;\n      CREATE TRIGGER IF NOT EXISTS historical_lineage_valid_insert BEFORE INSERT ON historical_observation_lineage WHEN egx_historical_lineage_row_valid(NEW.payload_json,NEW.certificate_hash,NEW.data_snapshot_id,NEW.ticker,NEW.session,NEW.source_id,NEW.source_class,NEW.source_receipt_hash,NEW.bar_hash)<>1 BEGIN SELECT RAISE(ABORT,'INVALID_HISTORICAL_LINEAGE_ROW'); END;\n      CREATE TRIGGER IF NOT EXISTS historical_lineage_snapshot_guard BEFORE INSERT ON historical_observation_lineage WHEN NOT EXISTS(SELECT 1 FROM data_snapshots d WHERE d.data_snapshot_id=NEW.data_snapshot_id AND d.ingestion_mode='CERTIFIED_PRODUCTION' AND d.content_hash IS NULL AND NEW.session<d.market_session) BEGIN SELECT RAISE(ABORT,'HISTORICAL_LINEAGE_REQUIRES_OPEN_PRODUCTION_SNAPSHOT'); END;",'lineage triggers')

          rep("      CREATE TRIGGER IF NOT EXISTS normalized_current_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session=(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) AND (NEW.certified_reconciliation_manifest_hash IS NULL OR NEW.primary_observation_certificate_hash IS NULL OR NOT EXISTS(SELECT 1 FROM certified_reconciliations c WHERE c.reconciliation_manifest_hash=NEW.certified_reconciliation_manifest_hash AND c.source_manifest_hash=NEW.source_manifest_hash AND c.ticker=NEW.ticker AND c.session=NEW.session AND c.primary_observation_certificate_hash=NEW.primary_observation_certificate_hash AND egx_certified_reconciliation_bar_valid(c.payload_json,c.reconciliation_manifest_hash,c.source_manifest_hash,c.ticker,c.session,c.primary_source_id,c.primary_observation_certificate_hash,NEW.open,NEW.high,NEW.low,NEW.close,NEW.volume)=1)) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_CERTIFIED_LINEAGE'); END;",
              "      CREATE TRIGGER IF NOT EXISTS normalized_current_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session=(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) AND (NEW.certified_reconciliation_manifest_hash IS NULL OR NEW.primary_observation_certificate_hash IS NULL OR NOT EXISTS(SELECT 1 FROM certified_reconciliations c WHERE c.reconciliation_manifest_hash=NEW.certified_reconciliation_manifest_hash AND c.source_manifest_hash=NEW.source_manifest_hash AND c.ticker=NEW.ticker AND c.session=NEW.session AND c.primary_observation_certificate_hash=NEW.primary_observation_certificate_hash AND egx_certified_reconciliation_bar_valid(c.payload_json,c.reconciliation_manifest_hash,c.source_manifest_hash,c.ticker,c.session,c.primary_source_id,c.primary_observation_certificate_hash,NEW.open,NEW.high,NEW.low,NEW.close,NEW.volume)=1)) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_CERTIFIED_LINEAGE'); END;\n      CREATE TRIGGER IF NOT EXISTS normalized_history_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session<(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) AND NOT EXISTS(SELECT 1 FROM historical_observation_lineage h WHERE h.data_snapshot_id=NEW.data_snapshot_id AND h.ticker=NEW.ticker AND h.session=NEW.session AND egx_historical_lineage_bar_valid(h.payload_json,NEW.data_snapshot_id,NEW.ticker,NEW.session,NEW.open,NEW.high,NEW.low,NEW.close,NEW.volume)=1) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_HISTORY_REQUIRES_LINEAGE'); END;\n      CREATE TRIGGER IF NOT EXISTS normalized_future_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session>(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_FUTURE_BAR_FORBIDDEN'); END;\n      CREATE TRIGGER IF NOT EXISTS production_history_finalize_guard BEFORE UPDATE OF content_hash,finalized_at ON data_snapshots WHEN OLD.ingestion_mode='CERTIFIED_PRODUCTION' AND OLD.content_hash IS NULL AND NEW.content_hash IS NOT NULL AND EXISTS(SELECT 1 FROM normalized_bars n LEFT JOIN historical_observation_lineage h ON h.data_snapshot_id=n.data_snapshot_id AND h.ticker=n.ticker AND h.session=n.session WHERE n.data_snapshot_id=OLD.data_snapshot_id AND n.session<OLD.market_session AND (h.certificate_hash IS NULL OR egx_historical_lineage_bar_valid(h.payload_json,n.data_snapshot_id,n.ticker,n.session,n.open,n.high,n.low,n.close,n.volume)<>1)) BEGIN SELECT RAISE(ABORT,'PRODUCTION_SNAPSHOT_HISTORY_LINEAGE_INVALID'); END;",'production normalized guards')

          rep("      CREATE TRIGGER IF NOT EXISTS session_manifest_production_insert BEFORE INSERT ON session_manifests WHEN NEW.authority_mode='CERTIFIED_PRODUCTION'",
              "      CREATE TRIGGER IF NOT EXISTS session_manifest_production_history_insert BEFORE INSERT ON session_manifests WHEN NEW.authority_mode='CERTIFIED_PRODUCTION' AND EXISTS(SELECT 1 FROM data_snapshots d JOIN normalized_bars n ON n.data_snapshot_id=d.data_snapshot_id LEFT JOIN historical_observation_lineage h ON h.data_snapshot_id=n.data_snapshot_id AND h.ticker=n.ticker AND h.session=n.session WHERE d.content_hash=json_extract(NEW.payload_json,'$.normalizedDataVersion') AND n.session<NEW.market_session AND (h.certificate_hash IS NULL OR egx_historical_lineage_bar_valid(h.payload_json,n.data_snapshot_id,n.ticker,n.session,n.open,n.high,n.low,n.close,n.volume)<>1)) BEGIN SELECT RAISE(ABORT,'SESSION_MANIFEST_PRODUCTION_HISTORY_LINEAGE_INVALID'); END;\n      CREATE TRIGGER IF NOT EXISTS session_manifest_production_future_insert BEFORE INSERT ON session_manifests WHEN NEW.authority_mode='CERTIFIED_PRODUCTION' AND EXISTS(SELECT 1 FROM data_snapshots d JOIN normalized_bars n ON n.data_snapshot_id=d.data_snapshot_id WHERE d.content_hash=json_extract(NEW.payload_json,'$.normalizedDataVersion') AND n.session>NEW.market_session) BEGIN SELECT RAISE(ABORT,'SESSION_MANIFEST_PRODUCTION_FUTURE_BAR_INVALID'); END;\n      CREATE TRIGGER IF NOT EXISTS session_manifest_production_insert BEFORE INSERT ON session_manifests WHEN NEW.authority_mode='CERTIFIED_PRODUCTION'",'session guards')

          old="if(snap.ingestion_mode==='CERTIFIED_PRODUCTION'&&session===snap.market_session)throw new Error('CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_RECONCILIATION');return this.#insertNormalizedBar({dataSnapshotId,ticker,session,open,high,low,close,volume,sourceManifestHash})}"
          new="if(snap.ingestion_mode==='CERTIFIED_PRODUCTION')throw new Error(session===snap.market_session?'CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_RECONCILIATION':'CERTIFIED_PRODUCTION_HISTORICAL_BAR_REQUIRES_LINEAGE');return this.#insertNormalizedBar({dataSnapshotId,ticker,session,open,high,low,close,volume,sourceManifestHash})}"
          rep(old,new,'putNormalizedBar')

          marker="  putCertifiedNormalizedBar({dataSnapshotId,entries,acquisitionPlan,maxCloseConflictPct=1}){"
          method="  putCertifiedHistoricalNormalizedBar({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion}){const snap=this.db.prepare('SELECT market_session,source_manifest_hash,ingestion_mode,created_at,content_hash FROM data_snapshots WHERE data_snapshot_id=?').get(dataSnapshotId);if(!snap)throw new Error('UNKNOWN_DATA_SNAPSHOT');if(snap.content_hash)throw new Error('DATA_SNAPSHOT_ALREADY_FINALIZED');if(snap.ingestion_mode!=='CERTIFIED_PRODUCTION')throw new Error('CERTIFIED_HISTORY_REQUIRES_PRODUCTION_SNAPSHOT');if(!bar?.session||bar.session>=snap.market_session)throw new Error('CERTIFIED_HISTORY_SESSION_INVALID');const certificate=createHistoricalObservationLineage({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion});const v=verifyHistoricalObservationLineage(certificate);if(v.state!=='READY')throw new Error(`CERTIFIED_HISTORY_LINEAGE_INVALID:${v.reasons.join('|')}`);this.db.prepare(`INSERT INTO historical_observation_lineage(certificate_hash,data_snapshot_id,ticker,session,source_id,source_class,source_receipt_hash,bar_hash,payload_json,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)`).run(certificate.certificateHash,dataSnapshotId,certificate.ticker,certificate.session,certificate.sourceId,certificate.sourceClass,certificate.sourceReceipt.receiptHash,certificate.barHash,canonicalize(certificate),snap.created_at);return this.#insertNormalizedBar({dataSnapshotId,ticker:bar.ticker,session:bar.session,open:bar.open,high:bar.high,low:bar.low,close:bar.close,volume:bar.volume??null,sourceManifestHash:snap.source_manifest_hash})}\n\n"
          if marker not in s: raise SystemExit('certified current method marker not found')
          s=s.replace(marker,method+marker,1)
          p.write_text(s)
          PY
      - name: Commit production historical lineage upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/market-data-store.js
          git commit -m 'Require certified source lineage for production history'
          git pull --rebase origin egx-one/clean-room-v0
          git push origin HEAD:egx-one/clean-room-v0

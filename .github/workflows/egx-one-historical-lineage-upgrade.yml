name: EGX ONE Licensed Historical Admission Binding
on:
  push:
    branches: [egx-one/clean-room-v0]
permissions:
  contents: write
jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1
      - name: Bind licensed dataset admission to historical lineage API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/market-data-store.js');s=p.read_text()
          old="  putCertifiedHistoricalNormalizedBar({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion}){const snap=this.db.prepare('SELECT market_session,source_manifest_hash,ingestion_mode,created_at,content_hash FROM data_snapshots WHERE data_snapshot_id=?').get(dataSnapshotId);if(!snap)throw new Error('UNKNOWN_DATA_SNAPSHOT');if(snap.content_hash)throw new Error('DATA_SNAPSHOT_ALREADY_FINALIZED');if(snap.ingestion_mode!=='CERTIFIED_PRODUCTION')throw new Error('CERTIFIED_HISTORY_REQUIRES_PRODUCTION_SNAPSHOT');if(!bar?.session||bar.session>=snap.market_session)throw new Error('CERTIFIED_HISTORY_SESSION_INVALID');const certificate=createHistoricalObservationLineage({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion});const v=verifyHistoricalObservationLineage(certificate);if(v.state!=='READY')throw new Error(`CERTIFIED_HISTORY_LINEAGE_INVALID:${v.reasons.join('|')}`);this.db.prepare(`INSERT INTO historical_observation_lineage(certificate_hash,data_snapshot_id,ticker,session,source_id,source_class,source_receipt_hash,bar_hash,payload_json,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)`).run(certificate.certificateHash,dataSnapshotId,certificate.ticker,certificate.session,certificate.sourceId,certificate.sourceClass,certificate.sourceReceipt.receiptHash,certificate.barHash,canonicalize(certificate),snap.created_at);return this.#insertNormalizedBar({dataSnapshotId,ticker:bar.ticker,session:bar.session,open:bar.open,high:bar.high,low:bar.low,close:bar.close,volume:bar.volume??null,sourceManifestHash:snap.source_manifest_hash})}"
          new="  putCertifiedHistoricalNormalizedBar({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion,licensedDatasetAdmission=null}){const snap=this.db.prepare('SELECT market_session,source_manifest_hash,ingestion_mode,created_at,content_hash FROM data_snapshots WHERE data_snapshot_id=?').get(dataSnapshotId);if(!snap)throw new Error('UNKNOWN_DATA_SNAPSHOT');if(snap.content_hash)throw new Error('DATA_SNAPSHOT_ALREADY_FINALIZED');if(snap.ingestion_mode!=='CERTIFIED_PRODUCTION')throw new Error('CERTIFIED_HISTORY_REQUIRES_PRODUCTION_SNAPSHOT');if(!bar?.session||bar.session>=snap.market_session)throw new Error('CERTIFIED_HISTORY_SESSION_INVALID');const certificate=createHistoricalObservationLineage({dataSnapshotId,bar,receipt,rawPayload,parserId,parserVersion,licensedDatasetAdmission});const v=verifyHistoricalObservationLineage(certificate);if(v.state!=='READY')throw new Error(`CERTIFIED_HISTORY_LINEAGE_INVALID:${v.reasons.join('|')}`);this.db.prepare(`INSERT INTO historical_observation_lineage(certificate_hash,data_snapshot_id,ticker,session,source_id,source_class,source_receipt_hash,bar_hash,payload_json,created_at) VALUES (?,?,?,?,?,?,?,?,?,?)`).run(certificate.certificateHash,dataSnapshotId,certificate.ticker,certificate.session,certificate.sourceId,certificate.sourceClass,certificate.sourceReceipt.receiptHash,certificate.barHash,canonicalize(certificate),snap.created_at);return this.#insertNormalizedBar({dataSnapshotId,ticker:bar.ticker,session:bar.session,open:bar.open,high:bar.high,low:bar.low,close:bar.close,volume:bar.volume??null,sourceManifestHash:snap.source_manifest_hash})}"
          if old not in s: raise SystemExit('historical API anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit binding
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/market-data-store.js
          git commit -m 'Bind licensed dataset admission to historical SSOT API'
          git pull --rebase origin egx-one/clean-room-v0
          git push origin HEAD:egx-one/clean-room-v0

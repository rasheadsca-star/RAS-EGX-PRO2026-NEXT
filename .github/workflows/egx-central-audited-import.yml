name: EGX Central - Audited Branch Import
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'egx-central/**'
      - '.github/workflows/egx-central-audited-import.yml'
permissions:
  contents: read
jobs:
  archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test importer safety
        run: python -m unittest discover -s egx-central -p 'test_*.py' -v
      - name: Fetch and classify historical archives
        run: python egx-central/remote_branch_audit.py --output artifacts/egx-central-audit
      - name: Derive research-only cross-branch consensus
        run: python egx-central/candidate_consensus.py --db artifacts/egx-central-audit/branch_evidence.sqlite --output artifacts/egx-central-audit
      - name: Verify provenance promotion gate
        run: python egx-central/promotion_gate.py --db artifacts/egx-central-audit/branch_evidence.sqlite --output artifacts/egx-central-audit
      - name: Review latest source evidence and market session
        run: python egx-central/main_source_quality.py --output artifacts/egx-central-audit
      - name: Validate corporate-action snapshot availability
        run: python egx-central/check_corporate_actions.py --actions egx-central/data/corporate_actions.csv --output artifacts/egx-central-audit/corporate_action_source_status.json
      - name: Cross-check source splices against available corporate action records
        run: python egx-central/corporate_action_review.py --quality artifacts/egx-central-audit/main_source_quality.json --output artifacts/egx-central-audit --actions egx-central/data/corporate_actions.csv
      - name: Prepare hypothetical adjustment factors without modifying prices
        run: python egx-central/adjustment_proposals.py --db artifacts/egx-central-audit/branch_evidence.sqlite --actions egx-central/data/corporate_actions.csv --output artifacts/egx-central-audit
      - name: Generate research-only adjusted-close series (never a trading input)
        run: python egx-central/research_adjusted_close.py --db artifacts/egx-central-audit/branch_evidence.sqlite --proposals artifacts/egx-central-audit/corporate_action_adjustment_proposals.csv --output artifacts/egx-central-audit
      - name: Detect possible double adjustment in provider prices
        run: python egx-central/provider_adjustment_audit.py --output artifacts/egx-central-audit
      - name: Classify raw and provider-adjusted bars for research only
        run: python egx-central/research_price_eligibility.py --output artifacts/egx-central-audit
      - name: Report EGX research coverage and last observed session
        run: python egx-central/market_freshness.py --output artifacts/egx-central-audit
      - name: Assert warehouse integrity and no trading promotion
        run: python egx-central/verify_warehouse.py --output artifacts/egx-central-audit
      - name: Upload isolated evidence and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egx-central-remote-branch-audit
          path: artifacts/egx-central-audit/
          if-no-files-found: warn
          retention-days: 14

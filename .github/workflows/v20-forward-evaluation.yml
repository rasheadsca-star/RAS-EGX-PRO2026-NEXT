name: V20 Forward Outcome Resolver

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-forward-evaluation.yml"
      - "scripts/v20/forward-evaluation-core.cjs"
      - "scripts/v20/resolve-forward-evaluation.cjs"
      - "scripts/v20/forward-evaluation-unit.cjs"
      - "scripts/v20/forward-evaluation-regression.cjs"
      - "scripts/v20/apply-forward-evaluation-integration.cjs"
      - "data/v20/signal-archive/**"
      - "data/v20/forward-evaluation.json"
      - "data/v20/current.json"
      - "data/v20/current-market-snapshot.json"
      - "data/market.json"
      - "data/symbol-map.json"

permissions:
  contents: write

concurrency:
  group: egx-v20-forward-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-forward-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout V20 integration branch
        uses: actions/checkout@v6
        with: {fetch-depth: 1}

      - name: Enforce V20 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v20-integrated-decision-platform"
          git fetch --no-tags --depth=1 origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt
          changed="$(git diff --name-only origin/v19-egx-chat-gpt HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\.github/workflows/v20-integrated-decision-platform\.yml$|\.github/workflows/v20-market-regime\.yml$|\.github/workflows/v20-forward-evaluation\.yml$)' || true)"
          test -z "$violations" || { echo "V20 isolation violation:"; echo "$violations"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}

      - name: Apply forward evaluation integration contract
        run: node scripts/v20/apply-forward-evaluation-integration.cjs

      - name: Static validation
        run: |
          node --check scripts/v20/forward-evaluation-core.cjs
          node --check scripts/v20/resolve-forward-evaluation.cjs
          node --check scripts/v20/forward-evaluation-unit.cjs
          node --check scripts/v20/forward-evaluation-regression.cjs
          node --check scripts/v20/apply-forward-evaluation-integration.cjs
          node --check scripts/v20/build-performance-evidence-registry.cjs
          node --check scripts/v20/performance-evidence-regression.cjs
          node -e "JSON.parse(require('fs').readFileSync('data/v20/policy-registry.json','utf8'))"

      - name: Run forward evaluation unit tests
        run: node scripts/v20/forward-evaluation-unit.cjs

      - name: Resolve trusted forward evaluation horizons
        env:
          V20_FORWARD_NETWORK_REFRESH: "true"
          V20_FORWARD_CONCURRENCY: "6"
          V20_FORWARD_FETCH_RANGE: "3mo"
          V20_FORWARD_CALENDAR_CONSENSUS_PCT: "50"
          V20_FORWARD_CALENDAR_MIN_VOTES: "5"
          V20_FORWARD_TRANSACTION_COST_PCT: "0.6"
        run: node scripts/v20/resolve-forward-evaluation.cjs

      - name: Run forward evaluation regression
        run: node scripts/v20/forward-evaluation-regression.cjs

      - name: Rebuild separated performance evidence registry
        run: node scripts/v20/build-performance-evidence-registry.cjs

      - name: Run performance evidence regression
        run: node scripts/v20/performance-evidence-regression.cjs

      - name: Acceptance guard
        run: |
          node - <<'NODE'
          const forward=require('./data/v20/forward-evaluation.json');
          const reg=require('./data/v20/forward-evaluation-regression.json');
          const status=require('./data/v20/forward-resolution-status.json');
          const policy=require('./data/v20/policy-registry.json');
          const current=require('./data/v20/current.json');
          const perf=require('./data/v20/performance-evidence-registry.json');
          const perfReg=require('./data/v20/performance-evidence-regression.json');
          if(reg.ok!==true||perfReg.ok!==true) process.exit(1);
          if(policy.forwardEvaluation?.immutableArchiveMutationAllowed!==false) process.exit(1);
          if(policy.forwardEvaluation?.appliedPortfolioAndResearchSeparated!==true) process.exit(1);
          if(policy.forwardEvaluation?.legacyPortfolioReturnFieldsMeaning!=='APPLIED_PORTFOLIO_ONLY') process.exit(1);
          if(policy.forwardEvaluation?.pendingReturnMustRemainNull!==true) process.exit(1);
          if(policy.forwardEvaluation?.calendarAssumedWeekdaysAllowed!==false) process.exit(1);
          if(policy.forwardEvaluation?.delayedEntryAfterFirstSessionAllowed!==false) process.exit(1);
          if(policy.forwardEvaluation?.sameSessionTargetStopAmbiguity!=='TREAT_AS_STOP') process.exit(1);
          if(policy.forwardEvaluation?.futureRowsAllowed!==false||policy.forwardEvaluation?.syntheticOhlcAllowed!==false) process.exit(1);
          if(policy.forwardEvaluation?.researchOutcomeMayBecomeProductionPerformance!==false) process.exit(1);
          if(policy.forwardEvaluation?.productionExecutionGateInfluence!==false||policy.forwardEvaluation?.automaticPromotionInfluence!==false) process.exit(1);
          if(forward.schemaVersion!=='20.0.0-forward-evaluation-2'||forward.asOfSessionDate!==current.sessionDate) process.exit(1);
          if(status.evaluationCount!==(forward.evaluations||[]).length) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.status==='PENDING'&&(e.portfolioReturnGrossPct!==null||e.portfolioReturnNetPct!==null))) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.status==='PENDING'&&(e.researchEvaluation?.equalWeightIssuedNetReturnPct!==null||e.appliedPortfolio?.netReturnPct!==null))) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.status==='RESOLVED'&&e.researchEvaluation?.appliedToProduction!==false)) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.status==='RESOLVED'&&e.portfolioReturnNetPct!==e.appliedPortfolio?.netReturnPct)) process.exit(1);
          if((forward.evaluations||[]).some(e=>e.sessionDate===current.sessionDate&&e.status!=='PENDING')) process.exit(1);
          if(perf.policy?.historicalAndForwardEvidenceMustRemainSeparate!==true||perf.policy?.pendingForwardReturnMustRemainNull!==true) process.exit(1);
          NODE

      - name: Persist Phase 9 forward evidence and integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/v20/policy-registry.json \
            data/v20/forward-evaluation.json \
            data/v20/forward-evaluation-regression.json \
            data/v20/forward-resolution-status.json \
            data/v20/performance-evidence-registry.json \
            data/v20/performance-evidence-regression.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V20 forward outcome evidence"
          git reset --hard HEAD
          git fetch origin develop/v20-integrated-decision-platform
          git rebase origin/develop/v20-integrated-decision-platform
          git push origin HEAD:develop/v20-integrated-decision-platform

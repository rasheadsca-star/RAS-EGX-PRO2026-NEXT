name: GANN Unified Funnel Regression

# Disabled legacy automatic trigger; available by manual dispatch only.\non:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  funnel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check gann-fusion-x/engine/planner.js
          node --check gann-fusion-x/scripts/build-snapshot.cjs
          node --check gann-fusion-x/scripts/forward-shadow-v2.cjs
          node --check gann-fusion-x/scripts/test-unified-funnel.cjs
          node --check gann-fusion-x/app/session-dashboard.js
      - name: Build unified snapshot
        run: node gann-fusion-x/scripts/build-snapshot.cjs
      - name: Run forward shadow with same funnel
        run: node gann-fusion-x/scripts/forward-shadow-v2.cjs
      - name: Verify Forward equals Snapshot funnel
        run: node gann-fusion-x/scripts/test-unified-funnel.cjs

name: decision-room-ci
on:
  pull_request:
    paths: ['decision_room/**','.github/workflows/decision-room-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas numpy
      - run: python3 -I decision_room/tests/test_engine.py

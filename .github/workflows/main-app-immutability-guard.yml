name: MAIN APP — Methodology & Governance Guard

on:
  workflow_dispatch:
  push:
    paths:
      - "preview-v16/app/**"
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-two-stage-predictor.py"
      - "scripts/research/v16-probabilistic-model-impact.py"
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/stable/v16-publish-v169-basket.cjs"
      - "scripts/stable/v16-session-data-fingerprint.cjs"
      - "scripts/stable/v16-v169-live-evaluation.py"
      - "scripts/stable/v16-recommendation-freshness-guard.cjs"
      - "scripts/stable/v16-main-app-governance.cjs"
      - "scripts/stable/v16-main-app-consensus.cjs"
      - "data/stable/v16-v169-release-lock.json"
      - "data/stable/main-app-lock.json"
      - ".github/workflows/v16-v169-basket-engine.yml"
      - ".github/workflows/main-app-immutability-guard.yml"
      - ".github/workflows/main-app-governance-refresh.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: main-app-methodology-governance-guard
  cancel-in-progress: false

env:
  MAIN_APP_METHOD_BASE_COMMIT: 1e5f3ab7e74f88982cf241fd5e1fcc1baced8f48
  MAIN_APP_LOCK_COMMIT: c5d6e49854e3a96d4b5bdfc6eaf726049878fa91
  MAIN_APP_OPERATIONAL_STACK: CANONICAL_SNAPSHOT_LEDGER_ALL_ENGINE_MATRIX_STOCK_ANALYZER_TECH_CHART

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore methodology-only protected source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${MAIN_APP_METHOD_BASE_COMMIT}^{commit}"
          git cat-file -e "${MAIN_APP_LOCK_COMMIT}^{commit}"
          PROTECTED_METHOD=(
            scripts/research/v16-v169-basket-engine.py
            scripts/research/v16-two-stage-predictor.py
            scripts/research/v16-probabilistic-model-impact.py
            scripts/research/v16-v169-target-hit-audit.py
            scripts/stable/v16-session-data-fingerprint.cjs
            scripts/stable/v16-v169-live-evaluation.py
            data/stable/v16-v169-release-lock.json
            .github/workflows/v16-v169-basket-engine.yml
          )
          drift=0
          if ! git diff --quiet "$MAIN_APP_METHOD_BASE_COMMIT" -- "${PROTECTED_METHOD[@]}"; then
            git checkout "$MAIN_APP_METHOD_BASE_COMMIT" -- "${PROTECTED_METHOD[@]}"
            drift=1
          fi
          if ! git diff --quiet "$MAIN_APP_LOCK_COMMIT" -- data/stable/main-app-lock.json; then
            git checkout "$MAIN_APP_LOCK_COMMIT" -- data/stable/main-app-lock.json
            drift=1
          fi
          if [ "$drift" -eq 0 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${PROTECTED_METHOD[@]}" data/stable/main-app-lock.json
          git commit -m "Auto-restore MAIN APP methodology only"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 8))
          done

      - name: Verify MAIN APP operational stack
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-publish-v169-basket.cjs
          node --check scripts/stable/v16-recommendation-freshness-guard.cjs
          node --check scripts/stable/v16-main-app-governance.cjs
          node --check scripts/stable/v16-main-app-consensus.cjs
          node --check preview-v16/app/decision-source.js
          node --check preview-v16/app/main-app-governance-overlay.js
          node --check preview-v16/app/main-app-consensus-overlay.js
          node --check preview-v16/app/stock-analyzer.js
          node --check preview-v16/app/stock-analyzer-chart.js
          node - <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('data/stable/main-app-lock.json','utf8'));
          if(lock.appName!=='MAIN APP'||lock.engine!=='V16_9_EQUAL_WEIGHT_BASKET')throw new Error('MAIN APP identity/method lock mismatch');
          const publisher=fs.readFileSync('scripts/stable/v16-publish-v169-basket.cjs','utf8');
          const freshness=fs.readFileSync('scripts/stable/v16-recommendation-freshness-guard.cjs','utf8');
          const governance=fs.readFileSync('scripts/stable/v16-main-app-governance.cjs','utf8');
          const consensus=fs.readFileSync('scripts/stable/v16-main-app-consensus.cjs','utf8');
          const router=fs.readFileSync('preview-v16/app/decision-source.js','utf8');
          const launcher=fs.readFileSync('preview-v16/app/v169-p2.html','utf8');
          const consensusUi=fs.readFileSync('preview-v16/app/main-app-consensus-overlay.js','utf8');
          const analyzer=fs.readFileSync('preview-v16/app/stock-analyzer.js','utf8');
          const chart=fs.readFileSync('preview-v16/app/stock-analyzer-chart.js','utf8');
          const checks={
            engineLocked:publisher.includes('V16_9_EQUAL_WEIGHT_BASKET'),
            scanPostProcessing:freshness.includes('buildMainAppGovernance')&&freshness.includes('v16-main-app-consensus.cjs'),
            allocationGuard:governance.includes('MAX_TOTAL_ALLOCATION_PCT = 50'),
            failClosed:governance.includes('failClosed: true'),
            immutableLedger:governance.includes('immutableLedger: true'),
            canonicalSnapshot:router.includes('v16-main-app-current.json'),
            allEngineMatrix:consensus.includes('V17_VALIDATION')&&consensus.includes('V19_CHALLENGER')&&consensus.includes('V20_NATIVE')&&consensus.includes('QUANT_EDGE'),
            agreementCount:consensus.includes('agreementCount')&&consensusUi.includes('توافق المحركات'),
            periodicComparison:consensusUi.includes('setInterval(refreshData,60000)'),
            stockAnalyzerLoaded:launcher.includes('stock-analyzer.js'),
            chartLoaded:launcher.includes('stock-analyzer-chart.js'),
            analyzerTechnical:analyzer.includes('technicalAnalysis')&&analyzer.includes('nearestLevels'),
            analyzerPortfolio:analyzer.includes('portfolioDecision')&&analyzer.includes('زيادة تدريجية مشروطة')&&analyzer.includes('تخفيف')&&analyzer.includes('بيع'),
            chartCandles:chart.includes('tc-wick')&&chart.includes('tc-up')&&chart.includes('tc-down'),
            chartEMA:chart.includes('EMA20')&&chart.includes('EMA50'),
            chartSupportResistance:chart.includes('supports')&&chart.includes('resistances')&&chart.includes('tc-sr-layer'),
            chartFibonacci:chart.includes('38.2%')&&chart.includes('61.8%')&&chart.includes('161.8%'),
            chartTargetsStop:chart.includes('Targets')&&chart.includes('وقف فني'),
            chartVolumeRSI:chart.includes('Volume')&&chart.includes('RSI(14)'),
            chartTooltip:chart.includes('tcTooltip')&&chart.includes('OHLCV')===false&&chart.includes('O ${fmt(r.open'),
            chartRanges:chart.includes('30 جلسة')&&chart.includes('60 جلسة')&&chart.includes('100 جلسة'),
          };
          console.log(checks);
          for(const [k,v] of Object.entries(checks))if(!v)throw new Error(`MAIN APP stack check failed: ${k}`);
          NODE
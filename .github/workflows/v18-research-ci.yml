name: V18 Research CI
on:
  pull_request:
    branches: [main]
    paths: ['scripts/v18/**','tests/v18/**','config/v18-*','docs/v18/**','.github/workflows/v18-research-ci.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s tests/v18 -p 'test_*.py'
      - run: python scripts/v18/run.py
      - run: |
          python - <<'PY'
          import json
          x=json.load(open('data/v18/current.json'))
          assert x['mode']=='RESEARCH_SHADOW_ONLY'
          assert all(not r['productionAuthority'] and not r['automaticOrders'] for r in x['recommendations'])
          assert x['artifactHash']
          PY

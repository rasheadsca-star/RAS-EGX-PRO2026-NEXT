name: EGX V16 Two-Stage Production

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-two-stage-recommendations.py"
      - "scripts/stable/v16-publish-two-stage-decision.cjs"
      - ".github/workflows/v16-two-stage-production.yml"
  schedule:
    - cron: "35 12 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v16-two-stage-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate engines
        run: |
          python -m py_compile scripts/research/v16-two-stage-recommendations.py
          node --check scripts/stable/v16-publish-two-stage-decision.cjs

      - name: Run two-stage engine
        run: python scripts/research/v16-two-stage-recommendations.py

      - name: Publish application decision
        run: node scripts/stable/v16-publish-two-stage-decision.cjs

      - name: Commit production results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-two-stage-recommendations.json data/stable/v15-practical-decision.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16 two-stage recommendations to app"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

name: EGX V4 Git-integrated Production Sync Verification
# Vercel's connected GitHub integration deploys main. This job ONLY audits published bytes;
# do not use the existing unauthorized VERCEL_TOKEN (repeated HTTP 403).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/egx-v4-production-publish.yml'
      - 'scripts/paper-v4/verify-production-sync.cjs'
      - 'paper-v4/decision.html'
      - 'paper-v4/decision-dashboard.js'
  schedule:
    - cron: '45 18 * * 0-4'   # postclose audit Sun-Thu 20:45 Cairo, independent of bot pushes
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: egx-v4-production-sync-audit
  cancel-in-progress: false
jobs:
  verify-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and market-rule invariants
        run: |
          node --check paper-v4/decision-dashboard.js
          node --check scripts/paper-v4/verify-production-sync.cjs
          node --test tests/paper-v4/research-contract.test.cjs
      - name: Await Git integration and compare SHA256 of live HTML JS JSON
        id: verify
        continue-on-error: true
        env:
          EGX_VERIFY_ATTEMPTS: '20'
          EGX_VERIFY_INTERVAL_SECS: '20'
        run: node scripts/paper-v4/verify-production-sync.cjs
      - name: Preserve exact publish-evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egx-v4-prod-sync-${{ github.run_id }}
          path: paper-v4/production-sync-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail and report unsynchronized Production
        if: steps.verify.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Vercel Production failed to serve verified main UI/data; check Vercel Git Integration and deploy settings."
          gh issue comment 204 --body "Automated V4 production SHA256 check FAILED in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Vercel Git integration deployment not yet in sync. Existing direct-deploy token returns HTTP 403, so no unsafe direct deployment was attempted." || true
          exit 1

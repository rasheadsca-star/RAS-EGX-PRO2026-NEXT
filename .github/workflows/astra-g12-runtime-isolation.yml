name: Astra G12 Runtime Isolation

on:
  workflow_dispatch:
  push:
    paths:
      - 'astra/certification/legacy-isolation.cjs'
      - 'docs/astra/G12_*.json'
      - 'tests/astra/legacy-isolation-skeleton.test.cjs'
      - 'v18-live/**'
      - 'astra/runtime/v18/**'
      - 'astra/certification/g12-r01-parity.cjs'
      - 'tests/astra/g12-r01-v18-local.test.cjs'
      - 'tests/astra/g12-r01-v18-cutover.test.cjs'
      - 'tests/astra/g12-r02-blocked-host.test.cjs'
      - 'astra/runtime/bridges/**'
      - 'data/archive/v19/target-stop-audit-v6.json'
      - 'tests/astra/g12-r03-v19-local.test.cjs'
      - 'tests/astra/g12-r03-v19-cutover.test.cjs'
      - 'tests/astra/g12-r04-v20-local.test.cjs'
      - 'tests/astra/g12-r04-v20-cutover.test.cjs'
      - 'tests/astra/g12-r05-quant-edge-archive.test.cjs'
      - 'tests/astra/g12-r05-quant-edge-cutover.test.cjs'
      - 'tests/astra/g12-r06-sepa-local.test.cjs'
      - 'tests/astra/g12-r06-sepa-cutover.test.cjs'
      - 'tests/astra/g12-r07-tfe-local.test.cjs'
      - 'tests/astra/g12-r07-tfe-cutover.test.cjs'
      - 'scripts/stable/v16-main-app-consensus.cjs'
      - 'scripts/stable/v16-main-app-v19v6-consensus-enricher.cjs'
      - 'scripts/stable/v16-main-app-independent-consensus-audit.cjs'
      - 'gann-fusion-x/scripts/sync-sepa.cjs'
      - 'deploy/rc2-safe-shell/**'
      - '.github/workflows/static.yml'
      - '.github/workflows/astra-g12-runtime-isolation.yml'

permissions:
  contents: read

jobs:
  isolation:
    if: github.ref == 'refs/heads/astra/g11-guard37-recovery-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve G01-G11 boundary
        run: |
          node <<'NODE'
          const g=require('./04_ACCEPTANCE_GATES.json').gates;
          const m=new Map(g.map(x=>[x.id,x.status]));
          for(let n=1;n<=11;n++){const id='G'+String(n).padStart(2,'0');if(m.get(id)!=='GREEN')throw Error(id+' not GREEN')}
          if(m.get('G12')!=='PENDING')throw Error('G12 baseline workflow expects PENDING until final certification');
          NODE
      - name: G12 isolation tests
        run: node --test tests/astra/legacy-isolation-skeleton.test.cjs
      - name: R01 replacement parity candidate
        run: |
          node --test tests/astra/g12-r01-v18-local.test.cjs
          node astra/certification/g12-r01-parity.cjs
      - name: R01 post-cut isolation invariant
        run: node --test tests/astra/g12-r01-v18-cutover.test.cjs
      - name: R02 blocked-host replacement parity
        run: node --test tests/astra/g12-r02-blocked-host.test.cjs
      - name: R03 V19 internal replacement parity
        run: node --test tests/astra/g12-r03-v19-local.test.cjs
      - name: R03 V19 post-cut isolation invariant
        run: node --test tests/astra/g12-r03-v19-cutover.test.cjs
      - name: R04 V20 internal replacement parity
        run: node --test tests/astra/g12-r04-v20-local.test.cjs
      - name: R04 V20 post-cut isolation invariant
        run: node --test tests/astra/g12-r04-v20-cutover.test.cjs
      - name: R05 QUANT_EDGE archive-only integrity
        run: node --test tests/astra/g12-r05-quant-edge-archive.test.cjs
      - name: R05 QUANT_EDGE post-cut isolation invariant
        run: node --test tests/astra/g12-r05-quant-edge-cutover.test.cjs
      - name: R06 SEPA internal replacement parity
        run: node --test tests/astra/g12-r06-sepa-local.test.cjs
      - name: R06 SEPA post-cut isolation invariant
        run: node --test tests/astra/g12-r06-sepa-cutover.test.cjs
      - name: R07 TFE internal replacement parity
        run: node --test tests/astra/g12-r07-tfe-local.test.cjs
      - name: R07 TFE post-cut isolation invariant
        run: |
          node --test tests/astra/g12-r07-tfe-cutover.test.cjs
          (cd deploy/rc2-safe-shell && npm test)
      - name: Full declared legacy scan
        shell: bash
        run: |
          set +e
          node astra/certification/legacy-isolation.cjs . --full > /tmp/g12-scan.json
          RC=$?
          set -e
          cat /tmp/g12-scan.json
          node -e "const x=require('/tmp/g12-scan.json'); if(x.runtimeLegacyDependencyCount<0||x.runtimeLegacyDependencyCount>8) process.exit(1)"
          echo "G12_SCAN_EXIT=$RC"

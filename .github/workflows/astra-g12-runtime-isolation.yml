name: Astra G12 Runtime Isolation

on:
  workflow_dispatch:
  push:
    paths:
      - 'astra/certification/legacy-isolation.cjs'
      - 'astra/certification/g12-certify.cjs'
      - 'tests/astra/g12-final-certification.test.cjs'
      - 'tests/astra/g12-g10-persisted-regression.test.cjs'
      - 'docs/astra/G12_*.json'
      - 'tests/astra/legacy-isolation-skeleton.test.cjs'
      - 'v18-live/**'
      - 'astra/runtime/v18/**'
      - 'astra/certification/g12-r01-parity.cjs'
      - 'tests/astra/g12-r01-v18-local.test.cjs'
      - 'tests/astra/g12-r01-v18-cutover.test.cjs'
      - 'tests/astra/g12-r02-blocked-host.test.cjs'
      - 'astra/runtime/bridges/**'
      - 'astra/vendor/sepa-x/**'
      - 'tests/astra/g12-r08-sepa-vendor.test.cjs'
      - 'tests/astra/g12-r08-sepa-cutover.test.cjs'
      - 'data/archive/v19/target-stop-audit-v6.json'
      - 'tests/astra/g12-r03-v19-local.test.cjs'
      - 'tests/astra/g12-r03-v19-cutover.test.cjs'
      - 'tests/astra/g12-r04-v20-local.test.cjs'
      - 'tests/astra/g12-r04-v20-cutover.test.cjs'
      - 'tests/astra/g12-r05-quant-edge-archive.test.cjs'
      - 'tests/astra/g12-r05-quant-edge-cutover.test.cjs'
      - 'tests/astra/g12-r06-sepa-local.test.cjs'
      - 'tests/astra/g12-r06-sepa-cutover.test.cjs'
      - 'tests/astra/g12-r07-tfe-local.test.cjs'
      - 'tests/astra/g12-r07-tfe-cutover.test.cjs'
      - 'scripts/stable/v16-main-app-consensus.cjs'
      - 'scripts/stable/v16-main-app-v19v6-consensus-enricher.cjs'
      - 'scripts/stable/v16-main-app-independent-consensus-audit.cjs'
      - 'gann-fusion-x/scripts/sync-sepa.cjs'
      - 'deploy/rc2-safe-shell/**'
      - '.github/workflows/static.yml'
      - '.github/workflows/astra-g12-runtime-isolation.yml'

permissions:
  contents: write

jobs:
  isolation:
    if: github.ref == 'refs/heads/astra/g11-guard37-recovery-20260916' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip g12]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve G01-G11 boundary
        run: |
          node <<'NODE'
          const g=require('./04_ACCEPTANCE_GATES.json').gates;
          const m=new Map(g.map(x=>[x.id,x.status]));
          for(let n=1;n<=11;n++){const id='G'+String(n).padStart(2,'0');if(m.get(id)!=='GREEN')throw Error(id+' not GREEN')}
          if(!['PENDING','GREEN'].includes(m.get('G12')))throw Error('G12 must be PENDING or GREEN during certification');
          NODE
      - name: G12 isolation tests
        run: node --test tests/astra/legacy-isolation-skeleton.test.cjs
      - name: R01 replacement parity candidate
        run: |
          node --test tests/astra/g12-r01-v18-local.test.cjs
          node astra/certification/g12-r01-parity.cjs
      - name: R01 post-cut isolation invariant
        run: node --test tests/astra/g12-r01-v18-cutover.test.cjs
      - name: R02 blocked-host replacement parity
        run: node --test tests/astra/g12-r02-blocked-host.test.cjs
      - name: R03 V19 internal replacement parity
        run: node --test tests/astra/g12-r03-v19-local.test.cjs
      - name: R03 V19 post-cut isolation invariant
        run: node --test tests/astra/g12-r03-v19-cutover.test.cjs
      - name: R04 V20 internal replacement parity
        run: node --test tests/astra/g12-r04-v20-local.test.cjs
      - name: R04 V20 post-cut isolation invariant
        run: node --test tests/astra/g12-r04-v20-cutover.test.cjs
      - name: R05 QUANT_EDGE archive-only integrity
        run: node --test tests/astra/g12-r05-quant-edge-archive.test.cjs
      - name: R05 QUANT_EDGE post-cut isolation invariant
        run: node --test tests/astra/g12-r05-quant-edge-cutover.test.cjs
      - name: R06 SEPA internal replacement parity
        run: node --test tests/astra/g12-r06-sepa-local.test.cjs
      - name: R06 SEPA post-cut isolation invariant
        run: node --test tests/astra/g12-r06-sepa-cutover.test.cjs
      - name: R07 TFE internal replacement parity
        run: node --test tests/astra/g12-r07-tfe-local.test.cjs
      - name: R07 TFE post-cut isolation invariant
        run: |
          node --test tests/astra/g12-r07-tfe-cutover.test.cjs
          (cd deploy/rc2-safe-shell && npm test)
      - name: R08 vendored SEPA source parity
        run: |
          node --test tests/astra/g12-r08-sepa-vendor.test.cjs
          node --test astra/vendor/sepa-x/test/engine.test.js astra/vendor/sepa-x/test/features.test.js astra/vendor/sepa-x/test/golden.test.js
          rm -rf /tmp/sepax-g12
          node astra/vendor/sepa-x/scripts/build-github-pages.mjs /tmp/sepax-g12
          test -f /tmp/sepax-g12/index.html
          test -f /tmp/sepax-g12/scan/index.html
          test -f /tmp/sepax-g12/pages-manifest.json
          node -e "const m=require('/tmp/sepax-g12/pages-manifest.json'); if(!m.symbols||m.symbols<1) process.exit(1); console.log('R08_LOCAL_SEPA_BUILD_PASS',m.symbols)"
      - name: R08 post-cut isolation invariant
        run: |
          node --test tests/astra/g12-r08-sepa-cutover.test.cjs
          rm -rf /tmp/sepax-g12-cut
          node astra/vendor/sepa-x/scripts/build-github-pages.mjs /tmp/sepax-g12-cut
          test -f /tmp/sepax-g12-cut/pages-manifest.json
          node -e "const m=require('/tmp/sepax-g12-cut/pages-manifest.json'); if(!m.symbols||m.symbols<1) process.exit(1); console.log('R08_POST_CUT_LOCAL_BUILD_PASS',m.symbols)"
      - name: Full declared legacy scan
        shell: bash
        run: |
          set -euo pipefail
          node astra/certification/legacy-isolation.cjs . --full | tee /tmp/g12-scan.json
          node -e "const x=require('/tmp/g12-scan.json'); if(x.runtimeLegacyDependencyCount!==0||!x.clean||x.matches.length!==0) process.exit(1); console.log('G12_STRICT_ZERO_SCAN_PASS')"
      - name: G01-G11 non-mutating regression suite
        shell: bash
        run: |
          set -o pipefail
          node --test tests/astra/g06-*.test.cjs tests/astra/g07-*.test.cjs tests/astra/g08-*.test.cjs tests/astra/g09-*.test.cjs tests/astra/g11-*.test.cjs tests/astra/g12-g10-persisted-regression.test.cjs | tee /tmp/g12-regression.tap
          N=$(awk '/^# tests /{n=$3} END{print n}' /tmp/g12-regression.tap)
          P=$(awk '/^# pass /{n=$3} END{print n}' /tmp/g12-regression.tap)
          F=$(awk '/^# fail /{n=$3} END{print n}' /tmp/g12-regression.tap)
          test "$N" -gt 0
          test "$P" = "$N"
          test "$F" = 0
          echo "G12_REGRESSION_TESTS=$N" >> "$GITHUB_ENV"
          echo "G12_REGRESSION_PASS=$P" >> "$GITHUB_ENV"
          echo "G12_REGRESSION_FAIL=$F" >> "$GITHUB_ENV"
      - name: G12 final pre-certification invariants
        run: node --test tests/astra/g12-final-certification.test.cjs
      - name: Finalize G12 certification evidence
        env:
          G12_SOURCE_HEAD: ${{ github.sha }}
          G12_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node astra/certification/g12-certify.cjs
      - name: Persist G12 certification on recovery branch only
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "Branch head moved: expected $GITHUB_SHA, found $REMOTE_HEAD" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             04_ACCEPTANCE_GATES.json             05_WORK_STATE.json             docs/astra/WORK_STATE.json             docs/astra/LEGACY_REMOVAL_PLAN.json             docs/astra/G12_CERTIFICATION.json             docs/astra/G12_REGRESSION_EVIDENCE.json
          if ! git diff --cached --quiet; then
            git commit -m 'cert(g12): close runtime legacy isolation [skip g12]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

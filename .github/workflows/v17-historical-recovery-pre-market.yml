name: V17 Historical Recovery Pre-Market Monitor

on:
  workflow_dispatch:
  schedule:
    # Dual UTC triggers cover Cairo standard/daylight time; the script gates by Africa/Cairo.
    - cron: "15 5,6 * * 0-4"

permissions:
  contents: read

concurrency:
  group: v17-historical-recovery-pre-market
  cancel-in-progress: true

jobs:
  pre-market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Cairo-aware execution gate
        id: gate
        shell: bash
        run: |
          node scripts/v17/historical-recovery/intelligence/monitor.cjs --mode PRE_MARKET --execute-if-window
          ELIGIBLE="$(node -e "const {shouldRunScheduledMode}=require('./scripts/v17/historical-recovery/intelligence/exchange-calendar.cjs');process.stdout.write(String(shouldRunScheduledMode('PRE_MARKET')))" )"
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
      - name: Validate verified inputs and last public state
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/v17/historical-recovery/long-history/validate-compact.cjs
          node scripts/v17/historical-recovery/fundamentals/validate.cjs
          node scripts/v17/historical-recovery/news/validate.cjs
          node scripts/v17/historical-recovery/intelligence/validate.cjs
          node scripts/v17/historical-recovery/intelligence/validate-history.cjs
      - name: Frozen-path gate
        if: steps.gate.outputs.eligible == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mapfile -t CHANGED < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          node scripts/v17/frozen-path-check.cjs --allow-empty "${CHANGED[@]}"

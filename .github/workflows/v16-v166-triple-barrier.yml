name: EGX V16.6 Triple-Barrier Gate

# Prior experimental engine frozen: manual execution only.\non:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: egx-v16-v166-triple-barrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate engines
        run: |
          python -m py_compile scripts/research/v16-v166-triple-barrier.py
          python -m py_compile scripts/research/v16-two-stage-recommendations.py
          node --check scripts/stable/v16-publish-v166-gate.cjs

      - name: Run V16.6 gate
        run: python scripts/research/v16-v166-triple-barrier.py

      - name: Publish gated application decision
        if: github.event_name != 'pull_request'
        run: node scripts/stable/v16-publish-v166-gate.cjs

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v166-triple-barrier-report
          path: data/research/v16-v166-triple-barrier.json

      - name: Commit report and gated decision on main only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-v166-triple-barrier.json data/stable/v15-practical-decision.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.6 gated decision to app"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

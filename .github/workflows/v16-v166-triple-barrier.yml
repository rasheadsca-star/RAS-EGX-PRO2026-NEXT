name: EGX V16.6 Triple-Barrier Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v16-v166-triple-barrier.py"
      - ".github/workflows/v16-v166-triple-barrier.yml"
  push:
    paths:
      - "scripts/research/v16-v166-triple-barrier.py"
      - ".github/workflows/v16-v166-triple-barrier.yml"
  schedule:
    - cron: "45 12 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v16-v166-triple-barrier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate engine
        run: python -m py_compile scripts/research/v16-v166-triple-barrier.py

      - name: Run V16.6 gate
        run: python scripts/research/v16-v166-triple-barrier.py

      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v166-triple-barrier-report
          path: data/research/v16-v166-triple-barrier.json

      - name: Commit research report on main push only
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-v166-triple-barrier.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.6 triple-barrier gate report"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

# PR validation trigger

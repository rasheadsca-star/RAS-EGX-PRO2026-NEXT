name: Install V13.20 Multi-Session Purchase Priority Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v13-20-multi-session-purchase-priority-permission-safe.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: egx-v13-20-multi-session-priority
  cancel-in-progress: true

env:
  V13_20_PAYLOAD_SHA256: "aab7878aeebadfab3ea19a8cf5628211a55026396e735fc7671651b0a5a5e901"

jobs:
  install-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install V13.18, V13.19 and V13.20 application payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYINSTALL'
          import base64,hashlib,io,os,tarfile
          from pathlib import Path
          raw=base64.b64decode('')
          actual=hashlib.sha256(raw).hexdigest(); expected=os.environ['V13_20_PAYLOAD_SHA256']
          if actual!=expected: raise SystemExit(f'Payload checksum mismatch: {actual} != {expected}')
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as archive: archive.extractall(Path('.'))
          required=["scripts/ops/v13-18-portfolio-ui-patch.py", "scripts/ops/v13-18-portfolio-acceptance.py", "data/ops/v13-18-portfolio-policy.json", "scripts/ops/v13-19-ui-patch.py", "scripts/ops/v13-19-acceptance.py", "data/ops/v13-19-policy.json", "scripts/ops/v13-20-ui-patch.py", "scripts/ops/v13-20-acceptance.cjs", "scripts/research/v13-20-multi-session-ranking-backtest.cjs", "data/ops/v13-20-policy.json"]
          missing=[x for x in required if not Path(x).exists()]
          if missing: raise SystemExit('Missing payload files: '+', '.join(missing))
          print(f'V13.20 payload verified: sha256={actual}')
          PYINSTALL

      - name: Apply V13.18 portfolio lifecycle base
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/v13-18-portfolio-ui-patch.py
          python3 scripts/ops/v13-18-portfolio-acceptance.py --ui-only

      - name: Apply V13.19 history, risk and health base
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/v13-19-ui-patch.py
          python3 scripts/ops/v13-19-acceptance.py --ui-only

      - name: Build V13.20 multi-session results and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ops/v13-20-ui-patch.py
          node --check scripts/research/v13-20-multi-session-ranking-backtest.cjs
          node scripts/research/v13-20-multi-session-ranking-backtest.cjs
          node scripts/ops/v13-20-acceptance.cjs
          grep -q "V13_20_MULTI_SESSION_PRIORITY" preview-v13/app/unified-decision-center.html
          grep -q "التوصية الأولى" preview-v13/app/unified-decision-center.html
          grep -q "التوصية الثانية" preview-v13/app/unified-decision-center.html
          grep -q "التوصية الثالثة" preview-v13/app/unified-decision-center.html
          echo "V13.20 INSTALL VALIDATION PASSED"

      - name: Stage application files only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            scripts/ops/v13-18-portfolio-ui-patch.py \
            scripts/ops/v13-18-portfolio-acceptance.py \
            data/ops/v13-18-portfolio-policy.json \
            scripts/ops/v13-19-ui-patch.py \
            scripts/ops/v13-19-acceptance.py \
            data/ops/v13-19-policy.json \
            scripts/ops/v13-20-ui-patch.py \
            scripts/ops/v13-20-acceptance.cjs \
            scripts/research/v13-20-multi-session-ranking-backtest.cjs \
            data/ops/v13-20-policy.json \
            data/research/v13-20-multi-session-results.json \
            preview-v13/app/index.html \
            preview-v13/app/unified-decision-center.html
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Safety stop: a workflow file was staged."
            exit 1
          fi

      - name: Commit V13.20 application and research results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "V13.20 application is already installed."
          else
            git commit -m "Add V13.20 multi-session purchase priority backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repository for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy V13.20 attempt 1
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy V13.20 attempt 2
        if: steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120

      - name: Deploy V13.20 attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: actions/deploy-pages@v4

      - name: Final V13.20 result
        shell: bash
        run: |
          set -euo pipefail
          echo "V13.20 MULTI-SESSION PURCHASE PRIORITY INSTALLED"
          echo "Top recommendations are conditional, research-only historical estimates."
          echo "Automatic broker orders remain disabled."
          echo "Upload the supplied canonical production workflow manually for continuous daily updates."

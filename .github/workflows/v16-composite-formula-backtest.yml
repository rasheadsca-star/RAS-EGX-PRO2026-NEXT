name: EGX V16 Composite Formula Capture Test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-composite-formula-backtest.cjs"
      - ".github/workflows/v16-composite-formula-backtest.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check scripts/research/v16-composite-formula-backtest.cjs
      - run: node scripts/research/v16-composite-formula-backtest.cjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-composite-formula-capture.json
          if ! git diff --cached --quiet; then
            git commit -m "Measure composite formula top-gainer capture"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi


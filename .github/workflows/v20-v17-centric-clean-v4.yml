name: V20 V17-Centric Clean Architecture Certification V4

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - "scripts/v20/**"
      - "docs/v20/**"
      - "data/v20/**"
      - "v20/**"
      - ".github/workflows/v20-v17-centric-clean-v4.yml"

permissions:
  contents: write

concurrency:
  group: egx-v20-v17-centric-clean-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V20
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Enforce V20 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v20-integrated-decision-platform"
          git fetch --no-tags --depth=1 origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt
          changed="$(git diff --name-only origin/v19-egx-chat-gpt HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\.github/workflows/v20-integrated-decision-platform\.yml$|\.github/workflows/v20-market-regime\.yml$|\.github/workflows/v20-v17-centric-clean(-v2|-v3|-v4)?\.yml$)' || true)"
          test -z "$violations" || { echo "V20 isolation violation:"; echo "$violations"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Sync authoritative V17 decision inputs read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/recommendations.json
            data/technical-50-report.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
            data/v17/current-recommendation-base-status.json
          )
          for rel in "${paths[@]}"; do
            git cat-file -e "$V17_SHA:$rel" || { echo "Missing V17 runtime input: $rel"; exit 1; }
            mkdir -p "$(dirname "$rel")"
            git show "$V17_SHA:$rel" > "$rel"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$rel"
          done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" node scripts/v20/validate-v17-runtime-sync.cjs
          node scripts/v20/validate-v17-decision-core-runtime.cjs

      - name: Static and anti-self-patching validation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/v20/build-data-truth.cjs
            scripts/v20/build-integrated-decision-snapshot.cjs
            scripts/v20/build-trusted-technical-history.cjs
            scripts/v20/build-market-regime.cjs
            scripts/v20/build-market-explorer.cjs
            scripts/v20/build-full-market-native-technical.cjs
            scripts/v20/build-full-market-native-selection.cjs
            scripts/v20/build-native-explainability-v1.cjs
            scripts/v20/finalize-native-ranking-v1.cjs
            scripts/v20/build-native-model-freeze.cjs
            scripts/v20/build-native-current.cjs
            scripts/v20/build-v17-production-decision-core.cjs
            scripts/v20/build-final-decision-contract.cjs
            scripts/v20/build-funded-nav.cjs
            scripts/v20/archive-native-shadow.cjs
            scripts/v20/build-canonical-performance-evidence-registry.cjs
            scripts/v20/build-champion-challenger-registry.cjs
            scripts/v20/v17-centric-semantic-acceptance.cjs
            scripts/v20/decision-board-browser-certification.cjs
            scripts/v20/finalize-v17-centric-certification.cjs
            v20/app.js
            v20/native-research.js
            v20/decision-board.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          algorithm_files=(
            scripts/v20/build-data-truth.cjs
            scripts/v20/build-integrated-decision-snapshot.cjs
            scripts/v20/build-trusted-technical-history.cjs
            scripts/v20/build-market-regime.cjs
            scripts/v20/build-market-explorer.cjs
            scripts/v20/build-full-market-native-technical.cjs
            scripts/v20/build-full-market-native-selection.cjs
            scripts/v20/build-native-explainability-v1.cjs
            scripts/v20/finalize-native-ranking-v1.cjs
            scripts/v20/build-native-model-freeze.cjs
            scripts/v20/build-native-current.cjs
            scripts/v20/build-v17-production-decision-core.cjs
            scripts/v20/build-final-decision-contract.cjs
            scripts/v20/build-funded-nav.cjs
            scripts/v20/archive-native-shadow.cjs
            scripts/v20/build-canonical-performance-evidence-registry.cjs
            scripts/v20/build-champion-challenger-registry.cjs
            scripts/v20/v17-centric-semantic-acceptance.cjs
          )
          for f in "${algorithm_files[@]}"; do
            test -z "$(grep -nE 'require\(.*/apply-|execFileSync\([^\n]*apply-' "$f" || true)" || { echo "Runtime patch dependency: $f"; exit 1; }
          done

      - name: Build Data Truth
        run: |
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs

      - name: Build integrated base decision evidence
        run: |
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs

      - name: Build trusted technical evidence
        env:
          V20_HISTORY_NETWORK_REFRESH: "true"
          V20_HISTORY_CONCURRENCY: "4"
          V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: "5"
        run: |
          node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs

      - name: Build Market Regime research context
        run: |
          node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-unit.cjs
          node scripts/v20/market-regime-regression.cjs

      - name: Build Full Market Explorer
        run: |
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs

      - name: Build Native Technical
        env:
          V20_NATIVE_FULL_TECH_NETWORK_REFRESH: "true"
          V20_NATIVE_FULL_TECH_STARTA_FALLBACK: "true"
          V20_NATIVE_FULL_TECH_CONCURRENCY: "8"
          V20_NATIVE_FULL_TECH_RANGE: "6mo"
          V20_NATIVE_FULL_TECH_PRICE_TOLERANCE_PCT: "5"
        run: node scripts/v20/build-full-market-native-technical.cjs

      - name: Build frozen Native V1 ranking
        run: |
          node scripts/v20/build-full-market-native-selection.cjs
          node scripts/v20/build-native-explainability-v1.cjs
          node scripts/v20/finalize-native-ranking-v1.cjs
          node scripts/v20/build-native-model-freeze.cjs
          node scripts/v20/build-native-current.cjs
          node scripts/v20/native-current-regression.cjs

      - name: Build V17 Eligibility
        run: node scripts/v20/build-v17-production-decision-core.cjs

      - name: Build canonical Final Decision Contract
        run: |
          node scripts/v20/build-final-decision-contract.cjs
          node scripts/v20/set-precertification-product-status.cjs

      - name: Validate canonical trade decisions
        run: node scripts/v20/v17-centric-semantic-acceptance.cjs

      - name: Build Funded NAV
        run: |
          node scripts/v20/build-funded-nav.cjs
          node scripts/v20/funded-nav-regression.cjs

      - name: Archive and resolve Native forward evidence
        env:
          V20_NATIVE_FORWARD_NETWORK_REFRESH: "true"
          V20_NATIVE_FORWARD_CONCURRENCY: "6"
        run: |
          node scripts/v20/archive-native-shadow.cjs
          node scripts/v20/native-shadow-forward-regression.cjs

      - name: Build Performance Evidence
        run: |
          node scripts/v20/build-canonical-performance-evidence-registry.cjs
          node scripts/v20/canonical-performance-evidence-regression.cjs

      - name: Champion Challenger Governance
        run: |
          node scripts/v20/build-champion-challenger-registry.cjs
          node scripts/v20/champion-challenger-regression.cjs

      - name: Pre-browser clean architecture guard
        run: |
          node - <<'NODE'
          const sem=require('./data/v20/v17-centric-semantic-acceptance.json');
          const nav=require('./data/v20/funded-nav-regression.json');
          const fwd=require('./data/v20/signal-archive/native-shadow/regression.json');
          const perf=require('./data/v20/performance-evidence-regression.json');
          const gov=require('./data/v20/champion-challenger-regression.json');
          const d=require('./data/v20/final-decision-contract.json');
          const core=require('./data/v20/v17-production-decision-core.json');
          const registry=require('./data/v20/champion-challenger-registry.json');
          const native=require('./data/v20/native-current.json');
          for(const [name,x] of Object.entries({semantic:sem,fundedNav:nav,forward:fwd,performance:perf,governance:gov})) if(x.ok!==true) throw Error(`${name} failed`);
          if(registry.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET'||registry.automaticPromotion!==false)throw Error('Champion governance drift');
          if(core.policy?.v17IsAuthoritativeForProductionEligibility!==true)throw Error('V17 authority drift');
          if(native.executionPermission!==false||native.legacyScoringContributionPct!==0)throw Error('Native governance drift');
          if(d.architecture!=='V17_CENTRIC_V20_NATIVE_DISCOVERY')throw Error('Canonical architecture drift');
          if(d.sessionStatus!=='EXECUTION_GRADE'&&(d.summary.productionActionableCount!==0||d.summary.productionNewExposurePct!==0))throw Error('Production leak under closed gate');
          console.log(JSON.stringify({ok:true,sessionDate:d.sessionDate,productStatus:d.productStatus,sessionStatus:d.sessionStatus,nativePublished:native.publishedCandidates.length,v17RecommendationEligible:core.summary.recommendationEligibleCount,actionable:d.summary.productionActionableCount,newExposurePct:d.summary.productionNewExposurePct,activeChampion:registry.activeChampion},null,2));
          NODE

      - name: Run V17-centric Decision Board Chromium E2E
        run: node scripts/v20/decision-board-browser-certification.cjs

      - name: Final Certification
        run: node scripts/v20/finalize-v17-centric-certification.cjs

      - name: Final fail-closed certification guard
        run: |
          node - <<'NODE'
          const cert=require('./data/v20/v17-centric-final-certification.json');
          const d=require('./data/v20/final-decision-contract.json');
          const b=require('./data/v20/decision-board-browser-certification.json');
          if(cert.ok!==true||cert.critical!==0||cert.major!==0)throw Error('Final certification not clean');
          if(d.productStatus!=='PRODUCTION_READY_DECISION_SUPPORT'||d.productReadiness?.certificationState!=='CERTIFIED')throw Error('Certified product status missing');
          if(cert.architecture?.v17ExecutionAuthorityPreserved!==true||cert.architecture?.nativeDiscoveryOnly!==true)throw Error('Architecture certification drift');
          if(cert.governance?.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET'||cert.governance?.automaticPromotion!==false||cert.governance?.automaticBrokerExecution!==false)throw Error('Governance certification drift');
          if(b.ok!==true||b.failedCount!==0)throw Error('Browser certification failed');
          if(d.sessionStatus!=='EXECUTION_GRADE'&&(d.summary.productionActionableCount!==0||d.summary.productionNewExposurePct!==0))throw Error('Closed gate production leak after certification');
          console.log(JSON.stringify({ok:true,certification:cert.schemaVersion,productStatus:d.productStatus,sessionStatus:d.sessionStatus,actionable:d.summary.productionActionableCount,newExposurePct:d.summary.productionNewExposurePct,browserFailed:b.failedCount},null,2));
          NODE

      - name: Controlled Persist V20 certified artifacts only
        shell: bash
        run: |
          set -euo pipefail
          runtime_paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/recommendations.json
            data/technical-50-report.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
            data/v17/current-recommendation-base-status.json
          )
          git restore --worktree --staged -- "${runtime_paths[@]}"

          allowed=(
            data/v20/final-decision-contract.json
            data/v20/v17-production-decision-core.json
            data/v20/native-current.json
            data/v20/native-model-freeze.json
            data/v20/v17-runtime-sync.json
            data/v20/v17-centric-semantic-acceptance.json
            data/v20/funded-nav.json
            data/v20/funded-nav-regression.json
            data/v20/signal-archive/native-shadow/regression.json
            data/v20/performance-evidence-registry.json
            data/v20/performance-evidence-regression.json
            data/v20/champion-challenger-registry.json
            data/v20/champion-challenger-regression.json
            data/v20/decision-board-browser-certification.json
            data/v20/v17-centric-final-certification.json
          )
          for f in "${allowed[@]}"; do test -f "$f" || { echo "Missing certified artifact: $f"; exit 1; }; done
          git add -- "${allowed[@]}"
          staged="$(git diff --cached --name-only)"
          bad="$(printf '%s\n' "$staged" | grep -Ev '^(data/v20/final-decision-contract\.json|data/v20/v17-production-decision-core\.json|data/v20/native-current\.json|data/v20/native-model-freeze\.json|data/v20/v17-runtime-sync\.json|data/v20/v17-centric-semantic-acceptance\.json|data/v20/funded-nav\.json|data/v20/funded-nav-regression\.json|data/v20/signal-archive/native-shadow/regression\.json|data/v20/performance-evidence-registry\.json|data/v20/performance-evidence-regression\.json|data/v20/champion-challenger-registry\.json|data/v20/champion-challenger-regression\.json|data/v20/decision-board-browser-certification\.json|data/v20/v17-centric-final-certification\.json)$' || true)"
          test -z "$bad" || { echo "Controlled persist violation:"; echo "$bad"; exit 1; }
          test -z "$(printf '%s\n' "$staged" | grep -E '^(data/v17/|data/(market|final-opportunity-ranking|history|recommendations|technical-50-report)\.json$)' || true)" || { echo "V17/upstream file staged"; exit 1; }
          if git diff --cached --quiet; then
            echo "Certified artifacts already current; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist certified V20 V17-centric decision artifacts [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

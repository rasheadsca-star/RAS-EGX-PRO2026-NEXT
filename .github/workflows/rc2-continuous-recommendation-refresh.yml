name: RC2 Continuous Recommendation Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rc2-continuous-recommendation-refresh.yml"
  schedule:
    - cron: "8,23,38,53 6-18 * * 0-4"

permissions:
  contents: write

concurrency:
  group: rc2-continuous-recommendation-refresh
  cancel-in-progress: true

env:
  RC2_PRODUCTION_URL: "https://egx-tfe-v20-fusion-rc2.vercel.app"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main for durable history archive
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve Cairo operating window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const eventName = String(process.env.EVENT_NAME || '');
          const p = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Africa/Cairo', weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
          const minute = Number(p.hour) * 60 + Number(p.minute);
          const tradingDay = ['Sunday','Monday','Tuesday','Wednesday','Thursday'].includes(p.weekday);
          const scheduledWindow = tradingDay && minute >= 9 * 60 + 30 && minute <= 20 * 60 + 45;
          const run = eventName === 'workflow_dispatch' || eventName === 'push' || scheduledWindow;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\ncairo=${p.weekday}_${p.hour}:${p.minute}\n`);
          console.log(JSON.stringify({ cairo: `${p.weekday} ${p.hour}:${p.minute}`, run, eventName }));
          NODE

      - name: Recompute and validate RC2 production recommendations
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/validate-rc2.cjs <<'NODE'
          const fs = require('fs');
          const scan = JSON.parse(fs.readFileSync('/tmp/rc2-scan.json','utf8'));
          const market = JSON.parse(fs.readFileSync('/tmp/rc2-market.json','utf8'));
          const fail = (m) => { console.error(m); process.exit(1); };
          if (scan?.ok !== true) fail('RC2 scan is not OK');
          if (scan?.engine !== 'TFE_V20_FUSION_RC2') fail(`Unexpected engine: ${scan?.engine}`);
          if (!Array.isArray(scan?.recommendations)) fail('Recommendations array missing');
          if (scan?.permissions?.executionAllowed !== false) fail('Execution must remain blocked');
          if (scan?.permissions?.automaticOrders !== false) fail('Automatic orders must remain blocked');
          if (market?.ok !== true || !Array.isArray(market?.symbols)) fail('Market index is not valid');
          const recDates = [...new Set(scan.recommendations.map(x => x?.sessionDate).filter(Boolean))].sort();
          if (recDates.length > 1) fail(`Mixed recommendation sessions: ${recDates.join(',')}`);
          const recommendationSession = recDates[0] ?? null;
          const marketSession = market?.sessionDate ?? null;
          const universeSession = scan?.universe?.sessionDate ?? null;
          const effectiveSession = [recommendationSession, marketSession, universeSession].filter(Boolean).sort().at(-1) ?? null;
          if (recommendationSession && marketSession && recommendationSession !== marketSession) {
            fail(`Published recommendation session mismatch: rec=${recommendationSession}, market=${marketSession}`);
          }
          if (universeSession && effectiveSession && universeSession > effectiveSession) {
            fail(`Universe session is unexpectedly ahead: universe=${universeSession}, effective=${effectiveSession}`);
          }
          if (universeSession && marketSession && universeSession !== marketSession) {
            console.warn(`RC2_UNIVERSE_METADATA_LAG:${universeSession}->${marketSession}`);
          }
          const summary = {
            refreshedAt: new Date().toISOString(), engine: scan.engine, sourceCommit: scan.sourceCommit ?? null,
            sessionDate: effectiveSession, recommendationSessionDate: recommendationSession,
            marketSessionDate: marketSession, universeSessionDate: universeSession,
            scanned: scan.summary?.scanned ?? null, publicationEligibleTotal: scan.summary?.publicationEligibleTotal ?? null,
            returned: scan.summary?.returned ?? scan.recommendations.length, tickers: scan.recommendations.map(x => x.ticker),
            executionAllowed: scan.permissions.executionAllowed, automaticOrders: scan.permissions.automaticOrders,
            marketSymbols: market.symbols.length, scoringModelChanged: false
          };
          console.log(`RC2_CONTINUOUS_REFRESH_PASS:${JSON.stringify(summary)}`);
          NODE

          ok=0
          max_attempts=6
          for attempt in $(seq 1 "$max_attempts"); do
            stamp="$(date +%s)"
            if curl --fail --silent --show-error --max-time 180 \
              "$RC2_PRODUCTION_URL/api/index?route=scan&limit=20&t=$stamp" -o /tmp/rc2-scan.json \
              && curl --fail --silent --show-error --max-time 60 \
              "$RC2_PRODUCTION_URL/api/index?route=market-index&t=$stamp" -o /tmp/rc2-market.json \
              && node /tmp/validate-rc2.cjs; then
              ok=1
              break
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "RC2 refresh attempt $attempt failed; upstream source cache may still be propagating. Retrying in 70 seconds..."
              sleep 70
            fi
          done
          [ "$ok" -eq 1 ] || { echo "RC2 continuous refresh failed after cache-aware retries"; exit 1; }

      - name: Append official post-close recommendations to durable history
        if: steps.window.outputs.run == 'true'
        id: archive
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/rc2/recommendation-history.json';
          const scan = JSON.parse(fs.readFileSync('/tmp/rc2-scan.json','utf8'));
          const market = JSON.parse(fs.readFileSync('/tmp/rc2-market.json','utf8'));
          const p = new Intl.DateTimeFormat('en-GB', {
            timeZone:'Africa/Cairo', weekday:'long', hour:'2-digit', minute:'2-digit', hourCycle:'h23'
          }).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
          const minute = Number(p.hour)*60+Number(p.minute);
          const tradingDay = ['Sunday','Monday','Tuesday','Wednesday','Thursday'].includes(p.weekday);
          const postClose = tradingDay && minute >= 15*60 && minute <= 20*60+45;
          if (!postClose) {
            console.log(`ARCHIVE_SKIP_NOT_POSTCLOSE:${p.weekday}_${p.hour}:${p.minute}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'changed=false\n');
            process.exit(0);
          }
          const recommendations = Array.isArray(scan?.recommendations) ? scan.recommendations : [];
          const recDates = [...new Set(recommendations.map(x => x?.sessionDate).filter(Boolean))].sort();
          if (recDates.length > 1) throw new Error(`ARCHIVE_MIXED_RECOMMENDATION_SESSIONS:${recDates.join(',')}`);
          const recommendationSession = recDates[0] ?? null;
          const marketSession = market?.sessionDate ?? null;
          const universeSession = scan?.universe?.sessionDate ?? null;
          if (recommendationSession && marketSession && recommendationSession !== marketSession) {
            throw new Error(`ARCHIVE_RECOMMENDATION_MARKET_SESSION_MISMATCH:${recommendationSession}:${marketSession}`);
          }
          const sessionDate = recommendationSession ?? marketSession ?? universeSession ?? null;
          if (!sessionDate || !recommendations.length) {
            console.log('ARCHIVE_SKIP_NO_PUBLISHED_RECOMMENDATIONS');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'changed=false\n');
            process.exit(0);
          }
          let archive = { schemaVersion:'rc2.recommendation-history.1', updatedAt:null, records:[], notes:[] };
          if (fs.existsSync(path)) archive = JSON.parse(fs.readFileSync(path,'utf8'));
          archive.records = Array.isArray(archive.records) ? archive.records : [];
          const seen = new Set(archive.records.map(x=>`${x.sessionDate}|${String(x.ticker||'').toUpperCase()}`));
          let added = 0;
          for (const x of recommendations) {
            const ticker = String(x?.ticker ?? '').trim().toUpperCase();
            const rowSession = x?.sessionDate ?? sessionDate;
            if (rowSession !== sessionDate) throw new Error(`ARCHIVE_ROW_SESSION_MISMATCH:${ticker}:${rowSession}:${sessionDate}`);
            const key = `${sessionDate}|${ticker}`;
            if (!ticker || seen.has(key)) continue;
            archive.records.push({
              sourceType:'PRODUCTION_POSTCLOSE_ARCHIVE',
              verifiedFrom:`RC2 production scan ${scan.generatedAt ?? new Date().toISOString()}`,
              sessionDate, rank:x.rank ?? null, ticker, decision:x.decision ?? null,
              publicationState:x.publicationState ?? 'RESEARCH_CANDIDATE', price:x.price ?? null,
              entryLow:x.tradePlan?.entryLow ?? null, entryHigh:x.tradePlan?.entryHigh ?? null,
              stop:x.tradePlan?.stop ?? null, target1:x.tradePlan?.target1 ?? null, target2:x.tradePlan?.target2 ?? null,
              fusionRankScore:x.scores?.fusionRank ?? null, researchScore:x.scores?.research ?? null,
              technicalScore:x.scores?.core ?? null, sourceCommit:scan.sourceCommit ?? null
            });
            seen.add(key); added++;
          }
          if (!added) {
            console.log(`ARCHIVE_ALREADY_HAS_SESSION:${sessionDate}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'changed=false\n');
            process.exit(0);
          }
          archive.records.sort((a,b)=>String(a.sessionDate).localeCompare(String(b.sessionDate))||(Number(a.rank??999)-Number(b.rank??999))||String(a.ticker).localeCompare(String(b.ticker)));
          archive.updatedAt = new Date().toISOString();
          archive.notes = Array.isArray(archive.notes) ? archive.notes : [];
          fs.mkdirSync('data/rc2',{recursive:true});
          fs.writeFileSync(path,JSON.stringify(archive,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`changed=true\nadded=${added}\nsession=${sessionDate}\n`);
          console.log(`RC2_HISTORY_ARCHIVE_APPEND:${JSON.stringify({sessionDate,added,tickers:recommendations.map(x=>x.ticker),recommendationSession,marketSession,universeSession})}`);
          NODE

      - name: Commit durable history snapshot
        if: steps.archive.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rc2/recommendation-history.json
          git commit -m "Archive RC2 recommendations for ${{ steps.archive.outputs.session }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 8))
          done

      - name: Confirm refresh contract
        if: steps.window.outputs.run == 'true'
        run: |
          echo "DATA SOURCE: main exact-fresh production pipeline"
          echo "RECOMMENDATIONS: recomputed by TFE_V20_FUSION_RC2"
          echo "SESSION SEMANTICS: recommendation/market session is authoritative; lagging universe summary is warning-only"
          echo "CACHE PROPAGATION: validator tolerates the upstream 5-minute repository cache window"
          echo "CADENCE: every 15 minutes during Cairo operating window"
          echo "PUBLISHED HISTORY: append-only after Cairo post-close"
          echo "FINANCIAL IMPACT ON RECOMMENDATIONS: NONE"
          echo "EXECUTION: BLOCKED"

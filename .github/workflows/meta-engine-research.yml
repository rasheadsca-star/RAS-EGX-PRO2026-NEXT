name: EGX Meta Engine Research Validation

on:
  push:
    branches:
      - research/egx-meta-engine-v1-20260829
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-meta-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tfe-v20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run TFE and Meta tests
        run: node --test test/*.test.js
      - name: Build current Meta snapshot
        run: node scripts/meta-current.mjs
      - name: Run destructive review
        run: node scripts/meta-review.mjs
      - name: Load latest research history universe for isolated research
        working-directory: .
        run: |
          git fetch origin research/triple-engine-consensus-v1 --depth=1
          git checkout FETCH_HEAD -- data/history
      - name: Scan full current universe with TFE gates
        run: node scripts/current-universe-scan.mjs
      - name: Run point-in-time plan construction ablation
        run: node scripts/plan-ablation.mjs
      - name: Validate generated research evidence
        run: |
          test -s evidence/meta/current-meta-snapshot.json
          test -s evidence/meta/current-meta-review.json
          test -s evidence/meta/current-universe-scan.json
          test -s evidence/meta/plan-ablation.json
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: egx-meta-engine-research-evidence
          path: |
            tfe-v20/evidence/meta/current-meta-snapshot.json
            tfe-v20/evidence/meta/current-meta-review.json
            tfe-v20/evidence/meta/current-universe-scan.json
            tfe-v20/evidence/meta/plan-ablation.json
          if-no-files-found: error

name: Meta Engine Research

on:
  push:
    branches:
      - agent/egx-meta-engine-v1-20260829
    paths:
      - 'tfe-v20/src/metaEngine.js'
      - 'tfe-v20/src/metaEngineV2.js'
      - 'tfe-v20/src/rawMomentumExpert.js'
      - 'tfe-v20/src/rawPullbackExpert.js'
      - 'tfe-v20/src/breadthRegimeExposure.js'
      - 'tfe-v20/sidecars/fresh-forward-ledger.js'
      - 'tfe-v20/sidecars/fresh-forward-quality.js'
      - 'tfe-v20/test/meta-engine.test.js'
      - 'tfe-v20/test/meta-engine-v2.test.js'
      - 'tfe-v20/test/raw-momentum-expert.test.js'
      - 'tfe-v20/test/raw-pullback-expert.test.js'
      - 'tfe-v20/test/breadth-regime-exposure.test.js'
      - 'tfe-v20/test/fresh-forward-ledger.test.js'
      - 'tfe-v20/test/fresh-forward-quality.test.js'
      - 'tfe-v20/scripts/meta-*.mjs'
      - 'tfe-v20/scripts/fresh-forward-*.mjs'
      - 'tfe-v20/scripts/raw-momentum-expert-audit.mjs'
      - 'tfe-v20/scripts/raw-pullback-expert-audit.mjs'
      - 'tfe-v20/scripts/breadth-regime-exposure-audit.mjs'
      - 'tfe-v20/scripts/v16-loss-anatomy-*.mjs'
      - 'tfe-v20/scripts/legacy-expert-veto-audit.cjs'
      - 'tfe-v20/forward-ledger/**'
      - 'tfe-v20/research/**'
      - '.github/workflows/meta-engine-research.yml'
  pull_request:
    branches:
      - develop/v20-integrated-decision-platform
    paths:
      - 'tfe-v20/src/metaEngine.js'
      - 'tfe-v20/src/metaEngineV2.js'
      - 'tfe-v20/src/rawMomentumExpert.js'
      - 'tfe-v20/src/rawPullbackExpert.js'
      - 'tfe-v20/src/breadthRegimeExposure.js'
      - 'tfe-v20/sidecars/fresh-forward-ledger.js'
      - 'tfe-v20/sidecars/fresh-forward-quality.js'
      - 'tfe-v20/test/meta-engine.test.js'
      - 'tfe-v20/test/meta-engine-v2.test.js'
      - 'tfe-v20/test/raw-momentum-expert.test.js'
      - 'tfe-v20/test/raw-pullback-expert.test.js'
      - 'tfe-v20/test/breadth-regime-exposure.test.js'
      - 'tfe-v20/test/fresh-forward-ledger.test.js'
      - 'tfe-v20/test/fresh-forward-quality.test.js'
      - 'tfe-v20/scripts/meta-*.mjs'
      - 'tfe-v20/scripts/fresh-forward-*.mjs'
      - 'tfe-v20/scripts/raw-momentum-expert-audit.mjs'
      - 'tfe-v20/scripts/raw-pullback-expert-audit.mjs'
      - 'tfe-v20/scripts/breadth-regime-exposure-audit.mjs'
      - 'tfe-v20/scripts/v16-loss-anatomy-*.mjs'
      - 'tfe-v20/scripts/legacy-expert-veto-audit.cjs'
      - 'tfe-v20/forward-ledger/**'
      - 'tfe-v20/research/**'
      - '.github/workflows/meta-engine-research.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_EVIDENCE_COMMIT: 34218d27a36d2c916961a54573477f47f124416a
  V19_EVIDENCE_COMMIT: 1b8e3d15f54c7d1811b760c4f07d86d6df213606

jobs:
  validate-meta-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tfe-v20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run meta-engine V1 destructive tests
        run: node --test test/meta-engine.test.js

      - name: Run meta-engine V2 lineage destructive tests
        run: node --test test/meta-engine-v2.test.js

      - name: Run raw momentum expert leakage tests
        run: node --test test/raw-momentum-expert.test.js

      - name: Run raw pullback expert leakage tests
        run: node --test test/raw-pullback-expert.test.js

      - name: Run breadth regime exposure leakage tests
        run: node --test test/breadth-regime-exposure.test.js

      - name: Run fresh forward ledger integrity tests
        run: node --test test/fresh-forward-ledger.test.js

      - name: Run fresh forward source-quality guard tests
        run: node --test test/fresh-forward-quality.test.js

      - name: Verify committed fresh forward snapshots are untampered
        run: node scripts/fresh-forward-verify.mjs

      - name: Run frozen-ledger benchmark
        run: node scripts/meta-ledger-benchmark.mjs

      - name: Run same-session live shadow
        run: node scripts/meta-live-shadow.mjs

      - name: Preregister first fresh forward observation
        if: github.event_name == 'push'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          NEXT_TRADING_SESSION_DATE: '2026-08-30'
          NEXT_SESSION_OPEN_AT: '2026-08-30T07:00:00.000Z'
          SOURCE_DECLARED_DATE_STATUS: 'EGX_CLOSED_HOLIDAY_REFERENCE_DATE'
          MARKET_CALENDAR_EVIDENCE_JSON: '[{"url":"https://www.masrawy.com/news/news_economy/details/2026/8/24/3037667","note":"EGX announced 27-Aug-2026 holiday and resumption Sunday 30-Aug-2026"},{"url":"https://www.tradinghours.com/markets/egx","note":"EGX normal Sunday-Thursday opening shown as 10:00 Cairo time"}]'
        run: |
          if compgen -G 'forward-ledger/snapshots/2026-08-27-*.json' > /dev/null; then
            echo 'Preregistration already persisted in append-only ledger; duplicate capture skipped.'
            exit 0
          fi
          signal_date=$(node -e "const x=require('./reports/meta-live-shadow.json'); process.stdout.write(String(x.sessionDate||''))")
          if [ "$signal_date" != '2026-08-27' ]; then
            echo "Preregistration skipped: source reference date is $signal_date, not 2026-08-27."
            exit 0
          fi
          now_epoch=$(date -u +%s)
          deadline_epoch=$(date -u -d "$NEXT_SESSION_OPEN_AT" +%s)
          if [ "$now_epoch" -ge "$deadline_epoch" ]; then
            echo "Preregistration skipped: pre-outcome boundary has passed."
            exit 0
          fi
          node scripts/fresh-forward-capture.mjs reports/meta-live-shadow.json

      - name: Verify preregistered forward observation
        if: github.event_name == 'push'
        run: |
          if compgen -G 'reports/fresh-forward-ledger/*.json' > /dev/null; then
            node scripts/fresh-forward-verify.mjs reports/fresh-forward-ledger
          else
            echo 'No new preregistration snapshot produced in this run.'
          fi

      - name: Upload preregistered forward snapshot immediately
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: fresh-forward-preregister-2026-08-27
          path: tfe-v20/reports/fresh-forward-ledger/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Materialize pinned legacy evidence snapshot
        run: |
          cd ..
          git fetch origin "$LEGACY_EVIDENCE_COMMIT" --depth=1
          git checkout "$LEGACY_EVIDENCE_COMMIT" -- gann-fusion-x data/history
          git checkout "$LEGACY_EVIDENCE_COMMIT" -- \
            scripts/research/v16-probabilistic-model-impact.py \
            scripts/research/v16-two-stage-predictor.py \
            scripts/research/v16-v169-basket-engine.py \
            scripts/research/v16-v169-target-hit-audit.py
          mkdir -p data/stable tfe-v20/reports
          git show "$LEGACY_EVIDENCE_COMMIT:data/stable/v16-v169-live-evaluation.json" > data/stable/v16-v169-live-evaluation.json

      - name: Materialize pinned V19 research lineage
        run: |
          cd ..
          git fetch origin "$V19_EVIDENCE_COMMIT" --depth=1
          git checkout "$V19_EVIDENCE_COMMIT" -- scripts/v19

      - name: Build full V16 blocked walk-forward audit
        run: |
          cd ..
          python scripts/research/v16-v169-basket-engine.py
          sed -i 's/AUDIT_SESSIONS = 20/AUDIT_SESSIONS = 999/' scripts/research/v16-v169-target-hit-audit.py
          python scripts/research/v16-v169-target-hit-audit.py

      - name: Diagnose V16 loss anatomy
        run: node scripts/v16-loss-anatomy-audit.mjs

      - name: Enforce V16 anatomy validity guard
        run: node scripts/v16-loss-anatomy-validity-guard.mjs

      - name: Audit outcome-blind V16 entry heat filter
        run: node scripts/meta-entry-quality-audit.mjs

      - name: Audit independent raw momentum expert
        run: node scripts/raw-momentum-expert-audit.mjs

      - name: Audit independent raw pullback timing expert
        run: node scripts/raw-pullback-expert-audit.mjs

      - name: Audit independent breadth regime exposure controller
        run: node scripts/breadth-regime-exposure-audit.mjs

      - name: Replay older V16-V19 agreement outside reused V19 holdout
        run: |
          cd ..
          sed -i 's/dev_results\[-25:\]/dev_results/g' scripts/v19/native-challenger-v6.py
          python scripts/v19/native-challenger-v6.py
          cd tfe-v20
          node scripts/meta-v19-development-consensus-audit.mjs

      - name: Run pinned Gann-SEPA-V16 walk-forward comparison
        run: |
          cd ..
          node gann-fusion-x/scripts/backtest-compare.cjs
          cp gann-fusion-x/data/backtest-comparison.json tfe-v20/reports/legacy-expert-walkforward.json

      - name: Audit Gann-SEPA fixed veto rules on exact V16 signals
        run: node scripts/legacy-expert-veto-audit.cjs

      - name: Record inherited V20 audit without hiding it
        id: inherited
        continue-on-error: true
        run: npm test

      - name: Mark inherited baseline blocker explicitly
        if: steps.inherited.outcome != 'success'
        run: |
          mkdir -p reports
          cat > reports/inherited-v20-blocker.json <<'JSON'
          {
            "status": "INHERITED_V20_BASELINE_BLOCKER",
            "promotionEligible": false,
            "knownFailures": [
              "portfolio-manager browser side-effect import fails in Node because snapshot-date-fix accesses window",
              "frozen runtime contract hash for public/portfolio-manager.js does not match current integrated V20 runtime"
            ],
            "treatment": "Not attributed to Meta Engine; not hidden; must be reconciled separately before any merge or promotion."
          }
          JSON

      - name: Build compact research verdict
        if: always()
        run: node scripts/meta-research-verdict.mjs

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-engine-research-reports
          path: tfe-v20/reports/*.json
          if-no-files-found: warn
          retention-days: 14

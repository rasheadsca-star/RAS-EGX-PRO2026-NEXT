name: Meta Engine Research

on:
  push:
    branches:
      - agent/egx-meta-engine-v1-20260829
    paths:
      - 'tfe-v20/src/metaEngine.js'
      - 'tfe-v20/test/meta-engine.test.js'
      - 'tfe-v20/scripts/meta-*.mjs'
      - 'tfe-v20/research/**'
      - '.github/workflows/meta-engine-research.yml'
  pull_request:
    branches:
      - develop/v20-integrated-decision-platform
    paths:
      - 'tfe-v20/src/metaEngine.js'
      - 'tfe-v20/test/meta-engine.test.js'
      - 'tfe-v20/scripts/meta-*.mjs'
      - 'tfe-v20/research/**'
      - '.github/workflows/meta-engine-research.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LEGACY_EVIDENCE_COMMIT: 34218d27a36d2c916961a54573477f47f124416a

jobs:
  validate-meta-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tfe-v20
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run meta-engine destructive tests
        run: node --test test/meta-engine.test.js

      - name: Run frozen-ledger benchmark
        run: node scripts/meta-ledger-benchmark.mjs

      - name: Run same-session live shadow
        run: node scripts/meta-live-shadow.mjs

      - name: Run pinned Gann-SEPA-V16 walk-forward comparison
        run: |
          cd ..
          git fetch origin "$LEGACY_EVIDENCE_COMMIT" --depth=1
          git checkout "$LEGACY_EVIDENCE_COMMIT" -- gann-fusion-x data/history
          mkdir -p data/stable tfe-v20/reports
          git show "$LEGACY_EVIDENCE_COMMIT:data/stable/v16-v169-live-evaluation.json" > data/stable/v16-v169-live-evaluation.json
          node gann-fusion-x/scripts/backtest-compare.cjs
          cp gann-fusion-x/data/backtest-comparison.json tfe-v20/reports/legacy-expert-walkforward.json

      - name: Record inherited V20 audit without hiding it
        id: inherited
        continue-on-error: true
        run: npm test

      - name: Mark inherited baseline blocker explicitly
        if: steps.inherited.outcome != 'success'
        run: |
          mkdir -p reports
          cat > reports/inherited-v20-blocker.json <<'JSON'
          {
            "status": "INHERITED_V20_BASELINE_BLOCKER",
            "promotionEligible": false,
            "knownFailures": [
              "portfolio-manager browser side-effect import fails in Node because snapshot-date-fix accesses window",
              "frozen runtime contract hash for public/portfolio-manager.js does not match current integrated V20 runtime"
            ],
            "treatment": "Not attributed to Meta Engine; not hidden; must be reconciled separately before any merge or promotion."
          }
          JSON

      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-engine-research-reports
          path: tfe-v20/reports/*.json
          if-no-files-found: warn
          retention-days: 14

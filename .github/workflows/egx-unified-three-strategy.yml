name: EGX Unified Three Strategy Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research/egx-comparable-three-strategy-v1.cjs'
      - 'tests/research/egx-comparable-three-strategy-v1.test.cjs'
      - 'scripts/research/egx-strategy-challengers-v1.cjs'
      - '.github/workflows/egx-unified-three-strategy.yml'
      - 'scripts/research/egx-top-four-portfolio-v1.cjs'
      - 'tests/research/egx-top-four-portfolio-v1.test.cjs'
      - 'scripts/research/egx-market-top-four-first-v1.cjs'
      - 'tests/research/egx-market-top-four-first-v1.test.cjs'
      - 'scripts/research/egx-strategy-top-four-tournament-v1.cjs'
      - 'tests/research/egx-strategy-top-four-tournament-v1.test.cjs'
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared-replay tests
        run: node --test tests/research/egx-comparable-three-strategy-v1.test.cjs
      - name: Test top-four selection and cash constraints
        run: node --test tests/research/egx-top-four-portfolio-v1.test.cjs
      - name: Test independent stock-ranking-first selection
        run: node --test tests/research/egx-market-top-four-first-v1.test.cjs
      - name: Test per-strategy independent best-four rankings
        run: node --test tests/research/egx-strategy-top-four-tournament-v1.test.cjs
      - name: Compare strategies with identical execution and eligible universe
        run: node scripts/research/egx-comparable-three-strategy-v1.cjs
      - name: Rank and evaluate no-more-than-four selected positions per strategy
        run: node scripts/research/egx-top-four-portfolio-v1.cjs
      - name: Rank market stocks first then compare strategies on same top four
        run: node scripts/research/egx-market-top-four-first-v1.cjs
      - name: Compare each strategy's own top-four-ranked stocks
        run: node scripts/research/egx-strategy-top-four-tournament-v1.cjs
      - name: Write historical comparison
        if: success()
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('data/research/egx-comparable-three-strategy-v1.json','utf8'));
          const p=JSON.parse(fs.readFileSync('data/research/egx-top-four-portfolio-v1.json','utf8'));
          const market=JSON.parse(fs.readFileSync('data/research/egx-market-top-four-first-v1.json','utf8'));
          const tour=JSON.parse(fs.readFileSync('data/research/egx-strategy-top-four-tournament-v1.json','utf8'));
          const lines=['## EGX Unified Three Strategy Comparison','Research only; chronological partitions are not an untouched out-of-sample test.','','| Period | Model | Trades | Win % | Mean net % | Profit factor |','|---|---|---:|---:|---:|---:|'];
          for(const group of r.byPeriod)for(const x of group.variants)lines.push('| '+group.period+' | '+x.variant+' | '+x.trades+' | '+(x.winRatePct??'N/A')+' | '+(x.meanNetReturnPct??'N/A')+' | '+(x.profitFactor??'N/A')+' |');
          lines.push('','Ticker files eligible: '+r.coverage.eligible+' / '+r.coverage.files+'. Unresolved: '+r.unresolved);
          lines.push('', '### Ranked top-four paper portfolio (approximate cash accounting)','| Model | Selected trades | Total return % | End capital | Win % |','|---|---:|---:|---:|---:|');
          for(const x of p.models)lines.push('| '+x.variant+' | '+x.selectedTrades+' | '+x.totalReturnPct+' | '+x.finalEquity+' | '+x.winRatePct+' |');
          lines.push('', '### Market-wide ranking FIRST: same four equities then strategies','| Model | After market shortlist | Executed trades | Portfolio return % |','|---|---:|---:|---:|');
          for(const m of market.models)lines.push('| '+m.variant+' | '+m.shortlistedTradeCount+' | '+m.selectedTrades+' | '+m.totalReturnPct+' |');
          lines.push('', '### Independent per-strategy top-four tournament','| Model | Total signals | Selected trades | Portfolio return % | Win % |','|---|---:|---:|---:|---:|');
          for(const x of tour.models)lines.push('| '+x.variant+' | '+x.totalCandidateSignals+' | '+x.portfolio.selectedTrades+' | '+x.portfolio.totalReturnPct+' | '+x.portfolio.winRatePct+' |');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join(String.fromCharCode(10))+String.fromCharCode(10));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egx-unified-three-strategy-comparison
          path: |
            data/research/egx-comparable-three-strategy-v1.json
            data/research/egx-top-four-portfolio-v1.json
            data/research/egx-market-top-four-first-v1.json
            data/research/egx-strategy-top-four-tournament-v1.json

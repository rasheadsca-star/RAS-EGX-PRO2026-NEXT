name: V15 Practical Full-Market Scanner

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/stable/v15-practical-market-scanner.cjs"
      - ".github/workflows/v15-practical-market-scanner.yml"
  schedule:
    - cron: "25 17 * * 0-4"

permissions:
  contents: write

concurrency:
  group: v15-practical-market-scanner
  cancel-in-progress: true

jobs:
  validate-full-market-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build practical decision and missed-opportunity audit
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-practical-market-scanner.cjs
          node scripts/stable/v15-practical-market-scanner.cjs

      - name: Validate honest practical gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json','utf8'));
          const v=JSON.parse(fs.readFileSync('data/research/v15-practical-validation.json','utf8'));
          const m=JSON.parse(fs.readFileSync('data/research/v15-missed-opportunities.json','utf8'));
          if(d.schemaVersion!=='15.0.0') throw new Error('Invalid V15 schema');
          if(d.guardrails?.fullMarketScan!==true) throw new Error('Full-market scan missing');
          if(d.guardrails?.developmentValidationTestSplit!==true) throw new Error('Independent test split missing');
          if(d.guardrails?.futureLeakageForbidden!==true) throw new Error('Future leakage safeguard missing');
          if(d.guardrails?.targetProbabilityMustExceedStopProbability!==true) throw new Error('Target/stop gate missing');
          if(d.practicalReady){
            if(!v.selection) throw new Error('Practical recommendations published without selected model');
            const selected=v.models.find(x=>x.id===v.selection);
            if(!selected?.validationPassed||!selected?.testPassed) throw new Error('Selected model did not pass validation and test');
            if(!(selected.test.targetRatePct>selected.test.stopRatePct)) throw new Error('Test target rate does not exceed stop rate');
            if(!(selected.test.averageReturnPct>0)) throw new Error('Test average return is not positive');
            if(!Array.isArray(d.recommendations)||!d.recommendations.length) throw new Error('No practical candidates');
          } else if(Array.isArray(d.recommendations)&&d.recommendations.length){
            throw new Error('Recommendations exist while practical gate is closed');
          }
          console.log({session:d.sessionDate,practicalReady:d.practicalReady,selected:v.selection,recommendations:(d.recommendations||[]).map(x=>x.ticker),captureRate:m.captureRatePct,models:v.models});
          NODE

      - name: Commit V15 evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v15-practical-decision.json data/research/v15-practical-validation.json data/research/v15-missed-opportunities.json
          if git diff --cached --quiet; then
            echo "No V15 evidence changes"
          else
            git commit -m "Validate V15 practical full-market models"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
              sleep $((attempt*15))
            done
            exit 1
          fi

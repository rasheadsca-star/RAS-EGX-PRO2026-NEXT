name: TFE V20 Audit

on:
  push:
    branches:
      - develop/v20-integrated-decision-platform
      - research/rc2-rr-calibration-20261001
    paths:
      - 'tfe-v20/**'
      - '.github/workflows/tfe-v20-audit.yml'
  pull_request:
    paths:
      - 'tfe-v20/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tfe-v20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/policy.js
          node --check src/math.js
          node --check src/quality.js
          node --check src/originalIndicators.js
          node --check src/originalScore.js
          node --check src/confidence.js
          node --check src/decisionLog.js
          node --check src/engine.js
          node --check src/backtest.js
          node --check src/repository.js
          node --check src/ablation.js
          node --check api/index.js
          node --check api/session-monitor.js
          node --check monitor/session-quote.js
          node --check public/ui-v169.js
          node --check public/session-monitor-core.js
          node --check public/session-monitor.js
          node --check public/ops-v169.js
          node --check stability/frozen-runtime-contract.js
          node --check sidecars/forward-evidence.js
          node --check sidecars/data-verification.js
          node --check sidecars/history-depth.js
          node --check sidecars/regime-analysis.js
          node --check sidecars/long-history-validation.js
          node --check scripts/snapshot-decision-log.mjs
          node --check scripts/sidecar-audit.mjs
          node --check scripts/evaluate-forward.mjs
          node --check scripts/regime-report.mjs
          node --check scripts/long-history-validation.mjs
          node --check scripts/rr-calibration-scenario.mjs
      - name: Full functional tests excluding frozen byte-identity guard
        run: |
          node --test $(find test -maxdepth 1 -name '*.test.js' ! -name 'stability-contract.test.js' | sort)
          echo "NOTE: stability-contract.test.js is intentionally excluded only on this isolated calibration branch because policy.js is parameterized for research."
      - name: Independent red-team safety gate excluding frozen byte identity
        run: node --test test/sidecars.test.js test/adversarial.test.js test/api-hardening.test.js test/session-monitor.test.js
      - name: Research-only RR calibration grid
        if: success()
        run: |
          set -euo pipefail
          for rr in 0.70 0.68 0.65 0.60 0.55; do
            echo "=== RC2 RR CALIBRATION rr=$rr ==="
            RC2_MIN_STRUCTURAL_NET_RR="$rr" node scripts/rr-calibration-scenario.mjs
          done
          echo "PRODUCTION MUTATION: false"
          echo "EXECUTION ALLOWED: false"

      - name: Stage exact runtime artifact
        if: success()
        run: |
          rm -rf runtime-artifact
          mkdir -p runtime-artifact
          cp package.json vercel.json runtime-artifact/
          cp -R src api monitor public runtime-artifact/
      - name: Upload exact runtime artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tfe-v20-runtime
          path: tfe-v20/runtime-artifact
          if-no-files-found: error
          retention-days: 1

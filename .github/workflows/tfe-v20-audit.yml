name: TFE V20 Audit

on:
  push:
    branches:
      - develop/v20-integrated-decision-platform
    paths:
      - 'tfe-v20/**'
      - '.github/workflows/tfe-v20-audit.yml'
  pull_request:
    paths:
      - 'tfe-v20/**'
      - '.github/workflows/tfe-v20-audit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tfe-v20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check src/policy.js
          node --check src/math.js
          node --check src/quality.js
          node --check src/originalIndicators.js
          node --check src/originalScore.js
          node --check src/confidence.js
          node --check src/decisionLog.js
          node --check src/engine.js
          node --check src/backtest.js
          node --check src/repository.js
          node --check src/ablation.js
          node --check api/index.js
          node --check api/session-monitor.js
          node --check monitor/session-quote.js
          node --check public/ui-v169.js
          node --check public/session-monitor-core.js
          node --check public/session-monitor.js
          node --check public/ops-v169.js
          node --check stability/frozen-runtime-contract.js
          node --check sidecars/forward-evidence.js
          node --check sidecars/data-verification.js
          node --check sidecars/history-depth.js
          node --check sidecars/regime-analysis.js
          node --check sidecars/long-history-validation.js
          node --check scripts/snapshot-decision-log.mjs
          node --check scripts/sidecar-audit.mjs
          node --check scripts/evaluate-forward.mjs
          node --check scripts/regime-report.mjs
          node --check scripts/long-history-validation.mjs
      - name: Full functional and destructive tests
        run: npm test
      - name: Independent red-team stability gate
        run: npm run red-team
      - name: Stage exact runtime artifact
        if: success()
        run: |
          rm -rf runtime-artifact
          mkdir -p runtime-artifact
          cp package.json vercel.json runtime-artifact/
          cp -R src api monitor public runtime-artifact/
      - name: Upload exact runtime artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tfe-v20-runtime
          path: tfe-v20/runtime-artifact
          if-no-files-found: error
          retention-days: 1
      - name: Check Vercel token availability
        id: vercel_creds
        if: success()
        shell: bash
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel token is configured; exact runtime preview deployment is enabled."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Vercel token is not configured in GitHub Actions; artifact remains validated but undeployed by CI."
          fi
      - name: Deploy exact runtime artifact to Vercel preview
        if: steps.vercel_creds.outputs.available == 'true'
        shell: bash
        working-directory: tfe-v20/runtime-artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
          VERCEL_PROJECT_ID: prj_gXmmVe1QqGFJ9nsv30uu0emLqIdY
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          PREVIEW_URL="$(vercel deploy --yes --token "$VERCEL_TOKEN")"
          echo "TFE_V20_PREVIEW_URL=$PREVIEW_URL"
          printf '%s\n' "$PREVIEW_URL" > preview-url.txt
      - name: Upload preview URL
        if: steps.vercel_creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfe-v20-preview-url
          path: tfe-v20/runtime-artifact/preview-url.txt
          if-no-files-found: error
          retention-days: 1

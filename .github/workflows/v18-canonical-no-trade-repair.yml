name: Repair V18 Canonical No-Trade Session Handling

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v18-canonical-no-trade-repair.yml"

permissions:
  contents: write

concurrency:
  group: v18-canonical-no-trade-repair
  cancel-in-progress: false

env:
  V18_BRANCH: v18-global-strategy-ensemble-20260906

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout V18 branch
        uses: actions/checkout@v4
        with:
          ref: v18-global-strategy-ensemble-20260906
          path: v18
          fetch-depth: 0

      - name: Patch V18 engine to accept a current canonical no-trade session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('v18/scripts/stable/v18-global-strategy-ensemble.cjs')
          text = p.read_text(encoding='utf-8')

          old = """  const daily = readJson(path.join(ROOT, 'data/quant/daily-recommendations.json'), {});\n  const adaptive = readJson(path.join(ROOT, 'data/quant/adaptive-daily-recommendations.json'), {});\n  const stocks = loadStockDetails();\n"""
          new = """  const dailyRaw = readJson(path.join(ROOT, 'data/quant/daily-recommendations.json'), {});\n  const adaptiveRaw = readJson(path.join(ROOT, 'data/quant/adaptive-daily-recommendations.json'), {});\n  const stocks = loadStockDetails();\n"""
          if old not in text:
              raise SystemExit('V18 source-load block changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """  const v169ModelId = String(v169?.selectedModel?.id || '');\n  const v169Session = v169?.sessionDate || v169?.sessionId || null;\n  const v169Recommendations = Array.isArray(v169?.recommendations) ? v169.recommendations : [];\n  if (v169ModelId !== 'V16_9_EQUAL_WEIGHT_BASKET') {\n    throw new Error(`V18 refuses non-canonical V16.9 source: selectedModel.id=${v169ModelId || 'missing'}`);\n  }\n  if (v169.practicalReady !== true) {\n    throw new Error('V18 refuses V16.9 source because practicalReady is not true');\n  }\n  if (!v169Session || v169Recommendations.length === 0) {\n    throw new Error('V18 canonical V16.9 source is missing session or recommendations');\n  }\n"""
          new = """  const v169ModelId = String(v169?.selectedModel?.id || '');\n  const v169Session = v169?.sessionDate || v169?.sessionId || null;\n  const v169Recommendations = Array.isArray(v169?.recommendations) ? v169.recommendations : [];\n  const v169CurrentSessionReady = v169?.currentSessionReady === true || v169?.freshness?.currentSessionReady === true;\n  const v169SourceSessionReady = v169?.basketPlan?.sourceSessionReady === true || v169?.freshness?.isFresh === true;\n  const dailySession = dailyRaw?.sessionDate || dailyRaw?.sessionId || null;\n  const adaptiveSession = adaptiveRaw?.sessionDate || adaptiveRaw?.sessionId || null;\n  const daily = dailySession === v169Session ? dailyRaw : {};\n  const adaptive = adaptiveSession === v169Session ? adaptiveRaw : {};\n  if (v169ModelId !== 'V16_9_EQUAL_WEIGHT_BASKET') {\n    throw new Error(`V18 refuses non-canonical V16.9 source: selectedModel.id=${v169ModelId || 'missing'}`);\n  }\n  if (!v169Session || !v169CurrentSessionReady || !v169SourceSessionReady) {\n    throw new Error(`V18 refuses V16.9 source because canonical session is not current/verified: session=${v169Session || 'missing'} current=${v169CurrentSessionReady} source=${v169SourceSessionReady}`);\n  }\n  if (!Array.isArray(v169?.recommendations)) {\n    throw new Error('V18 canonical V16.9 recommendations field is invalid');\n  }\n"""
          if old not in text:
              raise SystemExit('V18 canonical gate changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """  const extendedMomentumWatch = Array.isArray(v169?.extendedMomentumWatch)\n    ? v169.extendedMomentumWatch\n    : (Array.isArray(legacyPractical?.extendedMomentumWatch) ? legacyPractical.extendedMomentumWatch : []);\n"""
          new = """  const extendedMomentumWatch = v169.practicalReady === true\n    ? (Array.isArray(v169?.extendedMomentumWatch)\n      ? v169.extendedMomentumWatch\n      : (Array.isArray(legacyPractical?.extendedMomentumWatch) ? legacyPractical.extendedMomentumWatch : []))\n    : [];\n"""
          if old not in text:
              raise SystemExit('V18 extended-watch block changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """        acceptedAs: 'V16_9_BASKET'\n"""
          new = """        acceptedAs: v169.practicalReady === true ? 'V16_9_BASKET' : 'V16_9_CURRENT_NO_TRADE'\n"""
          if old not in text:
              raise SystemExit('V18 provenance acceptedAs field changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """      canonicalV169Truth: 'V16_9_BASKET can only be sourced from data/stable/v16-main-app-current.json when selectedModel.id is V16_9_EQUAL_WEIGHT_BASKET and practicalReady is true.'\n"""
          new = """      canonicalV169Truth: 'V16.9 is accepted only from data/stable/v16-main-app-current.json when the engine id and verified current session match. practicalReady=false is a valid canonical NO_TRADE outcome and contributes zero V16.9 basket votes.'\n"""
          if old not in text:
              raise SystemExit('V18 diagnostic truth string changed; refusing blind patch')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
          node --check v18/scripts/stable/v18-global-strategy-ensemble.cjs
          grep -q "V16_9_CURRENT_NO_TRADE" v18/scripts/stable/v18-global-strategy-ensemble.cjs
          grep -q "dailySession === v169Session" v18/scripts/stable/v18-global-strategy-ensemble.cjs
          grep -q "adaptiveSession === v169Session" v18/scripts/stable/v18-global-strategy-ensemble.cjs

      - name: Persist V18 engine repair first
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stable/v18-global-strategy-ensemble.cjs
          if ! git diff --cached --quiet; then
            git commit -m "fix(v18): accept verified canonical no-trade sessions"
            git pull --rebase origin "$V18_BRANCH"
            git push origin HEAD:"$V18_BRANCH"
          fi

      - name: Patch V18 coordinator to follow canonical V16.9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/v18-durable-coordinator.yml')
          text = p.read_text(encoding='utf-8')

          old = '      - "EGX V16.3.3 Immediate Market Rescan and Deploy"'
          new = '      - "EGX MAIN APP V16.9.2 P2 Automatic Scan"'
          if old not in text:
              raise SystemExit('V18 workflow_run trigger changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """          if(v169.practicalReady!==true) throw new Error('Canonical V16.9 practicalReady is not true');\n          if(!Array.isArray(v169.recommendations)||v169.recommendations.length<1) throw new Error('Canonical V16.9 recommendations are missing');\n"""
          new = """          if(v169.currentSessionReady!==true) throw new Error('Canonical V16.9 currentSessionReady is not true');\n          if(v169?.basketPlan?.sourceSessionReady!==true && v169?.freshness?.isFresh!==true) throw new Error('Canonical V16.9 source session is not verified');\n          if(!Array.isArray(v169.recommendations)) throw new Error('Canonical V16.9 recommendations field is invalid');\n"""
          if old not in text:
              raise SystemExit('V18 canonical session gate changed; refusing blind patch')
          text = text.replace(old, new, 1)

          old = """          const provenance=out.sourceProvenance?.v16_9;\n          if(!provenance||provenance.path!=='data/stable/v16-main-app-current.json'||provenance.selectedModelId!=='V16_9_EQUAL_WEIGHT_BASKET'||provenance.sessionId!==expected||provenance.practicalReady!==true) throw new Error('V18 canonical V16.9 provenance gate failed');\n          const canonicalTickers=(canonical.recommendations||[]).map(x=>String(x.ticker||'').toUpperCase()).filter(Boolean);\n"""
          new = """          const provenance=out.sourceProvenance?.v16_9;\n          const canonicalTickers=(canonical.recommendations||[]).map(x=>String(x.ticker||'').toUpperCase()).filter(Boolean);\n          if(!provenance||provenance.path!=='data/stable/v16-main-app-current.json'||provenance.selectedModelId!=='V16_9_EQUAL_WEIGHT_BASKET'||provenance.sessionId!==expected) throw new Error('V18 canonical V16.9 provenance gate failed');\n          if(Boolean(provenance.practicalReady)!==Boolean(canonical.practicalReady)) throw new Error('V18 canonical V16.9 practicalReady provenance mismatch');\n          if(Number(provenance.recommendationCount||0)!==canonicalTickers.length) throw new Error('V18 canonical V16.9 recommendation-count provenance mismatch');\n"""
          if old not in text:
              raise SystemExit('V18 output provenance gate changed; refusing blind patch')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')
          PY
          grep -q 'EGX MAIN APP V16.9.2 P2 Automatic Scan' .github/workflows/v18-durable-coordinator.yml
          grep -q 'currentSessionReady is not true' .github/workflows/v18-durable-coordinator.yml
          grep -q 'recommendation-count provenance mismatch' .github/workflows/v18-durable-coordinator.yml

      - name: Persist coordinator repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v18-durable-coordinator.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(v18): follow canonical V16.9 no-trade sessions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Summarize repair
        shell: bash
        run: |
          set -euo pipefail
          echo "V18 engine and durable coordinator repaired."
          echo "The coordinator push will trigger a fresh V18 build from the current canonical session."

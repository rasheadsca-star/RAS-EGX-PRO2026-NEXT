name: V14.0 Stable Decision System

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v14-stable-decision-system.yml"
      - "data/quant/unified-autonomous-center-v13-14.json"
      - "data/quant/daily-decision-workspace-v13-11.json"
      - "data/quant/freshness-operating-state-v13-17-1.json"
      - "data/market-quality-acceptance-v13-17-1.json"
      - "data/market-quality-report.json"
      - "data/production-readiness-v13-17-1.json"
      - "data/history-summary.json"
      - "data/history/**"
  schedule:
    - cron: "30 7 * * 0-4"
    - cron: "30 11 * * 0-4"
    - cron: "30 15 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v14-stable-decision-system
  cancel-in-progress: true

jobs:
  build-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}

    steps:
      - name: Checkout confirmed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frozen V14.0 application payload
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/stable/v14-payload-01.txt ]; then
            cat data/stable/v14-payload-01.txt \
                data/stable/v14-payload-02.txt \
                data/stable/v14-payload-03.txt \
                data/stable/v14-payload-04.txt > /tmp/v14-payload.b64
            base64 --decode /tmp/v14-payload.b64 > /tmp/v14-payload.tar.gz
            echo "158d1389f30eb76eb0e5c4bfe8ca43649a14a3c24d55a99f1660e9f25d35d441  /tmp/v14-payload.tar.gz" | sha256sum --check -
            tar -xzf /tmp/v14-payload.tar.gz -C .
            rm -f data/stable/v14-payload-01.txt data/stable/v14-payload-02.txt data/stable/v14-payload-03.txt data/stable/v14-payload-04.txt
            echo "V14.0 frozen application payload installed."
          else
            test -f scripts/stable/v14-stable-decision-system.cjs
            test -f scripts/stable/v14-acceptance.cjs
            test -f preview-v14/app/index.html
            test -f data/stable/v14-policy.json
            echo "V14.0 application files already installed."
          fi

      - name: Build expanded historical evidence and stable decision
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v14-stable-decision-system.cjs
          node scripts/stable/v14-stable-decision-system.cjs

      - name: Validate V14.0 stable application
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v14-acceptance.cjs
          python3 - <<'PYUI'
          import re
          from pathlib import Path
          text=Path('preview-v14/app/index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S))
          Path('/tmp/v14-ui.js').write_text(scripts,encoding='utf-8')
          PYUI
          node --check /tmp/v14-ui.js
          node scripts/stable/v14-acceptance.cjs

      - name: Commit frozen V14.0 application and evidence state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stable/v14-stable-decision-system.cjs
          git add scripts/stable/v14-acceptance.cjs
          git add data/stable/v14-policy.json
          git add data/stable/v14-stable-decision.json
          git add data/stable/v14-forward-sessions.json
          git add preview-v14/app/index.html
          git add -u data/stable
          if git diff --cached --quiet; then
            echo "V14.0 files already match the latest confirmed inputs."
          else
            git commit -m "Build V14.0 stable decision system"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then
                echo "V14.0 evidence state committed."
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Unable to push V14.0 evidence state after three attempts."
                exit 1
              fi
              sleep $((attempt * 20))
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete repository site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy V14.0 attempt 1
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy V14.0 attempt 2
        if: steps.deploy1.outcome == 'failure'
        id: deploy2
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deployment retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120

      - name: Deploy V14.0 attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        id: deploy3
        uses: actions/deploy-pages@v4

      - name: Final V14.0 result
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const result=JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json','utf8'));
          console.log({
            version:result.schemaVersion,
            sessionDate:result.sessionDate,
            modelStage:result.system?.modelStage,
            watchlist:result.topFiveWatchlist?.map(x=>x.ticker),
            qualified:result.qualifiedRecommendations?.map(x=>x.ticker),
            noTrade:result.decision?.noTrade,
            automaticBrokerOrders:false,
            finalUrl:'https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/preview-v14/app/'
          });
          NODE

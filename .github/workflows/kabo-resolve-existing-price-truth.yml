name: KABO Resolve Existing Price Truth

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kabo-resolve-existing-price-truth.yml"

permissions:
  contents: write

concurrency:
  group: kabo-resolve-existing-price-truth
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate evidence and resolve false KABO hold
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/history/KABO.json';
          const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
          const last = Array.isArray(doc.sessions) ? doc.sessions.at(-1) : null;
          const truth = doc.priceTruthLatest || null;
          const fail = (message) => { throw new Error(message); };

          if (doc.ticker !== 'KABO') fail('Unexpected ticker');
          if (doc.symbolVerified !== true) fail('KABO identity is not verified');
          if (!last || !truth) fail('Missing latest session or priceTruthLatest');
          if (last.date !== '2026-08-23' || truth.date !== last.date || truth.sourceSessionDate !== last.date) {
            fail(`Session evidence mismatch: last=${last.date}, truth=${truth.date}, sourceSession=${truth.sourceSessionDate}`);
          }
          if (Math.abs(Number(last.close) - Number(truth.close)) > 0.001) {
            fail(`Close mismatch: bar=${last.close}, truth=${truth.close}`);
          }
          if (truth.validationStatus !== 'precise_public_source_session_confirmed') {
            fail(`Price truth is not session-confirmed: ${truth.validationStatus}`);
          }
          if (Number(truth.confidence || 0) < 80) fail(`Price truth confidence too low: ${truth.confidence}`);
          if (!String(truth.source || '').includes('mubasher')) fail(`Unexpected evidence source: ${truth.source}`);
          const previous = doc.sessions.at(-2);
          const jumpPct = previous?.close > 0 ? Math.abs(Number(last.close) / Number(previous.close) - 1) * 100 : Infinity;
          if (!(jumpPct <= 20)) fail(`Latest session jump is not safe to auto-reconcile: ${jumpPct.toFixed(3)}%`);

          const before = [...(doc.warnings || [])];
          const falseConflict = before.find(x => /^latest_close_conflict:/i.test(String(x)));
          if (!falseConflict) {
            console.log('KABO has no top-level latest_close_conflict; nothing to remove.');
          }
          doc.warnings = before.filter(x => !/^latest_close_conflict:/i.test(String(x)));

          if (doc.symbolVerification) {
            doc.symbolVerification.warnings = (doc.symbolVerification.warnings || [])
              .filter(x => !/^latest_price_far_from_local_reference:/i.test(String(x)));
            if (doc.symbolVerification.evidence) {
              doc.symbolVerification.evidence.localReferenceClose = null;
              doc.symbolVerification.evidence.localDifferencePct = null;
            }
          }

          doc.priceReconciliation = {
            status: 'RESOLVED',
            resolvedAt: new Date().toISOString(),
            sessionDate: last.date,
            acceptedClose: Number(last.close),
            previousClose: Number(previous?.close ?? 0) || null,
            dailyJumpPct: Number(jumpPct.toFixed(4)),
            evidenceSource: truth.source,
            evidenceValidationStatus: truth.validationStatus,
            evidenceConfidence: Number(truth.confidence),
            sourceSessionDate: truth.sourceSessionDate,
            removedWarning: falseConflict || null,
            reason: 'STALE_DERIVATIVE_REFERENCE_EXCLUDED_BY_RECONCILIATION_POLICY'
          };
          doc.generatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(doc, null, 2) + '\n');
          console.log(JSON.stringify(doc.priceReconciliation, null, 2));
          NODE

      - name: Validate RC2 quality consequence locally
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { normalizeBars, assessDataQuality } from './tfe-v20/src/quality.js';
          const doc = JSON.parse(fs.readFileSync('data/history/KABO.json','utf8'));
          const bars = normalizeBars(doc.sessions).bars;
          const quality = assessDataQuality({
            bars,
            warnings: doc.warnings || [],
            updateFailed: doc.updateFailed,
            staleData: doc.staleData,
            expectedSessionDate: doc.lastSession,
            symbolVerified: doc.symbolVerified,
            symbolVerification: doc.symbolVerification,
            officiallyVerifiedLatestSession: doc.officiallyVerifiedLatestSession,
          });
          if (quality.publicationHold) throw new Error(`KABO remains held: ${quality.publicationHoldReason}`);
          if (quality.conflictPct !== null) throw new Error(`KABO conflict remains: ${quality.conflictPct}`);
          console.log(`KABO_QUALITY_RECONCILED:${JSON.stringify(quality)}`);
          NODE

      - name: Commit resolved KABO evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/KABO.json
          if git diff --cached --quiet; then
            echo "No KABO reconciliation change needed."
            exit 0
          fi
          git commit -m "Resolve KABO false price reconciliation hold from session-confirmed truth"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1

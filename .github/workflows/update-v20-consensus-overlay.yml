name: Update V20 Cross-Version Consensus Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-v20-consensus-overlay.yml"
  workflow_run:
    workflows:
      - "EGX V16.9 Basket Engine"
      - "EGX V19 CHAT GPT Isolated Research"
      - "V20 V17-Centric Clean Architecture Certification V5"
    types: [completed]
  schedule:
    - cron: "15 7-20 * * 0-4"

permissions:
  contents: write

concurrency:
  group: v20-cross-version-consensus-overlay
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V20 decision platform
        uses: actions/checkout@v6
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fetch independent engines read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          V19_SHA="$(git rev-parse refs/remotes/origin/v19-egx-chat-gpt)"
          mkdir -p .consensus-input
          git show "$MAIN_SHA:data/research/v16-v169-basket-engine.json" > .consensus-input/main-app-v169.json
          git show "$MAIN_SHA:data/research/v16-v169-target-hit-audit.json" > .consensus-input/v169-target-hit-audit.json
          git show "$V19_SHA:data/v19/native-challenger-v6.json" > .consensus-input/v19-native-challenger-v6.json
          for f in .consensus-input/*.json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; done
          echo "$MAIN_SHA" > .consensus-main-sha
          echo "$V19_SHA" > .consensus-v19-sha

      - name: Static consensus safety checks
        run: |
          node --check scripts/v20/build-cross-version-consensus.cjs
          node --check scripts/v20/cross-version-consensus-regression.cjs
          node --check v20/consensus-overlay.js
          node --check v20/native-research.js
          test -f v20/consensus-overlay.css
          test -z "$(grep -nE 'decision-board\.(js|css)' v20/native-research.js || true)" || { echo "Consensus loader must not inject core Decision Board assets"; exit 1; }

      - name: Build current and historical consensus evidence
        env:
          V20_CONSENSUS_MAIN_APP_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export V20_CONSENSUS_MAIN_APP_SHA="$(cat .consensus-main-sha)"
          export V20_CONSENSUS_V19_SHA="$(cat .consensus-v19-sha)"
          node scripts/v20/build-cross-version-consensus.cjs
          node scripts/v20/cross-version-consensus-regression.cjs

      - name: Require same-session independent comparison
        id: aligned
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(node -e "process.stdout.write(require('./data/v20/cross-version-consensus.json').status)")"
          if [ "$STATUS" != "CURRENT_SESSION_ALIGNED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "MAIN APP and V19 are not on the same session yet; keep prior certified consensus artifact."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Governance and invariance guard
        if: steps.aligned.outputs.publish == 'true'
        run: |
          node - <<'NODE'
          const x=require('./data/v20/cross-version-consensus.json');
          const r=require('./data/v20/cross-version-consensus-regression.json');
          if(!r.ok||r.failedCount!==0) throw Error('Consensus regression failed');
          if(x.governance.changesFinalDecision!==false||x.governance.changesExecutionPermission!==false) throw Error('Execution governance drift');
          if(x.governance.changesMainAppMethodology!==false||x.governance.changesV19Methodology!==false||x.governance.changesV20NativeRanking!==false) throw Error('Model methodology drift');
          if(x.governance.v17RemainsProductionAuthority!==true) throw Error('V17 authority drift');
          if(x.scoreDefinition.historicalPerformanceUsedInScore!==false) throw Error('Historical performance leaked into score');
          console.log(JSON.stringify({sessionDate:x.sessionDate,sharedTickers:x.current.sharedTickers,fullMainAppBasketAgreement:x.current.fullMainAppBasketAgreement,scoreFormula:x.scoreDefinition.formula},null,2));
          NODE

      - name: Persist consensus artifacts on V20 only
        if: steps.aligned.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20/cross-version-consensus.json data/v20/cross-version-consensus-regression.json
          staged="$(git diff --cached --name-only)"
          test -z "$(printf '%s\n' "$staged" | grep -Ev '^data/v20/cross-version-consensus(-regression)?\.json$' || true)" || { echo "Unexpected staged file"; exit 1; }
          if git diff --cached --quiet; then
            echo "Consensus artifacts already current."
            exit 0
          fi
          SESSION="$(node -e "process.stdout.write(require('./data/v20/cross-version-consensus.json').sessionDate)")"
          git commit -m "Refresh V20 cross-version consensus ${SESSION} [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin develop/v20-integrated-decision-platform
            if git rebase origin/develop/v20-integrated-decision-platform && git push origin HEAD:develop/v20-integrated-decision-platform; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            [ "$attempt" = "3" ] && exit 1
          done

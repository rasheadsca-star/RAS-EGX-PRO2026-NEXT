name: SEPA-X Add Historical Research Pool

on:
  push:
    branches:
      - develop/sepax-isolated-v1
    paths:
      - '.github/workflows/sepax-add-historical-research-pool.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add research-only calibration pool and feature capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          c=Path('sepa-x/src/concentration.js')
          s=c.read_text()
          marker='export function selectReviewQueue(rows=[],cfg={}){'
          fn="""export function selectHistoricalResearchPool(rows=[],cfg={},options={}){
            const policy=concentrationPolicy(cfg),maxPerSignal=Math.max(1,Math.floor(Number(options.maxPerSignal??10)||10)),maxFailedRules=Math.max(0,Math.floor(Number(options.maxFailedRules??2)||0)),minFinalScore=finite(options.minFinalScore)?Number(options.minFinalScore):60;
            const researchPolicy={...policy,minRewardRisk:Math.min(policy.minRewardRisk,1.5),maxRiskPct:Math.max(policy.maxRiskPct,10),requireCleanEngineGates:false};
            return (rows||[]).filter(row=>{
              if(!row||!ACTIONABLE_STATUSES.has(row.status))return false;
              if(researchPolicy.allowBear===false&&String(row.market_regime||'').toUpperCase()==='BEAR')return false;
              if(String(row.action||'').includes('WAIT')||row?.audit_stages?.entry?.raw?.do_not_chase===true)return false;
              if(Number(row.final_score??0)<minFinalScore)return false;
              const failed=[...new Set((Array.isArray(row.failed_rules)?row.failed_rules:[]).filter(Boolean))];
              if(failed.includes(CORPORATE_ACTION_REVIEW)||failed.length>maxFailedRules)return false;
              return riskPlanReason(row,researchPolicy)===null;
            }).map(row=>({...row,concentration_score:concentrationScore(row),target_plan:buildTargetPlan(row,researchPolicy),research_only:true,execution_allowed:false,research_failed_rules:[...(row.failed_rules||[])],research_failed_rule_count:(row.failed_rules||[]).length})).sort((a,b)=>(b.concentration_score??-1)-(a.concentration_score??-1)||(b.final_score??-1)-(a.final_score??-1)||(b.confidence_score??-1)-(a.confidence_score??-1)||a.symbol.localeCompare(b.symbol)).slice(0,maxPerSignal).map((row,i)=>({...row,research_rank:i+1}));
          }

          """
          if 'selectHistoricalResearchPool' not in s:
            if marker not in s: raise SystemExit('CONCENTRATION_MARKER_NOT_FOUND')
            s=s.replace(marker,fn+marker,1)
          c.write_text(s)

          p=Path('sepa-x/src/historical-simulator.js')
          s=p.read_text()
          s=s.replace("import { selectConcentratedRecommendations } from './concentration.js';","import { selectConcentratedRecommendations, selectHistoricalResearchPool } from './concentration.js';",1)
          feature_marker='    cycleSamples:cycle?.raw?.samples??null,\n'
          feature_block="""    cycleSamples:cycle?.raw?.samples??null,
            finalScore:rec?.final_score??null,
            strengthScore:rec?.strength_score??null,
            setupClarityScore:rec?.setup_clarity_score??null,
            entryReadinessScore:rec?.entry_readiness_score??null,
            confidenceScore:rec?.confidence_score??null,
            distanceToPivotPct:rec?.distance_to_pivot_pct??null,
            plannedRiskPct:rec?.risk_pct??null,
            rewardRisk:rec?.reward_risk??null,
            rsPercentile:rec?.rs_percentile??null,
            sectorRs:rec?.sector_rs??null,
            vcpQuality:rec?.vcp?.quality??null,
            volumeDryUpScore:rec?.volume?.dry_up_score??null,
            breakoutVolumeRatio:rec?.volume?.breakout_ratio??null,
            accumulationScore:rec?.volume?.accumulation_score??null,
            marketRank:rec?.market_rank??null,
            marketPercentile:rec?.market_percentile??null,
            marketRegime:rec?.market_regime??null,
            failedRules:Array.isArray(rec?.failed_rules)?[...rec.failed_rules]:[],
          """
          if 'finalScore:rec?.final_score' not in s:
            if feature_marker not in s: raise SystemExit('FEATURE_MARKER_NOT_FOUND')
            s=s.replace(feature_marker,feature_block,1)
          s=s.replace('  const trades=[],signals=[];','  const trades=[],researchTrades=[],signals=[];',1)
          sel='    const selected=selectConcentratedRecommendations(scan.all||[],config.concentration);\n'
          repl="""    const selected=selectConcentratedRecommendations(scan.all||[],config.concentration);
            const researchPool=selectHistoricalResearchPool(scan.all||[],config.concentration,{maxPerSignal:10,maxFailedRules:2,minFinalScore:60});
          """
          if 'const researchPool=selectHistoricalResearchPool' not in s:
            if sel not in s: raise SystemExit('SELECT_MARKER_NOT_FOUND')
            s=s.replace(sel,repl,1)
          old_signal="    signals.push({date:asOf,marketRegime:scan.market_status?.Regime??null,selected:selected.map(x=>({symbol:x.symbol,rank:x.conviction_rank,conviction:x.concentration_score,status:x.status,precisionTarget:x.target_plan?.precisionTarget??null,target1:x.target_plan?.primaryTarget?.price??null,rr:x.reward_risk,...strategyTag(x)}))});"
          new_signal="    signals.push({date:asOf,marketRegime:scan.market_status?.Regime??null,researchPoolCount:researchPool.length,selected:selected.map(x=>({symbol:x.symbol,rank:x.conviction_rank,conviction:x.concentration_score,status:x.status,precisionTarget:x.target_plan?.precisionTarget??null,target1:x.target_plan?.primaryTarget?.price??null,rr:x.reward_risk,...strategyTag(x)}))});"
          if old_signal not in s: raise SystemExit('SIGNAL_MARKER_NOT_FOUND')
          s=s.replace(old_signal,new_signal,1)
          eval_line='    for(const rec of selected){const full=data.histories.get(rec.symbol)||[];trades.push(evaluatePick(rec,full,asOf,{entryExpirySessions,maxHoldSessions,roundTripCostPct}));}\n'
          eval_repl=eval_line+"    for(const rec of researchPool){const full=data.histories.get(rec.symbol)||[];researchTrades.push(evaluatePick(rec,full,asOf,{entryExpirySessions,maxHoldSessions,roundTripCostPct}));}\n"
          if 'researchTrades.push(evaluatePick' not in s:
            if eval_line not in s: raise SystemExit('EVAL_MARKER_NOT_FOUND')
            s=s.replace(eval_line,eval_repl,1)
          s=s.replace("schemaVersion:'sepa-x-historical-simulator.4'","schemaVersion:'sepa-x-historical-simulator.5'",1)
          method="strategyLabMode:'CHALLENGER',strategyPromotionRequiresValidation:true"
          method_repl="strategyLabMode:'CHALLENGER',strategyPromotionRequiresValidation:true,researchCalibrationPool:{maxPerSignal:10,maxFailedRules:2,minFinalScore:60,executionImpact:'NONE_RESEARCH_ONLY'}"
          if method not in s: raise SystemExit('METHODOLOGY_RESEARCH_MARKER_NOT_FOUND')
          s=s.replace(method,method_repl,1)
          ret='    summary,signals,trades,errors:data.errors,\n'
          ret_repl='    summary,researchSummary:summarizeTrades(researchTrades,signals),signals,trades,researchTrades,errors:data.errors,\n'
          if ret not in s: raise SystemExit('RETURN_MARKER_NOT_FOUND')
          s=s.replace(ret,ret_repl,1)
          p.write_text(s)
          PY

          cat > sepa-x/test/historical-research-pool.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { selectHistoricalResearchPool } from '../src/concentration.js';

          const row=(symbol,score,failed=[])=>({
            symbol,status:'READY NOW',market_regime:'BULL',action:'BUY',final_score:score,confidence_score:80,rs_percentile:80,vcp:{quality:75},reward_risk:2,risk_pct:5,entry_zone:{from:100,to:101},stop_loss:96,failed_rules:failed,audit_stages:{entry:{raw:{do_not_chase:false}},risk:{raw:{}}}
          });

          test('historical research pool is broader but never executable',()=>{
            const rows=[row('AAA',90),row('BBB',89,['ONE_RESEARCH_BLOCKER']),row('CCC',88,['A','B']),row('DDD',87,['A','B','C'])];
            const out=selectHistoricalResearchPool(rows,{}, {maxPerSignal:10,maxFailedRules:2,minFinalScore:60});
            assert.deepEqual(out.map(x=>x.symbol),['AAA','BBB','CCC']);
            assert.ok(out.every(x=>x.research_only===true&&x.execution_allowed===false&&x.target_plan?.valid===true));
            assert.equal(out[1].research_failed_rule_count,1);
          });
          EOF

          node --check sepa-x/src/concentration.js
          node --check sepa-x/src/historical-simulator.js
          cd sepa-x && npm test

      - name: Commit research layer and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sepax-add-historical-research-pool.yml
          git add sepa-x/src/concentration.js sepa-x/src/historical-simulator.js sepa-x/test/historical-research-pool.test.js
          git commit -m 'feat(sepa-x): add research-only historical calibration pool'
          git push origin HEAD:develop/sepax-isolated-v1

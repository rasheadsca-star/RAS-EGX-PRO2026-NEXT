# The V4-only Pages deployment was intentionally retired on 2026-10-31.
# It competed with static.yml, which publishes repository root and preserves
# /RAS-EGX-PRO2026-NEXT/paper-v4/index.html. Do not deploy a second Pages artifact.
name: Independent Paper V4 source verification (no Pages deployment)
on:
  push:
    branches: [main]
    paths:
      - 'paper-v4/**'
      - '.github/workflows/independent-paper-pages.yml'
  pull_request:
    paths:
      - 'paper-v4/**'
      - '.github/workflows/independent-paper-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent V4 page without changing any deployment
        run: |
          set -euo pipefail
          test -s paper-v4/index.html
          grep -q 'Independent Paper Trading V4' paper-v4/index.html
          grep -q '2026-10-29' paper-v4/index.html
          ! grep -q 'astra-prod/app' paper-v4/index.html
          echo 'V4_SOURCE_CHECK_PASS_NO_DEPLOY'

name: Deploy Independent Paper V4 static preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'paper-v4/**'
      - '.github/workflows/independent-paper-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: independent-paper-v4-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent preview source
        run: |
          test -f paper-v4/index.html
          grep -q 'Independent Paper Trading V4' paper-v4/index.html
          ! grep -q 'astra-prod/app' paper-v4/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: paper-v4
      - id: deployment
        uses: actions/deploy-pages@v4

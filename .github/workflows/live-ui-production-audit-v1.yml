name: Live UI Production Audit V1
on:
  push:
    branches:
      - research/data-completion-deep-repair-v1-20260828
  workflow_dispatch:
concurrency:
  group: live-ui-production-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check scripts/research/deep-data-completion-audit.cjs
          node --check scripts/research/research-history-repair-v1.cjs
          node --check gann-fusion-x/scripts/sync-sepa.cjs
          node --check gann-fusion-x/scripts/data-quality-enrichment.cjs
          node --check gann-fusion-x/scripts/data-readiness-gate.cjs
          node --check gann-fusion-x/scripts/forward-shadow-v2.cjs
          node --check gann-fusion-x/scripts/forward-shadow-check.cjs
          node --check gann-fusion-x/scripts/publish-live-ui-snapshot.cjs
          node --check gann-fusion-x/app/app.js
          node --check gann-fusion-x/review/data-completion-destroyer-v2.cjs
          node --check gann-fusion-x/review/engine-destroyer-v1.cjs
          node --check gann-fusion-x/review/ranking-destroyer-v1.cjs
          node --check gann-fusion-x/review/forward-shadow-destroyer-v1.cjs
          node --check gann-fusion-x/review/live-ui-production-destroyer-v1.cjs
          node --check gann-fusion-x/scripts/live-ui-browser-check.cjs
      - name: Refresh SEPA read-only mirror
        run: node gann-fusion-x/scripts/sync-sepa.cjs
      - name: Deep inventory
        env:
          DEEP_DATA_LIVE_STARTA: 'false'
          DEEP_DATA_STARTA_LIMIT: '0'
        run: node scripts/research/deep-data-completion-audit.cjs
      - name: Verified research history repair
        run: node scripts/research/research-history-repair-v1.cjs
      - name: OHLCV liquidity and risk enrichment
        run: node gann-fusion-x/scripts/data-quality-enrichment.cjs
      - name: Strict data readiness gate
        run: node gann-fusion-x/scripts/data-readiness-gate.cjs
      - name: Data Destroyer V2
        run: node gann-fusion-x/review/data-completion-destroyer-v2.cjs
      - name: Engine Destroyer V1
        run: node gann-fusion-x/review/engine-destroyer-v1.cjs
      - name: Ranking Destroyer V1
        run: node gann-fusion-x/review/ranking-destroyer-v1.cjs
      - name: Forward shadow capture
        run: node gann-fusion-x/scripts/forward-shadow-v2.cjs
      - name: Forward structural check
        run: node gann-fusion-x/scripts/forward-shadow-check.cjs
      - name: Forward Destroyer V1
        run: node gann-fusion-x/review/forward-shadow-destroyer-v1.cjs
      - name: Build safe live UI publication
        run: node gann-fusion-x/scripts/publish-live-ui-snapshot.cjs
      - name: Live UI Production Destroyer V1
        id: live_destroyer
        continue-on-error: true
        run: node gann-fusion-x/review/live-ui-production-destroyer-v1.cjs
      - name: Install Playwright Chromium
        if: steps.live_destroyer.outcome == 'success'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser consistency smoke
        if: steps.live_destroyer.outcome == 'success'
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . >/tmp/gfx-live-ui-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/gann-fusion-x/app/index-v1.html >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Live UI test server exited before becoming ready'
              cat /tmp/gfx-live-ui-http.log || true
              exit 1
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Live UI test server did not become ready'
            cat /tmp/gfx-live-ui-http.log || true
            exit 1
          fi
          if ! node gann-fusion-x/scripts/live-ui-browser-check.cjs; then
            echo 'Browser smoke failed; HTTP server log follows'
            cat /tmp/gfx-live-ui-http.log || true
            exit 1
          fi
      - name: Live UI findings summary
        if: always()
        run: cat gann-fusion-x/data/live-ui-production-destroyer-v1.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Enforce Live UI Production Destroyer V1
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='gann-fusion-x/data/live-ui-production-destroyer-v1.json';
          if(!fs.existsSync(p)) throw new Error('Live UI Production Destroyer report missing');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          console.log(JSON.stringify({passed:r.passed,critical:r.critical,major:r.major,minor:r.minor,summary:r.summary},null,2));
          if(!r.passed) process.exit(1);
          NODE
      - name: Upload live production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-production-audit-v1
          retention-days: 30
          path: |
            gann-fusion-x/data/live-ui-current-v1.json
            gann-fusion-x/data/live-ui-production-destroyer-v1.json
            gann-fusion-x/data/live-ui-production-destroyer-v1.md
            gann-fusion-x/data/live-ui-browser-check-v1.json
            gann-fusion-x/data/data-readiness-current-v1.json
            gann-fusion-x/data/forward-shadow-report.json
            gann-fusion-x/data/forward-shadow-destroyer-v1.json
            gann-fusion-x/data/data-completion-destroyer-v2.json
            gann-fusion-x/data/engine-destroyer-v1.json
            gann-fusion-x/data/ranking-destroyer-v1.json

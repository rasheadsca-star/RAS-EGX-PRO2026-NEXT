name: EGX Native Stock Intelligence & Portfolio — V13.7

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "EGX V16.3.3 Immediate Market Rescan and Deploy"
    types:
      - completed
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/egx-native-stock-portfolio-v13-7.yml"
      - "scripts/quant/v13-7-stock-intelligence.cjs"
      - "scripts/quant/v13-7-acceptance.cjs"
      - "preview-v13/app/portfolio.html"
      - "preview-v13/app/portfolio-technical-scenarios.js"
      - "preview-v13/app/portfolio-historical-calibration.js"
  schedule:
    # Primary post-close refresh.
    - cron: "30 13 * * 0-4"
    # Retry for delayed upstream market data; 14:50 UTC = 17:50 Cairo during DST.
    - cron: "50 14 * * 0-4"

permissions:
  contents: write
  pages: read # ASTRA_SINGLE_PUBLISHER: static.yml is the only Pages publisher
  id-token: write

concurrency:
  group: egx-native-stock-portfolio-v13-7
  cancel-in-progress: false

jobs:
  build-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build native stock intelligence
        run: |
          set -euo pipefail
          node --check preview-v13/app/portfolio-technical-scenarios.js
          node --check preview-v13/app/portfolio-historical-calibration.js
          grep -q "portfolio-historical-calibration.js" preview-v13/app/portfolio.html
          node scripts/quant/v13-7-stock-intelligence.cjs
          node scripts/quant/v13-7-acceptance.cjs
      - name: Commit V13.7 outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant/stock-intelligence-index.json data/quant/stocks
          if git diff --cached --quiet; then
            echo "No V13.7 data changes."
          else
            git commit -m "Update V13.7 native stock intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure Pages
        if: ${{ false }} # ASTRA_SINGLE_PUBLISHER: static.yml owns Pages artifacts/deploy
        uses: actions/configure-pages@v5
      - name: Upload repository
        if: ${{ false }} # ASTRA_SINGLE_PUBLISHER: static.yml owns Pages artifacts/deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy V13.7
        id: deployment
        run: |
          echo "ASTRA_SINGLE_PUBLISHER: direct Pages deployment retired; .github/workflows/static.yml is canonical."
          echo "page_url=https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/" >> "$GITHUB_OUTPUT"

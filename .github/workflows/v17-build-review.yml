name: EGX V17 Isolated Build Review

on:
  workflow_dispatch:
  push:
    branches: [develop/v17-rebuild]
    paths:
      - "preview-v17/**"
      - "scripts/v17/**"
      - "docs/v17/**"
      - "data/v17/challenger-candidate.json"
      - "data/stable/v16-v169-primary-decision.json"
      - "data/stable/v16-market-regime.json"
      - "data/stable/v16-live-evidence.json"
      - "data/research/v16-v169-basket-engine.json"
      - "data/research/v16-v169-target-hit-audit.json"
      - "data/history/**"
      - "data/market.json"
      - "data/fetch-status.json"
      - ".github/workflows/v17-build-review.yml"
  pull_request:
    branches: [main]
    paths: ["preview-v17/**","scripts/v17/**","docs/v17/**","data/v17/**",".github/workflows/v17-build-review.yml"]

permissions:
  contents: write
concurrency:
  group: egx-v17-isolated-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Checkout isolated V17 candidate
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Enforce V17 isolation
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then test "${GITHUB_REF_NAME}" = "develop/v17-rebuild"; fi
          pattern='git push[[:space:]].*(origin[[:space:]]+main|HEAD:main)'
          violations="$(grep -REn "$pattern" scripts/v17/ .github/workflows/v17-build-review.yml | grep -v 'pattern=' | grep -v 'dangerousPushLines' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
          ! grep -En 'uses:[[:space:]]+actions/deploy-pages' .github/workflows/v17-build-review.yml

      - name: Prove protected V16 application files are unchanged
        run: |
          set -euo pipefail
          git fetch origin release/v16.9.2-frozen-20260806:refs/remotes/origin/release/v16.9.2-frozen-20260806
          changed="$(git diff --name-only origin/release/v16.9.2-frozen-20260806...HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -E '^(index\.html|manifest\.json|service-worker\.js|preview-v16/.*|scripts/stable/.*|\.github/workflows/mobile-hotfix-deploy\.yml|\.github/workflows/v169-primary-pages-deploy\.yml)$' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Install browser runtime critic tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Static validation
        run: |
          set -euo pipefail
          for s in \
            scripts/v17/market-session-truth.cjs scripts/v17/repair-session-history.cjs \
            scripts/v17/build-internal-ohlc-sr.cjs scripts/v17/build-liquidity-gate.cjs \
            scripts/v17/resilient-session-gate.cjs scripts/v17/resolve-ledger.cjs \
            scripts/v17/challenger-gate.cjs scripts/v17/build-snapshot.cjs \
            scripts/v17/enrich-snapshot.cjs scripts/v17/finalize-snapshot.cjs \
            scripts/v17/snapshot-provenance-guard.cjs scripts/v17/review.cjs \
            scripts/v17/review-v5.cjs scripts/v17/regression.cjs scripts/v17/regression-v3.cjs scripts/v17/regression-v4.cjs \
            scripts/v17/browser-runtime-critic.cjs scripts/v17/destructive-critic-v2.cjs \
            scripts/v17/destructive-critic-v3.cjs scripts/v17/destructive-critic-v4.cjs; do node --check "$s"; done
          node --check preview-v17/app/app.js
          node --check preview-v17/app/confidence-governance.js
          test -s preview-v17/app/index.html && test -s preview-v17/app/styles.css
          if grep -R "v15-practical-decision.json\|v15-update-status.json\|decision-source.js\|adaptive-daily-recommendations.json\|v13-5-adaptive\|adaptive-recommendations.html" preview-v17/app; then exit 1; fi
          grep -q "data/v17/current.json" preview-v17/app/app.js

      - name: Resolve prior V17 signals conservatively
        run: node scripts/v17/resolve-ledger.cjs

      - name: Run champion challenger governance gate
        run: node scripts/v17/challenger-gate.cjs

      - name: Build enrich and finalize canonical V17 snapshot
        run: |
          set -euo pipefail
          node scripts/v17/build-snapshot.cjs
          node scripts/v17/enrich-snapshot.cjs
          node scripts/v17/finalize-snapshot.cjs
          node scripts/v17/snapshot-provenance-guard.cjs

      - name: Real Chromium runtime critic
        run: node scripts/v17/browser-runtime-critic.cjs

      - name: Independent current-session review V5
        run: node scripts/v17/review-v5.cjs

      - name: V17 native regression contract V4
        run: node scripts/v17/regression-v4.cjs

      - name: Snapshot provenance guard after regression
        run: node scripts/v17/snapshot-provenance-guard.cjs

      - name: Destructive adversarial critic V4
        run: node scripts/v17/destructive-critic-v4.cjs

      - name: Browser-facing zero-tolerance contract checks
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/v17-http.log 2>&1 &
          pid=$!; trap 'kill $pid || true' EXIT; sleep 2
          curl --fail --silent http://127.0.0.1:4173/preview-v17/app/index.html | grep -q "EGX Pro V17"
          curl --fail --silent http://127.0.0.1:4173/data/v17/current.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(!['READY_FOR_NEXT_SESSION_REVIEW','RESEARCH_READY_EXECUTION_BLOCKED'].includes(x.status))process.exit(1);if(x.engine.id!=='V16_9_EQUAL_WEIGHT_BASKET'||x.championChallenger.promotionAllowed!==false)process.exit(1);if(x.sessionDate!==x.sessionTruth?.verifiedSessionDate)process.exit(1);if(x.finalization?.staleChampionCurrentWeightsZeroed!==true)process.exit(1);if(x.championReference?.currentForMarketSession===false&&(Number(x.championReference?.plannedAllocationPct||0)!==0||(x.championReference?.recommendations||[]).some(r=>Number(r.portfolioWeightPct||0)!==0||Number(r.basketWeightPct||0)!==0||r.executionAllowed===true||r.monitorOnly!==true)))process.exit(1);})"
          curl --fail --silent http://127.0.0.1:4173/data/v17/browser-runtime-critic.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.schemaVersion!=='17.0.0-browser-runtime-critic-1'||x.verdict!=='NO_COMMENTS'||Number(x.totalFindings||0)!==0)process.exit(1);})"
          curl --fail --silent http://127.0.0.1:4173/data/v17/review.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.schemaVersion!=='17.0.0-review-5'||x.verdict!=='NO_COMMENTS'||Object.values(x.counts||{}).some(Number))process.exit(1);})"
          curl --fail --silent http://127.0.0.1:4173/data/v17/regression.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.schemaVersion!=='17.0.0-regression-4'||x.ok!==true||Number(x.failedCount||0)!==0)process.exit(1);})"
          curl --fail --silent http://127.0.0.1:4173/data/v17/destructive-critic.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.schemaVersion!=='17.0.0-destructive-critic-4'||x.verdict!=='NO_COMMENTS'||Number(x.totalFindings||0)!==0)process.exit(1);})"

      - name: Commit V17 evidence to isolated active branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test "$BRANCH_NAME" = "develop/v17-rebuild"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v17/current.json data/v17/ledger.json data/v17/challenger-status.json data/v17/review.json data/v17/regression.json data/v17/browser-runtime-critic.json data/v17/destructive-critic.json
          if ! git diff --cached --quiet; then
            git commit -m "Build review V17 zero-comment runtime evidence"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin "$BRANCH_NAME" && git push origin "HEAD:$BRANCH_NAME"; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 6))
            done
          fi

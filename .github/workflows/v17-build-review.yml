name: EGX V17 Build and Independent Review

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v17-rebuild
    paths:
      - "preview-v17/**"
      - "scripts/v17/**"
      - "docs/v17/**"
      - "data/stable/v16-v169-primary-decision.json"
      - "data/stable/v16-market-regime.json"
      - "data/stable/v16-live-evidence.json"
      - "data/fetch-status.json"
      - ".github/workflows/v17-build-review.yml"

permissions:
  contents: write

concurrency:
  group: egx-v17-build-review
  cancel-in-progress: true

jobs:
  build-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout V17 development branch
        uses: actions/checkout@v4
        with:
          ref: develop/v17-rebuild
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static validation
        run: |
          set -euo pipefail
          node --check scripts/v17/build-snapshot.cjs
          node --check scripts/v17/review.cjs
          node --check preview-v17/app/app.js
          test -s preview-v17/app/index.html
          test -s preview-v17/app/styles.css
          if grep -R "v15-practical-decision.json\|v15-update-status.json\|decision-source.js" preview-v17/app; then
            echo "Legacy source reference detected in V17 app"
            exit 1
          fi

      - name: Build canonical V17 snapshot
        run: node scripts/v17/build-snapshot.cjs

      - name: Independent critic and destructive review
        run: node scripts/v17/review.cjs

      - name: Browser-facing smoke checks
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/v17-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/preview-v17/app/index.html | grep -q "EGX Pro V17"
          curl --fail --silent http://127.0.0.1:4173/data/v17/current.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.status!=='READY_FOR_NEXT_SESSION_REVIEW')process.exit(1);if(x.engine.id!=='V16_9_EQUAL_WEIGHT_BASKET')process.exit(1);})"
          curl --fail --silent http://127.0.0.1:4173/data/v17/review.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);if(x.counts.CRITICAL||x.counts.MAJOR)process.exit(1);})"

      - name: Commit review evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v17/current.json data/v17/ledger.json data/v17/review.json
          if ! git diff --cached --quiet; then
            git commit -m "Build and review V17 canonical release candidate"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin develop/v17-rebuild && git push origin HEAD:develop/v17-rebuild; then
                break
              fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 6))
            done
          fi

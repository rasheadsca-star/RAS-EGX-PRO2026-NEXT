name: V14.0 Session Truth Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v14-session-truth-recovery.yml"
  schedule:
    - cron: "45 16 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v14-stable-decision-system
  cancel-in-progress: true

jobs:
  recover-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout confirmed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve latest confirmed history session
        id: truth
        shell: bash
        run: |
          set -euo pipefail
          node scripts/history/history-summary-builder.cjs
          node - <<'NODE'
          const fs=require('fs');
          const summary=JSON.parse(fs.readFileSync('data/history-summary.json','utf8'));
          const daily=JSON.parse(fs.readFileSync('data/quant/daily-decision-workspace-v13-11.json','utf8'));
          const target=String(summary.latestMarketSession||'');
          const current=String(daily.sessionId||'');
          if(!/^\d{4}-\d{2}-\d{2}$/.test(target)) throw new Error(`Invalid latest history session: ${target}`);
          const recover=!current || target>current;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`target=${target}\ncurrent=${current}\nrecover=${recover}\n`);
          console.log({target,current,recover});
          NODE

      - name: Confirm stored session is recoverable
        if: steps.truth.outputs.recover == 'true'
        shell: bash
        env:
          TARGET_SESSION: ${{ steps.truth.outputs.target }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const target=process.env.TARGET_SESSION;
          const summary=JSON.parse(fs.readFileSync('data/history-summary.json','utf8'));
          const exact=(summary.symbols||[]).filter(x=>x.lastSession===target && x.sourceFile && x.symbolVerified && Number(x.availableSessions||0)>0);
          if(exact.length<100) throw new Error(`Recovery blocked: only ${exact.length} verified histories reached ${target}`);
          console.log(`Recovery evidence accepted: ${exact.length} verified histories at ${target}`);
          NODE

      - name: Reconfirm historical session finalization
        if: steps.truth.outputs.recover == 'true'
        shell: bash
        env:
          V13_14_SESSION_DATE: ${{ steps.truth.outputs.target }}
        run: |
          set -euo pipefail
          node scripts/postclose/v13-14-session-finalizer.cjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/postclose/latest-v13-14.json','utf8'));
          if(!['FINALIZED','ALREADY_FINALIZED'].includes(r.status)||r.targetPassed!==true) throw new Error(`Historical finalizer rejected ${r.sessionDate}: ${r.status}`);
          console.log(`Historical finalization confirmed: ${r.sessionDate} ${r.status}`);
          NODE

      - name: Rebuild exact-fresh universe for recovered session
        if: steps.truth.outputs.recover == 'true'
        shell: bash
        env:
          V13_10_SKIP_FETCH: "true"
          TARGET_SESSION: ${{ steps.truth.outputs.target }}
        run: |
          set -euo pipefail
          node scripts/history/history-summary-builder.cjs
          node scripts/history/v13-10-full-market-refresh.cjs
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const target=process.env.TARGET_SESSION;
          const report=JSON.parse(fs.readFileSync('data/postclose/latest-v13-14.json','utf8'));
          const summary=JSON.parse(fs.readFileSync('data/history-summary.json','utf8'));
          const calendar=JSON.parse(fs.readFileSync('data/session-calendar.json','utf8'));
          const freshness=JSON.parse(fs.readFileSync('data/quant/freshness-coverage-v13-10.json','utf8'));
          if(report.sessionDate!==target||!['FINALIZED','ALREADY_FINALIZED'].includes(report.status)||report.targetPassed!==true) throw new Error('Recovered finalizer state is invalid');
          for(const [name,value] of [['history',summary.latestMarketSession],['calendar',calendar.latestMarketSession],['freshness',freshness.latestMarketSession]]) if(value!==target) throw new Error(`${name} mismatch: ${value} != ${target}`);
          const tickers=[...new Set((freshness.exactFreshTickers||[]).map(x=>String(x||'').trim().toUpperCase()).filter(Boolean))];
          const coverage=Number(freshness.exactFreshCoveragePct||0);
          const full=freshness.targetPassed===true;
          const limited=freshness.neverUseLaggedHistoryForNewSignals===true&&tickers.length>=120&&coverage>=70;
          if(!full&&!limited) throw new Error(`Exact-fresh recovery insufficient: ${tickers.length} symbols, ${coverage}%`);
          const finalized=(summary.symbols||[]).filter(x=>x.lastSession===target).length;
          const state={
            version:'13.17.1',generatedAt:new Date().toISOString(),sessionDate:target,
            operatingMode:full?'FULL_MARKET_EXACT_FRESH':'PARTITIONED_EXACT_FRESH_ONLY',
            productionUniversePolicy:'EXACT_FRESH_ONLY',fullCoverageTargetPassed:full,
            canonicalCoverageTargetPct:Number(freshness.minimumTargetPct||80),actualExactFreshCoveragePct:coverage,
            minimumDegradedCoveragePct:70,minimumDegradedExactSymbols:120,finalizedSymbols:finalized,
            decisionHistories:Number(freshness.counts?.decisionHistories||0),exactFreshSymbols:tickers.length,
            blockedLaggingSymbols:Number(freshness.counts?.lagOneTradingDay||0)+Number(freshness.counts?.lagTwoOrMoreTradingDays||0)+Number(freshness.counts?.unknownLag||0),
            laggedSymbolsBlockedFromNewSignals:true,productionUniverseTickers:tickers,
            liveExecutionEnabled:false,automaticOrderSubmission:false,manualExecutionReviewOnly:true,
            warningAr:full?'تغطية الحداثة الكاملة اجتازت الهدف.':'وضع محدود: القرارات الجديدة محصورة في الأسهم المحدثة لنفس الجلسة.'
          };
          fs.mkdirSync('data/quant',{recursive:true});
          fs.writeFileSync('data/quant/freshness-operating-state-v13-17-1.json',JSON.stringify(state,null,2)+'\n');
          console.log({target,exactFresh:tickers.length,coverage,finalized,mode:state.operatingMode});
          NODE

      - name: Rebuild recovered production decision
        if: steps.truth.outputs.recover == 'true'
        shell: bash
        env:
          V13_10_SKIP_FETCH: "true"
          TARGET_SESSION: ${{ steps.truth.outputs.target }}
        run: |
          set -euo pipefail
          node scripts/history/history-summary-builder.cjs
          node scripts/history/v13-10-full-market-refresh.cjs
          node scripts/quant/v13-4-quant-engine.cjs
          node scripts/quant/v13-9-recommendation-audit.cjs
          node scripts/quant/v13-10-tiered-confidence.cjs
          node scripts/quant/v13-7-stock-intelligence.cjs
          node scripts/quant/v13-8-portfolio-risk.cjs
          node scripts/quant/v13-11-daily-decision.cjs
          node scripts/intraday/v13-12-intraday-monitor.cjs
          node scripts/quant/v13-13-live-rerank.cjs
          node scripts/quant/v13-14-unified-center.cjs
          node scripts/evidence/v13-15-paper-ledger.cjs
          node scripts/evidence/v13-15-strategy-health.cjs
          node scripts/quant/v13-14-unified-center.cjs
          V13_14_ACCEPTANCE_MODE=POSTCLOSE_CONFIRMED node scripts/quant/v13-14-acceptance.cjs
          node scripts/evidence/v13-15-evidence-acceptance.cjs
          node scripts/ops/v13-16-workflow-audit.cjs
          node scripts/lab/v13-16-shadow-diagnostics.cjs
          node scripts/lab/v13-17-momentum-money-flow.cjs
          node scripts/quant/v13-17-market-search-index.cjs
          node scripts/ops/v13-16-operational-health.cjs
          node scripts/ops/v13-16-daily-report.cjs
          node scripts/ops/v13-16-operational-acceptance.cjs
          node scripts/ops/v13-17-acceptance.cjs
          node scripts/research/v13-20-multi-session-ranking-backtest.cjs
          node scripts/ops/v13-20-acceptance.cjs
          node scripts/ops/v13-17-1-production-gate.cjs
          node - <<'NODE'
          const fs=require('fs');
          const target=process.env.TARGET_SESSION;
          const daily=JSON.parse(fs.readFileSync('data/quant/daily-decision-workspace-v13-11.json','utf8'));
          const tiered=JSON.parse(fs.readFileSync('data/quant/tiered-confidence-recommendations-v13-10.json','utf8'));
          const center=JSON.parse(fs.readFileSync('data/quant/unified-autonomous-center-v13-14.json','utf8'));
          const state=JSON.parse(fs.readFileSync('data/quant/freshness-operating-state-v13-17-1.json','utf8'));
          for(const [name,value] of [['daily',daily.sessionId],['tiered',tiered.sessionId],['center analysis',center.analysisSession],['operating state',state.sessionDate]]) if(value!==target) throw new Error(`${name} mismatch after recovery: ${value} != ${target}`);
          console.log(`SESSION TRUTH RECOVERED: ${target}`);
          NODE

      - name: Build and validate final V14.0
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v14-stable-decision-system.cjs
          node scripts/stable/v14-stable-decision-system.cjs
          node --check scripts/stable/v14-acceptance.cjs
          node scripts/stable/v14-acceptance.cjs
          node - <<'NODE'
          const fs=require('fs');
          const summary=JSON.parse(fs.readFileSync('data/history-summary.json','utf8'));
          const daily=JSON.parse(fs.readFileSync('data/quant/daily-decision-workspace-v13-11.json','utf8'));
          const result=JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json','utf8'));
          if(result.sessionDate!==daily.sessionId) throw new Error(`V14 session mismatch: ${result.sessionDate} != ${daily.sessionId}`);
          if(summary.latestMarketSession>result.sessionDate) throw new Error(`Stale V14 blocked: history=${summary.latestMarketSession}, V14=${result.sessionDate}`);
          if(result.system?.automaticBrokerOrders!==false) throw new Error('Automatic broker orders must remain disabled');
          console.log({sessionDate:result.sessionDate,watchlist:(result.topFiveWatchlist||[]).map(x=>x.ticker),qualified:(result.qualifiedRecommendations||[]).map(x=>x.ticker),noTrade:result.decision?.noTrade});
          NODE

      - name: Commit recovered session truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(
            data/history data/history-summary.json data/session-calendar.json data/postclose
            data/quant data/intraday data/evidence data/ops data/reports data/lab data/research
            data/production-readiness-v13-17-1.json data/stable
            preview-v13/app preview-v14/app
          )
          for item in "${paths[@]}"; do [ -e "$item" ] && git add "$item"; done
          if git diff --cached --quiet; then
            echo "Session truth already synchronized."
          else
            git commit -m "Recover latest confirmed session through V14.0"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt*20))
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload final repository site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy final V14.0
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Final session truth report
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json','utf8'));
          console.log({version:r.schemaVersion,sessionDate:r.sessionDate,noTrade:r.decision?.noTrade,automaticBrokerOrders:false,finalUrl:'https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/preview-v14/app/'});
          NODE

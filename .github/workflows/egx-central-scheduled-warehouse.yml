name: EGX Central - Periodic Research Warehouse
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/egx-central-scheduled-warehouse.yml"
  schedule:
    # Egypt market days Sunday-Thursday, after main market-data workflows.
    # Cron is UTC. Two collection windows reduce stale-source risk.
    - cron: '15 16,20 * * 0-4'
permissions:
  contents: write
  actions: read
concurrency:
  group: egx-central-scheduled-research
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated development importer
        uses: actions/checkout@v4
        with:
          ref: feature/egx-central-v4-safe-ingest-20261023
          persist-credentials: false
          fetch-depth: 1
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify importer tests
        run: python -m unittest discover -s egx-central -p 'test_*.py' -v
      - name: Rebuild central research warehouse from latest main and historical branches
        run: python egx-central/remote_branch_audit.py --output artifacts/egx-central-scheduled
      - name: Reconcile duplicates and preserve research-only status
        run: python egx-central/candidate_consensus.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --output artifacts/egx-central-scheduled
      - name: Fail-closed market-source promotion gate
        run: python egx-central/promotion_gate.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --output artifacts/egx-central-scheduled
      - name: Review latest source evidence and market session
        run: python egx-central/main_source_quality.py --output artifacts/egx-central-scheduled
      - name: Validate corporate-action snapshot availability
        run: python egx-central/check_corporate_actions.py --actions egx-central/data/corporate_actions.csv --output artifacts/egx-central-scheduled/corporate_action_source_status.json
      - name: Cross-check source splices against available corporate action records
        run: python egx-central/corporate_action_review.py --quality artifacts/egx-central-scheduled/main_source_quality.json --output artifacts/egx-central-scheduled --actions egx-central/data/corporate_actions.csv
      - name: Prepare hypothetical adjustment factors without modifying prices
        run: python egx-central/adjustment_proposals.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --actions egx-central/data/corporate_actions.csv --output artifacts/egx-central-scheduled
      - name: Generate research-only adjusted-close series (never a trading input)
        run: python egx-central/research_adjusted_close.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --proposals artifacts/egx-central-scheduled/corporate_action_adjustment_proposals.csv --output artifacts/egx-central-scheduled
      - name: Detect possible double adjustment in provider prices
        run: python egx-central/provider_adjustment_audit.py --output artifacts/egx-central-scheduled
      - name: Classify raw and provider-adjusted bars for research only
        run: python egx-central/research_price_eligibility.py --output artifacts/egx-central-scheduled
      - name: Report EGX research coverage and last observed session
        run: python egx-central/market_freshness.py --output artifacts/egx-central-scheduled
      - name: Recheck stale EGX public quote pages (read-only)
        run: node egx-central/targeted_retry.js artifacts/egx-central-scheduled/retry_candidates.json artifacts/egx-central-scheduled/targeted_retry_report.json
      - name: Probe free alternative public data feeds (quarantine only)
        run: node egx-central/free_source_fallback.js artifacts/egx-central-scheduled/retry_candidates.json artifacts/egx-central-scheduled/free_source_fallback_report.json
      - name: Compare free-source candles to main archive (quarantine only)
        run: python egx-central/free_source_reconcile.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --fallback artifacts/egx-central-scheduled/free_source_fallback_report.json --output artifacts/egx-central-scheduled
      - name: Triage unmatched sessions and source price conflicts
        run: python egx-central/free_feed_triage.py --db artifacts/egx-central-scheduled/branch_evidence.sqlite --fallback artifacts/egx-central-scheduled/free_source_fallback_report.json --output artifacts/egx-central-scheduled
      - name: Restore persistent research ledger first (fall back to last good artifact)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous-egx-ledger
          if gh api "repos/$GITHUB_REPOSITORY/branches/egx-research-ledger" >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch egx-research-ledger "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" previous-research-checkout
            cp previous-research-checkout/free_source_evidence.sqlite previous-egx-ledger/free_source_evidence.sqlite
            python egx-central/restore_evidence.py --source previous-egx-ledger/free_source_evidence.sqlite --dest artifacts/egx-central-scheduled/free_source_evidence.sqlite
            echo "Research ledger restored from permanent branch"
          else
            last_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow egx-central-scheduled-warehouse.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$last_id" ]]; then
              gh run download "$last_id" --repo "$GITHUB_REPOSITORY" --name egx-central-research-warehouse --dir previous-egx-ledger
              test -s previous-egx-ledger/free_source_evidence.sqlite
              python egx-central/restore_evidence.py --source previous-egx-ledger/free_source_evidence.sqlite --dest artifacts/egx-central-scheduled/free_source_evidence.sqlite
            else
              echo "First baseline: no prior permanent or successful artifact available"
            fi
          fi
      - name: Preserve quarantined candidate observations in evidence SQLite
        run: python egx-central/evidence_ledger.py --fallback artifacts/egx-central-scheduled/free_source_fallback_report.json --db artifacts/egx-central-scheduled/free_source_evidence.sqlite --report artifacts/egx-central-scheduled/free_source_evidence_report.json
      - name: Assert historical research ledger continuity
        shell: bash
        run: |
          set -euo pipefail
          prior=()
          if [[ -s previous-egx-ledger/free_source_evidence.sqlite ]]; then
            prior=(--previous previous-egx-ledger/free_source_evidence.sqlite)
          fi
          python egx-central/check_ledger_continuity.py "${prior[@]}" --current artifacts/egx-central-scheduled/free_source_evidence.sqlite --report artifacts/egx-central-scheduled/ledger_continuity_report.json
      - name: Assert warehouse integrity and no trading promotion
        run: python egx-central/verify_warehouse.py --output artifacts/egx-central-scheduled
      - name: Back up verified research ledger to dedicated history branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-backup
          git -C research-backup init
          git -C research-backup config user.name 'github-actions[bot]'
          git -C research-backup config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C research-backup remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C research-backup ls-remote --exit-code --heads origin egx-research-ledger >/dev/null; then
            git -C research-backup fetch --depth=1 origin egx-research-ledger
            git -C research-backup checkout -B egx-research-ledger FETCH_HEAD
            # Preserve old evidence and fail closed if anything disappeared.
            if [[ -s research-backup/free_source_evidence.sqlite ]]; then
              python egx-central/check_ledger_continuity.py --previous research-backup/free_source_evidence.sqlite --current artifacts/egx-central-scheduled/free_source_evidence.sqlite --report artifacts/egx-central-scheduled/git_backup_continuity.json
            fi
          else
            git -C research-backup checkout --orphan egx-research-ledger
          fi
          python egx-central/backup_evidence.py --db artifacts/egx-central-scheduled/free_source_evidence.sqlite --output research-backup/free_source_evidence.sqlite --manifest research-backup/manifest.json
          git -C research-backup add free_source_evidence.sqlite manifest.json
          if ! git -C research-backup diff --cached --quiet; then
            git -C research-backup commit -m "research: append-only evidence snapshot ${GITHUB_RUN_ID}"
            git -C research-backup push origin HEAD:refs/heads/egx-research-ledger
          fi
      - name: Publish database, immutable provenance and freshness report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egx-central-research-warehouse
          path: artifacts/egx-central-scheduled/
          retention-days: 30
          if-no-files-found: warn

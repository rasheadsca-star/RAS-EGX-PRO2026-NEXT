name: EGX V16.9 Target Hit Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-v169-target-hit-audit.py"
      - "scripts/research/v16-v169-basket-engine.py"
      - "scripts/research/v16-two-stage-predictor.py"
      - "data/history/**"
      - ".github/workflows/v16-v169-target-audit.yml"
  schedule:
    - cron: "35 13 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v169-target-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate audit source
        run: python -m py_compile scripts/research/v16-v169-target-hit-audit.py

      - name: Run exact twenty-session audit
        run: python scripts/research/v16-v169-target-hit-audit.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v169-twenty-session-target-audit
          path: data/research/v16-v169-target-hit-audit.json

      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-v169-target-hit-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.9 target hit audit"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

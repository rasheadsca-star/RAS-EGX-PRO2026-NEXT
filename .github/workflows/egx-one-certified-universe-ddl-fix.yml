name: EGX ONE Certified Universe DDL Repair
on:
  push:
    branches: [egx-one/clean-room-v0]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1
      - name: Repair missing trigger parenthesis only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/market-data-store.js')
          s=p.read_text()
          old="c.primary_observation_certificate_hash<>n.primary_observation_certificate_hash)) BEGIN SELECT RAISE(ABORT,'SESSION_MANIFEST_PRODUCTION_LINEAGE_INVALID'); END;"
          new="c.primary_observation_certificate_hash<>n.primary_observation_certificate_hash))) BEGIN SELECT RAISE(ABORT,'SESSION_MANIFEST_PRODUCTION_LINEAGE_INVALID'); END;"
          if old not in s:
              print('DDL already repaired or pattern changed')
          else:
              p.write_text(s.replace(old,new,1))
              print('Repaired exactly one missing parenthesis')
          PY
      - name: Commit repair if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/market-data-store.js
          git commit -m 'Fix certified universe production-lineage trigger syntax'
          git pull --rebase origin egx-one/clean-room-v0
          git push origin HEAD:egx-one/clean-room-v0

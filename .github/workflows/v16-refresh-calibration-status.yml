name: EGX Refresh V16.6 Calibration Status

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-refresh-calibration-status.yml"
      - "scripts/stable/v16-publish-v166-gate.cjs"

permissions:
  contents: write

concurrency:
  group: egx-refresh-v166-calibration-status
  cancel-in-progress: true

jobs:
  publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish corrected status
        run: node scripts/stable/v16-publish-v166-gate.cjs
      - name: Commit application status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v15-practical-decision.json
          if ! git diff --cached --quiet; then
            git commit -m "Correct V16.6 calibration status in app"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

name: EGX V16 Model Consensus Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-consensus-dry-run.yml"

permissions:
  contents: write

concurrency:
  group: egx-v16-model-consensus-dry-run
  cancel-in-progress: true

jobs:
  analyse-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build model-consensus dry run
        run: |
          node - <<'NODE'
          'use strict';
          const fs = require('fs');
          const path = require('path');

          const HISTORY_DIR = path.join(process.cwd(), 'data/history');
          const DECISION = JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json', 'utf8'));
          const VALIDATION = JSON.parse(fs.readFileSync('data/research/v15-practical-validation.json', 'utf8'));
          const n = (v, fallback = null) => Number.isFinite(Number(v)) ? Number(v) : fallback;
          const round = (v, d = 2) => Number.isFinite(Number(v)) ? Number(Number(v).toFixed(d)) : null;
          const mean = values => { const clean = values.filter(Number.isFinite); return clean.length ? clean.reduce((a,b)=>a+b,0)/clean.length : null; };
          const median = values => { const clean = values.filter(Number.isFinite).sort((a,b)=>a-b); if (!clean.length) return null; const m=Math.floor(clean.length/2); return clean.length%2?clean[m]:(clean[m-1]+clean[m])/2; };
          const pct = (value, base) => base > 0 ? (value / base - 1) * 100 : null;
          const dateOnly = value => (String(value || '').match(/^(\d{4}-\d{2}-\d{2})/) || [])[1] || null;
          const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

          function normalize(file) {
            const doc = JSON.parse(fs.readFileSync(file, 'utf8'));
            const ticker = String(doc.ticker || path.basename(file, '.json')).toUpperCase();
            const rows = (Array.isArray(doc.sessions) ? doc.sessions : Array.isArray(doc) ? doc : [])
              .map(row => ({date:dateOnly(row.date||row.sessionDate),open:n(row.open),high:n(row.high),low:n(row.low),close:n(row.close),volume:n(row.volume,0)}))
              .filter(row => row.date && row.open>0 && row.close>0 && row.low>0 && row.high>=Math.max(row.open,row.close) && row.low<=Math.min(row.open,row.close))
              .sort((a,b)=>a.date.localeCompare(b.date));
            return {ticker, companyNameAr:doc.companyNameAr||doc.companyNameEn||ticker, verified:doc.symbolVerified!==false, stale:doc.staleData===true, rows};
          }
          function sma(rows,index,length,key='close') { if(index-length+1<0)return null; return mean(rows.slice(index-length+1,index+1).map(r=>n(r[key])).filter(Number.isFinite)); }
          function atr(rows,index,length=14) { if(index-length+1<1)return null; const out=[]; for(let i=index-length+1;i<=index;i++){const p=rows[i-1].close;out.push(Math.max(rows[i].high-rows[i].low,Math.abs(rows[i].high-p),Math.abs(rows[i].low-p)));} return mean(out); }
          function rsi(rows,index,length=14) { if(index-length<0)return null; let g=0,l=0; for(let i=index-length+1;i<=index;i++){const c=rows[i].close-rows[i-1].close;if(c>=0)g+=c;else l-=c;} const ag=g/length, al=l/length; return al===0?100:100-100/(1+ag/al); }
          function feature(history,index){
            if(index<55)return null; const rows=history.rows,row=rows[index],close=row.close;
            const s10=sma(rows,index,10),s20=sma(rows,index,20),s50=sma(rows,index,50),a14=atr(rows,index),r14=rsi(rows,index);
            const av=sma(rows,index-1,20,'volume'),vr=av>0?row.volume/av:null,turnover=mean(rows.slice(index-19,index+1).map(x=>x.close*x.volume));
            const prior20=rows.slice(index-20,index),high20=Math.max(...prior20.map(x=>x.high)),low20=Math.min(...prior20.map(x=>x.low));
            const ret1=pct(close,rows[index-1]?.close),ret3=pct(close,rows[index-3]?.close),ret5=pct(close,rows[index-5]?.close),ret10=pct(close,rows[index-10]?.close),ret20=pct(close,rows[index-20]?.close);
            const atrPct=a14>0?a14/close*100:null,rangePos=high20>low20?(close-low20)/(high20-low20):0.5;
            if(![s10,s20,s50,a14,r14,vr,turnover,ret1,ret3,ret5,ret10,ret20,atrPct].every(Number.isFinite))return null;
            if(atrPct<0.4||atrPct>14||Math.abs(ret1)>30)return null;
            return {ticker:history.ticker,companyNameAr:history.companyNameAr,date:row.date,open:row.open,close,a14,r14,vr,turnover,ret1,ret3,ret5,ret10,ret20,rangePos,breakoutPct:pct(close,high20),trend:close>s20&&s20>s50,s10,s20,s50};
          }

          const MODELS = {
            BREAKOUT_CONTINUATION:{profile:'FAST',eligible:f=>f.trend&&f.breakoutPct>=-0.5&&f.vr>=1.05&&f.ret5>=1&&f.ret20>=4&&f.rs20>=1&&f.r14>=52&&f.r14<=80,score:f=>f.breakoutPct*5+f.ret5*2.4+f.ret20*.45+f.rs20*1.6+Math.min(f.vr,4)*7+f.rangePos*12-Math.max(0,f.r14-75)*2.5},
            MOMENTUM_ACCELERATION:{profile:'BALANCED',eligible:f=>f.close>f.s10&&f.s10>f.s20&&f.s20>f.s50&&f.ret3>.8&&f.ret10>3&&f.ret20>5&&f.rs20>2&&f.vr>=.8&&f.r14>=50&&f.r14<=78,score:f=>f.ret3*3+f.ret5*2+f.ret10+f.ret20*.35+f.rs20*1.8+Math.min(f.vr,3)*5+f.rangePos*10},
            TREND_RESUMPTION:{profile:'BALANCED',eligible:f=>f.trend&&f.close>f.s10&&f.ret1>0&&f.ret5>-1&&f.ret20>5&&f.rs20>1&&f.vr>=.7&&f.rangePos>=.55&&f.r14>=48&&f.r14<=72,score:f=>f.ret1*3+f.ret5*1.2+f.ret20*.45+f.rs20*1.5+Math.min(f.vr,2.5)*5+f.rangePos*12-Math.abs(f.r14-60)*.5},
            LIQUID_LEADERS:{profile:'FAST',eligible:f=>f.trend&&f.ret5>0&&f.ret20>3&&f.rs20>2&&f.vr>=.75&&f.turnover>=5000000&&f.r14>=50&&f.r14<=76,score:f=>Math.log10(Math.max(f.turnover,1))*4+clamp(f.ret5,-5,20)*1.8+clamp(f.ret20,-10,60)*.35+clamp(f.rs20,-10,50)*1.7+Math.min(f.vr,3)*4},
            HOT_MOMENTUM:{profile:'FAST',watchOnly:true,eligible:f=>f.ret5>=8&&f.ret20>=12&&f.rs20>=7&&f.vr>=.8&&f.r14>=76&&f.r14<=90&&f.turnover>=1000000,score:f=>clamp(f.ret5,0,35)*2+clamp(f.ret20,0,80)*.45+clamp(f.rs20,0,70)*1.4+Math.min(f.vr,5)*5-Math.max(0,f.r14-82)*4},
            PRE_BREAKOUT_ACCUMULATION:{profile:'FAST',eligible:f=>f.trend&&f.ret5>=1&&f.ret20>=0&&f.rs20>=-3&&f.vr>=1.2&&f.rangePos>=.55&&f.breakoutPct>=-7&&f.breakoutPct<=2&&f.r14>=50&&f.r14<=74,score:f=>f.ret5*2+f.ret20*.3+f.rs20+Math.min(f.vr,5)*7+f.rangePos*15-Math.abs(f.breakoutPct)*.8},
            REVERSAL_CONFIRMATION:{profile:'BALANCED',eligible:f=>!f.trend&&f.ret1>=1.5&&f.ret3>0&&f.ret5<=8&&f.r14>=28&&f.r14<=58&&f.vr>=1.2&&f.close>f.open&&f.close>f.s10,score:f=>f.ret1*4+f.ret3*2-Math.min(0,f.ret5)*1.2+Math.min(f.vr,5)*7+(58-f.r14)*.5}
          };
          const PROFILES={FAST:{stopAtr:1,targetAtr:1.4,maxHold:4},BALANCED:{stopAtr:1.15,targetAtr:1.65,maxHold:6}};
          const validatedIds = Array.isArray(DECISION.validatedModels) ? DECISION.validatedModels : [];
          const validationRows = Array.isArray(VALIDATION.models) ? VALIDATION.models : Array.isArray(VALIDATION.modelResults) ? VALIDATION.modelResults : [];
          const resultMap = new Map(validationRows.map(x=>[x.id,x]));
          if (DECISION.selectedModel?.id) resultMap.set(DECISION.selectedModel.id, DECISION.selectedModel);

          const histories = fs.readdirSync(HISTORY_DIR).filter(x=>x.endsWith('.json')).map(x=>normalize(path.join(HISTORY_DIR,x))).filter(x=>x.verified&&!x.stale&&x.rows.length>=80);
          const latestDate = DECISION.sessionDate;
          const latest=[];
          for(const h of histories){const index=h.rows.findIndex(r=>r.date===latestDate); if(index>=55){const f=feature(h,index); if(f)latest.push(f);}}
          const marketRet20=median(latest.map(x=>x.ret20)); latest.forEach(x=>x.rs20=x.ret20-marketRet20);

          const opportunities=[];
          for(const id of validatedIds){
            const model=MODELS[id]; if(!model)continue;
            const result=resultMap.get(id)||{}; const profile=PROFILES[model.profile];
            const pool=latest.filter(model.eligible).sort((a,b)=>model.score(b)-model.score(a)).slice(0,12);
            pool.forEach((item,idx)=>{
              const entryLow=item.close-item.a14*.1,entryHigh=item.close+item.a14*.1,stop=item.close-item.a14*profile.stopAtr,target=item.close+item.a14*profile.targetAtr;
              const rr=(target-entryHigh)/(entryHigh-stop); const reasons=[];
              if(model.watchOnly)reasons.push('WATCH_ONLY'); if(item.r14>78)reasons.push('RSI'); if(item.ret5>15)reasons.push('RET5'); if(item.ret20>45)reasons.push('RET20'); if(item.breakoutPct>8)reasons.push('EXTENDED'); if(rr<1.15)reasons.push('RR');
              const stability=n(result.stabilityScore, id===DECISION.selectedModel?.id?n(DECISION.selectedModel.stabilityScore,0):0);
              const selection=n(result.selectionScore,id===DECISION.selectedModel?.id?n(DECISION.selectedModel.selectionScore,0):0);
              opportunities.push({ticker:item.ticker,companyNameAr:item.companyNameAr,strategyId:id,localRank:idx+1,modelScore:round(model.score(item),2),combinedScore:round(selection*3+(12-idx)*2+stability*.1,2),professionalEligible:reasons.length===0&&stability>=10,reasons,close:round(item.close,4),entryLow:round(entryLow,4),entryHigh:round(entryHigh,4),stopLoss:round(stop,4),target1:round(target,4),riskReward:round(rr,2),ret5Pct:round(item.ret5,2),ret20Pct:round(item.ret20,2),relativeStrength20Pct:round(item.rs20,2),volumeRatio20:round(item.vr,2),rsi14:round(item.r14,1),averageTurnover20Egp:round(item.turnover,0)});
            });
          }

          const grouped=new Map();
          for(const item of opportunities){
            const g=grouped.get(item.ticker)||{ticker:item.ticker,companyNameAr:item.companyNameAr,allModels:new Set(),eligibleModels:new Set(),best:null};
            g.allModels.add(item.strategyId); if(item.professionalEligible)g.eligibleModels.add(item.strategyId);
            if(item.professionalEligible&&(!g.best||item.combinedScore>g.best.combinedScore))g.best=item;
            grouped.set(item.ticker,g);
          }
          const candidates=[...grouped.values()].filter(g=>g.best).map(g=>({...g.best,supportingModels:[...g.eligibleModels],supportingModelCount:g.eligibleModels.size,allMatchedModels:[...g.allModels]}));
          candidates.sort((a,b)=>b.supportingModelCount-a.supportingModelCount||b.combinedScore-a.combinedScore||b.modelScore-a.modelScore);
          const proposed=candidates.slice(0,5).map((x,i)=>({...x,consensusRank:i+1}));
          const current=(DECISION.recommendations||[]).map(x=>x.ticker);
          const proposedTickers=proposed.map(x=>x.ticker);
          const out={
            schemaVersion:'16.3.5-dry-run',generatedAt:new Date().toISOString(),sessionDate:latestDate,mode:'STRICT_MODEL_COUNT_THEN_CURRENT_SCORE',validatedModels:validatedIds,currentRecommendations:current,proposedRecommendations:proposedTickers,changed:JSON.stringify(current)!==JSON.stringify(proposedTickers),removed:current.filter(x=>!proposedTickers.includes(x)),added:proposedTickers.filter(x=>!current.includes(x)),proposed,notesAr:[
              'هذا اختبار جاف ولا يغيّر توصيات الإنتاج.',
              'يتم احتساب الدعم فقط من النماذج التي اجتازت بوابة Pilot الحالية.',
              'الأولوية لعدد النماذج ثم الدرجة الحالية، مع الإبقاء على جميع بوابات المطاردة والعائد/المخاطرة.'
            ]
          };
          fs.mkdirSync('data/research',{recursive:true});
          fs.writeFileSync('data/research/v16-model-consensus-dry-run.json',JSON.stringify(out,null,2)+'\n');
          console.log(out);
          NODE

      - name: Commit dry-run report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-model-consensus-dry-run.json
          if ! git diff --cached --quiet; then
            git commit -m "Evaluate V16 multi-model consensus ranking"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

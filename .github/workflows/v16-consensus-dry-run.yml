name: EGX V16 Model Consensus Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v16-consensus-dry-run.yml"
      - "scripts/research/v16-model-consensus-dry-run.cjs"

permissions:
  contents: write

concurrency:
  group: egx-v16-model-consensus-dry-run
  cancel-in-progress: true

jobs:
  analyse-consensus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run non-production consensus analysis
        run: node scripts/research/v16-model-consensus-dry-run.cjs

      - name: Commit dry-run report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-model-consensus-dry-run.json
          if ! git diff --cached --quiet; then
            git commit -m "Evaluate V16 multi-model consensus ranking"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

name: V18 Durable Post-Close Coordinator

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "EGX V16.3.3 Immediate Market Rescan and Deploy"
    types:
      - completed
  push:
    paths:
      - ".github/workflows/v18-durable-coordinator.yml"
      - "v18-live/index.html"
  schedule:
    - cron: "20 14 * * 0-4"
    - cron: "30 17 * * 0-4"
    - cron: "0 19 * * 0-4"

permissions:
  contents: write

env:
  V18_PUBLIC_URL: https://egx-pro-v18-2-unified-preview.vercel.app
  V18_BACKUP_URL: https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/v18-live/
  V18_BRANCH: v18-global-strategy-ensemble-20260906
  V18_LIVE_SHELL_URL: https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18-web/index.html
  V18_LIVE_DATA_URL: https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18/data.json
  V18_LIVE_MANIFEST_URL: https://raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18-web/manifest.json

concurrency:
  group: v18-durable-post-close-coordinator
  cancel-in-progress: false

jobs:
  refresh-v18:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0

      - name: Checkout V18 decision engine
        uses: actions/checkout@v4
        with:
          ref: v18-global-strategy-ensemble-20260906
          path: v18
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve and verify canonical market session
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SESSION="$(node -e "const s=require('./main-src/data/fetch-status.json');process.stdout.write(String(s.expectedSession||''))")"
          LATEST_DATE="$(node -e "const x=require('./main-src/data/quant/stocks/TMGH.json');process.stdout.write(String(x.sessionId||x.latest?.date||''))")"
          FETCH_READY="$(node -e "const s=require('./main-src/data/fetch-status.json');process.stdout.write(String(Boolean(s.ok&&s.realFetch&&s.executionGrade&&Number(s.currentSessionRows||0)>=150)))")"
          test -n "$EXPECTED_SESSION" || { echo "::error::fetch-status.expectedSession is missing."; exit 1; }
          test "$FETCH_READY" = "true" || { echo "::error::Canonical fetch-status is not execution-grade/current enough for publication."; exit 1; }
          test "$LATEST_DATE" = "$EXPECTED_SESSION" || { echo "::error::Canonical stock session mismatch: fetch=$EXPECTED_SESSION stock=$LATEST_DATE."; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const s=require('./main-src/data/fetch-status.json');
          let calendarSession=null;
          try{calendarSession=require('./main-src/data/session-calendar.json').latestMarketSession||null}catch{}
          const generated=Date.parse(s.generatedAt||'');
          if(!Number.isFinite(generated)) throw new Error('fetch-status.generatedAt is invalid');
          const ageHours=(Date.now()-generated)/3600000;
          const eventName=process.env.GITHUB_EVENT_NAME;
          if(eventName==='schedule' && ageHours>30) throw new Error(`Scheduled fallback refuses stale canonical fetch-status (${ageHours.toFixed(1)}h old)`);
          if(eventName==='workflow_run'){
            const ev=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
            const started=Date.parse(ev?.workflow_run?.run_started_at||ev?.workflow_run?.created_at||'');
            if(Number.isFinite(started) && generated < started-5*60*1000) throw new Error('Upstream workflow succeeded but canonical fetch-status was not refreshed by that run');
          }
          console.log(JSON.stringify({eventName,canonicalGeneratedAt:s.generatedAt,ageHours:Number(ageHours.toFixed(2)),expectedSession:s.expectedSession,currentSessionRows:s.currentSessionRows,calendarSessionDiagnostic:calendarSession},null,2));
          NODE
          echo "EXPECTED_SESSION=$EXPECTED_SESSION" >> "$GITHUB_ENV"
          echo "Expected canonical market session: $EXPECTED_SESSION"

      - name: Validate durable production bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test -s main-src/v18-live/index.html
          grep -q 'V18_DURABLE_BOOTSTRAP_V2' main-src/v18-live/index.html
          grep -q 'raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18-web/index.html' main-src/v18-live/index.html
          grep -q 'cdn.jsdelivr.net/gh/rasheadsca-star/RAS-EGX-PRO2026-NEXT@v18-global-strategy-ensemble-20260906/preview-v18-web/index.html' main-src/v18-live/index.html
          grep -q 'window.__V18_CHECK_FOR_NEW_SESSION__' main-src/v18-live/index.html
          grep -q 'window.__V18_ACTIVE_PAYLOAD_SHA256__' main-src/v18-live/index.html
          echo "V18_DURABLE_BOOTSTRAP_SOURCE_PASS"

      - name: Sync canonical market inputs into V18 workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf v18/data/quant/stocks
          mkdir -p v18/data/quant
          cp -R main-src/data/quant/stocks v18/data/quant/stocks
          for f in \
            data/session-calendar.json \
            data/fetch-status.json \
            data/quant/stock-intelligence-index.json \
            data/quant/daily-recommendations.json \
            data/quant/adaptive-daily-recommendations.json \
            data/stable/v16-market-regime.json \
            data/stable/v15-practical-decision.json; do
            if [ -f "main-src/$f" ]; then
              mkdir -p "v18/$(dirname "$f")"
              cp "main-src/$f" "v18/$f"
            fi
          done

      - name: Build V18 from canonical session
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_WORKSPACE="$PWD"
          node --check scripts/stable/v18-global-strategy-ensemble.cjs
          node --check scripts/stable/v18-leadership-extension.cjs
          node --check scripts/stable/v18-evidence-ranking.cjs
          node --check scripts/stable/build-v18-decision-board.cjs
          node --check scripts/stable/build-v18-web-preview.cjs
          node scripts/stable/build-v18-decision-board.cjs
          node scripts/stable/build-v18-web-preview.cjs

      - name: Validate V18 output and live-update contract
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const out=require('./preview-v18/data.json');
          const manifest=require('./preview-v18-web/manifest.json');
          const html=fs.readFileSync('preview-v18-web/index.html','utf8');
          const expected=process.env.EXPECTED_SESSION;
          const hash=crypto.createHash('sha256').update(Buffer.from(JSON.stringify(out))).digest('hex');
          if(out.sessionId!==expected) throw new Error(`V18 session ${out.sessionId} != expected ${expected}`);
          if(manifest.sessionId!==expected) throw new Error(`Manifest session ${manifest.sessionId} != expected ${expected}`);
          if(manifest.payloadSha256!==hash) throw new Error('Manifest payload hash does not match V18 data');
          if(out.dataHealth?.status!=='PASS'||Number(out.dataHealth?.criticalFailureCount||0)!==0) throw new Error('V18 data-health gate failed');
          if(!Array.isArray(out.allCandidates)||out.allCandidates.length<20) throw new Error('V18 recommendations are incomplete');
          if(!manifest.multiTargetExecution) throw new Error('Multi-target execution missing');
          const levels=new Set(manifest.executionLevels||[]);
          for(const x of ['ENTRY_ZONE','TARGET1','TARGET2','TARGET3','STOP_LOSS']) if(!levels.has(x)) throw new Error(`Missing ${x}`);
          if((manifest.dashboardRecommendations||0)<20) throw new Error('Top 20 recommendations missing');
          if(manifest.liveLoaderVersion!=='github-live-v3') throw new Error('V18 live loader v3 missing');
          if(manifest.autoRefreshVersion!=='github-live-watch-v3') throw new Error('V18 live watcher v3 missing');
          if(Number(manifest.autoRefreshIntervalMs)!==60000) throw new Error('Unexpected live refresh interval');
          if(manifest.sameSessionPayloadRefresh!==true) throw new Error('Same-session payload refresh missing');
          if(manifest.embeddedVerifiedFallback!==true||manifest.embeddedFallbackEncoding!=='plain-json') throw new Error('Verified embedded fallback missing');
          for(const marker of ['V18_LIVE_GITHUB_SOURCE_V1','V18_AUTO_REFRESH_WATCH_V3','V18_PAYLOAD_HASH_REFRESH','window.__V18_CHECK_FOR_NEW_SESSION__','window.__V18_ACTIVE_PAYLOAD_SHA256__','window.__V18_EMBEDDED_DATA__']) if(!html.includes(marker)) throw new Error(`Missing ${marker}`);
          console.log(JSON.stringify({sessionId:out.sessionId,payloadSha256:hash,candidates:out.allCandidates.length,top20:manifest.dashboardRecommendations,dataHealth:out.dataHealth.status,liveLoader:manifest.liveLoaderVersion,autoRefresh:manifest.autoRefreshVersion},null,2));
          NODE

      - name: Persist fresh V18 data and public shell
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          required=(preview-v18/data.json preview-v18/forward-ledger.json preview-v18-web/index.html preview-v18-web/manifest.json)
          optional=(data/session-calendar.json data/fetch-status.json data/quant/stocks data/quant/stock-intelligence-index.json data/quant/daily-recommendations.json data/quant/adaptive-daily-recommendations.json data/stable/v16-market-regime.json data/stable/v15-practical-decision.json data/stable/v18-forward-ledger.json)
          for p in "${required[@]}"; do test -s "$p" || { echo "::error::Missing required publication artifact: $p"; exit 1; }; done
          for p in "${optional[@]}"; do [ ! -e "$p" ] || git add -f "$p"; done
          git add -f "${required[@]}"
          if git diff --cached --quiet; then
            echo "No V18 changes to publish."
          else
            git commit -m "chore(v18): verified post-close refresh ${EXPECTED_SESSION}"
            if ! git push origin HEAD:"$V18_BRANCH"; then
              echo "Remote advanced during publication; rebasing once and retrying."
              git pull --rebase origin "$V18_BRANCH"
              git push origin HEAD:"$V18_BRANCH"
            fi
          fi

      - name: Verify published branch snapshot
        working-directory: v18
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V18_BRANCH" --depth=1
          git show origin/$V18_BRANCH:preview-v18/data.json > /tmp/v18-published-data.json
          git show origin/$V18_BRANCH:preview-v18-web/index.html > /tmp/v18-published-index.html
          git show origin/$V18_BRANCH:preview-v18-web/manifest.json > /tmp/v18-published-manifest.json
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const d=require('/tmp/v18-published-data.json');
          const m=require('/tmp/v18-published-manifest.json');
          const h=fs.readFileSync('/tmp/v18-published-index.html','utf8');
          const hash=crypto.createHash('sha256').update(Buffer.from(JSON.stringify(d))).digest('hex');
          if(d.sessionId!==process.env.EXPECTED_SESSION||m.sessionId!==process.env.EXPECTED_SESSION) throw new Error('Published V18 branch is stale');
          if(!Array.isArray(d.allCandidates)||d.allCandidates.length<20) throw new Error('Published candidates missing');
          if(m.payloadSha256!==hash) throw new Error('Published payload hash mismatch');
          if(m.liveLoaderVersion!=='github-live-v3'||m.autoRefreshVersion!=='github-live-watch-v3'||m.sameSessionPayloadRefresh!==true||m.embeddedFallbackEncoding!=='plain-json') throw new Error('Published live-update contract missing');
          if(!h.includes('V18_AUTO_REFRESH_WATCH_V3')||!h.includes('V18_PAYLOAD_HASH_REFRESH')) throw new Error('Published shell watcher/hash marker missing');
          console.log(JSON.stringify({publishedSession:d.sessionId,payloadSha256:hash,candidates:d.allCandidates.length,liveLoader:m.liveLoaderVersion,autoRefresh:m.autoRefreshVersion},null,2));
          NODE

      - name: Verify GitHub live source is current
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            stamp="$(date +%s%3N)"
            if curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_MANIFEST_URL?verify=$stamp" -o /tmp/live-manifest.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_DATA_URL?verify=$stamp" -o /tmp/live-data.json \
              && curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_LIVE_SHELL_URL?verify=$stamp" -o /tmp/live-shell.html; then
              if node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const d=require('/tmp/live-data.json');
          const m=require('/tmp/live-manifest.json');
          const h=fs.readFileSync('/tmp/live-shell.html','utf8');
          const hash=crypto.createHash('sha256').update(Buffer.from(JSON.stringify(d))).digest('hex');
          if(d.sessionId!==process.env.EXPECTED_SESSION) process.exit(2);
          if(m.sessionId!==process.env.EXPECTED_SESSION) process.exit(3);
          if(d.dataHealth?.status!=='PASS'||Number(d.dataHealth?.criticalFailureCount||0)!==0) process.exit(4);
          if(!Array.isArray(d.allCandidates)||d.allCandidates.length<20) process.exit(5);
          if(m.payloadSha256!==hash) process.exit(6);
          if(m.liveLoaderVersion!=='github-live-v3'||m.autoRefreshVersion!=='github-live-watch-v3'||m.sameSessionPayloadRefresh!==true||m.embeddedFallbackEncoding!=='plain-json') process.exit(7);
          for(const marker of ['V18_LIVE_GITHUB_SOURCE_V1','V18_AUTO_REFRESH_WATCH_V3','V18_PAYLOAD_HASH_REFRESH','window.__V18_CHECK_FOR_NEW_SESSION__','window.__V18_ACTIVE_PAYLOAD_SHA256__']) if(!h.includes(marker)) process.exit(8);
          NODE
              then
                ok=1
                echo "V18_GITHUB_LIVE_SOURCE_PASS session=$EXPECTED_SESSION"
                break
              fi
            fi
            echo "Live-source propagation attempt $attempt not current yet."
            sleep 5
          done
          test "$ok" = "1" || { echo "::error::GitHub live source failed freshness verification."; exit 1; }

      - name: Verify V18.2 production bootstrap and end-to-end contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6; do
            stamp="$(date +%s%3N)"
            ROOT="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_PUBLIC_URL/?verify=$stamp" || true)"
            if grep -q 'V18_DURABLE_BOOTSTRAP_V2' <<<"$ROOT" \
              && grep -q 'raw.githubusercontent.com/rasheadsca-star/RAS-EGX-PRO2026-NEXT/v18-global-strategy-ensemble-20260906/preview-v18-web/index.html' <<<"$ROOT" \
              && grep -q 'FAIL-CLOSED' <<<"$ROOT"; then
              if node -e "const m=require('/tmp/live-manifest.json');if(m.sessionId!==process.env.EXPECTED_SESSION||m.dataHealth!=='PASS'||m.liveLoaderVersion!=='github-live-v3'||m.autoRefreshVersion!=='github-live-watch-v3'||m.sameSessionPayloadRefresh!==true||!m.payloadSha256)process.exit(2)"; then
                ok=1
                echo "V18_2_PRODUCTION_E2E_PASS session=$EXPECTED_SESSION bootstrap=v2 source=github-live-v3 autoRefresh=60000ms payloadHash=yes"
                break
              fi
            fi
            echo "Production E2E attempt $attempt not ready yet."
            sleep 5
          done
          test "$ok" = "1" || { echo "::error::V18.2 production failed durable bootstrap/live freshness verification."; exit 1; }

      - name: Check GitHub Pages backup bootstrap
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s%3N)"
          BACKUP="$(curl -fsSL --retry 2 -H 'Cache-Control: no-cache' "$V18_BACKUP_URL?verify=$stamp" || true)"
          if grep -q 'V18_DURABLE_BOOTSTRAP_V2' <<<"$BACKUP"; then
            echo "V18_BACKUP_BOOTSTRAP_PASS"
          else
            echo "::warning::GitHub Pages backup bootstrap is not yet V2; primary Vercel production is unaffected."
          fi

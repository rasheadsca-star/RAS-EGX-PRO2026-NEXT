name: RC2 Promote Production Once

on:
  push:
    branches:
      - develop/rc2-intraday-operations-v1
    paths:
      - .github/workflows/rc2-promote-production-once.yml

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_PROJECT_ID: prj_gXmmVe1QqGFJ9nsv30uu0emLqIdY
      VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
      VERCEL_DEPLOYMENT_ID: dpl_Crmbz1tyf9BCRZmbUZQ7UJ6dggYq
      EXPECTED_COMMIT: 6cae8b9e0d99a0da7f40c015e745b4e35adc5eac
      PREVIEW_URL: https://egx-tfe-v20-fusion-rc2-hzzpw9097-steverabin38-1168s-projects.vercel.app
      PROD_URL: https://egx-tfe-v20-fusion-rc2.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is not configured'; exit 2; }

      - name: Verify validated preview provenance
        shell: bash
        run: |
          node - <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const url = `${process.env.PREVIEW_URL}/api/index?route=health`;
          const res = await fetch(url, { redirect: 'follow' });
          if (!res.ok) throw new Error(`preview health ${res.status}`);
          const body = await res.json();
          if (body.sourceCommit !== expected) throw new Error(`preview commit mismatch: ${body.sourceCommit}`);
          if (body?.policy?.permissions?.executionAllowed !== false) throw new Error('execution lock missing');
          console.log(`PREVIEW_OK:${body.sourceCommit}`);
          NODE

      - name: Promote exact preview without rebuild
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/promote.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$VERCEL_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")
          cat /tmp/promote.out
          case "$code" in
            200|201|202) echo "PROMOTE_ACCEPTED:$code" ;;
            *) echo "PROMOTE_FAILED:$code"; exit 3 ;;
          esac

      - name: Verify production provenance
        shell: bash
        run: |
          node - <<'NODE'
          const expected = process.env.EXPECTED_COMMIT;
          const url = `${process.env.PROD_URL}/api/index?route=health`;
          let last = '';
          for (let i = 0; i < 30; i++) {
            try {
              const res = await fetch(`${url}&t=${Date.now()}`, { cache:'no-store' });
              if (res.ok) {
                const body = await res.json();
                last = body.sourceCommit || '';
                if (last === expected) {
                  console.log(`PRODUCTION_OK:${last}`);
                  process.exit(0);
                }
              }
            } catch {}
            await new Promise(r => setTimeout(r, 4000));
          }
          throw new Error(`production did not reach expected commit; last=${last}`);
          NODE

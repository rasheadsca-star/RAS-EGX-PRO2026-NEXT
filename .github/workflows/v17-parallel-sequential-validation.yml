name: V17 Parallel Sequential Validation

on:
  push:
    branches:
      - agent/egx-meta-engine-v1-20260829
    paths:
      - 'tfe-v20/src/v17ParallelSequentialValidation.js'
      - 'tfe-v20/test/v17-parallel-sequential-validation.test.js'
      - 'tfe-v20/scripts/v17-freeze-parallel-cohort.mjs'
      - 'tfe-v20/scripts/v17-evaluate-parallel-cohort.mjs'
      - 'tfe-v20/scripts/v17-sequential-evidence-report.mjs'
      - 'tfe-v20/research/V17_PARALLEL_SEQUENTIAL_VALIDATION_CONTRACT.md'
      - 'tfe-v20/forward-ledger/snapshots/**'
      - 'tfe-v20/parallel-validation/results/**'
      - '.github/workflows/v17-parallel-sequential-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-parallel-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run destructive parallel validation tests
        working-directory: tfe-v20
        run: node --test test/v17-parallel-sequential-validation.test.js

      - name: Freeze latest immutable forward snapshot into parallel cohort
        working-directory: tfe-v20
        run: node scripts/v17-freeze-parallel-cohort.mjs

      - name: Enforce frozen arm contract and zero authority
        working-directory: tfe-v20
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/v17-parallel-cohort.json','utf8'));
          const c = report.cohort;
          if (report.researchOnly !== true || report.productionAuthority !== false) throw new Error('REPORT_AUTHORITY_INVALID');
          if (c.status !== 'FROZEN_PRE_OUTCOME_PARALLEL_COHORT') throw new Error('COHORT_NOT_FROZEN');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(c.signalSessionDate || '')) throw new Error('SIGNAL_DATE_INVALID');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(c.nextTradingSessionDate || '')) throw new Error('NEXT_SESSION_INVALID');
          if (!/^[a-f0-9]{64}$/.test(c.sourceSnapshotHash || '')) throw new Error('SOURCE_SNAPSHOT_HASH_INVALID');
          if (c.contractHash !== 'ec702d2052d1ef8b1247b8c2a2c0f3c3777048fd54fc05ab733604b6f6a4eee4') throw new Error('PARALLEL_CONTRACT_DRIFT');
          if (Object.keys(c.arms).join(',') !== 'V16_CONTROL,V17_A,V17_B,V17_C') throw new Error('ARM_SET_DRIFT');
          if (c.sequential.hardMaxCohorts !== 40) throw new Error('HARD_CAP_DRIFT');
          if (c.sequential.formalSuperiorityProbability !== 0.99) throw new Error('FORMAL_THRESHOLD_DRIFT');
          if (c.sequential.earlyPositiveProbability !== 0.975) throw new Error('EARLY_POSITIVE_DRIFT');
          if (c.sequential.earlyFutilityProbability !== 0.10) throw new Error('EARLY_FUTILITY_DRIFT');
          for (const arm of Object.values(c.arms)) {
            if (arm.policy.maxPositions > 2) throw new Error('POSITION_CAP_BREACH');
            if (!Array.isArray(arm.candidateTickers)) throw new Error('CANDIDATE_SET_INVALID');
          }
          console.log(`V17 parallel cohort ${c.signalSessionDate} frozen under immutable contract ${c.contractHash}.`);
          NODE

      - name: Recompute sequential evidence from append-only completed results
        working-directory: tfe-v20
        run: node scripts/v17-sequential-evidence-report.mjs

      - name: Enforce sequential evidence zero authority
        working-directory: tfe-v20
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/v17-sequential-evidence.json','utf8'));
          if (report.researchOnly !== true || report.productionAuthority !== false || report.automaticPromotion !== false) throw new Error('SEQUENTIAL_AUTHORITY_INVALID');
          if (report.evidence?.hardMaxCohorts !== 40) throw new Error('SEQUENTIAL_HARD_CAP_DRIFT');
          for (const [id, arm] of Object.entries(report.evidence?.challengers || {})) {
            const allowed = new Set(['INSUFFICIENT_EVIDENCE','CONTINUE_FROZEN_TEST','EARLY_POSITIVE_RESEARCH_EVIDENCE','EARLY_FUTILITY','FORMAL_RESEARCH_CHALLENGER_PASS','NO_MATERIAL_EDGE_UNDER_FROZEN_CONTRACT']);
            if (!allowed.has(arm.status)) throw new Error(`UNKNOWN_SEQUENTIAL_STATUS:${id}:${arm.status}`);
            if (arm.productionAuthority !== false) throw new Error(`ARM_AUTHORITY_INVALID:${id}`);
          }
          console.log(`Sequential evidence recomputed from ${report.completedResultCount} completed cohort result(s).`);
          NODE

      - name: Upload parallel cohort and sequential evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v17-parallel-sequential-${{ github.sha }}
          path: |
            tfe-v20/reports/v17-parallel-cohort.json
            tfe-v20/reports/v17-parallel-dashboard.html
            tfe-v20/reports/v17-sequential-evidence.json
            tfe-v20/reports/v17-sequential-evidence-dashboard.html
          retention-days: 90

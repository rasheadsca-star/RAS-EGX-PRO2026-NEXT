name: MAIN APP — Protected V16.9 Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "preview-v16/app/**"
      - "data/stable/v16-main-app-current.json"
      - "data/stable/v16-v169-primary-decision.json"
      - "data/stable/v15-price-truth.json"
      - "data/stable/v16-v169-release-lock.json"
      - ".github/workflows/v169-primary-pages-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-app-v169-protected-pages
  cancel-in-progress: true

env:
  MAIN_APP_FROZEN_SOURCE_REF: origin/release/MAIN-APP-v16.9.2-p1-frozen-20260816

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce frozen MAIN APP methodology only
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${MAIN_APP_FROZEN_SOURCE_REF}^{commit}"
          # Keep the trading methodology/research engine frozen, while allowing
          # operational/runtime fixes and fresh canonical data to deploy.
          PROTECTED=(
            scripts/research/v16-v169-basket-engine.py
            scripts/research/v16-two-stage-predictor.py
            scripts/research/v16-v169-target-hit-audit.py
            scripts/stable/v16-publish-v169-basket.cjs
            scripts/stable/v16-session-data-fingerprint.cjs
            scripts/stable/v16-v169-live-evaluation.py
            data/stable/v16-v169-release-lock.json
            .github/workflows/v16-v169-basket-engine.yml
          )
          if ! git diff --quiet "$MAIN_APP_FROZEN_SOURCE_REF" -- "${PROTECTED[@]}"; then
            echo "MAIN APP protected methodology drift detected. Deployment refused."
            git diff --name-status "$MAIN_APP_FROZEN_SOURCE_REF" -- "${PROTECTED[@]}"
            exit 1
          fi
          echo "MAIN APP protected methodology matches frozen P1 baseline ${MAIN_APP_FROZEN_SOURCE_REF}."

      - name: Validate MAIN APP runtime and live decision contract
        run: |
          set -euo pipefail
          grep -q "MAIN APP" index.html
          grep -q "MAIN APP" manifest.json
          grep -q "MAIN APP" preview-v16/app/v169.html
          node --check service-worker.js
          node --check preview-v16/app/decision-source.js
          node --check preview-v16/app/launch.js
          node --check preview-v16/app/v16-9-basket-overlay.js
          node --check preview-v16/app/session-truth-ui.js
          test -s data/stable/v16-main-app-current.json
          test -s data/stable/v16-v169-primary-decision.json
          test -s data/stable/v15-price-truth.json
          node - <<'NODE'
          const fs = require('fs');
          const canonical = JSON.parse(fs.readFileSync('data/stable/v16-main-app-current.json', 'utf8'));
          const decision = JSON.parse(fs.readFileSync('data/stable/v16-v169-primary-decision.json', 'utf8'));
          const priceTruth = JSON.parse(fs.readFileSync('data/stable/v15-price-truth.json', 'utf8'));
          const model = canonical?.selectedModel?.id || decision?.selectedModel?.id;
          const canonicalTickers = (canonical.recommendations || []).map(row => row.ticker);
          const decisionTickers = (decision.recommendations || []).map(row => row.ticker);
          const canonicalSession = canonical.sessionDate || canonical?.dataTruth?.decisionSession || null;
          const decisionSession = decision.sessionDate || null;
          const marketSession = priceTruth.expectedSession || priceTruth.marketDate || null;
          if (model !== 'V16_9_EQUAL_WEIGHT_BASKET') {
            throw new Error(`Unexpected MAIN APP model: ${model}`);
          }
          if (canonicalTickers.length < 3) {
            throw new Error('MAIN APP canonical basket is empty.');
          }
          if (decisionTickers.length < 3) {
            throw new Error('MAIN APP primary decision basket is empty.');
          }
          if (!canonicalSession || !marketSession || canonicalSession !== marketSession) {
            throw new Error(`Stale canonical snapshot: canonical=${canonicalSession}; market=${marketSession}`);
          }
          if (decisionSession && decisionSession !== canonicalSession) {
            throw new Error(`Decision/canonical session mismatch: decision=${decisionSession}; canonical=${canonicalSession}`);
          }
          if (JSON.stringify(canonicalTickers) !== JSON.stringify(decisionTickers)) {
            throw new Error(`Decision/canonical ticker mismatch: canonical=${canonicalTickers.join(',')}; decision=${decisionTickers.join(',')}`);
          }
          console.log({
            app: 'MAIN APP',
            model,
            recommendationSession: canonicalSession,
            marketSession,
            tickers: canonicalTickers,
            liveDataAllowed: true,
            methodologyLocked: true,
            operationalPatch: 'P3_STALE_DEPLOY_GUARD',
          });
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload MAIN APP
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy MAIN APP
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed MAIN APP is fresh
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          expected_session="$(node -p "require('./data/stable/v16-main-app-current.json').sessionDate")"
          expected_tickers="$(node -p "require('./data/stable/v16-main-app-current.json').recommendations.map(r=>r.ticker).join(',')")"
          base="${DEPLOYED_URL%/}"
          ok=0
          for attempt in $(seq 1 12); do
            cache_bust="$(date +%s)-${attempt}"
            if curl -fsSL --retry 2 --retry-delay 2 "${base}/data/stable/v16-main-app-current.json?cb=${cache_bust}" -o /tmp/deployed-main-app.json; then
              deployed_session="$(node -p "require('/tmp/deployed-main-app.json').sessionDate || ''")"
              deployed_tickers="$(node -p "(require('/tmp/deployed-main-app.json').recommendations||[]).map(r=>r.ticker).join(',')")"
              if [ "$deployed_session" = "$expected_session" ] && [ "$deployed_tickers" = "$expected_tickers" ]; then
                echo "MAIN_APP_POST_DEPLOY_FRESHNESS_PASS session=${deployed_session} tickers=${deployed_tickers}"
                ok=1
                break
              fi
              echo "Attempt ${attempt}: stale/mismatched Pages payload session=${deployed_session} tickers=${deployed_tickers}"
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "MAIN APP deployment is not serving the expected current recommendation snapshot."
            exit 1
          fi

      - name: Record MAIN APP deployment
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const canonical = JSON.parse(fs.readFileSync('data/stable/v16-main-app-current.json', 'utf8'));
          const decision = JSON.parse(fs.readFileSync('data/stable/v16-v169-primary-decision.json', 'utf8'));
          const output = {
            schemaVersion: 'MAIN-APP-16.9.2-p3-stale-deploy-guard',
            generatedAt: new Date().toISOString(),
            status: 'DEPLOYED',
            appName: 'MAIN APP',
            deployedUrl: process.env.DEPLOYED_URL || null,
            sourceCommit: process.env.GITHUB_SHA || null,
            frozenSourceRef: process.env.MAIN_APP_FROZEN_SOURCE_REF || null,
            operationalPatch: 'P3_STALE_DEPLOY_GUARD',
            methodologyChanged: false,
            methodologyLocked: true,
            liveMarketDataAllowed: true,
            liveRecommendationOutputAllowed: true,
            primaryDecisionModel: canonical?.selectedModel?.id || decision?.selectedModel?.id || null,
            sessionDate: canonical.sessionDate || decision.sessionDate || null,
            recommendationTickers: (canonical.recommendations || decision.recommendations || []).map(row => row.ticker),
            protectedDecisionPath: 'data/stable/v16-main-app-current.json',
            applicationEntry: 'preview-v16/app/v169.html',
            postDeployFreshnessVerified: true
          };
          fs.writeFileSync('data/stable/v16-v169-pages-status.json', JSON.stringify(output, null, 2) + '\n');
          console.log(output);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v16-v169-pages-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm MAIN APP protected Pages deployment"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

name: SEPA-X Historical Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - develop/sepax-isolated-v1
    paths:
      - 'sepa-x/src/**'
      - 'sepa-x/scripts/**'
      - 'sepa-x/research-tools/**'
      - 'sepa-x/test/**'
      - 'sepa-x/package.json'
      - '.github/workflows/sepax-historical-benchmark.yml'

permissions:
  contents: write

env:
  V169_FROZEN_BRANCH: release/MAIN-APP-v16.9.2-frozen-20260816
  RC2_SIM_URL: https://egx-tfe-v20-fusion-rc2.vercel.app/api/index?route=simulate&scope=market&symbols=220

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Isolation guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 66b2ac2bc63fe144d5d30d3d304350a6c0d04da9 -- tfe-v20/
          echo 'RC2 frozen runtime untouched.'

      - name: SEPA-X tests
        working-directory: sepa-x
        run: npm test

      - name: Run full-history point-in-time simulator
        working-directory: sepa-x
        run: npm run backtest:historical -- --step=3 --signals=700 --min-universe=60

      - name: Benchmark P1 from actual execution risk
        working-directory: sepa-x
        run: node scripts/precision-execution-benchmark.mjs

      - name: Benchmark retest reclaim and cycle similarity challengers
        working-directory: sepa-x
        run: node scripts/strategy-lab-v2-historical.mjs

      - name: Diagnose historical hard gates
        working-directory: sepa-x
        run: node scripts/historical-diagnostics.mjs

      - name: Fetch frozen RC2 native historical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sepa-x/data/research
          curl --fail --location --retry 4 --retry-all-errors --max-time 180 "$RC2_SIM_URL" -o sepa-x/data/research/rc2-simulate.json
          node -e "const x=require('./sepa-x/data/research/rc2-simulate.json'); if(!x.ok||!x.summary||!x.summary.entered) process.exit(2); console.log(x.summary)"

      - name: Validate precision challengers V2 and preregistered V3
        working-directory: sepa-x
        run: node scripts/precision-challenger-validation.mjs

      - name: Run preregistered research walk-forward evaluator
        working-directory: sepa-x
        run: node research-tools/research-walkforward.mjs

      - name: Load exact frozen V16.9 walk-forward evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$V169_FROZEN_BRANCH:refs/remotes/origin/$V169_FROZEN_BRANCH"
          git show "refs/remotes/origin/$V169_FROZEN_BRANCH:data/research/v16-v169-basket-engine.json" > sepa-x/data/research/v16-v169-basket-engine.json
          node -e "const x=require('./sepa-x/data/research/v16-v169-basket-engine.json'); if(!x.productionEligible||!x.blockedWalkForwardMetrics) process.exit(2); console.log(x.blockedWalkForwardMetrics)"

      - name: Compare SEPA-X vs RC2 vs V16.9
        working-directory: sepa-x
        run: npm run compare:engines

      - name: Print concise benchmark
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('sepa-x/data/research/historical-simulator-summary.json'));
          const p=JSON.parse(fs.readFileSync('sepa-x/data/research/precision-execution-benchmark.json'));
          const g=JSON.parse(fs.readFileSync('sepa-x/data/research/precision-geometry-historical.json'));
          const q=JSON.parse(fs.readFileSync('sepa-x/data/research/precision-challenger-validation.json'));
          const lab=JSON.parse(fs.readFileSync('sepa-x/data/research/strategy-lab-v2-historical.json'));
          const w=JSON.parse(fs.readFileSync('sepa-x/data/research/research-walkforward.json'));
          const c=JSON.parse(fs.readFileSync('sepa-x/data/research/engine-comparison.json'));
          const d=JSON.parse(fs.readFileSync('sepa-x/data/research/historical-diagnostics.json'));
          console.log('SEPA_X_SUMMARY='+JSON.stringify(s.summary));
          console.log('EXECUTED_P1_10='+JSON.stringify(p.executedRiskP1.tenSessions));
          console.log('EXECUTED_P1_20='+JSON.stringify(p.executedRiskP1.twentySessions));
          console.log('P1_TEMPORAL_10='+JSON.stringify(p.executedRiskP1.temporal10));
          console.log('P1_R_SWEEP='+JSON.stringify(p.rSweepExecuted));
          console.log('STRUCTURAL_PRECISION_FROZEN_CONTROL='+JSON.stringify({generatedAt:g.generatedAt,summary:g.summary,candidateCoverage:g.candidateCoverage}));
          console.log('STRATEGY_LAB_V2_DATASET='+JSON.stringify(lab.dataset));
          console.log('RETEST_RECLAIM_V2='+JSON.stringify(lab.results.retestReclaimV2));
          console.log('CYCLE_PATTERN_SIMILARITY='+JSON.stringify(lab.results.cyclePatternSimilarity));
          console.log('RETEST_CYCLE_ENSEMBLE='+JSON.stringify(lab.results.ensemble));
          console.log('PRECISION_CHALLENGER_DATASET='+JSON.stringify(q.dataset));
          console.log('PRECISION_CHALLENGER_V2='+JSON.stringify(q.variants.v2.summary));
          console.log('PRECISION_CHALLENGER_V2_TEMPORAL='+JSON.stringify(q.variants.v2.temporal));
          console.log('PRECISION_CHALLENGER_V2_GATE='+JSON.stringify(q.promotionGate));
          console.log('PRECISION_CHALLENGER_V3='+JSON.stringify(q.variants.v3.summary));
          console.log('PRECISION_CHALLENGER_V3_TEMPORAL='+JSON.stringify(q.variants.v3.temporal));
          console.log('PRECISION_CHALLENGER_V3_HOLDOUT='+JSON.stringify(q.variants.v3.holdout));
          console.log('PRECISION_CHALLENGER_V3_SENSITIVITY='+JSON.stringify(q.variants.v3.sensitivity));
          console.log('PRECISION_CHALLENGER_V3_GATE='+JSON.stringify(q.v3PromotionGate));
          console.log('RESEARCH_WALKFORWARD_OOS='+JSON.stringify(w.oosSummary));
          console.log('RESEARCH_WALKFORWARD_FOLDS='+JSON.stringify(w.folds));
          console.log('RESEARCH_WALKFORWARD_GATE='+JSON.stringify(w.gate));
          console.log('OVERALL_VERDICT='+c.overallVerdict);
          console.log('DIMENSIONS='+JSON.stringify(c.dimensions));
          console.log('HARD_GATE_DIAGNOSTICS='+JSON.stringify(d.reports.map(x=>({date:x.date,market:x.market?.Regime||x.market?.regime,statuses:x.statuses,reasons:x.hardReasonCounts,eligible:x.concentration?.eligible,maxima:x.concentration?.maxima}))));
          NODE
          cat sepa-x/docs/ENGINE_COMPARISON_REPORT.md

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: sepax-historical-benchmark
          if-no-files-found: error
          retention-days: 30
          path: |
            sepa-x/data/research/historical-simulator.json
            sepa-x/data/research/historical-simulator-summary.json
            sepa-x/data/research/precision-execution-benchmark.json
            sepa-x/data/research/precision-geometry-historical.json
            sepa-x/data/research/precision-challenger-validation.json
            sepa-x/data/research/strategy-lab-v2-historical.json
            sepa-x/data/research/research-walkforward.json
            sepa-x/data/research/historical-diagnostics.json
            sepa-x/data/research/rc2-simulate.json
            sepa-x/data/research/v16-v169-basket-engine.json
            sepa-x/data/research/engine-comparison.json
            sepa-x/docs/ENGINE_COMPARISON_REPORT.md

      - name: Persist benchmark evidence to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT=/tmp/sepax-benchmark-evidence
          rm -rf "$SNAPSHOT"
          mkdir -p "$SNAPSHOT/sepa-x/data/research" "$SNAPSHOT/sepa-x/docs"
          cp sepa-x/data/research/historical-simulator.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/historical-simulator-summary.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/precision-execution-benchmark.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/precision-geometry-historical.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/precision-challenger-validation.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/strategy-lab-v2-historical.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/research-walkforward.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/historical-diagnostics.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/rc2-simulate.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/v16-v169-basket-engine.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/data/research/engine-comparison.json "$SNAPSHOT/sepa-x/data/research/"
          cp sepa-x/docs/ENGINE_COMPARISON_REPORT.md "$SNAPSHOT/sepa-x/docs/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin develop/sepax-isolated-v1
            git reset --hard origin/develop/sepax-isolated-v1
            cp -R "$SNAPSHOT/sepa-x/data/research/." sepa-x/data/research/
            cp "$SNAPSHOT/sepa-x/docs/ENGINE_COMPARISON_REPORT.md" sepa-x/docs/ENGINE_COMPARISON_REPORT.md
            git add sepa-x/data/research/historical-simulator.json \
                    sepa-x/data/research/historical-simulator-summary.json \
                    sepa-x/data/research/precision-execution-benchmark.json \
                    sepa-x/data/research/precision-geometry-historical.json \
                    sepa-x/data/research/precision-challenger-validation.json \
                    sepa-x/data/research/strategy-lab-v2-historical.json \
                    sepa-x/data/research/research-walkforward.json \
                    sepa-x/data/research/historical-diagnostics.json \
                    sepa-x/data/research/rc2-simulate.json \
                    sepa-x/data/research/v16-v169-basket-engine.json \
                    sepa-x/data/research/engine-comparison.json \
                    sepa-x/docs/ENGINE_COMPARISON_REPORT.md
            if git diff --cached --quiet; then
              echo 'Benchmark evidence unchanged.'
              exit 0
            fi
            git commit -m 'data(sepa-x): persist historical benchmark evidence [skip ci]'
            if git push origin HEAD:develop/sepax-isolated-v1; then
              exit 0
            fi
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 6))
          done

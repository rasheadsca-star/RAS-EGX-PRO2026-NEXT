name: EGX AQM From Existing Central Long History
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/egx-aqm-central-long-history.yml'
      - 'scripts/research/egx-aqm-central-long-history-research-v1.cjs'
      - 'scripts/research/egx-aqm-single-trading-readiness-gate-v1.cjs'
      - 'tests/research/egx-aqm-single-trading-readiness-gate-v1.test.cjs'
      - 'scripts/research/egx-central-price-conflict-attribution-v1.cjs'
      - 'scripts/research/egx-price-evidence-triage-v1.cjs'
      - 'scripts/research/egx-p0-scale-investigation-v1.cjs'
      - 'tests/research/egx-p0-scale-investigation-v1.test.cjs'
      - 'tests/research/egx-price-evidence-triage-v1.test.cjs'
      - 'tests/research/egx-central-price-conflict-attribution-v1.test.cjs'
      - 'scripts/research/egx-central-research-ohlcv-gateway-v1.cjs'
      - 'scripts/research/egx-aqm-mark-integrity-v1.cjs'
      - 'tests/research/egx-aqm-mark-integrity-v1.test.cjs'
      - 'scripts/research/egx-aqm-research-v1.cjs'
      - 'tests/research/egx-aqm-research-v1.test.cjs'
      - 'tests/research/egx-central-research-ohlcv-gateway-v1.test.cjs'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout EXISTING central branch research sources (read-only)
        uses: actions/checkout@v4
        with:
          ref: egx-research-ledger
          path: sources/central-ledger
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /raw-long-history-gzip/*.json.gz
            /raw-long-history-quality.json
      - name: Validate audit trail for market-to-market stale price valuation
        run: node --test tests/research/egx-aqm-mark-integrity-v1.test.cjs tests/research/egx-aqm-research-v1.test.cjs
      - name: Gate test of actual long-history candle reader
        run: node --test tests/research/egx-central-research-ohlcv-gateway-v1.test.cjs
      - name: Test and attribute price conflicts without auto-promoting sources
        run: |
          node --test tests/research/egx-central-price-conflict-attribution-v1.test.cjs
          node scripts/research/egx-central-price-conflict-attribution-v1.cjs
      - name: Validate and export independent price evidence intake queue (no price promotion)
        run: |
          node --test tests/research/egx-price-evidence-triage-v1.test.cjs
          node scripts/research/egx-price-evidence-triage-v1.cjs
      - name: Produce P0 case-by-security investigation with zero price adjustments
        run: |
          node --test tests/research/egx-p0-scale-investigation-v1.test.cjs
          node scripts/research/egx-p0-scale-investigation-v1.cjs
      - name: Run AQM with restored central history research source, never live
        run: node scripts/research/egx-aqm-central-long-history-research-v1.cjs
      - name: Validate single production readiness gate and issue final research-only report
        run: |
          node --test tests/research/egx-aqm-single-trading-readiness-gate-v1.test.cjs
          node scripts/research/egx-aqm-single-trading-readiness-gate-v1.cjs
      - name: Expose research results and strict noncertification
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),r=JSON.parse(fs.readFileSync('data/research/egx-aqm-central-long-history-research-v1.json'));
          const lines=['## AQM on EXISTING central long-history research source','',
            'Long-history source used: '+r.input+'; eligible verified-for-research ticker files: '+r.coverage.usableSymbols+
            '; production eligible: **NO**; official EGX30/fundamental/event history: **NOT CERTIFIED**.','',
            '| Turnover threshold EGP | Variant | Signals | Closed trades | Return % | Max DD % | Stale bars |',
            '|---:|---|---:|---:|---:|---:|---:|'];
          for(const x of r.results)for(const m of x.strategies)lines.push('| '+x.minimumTurnoverEgp+' | '+m.variant+' | '+m.signals+' | '+m.closedTrades+' | '+m.diagnosticReturnPct+' | '+m.maximumDiagnosticDrawdownPct+' | '+m.staleMarks+' |');
          const conflicts=JSON.parse(fs.readFileSync('data/research/egx-central-price-conflict-attribution-v1.json'));
          lines.push('','### Price source reconciliation — no automatic price replacement','',
            'Disagreement threshold: '+conflicts.thresholdPct+'%; conflict tickers: '+conflicts.totals.stocksWithConflicts+
            '; mismatching sessions: '+conflicts.totals.conflictDays+
            '; involving reconstructed main OHLCV: '+conflicts.totals.weakMainEvidenceDisagreements+
            '; requiring other source verification: '+conflicts.totals.conflictsWithNonReconstructedMain+
            '. **Neither feed has been automatically promoted**.');
          lines.push('','### Valuation integrity — fail closed','',
            '| Threshold | Variant | Stale position sessions | Worst mark age (market sessions) | Max stale capital (EGP) | Mark quality | Certified return |',
            '|---:|---|---:|---:|---:|---|---|');
          for(const x of r.results)for(const m of x.strategies){
            const q=m.markIntegrity;
            lines.push('| '+x.minimumTurnoverEgp+' | '+m.variant+' | '+q.stalePositionSessions+' | '+q.maxStaleAgeSessions+
              ' | '+q.maxStaleExposedEgp+' | '+q.status+' | **NOT CERTIFIED** |');
          }
          const gate=JSON.parse(fs.readFileSync('data/research/egx-aqm-single-trading-readiness-gate-v1.json'));
          lines.push('','### Final single decision gate: '+gate.status,
            'No executable buy recommendations or broker automation can be authorized. Approved strategies: '+gate.approvedStrategies+'.');
          for(const g of gate.scenarios)lines.push(g.liquidityFloorEgp+' EGP / '+g.variant+': '+g.blockers.join(', '));
          lines.push('','NOT independent OOS. No live recommendations. The 5% stale-mark haircut is a hypothetical scenario, NOT an observed fill. Qualifying subset selected with hindsight; corporate-action and universe survivorship bias possible.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egx-aqm-read-existing-central-long-history
          path: |
            data/research/egx-aqm-central-long-history-research-v1.json
            data/research/egx-central-price-conflict-attribution-v1.json
            data/research/egx-price-evidence-triage-v1.json
            data/research/egx-price-evidence-triage-v1.csv
            data/research/egx-p0-scale-investigation-v1.json
            data/research/egx-aqm-single-trading-readiness-gate-v1.json
          retention-days: 30

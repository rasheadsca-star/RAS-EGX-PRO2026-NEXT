name: V14 Recommendation Quality Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v14-recommendation-quality-recovery.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v14-recommendation-quality-recovery
  cancel-in-progress: true

jobs:
  repair-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch hybrid recommendation ranking and labels
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceOrFail(text, pattern, replacement, label) {
            if (!pattern.test(text)) throw new Error(`Patch target not found: ${label}`);
            return text.replace(pattern, replacement);
          }

          const enginePath = 'scripts/stable/v14-stable-decision-system.cjs';
          let engine = fs.readFileSync(enginePath, 'utf8');

          if (!engine.includes('V14_HYBRID_WATCH_RANKING')) {
            engine = replaceOrFail(
              engine,
              /function watchScore\(candidate\) \{[\s\S]*?\n\}\n\nfunction candidateGateReasons/,
              `// V14_HYBRID_WATCH_RANKING: technical selection first, probability and risk decide order.\nfunction watchScore(candidate, estimate = {}) {\n  const stock = candidate?.stock || {};\n  const risk = candidate?.riskProfile || {};\n  const exactFresh = candidate?.exactFresh !== false;\n  const hardFailures = num(candidate?.hardFailureCount, arr(candidate?.hardFailures).length || 0);\n  const rsi14 = num(stock.rsi14 ?? candidate?.rsi14, 55);\n  const targetProbability = num(estimate?.targetProbabilityPct, 0);\n  const stopProbability = num(estimate?.stopProbabilityPct, 100);\n  const probabilityEdge = num(estimate?.probabilityEdgePct, targetProbability - stopProbability);\n  const expectedReturn = num(estimate?.expectedNetReturn5Pct, -5);\n  const effectiveSample = num(estimate?.effectiveSample, 0);\n  const distinctSessions = num(estimate?.distinctTrainingSessions, 0);\n  const overboughtPenalty = Math.max(0, rsi14 - 72) * 1.8;\n  const negativeEdgePenalty = targetProbability <= stopProbability ? 16 : 0;\n  const negativeReturnPenalty = expectedReturn <= 0 ? 10 : 0;\n\n  const technicalComponent =\n    (exactFresh ? 24 : -80)\n    + (hardFailures === 0 ? 18 : -hardFailures * 30)\n    + num(candidate?.decisionScore, 0) * 0.2\n    + num(candidate?.recommendationScore, 0) * 0.16\n    + num(stock.technicalScore, 0) * 0.12\n    + num(risk.liquidityPercentile, 0) * 0.07\n    - num(risk.riskScore, 50) * 0.11\n    - overboughtPenalty;\n\n  const probabilityComponent =\n    targetProbability * 0.3\n    - stopProbability * 0.22\n    + clamp(probabilityEdge, -30, 30) * 1.35\n    + clamp(expectedReturn, -4, 6) * 4.5\n    + Math.min(effectiveSample, 100) * 0.04\n    + Math.min(distinctSessions, 40) * 0.1;\n\n  return round(\n    technicalComponent + probabilityComponent - negativeEdgePenalty - negativeReturnPenalty,\n    2,\n  );\n}\n\nfunction opportunityBucket(candidate, estimate = {}) {\n  const stock = candidate?.stock || {};\n  const risk = candidate?.riskProfile || {};\n  const target = num(estimate?.targetProbabilityPct, 0);\n  const stop = num(estimate?.stopProbabilityPct, 100);\n  const edge = num(estimate?.probabilityEdgePct, target - stop);\n  const expected = num(estimate?.expectedNetReturn5Pct, -999);\n  const riskScore = num(risk.riskScore, 100);\n  const liquidity = num(risk.liquidityPercentile, 0);\n  const turnover = num(stock.averageTurnover20Egp ?? risk.averageTurnover20Egp, 0);\n  const positiveEdge = target > stop && edge > 0;\n  const positiveReturn = expected > 0;\n  const operationalQuality = riskScore <= 60 && liquidity >= 20 && turnover >= 5000000;\n  if (positiveEdge && positiveReturn && operationalQuality) return 0;\n  if (positiveEdge && positiveReturn) return 1;\n  if (positiveReturn) return 2;\n  return 3;\n}\n\nfunction opportunityStatus(candidate, estimate = {}) {\n  const bucket = opportunityBucket(candidate, estimate);\n  if (bucket === 0) return { code: 'STRONG_RESEARCH_EDGE', labelAr: 'أفضلية بحثية موجبة مع سيولة ومخاطر مقبولة' };\n  if (bucket === 1) return { code: 'POSITIVE_RESEARCH_EDGE', labelAr: 'أفضلية بحثية موجبة لكن بعض شروط التشغيل لم تكتمل' };\n  if (bucket === 2) return { code: 'TECHNICAL_WATCH', labelAr: 'عائد متوقع موجب لكن احتمال الهدف لا يتفوق على الوقف' };\n  return { code: 'NEGATIVE_EDGE_WATCH', labelAr: 'مراقبة فنية فقط — الأفضلية الاحتمالية سالبة' };\n}\n\nfunction candidateGateReasons`,
              'watchScore function',
            );

            engine = replaceOrFail(
              engine,
              /watchScore: watchScore\(candidate\),/,
              `watchScore: watchScore(candidate, estimate),\n    opportunityBucket: opportunityBucket(candidate, estimate),\n    opportunityStatus: opportunityStatus(candidate, estimate).code,\n    opportunityStatusAr: opportunityStatus(candidate, estimate).labelAr,\n    targetBeatsStop: num(estimate?.targetProbabilityPct, 0) > num(estimate?.stopProbabilityPct, 100),\n    positiveExpectedReturn: num(estimate?.expectedNetReturn5Pct, -999) > 0,`,
              'mapped watch score',
            );

            engine = replaceOrFail(
              engine,
              /const sortedWatch = \[\.\.\.candidates\]\.sort\(\(a, b\) =>[\s\S]*?\n  \);\n\n  const watchlist/,
              `const sortedWatch = [...candidates].sort((a, b) => {\n    const estimateA = estimates.get(a.ticker) || {};\n    const estimateB = estimates.get(b.ticker) || {};\n    return opportunityBucket(a, estimateA) - opportunityBucket(b, estimateB)\n      || watchScore(b, estimateB) - watchScore(a, estimateA)\n      || num(estimateB.targetProbabilityPct, 0) - num(estimateA.targetProbabilityPct, 0)\n      || num(estimateA.stopProbabilityPct, 100) - num(estimateB.stopProbabilityPct, 100)\n      || tierOrder(a.tier) - tierOrder(b.tier)\n      || num(b.decisionScore, 0) - num(a.decisionScore, 0)\n      || a.ticker.localeCompare(b.ticker);\n  });\n\n  const watchlist`,
              'watchlist sorting',
            );

            engine = replaceOrFail(
              engine,
              /watchlistCount: watchlist\.length,\n    \},/,
              `watchlistCount: watchlist.length,\n      topFiveAreRecommendations: false,\n      watchlistPurpose: 'RESEARCH_MONITORING_ONLY',\n      watchlistRankingMode: 'HYBRID_TECHNICAL_PROBABILITY_RISK',\n    },`,
              'decision metadata',
            );

            fs.writeFileSync(enginePath, engine);
          }

          const uiPath = 'preview-v14/app/index.html';
          let ui = fs.readFileSync(uiPath, 'utf8');
          if (!ui.includes('V14_HYBRID_WATCH_UI')) {
            ui = ui.replace(
              'أفضل خمسة أسهم تحت النظر دائمًا، ومن صفر إلى ثلاث توصيات مؤهلة فقط بعد اجتياز الدليل والمخاطر وجودة البيانات.',
              'التوصيات المؤهلة تظهر منفصلة بوضوح. أما أفضل خمسة فهي مراقبة بحثية فقط، مرتبة بمزيج من القوة الفنية واحتمال الهدف والوقف والعائد المتوقع والمخاطر.',
            );

            ui = replaceOrFail(
              ui,
              /function watchCard\(item\)\{[\s\S]*?\n\}\n\nfunction recommendationCard/,
              `// V14_HYBRID_WATCH_UI\nfunction watchCard(item){\n  const probability=item?.probability||{};\n  const edge=n(probability.probabilityEdgePct);\n  const strong=item.opportunityBucket===0||item.opportunityBucket===1;\n  return \`<article class="watch">\n    <div class="rank">\${esc(item.watchRank)}</div>\n    <h3><span class="blue">\${esc(item.ticker)}</span></h3>\n    <div class="name">\${esc(item.companyNameAr)}</div>\n    <div class="tags"><span class="tag \${tierClass(item.tier)}">الطبقة \${tierShort(item.tier)}</span><span class="tag \${item.exactFresh?'strict':'warn'}">\${item.exactFresh?'حديث':'متأخر'}</span><span class="tag \${strong?'strict':'warn'}">\${strong?'أفضلية موجبة':'مراقبة فقط'}</span></div>\n    <div class="metrics"><div class="metric">سعر آخر جلسة<b>\${fmt(item.currentPrice,4)}</b></div><div class="metric">درجة الفرصة الهجينة<b>\${fmt(item.watchScore,1)}</b></div><div class="metric">احتمال الهدف<b>\${pct(probability.targetProbabilityPct)}</b></div><div class="metric">احتمال الوقف<b class="\${n(probability.stopProbabilityPct)>n(probability.targetProbabilityPct)?'red':'green'}">\${pct(probability.stopProbabilityPct)}</b></div><div class="metric">أفضلية الهدف على الوقف<b class="\${edge>0?'green':'red'}">\${pct(edge)}</b></div><div class="metric">العائد المتوقع 5 جلسات<b class="\${n(probability.expectedNetReturn5Pct)>0?'green':'red'}">\${pct(probability.expectedNetReturn5Pct)}</b></div><div class="metric">السيولة 20 جلسة<b>\${money(item.averageTurnover20Egp)}</b></div><div class="metric">المخاطر<b>\${fmt(item.riskScore,0)}</b></div></div>\n    \${planHtml(item.plan)}\n    <div class="watch-note">\${esc(item.opportunityStatusAr||'مراقبة بحثية فقط')}. هذه البطاقة ليست توصية شراء ولا تدخل ضمن عدد التوصيات المؤهلة.</div>\n  </article>\`;\n}\n\nfunction recommendationCard`,
              'watch card UI',
            );

            ui = ui.replace(
              '<h2>أفضل خمسة أسهم تحت النظر الآن</h2><p>قائمة متابعة ثابتة الظهور، مرتبة داخل Strict ثم A ثم B وفق الجودة الفنية والسيولة والمخاطر وحداثة البيانات.</p>',
              '<h2>أفضل خمسة أسهم تحت النظر الآن — مراقبة بحثية وليست توصيات شراء</h2><p>الترتيب الهجين يبدأ بمرشحي V13 الفنيين ثم يعيد ترتيبهم باحتمال الهدف مقابل الوقف والعائد المتوقع والسيولة والمخاطر. الأفضلية السالبة تظهر بوضوح ولا تُقدَّم كشراء.</p>',
            );

            ui = ui.replace(
              '• أفضل خمسة أسهم تظهر دائمًا للمتابعة، لكنها لا تتحول تلقائيًا إلى شراء.',
              '• أفضل خمسة أسهم هي قائمة مراقبة بحثية وليست توصيات شراء؛ ترتيبها يستخدم القوة الفنية مع احتمال الهدف والوقف والعائد المتوقع والسيولة والمخاطر.',
            );

            fs.writeFileSync(uiPath, ui);
          }

          const acceptancePath = 'scripts/stable/v14-acceptance.cjs';
          let acceptance = fs.readFileSync(acceptancePath, 'utf8');
          if (!acceptance.includes('topFiveAreRecommendations')) {
            acceptance = acceptance.replace(
              "if (result.decision?.noTrade === false && result.qualifiedRecommendations.length === 0) fail('trade status conflicts with empty recommendations');",
              "if (result.decision?.noTrade === false && result.qualifiedRecommendations.length === 0) fail('trade status conflicts with empty recommendations');\nif (result.decision?.topFiveAreRecommendations !== false) fail('top-five watchlist is mislabeled as recommendations');\nif (result.topFiveWatchlist.some(item => item.status !== 'WATCH_ONLY')) fail('watchlist contains a non-watch status');\nfor (let index = 1; index < result.topFiveWatchlist.length; index += 1) {\n  const previous = result.topFiveWatchlist[index - 1];\n  const current = result.topFiveWatchlist[index];\n  if (Number(previous.opportunityBucket) > Number(current.opportunityBucket)) fail('watchlist opportunity buckets are not sorted');\n  if (Number(previous.opportunityBucket) === Number(current.opportunityBucket) && Number(previous.watchScore) < Number(current.watchScore)) fail('watchlist hybrid scores are not sorted');\n}",
            );
            acceptance = acceptance.replace(
              "  'أفضل خمسة أسهم تحت النظر الآن',",
              "  'أفضل خمسة أسهم تحت النظر الآن',\n  'مراقبة بحثية وليست توصيات شراء',",
            );
            fs.writeFileSync(acceptancePath, acceptance);
          }

          const policyPath = 'data/stable/v14-policy.json';
          const policy = JSON.parse(fs.readFileSync(policyPath, 'utf8'));
          policy.watchRanking = {
            mode: 'HYBRID_TECHNICAL_PROBABILITY_RISK',
            technicalCandidateSource: 'V13 tiers and technical decision scores',
            rankingPriority: ['positive_probability_edge', 'positive_expected_return', 'hybrid_score', 'target_probability', 'lower_stop_probability'],
            topFiveAreRecommendations: false,
            descriptionAr: 'أفضل خمسة هي مراقبة بحثية فقط. يبدأ الاختيار من مرشحي V13 الفنيين ثم يعاد ترتيبهم باحتمال الهدف والوقف والعائد المتوقع والسيولة والمخاطر.'
          };
          fs.writeFileSync(policyPath, JSON.stringify(policy, null, 2) + '\n');

          for (const path of ['index.html', 'manifest.json']) {
            let text = fs.readFileSync(path, 'utf8');
            text = text.replaceAll('v14-stable-20260728', 'v14-quality-20260802');
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Rebuild V14 decision output
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/stable/v14-stable-decision-system.cjs
          node scripts/stable/v14-stable-decision-system.cjs
          node --check scripts/stable/v14-acceptance.cjs
          node scripts/stable/v14-acceptance.cjs

      - name: Verify recommendation quality contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json', 'utf8'));
          if (result.decision?.topFiveAreRecommendations !== false) throw new Error('Top five remain mislabeled');
          if (result.topFiveWatchlist.some(item => item.status !== 'WATCH_ONLY')) throw new Error('Watchlist status leak');
          if (!result.topFiveWatchlist.every(item => Number.isFinite(Number(item.probability?.targetProbabilityPct)) && Number.isFinite(Number(item.probability?.stopProbabilityPct)))) throw new Error('Probability fields missing');
          for (let i = 1; i < result.topFiveWatchlist.length; i += 1) {
            const a = result.topFiveWatchlist[i - 1];
            const b = result.topFiveWatchlist[i];
            if (a.opportunityBucket > b.opportunityBucket) throw new Error('Opportunity bucket order invalid');
            if (a.opportunityBucket === b.opportunityBucket && a.watchScore < b.watchScore) throw new Error('Hybrid score order invalid');
          }
          const audit = {
            generatedAt: new Date().toISOString(),
            sessionDate: result.sessionDate,
            rankingMode: result.decision?.watchlistRankingMode,
            topFiveAreRecommendations: false,
            noTrade: result.decision?.noTrade,
            qualifiedRecommendations: result.qualifiedRecommendations.map(item => item.ticker),
            watchlist: result.topFiveWatchlist.map(item => ({
              rank: item.watchRank,
              ticker: item.ticker,
              opportunityBucket: item.opportunityBucket,
              hybridScore: item.watchScore,
              targetProbabilityPct: item.probability?.targetProbabilityPct,
              stopProbabilityPct: item.probability?.stopProbabilityPct,
              probabilityEdgePct: item.probability?.probabilityEdgePct,
              expectedNetReturn5Pct: item.probability?.expectedNetReturn5Pct,
              status: item.status,
              statusAr: item.opportunityStatusAr,
            })),
          };
          fs.writeFileSync('data/stable/v14-recommendation-quality-audit.json', JSON.stringify(audit, null, 2) + '\n');
          console.log(JSON.stringify(audit, null, 2));
          NODE

      - name: Commit repaired recommendation quality
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stable/v14-stable-decision-system.cjs scripts/stable/v14-acceptance.cjs data/stable/v14-policy.json data/stable/v14-stable-decision.json data/stable/v14-forward-sessions.json data/stable/v14-recommendation-quality-audit.json preview-v14/app/index.html index.html manifest.json
          if git diff --cached --quiet; then
            echo "Recommendation quality fix already applied."
          else
            git commit -m "Recover V14 recommendation quality and honest watch ranking"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 15))
            done
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload repaired site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy repaired V14
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Final report
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json', 'utf8'));
          console.log(JSON.stringify({
            sessionDate: result.sessionDate,
            rankingMode: result.decision?.watchlistRankingMode,
            topFiveAreRecommendations: result.decision?.topFiveAreRecommendations,
            watchlist: result.topFiveWatchlist.map(item => ({ticker:item.ticker, bucket:item.opportunityBucket, score:item.watchScore, edge:item.probability?.probabilityEdgePct, expected:item.probability?.expectedNetReturn5Pct})),
            qualified: result.qualifiedRecommendations.map(item => item.ticker),
            url: 'https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/'
          }, null, 2));
          NODE

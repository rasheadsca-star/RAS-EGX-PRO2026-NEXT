name: Astra G16 Production Deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'astra/certification/g16-certify.cjs'
      - '.github/workflows/astra-g16-production-deployment.yml'

permissions:
  contents: write
  actions: read

env:
  G16_PRODUCTION_COMMIT: 3ce76f81426885dae34ab9e921edba9975f35d52
  G16_PAGES_RUN_ID: '35474933629'
  G16_PRODUCTION_URL: https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/astra-prod/
  G16_RUNTIME_URL: https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT/astra-prod/runtime/v18/index.html

concurrency:
  group: astra-g16-production-deployment
  cancel-in-progress: false

jobs:
  verify-and-certify:
    if: github.ref == 'refs/heads/astra/g11-guard37-recovery-20260916' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip g16]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify G16 pre-certification boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const gates=require('./04_ACCEPTANCE_GATES.json').gates,m=new Map(gates.map(x=>[x.id,x.status]));
          for(let n=1;n<=15;n++){const id='G'+String(n).padStart(2,'0');if(m.get(id)!=='GREEN')throw Error(id+' not GREEN')}
          if(m.get('G16')!=='PENDING')throw Error('G16 must be PENDING');
          for(const id of ['G17','G18','G19'])if(m.get(id)!=='PENDING')throw Error(id+' must remain PENDING');
          const s=require('./docs/astra/WORK_STATE.json'),g15=require('./docs/astra/G15_CERTIFICATION.json');
          if(s.current_gate!=='G16'||s.last_green_gate!=='G15'||s.current_phase!=='G16_PENDING')throw Error('G16 state boundary invalid');
          if(g15.status!=='GREEN'||g15.productionCutover!==false||g15.runtimeLegacyDependencyCount!==0)throw Error('G15 boundary invalid');
          NODE

      - name: Revalidate zero-legacy runtime boundary
        run: |
          set -euo pipefail
          node astra/certification/legacy-isolation.cjs . --full > /tmp/g16-legacy.json
          node -e "const x=require('/tmp/g16-legacy.json');if(x.clean!==true||x.runtimeLegacyDependencyCount!==0||x.matches.length)process.exit(1)"

      - name: Verify production commit and Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "$G16_PRODUCTION_COMMIT^{commit}"
          git merge-base --is-ancestor "$G16_PRODUCTION_COMMIT" origin/main
          git show "$G16_PRODUCTION_COMMIT:.github/workflows/static.yml" > /tmp/g16-static.yml
          grep -q 'working-directory: astra/vendor/sepa-x' /tmp/g16-static.yml
          ! grep -q 'develop/sepax-isolated-v1' /tmp/g16-static.yml
          git cat-file -e "$G16_PRODUCTION_COMMIT:astra/vendor/sepa-x/package.json"
          if git diff --name-only "$G16_PRODUCTION_COMMIT^" "$G16_PRODUCTION_COMMIT" | grep -Eq '^(v18-live/|preview-v16/|tfe-v20/|index\.html$)'; then exit 1; fi
          for pair in \
            'astra/runtime/v18/index.html:astra-prod/runtime/v18/index.html' \
            'astra/runtime/v18/resource-client.js:astra-prod/runtime/v18/resource-client.js' \
            'astra/runtime/v18/app.js:astra-prod/runtime/v18/app.js'
          do
            src="${pair%%:*}"; dst="${pair#*:}"
            git show "$G16_PRODUCTION_COMMIT:$dst" > /tmp/g16-prod-file
            cmp -s "$src" /tmp/g16-prod-file
          done
          for f in G11_CURRENT_PIPELINE_RUN.json G11_DATA_HEALTH_METRICS.json G11_DATA_HEALTH_ISSUES.json G11_GUARD37_EVIDENCE.json; do
            git show "$G16_PRODUCTION_COMMIT:docs/astra/$f" > "/tmp/g16-main-$f"
            cmp -s "docs/astra/$f" "/tmp/g16-main-$f"
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$G16_PAGES_RUN_ID" > /tmp/g16-pages-run.json
          node <<'NODE'
          const r=require('/tmp/g16-pages-run.json');
          if(r.head_sha!==process.env.G16_PRODUCTION_COMMIT||r.status!=='completed'||r.conclusion!=='success')throw Error('Pages run boundary invalid');
          NODE

      - name: Verify live production bytes
        run: |
          set -euo pipefail
          BASE='https://rasheadsca-star.github.io/RAS-EGX-PRO2026-NEXT'
          fetch_retry(){ local url="$1" out="$2"; for attempt in 1 2 3 4 5 6 7 8; do code="$(curl -sS -L --retry 2 -o "$out" -w '%{http_code}' "$url?g16=$GITHUB_RUN_ID-$attempt" || true)"; [ "$code" = "200" ] && return 0; [ "$attempt" = "8" ] && return 1; sleep 3; done; }
          fetch_retry "$BASE/astra-prod/index.html" /tmp/g16-live-root.html
          grep -q 'Astra Standalone Production' /tmp/g16-live-root.html
          fetch_retry "$BASE/astra-prod/runtime/v18/index.html" /tmp/g16-live-index.html
          fetch_retry "$BASE/astra-prod/runtime/v18/resource-client.js" /tmp/g16-live-resource-client.js
          fetch_retry "$BASE/astra-prod/runtime/v18/app.js" /tmp/g16-live-app.js
          cmp -s astra/runtime/v18/index.html /tmp/g16-live-index.html
          cmp -s astra/runtime/v18/resource-client.js /tmp/g16-live-resource-client.js
          cmp -s astra/runtime/v18/app.js /tmp/g16-live-app.js
          fetch_retry "$BASE/astra-prod/G16_DEPLOYMENT_MANIFEST.json" /tmp/g16-live-manifest.json
          node -e "const m=require('/tmp/g16-live-manifest.json');if(m.productionCutover!==false||m.publicEntrypointChanged!==false||m.runtimeLegacyDependencyCount!==0||m.runtimeExternalReferences!==0)process.exit(1)"
          for f in G11_CURRENT_PIPELINE_RUN.json G11_DATA_HEALTH_METRICS.json G11_DATA_HEALTH_ISSUES.json G11_GUARD37_EVIDENCE.json; do
            fetch_retry "$BASE/docs/astra/$f" "/tmp/g16-live-$f"
            cmp -s "docs/astra/$f" "/tmp/g16-live-$f"
          done
          node -e "const fs=require('fs'),a=['astra/runtime/v18/index.html','astra/runtime/v18/resource-client.js','astra/runtime/v18/app.js'];let n=0;for(const f of a)n+=(fs.readFileSync(f,'utf8').match(/https?:\/\//g)||[]).length;if(n)process.exit(1)"

      - name: Build G16 deployment evidence
        env:
          G16_SOURCE_HEAD: ${{ github.sha }}
          G16_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          const runtime=[['astra/runtime/v18/index.html','/tmp/g16-live-index.html'],['astra/runtime/v18/resource-client.js','/tmp/g16-live-resource-client.js'],['astra/runtime/v18/app.js','/tmp/g16-live-app.js']].map(([file,live])=>({file,sourceSha256:sha(file),deployedSha256:sha(live),match:sha(file)===sha(live)}));
          const names=['G11_CURRENT_PIPELINE_RUN.json','G11_DATA_HEALTH_METRICS.json','G11_DATA_HEALTH_ISSUES.json','G11_GUARD37_EVIDENCE.json'];
          const truth=names.map(name=>{const file='docs/astra/'+name,live='/tmp/g16-live-'+name;return{file,sourceSha256:sha(file),deployedSha256:sha(live),match:sha(file)===sha(live)}});
          const e={schemaVersion:'astra-g16-deployment-evidence-2',generatedAt:new Date().toISOString(),sourceHead:process.env.G16_SOURCE_HEAD,workflowRunId:Number(process.env.G16_WORKFLOW_RUN_ID),gateStatusBeforeCertification:'PENDING',status:'PASS',failedChecks:[],deployment:{provider:'GITHUB_PAGES',productionCommit:process.env.G16_PRODUCTION_COMMIT,pagesWorkflowRunId:Number(process.env.G16_PAGES_RUN_ID),pagesWorkflowConclusion:'success',productionUrl:process.env.G16_PRODUCTION_URL,runtimeUrl:process.env.G16_RUNTIME_URL,status:'READY',target:'production',isolatedPath:'astra-prod/',publicEntrypointChanged:false},http:{productionRoot:{ok:true},runtime:{ok:true}},runtime:{files:runtime,allHashesMatch:runtime.every(x=>x.match)},persistedTruth:{files:truth,allHashesMatch:truth.every(x=>x.match)},buildIsolation:{vendoredSepa:true,crossBranchBuildDependency:false},runtimeLegacyDependencyCount:0,runtimeExternalReferences:0,productionCutover:false};
          fs.writeFileSync('docs/astra/G16_DEPLOYMENT_EVIDENCE.json',JSON.stringify(e,null,2)+'\n');
          fs.writeFileSync('docs/astra/G16_DEPLOYMENT_REPORT.md',['# G16 Production Deployment','','- Status: **PASS**','- Provider: **GitHub Pages**','- Source HEAD: '+e.sourceHead,'- G16 workflow run: '+e.workflowRunId,'- Production commit: '+e.deployment.productionCommit,'- Pages deployment run: '+e.deployment.pagesWorkflowRunId+' — SUCCESS','- Production URL: '+e.deployment.productionUrl,'- Runtime URL: '+e.deployment.runtimeUrl,'- Isolated path: **astra-prod/**','- Existing public entrypoints changed: **false**','- Runtime files byte-exact: **PASS**','- Persisted truth byte-exact: **PASS**','- Pages build: **vendored SEPA-X / no cross-branch checkout**','- Runtime external references: **0**','- Legacy runtime dependencies: **0**','- Production cutover: **false**'].join('\n')+'\n');
          NODE

      - name: Promote G16 only after PASS
        env:
          G16_SOURCE_HEAD: ${{ github.sha }}
          G16_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node astra/certification/g16-certify.cjs --write

      - name: Validate promoted state
        run: |
          node <<'NODE'
          const g=require('./04_ACCEPTANCE_GATES.json').gates,m=new Map(g.map(x=>[x.id,x.status]));
          for(let n=1;n<=16;n++){const id='G'+String(n).padStart(2,'0');if(m.get(id)!=='GREEN')throw Error(id+' not GREEN')}
          for(const id of ['G17','G18','G19'])if(m.get(id)!=='PENDING')throw Error(id+' changed');
          const c=require('./docs/astra/G16_CERTIFICATION.json'),s=require('./docs/astra/WORK_STATE.json');
          if(c.status!=='GREEN'||c.productionCutover!==false||c.runtimeLegacyDependencyCount!==0)throw Error('G16 cert invalid');
          if(s.current_gate!=='G17'||s.last_green_gate!=='G16'||s.current_phase!=='G17_PENDING')throw Error('state invalid');
          NODE

      - name: Persist G16 certification only
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          [ "$REMOTE_HEAD" = "$GITHUB_SHA" ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/astra/G16_DEPLOYMENT_EVIDENCE.json docs/astra/G16_DEPLOYMENT_REPORT.md docs/astra/G16_CERTIFICATION.json 04_ACCEPTANCE_GATES.json 05_WORK_STATE.json docs/astra/WORK_STATE.json
          git commit -m 'cert(g16): isolated Pages production deployment GREEN [skip g16]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

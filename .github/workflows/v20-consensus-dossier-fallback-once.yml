name: V20 Consensus Dossier Fallback Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v20-consensus-dossier-fallback-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 1
      - name: Make dossier evidence append fail-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('v20/consensus-overlay.js')
          s=p.read_text()
          old="const grid=body.querySelector('.decision-dossier-grid');if(grid)grid.appendChild(s);"
          new="const grid=body.querySelector('.decision-dossier-grid');(grid||body).appendChild(s);"
          if old not in s:
              raise SystemExit('Expected dossier append anchor not found; refusing blind patch')
          p.write_text(s.replace(old,new,1))
          PY
          node --check v20/consensus-overlay.js
          git diff --check
          test "$(git diff --name-only)" = "v20/consensus-overlay.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v20/consensus-overlay.js
          git commit -m "Make consensus dossier evidence append fail-safe [skip ci]"
          git push origin HEAD:develop/v20-integrated-decision-platform

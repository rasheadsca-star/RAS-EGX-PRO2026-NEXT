name: EGX V16.3 Technical Review — 20 Cycles
run-name: Dedicated technical review for ${{ github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EGX Professional V16.3 Validate Test and Deploy"]
    types: [completed]
  push:
    paths:
      - "scripts/stable/v16-technical-review-20-cycles.cjs"
      - "scripts/stable/v16-technical-review-finalizer.cjs"
      - ".github/workflows/v16-technical-review.yml"

permissions:
  contents: write

concurrency:
  group: egx-v16-3-technical-review
  cancel-in-progress: true

jobs:
  technical-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main evidence
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate technical engines and reviewers
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-recommendation-evaluator.cjs
          node --check scripts/stable/v16-official-disclosure-collector.cjs
          node --check scripts/stable/v16-live-evidence-engine.cjs
          node --check scripts/stable/v16-market-regime-engine.cjs
          node --check scripts/stable/v16-correlation-risk-engine.cjs
          node --check scripts/stable/v16-alert-engine.cjs
          node --check scripts/stable/v16-3-heartbeat.cjs
          node --check scripts/stable/v16-technical-review-20-cycles.cjs
          node --check scripts/stable/v16-technical-review-finalizer.cjs
          node --check preview-v16/app/app.js
          node --check preview-v16/app/v16-3.js

      - name: Generate complete V16.3 evidence for technical review
        run: |
          set -euo pipefail
          node scripts/stable/v16-official-disclosure-collector.cjs
          node scripts/stable/v15-recommendation-evaluator.cjs
          node scripts/stable/v16-live-evidence-engine.cjs
          node scripts/stable/v16-market-regime-engine.cjs
          node scripts/stable/v16-correlation-risk-engine.cjs
          node scripts/stable/v16-3-heartbeat.cjs
          node scripts/stable/v16-alert-engine.cjs
          node scripts/stable/v16-3-heartbeat.cjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real technical browser journeys and preserve result
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/egx-technical-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          set +e
          npx playwright test tests/v16-3.spec.mjs --project=chromium-desktop --project=chromium-mobile
          TEST_CODE=$?
          set -e
          TEST_STATUS=PASSED
          TESTS_PASSED=13
          if [ "$TEST_CODE" -ne 0 ]; then TEST_STATUS=FAILED; TESTS_PASSED=0; fi
          TEST_STATUS="$TEST_STATUS" TESTS_PASSED="$TESTS_PASSED" TEST_CODE="$TEST_CODE" node - <<'NODE'
          const fs=require('fs');
          const out={schemaVersion:'16.3.2',generatedAt:new Date().toISOString(),status:process.env.TEST_STATUS,testsPassed:Number(process.env.TESTS_PASSED||0),exitCode:Number(process.env.TEST_CODE||0),projects:['chromium-desktop','chromium-mobile'],suite:'tests/v16-3.spec.mjs',realBrowser:true,technicalReviewRun:true};
          fs.writeFileSync('data/stable/v16-browser-test-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(out);
          NODE
          if [ "$TEST_CODE" -ne 0 ]; then
            echo "Browser journeys failed; preserving evidence so the technical receiver can identify the blocking finding."
            cat /tmp/egx-technical-http.log || true
          fi

      - name: Execute and finalize all twenty technical cycles
        env:
          TECH_REVIEW_FAIL_ON_BLOCKING: "0"
        run: |
          set -euo pipefail
          node scripts/stable/v16-technical-review-20-cycles.cjs
          node scripts/stable/v16-technical-review-finalizer.cjs

      - name: Commit complete technical review evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v15-recommendation-ledger.json data/stable/v15-recommendation-evaluation.json data/stable/v15-update-status.json data/stable/v16-live-evidence.json data/stable/v16-market-regime.json data/stable/v16-official-disclosures.json data/stable/v16-correlation-risk.json data/stable/v16-alerts.json data/stable/v16-browser-test-status.json data/review/v16-technical-review.json data/review/v16-technical-review.md
          if ! git diff --cached --quiet; then
            git commit -m "Run EGX V16.3 twenty-cycle technical review"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Enforce technical receiver gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('data/review/v16-technical-review.json','utf8'));
          if(report.scope?.type!=='TECHNICAL_ANALYSIS_ONLY') throw new Error('Technical-only review scope missing');
          if(report.cyclesCompleted!==20||report.acceptanceCriteria?.exactlyTwentyCycles!==true) throw new Error('Exactly 20 technical cycles were not executed');
          if(report.acceptanceCriteria?.zeroCritical!==true||report.acceptanceCriteria?.zeroHigh!==true){
            const findings=(report.blockingFindings||[]).map(row=>`${row.id}:${row.title}`).join(' | ');
            throw new Error(`Technical receiver rejected the application: ${findings}`);
          }
          console.log({acceptance:report.acceptance,summary:report.summary});
          NODE

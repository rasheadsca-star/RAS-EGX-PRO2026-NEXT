name: EGX V16 Two-Stage Top Two Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-two-stage-top2-backtest.py"
      - ".github/workflows/v16-two-stage-top2-backtest.yml"

permissions:
  contents: write

concurrency:
  group: egx-v16-two-stage-top2-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engine
        run: python -m py_compile scripts/research/v16-two-stage-top2-backtest.py
      - name: Run top-two backtest
        run: python scripts/research/v16-two-stage-top2-backtest.py
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-two-stage-top2-backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16.5 top-two historical backtest"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi


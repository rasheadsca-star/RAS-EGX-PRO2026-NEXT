# Triggered for 2026-08-04 audit
name: EGX V16 Top Gainers Model Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-top-gainers-model-audit.cjs"
      - ".github/workflows/v16-top-gainers-model-audit.yml"

permissions:
  contents: write

concurrency:
  group: egx-v16-top-gainers-model-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate audit script
        run: node --check scripts/research/v16-top-gainers-model-audit.cjs

      - name: Audit top gainers against prior-session models
        run: node scripts/research/v16-top-gainers-model-audit.cjs

      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-top-gainers-model-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit top gainers against prior-session models"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

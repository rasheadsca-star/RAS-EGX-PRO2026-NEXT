name: V20 Consensus Overlay Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v20-consensus-overlay-acceptance.yml"
  schedule:
    - cron: "35 7-20 * * 0-4"

permissions:
  contents: read

concurrency:
  group: v20-consensus-overlay-acceptance
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest V20 source
        uses: actions/checkout@v6
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Static syntax and core-entry invariance
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/v20/build-cross-version-consensus.cjs
          node --check scripts/v20/cross-version-consensus-regression.cjs
          node --check scripts/v20/consensus-browser-acceptance.cjs
          node --check v20/consensus-overlay.js
          node --check v20/native-research.js
          node scripts/v20/primary-entry-point-acceptance.cjs
          test -z "$(grep -nE 'decision-board\.(js|css)' v20/native-research.js || true)" || { echo "Secondary loader attempted to inject canonical Decision Board assets"; exit 1; }

      - name: Consensus regression and governance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/cross-version-consensus-regression.cjs
          node - <<'NODE'
          const c=require('./data/v20/cross-version-consensus.json');
          const d=require('./data/v20/final-decision-contract.json');
          const core=require('./data/v20/v17-production-decision-core.json');
          const n=require('./data/v20/native-current.json');
          if(c.status!=='CURRENT_SESSION_ALIGNED')throw Error('Consensus session mismatch');
          if(c.scoreDefinition.historicalPerformanceUsedInScore!==false)throw Error('Historical performance leaked into score');
          if(c.governance.displayPriorityOnly!==true||c.governance.changesFinalDecision!==false||c.governance.changesExecutionPermission!==false)throw Error('Consensus execution boundary drift');
          if(c.governance.changesMainAppMethodology!==false||c.governance.changesV19Methodology!==false||c.governance.changesV20NativeRanking!==false)throw Error('Model methodology drift');
          if(c.governance.v17RemainsProductionAuthority!==true||core.policy?.v17IsAuthoritativeForProductionEligibility!==true)throw Error('V17 authority drift');
          if(n.executionPermission!==false||n.productionAllocation!==false)throw Error('V20 Native execution governance drift');
          if(d.architecture!=='V17_CENTRIC_V20_NATIVE_DISCOVERY')throw Error('Canonical architecture drift');
          if(d.sessionStatus!=='EXECUTION_GRADE'&&(Number(d.summary?.productionActionableCount)!==0||Number(d.summary?.productionNewExposurePct)!==0))throw Error('Closed-gate production leak');
          console.log(JSON.stringify({sessionDate:c.sessionDate,sharedTickers:c.current.sharedTickers,fullAgreement:c.current.fullMainAppBasketAgreement,finalSessionStatus:d.sessionStatus,actionable:d.summary.productionActionableCount},null,2));
          NODE

      - name: Browser acceptance on direct V20 entry
        run: node scripts/v20/consensus-browser-acceptance.cjs

name: V15 Price Truth Hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v15-price-truth-hotfix.yml"

permissions:
  contents: write

concurrency:
  group: v15-price-truth-hotfix
  cancel-in-progress: true

jobs:
  fix-price-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce execution-grade current prices
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/stable/v15-practical-market-scanner.cjs')
          s=p.read_text()

          s=s.replace(
          "const OUT_MISSED = path.join(ROOT, 'data/research/v15-missed-opportunities.json');\nconst COST_PCT = 0.6;",
          "const OUT_MISSED = path.join(ROOT, 'data/research/v15-missed-opportunities.json');\nconst FETCH_STATUS_PATH = path.join(ROOT, 'data/fetch-status.json');\nconst COST_PCT = 0.6;"
          )

          old_norm="""function normalize(file){
  const doc=readJson(file,{}); const ticker=String(doc.ticker||path.basename(file,'.json')).toUpperCase();
  const rows=(Array.isArray(doc.sessions)?doc.sessions:Array.isArray(doc)?doc:[]).map(r=>({
    date:dateOnly(r.date||r.sessionDate),open:n(r.open),high:n(r.high),low:n(r.low),close:n(r.close),volume:n(r.volume,0)
  })).filter(r=>r.date&&r.open>0&&r.high>=r.open&&r.high>=r.close&&r.low<=r.open&&r.low<=r.close&&r.low>0).sort((a,b)=>a.date.localeCompare(b.date));
  return {ticker,companyNameAr:doc.companyNameAr||doc.companyNameEn||ticker,verified:doc.symbolVerified!==false,stale:doc.staleData===true,rows};
}
"""
          new_norm="""function normalize(file){
  const doc=readJson(file,{}); const ticker=String(doc.ticker||path.basename(file,'.json')).toUpperCase();
  const raw=Array.isArray(doc.sessions)?doc.sessions:Array.isArray(doc)?doc:[];
  const rows=raw.map(r=>{
    const warnings=Array.isArray(r?.warnings)?r.warnings.map(String):[];
    const validationStatus=String(r?.validationStatus||'unknown');
    const confidenceOverall=n(r?.confidence?.overall,null);
    const sourceConflict=validationStatus==='source_conflict'||warnings.some(w=>/local_price_conflict|latest_close_conflict/i.test(w));
    return {date:dateOnly(r.date||r.sessionDate),open:n(r.open),high:n(r.high),low:n(r.low),close:n(r.close),volume:n(r.volume,0),validationStatus,confidenceOverall,source:String(r.source||r.primarySource||'unknown'),warnings,priceTrusted:!sourceConflict&&(confidenceOverall===null||confidenceOverall>=60)};
  }).filter(r=>r.date&&r.open>0&&r.high>=r.open&&r.high>=r.close&&r.low<=r.open&&r.low<=r.close&&r.low>0&&r.priceTrusted).sort((a,b)=>a.date.localeCompare(b.date));
  const byDate=new Map(); for(const row of rows) byDate.set(row.date,row);
  return {ticker,companyNameAr:doc.companyNameAr||doc.companyNameEn||ticker,verified:doc.symbolVerified!==false,stale:doc.staleData===true,rows:[...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date))};
}

function expectedLatestCompletedSessionCairo(now=new Date()){
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  const d=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day)));
  const hour=Number(parts.hour)+Number(parts.minute)/60;
  const isTradingDay=()=>[0,1,2,3,4].includes(d.getUTCDay());
  if(isTradingDay()&&hour<15)d.setUTCDate(d.getUTCDate()-1);
  while(!isTradingDay())d.setUTCDate(d.getUTCDate()-1);
  return d.toISOString().slice(0,10);
}
"""
          if old_norm not in s:
              raise SystemExit('normalize block not found')
          s=s.replace(old_norm,new_norm)

          old_return="""  return {ticker:history.ticker,companyNameAr:history.companyNameAr,date:row.date,index:i,rows,open:row.open,high:row.high,low:row.low,close,volume:row.volume,s10,s20,s50,a14,r14,vr,turnover,high20,low20,rangePos,ret1,ret3,ret5,ret10,ret20,atrPct,breakoutPct:pct(close,high20),trend:close>s20&&s20>s50};
"""
          new_return="""  return {ticker:history.ticker,companyNameAr:history.companyNameAr,date:row.date,index:i,rows,open:row.open,high:row.high,low:row.low,close,volume:row.volume,priceSource:row.source,priceValidationStatus:row.validationStatus,priceConfidenceOverall:row.confidenceOverall,priceTrusted:row.priceTrusted,s10,s20,s50,a14,r14,vr,turnover,high20,low20,rangePos,ret1,ret3,ret5,ret10,ret20,atrPct,breakoutPct:pct(close,high20),trend:close>s20&&s20>s50};
"""
          if old_return not in s:
              raise SystemExit('feature return block not found')
          s=s.replace(old_return,new_return)

          old_latest="""  const latestDate=store.dates.at(-1), latestAll=store.byDate.get(latestDate)||[], opportunities=[];
"""
          new_latest="""  const latestDate=store.dates.at(-1), expectedLatestSession=expectedLatestCompletedSessionCairo(), fetchStatus=readJson(FETCH_STATUS_PATH,{}), latestAll=store.byDate.get(latestDate)||[], opportunities=[];
  const fetchExecutionGrade=fetchStatus?.ok===true&&fetchStatus?.realFetch===true&&fetchStatus?.executionGrade===true;
  const sessionCurrent=latestDate===expectedLatestSession;
  const latestTrustedRows=latestAll.filter(f=>f.priceTrusted!==false);
  const priceTruthReady=fetchExecutionGrade&&sessionCurrent&&latestTrustedRows.length>=80;
"""
          if old_latest not in s:
              raise SystemExit('latest block not found')
          s=s.replace(old_latest,new_latest)

          old_recs="""  const recommendations=unique.filter(x=>!x.extended).slice(0,5).map((x,i)=>({...x,rank:i+1,status:'PRACTICAL_CANDIDATE_PENDING_PRICE_CONFIRMATION',statusAr:'فرصة عملية مشروطة بتأكيد سعر الافتتاح وعدم حدوث فجوة'}));
"""
          new_recs="""  const recommendations=priceTruthReady?unique.filter(x=>!x.extended).slice(0,5).map((x,i)=>({...x,rank:i+1,priceDate:latestDate,priceExecutionGrade:true,status:'PRACTICAL_CANDIDATE_PENDING_PRICE_CONFIRMATION',statusAr:'فرصة عملية مشروطة بتأكيد سعر الافتتاح وعدم حدوث فجوة'})):[];
"""
          if old_recs not in s:
              raise SystemExit('recommendations block not found')
          s=s.replace(old_recs,new_recs)

          old_decision="""  const practicalReady=Boolean(validatedModels.length&&recommendations.length);
  const decision={schemaVersion:'15.0.0',generatedAt:new Date().toISOString(),sessionDate:latestDate,mode:'FULL_MARKET_CROSS_SECTIONAL_WALK_FORWARD',practicalReady,status:practicalReady?'PRACTICAL_CANDIDATES_AVAILABLE':'NO_VALIDATED_STRATEGY',statusAr:practicalReady?`توجد ${recommendations.length} فرص عملية مشروطة من مسح السوق بالكامل`:'لا توجد استراتيجية اجتازت التحقق والاختبار النهائي؛ لا يتم اختلاق توصيات',selectedModel:selected,validatedModels:validatedModels.map(x=>x.id),recommendations,extendedMomentumWatch,marketScan:{histories:histories.length,symbolsLatest:(store.byDate.get(latestDate)||[]).length,latestDate},guardrails:{fullMarketScan:true,developmentValidationTestSplit:true,futureLeakageForbidden:true,transactionCostsPct:COST_PCT,targetProbabilityMustExceedStopProbability:true,manualOpeningPriceConfirmation:true,automaticOrders:false},missedOpportunityCapture:missed.tradableCaptureRatePct};
"""
          new_decision="""  const practicalReady=Boolean(priceTruthReady&&validatedModels.length&&recommendations.length);
  const status=!priceTruthReady?'PRICE_DATA_NOT_EXECUTION_GRADE':practicalReady?'PRACTICAL_CANDIDATES_AVAILABLE':'NO_VALIDATED_STRATEGY';
  const statusAr=!priceTruthReady?`تم إيقاف التوصيات: أسعار التقرير من ${latestDate||'جلسة غير معروفة'} بينما آخر جلسة مكتملة متوقعة ${expectedLatestSession}. مصدر الجلب الحالي ليس بدرجة تنفيذ حقيقية.`:practicalReady?`توجد ${recommendations.length} فرص عملية مشروطة من مسح السوق بالكامل`:'لا توجد استراتيجية اجتازت التحقق والاختبار النهائي؛ لا يتم اختلاق توصيات';
  const decision={schemaVersion:'15.0.1',generatedAt:new Date().toISOString(),sessionDate:latestDate,expectedLatestSession,mode:'FULL_MARKET_CROSS_SECTIONAL_WALK_FORWARD',practicalReady,status,statusAr,priceTruth:{ready:priceTruthReady,fetchOk:fetchStatus?.ok===true,realFetch:fetchStatus?.realFetch===true,executionGrade:fetchStatus?.executionGrade===true,fetchMode:fetchStatus?.mode||null,fetchGeneratedAt:fetchStatus?.generatedAt||null,sessionCurrent,latestTrustedRows:latestTrustedRows.length},selectedModel:selected,validatedModels:validatedModels.map(x=>x.id),recommendations,extendedMomentumWatch:priceTruthReady?extendedMomentumWatch:[],marketScan:{histories:histories.length,symbolsLatest:(store.byDate.get(latestDate)||[]).length,latestTrustedRows:latestTrustedRows.length,latestDate,expectedLatestSession},guardrails:{fullMarketScan:true,developmentValidationTestSplit:true,futureLeakageForbidden:true,transactionCostsPct:COST_PCT,targetProbabilityMustExceedStopProbability:true,manualOpeningPriceConfirmation:true,automaticOrders:false,realFetchRequired:true,executionGradeRequired:true,currentSessionRequired:true,sourceConflictsRejected:true},missedOpportunityCapture:missed.tradableCaptureRatePct};
"""
          if old_decision not in s:
              raise SystemExit('decision block not found')
          s=s.replace(old_decision,new_decision)
          p.write_text(s)
          PY

      - name: Run scanner and safety acceptance
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-practical-market-scanner.cjs
          node scripts/stable/v15-practical-market-scanner.cjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json','utf8'));
          const f=JSON.parse(fs.readFileSync('data/fetch-status.json','utf8'));
          if(!d.priceTruth) throw new Error('price truth diagnostics missing');
          if((f.realFetch!==true||f.executionGrade!==true)&&d.recommendations.length) throw new Error('recommendations leaked from non-execution-grade data');
          if(d.sessionDate!==d.expectedLatestSession&&d.recommendations.length) throw new Error('stale session recommendations leaked');
          if(d.practicalReady&&(!d.priceTruth.ready||!d.recommendations.length)) throw new Error('practicalReady conflict');
          if(d.recommendations.some(r=>r.priceDate!==d.expectedLatestSession||r.priceExecutionGrade!==true)) throw new Error('unverified recommendation price');
          console.log(JSON.stringify({status:d.status,statusAr:d.statusAr,priceTruth:d.priceTruth,recommendations:d.recommendations},null,2));
          NODE

      - name: Commit price truth safeguards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stable/v15-practical-market-scanner.cjs data/stable/v15-practical-decision.json data/research/v15-practical-validation.json data/research/v15-missed-opportunities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Block V15 recommendations on stale or conflicted prices"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*12))
          done
          exit 1

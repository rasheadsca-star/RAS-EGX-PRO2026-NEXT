name: EGX Independent Paper Decision (Astra-Free)
# Deprecated automated pipeline: manual launch only, data/code retained.\non:\n  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: egx-independent-paper
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate independent paper engine
        run: |
          node --check scripts/independent/official-egx-report-gate.cjs
          node --check scripts/research/build-trend-divergence.cjs
          node --test tests/trend-divergence.test.cjs
          node --check scripts/independent/history-quality-audit.cjs
          node --check scripts/independent/egx-independent-paper.cjs
          node --check scripts/independent/walkforward-backtest.cjs
          node --check scripts/independent/stale-bar-detector.cjs
          node --check scripts/independent/corporate-action-gate.cjs
          node --check scripts/independent/preserve-verified-paper.cjs
          node --test tests/independent/*.test.cjs
      - name: Require reconciled official EGX session PDF before any publication
        id: official
        run: node scripts/independent/official-egx-report-gate.cjs
      - name: Build explicitly paper-only independent status
        if: steps.official.outputs.verified == 'true'
        run: |
          node scripts/independent/history-quality-audit.cjs
          node scripts/independent/egx-independent-paper.cjs
          node scripts/independent/preserve-verified-paper.cjs
      - name: Archive evidence only for verified official report sessions
        if: steps.official.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: egx-independent-paper-${{ github.run_id }}
          path: |
            unified-console/history-quality-audit.json
            unified-console/independent-paper.json
            unified-console/independent-last-verified.json
            unified-console/independent-paper-ledger.json
      - name: Publish paper-only status when source files are current
        if: github.event_name != 'pull_request' && steps.official.outputs.verified == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unified-console/history-quality-audit.json unified-console/independent-paper.json unified-console/independent-last-verified.json unified-console/independent-paper-ledger.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update independently gated paper decision status"
          git pull --rebase origin main
          # Rebuild against freshest main after rebase, to avoid publishing stale snapshots.
          node scripts/independent/history-quality-audit.cjs
          node scripts/independent/egx-independent-paper.cjs
          node scripts/independent/preserve-verified-paper.cjs
          git add unified-console/history-quality-audit.json unified-console/independent-paper.json unified-console/independent-last-verified.json unified-console/independent-paper-ledger.json
          git commit --amend --no-edit
          git push origin HEAD:main

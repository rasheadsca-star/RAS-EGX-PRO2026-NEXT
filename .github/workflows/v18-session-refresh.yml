name: V18 Session Refresh From Main

on:
  workflow_dispatch:
  schedule:
    # Independent schedules are required because commits created by another
    # GitHub Actions workflow via GITHUB_TOKEN do not trigger downstream push workflows.
    # 13:45 UTC = 16:45 Cairo during DST: primary post-close V18 refresh.
    - cron: '45 13 * * 0-4'
    # 15:30 UTC = 18:30 Cairo during DST: fallback retry for late upstream/provider updates.
    - cron: '30 15 * * 0-4'
  push:
    branches:
      - main
    paths:
      - data/history/**
      - data/history-summary.json
      - data/history-eligibility.json
      - data/symbol-map.json
      - data/session-calendar.json
      - data/fetch-status.json
      - data/source-gateway-report.json
      - data/market-quality-report.json
      - data/stable/v15-practical-decision.json
      - data/stable/v16-market-regime.json
      - data/stable/v15-price-truth.json
      - .github/workflows/v18-session-refresh.yml

permissions:
  contents: write

concurrency:
  group: v18-session-refresh
  cancel-in-progress: true

jobs:
  refresh-v18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V18 research branch
        uses: actions/checkout@v4
        with:
          ref: v18-global-strategy-ensemble-20260906
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync latest canonical session from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- \
            data/history \
            data/history-summary.json \
            data/history-eligibility.json \
            data/symbol-map.json \
            data/session-calendar.json \
            data/fetch-status.json \
            data/source-gateway-report.json \
            data/market-quality-report.json \
            data/stable/v15-practical-decision.json \
            data/stable/v16-market-regime.json \
            data/stable/v15-price-truth.json

      - name: Rebuild current-session quantitative layers
        run: |
          node --check scripts/quant/v13-4-quant-engine.cjs
          node --check scripts/quant/v13-5-adaptive-paper-tracker.cjs
          node --check scripts/quant/v13-7-stock-intelligence.cjs
          node --check preview-v18/common-chart.js
          node --check scripts/stable/build-v18-web-preview.cjs
          node scripts/quant/v13-4-quant-engine.cjs
          node scripts/quant/v13-5-adaptive-paper-tracker.cjs
          node scripts/quant/v13-7-stock-intelligence.cjs

      - name: Build V18 unified decision center
        run: |
          node scripts/stable/build-v18-decision-board.cjs
          node scripts/stable/build-v18-web-preview.cjs

      - name: Freshness and integrity gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const calendar = JSON.parse(fs.readFileSync('data/session-calendar.json','utf8'));
          const out = JSON.parse(fs.readFileSync('preview-v18/data.json','utf8'));
          const ledger = JSON.parse(fs.readFileSync('preview-v18/forward-ledger.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('preview-v18-web/manifest.json','utf8'));
          const expected = calendar.latestMarketSession;
          const fail = m => { throw new Error(m); };
          if (!expected) fail('session-calendar missing latestMarketSession');
          if (out.sessionId !== expected) fail(`STALE V18: output ${out.sessionId} != latest market session ${expected}`);
          if (manifest.sessionId !== expected) fail(`STALE WEB: manifest ${manifest.sessionId} != latest market session ${expected}`);
          if (out.dataHealth?.status !== 'PASS') fail(`V18 data health ${out.dataHealth?.status}`);
          if ((out.dataHealth?.criticalFailureCount || 0) !== 0) fail('Critical V18 integrity failures present');
          if (!Array.isArray(out.allCandidates) || !out.allCandidates.length) fail('No V18 candidates generated');
          const currentStocks = out.universeScreener.filter(x => x.sessionId === expected).length;
          if (currentStocks < 150) fail(`Current-session stock coverage too low: ${currentStocks}`);
          const currentIssued = ledger.entries.filter(x => x.issued?.sessionId === expected).length;
          if (currentIssued < (out.actionable?.length || 0)) fail(`Forward ledger missing current-session signals: ${currentIssued}`);
          if (out.enginePerformanceLeague?.trackingStartsOn !== '2026-09-07') fail('Engine league tracking start changed');
          const position = out.recommendationPositionPerformance;
          if (position?.trackingStartsOn !== '2026-09-07') fail('Recommendation-number tracking start changed');
          if (position?.comparisonRange?.from !== 1 || position?.comparisonRange?.to !== 20) fail('Recommendation comparison range must be 1-20');
          if (!Array.isArray(position?.top20) || position.top20.length !== 20) fail('Recommendation Top 20 missing');
          for (let i=0;i<20;i++) if (position.top20[i]?.recommendationNumber !== i+1) fail(`Recommendation rank #${i+1} missing`);
          if (manifest.dashboardRecommendations !== Math.min(20,out.allCandidates.length)) fail('Dashboard Top 20 manifest mismatch');
          if (manifest.globalCommonChart !== true) fail('Global common chart missing');
          if (manifest.multiTargetExecution !== true) fail('Multi-target execution missing');
          const levels = new Set(manifest.executionLevels || []);
          for (const key of ['ENTRY_ZONE','TARGET1','TARGET2','TARGET3','STOP_LOSS']) if (!levels.has(key)) fail(`Execution level missing: ${key}`);
          const overlays = new Set(manifest.chartOverlays || []);
          for (const key of ['MA20','MA50','TREND_CHANNEL','FIBONACCI']) if (!overlays.has(key)) fail(`Chart overlay missing: ${key}`);
          console.log(JSON.stringify({
            expectedSession: expected,
            outputSession: out.sessionId,
            manifestSession: manifest.sessionId,
            canonicalUniverse: out.universeScreener.length,
            currentSessionStocks: currentStocks,
            candidates: out.allCandidates.length,
            actionable: out.actionable?.length || 0,
            currentForwardIssued: currentIssued,
            dashboardRecommendations: manifest.dashboardRecommendations,
            globalCommonChart: manifest.globalCommonChart,
            multiTargetExecution: manifest.multiTargetExecution,
            executionLevels: manifest.executionLevels,
            chartOverlays: manifest.chartOverlays,
            recommendationComparison: position.comparisonRange,
            recommendationTop20: position.top20.map(x=>({rank:x.recommendationNumber,issued:x.issuedSignals,target1:x.target1Hits,stop:x.stopHits,targetRate:x.targetHitRateResolvedPct})),
            dataHealth: out.dataHealth.status
          }, null, 2));
          NODE
          test -s preview-v18-web/index.html
          grep -q 'ENGINE PERFORMANCE LEAGUE' preview-v18-web/index.html
          grep -q 'RECOMMENDATION NUMBER PERFORMANCE' preview-v18-web/index.html
          grep -q 'V18_COMMON_CHART_PLUGIN' preview-v18-web/index.html
          grep -q 'V18_MULTI_TARGET_UI_PLUGIN' preview-v18-web/index.html
          grep -q 'TOP 20 NOW' preview-v18-web/index.html
          grep -q 'Trend Channel' preview-v18-web/index.html
          grep -q 'Fibonacci' preview-v18-web/index.html
          grep -q 'Target 3' preview-v18-web/index.html
          grep -q 'Stop Loss' preview-v18-web/index.html

      - name: Persist refreshed canonical snapshot, ledger and web preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f \
            data/session-calendar.json \
            data/quant \
            data/stable/v15-practical-decision.json \
            data/stable/v16-market-regime.json \
            data/stable/v15-price-truth.json \
            data/stable/v18-forward-ledger.json \
            preview-v18/data.json \
            preview-v18/forward-ledger.json \
            preview-v18-web/index.html \
            preview-v18-web/manifest.json
          git ls-files --error-unmatch preview-v18/data.json preview-v18/forward-ledger.json >/dev/null
          if git diff --cached --quiet; then
            echo 'Validated V18 outputs unchanged.'
          else
            git commit -m 'chore(v18): persist latest verified canonical snapshot [skip ci]'
            git push origin HEAD:v18-global-strategy-ensemble-20260906
          fi

      - name: Verify persisted branch snapshot is current
        run: |
          expected="$(node -p "require('./data/session-calendar.json').latestMarketSession")"
          git fetch origin v18-global-strategy-ensemble-20260906 --depth=1
          git show origin/v18-global-strategy-ensemble-20260906:preview-v18/data.json > /tmp/v18-remote-data.json
          git show origin/v18-global-strategy-ensemble-20260906:preview-v18/forward-ledger.json > /tmp/v18-remote-ledger.json
          actual="$(node -p "require('/tmp/v18-remote-data.json').sessionId")"
          test "$actual" = "$expected" || { echo "REMOTE V18 STALE: $actual != $expected"; exit 1; }
          node -e "const d=require('/tmp/v18-remote-data.json'); const l=require('/tmp/v18-remote-ledger.json'); const e=process.argv[1]; if(!Array.isArray(d.allCandidates)||!d.allCandidates.length) throw new Error('Remote V18 has no candidates'); if(!Array.isArray(l.entries)) throw new Error('Remote V18 ledger missing entries'); console.log(JSON.stringify({expected:e,remoteSession:d.sessionId,candidates:d.allCandidates.length,ledgerEntries:l.entries.length},null,2));" "$expected"

      - name: Verify V18.2 production serves the current session
        env:
          V18_PUBLIC_URL: https://egx-pro-v18-2-unified-preview.vercel.app
        run: |
          expected="$(node -p "require('./data/session-calendar.json').latestMarketSession")"
          ok=0
          for attempt in 1 2 3 4; do
            stamp="$(date +%s)"
            if curl -fsSL --retry 2 --retry-delay 2 -H 'Cache-Control: no-cache' "$V18_PUBLIC_URL/data.json?t=$stamp" -o /tmp/v18-production-data.json; then
              actual="$(node -e "try{const d=require('/tmp/v18-production-data.json'); process.stdout.write(String(d.sessionId||''));}catch(e){process.exit(2)}" || true)"
              if [ "$actual" = "$expected" ]; then
                echo "V18.2 production freshness PASS: $actual"
                ok=1
                break
              fi
              echo "Attempt $attempt: production session '$actual', expected '$expected'."
            else
              echo "Attempt $attempt: production data endpoint fetch failed."
            fi
            sleep 10
          done
          test "$ok" = "1" || { echo "V18.2 PRODUCTION STALE after refresh"; exit 1; }

# trigger: 2026-09-10 persist live V18 snapshot + verify production freshness

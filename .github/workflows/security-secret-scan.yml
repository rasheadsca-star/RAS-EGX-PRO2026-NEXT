name: Security — Repository Secret Scan

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify no tracked environment or secret material
        run: |
          set -euo pipefail
          node --check scripts/security/repository-secret-scan.cjs
          node scripts/security/repository-secret-scan.cjs

      - name: Verify Pages-sensitive files are absent
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .project-config.json
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env is forbidden"
            exit 1
          fi
          echo "PAGES_SECRET_GUARD_PASS"

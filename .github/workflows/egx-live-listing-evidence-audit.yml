name: EGX Live Listing Evidence Audit

on:
  push:
    branches: [egx-one/clean-room-v0]
    paths:
      - data/research/egx-listing-evidence-2026-09-01.json
      - src/egx-listed-security-classification.js
      - scripts/egx-live-listing-evidence-audit.mjs
      - .github/workflows/egx-live-listing-evidence-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run exact-set live listing audit
        run: node scripts/egx-live-listing-evidence-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egx-live-listing-evidence-audit
          path: artifacts/egx-live-listing-evidence-audit.json
          if-no-files-found: warn

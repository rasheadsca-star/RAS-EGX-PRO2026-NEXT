name: Gann Missing Liquidity Regression

on:
  push:
    branches: [fix/gann-missing-liquidity-not-zero]
    paths:
      - 'gann-fusion-x/engine/data-quality.js'
      - 'gann-fusion-x/scripts/forward-shadow-v2.cjs'
      - 'gann-fusion-x/scripts/build-snapshot.cjs'
      - 'gann-fusion-x/scripts/test-missing-liquidity-regression.cjs'
      - 'gann-fusion-x/app/market-index-sanitizer.js'
      - 'gann-fusion-x/app/index-v1.html'
      - '.github/workflows/gann-missing-liquidity-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check gann-fusion-x/engine/data-quality.js
          node --check gann-fusion-x/scripts/forward-shadow-v2.cjs
          node --check gann-fusion-x/scripts/build-snapshot.cjs
          node --check gann-fusion-x/scripts/test-missing-liquidity-regression.cjs
          node --check gann-fusion-x/app/market-index-sanitizer.js
      - name: Missing liquidity regression
        run: node gann-fusion-x/scripts/test-missing-liquidity-regression.cjs
      - name: Forward shadow dry run
        run: node gann-fusion-x/scripts/forward-shadow-v2.cjs
      - name: Snapshot build dry run
        run: node gann-fusion-x/scripts/build-snapshot.cjs
      - name: Show corrected opportunity counts
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('gann-fusion-x/data/forward-shadow-report.json','utf8'));
          const c=JSON.parse(fs.readFileSync('gann-fusion-x/data/current.json','utf8'));
          console.log(JSON.stringify({forwardGann:f.sourceStatus?.GANN_FUSION_X_V1||null,daily:(c.dailyTop||[]).map(x=>({ticker:x.ticker,score:x.score,classification:x.classification?.code,liquidity:x.marketMeta?.liquidityPercentile??null})),weekly:(c.weeklyTop||[]).map(x=>x.ticker)},null,2));
          NODE

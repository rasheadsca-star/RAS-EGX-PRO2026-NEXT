name: MAIN APP — Intraday LS1 + Active Position Management
run-name: Intraday management scan for ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/stable/v16-ls1-late-session-opportunity.cjs"
      - "scripts/stable/v16-active-position-manager.cjs"
      - "data/stable/v16-ls1-policy.json"
      - "data/stable/v16-active-position-manager-policy.json"
      - "preview-v16/app/v16-9-active-position-manager.js"
      - "preview-v16/app/v16-9-position-advisory-core.js"
      - "preview-v16/app/decision-source.js"
      - "main-app-ls1.html"
      - ".github/workflows/main-app-intraday-ls1.yml"
  schedule:
    # Five-minute market-management cadence. Broad UTC window covers Cairo
    # UTC+2 / UTC+3; the engines remain fail-closed outside valid session evidence.
    - cron: "*/5 7-12 * * 0-4"
    # Dedicated late-session final-check coverage for both Cairo UTC offsets.
    - cron: "25 10-12 * * 0-4"

env:
  EGXAPI_KEY: ${{ secrets.EGXAPI_KEY }}
  EGX_KEY: ${{ secrets.EGX_KEY }}
  EGX_MARKET_JSON_URL: ${{ secrets.EGX_MARKET_JSON_URL }}
  PUBLIC_MARKET_JSON_URL: ${{ secrets.PUBLIC_MARKET_JSON_URL }}
  EGX_MARKET_HOLIDAYS: ${{ vars.EGX_MARKET_HOLIDAYS }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-app-intraday-ls1-position-manager
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      publish: ${{ steps.ls1.outputs.publish }}
      status: ${{ steps.ls1.outputs.status }}
      active_signals: ${{ steps.ls1.outputs.active_signals }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate intraday and position-management engines
        run: |
          set -euo pipefail
          node --check scripts/fetch-market-data.js
          node --check scripts/stable/v15-missing-symbol-fallback.cjs
          node --check scripts/intraday/v13-12-intraday-monitor.cjs
          node --check scripts/stable/v16-source-session-quorum.cjs
          node --check scripts/stable/v16-ls1-late-session-opportunity.cjs
          node --check scripts/stable/v16-active-position-manager.cjs
          node -e "JSON.parse(require('fs').readFileSync('data/stable/v16-ls1-policy.json','utf8')); console.log('LS1 policy JSON OK')"
          node -e "JSON.parse(require('fs').readFileSync('data/stable/v16-active-position-manager-policy.json','utf8')); console.log('Position manager policy JSON OK')"

      - name: Refresh intraday market snapshot
        shell: bash
        run: |
          set -u
          node scripts/fetch-market-data.js
          FETCH_CODE=$?
          node scripts/stable/v15-missing-symbol-fallback.cjs
          FALLBACK_CODE=$?
          echo "fetch_code=$FETCH_CODE fallback_code=$FALLBACK_CODE"
          # Source failure never fails open. Downstream layers inspect same-session
          # evidence and downgrade/withhold actions when current truth is absent.
          exit 0

      - name: Restore explicit same-session evidence after intraday refresh
        shell: bash
        run: |
          set +e
          node scripts/stable/v16-source-session-quorum.cjs
          SESSION_CODE=$?
          set -e
          if [ "$SESSION_CODE" -ne 0 ] && [ "$SESSION_CODE" -ne 2 ]; then exit "$SESSION_CODE"; fi
          test -s data/stable/v16-source-session-quorum-report.json
          echo "source_session_quorum_exit=$SESSION_CODE"

      - name: Rebuild intraday monitor
        run: node scripts/intraday/v13-12-intraday-monitor.cjs

      - name: Evaluate LS1 late-session opportunity gate
        id: ls1
        run: node scripts/stable/v16-ls1-late-session-opportunity.cjs

      - name: Build active recommendation position manager
        run: node scripts/stable/v16-active-position-manager.cjs

      - name: Verify frozen V16.9 engine was not modified
        run: |
          set -euo pipefail
          git diff --exit-code HEAD -- \
            scripts/research/v16-v169-basket-engine.py \
            scripts/research/v16-two-stage-predictor.py \
            scripts/research/v16-probabilistic-model-impact.py \
            scripts/research/v16-v169-target-hit-audit.py \
            scripts/stable/v16-publish-v169-basket.cjs \
            scripts/stable/v16-session-data-fingerprint.cjs \
            scripts/stable/v16-v169-live-evaluation.py \
            data/stable/v16-v169-release-lock.json

      - name: Commit material intraday management evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/market.json \
            data/fetch-status.json \
            data/source-health.json \
            data/source-fetch-report.json \
            data/source-gateway-report.json \
            data/session-calendar.json \
            data/intraday \
            data/stable/v16-source-session-quorum-report.json \
            data/stable/v16-ls1-late-session-opportunities.json \
            data/stable/v16-ls1-history.json \
            data/stable/v16-active-position-manager.json || true

          if ! git diff --cached --quiet; then
            git commit -m "Run MAIN APP intraday position management scan"
            # Discard unrelated generated scratch changes before rebase.
            git reset --hard HEAD
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then
                break
              fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          else
            git reset --hard HEAD
          fi

  deploy:
    needs: scan
    # Scheduled data updates are read live by the action-badge runtime from the
    # canonical raw artifact; Pages only needs redeploy for an LS1 signal or code/manual push.
    if: needs.scan.outputs.publish == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest published main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages artifact
        run: touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete MAIN APP with management module
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy MAIN APP intraday management state
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show intraday management result
        run: |
          echo "LS1 status: ${{ needs.scan.outputs.status }}"
          echo "Active LS1 signals: ${{ needs.scan.outputs.active_signals }}"
          echo "Active position manager: data/stable/v16-active-position-manager.json"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"

name: Cascade MAIN APP Session to V17 V19 V20

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force refresh even when this session is already marked complete"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["EGX V16.9 Basket Engine"]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: egx-downstream-version-cascade
  cancel-in-progress: false

jobs:
  cascade:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest MAIN APP main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve session and idempotence gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SESSION="$(node -e "const x=require('./data/stable/v15-price-truth.json');process.stdout.write(String(x.expectedSession||''))")"
          test -n "$SESSION" || { echo "MAIN APP expectedSession is empty"; exit 1; }
          MARKED="$(node -e "const fs=require('fs');try{const x=JSON.parse(fs.readFileSync('data/stable/version-cascade-status.json','utf8'));process.stdout.write(String(x.sessionDate||''))}catch{process.stdout.write('')}" )"
          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}"
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"
          echo "marked=$MARKED" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && [ "$SESSION" = "$MARKED" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Session $SESSION already has a completed downstream cascade."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Starting downstream cascade for MAIN APP session $SESSION."
          fi

      - name: Dispatch and wait for canonical V17 refresh
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          workflow="update-market-data.yml"
          branch="develop/v17-rebuild"
          before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 30 --json databaseId --jq '[.[].databaseId] | max // 0')"
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$branch"
          run_id=""
          for _ in $(seq 1 45); do
            candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 30 --json databaseId --jq '[.[].databaseId] | max // 0')"
            if [ "$candidate" -gt "$before" ]; then run_id="$candidate"; break; fi
            sleep 2
          done
          test -n "$run_id" || { echo "Could not identify dispatched V17 run"; exit 1; }
          echo "$run_id" > /tmp/v17-run-id
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10

      - name: Verify V17 reached MAIN APP session
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXPECTED_SESSION: ${{ steps.gate.outputs.session }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          git show refs/remotes/origin/develop/v17-rebuild:data/v17/current.json > /tmp/v17-current.json
          node - <<'NODE'
          const fs=require('fs');
          const expected=process.env.EXPECTED_SESSION;
          const x=JSON.parse(fs.readFileSync('/tmp/v17-current.json','utf8'));
          if(x.sessionDate!==expected) throw new Error(`V17 session ${x.sessionDate} != MAIN APP ${expected}`);
          if(x.engine?.id!=='V16_9_EQUAL_WEIGHT_BASKET'||x.engine?.selectionMethodFrozen!==true) throw new Error('V17 MAIN APP champion contract drift');
          console.log(JSON.stringify({sessionDate:x.sessionDate,status:x.status,engine:x.engine.id},null,2));
          NODE

      - name: Dispatch V19 and V20 refreshes in parallel
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1" branch="$2" outfile="$3"
            local before candidate run_id
            before="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 30 --json databaseId --jq '[.[].databaseId] | max // 0')"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$branch"
            run_id=""
            for _ in $(seq 1 45); do
              candidate="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$branch" --event workflow_dispatch --limit 30 --json databaseId --jq '[.[].databaseId] | max // 0')"
              if [ "$candidate" -gt "$before" ]; then run_id="$candidate"; break; fi
              sleep 2
            done
            test -n "$run_id" || { echo "Could not identify $workflow run"; exit 1; }
            echo "$run_id" > "$outfile"
          }
          dispatch "v19-egx-chat-gpt.yml" "v19-egx-chat-gpt" /tmp/v19-run-id
          dispatch "v20-v17-centric-clean-v5.yml" "develop/v20-integrated-decision-platform" /tmp/v20-run-id
          echo "V19 run $(cat /tmp/v19-run-id); V20 run $(cat /tmp/v20-run-id)"

      - name: Wait for V19 and V20 certification
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$(cat /tmp/v19-run-id)" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10 & p19=$!
          gh run watch "$(cat /tmp/v20-run-id)" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10 & p20=$!
          rc=0
          wait "$p19" || rc=1
          wait "$p20" || rc=1
          exit "$rc"

      - name: Verify downstream session contracts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EXPECTED_SESSION: ${{ steps.gate.outputs.session }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt develop/v20-integrated-decision-platform:refs/remotes/origin/develop/v20-integrated-decision-platform
          git show refs/remotes/origin/v19-egx-chat-gpt:data/v19/challenger-status-v6.json > /tmp/v19-gate.json
          git show refs/remotes/origin/develop/v20-integrated-decision-platform:data/v20/v17-centric-final-certification.json > /tmp/v20-cert.json
          git show refs/remotes/origin/develop/v20-integrated-decision-platform:data/v20/final-decision-contract.json > /tmp/v20-contract.json
          node - <<'NODE'
          const fs=require('fs');
          const expected=process.env.EXPECTED_SESSION;
          const v19=JSON.parse(fs.readFileSync('/tmp/v19-gate.json','utf8'));
          const cert=JSON.parse(fs.readFileSync('/tmp/v20-cert.json','utf8'));
          const contract=JSON.parse(fs.readFileSync('/tmp/v20-contract.json','utf8'));
          if(v19.promotionAllowed!==false||v19.automaticPromotion!==false) throw new Error('V19 governance drift');
          if(cert.ok!==true||cert.critical!==0||cert.major!==0) throw new Error('V20 certification failed');
          if(cert.source?.sessionDate!==expected||contract.sessionDate!==expected) throw new Error(`V20 session is not ${expected}`);
          if(contract.architecture!=='V17_CENTRIC_V20_NATIVE_DISCOVERY') throw new Error('V20 architecture drift');
          if(contract.sessionStatus!=='EXECUTION_GRADE'&&(Number(contract.summary?.productionActionableCount)!==0||Number(contract.summary?.productionNewExposurePct)!==0)) throw new Error('V20 production leak while session is closed');
          console.log(JSON.stringify({v19Status:v19.status,v20Session:contract.sessionDate,v20Status:contract.sessionStatus,v20Certified:cert.ok},null,2));
          NODE

      - name: Record completed session cascade
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SESSION="${{ steps.gate.outputs.session }}"
          V17_RUN="$(cat /tmp/v17-run-id)"
          V19_RUN="$(cat /tmp/v19-run-id)"
          V20_RUN="$(cat /tmp/v20-run-id)"
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild \
            v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt \
            develop/v20-integrated-decision-platform:refs/remotes/origin/develop/v20-integrated-decision-platform
          MAIN_DATA_SHA="$(git rev-parse refs/remotes/origin/main)"
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V19_SHA="$(git rev-parse refs/remotes/origin/v19-egx-chat-gpt)"
          V20_SHA="$(git rev-parse refs/remotes/origin/develop/v20-integrated-decision-platform)"
          V19_STATUS="$(git show refs/remotes/origin/v19-egx-chat-gpt:data/v19/challenger-status-v6.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).status||''))")"
          V20_STATUS="$(git show refs/remotes/origin/develop/v20-integrated-decision-platform:data/v20/final-decision-contract.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).sessionStatus||''))")"
          export SESSION V17_RUN V19_RUN V20_RUN MAIN_DATA_SHA V17_SHA V19_SHA V20_SHA V19_STATUS V20_STATUS
          node - <<'NODE'
          const fs=require('fs');
          const out={
            schemaVersion:'VERSION-CASCADE-1',status:'COMPLETE',sessionDate:process.env.SESSION,recordedAt:new Date().toISOString(),
            mainApp:{appName:'MAIN APP',engine:'V16_9_EQUAL_WEIGHT_BASKET',version:'16.9.2',methodologyFrozen:true,sourceDataCommit:process.env.MAIN_DATA_SHA,expectedSession:process.env.SESSION},
            v17:{branch:'develop/v17-rebuild',sessionDate:process.env.SESSION,status:'VERIFIED_CURRENT_SESSION',runId:Number(process.env.V17_RUN),conclusion:'success',commit:process.env.V17_SHA},
            v19:{branch:'v19-egx-chat-gpt',status:process.env.V19_STATUS,runId:Number(process.env.V19_RUN),conclusion:'success',commit:process.env.V19_SHA,automaticPromotion:false},
            v20:{branch:'develop/v20-integrated-decision-platform',sessionDate:process.env.SESSION,status:process.env.V20_STATUS,runId:Number(process.env.V20_RUN),conclusion:'success',commit:process.env.V20_SHA,certificationOk:true},
            policy:{oneCascadePerMarketSession:true,mainAppMethodologyMayBeModified:false,downstreamMayOverrideMainApp:false,v17MustCompleteBeforeResearchRefresh:true,v19AndV20MayRefreshInParallelAfterV17:true}
          };
          fs.writeFileSync('data/stable/version-cascade-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/version-cascade-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record downstream version cascade for ${SESSION} [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main:refs/remotes/origin/main
            if git rebase refs/remotes/origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            [ "$attempt" = "3" ] && exit 1
          done

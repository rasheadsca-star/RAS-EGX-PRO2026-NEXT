name: V20 Native Live Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - develop/v20-integrated-decision-platform
    paths:
      - ".v20-live-refresh"

permissions:
  contents: write

concurrency:
  group: v20-native-live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V20
        uses: actions/checkout@v4
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest verified V17 market truth at runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop/v17-rebuild --depth=1
          git checkout origin/develop/v17-rebuild -- data/market.json data/history.json data/final-opportunity-ranking.json data/v17
          node -e "const x=require('./data/v17/current.json'); const s=x.sessionDate||x.marketSession||x.sourceMarketSession; if(!s)process.exit(1); console.log('source session',s)"

      - name: Build V20 data truth
        run: node scripts/v20/build-data-truth.cjs

      - name: Run V20 data-quality gate
        run: node scripts/v20/data-quality-regression.cjs

      - name: Build sector provenance evidence
        run: node scripts/v20/build-sector-provenance-audit.cjs

      - name: Build current market regime
        env:
          V20_REGIME_NETWORK_REFRESH: "true"
          V20_REGIME_CONCURRENCY: "6"
          V20_REGIME_MIN_PARTICIPATION_PCT: "60"
          V20_REGIME_PRICE_TOLERANCE_PCT: "5"
          V20_REGIME_MIN_TRUSTED_SESSIONS: "50"
          V20_REGIME_FETCH_RANGE: "6mo"
        run: node scripts/v20/build-market-regime.cjs

      - name: Validate market regime
        run: node scripts/v20/market-regime-regression.cjs

      - name: Build integrated V20 decision snapshot
        run: node scripts/v20/build-integrated-decision-snapshot.cjs

      - name: Enrich risk reward and trade-plan alignment
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs

      - name: Build trusted point-in-time technical history
        env:
          V20_HISTORY_NETWORK_REFRESH: "true"
          V20_HISTORY_CONCURRENCY: "4"
          V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: "5"
        run: node scripts/v20/build-trusted-technical-history.cjs

      - name: Validate technical history
        run: node scripts/v20/technical-history-regression.cjs

      - name: Build analytical profiles and market explorer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/null-semantics-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs

      - name: Rebuild frozen Native V1 outputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-full-market-native-technical.cjs
          node scripts/v20/build-full-market-native-selection.cjs
          node scripts/v20/build-native-explainability-v1.cjs
          node scripts/v20/finalize-native-ranking-v1.cjs
          node scripts/v20/build-native-current.cjs
          node scripts/v20/native-current-regression.cjs

      - name: Freshness and governance acceptance
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const v17=read('data/v17/current.json'),core=read('data/v20/current.json'),native=read('data/v20/native-current.json'),selection=read('data/v20/full-market-native-selection.json'),reg=read('data/v20/native-current-regression.json');
          const s=v17.sessionDate||v17.marketSession||v17.sourceMarketSession;
          if(!s||core.sessionDate!==s||native.sessionDate!==s||selection.sessionDate!==s) throw new Error(`SESSION_FRESHNESS_FAIL source=${s} core=${core.sessionDate} native=${native.sessionDate} selection=${selection.sessionDate}`);
          if(native.engineId!=='V20_FULL_MARKET_NATIVE_SELECTION_V1') throw new Error('ENGINE_ID_DRIFT');
          if(native.rankingContract!=='V20_SAFETY_STRENGTH_LEXICOGRAPHIC_TIE_BREAK_V2') throw new Error('RANKING_CONTRACT_DRIFT');
          if(native.executionPermission!==false||native.productionAllocation!==false||native.automaticPromotion!==false) throw new Error('GOVERNANCE_ESCALATION_NOT_ALLOWED');
          if(reg.ok!==true) throw new Error('NATIVE_REGRESSION_FAIL');
          if(!Array.isArray(native.publishedCandidates)||native.publishedCandidates.length<3) throw new Error('NO_TOP3');
          const next=s=>{const d=new Date(`${s}T12:00:00Z`);do d.setUTCDate(d.getUTCDate()+1);while([5,6].includes(d.getUTCDay()));return d.toISOString().slice(0,10)};
          const out={schemaVersion:'20.0.0-live-freshness-status-1',generatedAt:new Date().toISOString(),status:'FRESH_FOR_NEXT_TRADING_SESSION_RESEARCH',engineId:native.engineId,sourceSession:s,nativeSession:native.sessionDate,forNextTradingSession:next(s),top3:native.publishedCandidates.slice(0,3).map(r=>({rank:r.rank,ticker:r.ticker,entryLow:r.entryLow,entryHigh:r.entryHigh,stop:r.stop,target1:r.target1,target2:r.target2})),governance:{researchOnly:true,selectionTechniqueChanged:false,rankingContractChanged:false,executionPermission:false,productionAllocation:false,automaticPromotion:false}};
          fs.writeFileSync('data/v20/native-freshness-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Restore runtime-only source files and persist V20 only
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- data/market.json data/history.json data/final-opportunity-ranking.json data/v17
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20
          if git diff --cached --quiet; then
            echo "V20 outputs already current."
            exit 0
          fi
          SESSION="$(node -p "require('./data/v20/native-current.json').sessionDate")"
          git commit -m "Refresh V20 Native for session ${SESSION}"
          git push origin HEAD:develop/v20-integrated-decision-platform

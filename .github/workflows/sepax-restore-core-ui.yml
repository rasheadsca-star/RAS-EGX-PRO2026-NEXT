name: SEPA-X Restore Core UI

on:
  push:
    branches:
      - develop/sepax-isolated-v1
    paths:
      - .github/workflows/sepax-restore-core-ui.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/sepax-isolated-v1
          fetch-depth: 0
      - name: Restore full core browser application
        run: |
          set -euo pipefail
          git show d1422408d2481ee45dd679b87d137ee8ad32151c:sepa-x/public/app.js > sepa-x/public/app.js
          node --check sepa-x/public/app.js
          git diff --check
          git diff --exit-code -- tfe-v20
          grep -q "function renderRecommendations" sepa-x/public/app.js
          grep -q "function renderMarket" sepa-x/public/app.js
      - name: Commit restored core UI
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sepa-x/public/app.js
          git commit -m "fix(sepa-x): restore full core recommendation UI"
          git push origin HEAD:develop/sepax-isolated-v1

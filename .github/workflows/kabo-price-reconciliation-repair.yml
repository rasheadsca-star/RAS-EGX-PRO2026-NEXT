name: KABO Price Reconciliation Repair

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kabo-price-reconciliation-repair.yml"

permissions:
  contents: write

concurrency:
  group: kabo-price-reconciliation-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test reconciliation reference safety
        run: node --test tests/history-local-verification-adapter.test.cjs

      - name: Refresh KABO history with corrected reconciliation policy
        env:
          HISTORY_MODE: repair_symbol
          HISTORY_TICKER: KABO
          HISTORY_FORCE_REFRESH: "true"
          HISTORY_LOCAL_REFERENCE_MAX_AGE_DAYS: "7"
        run: node scripts/history/historical-100-runner.cjs

      - name: Rebuild history summary
        run: node scripts/history/history-summary-builder.cjs

      - name: Validate KABO repair
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const doc = JSON.parse(fs.readFileSync('data/history/KABO.json','utf8'));
          const summary = JSON.parse(fs.readFileSync('data/history-summary.json','utf8'));
          const last = doc.sessions?.at(-1);
          const warnings = (doc.warnings || []).map(String);
          const conflict = warnings.find(x => x.startsWith('latest_close_conflict:'));
          if (!doc.symbolVerified) throw new Error('KABO identity is not verified');
          if (!last || last.date !== summary.latestMarketSession) {
            throw new Error(`KABO latest session mismatch: ${last?.date} != ${summary.latestMarketSession}`);
          }
          if (!(Number(last.close) > 0)) throw new Error('KABO latest close invalid');
          if (conflict) throw new Error(`False reconciliation hold remains: ${conflict}`);
          const prev = doc.sessions?.at(-2);
          const jump = prev?.close > 0 ? Math.abs(last.close / prev.close - 1) * 100 : 0;
          if (jump > 20) throw new Error(`KABO latest daily jump requires review: ${jump.toFixed(2)}%`);
          console.log(JSON.stringify({
            status: 'KABO_RECONCILIATION_REPAIRED',
            sessionDate: last.date,
            close: last.close,
            previousClose: prev?.close ?? null,
            dailyJumpPct: Number(jump.toFixed(4)),
            warnings: doc.warnings || [],
            symbolVerified: doc.symbolVerified,
          }, null, 2));
          NODE

      - name: Commit repaired KABO evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/KABO.json data/history-summary.json data/session-calendar.json data/history-last-run.json data/history-batch-state.json data/source-audit.json data/history-errors.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No KABO data changes to commit."
          else
            git commit -m "Repair KABO false price reconciliation hold"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

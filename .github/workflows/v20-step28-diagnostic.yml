name: V20 Step 28 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-step28-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: v20-step28-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolate-step28:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}

      - name: Sync latest accepted V17 evidence for runtime only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          readonly paths=(
            data/market.json
            data/final-opportunity-ranking.json
            data/history.json
            data/v17/current.json
            data/v17/resilient-session-status.json
            data/v17/internal-ohlc-support-resistance.json
            data/v17/liquidity-gate.json
            data/v17/challenger-status.json
            data/v17/market-session-truth.json
            data/v17/regression.json
            data/v17/review.json
          )
          for rel in "${paths[@]}"; do
            git cat-file -e "$V17_SHA:$rel" || { echo "Missing V17 runtime input: $rel"; exit 1; }
            mkdir -p "$(dirname "$rel")"
            tmp="${rel}.v17-runtime"
            git show "$V17_SHA:$rel" > "$tmp"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$tmp"
            mv "$tmp" "$rel"
          done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" node scripts/v20/validate-v17-runtime-sync.cjs

      - name: Apply runtime hardening/integration patches
        run: node scripts/v20/apply-null-semantics-hardening.cjs

      - name: Reproduce Integrated producers through V18 gate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs
          V20_REGIME_NETWORK_REFRESH=true V20_REGIME_CONCURRENCY=6 V20_REGIME_MIN_PARTICIPATION_PCT=60 V20_REGIME_PRICE_TOLERANCE_PCT=5 V20_REGIME_MIN_TRUSTED_SESSIONS=50 V20_REGIME_FETCH_RANGE=6mo node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-regression.cjs
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs
          V20_HISTORY_NETWORK_REFRESH=true V20_HISTORY_CONCURRENCY=4 V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT=5 node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
          node scripts/v20/null-semantics-regression.cjs
          node scripts/v20/user-portfolio-regression.cjs
          node scripts/v20/archive-signal.cjs
          node scripts/v20/build-v18-performance-audit.cjs
          node scripts/v20/v18-performance-audit-regression.cjs

      - name: Step 28A - Build full-market native technical
        env:
          V20_NATIVE_FULL_TECH_NETWORK_REFRESH: "true"
          V20_NATIVE_FULL_TECH_STARTA_FALLBACK: "true"
          V20_NATIVE_FULL_TECH_CONCURRENCY: "8"
          V20_NATIVE_FULL_TECH_RANGE: "6mo"
          V20_NATIVE_FULL_TECH_PRICE_TOLERANCE_PCT: "5"
        run: node scripts/v20/build-full-market-native-technical.cjs

      - name: Step 28B - Build full-market native selection
        run: node scripts/v20/build-full-market-native-selection.cjs

      - name: Step 28C - Build native explainability
        run: node scripts/v20/build-native-explainability-v1.cjs

      - name: Step 28D - Finalize native ranking
        run: node scripts/v20/finalize-native-ranking-v1.cjs

      - name: Step 28E - Build native model freeze
        run: node scripts/v20/build-native-model-freeze.cjs

      - name: Step 28F - Build native current
        run: node scripts/v20/build-native-current.cjs

      - name: Step 28G - Native current regression
        run: node scripts/v20/native-current-regression.cjs

      - name: Step 28H - Archive native shadow
        env:
          V20_NATIVE_FORWARD_NETWORK_REFRESH: "true"
          V20_NATIVE_FORWARD_CONCURRENCY: "6"
        run: node scripts/v20/archive-native-shadow.cjs

      - name: Step 28I - Native shadow forward regression
        run: node scripts/v20/native-shadow-forward-regression.cjs

      - name: Step 28J - Run injected performance evidence builder
        run: node scripts/v20/build-performance-evidence-registry.cjs

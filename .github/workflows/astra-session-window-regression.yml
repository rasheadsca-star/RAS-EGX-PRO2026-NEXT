name: Astra Trading Session Window Regression
on:
  push:
    branches: [main]
    paths:
      - 'astra/market-calendar/trading-session-window.cjs'
      - 'tests/astra/trading-session-window.test.cjs'
      - 'tests/astra/g11-contiguous-history-gate.test.cjs'
      - 'astra/data-health/g11-data-health.cjs'
      - 'astra/market-calendar/egx-exchange-calendar.cjs'
      - 'data/egx-exchange-closures.json'
      - 'tests/astra/egx-exchange-calendar.test.cjs'
      - 'tests/astra/g11-expected-session-holiday.test.cjs'
      - '.github/workflows/astra-session-window-regression.yml'
  pull_request:
    paths:
      - 'astra/market-calendar/trading-session-window.cjs'
      - 'tests/astra/trading-session-window.test.cjs'
      - 'tests/astra/g11-contiguous-history-gate.test.cjs'
      - 'astra/data-health/g11-data-health.cjs'
      - 'astra/market-calendar/egx-exchange-calendar.cjs'
      - 'data/egx-exchange-closures.json'
      - 'tests/astra/egx-exchange-calendar.test.cjs'
      - 'tests/astra/g11-expected-session-holiday.test.cjs'
      - '.github/workflows/astra-session-window-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-window-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check astra/market-calendar/trading-session-window.cjs
          node --check astra/market-calendar/egx-exchange-calendar.cjs
          node --check astra/data-health/g11-data-health.cjs
      - name: Verify session-count semantics
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test --test-reporter=tap tests/astra/trading-session-window.test.cjs tests/astra/g11-contiguous-history-gate.test.cjs tests/astra/egx-exchange-calendar.test.cjs tests/astra/g11-expected-session-holiday.test.cjs | tee test-results/astra-calendar.tap
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-calendar-regression
          path: test-results/astra-calendar.tap
          if-no-files-found: warn
          retention-days: 30

name: Astra Trading Session Window Regression
on:
  push:
    branches: [main]
    paths:
      - 'astra/market-calendar/trading-session-window.cjs'
      - 'tests/astra/trading-session-window.test.cjs'
      - 'tests/astra/g11-contiguous-history-gate.test.cjs'
      - 'astra/data-health/g11-data-health.cjs'
      - '.github/workflows/astra-session-window-regression.yml'
  pull_request:
    paths:
      - 'astra/market-calendar/trading-session-window.cjs'
      - 'tests/astra/trading-session-window.test.cjs'
      - 'tests/astra/g11-contiguous-history-gate.test.cjs'
      - 'astra/data-health/g11-data-health.cjs'
      - '.github/workflows/astra-session-window-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  session-window-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: node --check astra/market-calendar/trading-session-window.cjs
      - name: Verify session-count semantics
        run: node --test tests/astra/trading-session-window.test.cjs tests/astra/g11-contiguous-history-gate.test.cjs

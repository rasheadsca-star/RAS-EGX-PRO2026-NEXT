name: MAIN APP — Market Coverage Repair

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["EGX MAIN APP V16.9.2 P2 Automatic Scan"]
    types: [completed]
  push:
    branches: ["main"]
    paths:
      - "scripts/stable/v16-market-second-source-resolver.cjs"
      - "scripts/stable/v16-market-coverage-reconciler.cjs"
      - ".github/workflows/main-app-market-coverage-repair.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: main-app-v1692-market-coverage-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest MAIN APP
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate fail-closed data repair modules
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-market-second-source-resolver.cjs
          node --check scripts/stable/v16-market-coverage-reconciler.cjs
          node --check scripts/stable/v16-main-app-pilot-lock-guard.cjs
          node --check scripts/stable/v16-main-app-auto-data-guard.cjs
          node --check scripts/stable/v16-v169-live-resolution-normalizer.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs

      - name: Fingerprint frozen production decision and strategy
        id: frozen
        shell: bash
        run: |
          set -euo pipefail
          echo "decision=$(sha256sum data/stable/v16-v169-primary-decision.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          { sha256sum scripts/research/v16-v169-basket-engine.py scripts/stable/v16-publish-v169-basket.cjs data/stable/v16-v169-release-lock.json; } | sha256sum | awk '{print "strategy=" $1}' >> "$GITHUB_OUTPUT"

      - name: Enforce frozen V16.9 pilot methodology
        run: node scripts/stable/v16-main-app-pilot-lock-guard.cjs

      - name: Resolve only rejected rows with independent sources
        run: node scripts/stable/v16-market-second-source-resolver.cjs

      - name: Reconcile independently proven rows into Price Truth
        run: node scripts/stable/v16-market-coverage-reconciler.cjs

      - name: Preserve automatic market-data and fail-closed guard
        run: node scripts/stable/v16-main-app-auto-data-guard.cjs

      - name: Preserve normalized live ledger
        run: node scripts/stable/v16-v169-live-resolution-normalizer.cjs

      - name: Rebuild Professional Readiness V2
        run: node scripts/stable/v16-main-app-professional-readiness.cjs

      - name: Verify no strategy or recommendation mutation
        env:
          BEFORE_DECISION: ${{ steps.frozen.outputs.decision }}
          BEFORE_STRATEGY: ${{ steps.frozen.outputs.strategy }}
        shell: bash
        run: |
          set -euo pipefail
          AFTER_DECISION=$(sha256sum data/stable/v16-v169-primary-decision.json | awk '{print $1}')
          AFTER_STRATEGY=$({ sha256sum scripts/research/v16-v169-basket-engine.py scripts/stable/v16-publish-v169-basket.cjs data/stable/v16-v169-release-lock.json; } | sha256sum | awk '{print $1}')
          [ "$BEFORE_DECISION" = "$AFTER_DECISION" ] || { echo "Production decision mutated by data repair"; exit 1; }
          [ "$BEFORE_STRATEGY" = "$AFTER_STRATEGY" ] || { echo "Frozen V16.9 strategy mutated by data repair"; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const p=read('data/stable/v15-price-truth.json');
          const s=read('data/stable/v16-market-second-source-evidence.json');
          const r=read('data/stable/v16-main-app-professional-readiness.json');
          if(p.executionGrade!==true || p.ready!==true) throw new Error('Execution Grade regressed during coverage repair');
          if(Number(p.acceptedRows||0)<205) throw new Error('Accepted-row coverage regressed below baseline 205');
          if(Number(p?.source?.sourceSessionEvidenceCoveragePct||0)<97.7) throw new Error('Session-evidence coverage regressed below baseline 97.7%');
          console.log({
            expectedSession:p.expectedSession,
            secondSourceTargets:s.targetCount,
            secondSourceApproved:s.approvedCount,
            approvedTickers:s.approvedTickers,
            unresolvedTickers:s.unresolvedTickers,
            acceptedRows:p.acceptedRows,
            inputRows:p?.source?.inputRows,
            verifiedExpectedSessionRows:p?.source?.verifiedExpectedSessionRows,
            sourceCoveragePct:p?.source?.sourceSessionEvidenceCoveragePct,
            readiness:r.professionalReadinessScore,
            foundation:r.foundationQualityScore,
            hardBlockers:(r.hardBlockers||[]).map(x=>x.code)
          });
          NODE

      - name: Commit market evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/history \
            data/fetch-status.json \
            data/stable/v15-price-truth.json \
            data/stable/v16-source-session-evidence.json \
            data/stable/v16-market-second-source-evidence.json \
            data/stable/v16-main-app-pilot-lock-status.json \
            data/stable/v16-main-app-auto-data-guard.json \
            data/stable/v16-v169-live-evaluation.json \
            data/stable/v16-main-app-professional-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MAIN APP fail-closed market coverage evidence"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Publish latest evidence to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref main

name: Deploy EGX Pro V14.0 Final Stable App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v13-20-stable-work-deploy.yml"
      - "preview-v14/app/**"
      - "data/stable/v14-stable-decision.json"
      - "data/ops/v14-stable-policy.json"
      - "data/research/v13-20-multi-session-results.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v14-final-stable
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout confirmed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V14 final application
        shell: bash
        run: |
          set -euo pipefail
          required=(
            preview-v14/app/index.html
            preview-v14/app/recommendation-history.html
            preview-v14/app/final.html
            data/stable/v14-stable-decision.json
            data/ops/v14-stable-policy.json
            data/research/v13-20-multi-session-results.json
            data/market-quality-acceptance-v13-17-1.json
            data/v13-17-1-production-policy.json
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          grep -q "V14_STABLE_DECISION_SYSTEM" preview-v14/app/index.html
          grep -q "أفضل خمسة أسهم تحت النظر" preview-v14/app/index.html
          grep -q "لا توجد توصية شراء مؤهلة" preview-v14/app/index.html
          grep -q "متابعة وتقييم التوصيات السابقة" preview-v14/app/recommendation-history.html
          grep -q "القرار اليومي وأفضل خمسة" preview-v14/app/final.html
          grep -q "المحفظة والمتابعة التفصيلية" preview-v14/app/final.html
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          json_files = [
              'data/stable/v14-stable-decision.json',
              'data/ops/v14-stable-policy.json',
              'data/research/v13-20-multi-session-results.json',
              'data/market-quality-acceptance-v13-17-1.json',
              'data/v13-17-1-production-policy.json',
          ]
          documents = {file: json.loads(Path(file).read_text(encoding='utf-8')) for file in json_files}
          stable = documents['data/stable/v14-stable-decision.json']
          policy = documents['data/ops/v14-stable-policy.json']
          production = documents['data/v13-17-1-production-policy.json']

          if stable.get('schemaVersion') != '14.0.0':
              raise SystemExit('Unexpected V14 stable schema version')
          if len(stable.get('topFiveWatchlist') or []) != 5:
              raise SystemExit('V14 must publish exactly five watchlist stocks')
          if len(stable.get('qualifiedRecommendations') or []) > 3:
              raise SystemExit('V14 cannot publish more than three qualified recommendations')
          if stable.get('system', {}).get('automaticBrokerOrders') is not False:
              raise SystemExit('Automatic broker orders must remain disabled in V14')
          if production.get('decisionExecution', {}).get('automaticBrokerOrders') is not False:
              raise SystemExit('Production policy automatic broker orders must remain disabled')
          if policy.get('execution', {}).get('automaticBrokerOrders') is not False:
              raise SystemExit('V14 policy automatic broker orders must remain disabled')
          if policy.get('featureFreeze', {}).get('enabled') is not True:
              raise SystemExit('V14 feature freeze must remain enabled')

          html_files = [
              'preview-v14/app/index.html',
              'preview-v14/app/recommendation-history.html',
              'preview-v14/app/final.html',
          ]
          for i, source in enumerate(html_files):
              text = Path(source).read_text(encoding='utf-8')
              scripts = '\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S))
              Path(f'/tmp/v14-{i}.js').write_text(scripts, encoding='utf-8')
              ids = re.findall(r'\bid=["\']([^"\']+)["\']', text)
              duplicates = sorted({value for value in ids if ids.count(value) > 1})
              if duplicates:
                  raise SystemExit(f'Duplicate HTML ids in {source}: {duplicates}')
          print('V14 JSON policy and HTML structure passed')
          PY
          node --check /tmp/v14-0.js
          node --check /tmp/v14-1.js
          node --check /tmp/v14-2.js
          echo "EGX PRO V14.0 FINAL STABLE APPLICATION VALIDATION PASSED"

      - name: Publish deployment status
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const stable=JSON.parse(fs.readFileSync('data/stable/v14-stable-decision.json','utf8'));
          console.log({
            appVersion:'V14.0',
            sessionDate:stable.sessionDate,
            watchlistCount:stable?.topFiveWatchlist?.length||0,
            qualifiedRecommendations:stable?.qualifiedRecommendations?.length||0,
            noTrade:stable?.decision?.noTrade===true,
            technicallyStable:stable?.system?.technicallyStable===true,
            automaticBrokerOrders:false,
            finalEntry:'preview-v14/app/final.html'
          });
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V14 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy V14 final app
        id: deployment
        uses: actions/deploy-pages@v4

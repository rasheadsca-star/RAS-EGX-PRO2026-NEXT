name: V15 Practical Validate and Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/stable/v15-practical-market-scanner.cjs"
      - "scripts/stable/v15-price-truth-gate.cjs"
      - "scripts/stable/v15-live-price-truth.cjs"
      - "scripts/stable/v15-missing-symbol-fallback.cjs"
      - "scripts/stable/v15-recommendation-evaluator.cjs"
      - "scripts/fetch-market-data.js"
      - "preview-v15/app/index.html"
      - "index.html"
      - "manifest.json"
      - ".github/workflows/v15-practical-deploy.yml"
  schedule:
    - cron: "20 12 * * 0-4"

env:
  EGXAPI_KEY: ${{ secrets.EGXAPI_KEY }}
  EGX_KEY: ${{ secrets.EGX_KEY }}
  EGX_MARKET_JSON_URL: ${{ secrets.EGX_MARKET_JSON_URL }}
  PUBLIC_MARKET_JSON_URL: ${{ secrets.PUBLIC_MARKET_JSON_URL }}
  EGX_MIN_EXECUTION_ROWS: "80"
  EGX_PRICE_MATCH_TOLERANCE_PCT: "1.75"
  EGX_MAX_SINGLE_SESSION_JUMP_PCT: "35"
  EGX_RECOMMENDATION_EVAL_START: "2026-08-02T22:10:00.000Z"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v15-practical-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run public-market collector
        run: |
          set +e
          node scripts/fetch-market-data.js
          echo "Primary collector exit code: $?"
          node --check scripts/stable/v15-missing-symbol-fallback.cjs
          node scripts/stable/v15-missing-symbol-fallback.cjs
          echo "Missing-symbol fallback exit code: $?"
          exit 0

      - name: Build current price truth
        run: |
          set +e
          node --check scripts/stable/v15-live-price-truth.cjs
          node scripts/stable/v15-live-price-truth.cjs
          echo "Price-truth provider exit code: $?"
          exit 0

      - name: Rebuild V15 and enforce price truth
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-practical-market-scanner.cjs
          node --check scripts/stable/v15-price-truth-gate.cjs
          node scripts/stable/v15-practical-market-scanner.cjs
          node scripts/stable/v15-price-truth-gate.cjs

      - name: Archive and evaluate previous recommendations
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-recommendation-evaluator.cjs
          node scripts/stable/v15-recommendation-evaluator.cjs

      - name: Acceptance checks
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json','utf8'));
          const v=JSON.parse(fs.readFileSync('data/research/v15-practical-validation.json','utf8'));
          const f=JSON.parse(fs.readFileSync('data/fetch-status.json','utf8'));
          const p=JSON.parse(fs.readFileSync('data/stable/v15-price-truth.json','utf8'));
          const missing=JSON.parse(fs.readFileSync('data/stable/v15-missing-symbol-report.json','utf8'));
          const evaluation=JSON.parse(fs.readFileSync('data/stable/v15-recommendation-evaluation.json','utf8'));
          const ledger=JSON.parse(fs.readFileSync('data/stable/v15-recommendation-ledger.json','utf8'));
          const html=fs.readFileSync('preview-v15/app/index.html','utf8');
          const root=fs.readFileSync('index.html','utf8');
          if(!String(d.schemaVersion||'').startsWith('15.0.')) throw new Error('Unexpected V15 decision schema');
          if(!String(p.schemaVersion||'').startsWith('15.2.')) throw new Error('Unexpected price-truth schema');
          if(!String(missing.schemaVersion||'').startsWith('15.0.')) throw new Error('Missing-symbol report unavailable');
          if(!String(evaluation.schemaVersion||'').startsWith('15.0.')) throw new Error('Recommendation evaluation report unavailable');
          if(!String(ledger.schemaVersion||'').startsWith('15.0.')) throw new Error('Recommendation ledger unavailable');
          if(evaluation.methodology?.version!=='V15_CONSERVATIVE_DAILY_OHLC_1.0') throw new Error('Unexpected evaluation methodology');
          if(ledger.methodologyVersion!=='V15_CONSERVATIVE_DAILY_OHLC_1.0') throw new Error('Ledger methodology mismatch');
          if(!Array.isArray(evaluation.records)||!Array.isArray(ledger.records)) throw new Error('Recommendation archive is malformed');
          const ids=evaluation.records.map(x=>x.id);
          if(new Set(ids).size!==ids.length) throw new Error('Duplicate recommendation IDs in evaluation report');
          if(d.mode!=='FULL_MARKET_CROSS_SECTIONAL_WALK_FORWARD') throw new Error('Full-market mode missing');
          if(d.guardrails?.fullMarketScan!==true||d.guardrails?.futureLeakageForbidden!==true) throw new Error('Research safeguards missing');
          if(d.guardrails?.automaticOrders!==false) throw new Error('Automatic orders must remain disabled');
          if(!d.priceTruth) throw new Error('Price-truth diagnostics missing');
          if(f.executionGrade!==true||p.ready!==true){
            if(d.practicalReady!==false) throw new Error('Non-current prices cannot be practical-ready');
            if(!Array.isArray(d.recommendations)||d.recommendations.length!==0) throw new Error('Recommendations leaked from unverified prices');
          }
          if(!Array.isArray(v.validatedModels)||v.validatedModels.length===0) throw new Error('No validated models');
          for(const modelId of v.validatedModels){
            const m=v.models.find(x=>x.id===modelId);
            if(!m?.validationPassed||!m?.testPassed) throw new Error(`${modelId} did not pass both stages`);
            if(!(m.test.targetRatePct>m.test.stopRatePct)) throw new Error(`${modelId} target rate does not exceed stop rate`);
            if(!(m.test.averageReturnPct>0&&m.test.profitFactor>=1.15)) throw new Error(`${modelId} test return gate failed`);
          }
          if(d.practicalReady){
            if(d.priceTruth.ready!==true||f.executionGrade!==true||p.ready!==true) throw new Error('Practical recommendations lack execution-grade price truth');
            if(d.sessionDate!==d.expectedLatestSession||d.sessionDate!==p.expectedSession) throw new Error('Practical recommendations use a stale session');
            if(p.acceptedRows<80) throw new Error('Insufficient current market breadth');
            if(!Array.isArray(d.recommendations)||d.recommendations.length<1||d.recommendations.length>5) throw new Error('Invalid practical recommendation count');
            for(const r of d.recommendations){
              if(!(r.estimatedTargetProbabilityPct>r.estimatedStopProbabilityPct)) throw new Error(`${r.ticker}: target probability is not above stop`);
              if(!(r.entryLow>0&&r.entryHigh>=r.entryLow&&r.stopLoss<r.entryLow&&r.target1>r.entryHigh)) throw new Error(`${r.ticker}: invalid entry plan`);
              if(!(r.outOfSampleAverageReturnPct>0&&r.outOfSampleProfitFactor>=1.15)) throw new Error(`${r.ticker}: weak out-of-sample evidence`);
              const archived=evaluation.records.find(x=>x.recommendationDate===d.sessionDate&&x.ticker===r.ticker&&x.strategyId===r.strategyId);
              if(!archived) throw new Error(`${r.ticker}: current recommendation was not archived`);
              if(!(archived.entryLow>0&&archived.entryHigh>=archived.entryLow&&archived.stopLoss<archived.entryLow&&archived.target1>archived.entryHigh)) throw new Error(`${r.ticker}: archived plan is invalid`);
            }
          }
          for(const marker of ['V15_PRACTICAL_FULL_MARKET_SYSTEM','V15_PREVIOUS_RECOMMENDATIONS_EVALUATION','أفضل الفرص العملية الآن','تقييم التوصيات السابقة','احتمال الهدف — اختبار نهائي','أسهم قوية لكن لا يُفضّل مطاردتها الآن','../../data/stable/v15-practical-decision.json','../../data/stable/v15-recommendation-evaluation.json']) if(!html.includes(marker)) throw new Error(`Missing UI marker: ${marker}`);
          if(!root.includes('preview-v15/app/index.html')) throw new Error('Root launcher does not point to V15');
          const htmlIds=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x=>x[1]);
          const dup=[...new Set(htmlIds.filter((x,i)=>htmlIds.indexOf(x)!==i))];
          if(dup.length) throw new Error(`Duplicate IDs: ${dup.join(', ')}`);
          const focus=['AALR','ODIN','NIPH'];
          const recovered=new Map((missing.recovered||[]).map(x=>[x.symbol,x.price]));
          const failed=new Set((missing.failed||[]).map(x=>x.symbol));
          console.log({session:d.sessionDate,expected:d.expectedLatestSession,provider:{ready:p.ready,accepted:p.acceptedRows,source:p.source},missing:{before:missing.missingBeforeFallback,recovered:missing.recoveredRows,final:missing.finalRows,focus:focus.map(symbol=>({symbol,price:recovered.get(symbol)||null,failed:failed.has(symbol)}))},status:d.status,recommendations:d.recommendations.map(x=>x.ticker),evaluation:evaluation.summary});
          NODE

      - name: Commit refreshed market truth and reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/market.json data/fetch-status.json data/source-health.json data/source-fetch-report.json data/stable/v15-price-truth.json data/stable/v15-missing-symbol-report.json data/stable/v15-practical-decision.json data/stable/v15-recommendation-ledger.json data/stable/v15-recommendation-evaluation.json data/research/v15-practical-validation.json data/research/v15-missed-opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh V15 recommendations and evaluation"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt*15))
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy V15
        id: deployment
        uses: actions/deploy-pages@v4

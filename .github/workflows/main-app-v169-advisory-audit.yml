name: MAIN APP V16.9 Portfolio Advisory Audit

on:
  pull_request:
    paths:
      - 'preview-v16/app/v16-9-active-position-manager.js'
      - 'preview-v16/app/v16-9-position-advisory-core.js'
      - 'tests/main-app-v169-advisory.test.cjs'
      - '.github/workflows/main-app-v169-advisory-audit.yml'
  push:
    branches: [main]
    paths:
      - 'preview-v16/app/v16-9-active-position-manager.js'
      - 'preview-v16/app/v16-9-position-advisory-core.js'
      - 'tests/main-app-v169-advisory.test.cjs'
      - '.github/workflows/main-app-v169-advisory-audit.yml'

permissions:
  contents: read

jobs:
  advisory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check preview-v16/app/v16-9-position-advisory-core.js
          node --check preview-v16/app/v16-9-active-position-manager.js
      - name: Professional advisory tests
        run: node --test tests/main-app-v169-advisory.test.cjs
      - name: Safety and cadence gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('preview-v16/app/v16-9-active-position-manager.js','utf8');
          const c=fs.readFileSync('preview-v16/app/v16-9-position-advisory-core.js','utf8');
          if(!/REFRESH_MS = 5 \* 60 \* 1000/.test(s)) throw new Error('FIVE_MINUTE_CADENCE_MISSING');
          if(!s.includes("egx-v16-professional-portfolio")) throw new Error('CANONICAL_PORTFOLIO_KEY_MISSING');
          if(/automaticOrders\s*:\s*true/.test(s+c)) throw new Error('AUTO_ORDER_ENABLED');
          if(/placeOrder|submitOrder|executeTrade/i.test(s+c)) throw new Error('ORDER_PATH_FOUND');
          if(!s.includes('PARTIAL_HOLD_NEXT') && !c.includes('PARTIAL_HOLD_NEXT')) throw new Error('NEXT_TARGET_MANAGEMENT_MISSING');
          console.log('MAIN_APP_V169_ADVISORY_SAFETY_PASS');
          NODE

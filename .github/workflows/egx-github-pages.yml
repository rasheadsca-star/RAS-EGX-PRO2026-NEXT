name: Publish EGX PRO on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper-v4/ranking.html'
      - 'data/paper-v4/ranking-latest.json'
      - '.github/workflows/egx-github-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: egx-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static Pages site
        shell: bash
        run: |
          set -euo pipefail
          test -s paper-v4/ranking.html
          test -s data/paper-v4/ranking-latest.json
          node -e "const x=require('./data/paper-v4/ranking-latest.json'); if (!x.beforeFilters?.length || !x.beforeFilters.some(s=>s.ticker==='AMOC') || !x.beforeFilters.some(s=>s.ticker==='ENGC')) process.exit(1); console.log(x.latestSession,x.counts)"
          mkdir -p _site/paper-v4 _site/data/paper-v4
          cp paper-v4/ranking.html _site/paper-v4/ranking.html
          cp data/paper-v4/ranking-latest.json _site/data/paper-v4/ranking-latest.json
          printf '%s\n' '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>EGX PRO V4</title><meta http-equiv="refresh" content="0;url=paper-v4/ranking.html"><a href="paper-v4/ranking.html">فتح محرك EGX PRO V4</a></html>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

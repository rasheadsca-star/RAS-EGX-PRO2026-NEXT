name: EGX ONE Reconciliation Envelope Upgrade
on:
  push:
    branches: [egx-one/clean-room-v0]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1
      - name: Bind direct SQL reconciliation rows to full certified proof envelope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/market-data-store.js');s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label} pattern not found')
              s=s.replace(old,new,1)

          rep("import { reconcileCertifiedObservations } from './reconciliation.js';",
              "import { reconcileCertifiedObservations } from './reconciliation.js';\nimport { createCertifiedReconciliationEnvelope,verifyCertifiedReconciliationEnvelope,reconciliationEnvelopeMatchesRow } from './certified-reconciliation-envelope.js';",'import')

          old="    this.db.function('egx_registry_universe_match',{deterministic:true},(registryJson,universeJson)=>{try{return registryMatchesUniverse(JSON.parse(registryJson),JSON.parse(universeJson))?1:0}catch{return 0}});\n    this.#init();"
          new="    this.db.function('egx_registry_universe_match',{deterministic:true},(registryJson,universeJson)=>{try{return registryMatchesUniverse(JSON.parse(registryJson),JSON.parse(universeJson))?1:0}catch{return 0}});\n    this.db.function('egx_source_manifest_row_valid',{deterministic:true},(payloadJson,sourceManifestHash)=>{try{const payload=JSON.parse(payloadJson);return sha256(payload)===sourceManifestHash&&(payload?.mode!=='CERTIFIED_PRODUCTION'||validCertifiedSourceManifest(payload))?1:0}catch{return 0}});\n    this.db.function('egx_certified_reconciliation_row_valid',{deterministic:true},(payloadJson,reconciliationManifestHash,sourceManifestHash,ticker,session,primarySourceId,primaryObservationCertificateHash)=>{try{return reconciliationEnvelopeMatchesRow(JSON.parse(payloadJson),{reconciliationManifestHash,sourceManifestHash,ticker,session,primarySourceId,primaryObservationCertificateHash})?1:0}catch{return 0}});\n    this.db.function('egx_certified_reconciliation_bar_valid',{deterministic:true},(payloadJson,reconciliationManifestHash,sourceManifestHash,ticker,session,primarySourceId,primaryObservationCertificateHash,open,high,low,close,volume)=>{try{return reconciliationEnvelopeMatchesRow(JSON.parse(payloadJson),{reconciliationManifestHash,sourceManifestHash,ticker,session,primarySourceId,primaryObservationCertificateHash,bar:{open:Number(open),high:Number(high),low:Number(low),close:Number(close),volume:volume==null?null:Number(volume)}})?1:0}catch{return 0}});\n    this.#init();"
          rep(old,new,'udf')

          old="      CREATE TRIGGER IF NOT EXISTS source_manifest_no_update BEFORE UPDATE ON source_manifests BEGIN SELECT RAISE(ABORT,'IMMUTABLE_SOURCE_MANIFEST'); END;\n      CREATE TRIGGER IF NOT EXISTS source_manifest_no_delete BEFORE DELETE ON source_manifests BEGIN SELECT RAISE(ABORT,'IMMUTABLE_SOURCE_MANIFEST'); END;\n      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_update BEFORE UPDATE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;\n      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_delete BEFORE DELETE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;"
          new="      CREATE TRIGGER IF NOT EXISTS source_manifest_no_update BEFORE UPDATE ON source_manifests BEGIN SELECT RAISE(ABORT,'IMMUTABLE_SOURCE_MANIFEST'); END;\n      CREATE TRIGGER IF NOT EXISTS source_manifest_no_delete BEFORE DELETE ON source_manifests BEGIN SELECT RAISE(ABORT,'IMMUTABLE_SOURCE_MANIFEST'); END;\n      CREATE TRIGGER IF NOT EXISTS source_manifest_valid_insert BEFORE INSERT ON source_manifests WHEN egx_source_manifest_row_valid(NEW.payload_json,NEW.source_manifest_hash)<>1 BEGIN SELECT RAISE(ABORT,'INVALID_SOURCE_MANIFEST_ROW'); END;\n      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_update BEFORE UPDATE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;\n      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_no_delete BEFORE DELETE ON certified_reconciliations BEGIN SELECT RAISE(ABORT,'IMMUTABLE_CERTIFIED_RECONCILIATION'); END;\n      CREATE TRIGGER IF NOT EXISTS certified_reconciliation_valid_insert BEFORE INSERT ON certified_reconciliations WHEN egx_certified_reconciliation_row_valid(NEW.payload_json,NEW.reconciliation_manifest_hash,NEW.source_manifest_hash,NEW.ticker,NEW.session,NEW.primary_source_id,NEW.primary_observation_certificate_hash)<>1 OR NOT EXISTS(SELECT 1 FROM source_manifests s WHERE s.source_manifest_hash=NEW.source_manifest_hash AND s.payload_json=json_extract(NEW.payload_json,'$.sourceManifest') IS NOT NULL) BEGIN SELECT RAISE(ABORT,'INVALID_CERTIFIED_RECONCILIATION_ROW'); END;"
          rep(old,new,'insert triggers')

          old="      CREATE TRIGGER IF NOT EXISTS normalized_current_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session=(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) AND (NEW.certified_reconciliation_manifest_hash IS NULL OR NEW.primary_observation_certificate_hash IS NULL) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_CERTIFIED_LINEAGE'); END;"
          new="      CREATE TRIGGER IF NOT EXISTS normalized_current_production_guard BEFORE INSERT ON normalized_bars WHEN (SELECT ingestion_mode FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id)='CERTIFIED_PRODUCTION' AND NEW.session=(SELECT market_session FROM data_snapshots WHERE data_snapshot_id=NEW.data_snapshot_id) AND (NEW.certified_reconciliation_manifest_hash IS NULL OR NEW.primary_observation_certificate_hash IS NULL OR NOT EXISTS(SELECT 1 FROM certified_reconciliations c WHERE c.reconciliation_manifest_hash=NEW.certified_reconciliation_manifest_hash AND c.source_manifest_hash=NEW.source_manifest_hash AND c.ticker=NEW.ticker AND c.session=NEW.session AND c.primary_observation_certificate_hash=NEW.primary_observation_certificate_hash AND egx_certified_reconciliation_bar_valid(c.payload_json,c.reconciliation_manifest_hash,c.source_manifest_hash,c.ticker,c.session,c.primary_source_id,c.primary_observation_certificate_hash,NEW.open,NEW.high,NEW.low,NEW.close,NEW.volume)=1)) BEGIN SELECT RAISE(ABORT,'CERTIFIED_PRODUCTION_CURRENT_BAR_REQUIRES_CERTIFIED_LINEAGE'); END;"
          rep(old,new,'normalized guard')

          old="const reconciliationManifestHash=reconciliation.sourceManifest.manifestHash;this.db.prepare(`INSERT OR IGNORE INTO certified_reconciliations(reconciliation_manifest_hash,source_manifest_hash,ticker,session,primary_source_id,primary_observation_certificate_hash,payload_json,created_at) VALUES (?,?,?,?,?,?,?,?)`).run(reconciliationManifestHash,snap.source_manifest_hash,reconciliation.authoritative.ticker,reconciliation.authoritative.session,reconciliation.authoritative.sourceId,primaryCertificateHash,canonicalize(reconciliation.sourceManifest),snap.created_at);"
          new="const reconciliationManifestHash=reconciliation.sourceManifest.manifestHash,envelope=createCertifiedReconciliationEnvelope({entries,acquisitionPlan,maxCloseConflictPct});if(canonicalize(envelope.sourceManifest)!==canonicalize(reconciliation.sourceManifest)||canonicalize(envelope.authoritative)!==canonicalize(reconciliation.authoritative))throw new Error('CERTIFIED_RECONCILIATION_ENVELOPE_MISMATCH');this.db.prepare(`INSERT OR IGNORE INTO certified_reconciliations(reconciliation_manifest_hash,source_manifest_hash,ticker,session,primary_source_id,primary_observation_certificate_hash,payload_json,created_at) VALUES (?,?,?,?,?,?,?,?)`).run(reconciliationManifestHash,snap.source_manifest_hash,reconciliation.authoritative.ticker,reconciliation.authoritative.session,reconciliation.authoritative.sourceId,primaryCertificateHash,canonicalize(envelope),snap.created_at);"
          rep(old,new,'envelope store')

          old="const reconciliation=JSON.parse(row.reconciliation_payload_json);if(!validCertifiedSourceManifest(reconciliation)||reconciliation.manifestHash!==row.certified_reconciliation_manifest_hash)throw new Error(`SESSION_MANIFEST_RECONCILIATION_INVALID:${row.ticker}`);const barHash=sha256({ticker:row.ticker,session:row.session,open:row.open,high:row.high,low:row.low,close:row.close,volume:row.volume});if(reconciliation.authoritativeBarHash!==barHash)throw new Error(`SESSION_MANIFEST_CURRENT_BAR_HASH_MISMATCH:${row.ticker}`);if(reconciliation.primaryObservationCertificateHash!==row.primary_observation_certificate_hash)throw new Error(`SESSION_MANIFEST_CURRENT_BAR_CERTIFICATE_MISMATCH:${row.ticker}`)"
          new="const reconciliationEnvelope=JSON.parse(row.reconciliation_payload_json),verifiedEnvelope=verifyCertifiedReconciliationEnvelope(reconciliationEnvelope);if(verifiedEnvelope.state!=='READY'||!reconciliationEnvelopeMatchesRow(reconciliationEnvelope,{reconciliationManifestHash:row.certified_reconciliation_manifest_hash,sourceManifestHash:row.reconciliation_source_manifest_hash,ticker:row.ticker,session:row.session,primarySourceId:reconciliationEnvelope?.authoritative?.sourceId,primaryObservationCertificateHash:row.primary_observation_certificate_hash,bar:{open:row.open,high:row.high,low:row.low,close:row.close,volume:row.volume}}))throw new Error(`SESSION_MANIFEST_RECONCILIATION_INVALID:${row.ticker}`)"
          rep(old,new,'session envelope verify')
          p.write_text(s)
          PY
      - name: Commit envelope upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/market-data-store.js
          git commit -m 'Require full certified reconciliation proof for SQL admission'
          git pull --rebase origin egx-one/clean-room-v0
          git push origin HEAD:egx-one/clean-room-v0

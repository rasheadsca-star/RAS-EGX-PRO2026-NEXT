name: EGX ONE Reconciliation Envelope Upgrade
on:
  push:
    branches: [egx-one/clean-room-v0]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: egx-one/clean-room-v0
          fetch-depth: 1
      - name: Remove redundant JSON comparison from reconciliation trigger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/market-data-store.js');s=p.read_text()
          old="CREATE TRIGGER IF NOT EXISTS certified_reconciliation_valid_insert BEFORE INSERT ON certified_reconciliations WHEN egx_certified_reconciliation_row_valid(NEW.payload_json,NEW.reconciliation_manifest_hash,NEW.source_manifest_hash,NEW.ticker,NEW.session,NEW.primary_source_id,NEW.primary_observation_certificate_hash)<>1 OR NOT EXISTS(SELECT 1 FROM source_manifests s WHERE s.source_manifest_hash=NEW.source_manifest_hash AND s.payload_json=json_extract(NEW.payload_json,'$.sourceManifest') IS NOT NULL) BEGIN SELECT RAISE(ABORT,'INVALID_CERTIFIED_RECONCILIATION_ROW'); END;"
          new="CREATE TRIGGER IF NOT EXISTS certified_reconciliation_valid_insert BEFORE INSERT ON certified_reconciliations WHEN egx_certified_reconciliation_row_valid(NEW.payload_json,NEW.reconciliation_manifest_hash,NEW.source_manifest_hash,NEW.ticker,NEW.session,NEW.primary_source_id,NEW.primary_observation_certificate_hash)<>1 BEGIN SELECT RAISE(ABORT,'INVALID_CERTIFIED_RECONCILIATION_ROW'); END;"
          if old not in s: raise SystemExit('redundant trigger clause not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit trigger cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/market-data-store.js
          git commit -m 'Keep reconciliation SQL gate proof-based and deterministic'
          git pull --rebase origin egx-one/clean-room-v0
          git push origin HEAD:egx-one/clean-room-v0

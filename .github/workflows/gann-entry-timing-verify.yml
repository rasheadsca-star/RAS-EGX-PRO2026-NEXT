name: GANN Entry Timing Verify
on:
  push:
    branches:
      - feature/gann-entry-timing-grade-v1
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check gann-fusion-x/engine/entry-timing.js
          node --check gann-fusion-x/scripts/test-unified-funnel.cjs
          node --check gann-fusion-x/scripts/pages-browser-smoke.cjs
      - name: Build snapshot
        run: node gann-fusion-x/scripts/build-snapshot.cjs
      - name: Build forward shadow
        run: node gann-fusion-x/scripts/forward-shadow-v2.cjs
      - name: Verify funnel ranking and timing grades
        run: node gann-fusion-x/scripts/test-unified-funnel.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke branch code on local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/gann-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          GANN_PAGE_URL=http://127.0.0.1:8000/gann-fusion-x/app/index-v1.html node gann-fusion-x/scripts/pages-browser-smoke.cjs

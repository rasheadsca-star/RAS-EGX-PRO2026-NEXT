name: EGX Historical Provenance Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/independent/audit-history-provenance.cjs'
      - '.github/workflows/egx-history-provenance-audit.yml'
      - 'tests/independent/audit-history-provenance.test.cjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit syntax and generate read-only evidence
        run: |
          node --check scripts/independent/audit-history-provenance.cjs
          node --test tests/independent/audit-history-provenance.test.cjs
          node scripts/independent/audit-history-provenance.cjs
      - name: Upload dated history audit
        uses: actions/upload-artifact@v4
        with:
          name: egx-history-provenance-audit-${{ github.run_id }}
          path: unified-console/history-provenance-audit.json
          if-no-files-found: error

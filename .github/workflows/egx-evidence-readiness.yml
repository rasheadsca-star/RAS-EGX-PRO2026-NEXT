name: EGX G09 G11 Evidence Readiness (non-cutover)
on:
  push:
    branches:
      - work/egx-recovery-audit-20261027
    paths:
      - 'scripts/research/egx-recovery-readiness-v2.cjs'
      - '.github/workflows/egx-evidence-readiness.yml'
      - 'tests/research/egx-recovery-readiness-v2.test.cjs'
      - 'scripts/research/egx-live-main-drift.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax
        run: node --check scripts/research/egx-recovery-readiness-v2.cjs
      - name: Test fail-closed behavior with controlled fixtures
        run: node --test tests/research/egx-recovery-readiness-v2.test.cjs
      - name: Fetch current main for independent drift comparison
        run: git fetch --no-tags origin main
      - name: Compare latest main market session with Astra certification
        id: drift
        continue-on-error: true
        run: node scripts/research/egx-live-main-drift.cjs
      - name: Evaluate pinned current G09/G11 source evidence
        id: readiness
        continue-on-error: true
        run: node scripts/research/egx-recovery-readiness-v2.cjs
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egx-g09-g11-readiness-${{ github.run_id }}
          path: |
            artifacts/history-recovery/readiness-evidence.json
            artifacts/history-recovery/main-session-drift.json
          if-no-files-found: warn
      - name: Enforce blocked gate outcome
        if: steps.drift.outcome == 'failure' || steps.readiness.outcome == 'failure'
        run: exit 2

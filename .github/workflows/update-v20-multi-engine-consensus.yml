name: Update V20 Multi-Engine Consensus Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-v20-multi-engine-consensus.yml"
  workflow_run:
    workflows:
      - "Update V20 Cross-Version Consensus Overlay"
      - "EGX V19 CHAT GPT Isolated Research"
      - "V20 V17-Centric Clean Architecture Certification V5"
    types: [completed]
  schedule:
    - cron: "25 7-20 * * 0-4"

permissions:
  contents: write

concurrency:
  group: v20-multi-engine-consensus-monitor
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout V20 decision platform
        uses: actions/checkout@v6
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build three-engine confirmation registry
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/v20/build-multi-engine-consensus.cjs
          node --check scripts/v20/multi-engine-consensus-regression.cjs
          node scripts/v20/build-multi-engine-consensus.cjs
          node scripts/v20/multi-engine-consensus-regression.cjs

      - name: Require aligned current session
        id: aligned
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(node -e "process.stdout.write(require('./data/v20/multi-engine-consensus.json').status)")"
          if [ "$STATUS" != "CURRENT_SESSION_ALIGNED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Independent engines are not on the same session yet; prior artifact remains canonical."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist monitor artifacts on V20 only
        if: steps.aligned.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/v20/multi-engine-consensus.json data/v20/multi-engine-consensus-regression.json
          staged="$(git diff --cached --name-only)"
          test -z "$(printf '%s\n' "$staged" | grep -Ev '^data/v20/multi-engine-consensus(-regression)?\.json$' || true)" || { echo "Unexpected staged file"; exit 1; }
          if git diff --cached --quiet; then
            echo "Multi-engine consensus artifacts already current."
            exit 0
          fi
          SESSION="$(node -e "process.stdout.write(require('./data/v20/multi-engine-consensus.json').sessionDate)")"
          git commit -m "Refresh multi-engine consensus ${SESSION} [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin develop/v20-integrated-decision-platform
            if git rebase origin/develop/v20-integrated-decision-platform && git push origin HEAD:develop/v20-integrated-decision-platform; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            [ "$attempt" = "3" ] && exit 1
            sleep $((attempt * 5))
          done

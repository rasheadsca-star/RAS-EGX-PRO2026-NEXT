name: Consensus Attribution V1
on:
  push:
    branches:
      - research/consensus-attribution-v1-20260828
    paths:
      - '.github/workflows/consensus-attribution-v1.yml'
      - 'gann-fusion-x/scripts/run-consensus-attribution-v1.cjs'
      - 'gann-fusion-x/scripts/analyze-consensus-attribution-v1.cjs'
      - 'scripts/research/**'
      - 'gann-fusion-x/engine/**'
      - 'gann-fusion-x/scripts/backtest-consensus-pipeline-v1.cjs'
      - 'gann-fusion-x/scripts/run-consensus-v16-quality-gate-v2.cjs'
      - 'data/history/**'

jobs:
  attribution:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/research/consensus-v16-qualified-walkforward.py
          python -m py_compile scripts/research/apply-v16-quality-gate-v2.py
          node --check gann-fusion-x/scripts/run-consensus-v16-quality-gate-v2.cjs
          node --check gann-fusion-x/scripts/run-consensus-attribution-v1.cjs
          node --check gann-fusion-x/scripts/analyze-consensus-attribution-v1.cjs

      - name: Build strict V16 walk-forward with locked data-availability warmup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/research/consensus-v16-qualified-walkforward.py')
          s=p.read_text(encoding='utf-8')
          old='WARMUP_SESSIONS = 20'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one V16 warmup constant')
          p.write_text(s.replace(old,'WARMUP_SESSIONS = 11'),encoding='utf-8')
          PY
          python scripts/research/consensus-v16-qualified-walkforward.py

      - name: Apply locked V16 Quality Gate V2
        run: python scripts/research/apply-v16-quality-gate-v2.py

      - name: Run locked V2 reference
        run: node gann-fusion-x/scripts/run-consensus-v16-quality-gate-v2.cjs

      - name: Run attribution baseline and candidate ledger
        run: node gann-fusion-x/scripts/run-consensus-attribution-v1.cjs

      - name: Prove attribution runner changed no financial result
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const locked=JSON.parse(fs.readFileSync('gann-fusion-x/data/consensus-v16-quality-gate-v2-backtest.json','utf8'));
          const diag=JSON.parse(fs.readFileSync('gann-fusion-x/data/consensus-attribution-v1-baseline.json','utf8'));
          const pick=x=>({dates:x.dates,regimeCounts:x.regimeCounts,actionCounts:x.actionCounts,intersectionCounts:x.intersectionCounts,summary60:x.summary60,summaryFirst30:x.summaryFirst30,summaryLast30:x.summaryLast30,commonLive:x.commonLive,acceptance:x.acceptance});
          if(JSON.stringify(pick(locked))!==JSON.stringify(pick(diag))) throw new Error('ATTRIBUTION_RUNNER_CHANGED_LOCKED_RESULT');
          console.log('Locked financial outputs are byte-equivalent after removing metadata/schema differences.');
          NODE

      - name: Analyze attribution
        run: node gann-fusion-x/scripts/analyze-consensus-attribution-v1.cjs

      - name: Assert integrity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('gann-fusion-x/data/consensus-attribution-v1-trades.json','utf8'));
          if(x.dates.length!==60) throw new Error(`EXPECTED_60_GOT_${x.dates.length}`);
          if(x.trades.length!==447) throw new Error(`EXPECTED_447_GOT_${x.trades.length}`);
          const keys=new Set(x.trades.map(r=>`${r.date}|${r.ticker}`));
          if(keys.size!==447) throw new Error(`DUPLICATES_${447-keys.size}`);
          const required=['v16Rank','sepaRank','gannAvailable','regime','gateAction','sizeMultiplier','finalStatus'];
          const missing=x.trades.filter(r=>required.some(k=>r[k]===undefined||r[k]===null));
          if(missing.length) throw new Error(`MISSING_${missing.length}`);
          console.log({sessions:60,candidates:447,duplicates:0,missing:0});
          NODE

      - name: Show evidence
        run: cat gann-fusion-x/data/consensus-attribution-v1-evidence.md

      - name: Upload attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: consensus-attribution-v1
          path: |
            data/research/consensus-v16-qualified-walkforward.json
            gann-fusion-x/data/consensus-v16-quality-gate-v2-backtest.json
            gann-fusion-x/data/consensus-v16-quality-gate-v2-backtest.md
            gann-fusion-x/data/consensus-attribution-v1-baseline.json
            gann-fusion-x/data/consensus-attribution-v1-baseline.md
            gann-fusion-x/data/consensus-attribution-v1-trades.json
            gann-fusion-x/data/consensus-attribution-v1-evidence.json
            gann-fusion-x/data/consensus-attribution-v1-evidence.md
          retention-days: 14

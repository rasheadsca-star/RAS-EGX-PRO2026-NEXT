name: Astra Professional Analytics Certification

on:
  push:
    branches:
      - feature/astra-professional-analytics-20260921
    paths:
      - 'astra-prod/app/**'
      - 'tests/astra/**'
      - '.github/workflows/astra-professional-analytics-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-professional-analytics-certification
  cancel-in-progress: true

env:
  BASE_HEAD: 0c66c95afb4a18cb8d27e9ba0b467ed27fcb4afc
  FROZEN_BRANCH: frozen/production-20260921-0c66c95a

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert isolated feature lineage and immutable decision truth
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/astra-professional-analytics-20260921"
          git fetch origin "refs/heads/$FROZEN_BRANCH:refs/remotes/origin/$FROZEN_BRANCH"
          test "$(git rev-parse "origin/$FROZEN_BRANCH")" = "$BASE_HEAD"
          test "$(git merge-base "$BASE_HEAD" HEAD)" = "$BASE_HEAD"
          git diff --exit-code "$BASE_HEAD"...HEAD --             astra-prod/app/data.json             astra-prod/app/intelligence/recommendation-ledger.json             astra-prod/app/intelligence/recommendation-outcomes.json             astra-prod/app/intelligence/performance-summary.json             data/ops/g22-main-app-handoff.json             04_ACCEPTANCE_GATES.json             05_WORK_STATE.json
          echo "FEATURE_DECISION_TRUTH_IMMUTABLE"

      - name: Syntax and external-runtime guards
        shell: bash
        run: |
          set -euo pipefail
          node --check astra-prod/app/astra-professional-analytics.js
          node --check tests/astra/astra-native-browser-smoke.cjs
          node --check tests/astra/astra-developer-critic-review.cjs
          ! grep -Eiq 'fetch\([^)]*https?://|<script[^>]+src=["'\'' ]*https?://' astra-prod/app/astra-professional-analytics.js
          echo "PRO_ANALYTICS_STATIC_GUARDS_PASS"

      - name: Core Astra-native regression
        run: node --test tests/astra/astra-native-intelligence.test.cjs

      - name: Ten Developer Critic cycles
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 10); do
            echo "=== Professional Analytics Critic $cycle/10 ==="
            node tests/astra/astra-developer-critic-review.cjs --cycle "$cycle"
          done

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "CHROME_BIN=$BROWSER" >> "$GITHUB_ENV"
          "$BROWSER" --version

      - name: Install Playwright Core
        run: npm install --no-save --ignore-scripts --no-package-lock playwright-core@1.55.0

      - name: Six-profile professional UI certification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/astra-pro-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:4173/astra-prod/app/index.html >/dev/null && break
            sleep 1
          done
          ASTRA_DEV_BASE=http://127.0.0.1:4173 node tests/astra/astra-native-browser-smoke.cjs

      - name: Final immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_HEAD"...HEAD --             astra-prod/app/data.json             astra-prod/app/intelligence/recommendation-ledger.json             astra-prod/app/intelligence/recommendation-outcomes.json             astra-prod/app/intelligence/performance-summary.json             data/ops/g22-main-app-handoff.json
          test "$(git rev-parse "origin/$FROZEN_BRANCH")" = "$BASE_HEAD"
          echo "PRO_ANALYTICS_CERTIFIED_HEAD=$GITHUB_SHA"

name: MAIN APP — Execution Grade Reconcile

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main-app-execution-grade-reconcile.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: egx-main-app-v1692-p2-canonical
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest MAIN APP
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate reconciliation scripts
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-source-session-quorum.cjs
          node --check scripts/stable/v16-v169-live-resolution-normalizer.cjs
          node --check scripts/stable/v16-main-app-professional-readiness.cjs

      - name: Reconcile source-session quorum only
        run: |
          set -euo pipefail
          node scripts/stable/v16-source-session-quorum.cjs

      - name: Normalize live ledger after latest scan
        run: |
          set -euo pipefail
          node scripts/stable/v16-v169-live-resolution-normalizer.cjs

      - name: Rebuild Professional Readiness V2
        run: |
          set -euo pipefail
          node scripts/stable/v16-main-app-professional-readiness.cjs

      - name: Require coherent Execution Grade state
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const read = f => JSON.parse(fs.readFileSync(f, 'utf8'));
          const price = read('data/stable/v15-price-truth.json');
          const quorum = read('data/stable/v16-source-session-quorum-report.json');
          const live = read('data/stable/v16-v169-live-evaluation.json');
          const readiness = read('data/stable/v16-main-app-professional-readiness.json');
          const dataAxis = (readiness.axes || []).find(x => x.id === 'DATA_SESSION_INTEGRITY') || {};
          const liveAxis = (readiness.axes || []).find(x => x.id === 'V169_LIVE_FORWARD') || {};
          if (price.executionGrade !== true || price.ready !== true) throw new Error('Price Truth is not Execution Grade');
          if (quorum.quorumPassed !== true) throw new Error('Source-session quorum is not coherent/passed');
          if (dataAxis?.details?.currentExecutionGrade !== true) throw new Error('Readiness did not consume current Execution Grade');
          if (Number(live?.summary?.resolvedSessions || 0) < 8) throw new Error('Live ledger regression: expected normalized resolved sessions >= 8');
          if (Number(liveAxis?.details?.resolvedSessions || 0) !== Number(live?.summary?.resolvedSessions || 0)) throw new Error('Readiness/live-ledger session mismatch');
          console.log({
            executionGrade: price.executionGrade,
            verifiedExpectedSessionRows: price?.source?.verifiedExpectedSessionRows,
            sourceCoveragePct: price?.source?.sourceSessionEvidenceCoveragePct,
            acceptedRows: price.acceptedRows,
            quorumPassed: quorum.quorumPassed,
            quorumMode: quorum.mode,
            resolvedSessions: live?.summary?.resolvedSessions,
            readiness: readiness.professionalReadinessScore,
            foundation: readiness.foundationQualityScore,
            hardBlockers: (readiness.hardBlockers || []).map(x => x.code)
          });
          NODE

      - name: Commit coherent governance state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/stable/v16-source-session-quorum-report.json data/stable/v16-v169-live-evaluation.json data/stable/v16-main-app-professional-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile MAIN APP Execution Grade governance state"
            # Quorum/company-name guards may touch auxiliary working files. The
            # intended governance outputs are already committed above; discard
            # any unstaged generated leftovers before rebasing/pushing.
            git reset --hard HEAD
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run static.yml --repo "$GITHUB_REPOSITORY" --ref main

# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    # Rebuild research snapshots from latest committed session, including late revisions.
    - cron: '15 12-21 * * 0-5'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Pages secret guard
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .project-config.json
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env is forbidden from Pages"
            exit 1
          fi
          echo "PAGES_SECRET_GUARD_PASS"

      - name: Validate MAIN APP P2 deep portfolio bundle
        run: |
          set -euo pipefail
          node --check preview-v16/app/p2-portfolio-deep.js
          node --check preview-v16/app/launch.js
          grep -q "p2-portfolio-deep.js" preview-v16/app/launch.js
          grep -q "P2 Deep Portfolio Engine" preview-v16/app/p2-portfolio-deep.js
          grep -q "p2-portfolio-deep.js" preview-v16/app/v169-p2.html
          grep -q "id=\"p2PortfolioDeep\"" preview-v16/app/v169-p2.html
          grep -q "جارٍ تشغيل P2 Deep Portfolio Engine" preview-v16/app/v169-p2.html
          echo "P2_DEEP_PORTFOLIO_DIRECT_INTEGRATION_PASS"

      - name: Setup Node for SEPA-X
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate vendored SEPA-X
        working-directory: astra/vendor/sepa-x
        run: npm test

      - name: Build SEPA-X static Pages snapshot
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/sepax"
          node "$GITHUB_WORKSPACE/astra/vendor/sepa-x/scripts/build-github-pages.mjs" "$GITHUB_WORKSPACE/sepax"
          test -f "$GITHUB_WORKSPACE/sepax/index.html"
          test -f "$GITHUB_WORKSPACE/sepax/scan/index.html"
          test -f "$GITHUB_WORKSPACE/sepax/pages-manifest.json"
          node -e "const m=require('./sepax/pages-manifest.json'); if(!m.symbols||m.symbols<1) process.exit(1); console.log('SEPA_X_PAGES_BUILD_PASS',m.symbols,m.scanGeneratedAt)"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate and build trend breakout divergence signals
        run: |
          node --test tests/trend-divergence.test.cjs
          node scripts/research/build-trend-divergence.cjs

      - name: Validate independent paper and rendered MVP safety
        run: |
          set -euo pipefail
          node --check scripts/independent/egx-independent-paper.cjs
          node --test tests/independent/*.test.cjs tests/research/egx-unified-console.test.cjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire tracked working tree plus the generated /sepax static snapshot.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live V16.9 public routes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base=os.environ['PUBLIC_URL'].rstrip('/')
          routes={
            '/preview-v16/app/v169.html':'EGX Pro V16.9',
            '/preview-v16/app/index.html':'EGX Pro Professional',
            '/preview-v16/app/launch.js':None,
            '/preview-v16/app/app.js':None,
            '/preview-v16/app/styles.css':None
          }
          for attempt in range(1, 13):
              try:
                  for route,marker in routes.items():
                      url=base+route+'?release='+os.environ.get('GITHUB_SHA','')[:12]
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}), timeout=25) as response:
                          if response.status!=200:
                              raise RuntimeError(f'{route}: HTTP {response.status}')
                          body=response.read().decode('utf-8')
                          if marker and marker not in body:
                              raise RuntimeError(f'{route}: expected app identifier missing')
                  print('V16.9 LIVE ROUTES VERIFIED',base,flush=True)
                  break
              except Exception as exc:
                  print(f'V16.9 URL attempt {attempt}/12 failed: {exc}',flush=True)
                  if attempt==12: raise
                  time.sleep(10)
          PY

      - name: Verify live independent paper archive and ledger routes
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PUBLIC_URL'].rstrip('/')
          release = os.environ.get('GITHUB_SHA', '')[:12]
          def get(route):
              url = base + route + '?release=' + release
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      raise RuntimeError(f'{route}: HTTP {response.status}')
                  return response.read().decode('utf-8')
          for attempt in range(1, 13):
              try:
                  html = get('/unified-console/index.html')
                  assert 'independent-last-verified.json' in html
                  assert 'independent-paper-ledger.json' in html
                  assert 'id="archivedPriceResults"' in html
                  assert 'id="independentBlockers"' in html
                  assert 'شموع OHLCV غير موثقة أو معاد بناؤها' in html
                  assert 'جلسة الأسعار المستهدفة — لا تعني الاعتماد' in html
                  assert 'أرشيف فقط — ليس سعر اليوم ولا إشارة دخول' in html
                  current = json.loads(get('/unified-console/independent-paper.json'))
                  archive = json.loads(get('/unified-console/independent-last-verified.json'))
                  ledger = json.loads(get('/unified-console/independent-paper-ledger.json'))
                  assert current['mode'] == 'PAPER_ONLY' and current['executable'] is False
                  assert current['recommendations'] == []
                  assert archive['mode'] == 'PAPER_ONLY' and archive['executable'] is False
                  assert archive['status'] == 'ARCHIVED_DATED_EVIDENCE_NOT_CURRENT_SIGNAL'
                  assert archive['orders'] == [] and archive['recommendations'] == []
                  assert ledger['mode'] == 'PAPER_ONLY' and ledger['executable'] is False
                  assert ledger['orders'] == []
                  rows = ledger['observations']
                  assert len(rows) == len({(r['session'], r['ticker']) for r in rows})
                  for r in archive['datedPriceObservations']:
                      assert any(x['session'] == r['session'] and x['ticker'] == r['ticker'] and
                                 x['close'] == r['close'] for x in rows)
                  print('INDEPENDENT_PAPER_LIVE_E2E_PASS', archive['session'],
                        len(archive['datedPriceObservations']), len(rows), 'orders=0', flush=True)
                  break
              except Exception as exc:
                  print(f'INDEPENDENT_PAPER_LIVE_E2E attempt {attempt}/12: {exc}', flush=True)
                  if attempt == 12:
                      raise
                  time.sleep(10)
          PY

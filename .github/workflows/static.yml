# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Pages secret guard
        run: |
          set -euo pipefail
          test ! -e .env
          test ! -e .project-config.json
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "Tracked .env is forbidden from Pages"
            exit 1
          fi
          echo "PAGES_SECRET_GUARD_PASS"

      - name: Validate MAIN APP P2 deep portfolio bundle
        run: |
          set -euo pipefail
          node --check preview-v16/app/p2-portfolio-deep.js
          node --check preview-v16/app/launch.js
          grep -q "p2-portfolio-deep.js" preview-v16/app/launch.js
          grep -q "P2 Deep Portfolio Engine" preview-v16/app/p2-portfolio-deep.js
          grep -q "p2-portfolio-deep.js" preview-v16/app/v169-p2.html
          grep -q "id=\"p2PortfolioDeep\"" preview-v16/app/v169-p2.html
          grep -q "جارٍ تشغيل P2 Deep Portfolio Engine" preview-v16/app/v169-p2.html
          echo "P2_DEEP_PORTFOLIO_DIRECT_INTEGRATION_PASS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire tracked working tree only after the sensitive-file guard passes.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: V16.9.2 Pre-Close Rescan Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v169-preclose-rescan.yml"
  schedule:
    # Candidate runs around 14:15 Africa/Cairo across UTC+2 / UTC+3 seasons.
    # GitHub schedules can start a few minutes late; the Cairo gate below accepts
    # a bounded window and the completion lock prevents duplicate successful runs.
    - cron: "12,15,18,21 11,12 * * 0-4"

permissions:
  actions: write
  contents: write

concurrency:
  group: egx-v1692-preclose-orchestrator
  cancel-in-progress: false

jobs:
  preclose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve resilient Cairo T-15 gate
        id: clock
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${GITHUB_EVENT_NAME}"
          DOW=$(TZ=Africa/Cairo date '+%w')
          HOUR=$(TZ=Africa/Cairo date '+%H')
          MINUTE=$(TZ=Africa/Cairo date '+%M')
          NOW_MIN=$((10#$HOUR * 60 + 10#$MINUTE))
          RUN=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "$DOW" -le 4 ] && [ "$EVENT" = "schedule" ] && [ "$NOW_MIN" -ge 852 ] && [ "$NOW_MIN" -le 864 ]; then
            RUN=true
          elif [ "$DOW" -le 4 ] && [ "$EVENT" = "push" ] && [ "$NOW_MIN" -ge 850 ] && [ "$NOW_MIN" -le 900 ]; then
            RUN=true
          fi

          echo "Cairo pre-close gate: $(TZ=Africa/Cairo date '+%Y-%m-%d %H:%M:%S %Z') event=$EVENT run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout latest MAIN APP state
        if: steps.clock.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce one completed pre-close cycle per session
        if: steps.clock.outputs.run == 'true'
        id: once
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Africa/Cairo date '+%Y-%m-%d')
          DONE=false
          if [ -s data/stable/v169-preclose-status.json ]; then
            DONE=$(TODAY="$TODAY" node - <<'NODE'
          const fs=require('fs');
          try {
            const x=JSON.parse(fs.readFileSync('data/stable/v169-preclose-status.json','utf8'));
            process.stdout.write(String(x.sessionDate===process.env.TODAY && x.status==='COMPLETED'));
          } catch { process.stdout.write('false'); }
          NODE
            )
          fi
          if [ "$DONE" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Pre-close LS1 cycle already completed for $TODAY."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch LS1 intraday pre-close scan
        if: steps.clock.outputs.run == 'true' && steps.once.outputs.run == 'true'
        id: ls1_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run main-app-intraday-ls1.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched the existing LS1 intraday engine. Frozen V16.9 selection remains untouched."

      - name: Wait for LS1 pre-close result and Pages publication
        if: steps.clock.outputs.run == 'true' && steps.once.outputs.run == 'true'
        id: ls1_wait
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED_AT: ${{ steps.ls1_dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow main-app-intraday-ls1.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,createdAt,status \
              --jq ".[] | select(.createdAt >= \"$STARTED_AT\") | .databaseId" | head -n 1)
            [ -n "$RUN_ID" ] && break
            sleep 4
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not resolve the LS1 pre-close run." >&2
            exit 1
          fi
          echo "ls1_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify same-day LS1 result exists even when signal count is zero
        if: steps.clock.outputs.run == 'true' && steps.once.outputs.run == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          TODAY=$(TZ=Africa/Cairo date '+%Y-%m-%d')
          TODAY="$TODAY" node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/stable/v16-ls1-late-session-opportunities.json','utf8'));
          if(x.cairoDate!==process.env.TODAY) throw new Error(`LS1 result is stale: ${x.cairoDate} != ${process.env.TODAY}`);
          if(x.modelId!=='V16_9_LATE_SESSION_OPPORTUNITY_LS1') throw new Error(`Unexpected LS1 model: ${x.modelId}`);
          if(x.methodologyFrozen!==true||x.productionV169MethodologyModified!==false) throw new Error('LS1/V16.9 methodology isolation drift');
          const active=Number(x.activeSignalCount||0);
          const signals=Array.isArray(x.signals)?x.signals:[];
          const watch=Array.isArray(x.watchTop)?x.watchTop:[];
          console.log(JSON.stringify({ok:true,cairoDate:x.cairoDate,cairoTime:x.cairoTime,phase:x.phase,status:x.status,activeSignalCount:active,signalTickers:signals.filter(r=>r?.eligible===true||r?.active===true||r?.executionEligible===true).map(r=>r.ticker),watchTickers:watch.slice(0,3).map(r=>r.ticker),evidenceBlockers:x.evidenceBlockers||[]},null,2));
          NODE

      - name: Persist completed pre-close LS1 status
        if: steps.clock.outputs.run == 'true' && steps.once.outputs.run == 'true'
        env:
          LS1_RUN_ID: ${{ steps.ls1_wait.outputs.ls1_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('data/stable/v16-ls1-late-session-opportunities.json','utf8'));
          const signals=(Array.isArray(x.signals)?x.signals:[]).filter(r=>r?.eligible===true||r?.active===true||r?.executionEligible===true);
          const watch=Array.isArray(x.watchTop)?x.watchTop:[];
          const out={
            schemaVersion:'16.9.2-preclose-status-3',
            generatedAt:new Date().toISOString(),
            cairoCompletedAt:new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Cairo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()),
            sessionDate:x.cairoDate,
            status:'COMPLETED',
            layer:'LS1_INTRADAY_PRE_CLOSE',
            phase:x.phase||null,
            ls1Status:x.status||null,
            activeSignalCount:Number(x.activeSignalCount||signals.length||0),
            recommendationTickers:signals.map(r=>r.ticker),
            watchTickers:watch.slice(0,3).map(r=>r.ticker),
            evidenceBlockers:Array.isArray(x.evidenceBlockers)?x.evidenceBlockers:[],
            runIds:{ls1:process.env.LS1_RUN_ID||null},
            governance:{productionV169MethodologyModified:false,selectionTechniqueChanged:false,scoringChanged:false,rankingChanged:false,weightsChanged:false,riskGatesChanged:false,formalBasketPublicationRequiredAtPreclose:false}
          };
          fs.writeFileSync('data/stable/v169-preclose-status.json',JSON.stringify(out,null,2)+'\n');
          console.log(out);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stable/v169-preclose-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record completed V16.9 LS1 pre-close cycle"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 6))
            done
          fi

      - name: Confirm pre-close contract
        if: steps.clock.outputs.run == 'true' && steps.once.outputs.run == 'true'
        shell: bash
        run: |
          echo "Pre-close contract completed:"
          echo "1) LS1 refreshed the intraday market snapshot and evaluated the 14:15 tactical layer."
          echo "2) Zero eligible signals is a valid completed result and is surfaced explicitly in MAIN APP."
          echo "3) Monitoring-only watch candidates remain clearly separated from executable recommendations."
          echo "4) The frozen V16.9 formal basket is not forced before the market session is completed/verified."
          echo "5) No recommendation scoring, ranking, weights, filters, or risk gates were modified by this workflow."

name: SEPA-X Isolated CI and Market Scan

on:
  push:
    branches:
      - develop/sepax-isolated-v1
    paths:
      - 'sepa-x/**'
      - '.github/workflows/sepax-isolated-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 0-4'

permissions:
  contents: write

concurrency:
  group: sepax-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-scan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: develop/sepax-isolated-v1
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frozen RC2 files are untouched by branch diff
        shell: bash
        run: |
          RC2_BASE="66b2ac2bc63fe144d5d30d3d304350a6c0d04da9"
          git fetch origin "$RC2_BASE" --depth=1
          git cat-file -e "$RC2_BASE^{commit}"
          git cat-file -e "HEAD^{commit}"
          CHANGED="$(git diff --name-only "$RC2_BASE" HEAD)"
          BAD="$(printf '%s\n' "$CHANGED" | grep '^tfe-v20/' || true)"
          if [ -n "$BAD" ]; then
            echo "RC2_MUTATION_DETECTED"
            echo "$BAD"
            exit 1
          fi
          echo "RC2_FROZEN_DIFF_PASS"

      - name: Verify API and browser JavaScript syntax
        working-directory: sepa-x
        run: |
          node --check api/index.js
          node --check public/app.js

      - name: Run unit, golden, isolation and integration tests
        working-directory: sepa-x
        run: npm test

      - name: Run real full-market scan
        working-directory: sepa-x
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npm run scan

      - name: Track FULL_STRUCTURE V3 prospective shadow
        working-directory: sepa-x
        run: node scripts/forward-shadow-v3.mjs

      - name: Run acceptance gates
        working-directory: sepa-x
        run: npm run acceptance

      - name: Commit real scan evidence only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sepa-x/data/current-scan.json sepa-x/data/recommendation-history.json sepa-x/data/engine-errors.json sepa-x/data/state-transitions.json sepa-x/data/research/full-structure-v3-forward.json
          if git diff --cached --quiet; then
            echo "No scan evidence changes to commit."
          else
            git commit -m "chore(sepa-x): refresh real market scan [skip ci]"
            git fetch origin develop/sepax-isolated-v1
            if ! git rebase origin/develop/sepax-isolated-v1; then
              git rebase --abort || true
              echo "A newer branch state conflicts with this generated scan. Skipping stale scan push."
              exit 0
            fi
            git push origin HEAD:develop/sepax-isolated-v1
          fi

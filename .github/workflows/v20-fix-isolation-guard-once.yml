name: V20 Fix Isolation Guard Once

on:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-fix-isolation-guard-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop/v20-integrated-decision-platform
          fetch-depth: 0
      - name: Replace brittle branch-head isolation with merge-base isolation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/v20-v17-centric-clean-v5.yml')
          s=p.read_text()
          s=s.replace('''      - name: Checkout V20\n        uses: actions/checkout@v6\n        with:\n          fetch-depth: 1\n''','''      - name: Checkout V20\n        uses: actions/checkout@v6\n        with:\n          fetch-depth: 0\n''',1)
          old='''          git fetch --no-tags --depth=1 origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt\n          changed="$(git diff --name-only --diff-filter=ACMRTUXB origin/v19-egx-chat-gpt HEAD)"\n          violations="$(printf '%s\\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\\.github/workflows/v20-integrated-decision-platform\\.yml$|\\.github/workflows/v20-market-regime\\.yml$|\\.github/workflows/v20-primary-entry-point-acceptance\\.yml$|\\.github/workflows/v20-v17-centric-clean[^/]*\\.yml$)' || true)"\n          test -z "$violations" || { echo "V20 isolation violation:"; echo "$violations"; exit 1; }\n          tracked_v19="$(git ls-files 'data/v19/**' '.github/workflows/v19-egx-chat-gpt.yml' || true)"\n          test -z "$tracked_v19" || { echo "V20 must not track V19-owned files:"; echo "$tracked_v19"; exit 1; }\n'''
          new='''          git fetch --no-tags origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt\n          merge_base="$(git merge-base origin/v19-egx-chat-gpt HEAD)"\n          test -n "$merge_base" || { echo "Unable to resolve V19/V20 merge base"; exit 1; }\n          changed="$(git diff --name-only "$merge_base" HEAD)"\n          violations="$(printf '%s\\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\\.github/workflows/v20-integrated-decision-platform\\.yml$|\\.github/workflows/v20-market-regime\\.yml$|\\.github/workflows/v20-primary-entry-point-acceptance\\.yml$|\\.github/workflows/v20-v17-centric-clean[^/]*\\.yml$)' || true)"\n          test -z "$violations" || { echo "V20 isolation violation since merge-base $merge_base:"; echo "$violations"; exit 1; }\n'''
          if old not in s:
              raise SystemExit('Expected isolation block not found; refusing blind edit')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/v20-fix-isolation-guard-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/v20-v17-centric-clean-v5.yml .github/workflows/v20-fix-isolation-guard-once.yml
          git commit -m "Use merge-base for V20 isolation guard [skip ci]"
          git push origin HEAD:develop/v20-integrated-decision-platform

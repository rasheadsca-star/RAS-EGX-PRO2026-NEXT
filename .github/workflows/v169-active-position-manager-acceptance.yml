name: V16.9.2 Active Position Manager Acceptance

on:
  pull_request:
    paths:
      - "scripts/stable/v16-active-position-manager.cjs"
      - "data/stable/v16-active-position-manager-policy.json"
      - "preview-v16/app/v16-9-active-position-manager.js"
      - "preview-v16/app/v16-9-position-advisory-core.js"
      - "preview-v16/app/decision-source.js"
      - ".github/workflows/main-app-intraday-ls1.yml"
      - ".github/workflows/v169-active-position-manager-acceptance.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate syntax and policy
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-active-position-manager.cjs
          node --check preview-v16/app/v16-9-active-position-manager.js
          node --check preview-v16/app/v16-9-position-advisory-core.js
          node --check preview-v16/app/decision-source.js
          node -e "JSON.parse(require('fs').readFileSync('data/stable/v16-active-position-manager-policy.json','utf8')); console.log('policy ok')"

      - name: Build manager from current canonical evidence
        run: node scripts/stable/v16-active-position-manager.cjs

      - name: Assert post-selection management contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const out=JSON.parse(fs.readFileSync('data/stable/v16-active-position-manager.json','utf8'));
          const current=JSON.parse(fs.readFileSync('data/stable/v16-main-app-current.json','utf8'));
          const expected=(current.recommendations||[]).map(x=>x.ticker);
          const actual=(out.recommendations||[]).map(x=>x.ticker);
          const checks={
            sameRecommendationCount:actual.length===expected.length,
            sameRecommendationOrder:JSON.stringify(actual)===JSON.stringify(expected),
            postSelectionOnly:out.governance?.postSelectionOnly===true,
            noSelectionChange:out.governance?.changesRecommendationSelection===false,
            noRankingChange:out.governance?.changesRanking===false,
            noWeightChange:out.governance?.changesWeights===false,
            noRiskGateChange:out.governance?.changesRiskGates===false,
            noAutomaticOrders:out.governance?.automaticOrders===false,
            targetIsNotSilentLongTerm:out.interpretation?.repeatedAfterTarget==='NEW_CYCLE_NOT_AUTOMATIC_LONG_TERM',
            localPortfolioOnly:out.portfolioPersonalization?.localOnly===true,
            fiveMinuteCadence:out.refreshIntervalMinutes===5,
            allRowsHaveActions:(out.recommendations||[]).every(r=>r.action?.code && r.action?.automaticOrder===false),
            currentMarketSessionContract:out.sessionContract?.managementSessionIsCurrentMarketSession===true,
            signalAndManagementSeparated:out.sessionContract?.nextSessionMayDifferFromSignalDate===true,
          };
          console.log({expected,actual,checks});
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE

      - name: Prove next-session prices are managed against the market session not signal date
        run: |
          set -euo pipefail
          cp data/market.json /tmp/position-market.json
          cp data/stable/v16-ls1-late-session-opportunities.json /tmp/position-ls1.json
          node - <<'NODE'
          const fs=require('fs');
          const current=JSON.parse(fs.readFileSync('data/stable/v16-main-app-current.json','utf8'));
          const market=JSON.parse(fs.readFileSync('data/market.json','utf8'));
          const ls1=JSON.parse(fs.readFileSync('data/stable/v16-ls1-late-session-opportunities.json','utf8'));
          const first=(current.recommendations||[])[0];
          if(!first?.ticker) throw new Error('No current recommendation for synthetic next-session test');
          const mid=(Number(first.entryLow)+Number(first.entryHigh))/2;
          let matched=0;
          for(const row of market.rows||[]){
            const ticker=String(row.ticker||row.symbol||'').toUpperCase();
            if(ticker!==String(first.ticker).toUpperCase()) continue;
            row.price=mid; row.last=mid; row.open=mid; row.high=mid; row.low=mid;
            row.sourceSessionDate='2099-01-02'; row.marketSessionDate='2099-01-02';
            row.updatedAt='2099-01-02T10:00:00.000Z';
            matched++;
          }
          if(!matched) throw new Error(`Ticker ${first.ticker} not found in market rows`);
          ls1.evidence={...(ls1.evidence||{}),intradaySnapshotCairoDate:'2099-01-02'};
          fs.writeFileSync('data/market.json',JSON.stringify(market,null,2)+'\n');
          fs.writeFileSync('data/stable/v16-ls1-late-session-opportunities.json',JSON.stringify(ls1,null,2)+'\n');
          NODE
          EGX_POSITION_MANAGER_SESSION_DATE=2099-01-02 node scripts/stable/v16-active-position-manager.cjs
          node - <<'NODE'
          const fs=require('fs');
          const out=JSON.parse(fs.readFileSync('data/stable/v16-active-position-manager.json','utf8'));
          const first=(out.recommendations||[])[0];
          const checks={
            signalDateRemainsOriginal:out.signalDate!=='2099-01-02',
            managementSessionIsNextSession:out.managementSessionDate==='2099-01-02',
            tickerSessionVerified:first?.market?.sessionVerified===true,
            notBlockedByOldSignalDate:first?.action?.code!=='WAIT_DATA',
            validationMode:first?.market?.sessionValidationMode==='CURRENT_MARKET_SESSION_NOT_SIGNAL_DATE',
          };
          console.log({ticker:first?.ticker,action:first?.action?.code,checks});
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE
          mv /tmp/position-market.json data/market.json
          mv /tmp/position-ls1.json data/stable/v16-ls1-late-session-opportunities.json

      - name: Verify five-minute backend and live advisory vocabulary
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const workflow=fs.readFileSync('.github/workflows/main-app-intraday-ls1.yml','utf8');
          const ui=fs.readFileSync('preview-v16/app/v16-9-active-position-manager.js','utf8');
          const core=fs.readFileSync('preview-v16/app/v16-9-position-advisory-core.js','utf8');
          const policy=JSON.parse(fs.readFileSync('data/stable/v16-active-position-manager-policy.json','utf8'));
          const checks={
            backendFiveMinuteCadence:workflow.includes('*/5 7-12 * * 0-4'),
            clientFiveMinuteCadence:/REFRESH_MS = 5 \* 60 \* 1000/.test(ui),
            workflowBuildsManager:workflow.includes('v16-active-position-manager.cjs'),
            workflowPublishesManager:workflow.includes('v16-active-position-manager.json'),
            canonicalPortfolioKey:ui.includes("CANONICAL_PORTFOLIO_KEY = 'egx-v16-professional-portfolio'"),
            legacyIsMigrationOnly:ui.includes("LEGACY_PORTFOLIO_KEY = 'egx-v137-portfolio'") && ui.includes('canonicalRaw===null'),
            sellExit:core.includes("code:'SELL_EXIT'") && core.includes('بيع / خروج'),
            partialNextTarget:core.includes("code:'PARTIAL_HOLD_NEXT'") && core.includes('جني جزئي'),
            holdToTarget:core.includes("code:'HOLD_TO_TARGET'") && core.includes('احتفظ وانتظر الهدف'),
            doNotChase:core.includes("code:'DO_NOT_CHASE'") && policy.actionCatalog?.DO_NOT_CHASE==='لا تطارد السعر',
            policyFiveMinute:policy.refreshIntervalMinutes===5,
            noAutoOrders:!(/automaticOrders\s*:\s*true/.test(ui+core)),
          };
          console.log(checks);
          if(Object.values(checks).some(v=>v!==true)) process.exit(1);
          NODE

      - name: Prove frozen recommendation selection is untouched
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch origin "$PR_BASE_SHA" --depth=1
          fi
          git diff --quiet "$PR_BASE_SHA" HEAD -- scripts/research/v16-v169-basket-engine.py
          git diff --quiet "$PR_BASE_SHA" HEAD -- scripts/stable/v16-publish-v169-basket.cjs
          git diff --quiet "$PR_BASE_SHA" HEAD -- scripts/stable/v16-session-data-fingerprint.cjs
          echo "PASS: frozen recommendation selection is unchanged relative to PR base $PR_BASE_SHA."

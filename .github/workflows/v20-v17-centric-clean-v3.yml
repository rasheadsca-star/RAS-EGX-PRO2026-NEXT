name: V20 V17-Centric Clean Architecture Validation V3

on:
  workflow_dispatch:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - "scripts/v20/**"
      - "docs/v20/**"
      - "data/v20/**"
      - "v20/**"
      - ".github/workflows/v20-v17-centric-clean-v3.yml"

permissions:
  contents: read

concurrency:
  group: egx-v20-v17-centric-clean-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decision-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout V20
        uses: actions/checkout@v6
        with: {fetch-depth: 1}
      - name: Enforce V20 isolation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "develop/v20-integrated-decision-platform"
          git fetch --no-tags --depth=1 origin v19-egx-chat-gpt:refs/remotes/origin/v19-egx-chat-gpt
          changed="$(git diff --name-only origin/v19-egx-chat-gpt HEAD)"
          violations="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/v20/|docs/v20/|data/v20/|v20/|\.github/workflows/v20-integrated-decision-platform\.yml$|\.github/workflows/v20-market-regime\.yml$|\.github/workflows/v20-v17-centric-clean(-v2|-v3)?\.yml$)' || true)"
          test -z "$violations" || { echo "$violations"; exit 1; }
      - name: Setup Node
        uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Sync authoritative V17 decision inputs read-only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin develop/v17-rebuild:refs/remotes/origin/develop/v17-rebuild
          V17_SHA="$(git rev-parse refs/remotes/origin/develop/v17-rebuild)"
          V17_DATE="$(git show -s --format=%cI "$V17_SHA")"
          paths=(data/market.json data/final-opportunity-ranking.json data/history.json data/recommendations.json data/technical-50-report.json data/v17/current.json data/v17/resilient-session-status.json data/v17/internal-ohlc-support-resistance.json data/v17/liquidity-gate.json data/v17/challenger-status.json data/v17/market-session-truth.json data/v17/regression.json data/v17/review.json data/v17/current-recommendation-base-status.json)
          for rel in "${paths[@]}"; do mkdir -p "$(dirname "$rel")"; git show "$V17_SHA:$rel" > "$rel"; node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$rel"; done
          V20_V17_RUNTIME_SOURCE_SHA="$V17_SHA" V20_V17_RUNTIME_SOURCE_DATE="$V17_DATE" node scripts/v20/validate-v17-runtime-sync.cjs
          node scripts/v20/validate-v17-decision-core-runtime.cjs
      - name: Verify checked-in algorithm sources and no self patching
        shell: bash
        run: |
          set -euo pipefail
          files=(scripts/v20/build-data-truth.cjs scripts/v20/build-integrated-decision-snapshot.cjs scripts/v20/build-trusted-technical-history.cjs scripts/v20/build-market-regime.cjs scripts/v20/build-market-explorer.cjs scripts/v20/build-full-market-native-technical.cjs scripts/v20/build-full-market-native-selection.cjs scripts/v20/build-native-explainability-v1.cjs scripts/v20/finalize-native-ranking-v1.cjs scripts/v20/build-native-model-freeze.cjs scripts/v20/build-native-current.cjs scripts/v20/build-v17-production-decision-core.cjs scripts/v20/build-final-decision-contract.cjs scripts/v20/build-funded-nav.cjs scripts/v20/archive-native-shadow.cjs scripts/v20/build-canonical-performance-evidence-registry.cjs scripts/v20/build-champion-challenger-registry.cjs scripts/v20/v17-centric-semantic-acceptance.cjs)
          for f in "${files[@]}"; do node --check "$f"; done
          for f in "${files[@]}"; do test -z "$(grep -nE 'require\(.*/apply-|execFileSync\([^\n]*apply-' "$f" || true)" || { echo "Runtime patch dependency: $f"; exit 1; }; done
      - name: Build Data Truth
        run: |
          node scripts/v20/build-data-truth.cjs
          node scripts/v20/data-quality-regression.cjs
          node scripts/v20/build-sector-provenance-audit.cjs
      - name: Build integrated base decision evidence
        run: |
          node scripts/v20/build-integrated-decision-snapshot.cjs
          node scripts/v20/enrich-risk-reward.cjs
          node scripts/v20/validate-trade-plans.cjs
          node scripts/v20/build-portfolio-risk.cjs
      - name: Build trusted technical evidence
        env: {V20_HISTORY_NETWORK_REFRESH: "true", V20_HISTORY_CONCURRENCY: "4", V20_HISTORY_CURRENT_PRICE_TOLERANCE_PCT: "5"}
        run: |
          node scripts/v20/build-trusted-technical-history.cjs
          node scripts/v20/technical-history-regression.cjs
          node scripts/v20/build-stock-profiles.cjs
          node scripts/v20/sector-provenance-regression.cjs
      - name: Build Market Regime research context
        run: |
          node scripts/v20/build-market-regime.cjs
          node scripts/v20/market-regime-unit.cjs
          node scripts/v20/market-regime-regression.cjs
      - name: Build Full Market Explorer
        run: |
          node scripts/v20/build-market-explorer.cjs
          node scripts/v20/market-explorer-regression.cjs
      - name: Build Native Technical
        env: {V20_NATIVE_FULL_TECH_NETWORK_REFRESH: "true", V20_NATIVE_FULL_TECH_STARTA_FALLBACK: "true", V20_NATIVE_FULL_TECH_CONCURRENCY: "8", V20_NATIVE_FULL_TECH_RANGE: "6mo", V20_NATIVE_FULL_TECH_PRICE_TOLERANCE_PCT: "5"}
        run: node scripts/v20/build-full-market-native-technical.cjs
      - name: Build frozen Native V1 ranking
        run: |
          node scripts/v20/build-full-market-native-selection.cjs
          node scripts/v20/build-native-explainability-v1.cjs
          node scripts/v20/finalize-native-ranking-v1.cjs
          node scripts/v20/build-native-model-freeze.cjs
          node scripts/v20/build-native-current.cjs
          node scripts/v20/native-current-regression.cjs
      - name: Build V17 Eligibility
        run: node scripts/v20/build-v17-production-decision-core.cjs
      - name: Build Final Decision Contract
        run: |
          node scripts/v20/build-final-decision-contract.cjs
          node scripts/v20/set-precertification-product-status.cjs
      - name: Validate canonical trade decisions
        run: node scripts/v20/v17-centric-semantic-acceptance.cjs
      - name: Build Funded NAV
        run: |
          node scripts/v20/build-funded-nav.cjs
          node scripts/v20/funded-nav-regression.cjs
      - name: Archive Native Signals
        env: {V20_NATIVE_FORWARD_NETWORK_REFRESH: "true", V20_NATIVE_FORWARD_CONCURRENCY: "6"}
        run: node scripts/v20/archive-native-shadow.cjs
      - name: Resolve Forward Evidence
        run: node scripts/v20/native-shadow-forward-regression.cjs
      - name: Build Performance Evidence
        run: |
          node scripts/v20/build-canonical-performance-evidence-registry.cjs
          node scripts/v20/canonical-performance-evidence-regression.cjs
      - name: Champion Challenger Governance
        run: |
          node scripts/v20/build-champion-challenger-registry.cjs
          node scripts/v20/champion-challenger-regression.cjs
      - name: Clean architecture acceptance guard
        run: |
          node - <<'NODE'
          const sem=require('./data/v20/v17-centric-semantic-acceptance.json');
          const nav=require('./data/v20/funded-nav-regression.json');
          const fwd=require('./data/v20/signal-archive/native-shadow/regression.json');
          const perf=require('./data/v20/performance-evidence-regression.json');
          const gov=require('./data/v20/champion-challenger-regression.json');
          const d=require('./data/v20/final-decision-contract.json');
          const core=require('./data/v20/v17-production-decision-core.json');
          const registry=require('./data/v20/champion-challenger-registry.json');
          for (const [name,x] of Object.entries({semantic:sem,fundedNav:nav,forward:fwd,performance:perf,governance:gov})) if(x.ok!==true) throw Error(`${name} failed`);
          if(registry.activeChampion!=='V16_9_EQUAL_WEIGHT_BASKET'||registry.automaticPromotion!==false)throw Error('Champion governance drift');
          if(d.sessionStatus!=='EXECUTION_GRADE'&&(d.summary.productionActionableCount!==0||d.summary.productionNewExposurePct!==0))throw Error('Production leak under closed gate');
          console.log(JSON.stringify({ok:true,sessionDate:d.sessionDate,productStatus:d.productStatus,sessionStatus:d.sessionStatus,nativePublished:require('./data/v20/native-current.json').publishedCandidates.length,v17TechnicalSourceEligible:core.summary.technicalSourceEligibleCount,v17TechnicalProductionReady:core.summary.technicalProductionReadyCount,v17SrSourceEligible:core.summary.srSourceEligibleCount,v17SrProductionReady:core.summary.srProductionReadyCount,v17RecommendationEligible:core.summary.recommendationEligibleCount,actionable:d.summary.productionActionableCount,fundedNav:nav.evidence,nativeForward:fwd.evidence,activeChampion:registry.activeChampion},null,2));
          NODE

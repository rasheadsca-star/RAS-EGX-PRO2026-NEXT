name: EGX V16.6 Gate Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/research/v16-v166-gate-diagnostic.py"
      - ".github/workflows/v16-v166-gate-diagnostic.yml"
  push:
    paths:
      - "scripts/research/v16-v166-gate-diagnostic.py"
      - ".github/workflows/v16-v166-gate-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: egx-v16-v166-gate-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate diagnostic
        run: python -m py_compile scripts/research/v16-v166-gate-diagnostic.py
      - name: Run diagnostic
        run: python scripts/research/v16-v166-gate-diagnostic.py
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: v16-v166-gate-diagnostic
          path: data/research/v16-v166-gate-diagnostic.json

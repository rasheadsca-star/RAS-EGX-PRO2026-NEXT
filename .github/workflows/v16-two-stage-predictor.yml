name: EGX V16 Two-Stage Predictor

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/v16-two-stage-predictor.py"
      - ".github/workflows/v16-two-stage-predictor.yml"
      - "data/history/**"
      - "data/stable/v15-practical-decision.json"
  schedule:
    - cron: "0 13 * * 0-4"

permissions:
  contents: write

concurrency:
  group: egx-v16-two-stage-predictor
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate engine
        run: python -m py_compile scripts/research/v16-two-stage-predictor.py

      - name: Run prediction and execution stages
        run: python scripts/research/v16-two-stage-predictor.py

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/v16-two-stage-recommendations.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish V16 two-stage recommendations"
            for attempt in 1 2 3; do
              if git pull --rebase -X ours origin main && git push origin HEAD:main; then break; fi
              [ "$attempt" = "3" ] && exit 1
              sleep $((attempt * 8))
            done
          fi

name: RC2 UI Production Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rc2-ui-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: rc2-ui-production-deploy
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_FXiN7h7HXLs9fsZ0fCCc43FS
  VERCEL_PROJECT_ID: prj_gXmmVe1QqGFJ9nsv30uu0emLqIdY
  RC2_PRODUCTION_URL: https://egx-tfe-v20-fusion-rc2.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RC2 UI source
        uses: actions/checkout@v4
        with:
          ref: release/rc2-frozen
          fetch-depth: 1

      - name: Verify current-session UI separation patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q "هذه ليست توصيات اليوم" tfe-v20/public/session-monitor.js
          grep -q "لا توجد توصيات منشورة لجلسة" tfe-v20/public/ui-v169.js
          grep -q "view-evidence" tfe-v20/public/session-monitor.js
          cd tfe-v20
          npm test

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN missing"; exit 1; }

      - name: Deploy RC2 UI to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd tfe-v20
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify production UI and current scan
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          for i in 1 2 3 4 5 6; do
            html="$(curl -fsSL --max-time 30 "$RC2_PRODUCTION_URL/?t=$stamp" || true)"
            js="$(curl -fsSL --max-time 30 "$RC2_PRODUCTION_URL/ui-v169.js?t=$stamp" || true)"
            monitor="$(curl -fsSL --max-time 30 "$RC2_PRODUCTION_URL/session-monitor.js?t=$stamp" || true)"
            scan="$(curl -fsSL --max-time 180 "$RC2_PRODUCTION_URL/api/index?route=scan&limit=50&t=$stamp" || true)"
            if grep -q "لا توجد توصيات منشورة لجلسة" <<<"$js" \
              && grep -q "هذه ليست توصيات اليوم" <<<"$monitor" \
              && node -e 'const d=JSON.parse(process.argv[1]); if(d?.engine!=="TFE_V20_FUSION_RC2"||d?.universe?.sessionDate!=="2026-09-24"||!Array.isArray(d?.recommendations)) process.exit(1)' "$scan"; then
              echo "RC2_PRODUCTION_UI_VERIFIED"
              node -e 'const d=JSON.parse(process.argv[1]); console.log(JSON.stringify({session:d.universe?.sessionDate,scanned:d.summary?.scanned,publicationEligibleTotal:d.summary?.publicationEligibleTotal,returned:d.summary?.returned,tickers:d.recommendations?.map(x=>x.ticker)}))' "$scan"
              exit 0
            fi
            sleep 20
          done
          echo "Production verification failed"
          exit 1

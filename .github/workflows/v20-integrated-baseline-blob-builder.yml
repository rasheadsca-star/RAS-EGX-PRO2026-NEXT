name: V20 Integrated Baseline Blob Builder

on:
  push:
    branches: [develop/v20-integrated-decision-platform]
    paths:
      - ".github/workflows/v20-integrated-baseline-blob-builder.yml"

permissions:
  contents: write

jobs:
  build-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build exact repaired workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v20-integrated-decision-platform.yml')
          s = p.read_text()
          old = '0dbbe93ec228b62d3c510b1b57623c550f4eefef'
          new = 'e4a4fd1ba042e885afc614845a4be445adc316b9'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old baseline, found {s.count(old)}')
          out = s.replace(old, new)
          if out.count(new) != 1 or old in out:
              raise SystemExit('Replacement verification failed')
          p.write_text(out)
          PY
          git diff --check -- .github/workflows/v20-integrated-decision-platform.yml
          content_b64="$(base64 -w 0 .github/workflows/v20-integrated-decision-platform.yml)"
          jq -nc --arg content "$content_b64" '{content:$content,encoding:"base64"}' > /tmp/blob.json
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" \
            --data-binary @/tmp/blob.json > /tmp/response.json
          blob_sha="$(jq -r '.sha // empty' /tmp/response.json)"
          [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "MODIFIED_BLOB_SHA=$blob_sha"

# one-shot trigger

name: EGX V16 Whole Application Independent Review — 20 Cycles
run-name: Independent twenty-cycle review for ${{ github.sha }}

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 6"

permissions:
  contents: write

concurrency:
  group: egx-v16-independent-weekly-review
  cancel-in-progress: true

jobs:
  twenty-cycle-whole-app-review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate current review and product engines
        run: |
          set -euo pipefail
          node --check scripts/stable/v16-consulting-review.cjs
          node --check scripts/stable/v16-consulting-review-finalizer.cjs
          node --check scripts/stable/v16-whole-app-review-extension.cjs
          node --check scripts/stable/v16-review-integrity-fix.cjs
          node --check scripts/stable/v16-3-release-gate.cjs
          node --check preview-v16/app/v16-3.js

      - name: Execute independent twenty-cycle review
        env:
          REVIEW_FAIL_ON_BLOCKING: "0"
        run: |
          set -euo pipefail
          node scripts/stable/v16-consulting-review.cjs
          set +e
          node scripts/stable/v16-consulting-review-finalizer.cjs
          echo "Base finalizer exit code: $?"
          node scripts/stable/v16-whole-app-review-extension.cjs
          echo "Whole-application extension exit code: $?"
          node scripts/stable/v16-review-integrity-fix.cjs
          INTEGRITY_CODE=$?
          set -e
          [ "$INTEGRITY_CODE" -eq 0 ] || exit "$INTEGRITY_CODE"

      - name: Commit independent review evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/v16-consulting-review.json data/review/v16-consulting-review.md
          if ! git diff --cached --quiet; then
            git commit -m "Run independent EGX V16 twenty-cycle review"
            git pull --rebase -X ours origin main
            git push origin HEAD:main
          fi

      - name: Enforce independent receiver gate
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('data/review/v16-consulting-review.json','utf8'));
          if(report.scope?.type!=='WHOLE_APPLICATION') throw new Error('Review scope is not the whole application');
          if(report.cyclesCompleted!==20||report.acceptanceCriteria?.allTwentyCyclesExecuted!==true) throw new Error('Exactly twenty cycles were not executed');
          if(!report.acceptanceCriteria?.zeroCritical||!report.acceptanceCriteria?.zeroHigh) throw new Error('Independent receiver rejected the application');
          console.log({acceptance:report.acceptance,summary:report.summary});
          NODE

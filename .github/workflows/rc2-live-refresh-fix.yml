name: RC2 Live Refresh Fix

on:
  push:
    branches:
      - develop/rc2-intraday-operations-v1
    paths:
      - .github/workflows/rc2-live-refresh-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/rc2-intraday-operations-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add safe last-close fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tfe-v20/public/live-refresh-v1.js');s=p.read_text()
          if "const API='/api/index';" not in s:
              s=s.replace("const INTRADAY_API='/api/intraday';\n","const INTRADAY_API='/api/intraday';\nconst API='/api/index';\n",1)
          old="""async function quotesFor(tickers){
  const map=new Map(),errors=[];
  for(const group of chunks(tickers,10)){
    try{const d=await intradayBatch(group);for(const x of d.results||[])if(x?.ticker)map.set(String(x.ticker).toUpperCase(),x);for(const e of d.errors||[])errors.push(e)}catch(e){errors.push({error:e.message,tickers:group})}
  }
  return{map,errors};
}
"""
          new="""async function historyFallback(ticker){
  const q=new URLSearchParams({route:'history',ticker,limit:'3',t:String(Date.now())});
  const r=await fetch(`${API}?${q}`,{cache:'no-store'}),d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok)throw new Error(d.error||`HISTORY_HTTP_${r.status}`);
  const bar=Array.isArray(d.bars)?d.bars.at(-1):null;
  const price=n(bar?.close),date=bar?.date||d.lastSession||null;
  if(!(price>0)||!date)throw new Error('HISTORY_CLOSE_UNAVAILABLE');
  return{ticker,quote:{price,open:n(bar?.open),high:n(bar?.high),low:n(bar?.low),volume:n(bar?.volume),sourceSessionDate:date,sourceMarketTime:'14:30',sourceMarketMinutes:870,delayedMinutes:0,fetchedAt:new Date().toISOString(),source:'HISTORY_LAST_CLOSE'},fallback:'HISTORY_LAST_CLOSE'};
}
async function quotesFor(tickers){
  const map=new Map(),errors=[];
  for(const group of chunks(tickers,10)){
    try{const d=await intradayBatch(group);for(const x of d.results||[])if(x?.ticker)map.set(String(x.ticker).toUpperCase(),x)}catch{}
  }
  const missing=tickers.filter(t=>!map.has(t));
  const fallback=await Promise.all(missing.map(async ticker=>{try{return await historyFallback(ticker)}catch(e){errors.push({ticker,error:e.message});return null}}));
  for(const x of fallback)if(x?.ticker)map.set(x.ticker,x);
  return{map,errors};
}
"""
          assert old in s
          s=s.replace(old,new,1)
          old_render="price=['DELAYED_LIVE','LAGGING','CLOSED_SESSION'].includes(fresh.state)?n(r?.quote?.price):null"
          new_render="price=['DELAYED_LIVE','LAGGING','CLOSED_SESSION','PRE_OPEN_REFERENCE','MARKET_CLOSED'].includes(fresh.state)?n(r?.quote?.price):null"
          assert old_render in s
          s=s.replace(old_render,new_render,1)
          old_src="${esc(fresh.labelAr||'غير متاح')}<br>${esc(r?.quote?.sourceSessionDate||'—')} ${esc(r?.quote?.sourceMarketTime||'')}"
          new_src="${esc(r?.fallback==='HISTORY_LAST_CLOSE'?'آخر إغلاق متاح من History':fresh.labelAr||'غير متاح')}<br>${esc(r?.quote?.sourceSessionDate||'—')} ${esc(r?.quote?.sourceMarketTime||'')}"
          assert old_src in s
          s=s.replace(old_src,new_src,1)
          p.write_text(s)
          PY

      - name: Strengthen fallback tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tfe-v20/test/live-refresh.test.js');s=p.read_text()
          add="""
test('portfolio pricing falls back to explicit history close when intraday source is unavailable',()=>{assert.match(live,/async function historyFallback/);assert.match(live,/HISTORY_LAST_CLOSE/);assert.match(live,/route:'history'/);assert.match(live,/sourceMarketMinutes:870/)});
test('reference close is displayable before open or while market is closed but remains labeled as fallback',()=>{assert.match(live,/PRE_OPEN_REFERENCE/);assert.match(live,/MARKET_CLOSED/);assert.match(live,/آخر إغلاق متاح من History/)});
"""
          if 'portfolio pricing falls back' not in s:s+=add
          p.write_text(s)
          PY

      - name: Refresh live adapter hash in frozen contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          p=Path('tfe-v20/stability/frozen-runtime-contract.js');s=p.read_text()
          h=subprocess.check_output(['git','hash-object','tfe-v20/public/live-refresh-v1.js'],text=True).strip()
          s=re.sub(r"'public/live-refresh-v1\.js': '[0-9a-f]+'",f"'public/live-refresh-v1.js': '{h}'",s,count=1)
          if "portfolioPriceFallback:" not in s:
              s=s.replace("    quoteSource: 'INTRADAY_READ_ONLY_DELAYED',\n","    quoteSource: 'INTRADAY_READ_ONLY_DELAYED',\n    portfolioPriceFallback: 'READ_ONLY_HISTORY_LAST_CLOSE_EXPLICITLY_LABELED',\n",1)
          p.write_text(s);print('LIVE_BLOB',h)
          PY

      - name: Prove frozen core is untouched
        shell: bash
        run: |
          test "$(git hash-object tfe-v20/src/engine.js)" = "36e1309fa1e5e4640dd7ef62b7b532e459103193"
          test "$(git hash-object tfe-v20/src/policy.js)" = "581c72df397e6f66adf7720aa7420e191b110999"
          test "$(git hash-object tfe-v20/src/repository.js)" = "9f20380d58fcb3ed37b6c9ed88ebf827ee773e5d"
          test "$(git hash-object tfe-v20/api/index.js)" = "0abac132c2dc3a6d8f40c086082d6b8ea62b2e6b"
          test "$(git hash-object tfe-v20/api/intraday.js)" = "7e639a980d8531f4737c5d5ad9485f8a63540e4b"

      - name: Full validation
        working-directory: tfe-v20
        run: |
          node --check public/live-refresh-v1.js
          node --check stability/frozen-runtime-contract.js
          npm test
          npm run red-team
          node --test test/live-refresh.test.js test/stability-contract.test.js

      - name: Commit validated fallback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tfe-v20/public/live-refresh-v1.js tfe-v20/test/live-refresh.test.js tfe-v20/stability/frozen-runtime-contract.js
          git commit -m "fix: fallback portfolio pricing to latest completed close"
          git push origin HEAD:develop/rc2-intraday-operations-v1

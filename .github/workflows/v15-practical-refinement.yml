name: V15 Practical Refinement

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/v15-practical-refinement.yml"

permissions:
  contents: write

concurrency:
  group: v15-practical-refinement
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply robust selection and overextension filter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/stable/v15-practical-market-scanner.cjs')
          s=p.read_text()
          old="""const modelResults=MODELS.map(model=>{const dev=evaluateModel(store,model,development),val=evaluateModel(store,model,validation),testResult=evaluateModel(store,model,test);return {id:model.id,labelAr:model.labelAr,profile:model.profile,development:dev.metrics,validation:val.metrics,test:testResult.metrics,validationPassed:passValidation(val.metrics),testPassed:passValidation(testResult.metrics),selectionScore:round(rankValidation(val.metrics),2)};}).sort((a,b)=>b.selectionScore-a.selectionScore);
  const selected=modelResults.find(x=>x.validationPassed&&x.testPassed)||null;
  const latestDate=store.dates.at(-1);const latestRows=selected?candidateRows(store,MODELS.find(m=>m.id===selected.id),latestDate):[];
  const recommendations=[];if(selected){const model=MODELS.find(m=>m.id===selected.id),p=PROFILES[model.profile];for(const [i,f] of latestRows.entries()){const stop=f.close-f.a14*p.stopAtr,target=f.close+f.a14*p.targetAtr;recommendations.push({rank:i+1,ticker:f.ticker,companyNameAr:f.companyNameAr,strategyId:model.id,strategyLabelAr:model.labelAr,score:round(model.score(f),2),close:round(f.close,4),entryLow:round(f.close-f.a14*.15,4),entryHigh:round(f.close+f.a14*.15,4),stopLoss:round(stop,4),target1:round(target,4),riskReward:round((target-f.close)/(f.close-stop),2),holdingSessions:p.maxHold,ret5Pct:round(f.ret5,2),ret20Pct:round(f.ret20,2),relativeStrength20Pct:round(f.rs20,2),volumeRatio20:round(f.vr,2),rsi14:round(f.r14,1),averageTurnover20Egp:round(f.turnover,0),status:'PRACTICAL_CANDIDATE_PENDING_PRICE_CONFIRMATION',statusAr:'فرصة عملية مشروطة بتأكيد سعر الافتتاح وعدم حدوث فجوة'});}}
"""
          new="""const modelResults=MODELS.map(model=>{const dev=evaluateModel(store,model,development),val=evaluateModel(store,model,validation),testResult=evaluateModel(store,model,test);const valEdge=n(val.metrics.targetRatePct,0)-n(val.metrics.stopRatePct,100),testEdge=n(testResult.metrics.targetRatePct,0)-n(testResult.metrics.stopRatePct,100);const robustScore=Math.min(n(val.metrics.averageReturnPct,-99),n(testResult.metrics.averageReturnPct,-99))*10+Math.min(n(val.metrics.profitFactor,0),n(testResult.metrics.profitFactor,0))*4+Math.min(n(val.metrics.winRatePct,0),n(testResult.metrics.winRatePct,0))*.06+Math.min(valEdge,testEdge)*.12;return {id:model.id,labelAr:model.labelAr,profile:model.profile,development:dev.metrics,validation:val.metrics,test:testResult.metrics,validationPassed:passValidation(val.metrics),testPassed:passValidation(testResult.metrics),selectionScore:round(robustScore,2)};}).sort((a,b)=>b.selectionScore-a.selectionScore);
  const selected=modelResults.find(x=>x.validationPassed&&x.testPassed)||null;
  const latestDate=store.dates.at(-1);const selectedDefinition=selected?MODELS.find(m=>m.id===selected.id):null;
  const latestPool=selectedDefinition?(store.byDate.get(latestDate)||[]).filter(selectedDefinition.eligible).sort((a,b)=>selectedDefinition.score(b)-selectedDefinition.score(a)).slice(0,15):[];
  const isOverextended=f=>f.r14>78||f.ret20>60||f.breakoutPct>12;
  const actionableRows=latestPool.filter(f=>!isOverextended(f)).slice(0,5);
  const extendedMomentumWatch=latestPool.filter(isOverextended).slice(0,5).map((f,i)=>({rank:i+1,ticker:f.ticker,companyNameAr:f.companyNameAr,close:round(f.close,4),ret5Pct:round(f.ret5,2),ret20Pct:round(f.ret20,2),volumeRatio20:round(f.vr,2),rsi14:round(f.r14,1),reasonAr:'السهم قوي لكنه ممتد سعريًا؛ الانتظار لإعادة اختبار أو تهدئة أفضل من المطاردة'}));
  const recommendations=[];if(selected){const model=selectedDefinition,p=PROFILES[model.profile];for(const [i,f] of actionableRows.entries()){const stop=f.close-f.a14*p.stopAtr,target=f.close+f.a14*p.targetAtr;recommendations.push({rank:i+1,ticker:f.ticker,companyNameAr:f.companyNameAr,strategyId:model.id,strategyLabelAr:model.labelAr,score:round(model.score(f),2),close:round(f.close,4),entryLow:round(f.close-f.a14*.15,4),entryHigh:round(f.close+f.a14*.15,4),stopLoss:round(stop,4),target1:round(target,4),riskReward:round((target-f.close)/(f.close-stop),2),holdingSessions:p.maxHold,estimatedTargetProbabilityPct:selected.test.targetRatePct,estimatedStopProbabilityPct:selected.test.stopRatePct,estimatedWinRatePct:selected.test.winRatePct,outOfSampleAverageReturnPct:selected.test.averageReturnPct,outOfSampleProfitFactor:selected.test.profitFactor,ret5Pct:round(f.ret5,2),ret20Pct:round(f.ret20,2),relativeStrength20Pct:round(f.rs20,2),volumeRatio20:round(f.vr,2),rsi14:round(f.r14,1),averageTurnover20Egp:round(f.turnover,0),status:'PRACTICAL_CANDIDATE_PENDING_PRICE_CONFIRMATION',statusAr:'فرصة عملية مشروطة بتأكيد سعر الافتتاح وعدم حدوث فجوة'});}}
"""
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new)
          s=s.replace("selectedModel:selected,recommendations,marketScan:","selectedModel:selected,recommendations,extendedMomentumWatch,marketScan:")
          p.write_text(s)
          PY

      - name: Run refined engine
        run: |
          set -euo pipefail
          node --check scripts/stable/v15-practical-market-scanner.cjs
          node scripts/stable/v15-practical-market-scanner.cjs
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/stable/v15-practical-decision.json','utf8'));
          const v=JSON.parse(fs.readFileSync('data/research/v15-practical-validation.json','utf8'));
          const selected=v.models.find(x=>x.id===v.selection);
          if(d.practicalReady){
            if(!selected?.validationPassed||!selected?.testPassed) throw new Error('model gate failed');
            if(!(selected.test.targetRatePct>selected.test.stopRatePct)) throw new Error('target rate not above stop rate');
            for(const r of d.recommendations){
              if(!(r.estimatedTargetProbabilityPct>r.estimatedStopProbabilityPct)) throw new Error(`${r.ticker}: target probability not above stop`);
              if(r.rsi14>78||r.ret20Pct>60) throw new Error(`${r.ticker}: overextended candidate leaked into actionable list`);
            }
          }
          console.log({selected:v.selection,test:selected?.test,recommendations:d.recommendations,extended:d.extendedMomentumWatch});
          NODE

      - name: Commit refinement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stable/v15-practical-market-scanner.cjs data/stable/v15-practical-decision.json data/research/v15-practical-validation.json data/research/v15-missed-opportunities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine V15 robust practical selection"
          for attempt in 1 2 3; do
            if git pull --rebase -X ours origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*15))
          done
          exit 1
